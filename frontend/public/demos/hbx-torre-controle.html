<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HBX Torre de Controle — a cena do gestor</title>
<style>
/* =============================================================================
   HBX TORRE DE CONTROLE (17/08/2026)

   A CENA (encomenda do dono, nascida da conversa com a gerente da Unatimo):
   o gestor olha o mapa da cidade de cima. Dois caminhões em rota. Um deles
   SAI do trajeto planejado, PARA num posto fora de ponto de entrega, e a
   torre acusa sozinha — com referência humana ("0,11 km de POSTO ESTRELA"),
   código da viagem e ignição, a linguagem que gerenciadora de risco fala.

   REGRAS DA PEÇA:
   - Mesma família visual do mock do Prospector (tokens copiados de lá, escuro
     e claro): as duas vitrines são o MESMO produto, não podem parecer duas
     empresas diferentes.
   - Formato PAISAGEM (760x484): torre é tela de COMPUTADOR do gestor — o
     berço do /rota troca de proporção quando esta aba entra.
   - Verde e vermelho só significam UMA coisa: verde = concluído/planejado,
     vermelho = fora do combinado. O caminhão normal é AZUL.
   - Nada aqui é vídeo: é uma cena de ~22 s em rAF + relógios, em loop, igual
     ao padrão do hbx-gps-prospector.html (ficha/limpar/daqui).
   ========================================================================== */

.app{
  --bg:#080d17; --card:#0d1626; --line:#1a2740; --line-2:#26375a;
  --ink:#eef3fb; --ink-2:#93a3bf; --ink-3:#7889a6;
  --lime:#9ede2a; --blue:#2f7ef7; --blue-l:#5b9dff;
  --glass:#0b1322e6;
  --sombra-carta:0 12px 30px rgba(0,0,0,.5);

  --map-fundo:#080e1a; --map-quadra:#131f34; --map-lote:#18263e;
  --map-rua:#2c3d5c; --map-rua2:#22314c;
  --map-parque:#101f18; --map-agua:#0d2740; --map-rotulo:#67789a;
  --map-rota:#9ede2a; --map-rota-borda:#3f7a10;

  --ok:#9ede2a; --ok-bg:#17230e; --ok-fio:rgba(158,222,42,.4);
  --aviso:#f2b63d; --aviso-bg:#241a09; --aviso-fio:rgba(242,182,61,.42);
  --alerta:#ff6d5e; --alerta-bg:#2a120e; --alerta-fio:rgba(255,109,94,.5);
  --alerta-anel:rgba(255,109,94,.55);

  --puck:#2f7ef7; --puck-fio:#bcd6ff; --puck-anel:rgba(95,157,255,.5);
  --desvio:#ff6d5e;

  --cv-entra:cubic-bezier(.2,.8,.2,1); --cv-mola:cubic-bezier(.34,1.4,.5,1);
}

/* MODO CLARO — desenho próprio, não inversão (mesma lei do mock do GPS). */
.app.claro{
  --bg:#eef2f7; --card:#ffffff; --line:#dbe3ed; --line-2:#c6d2e0;
  --ink:#0d1726; --ink-2:#5b6b83; --ink-3:#7386a0;
  --lime:#4f9310; --blue:#1f66e0; --blue-l:#2f7ef7;
  --glass:#ffffffee;
  --sombra-carta:0 10px 28px rgba(28,44,70,.14);

  --map-fundo:#e2e8f0; --map-quadra:#f2f5f8; --map-lote:#e8edf3;
  --map-rua:#ffffff; --map-rua2:#fbfcfe;
  --map-parque:#d8e6da; --map-agua:#c7e2f2; --map-rotulo:#8494a9;
  --map-rota:#5aa515; --map-rota-borda:#3a6f08;

  --ok:#4f9310; --ok-bg:#e9f6d5; --ok-fio:rgba(79,147,16,.4);
  --aviso:#a2700a; --aviso-bg:#fdf3dc; --aviso-fio:rgba(162,112,10,.4);
  --alerta:#d43a2a; --alerta-bg:#fdeeec; --alerta-fio:rgba(212,58,42,.42);
  --alerta-anel:rgba(212,58,42,.4);

  --puck:#1f66e0; --puck-fio:#ffffff; --puck-anel:rgba(31,102,224,.4);
  --desvio:#d43a2a;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:transparent;overflow:hidden;display:grid;place-items:center;
  font-family:"Segoe UI Variable Display","Segoe UI",Inter,ui-sans-serif,system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased}

/* O palco escala pra caber no iframe — o berço do /rota tem a MESMA razão
   (760/484), então o encaixe sai sem letterbox. */
.mesa{width:760px;height:484px;transform:scale(var(--fit,1));transform-origin:center}
.app{position:relative;width:760px;height:484px;overflow:hidden;border-radius:18px;
  background:var(--bg);color:var(--ink);font-size:13px;isolation:isolate}

/* ------------------------------------------------------------------ MAPA -- */
.mapa{position:absolute;inset:0}
.mapa svg{width:100%;height:100%;display:block}

/* A rota planejada respira de leve: é a peça VIVA do fundo — sem isso a
   torre parece um print. Só opacidade, nada de mexer em geometria. */
.fita-rota{animation:rotaRespira 3.6s ease-in-out infinite}
@keyframes rotaRespira{0%,100%{opacity:.92}50%{opacity:.72}}

/* O rastro do desvio se DESENHA quando o caminhão sai da linha (dashoffset). */
.desvio-trilha{stroke-dasharray:7 6;stroke-dashoffset:var(--desvio-comp,180);opacity:0;
  transition:opacity .3s ease}
.desvio-trilha.on{opacity:1;animation:desvioAnda 1.6s linear forwards}
@keyframes desvioAnda{to{stroke-dashoffset:0}}

/* ---------------------------------------------------------------- PARADAS -- */
.parada{position:absolute;left:0;top:0;width:0;height:0;z-index:6}
.parada i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;
  display:grid;place-items:center;font-style:normal;font-size:9.5px;font-weight:700;
  background:var(--card);border:1.4px solid var(--line-2);color:var(--ink-2);
  transition:background .3s ease,border-color .3s ease,color .3s ease}
.parada.feita i{background:var(--ok-bg);border-color:var(--ok-fio);color:var(--ok)}
.parada.feita i{animation:paradaPop .5s var(--cv-mola)}
@keyframes paradaPop{0%{transform:scale(1)}45%{transform:scale(1.45)}100%{transform:scale(1)}}

/* ------------------------------------------------------------------ PUCKS -- */
.puck{position:absolute;left:0;top:0;width:0;height:0;z-index:8;
  transform:translate(var(--px,0),var(--py,0))}
.puck .corpo{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;
  background:var(--puck);border:2px solid var(--puck-fio);
  box-shadow:0 3px 10px rgba(0,0,0,.45);display:grid;place-items:center;
  transition:background .4s ease}
.app.claro .puck .corpo{box-shadow:0 3px 9px rgba(28,44,70,.3)}
.puck .corpo svg{width:12px;height:12px;display:block;transform:rotate(var(--rumo,0deg))}
.puck .corpo path{fill:#fff}
.app.claro .puck .corpo path{fill:#fff}

/* Parado em alerta: o corpo veste o vermelho e o chão pulsa em anel. */
.puck.alerta .corpo{background:var(--alerta)}
.puck .anel{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;
  border:1.6px solid var(--alerta-anel);opacity:0;pointer-events:none}
.puck.alerta .anel{animation:anelPulsa 1.6s ease-out infinite}
@keyframes anelPulsa{0%{opacity:.9;transform:scale(.35)}70%{opacity:0;transform:scale(1)}100%{opacity:0}}

/* O relógio de parada nasce em cima do caminhão parado. */
.chip-parado{position:absolute;left:0;top:0;z-index:9;transform:translate(var(--px),var(--py)) translate(-50%,-210%);
  padding:3px 9px;border-radius:999px;background:var(--alerta-bg);border:1px solid var(--alerta-fio);
  color:var(--alerta);font-size:10.5px;font-weight:700;white-space:nowrap;opacity:0;
  transition:opacity .35s ease}
.chip-parado.on{opacity:1}

/* ------------------------------------------------------------ POI (posto) -- */
.poi{position:absolute;left:0;top:0;width:0;height:0;z-index:5}
.poi .caixa{position:absolute;left:-8px;top:-24px;display:flex;align-items:center;gap:4px;
  color:var(--map-rotulo);font-size:9px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
.poi svg{width:11px;height:11px}
.poi path{fill:var(--map-rotulo)}

/* ---------------------------------------------------------------- CROMO --- */
.topo{position:absolute;left:12px;top:12px;z-index:20;display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:12px;background:var(--glass);border:.8px solid var(--line);
  backdrop-filter:blur(14px);box-shadow:var(--sombra-carta)}
.topo .titulo{font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase}
.topo .relogio{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.topo .divisor{width:1px;height:14px;background:var(--line-2)}
.topo .frota{display:flex;gap:5px}
.topo .fita{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:600;
  border:.8px solid var(--line);background:var(--card);color:var(--ink-2);white-space:nowrap}
.topo .fita b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ------------------------------------------------------- FEED DE EVENTOS -- */
.feed{position:absolute;right:12px;top:12px;z-index:22;width:252px;display:flex;
  flex-direction:column;gap:7px}
.evento{padding:9px 11px;border-radius:12px;background:var(--glass);border:.8px solid var(--line);
  backdrop-filter:blur(14px);box-shadow:var(--sombra-carta);
  transform:translateX(272px);opacity:0}
.evento.on{animation:eventoEntra .55s var(--cv-entra) forwards}
@keyframes eventoEntra{to{transform:translateX(0);opacity:1}}
.evento .linha1{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.evento .ponto{width:7px;height:7px;border-radius:50%;flex:none}
.evento.ok .ponto{background:var(--ok)}
.evento.aviso .ponto{background:var(--aviso)}
.evento.alerta .ponto{background:var(--alerta);animation:pontoPisca 1.1s ease-in-out infinite}
@keyframes pontoPisca{0%,100%{box-shadow:0 0 0 0 var(--alerta-anel)}55%{box-shadow:0 0 0 5px transparent}}
.evento .texto{margin-top:3px;font-size:11.5px;font-weight:600;line-height:1.32}
.evento .texto small{display:block;margin-top:1px;font-size:10.5px;font-weight:500;color:var(--ink-2)}
.evento.alerta{border-color:var(--alerta-fio);background:linear-gradient(180deg,var(--alerta-bg),var(--card))}
.evento.alerta .texto{color:var(--alerta)}
.evento.alerta .texto small{color:var(--ink-2)}
.evento .acoes{display:flex;gap:6px;margin-top:7px}
.evento .acoes button{flex:1;min-height:24px;border-radius:8px;border:.8px solid var(--line-2);
  background:var(--card);color:var(--ink);font-size:10.5px;font-weight:700;cursor:default;
  font-family:inherit}
.evento .acoes .liga{background:var(--alerta);border-color:transparent;color:#fff}

/* --------------------------------------------------- CARTÃO DE POSIÇÃO ---- */
/* A homenagem consciente ao popup de GR de verdade: veículo, código da
   viagem, velocidade, ignição e a REFERÊNCIA humana. É o cartão que faz
   transportador reconhecer a própria língua. */
.posicao{position:absolute;left:12px;bottom:12px;z-index:22;width:238px;
  padding:11px 13px;border-radius:14px;background:var(--glass);border:.8px solid var(--line);
  backdrop-filter:blur(14px);box-shadow:var(--sombra-carta)}
.posicao .cabeca{display:flex;align-items:center;justify-content:space-between;gap:8px}
.posicao .placa{font-size:13.5px;font-weight:800;letter-spacing:.8px;font-variant-numeric:tabular-nums}
.posicao .viagem{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.posicao .grade{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-top:8px}
.posicao .dado small{display:block;font-size:9px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--ink-3)}
.posicao .dado b{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.posicao .dado b.on{color:var(--ok)}
.posicao .dado b.mal{color:var(--alerta)}
.posicao .ref{margin-top:8px;padding-top:8px;border-top:.8px solid var(--line);
  font-size:10.5px;color:var(--ink-2);line-height:1.35}
.posicao .ref b{color:var(--ink)}
.posicao .agora{margin-top:4px;font-size:9.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* selo discreto de produto, canto de baixo — a vitrine assina, não grita */
.selo{position:absolute;right:12px;bottom:12px;z-index:20;padding:4px 9px;border-radius:999px;
  background:var(--glass);border:.8px solid var(--line);color:var(--ink-3);
  font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}

@media (prefers-reduced-motion:reduce){
  .fita-rota,.puck.alerta .anel,.evento.alerta .ponto{animation:none}
}
</style>
</head>
<body>
<div class="mesa">
  <div class="app" id="app">

    <div class="mapa" aria-hidden="true">
      <svg viewBox="0 0 760 484" id="cidade"></svg>
    </div>

    <!-- paradas numeradas, pucks e o posto nascem por JS em cima do mapa -->
    <div id="pecas"></div>

    <div class="topo">
      <span class="titulo">Torre de controle</span>
      <span class="divisor"></span>
      <span class="relogio" id="relogio">--:--</span>
      <span class="divisor"></span>
      <span class="frota">
        <span class="fita"><b>2</b> em rota</span>
        <span class="fita"><b id="feitas">6</b>/23 entregas</span>
      </span>
    </div>

    <div class="feed" id="feed"></div>

    <div class="posicao" id="posicao">
      <div class="cabeca">
        <span class="placa">FLV3B58</span>
        <span class="viagem">Viagem 9456210</span>
      </div>
      <div class="grade">
        <span class="dado"><small>Velocidade</small><b id="vel">32 km/h</b></span>
        <span class="dado"><small>Ignição</small><b class="on" id="ign">LIGADA</b></span>
        <span class="dado"><small>Motorista</small><b>Carlos</b></span>
        <span class="dado"><small>Situação</small><b id="sit">Em trajeto</b></span>
      </div>
      <div class="ref" id="ref">Av. Campos Sales — Campinas/SP</div>
      <div class="agora" id="agora">posição de agora</div>
    </div>

    <span class="selo">HBX Logística</span>
  </div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);

/* ------------------------------------------------------------ O MUNDO ----- */
/* Malha em px do próprio palco (760x484). Quadra, rua, rota e desvio saem
   das MESMAS tabelas — rota nunca corta quadra (lei herdada do mock do GPS). */
const RUAS_V=[70,180,290,400,510,620,700];
const RUAS_H=[60,140,220,300,380,450];
const AV_H=220, AV_V=400;                 /* avenidas (mais largas) */

/* rota planejada do FLV3B58 (a fita verde) */
const ROTA=[[40,450],[180,450],[180,300],[400,300],[400,140],[620,140],[620,60],[700,60]];
/* trajeto que ele REALMENTE faz: segue a rota até a avenida e vira pro posto */
const REAL=[[40,450],[180,450],[180,300],[400,300],[400,220],[560,220]];
/* volta do segundo caminhão (vida ambiente, nunca dá problema) */
const VOLTA2=[[620,380],[700,380],[700,450],[510,450],[510,380],[620,380]];

const PARADAS=[[120,450],[180,370],[300,300],[400,170],[540,140],[620,90]];
const POSTO=[560,220];

function polilinha(p){return p.map((q,i)=>(i?"L":"M")+q[0]+" "+q[1]).join(" ")}
function comprimento(p){let t=0;for(let i=1;i<p.length;i++)t+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return t}
function emS(p,s){ /* ponto + rumo na distância s da polilinha */
  let resto=s;
  for(let i=1;i<p.length;i++){
    const dx=p[i][0]-p[i-1][0],dy=p[i][1]-p[i-1][1],d=Math.hypot(dx,dy);
    if(resto<=d||i===p.length-1){
      const f=Math.max(0,Math.min(1,resto/d));
      return {x:p[i-1][0]+dx*f,y:p[i-1][1]+dy*f,h:Math.atan2(dy,dx)*180/Math.PI+90};
    }
    resto-=d;
  }
  const u=p[p.length-1];return {x:u[0],y:u[1],h:0};
}

function montarCidade(){
  const P=[];
  P.push(`<rect x="0" y="0" width="760" height="484" fill="var(--map-fundo)"/>`);
  /* quadras: o vão entre ruas vizinhas, com respiro de 7px */
  const vs=[0,...RUAS_V,760], hs=[0,...RUAS_H,484];
  for(let i=0;i<vs.length-1;i++)for(let j=0;j<hs.length-1;j++){
    const x=vs[i]+7,y=hs[j]+7,w=vs[i+1]-vs[i]-14,h=hs[j+1]-hs[j]-14;
    if(w<16||h<16)continue;
    P.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="var(--map-quadra)"/>`);
  }
  /* texturas de cidade: um parque e um espelho d'água, sem disputar cor */
  P.push(`<rect x="77" y="67" width="96" height="66" rx="5" fill="var(--map-parque)"/>`);
  P.push(`<rect x="627" y="307" width="66" height="66" rx="5" fill="var(--map-agua)"/>`);
  /* ruas */
  for(const x of RUAS_V)P.push(`<line x1="${x}" y1="0" x2="${x}" y2="484" stroke="var(--map-rua2)" stroke-width="${x===AV_V?14:8}"/>`);
  for(const y of RUAS_H)P.push(`<line x1="0" y1="${y}" x2="760" y2="${y}" stroke="var(--map-rua)" stroke-width="${y===AV_H?14:8}"/>`);
  /* nomes de rua — referência humana é o idioma da torre */
  P.push(`<text x="204" y="216" fill="var(--map-rotulo)" font-size="9" font-weight="600" letter-spacing="1.4">AV. CAMPOS SALES</text>`);
  P.push(`<text x="408" y="472" fill="var(--map-rotulo)" font-size="9" font-weight="600" letter-spacing="1.4" transform="rotate(-90 408 472)" text-anchor="start"> </text>`);
  P.push(`<text x="392" y="130" fill="var(--map-rotulo)" font-size="9" font-weight="600" letter-spacing="1.2" transform="rotate(-90 392 130)" text-anchor="end">R. BARÃO DE ITAPURA</text>`);
  P.push(`<text x="52" y="437" fill="var(--map-rotulo)" font-size="9" font-weight="600" letter-spacing="1.4">R. DAS ACÁCIAS</text>`);
  /* a fita da rota planejada (verde, com borda, igual ao app) */
  P.push(`<g class="fita-rota"><path d="${polilinha(ROTA)}" fill="none" stroke="var(--map-rota-borda)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="${polilinha(ROTA)}" fill="none" stroke="var(--map-rota)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></g>`);
  /* o rastro do desvio (vermelho tracejado) — nasce apagado */
  const desvio=[[400,220],[560,220]];
  P.push(`<path id="trilhaDesvio" class="desvio-trilha" d="${polilinha(desvio)}" fill="none" stroke="var(--desvio)" stroke-width="3.4" stroke-linecap="round" style="--desvio-comp:${Math.ceil(comprimento(desvio))}"/>`);
  $('#cidade').innerHTML=P.join("");
}

function montarPecas(){
  const P=[];
  PARADAS.forEach((p,i)=>{P.push(`<span class="parada" id="par${i}" style="transform:translate(${p[0]}px,${p[1]}px)"><i>${i+1}</i></span>`)});
  P.push(`<span class="poi" style="transform:translate(${POSTO[0]}px,${POSTO[1]}px)"><span class="caixa"><svg viewBox="0 0 24 24"><path d="M4 3h9a1 1 0 0 1 1 1v16H3V4a1 1 0 0 1 1-1Zm2 3v4h5V6H6Zm12 4 2.2 2.2c.5.5.8 1.2.8 1.9V19a2 2 0 1 1-4 0v-4h-2v-2h2V8h1v2ZM5 21h7v-2H5v2Z"/></svg>POSTO ESTRELA</span></span>`);
  const seta='<svg viewBox="0 0 24 24"><path d="M12 3.2 18.4 20 12 16.6 5.6 20 12 3.2Z"/></svg>';
  P.push(`<span class="puck" id="p1"><span class="anel"></span><span class="corpo">${seta}</span></span>`);
  P.push(`<span class="puck" id="p2"><span class="corpo">${seta}</span></span>`);
  P.push(`<span class="chip-parado" id="chipParado">parado há <b>2 min</b></span>`);
  $('#pecas').innerHTML=P.join("");
}

/* --------------------------------------------------------- A CENA ---------- */
let relogios=[],raf=0,ficha=0;
const daqui=(fn,ms)=>relogios.push(setTimeout(fn,ms));
function limpar(){relogios.forEach(clearTimeout);relogios=[];if(raf)cancelAnimationFrame(raf);raf=0;ficha++}

const REAL_TOT=comprimento(REAL);
const V2_TOT=comprimento(VOLTA2);
/* o FLV3B58 anda os 660px de trajeto em 8,2s e para no posto */
const DUR_ANDA=8200;

const HORA=d=>d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

function poePuck(el,p){
  el.style.setProperty('--px',p.x+'px');
  el.style.setProperty('--py',p.y+'px');
  el.querySelector('.corpo svg').style.setProperty('--rumo',p.h+'deg');
}

function evento(cls,hora,html,acoes){
  const e=document.createElement('div');
  e.className='evento '+cls;
  e.innerHTML=`<span class="linha1"><span class="ponto"></span>${hora}</span>
    <div class="texto">${html}</div>${acoes?'<div class="acoes">'+acoes+'</div>':''}`;
  const feed=$('#feed');
  feed.prepend(e);
  requestAnimationFrame(()=>e.classList.add('on'));
  while(feed.children.length>3)feed.lastElementChild.remove();
}

function zerar(){
  $('#feed').innerHTML='';
  $('#feitas').textContent='6';
  $('#trilhaDesvio').classList.remove('on');
  $('#chipParado').classList.remove('on');
  $('#p1').classList.remove('alerta');
  document.querySelectorAll('.parada').forEach((p,i)=>p.classList.toggle('feita',i<2));
  $('#vel').textContent='32 km/h';
  $('#sit').textContent='Em trajeto';$('#sit').className='';
  $('#ref').innerHTML='Av. Campos Sales — Campinas/SP';
  poePuck($('#p1'),emS(REAL,0));
}

function iniciar(){
  limpar();zerar();
  const meu=ficha,t0=performance.now(),agora=new Date();
  const h=m=>HORA(new Date(agora.getTime()-m*60000));

  /* trilha sonora dos acontecimentos */
  daqui(()=>evento('ok',h(4),'Entrega 2 concluída<small>comprovante com foto e assinatura</small>'),900);
  daqui(()=>{ $('#par2').classList.add('feita');$('#feitas').textContent='7';
    evento('ok',h(2),'Entrega 3 concluída<small>comprovante com foto e assinatura</small>');},3300);
  daqui(()=>{ $('#trilhaDesvio').classList.add('on');
    evento('aviso',h(0),'FLV3B58 saiu do trajeto planejado<small>Av. Campos Sales, sentido leste</small>');},5600);
  daqui(()=>{ $('#sit').textContent='Fora do trajeto';$('#sit').className='mal'; },5600);
  daqui(()=>{ $('#chipParado').classList.add('on'); },8600);
  daqui(()=>{ $('#p1').classList.add('alerta');
    $('#sit').textContent='Parada não prevista';$('#sit').className='mal';
    $('#ref').innerHTML='<b>0,11 km de POSTO ESTRELA</b> — Campinas/SP';
    evento('alerta',h(0),'Parada não prevista<small>12 min parado fora de ponto de entrega · 0,11 km de POSTO ESTRELA</small>',
      '<button class="liga" type="button">Ligar para o condutor</button><button type="button">Autorizar</button>');},11600);
  daqui(()=>{if(meu===ficha)iniciar()},21500);

  /* o relógio de parada conta — encenação acelerada de 2 até 12 min */
  const chipB=$('#chipParado').querySelector('b');
  let minutos=2;
  const conta=()=>{if(meu!==ficha)return;
    chipB.textContent=Math.min(12,minutos)+' min';
    if(minutos<12){minutos+=2;relogios.push(setTimeout(conta,620))}};
  daqui(conta,8600);

  /* movimento contínuo dos dois caminhões */
  (function quadro(t){
    if(meu!==ficha)return;
    const dt=t-t0;
    /* FLV3B58: eases até o posto e fica */
    const u=Math.min(1,dt/DUR_ANDA), f=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    poePuck($('#p1'),emS(REAL,REAL_TOT*f));
    const chip=$('#chipParado'),p1=emS(REAL,REAL_TOT*f);
    chip.style.setProperty('--px',p1.x+'px');chip.style.setProperty('--py',p1.y+'px');
    /* velocidade encenada: cruzeiro, desacelera chegando no posto, zera */
    const vAlvo=u>=1?0:Math.max(4,34*(1-Math.pow(u,3)));
    if(dt%120<20)$('#vel').textContent=Math.round(vAlvo)+' km/h';
    if(u>=1)$('#vel').textContent='0 km/h';
    /* referência acompanha o trecho */
    if(u<.62&&dt>400)$('#ref').innerHTML='R. das Acácias — Campinas/SP';
    if(u>=.62&&u<1)$('#ref').innerHTML='Av. Campos Sales — Campinas/SP';
    /* caminhão 2: vida ambiente em loop */
    poePuck($('#p2'),emS(VOLTA2,(dt*0.052)%V2_TOT));
    /* carimbo de frescor da posição */
    $('#agora').textContent='posição de agora · há '+Math.max(1,Math.round((dt%4000)/1000))+' s';
    raf=requestAnimationFrame(quadro);
  })(t0);
}

/* ----------------------------------------------------------- MESA ---------- */
function caber(){
  const f=Math.min(innerWidth/760,innerHeight/484);
  document.querySelector('.mesa').style.setProperty('--fit',f.toFixed(4));
}
addEventListener('resize',caber);

const tick=()=>$('#relogio').textContent=HORA(new Date());
setInterval(tick,30000);

const luz=new URLSearchParams(location.search).get('luz');
if(luz==='claro')$('#app').classList.add('claro');

montarCidade();montarPecas();tick();caber();
daqui(iniciar,300);
</script>
