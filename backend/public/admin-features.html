<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin - Plan Features</title>
  <style>body{font-family:Arial;padding:20px} table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px}th{background:#f4f4f4}</style>
</head>
<body>
  <h1>Plans & Features (Admin)</h1>
  <div id="status"></div>
  <div id="plans"></div>

  <script>
    const API = 'http://localhost:3000';
    const token = prompt('Admin JWT token (leave blank to test read-only):');

    function authHeaders() {
      return token ? { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
    }

    async function load() {
      document.getElementById('status').innerText = 'Loading...';
      const res = await fetch(API + '/plans/features', { headers: authHeaders() });
      if (!res.ok) { document.getElementById('status').innerText = 'Failed to load plans/features: ' + res.status; return; }
      const data = await res.json();
      render(data);
      document.getElementById('status').innerText = '';
    }

    function render(plans) {
      const root = document.getElementById('plans');
      root.innerHTML = '';
      plans.forEach(p => {
        const box = document.createElement('div');
        box.style.border='1px solid #ccc'; box.style.padding='8px'; box.style.margin='8px 0';
        const h = document.createElement('h3'); h.innerText = `${p.name} (id:${p.id})`; box.appendChild(h);
        const tbl = document.createElement('table');
        const thead = document.createElement('tr'); thead.innerHTML='<th>id</th><th>key</th><th>description</th><th>actions</th>'; tbl.appendChild(thead);
        (p.features||[]).forEach(f=>{
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${f.id}</td><td>${f.key}</td><td>${f.description||''}</td><td></td>`;
          const actions = tr.querySelector('td:last-child');
          const btnDel = document.createElement('button'); btnDel.innerText='Disconnect'; btnDel.onclick = ()=>disconnectFeature(p.id,f.id);
          const btnEdit = document.createElement('button'); btnEdit.innerText='Edit'; btnEdit.onclick = ()=>editFeature(f.id,f.key,f.description);
          const btnDelGlobal = document.createElement('button'); btnDelGlobal.innerText='Delete global'; btnDelGlobal.onclick = ()=>deleteFeatureGlobal(f.id);
          actions.appendChild(btnDel); actions.appendChild(btnEdit); actions.appendChild(btnDelGlobal);
          tbl.appendChild(tr);
        });
        box.appendChild(tbl);
        const addBox = document.createElement('div'); addBox.style.marginTop='8px';
        addBox.innerHTML = `<input placeholder="feature key" id="new_key_${p.id}" /> <input placeholder="description" id="new_desc_${p.id}" /> <button id="btn_add_${p.id}">Add/Connect</button>`;
        box.appendChild(addBox);
        root.appendChild(box);
        document.getElementById(`btn_add_${p.id}`).onclick = () => addFeatureToPlan(p.id);
      });
    }

    async function addFeatureToPlan(planId) {
      const key = document.getElementById('new_key_'+planId).value.trim();
      const desc = document.getElementById('new_desc_'+planId).value.trim();
      if (!key) return alert('key required');
      const res = await fetch(API + '/plans/' + planId + '/features', { method:'POST', headers: authHeaders(), body: JSON.stringify({ key, description: desc }) });
      if (!res.ok) return alert('Failed: '+res.status);
      load();
    }

    async function disconnectFeature(planId, featureId) {
      if (!confirm('Disconnect feature from plan?')) return;
      const res = await fetch(API + '/plans/' + planId + '/features/' + featureId, { method:'DELETE', headers: authHeaders() });
      if (!res.ok) return alert('Failed: '+res.status);
      load();
    }

    async function editFeature(id, key, desc) {
      const newKey = prompt('New key', key) || key;
      const newDesc = prompt('New description', desc) || desc;
      const res = await fetch(API + '/plans/features/' + id, { method:'PATCH', headers: authHeaders(), body: JSON.stringify({ key: newKey, description: newDesc }) });
      if (!res.ok) return alert('Failed: '+res.status);
      load();
    }

    async function deleteFeatureGlobal(id) {
      if (!confirm('Delete feature globally? This will remove it from all plans')) return;
      const res = await fetch(API + '/plans/features/id/' + id, { method:'DELETE', headers: authHeaders() });
      if (!res.ok) return alert('Failed: '+res.status);
      load();
    }

    load();
  </script>
</body>
</html>
