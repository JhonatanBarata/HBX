<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso negado</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top, #1f2430 0%, #12141c 45%, #0b0b0f 100%);
      color: #e6e8ef;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      width: min(100%, 720px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: rgba(22, 24, 32, 0.92);
      box-shadow: 0 28px 64px rgba(0, 0, 0, 0.45);
      padding: 40px 32px;
      text-align: center;
    }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      letter-spacing: 0.02em;
      color: #ffffff;
    }
    p {
      margin: 0 auto;
      max-width: 620px;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.7;
      color: #c9cdda;
    }
    .actions {
      margin-top: 28px;
      display: flex;
      justify-content: center;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 26px;
      border-radius: 999px;
      background: #2c66ff;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 14px 30px rgba(44, 102, 255, 0.28);
    }
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(44, 102, 255, 0.36);
    }
    .reason {
      margin-top: 18px;
      font-size: 0.9rem;
      color: rgba(230, 232, 239, 0.6);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Acesso negado</h1>
    <p>Esta area administrativa so pode ser aberta a partir do fluxo protegido do HBX.</p>
    <p style="margin-top: 14px;">Se voce recebeu este bloqueio ao tentar entrar no admin, solicite uma nova abertura pelo painel HBX.</p>
    <div class="actions">
      <a class="button" href="index.html">Voltar ao site</a>
    </div>
    <div class="reason" id="deniedReason"></div>
  </main>
  <script>
    try {
      const reason = sessionStorage.getItem('hbxWebsiteAdminDeniedReason');
      if (reason) {
        document.getElementById('deniedReason').textContent = `Detalhe tecnico: ${reason}`;
        sessionStorage.removeItem('hbxWebsiteAdminDeniedReason');
      }
    } catch {}
  </script>
</body>
</html>
