<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso negado - Auto Socorro Rio Claro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top right, rgba(109, 221, 58, 0.18), transparent 34%),
        radial-gradient(circle at bottom left, rgba(31, 86, 188, 0.28), transparent 40%),
        linear-gradient(180deg, #d6dfeb 0%, #ffffff 45%, #d2dce8 100%);
      color: #111111;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    .card {
      width: min(100%, 720px);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 24px 60px rgba(2, 6, 23, 0.18);
      padding: 40px 32px;
      text-align: center;
    }
    h1 {
      margin: 0 0 18px;
      font-family: 'Oswald', sans-serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      letter-spacing: 0.04em;
    }
    p {
      margin: 0 auto;
      max-width: 620px;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.7;
      color: rgba(0, 0, 0, 0.74);
    }
    .actions {
      margin-top: 28px;
      display: flex;
      justify-content: center;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #6ddd3a, #1f56bc);
      color: #111111;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 14px 30px rgba(31, 86, 188, 0.24);
    }
    .reason {
      margin-top: 18px;
      font-size: 0.95rem;
      color: rgba(0, 0, 0, 0.54);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Acesso negado</h1>
    <p>Esta area administrativa so pode ser aberta a partir do fluxo protegido do HBX.</p>
    <p style="margin-top: 14px;">Se voce recebeu este bloqueio ao tentar entrar no admin, solicite uma nova abertura pelo painel HBX.</p>
    <div class="actions">
      <a class="button" href="index.html">Voltar ao site</a>
    </div>
    <div class="reason" id="deniedReason"></div>
  </main>
  <script>
    try {
      const reason = sessionStorage.getItem('hbxWebsiteAdminDeniedReason');
      if (reason) {
        document.getElementById('deniedReason').textContent = `Detalhe tecnico: ${reason}`;
        sessionStorage.removeItem('hbxWebsiteAdminDeniedReason');
      }
    } catch {}
  </script>
</body>
</html>
