<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrada protegida - Auto Socorro Rio Claro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top right, rgba(109, 221, 58, 0.18), transparent 34%),
        radial-gradient(circle at bottom left, rgba(31, 86, 188, 0.28), transparent 40%),
        linear-gradient(180deg, #d6dfeb 0%, #ffffff 45%, #d2dce8 100%);
      color: #111111;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    .card {
      width: min(100%, 640px);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 24px 60px rgba(2, 6, 23, 0.18);
      padding: 40px 32px;
      text-align: center;
    }
    h1 {
      margin: 0 0 18px;
      font-family: 'Oswald', sans-serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      letter-spacing: 0.04em;
    }
    p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.7;
      color: rgba(0, 0, 0, 0.74);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Entrada protegida</h1>
    <p id="entryStatus">Estamos validando a sua entrada pelo HBX e preparando o admin.</p>
  </main>
  <script>
    const params = window.location.search || '';
    const next = `admin.html${params}${window.location.hash || ''}`;
    window.location.replace(next);
  </script>
</body>
</html>
