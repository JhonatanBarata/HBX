name: Apply approved company-search UX v2

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-approved-search-ux-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: approved-company-search-ux-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch source files
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          leads_path = Path("frontend/src/app/(app)/leads/page.client.tsx")
          vendas_path = Path("frontend/src/app/(app)/vendas/page.client.tsx")
          css_path = Path("frontend/src/app/hbx-theme/screens.css")
          leads = leads_path.read_text(encoding="utf-8")
          vendas = vendas_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          already_applied = "const SEARCH_HISTORY_KEY = \"hbx:leads-search-history\";" in leads

          def one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              return text.replace(old, new, 1)

          def between(text, start, end, replacement, label):
              a = text.find(start)
              b = text.find(end, a + len(start)) if a >= 0 else -1
              if a < 0 or b < 0:
                  raise SystemExit(f"{label}: markers not found")
              return text[:a] + replacement + text[b:]

          if not already_applied:
              leads = one(leads,
                  'type Tab = "shelf" | "carteira";\n\n// B0: statuses realmente terminais',
                  '''type Tab = "shelf" | "carteira";

type SearchHistoryItem = {
  id: string;
  segment: string;
  uf: string;
  city: string;
  createdAt: string;
  count: number;
};

const SEARCH_HISTORY_KEY = "hbx:leads-search-history";

function getStoredSearchHistory(): SearchHistoryItem[] {
  if (typeof window === "undefined") return [];
  try {
    const parsed = JSON.parse(localStorage.getItem(SEARCH_HISTORY_KEY) || "[]") as unknown;
    if (!Array.isArray(parsed)) return [];
    return parsed
      .filter((item): item is SearchHistoryItem => Boolean(
        item && typeof item === "object"
        && typeof (item as SearchHistoryItem).segment === "string"
        && typeof (item as SearchHistoryItem).uf === "string"
        && typeof (item as SearchHistoryItem).city === "string"
        && typeof (item as SearchHistoryItem).createdAt === "string"
      ))
      .slice(0, 5);
  } catch {
    return [];
  }
}

// B0: statuses realmente terminais''', "history type")

