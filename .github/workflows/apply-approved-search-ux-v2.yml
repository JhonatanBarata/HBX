      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Validate changed files
        continue-on-error: true
        working-directory: frontend
        run: npx eslint 'src/app/(app)/leads/page.client.tsx' 'src/app/(app)/vendas/page.client.tsx'

      - name: Commit directly to master
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-approved-search-ux.yml 2>/dev/null || true
          git rm -f .github/workflows/apply-approved-search-ux-v2.yml
          git add frontend/src/app/'(app)'/leads/page.client.tsx frontend/src/app/'(app)'/vendas/page.client.tsx frontend/src/app/hbx-theme/screens.css
          if git diff --cached --quiet; then
            echo "No source changes; committing workflow cleanup only if needed."
          fi
          git commit -m "feat(frontend): apply approved company-search UX"
          git push origin master
