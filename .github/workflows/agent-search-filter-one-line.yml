name: HBX one-shot company search filter

on:
  push:
    branches:
      - agent/search-filter-one-line
    paths:
      - .github/workflows/agent-search-filter-one-line.yml

permissions:
  contents: write

concurrency:
  group: agent-search-filter-one-line
  cancel-in-progress: true

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/search-filter-one-line
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply one-line required filter layout
        shell: bash
        run: |
          cat > /tmp/patch_hbx.py <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent
          
          
          def replace_between(text: str, start_marker: str, end_marker: str, replacement: str) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]
          
          
          def component_block(raw: str) -> str:
              return indent(dedent(raw).lstrip("\n"), "  ")
          
          
          page_path = Path("frontend/src/app/(app)/leads/page.client.tsx")
          page = page_path.read_text(encoding="utf-8")
          
          quick_block = component_block(r'''
          // ── Filtros opcionais: os dois campos obrigatórios (segmento + cidade) ficam
          // na barra principal. Alcance, canais, pesquisas salvas e filtros da Receita
          // vivem somente na gaveta Avançado.
          function renderQuickFilters() {
            const chips = activeChips();
            return (
              <>
                <div className="be-adv-grid2">
                  <div className="f">
                    <label htmlFor="cb-alcance">Alcance</label>
                    <select id="cb-alcance" className="select-dark" value={alcance} disabled={!city.trim()} onChange={e => setAlcance(e.target.value)}>
                      <option value="">Só a cidade</option>
                      <option value="25">+ 25 km</option>
                      <option value="50">+ 50 km</option>
                      <option value="100">+ 100 km</option>
                    </select>
                  </div>
                  <div className="f">
                    <label>Localização atual</label>
                    {geo ? (
                      <button
                        type="button"
                        className="btn-ghost btn-xs"
                        onClick={pullGeoLocation}
                        disabled={geoBusy}
                      >
                        <I d={ICONS.mapin} size={14} /> {geoBusy ? "Atualizando…" : "Usar minha localização"}
                      </button>
                    ) : (
                      <p className="hint be-adv-location-hint">Ative a localização no topo do sistema para usar como alternativa à cidade.</p>
                    )}
                  </div>
                </div>
          
                <div className="be-adv-grid2">
                  <div className="f">
                    <label><I d={ICONS.website} size={13} /> Tem site</label>
                    <div role="group" aria-label="Filtrar por site" className="radar-canais__tristate">
                      {([
                        { key: "qualquer", label: "Qualquer" },
                        { key: "com", label: "Com" },
                        { key: "sem", label: "Sem" },
                      ] as const).map(opt => (
                        <button
                          key={opt.key}
                          type="button"
                          className={"radar-canais__switch" + (siteFiltro === opt.key ? " radar-canais__switch--on" : "")}
                          onClick={() => setSiteFiltro(opt.key)}
                          aria-pressed={siteFiltro === opt.key}
                        >
                          {opt.label}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className="f">
                    <label><WhatsAppMark size={13} /> Tem WhatsApp</label>
                    <div role="group" aria-label="Filtrar por WhatsApp" className="radar-canais__tristate">
                      {([
                        { key: "qualquer", label: "Qualquer" },
                        { key: "com", label: "Com" },
                      ] as const).map(opt => (
                        <button
                          key={opt.key}
                          type="button"
                          className={"radar-canais__switch" + (zapFiltro === opt.key ? " radar-canais__switch--on" : "")}
                          onClick={() => setZapFiltro(opt.key)}
                          aria-pressed={zapFiltro === opt.key}
                        >
                          {opt.label}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
          
                {chips.length > 0 && (
                  <div className="be-adv-active">
                    <span className="be-adv-active__label">Filtros opcionais ativos</span>
                    <div className="be-adv-active__chips">
                      {chips.map(chip => (
                        <span key={chip.key} className="be-chip-active">
                          {chip.label}
                          <button type="button" onClick={chip.onRemove} aria-label={`Remover filtro ${chip.label}`}>
                            <I d={ICONS.x} size={11} />
                          </button>
                        </span>
                      ))}
                    </div>
                  </div>
                )}
          
                <div className="be-adv-searches" ref={savedMenuRef}>
                  <div className="be-adv-searches__head">
                    <div className="be-adv-searches__copy">
                      <strong>Pesquisas salvas</strong>
                      <span>Guarde ou reaplique um recorte sem ocupar a barra principal.</span>
                    </div>
                    <div className="be-adv-searches__actions">
                      <button
                        type="button"
                        className="btn-ghost btn-xs"
                        onClick={openSaveModal}
                        disabled={!segment.trim() && !city.trim() && !uf.trim()}
                      >
                        Salvar atual
                      </button>
                      <button
                        type="button"
                        className="btn-ghost btn-xs"
                        onClick={() => setSavedBar(v => !v)}
                        aria-expanded={savedBar}
                      >
                        Minhas pesquisas{savedSearches.length > 0 ? ` (${savedSearches.length})` : ""} <I d={ICONS.chevronDown} size={13} />
                      </button>
                    </div>
                  </div>
          
                  {savedBar && (
                    <div className="be-adv-searches__panel">
                      {savedSearches.length === 0 ? (
                        <p className="radar-saved__empty">Nenhuma pesquisa salva ainda. Monte o recorte e clique em &quot;Salvar atual&quot;.</p>
                      ) : (
                        <ul className="radar-saved__list">
                          {savedSearches.map(s => (
                            <li key={s.id} className="radar-saved__item">
                              <button
                                type="button"
                                className="radar-saved__apply"
                                onClick={() => { applySavedSearch(s); setAdvOpen(false); }}
                                title="Aplicar este recorte aos filtros"
                              >
                                <span className="radar-saved__name">{s.nome}</span>
                                <span className="radar-saved__desc">{describeFiltro(s.filtro)}</span>
                                {s.lastCount != null && (
                                  <span className="radar-saved__meta">{s.lastCount} leads na última busca</span>
                                )}
                              </button>
                              <button
                                type="button"
                                className="btn-ghost btn-xs radar-saved__del"
                                onClick={() => deleteSavedSearch(s.id)}
                                disabled={savedBusy}
                                title="Remover pesquisa salva"
                                aria-label={`Remover ${s.nome}`}
                              >
                                <I d={ICONS.x} size={12} />
                              </button>
                            </li>
                          ))}
                        </ul>
                      )}
                    </div>
                  )}
                </div>
          
                <button
                  type="button"
                  className="btn-ghost btn-xs be-adv-clear"
                  onClick={() => { setAdvDraft(FILTRO_AVANCADO_VAZIO); limparFiltros(); }}
                >
                  <I d={ICONS.x} size={13} /> Limpar busca
                </button>
              </>
            );
          }
          
          ''')
          page = replace_between(
              page,
              "  // ── Onde buscar (LEADS-FINAL/03, 06/07):",
              "  // Chips de filtro ativo (LEADS-FINAL/03):",
              quick_block,
          )
          
          chips_block = component_block(r'''
          // Chips dos filtros opcionais. Cidade/UF e segmento não viram chips porque
          // agora são os campos obrigatórios, sempre visíveis e editáveis na linha principal.
          type ActiveChip = { key: string; label: string; onRemove: () => void };
          function activeChips(): ActiveChip[] {
            const chips: ActiveChip[] = [];
            if (alcance) chips.push({ key: "alcance", label: `+ ${alcance} km`, onRemove: () => setAlcance("") });
            if (siteFiltro !== "qualquer") chips.push({ key: "site", label: siteFiltro === "com" ? "Com site" : "Sem site", onRemove: () => setSiteFiltro("qualquer") });
            if (zapFiltro !== "qualquer") chips.push({ key: "zap", label: "Com WhatsApp", onRemove: () => setZapFiltro("qualquer") });
            return chips;
          }
          
          ''')
          page = replace_between(
              page,
              "  // Chips de filtro ativo (LEADS-FINAL/03):",
              "  // ── Barra de comando",
              chips_block,
          )
          
          command_block = component_block(r'''
          // ── Barra de comando: uma linha no desktop, com somente o que é necessário
          // para executar a busca — segmento, UF/cidade e Buscar. Todo o restante
          // fica atrás de Avançado.
          function renderCommandBar() {
            const optionalCount = activeChips().length;
            const cityIsKnown = cityOptions.some(o => o.label === city);
            return (
              <div className="be-cmdbar be-cmdbar--required" data-tut="leads-filtros">
                <div className="be-search be-required-segment" data-tut="leads-busca-criativa" ref={segBoxRef}>
                  <I d={ICONS.search} size={16} />
                  <input
                    className="be-search__input"
                    placeholder="Segmento ou tipo de empresa"
                    value={segment}
                    onChange={e => { setSegment(e.target.value); if (segOptions.length) setSegMenuOpen(true); }}
                    onKeyDown={e => {
                      if (e.key === "Enter" && !runBusy && !runActive) { setSegMenuOpen(false); executarBusca(); }
                      else if (e.key === "ArrowDown" && segOptions.length) { setSegMenuOpen(true); }
                    }}
                    role="combobox"
                    aria-label="Segmento obrigatório"
                    aria-required="true"
                    aria-expanded={segMenuOpen}
                    aria-controls="rc-seg-menu"
                    aria-autocomplete="list"
                  />
                  <button
                    type="button"
                    className={"be-search__chevron" + (segMenuOpen ? " be-search__chevron--open" : "")}
                    onClick={() => setSegMenuOpen(o => !o)}
                    aria-label={segMenuOpen ? "Fechar lista de segmentos" : "Abrir lista de segmentos"}
                    tabIndex={-1}
                  >
                    <I d={ICONS.chevronDown} size={16} />
                  </button>
                  {segMenuOpen && (
                    <div className="be-search__menu" id="rc-seg-menu" role="listbox">
                      {segOptions.length === 0 ? (
                        <div className="be-search__opt be-search__opt--empty" aria-disabled>
                          Digite pra buscar
                        </div>
                      ) : (
                        [...segOptions]
                          .sort((a, b) => {
                            const q = segment.trim().toLowerCase();
                            if (!q) return 0;
                            const am = a.label.toLowerCase().includes(q) ? 0 : 1;
                            const bm = b.label.toLowerCase().includes(q) ? 0 : 1;
                            return am - bm;
                          })
                          .map(o => {
                            const q = segment.trim().toLowerCase();
                            const match = q.length > 0 && o.label.toLowerCase().includes(q);
                            const selected = o.label === segment;
                            return (
                              <button
                                key={o.value}
                                type="button"
                                role="option"
                                aria-selected={selected}
                                className={
                                  "be-search__opt"
                                  + (match ? " be-search__opt--match" : "")
                                  + (selected ? " be-search__opt--active" : "")
                                }
                                onClick={() => { setSegment(o.label); setSegMenuOpen(false); }}
                              >
                                <span>{o.label}</span>
                                {typeof o.count === "number" && (
                                  <span className="be-search__opt-count">{o.count}</span>
                                )}
                              </button>
                            );
                          })
                      )}
                    </div>
                  )}
                </div>
          
                <div
                  className={"be-required-location" + (geo && !city.trim() ? " is-geo" : "")}
                  aria-label="Localização obrigatória da busca"
                  title={geo && !city.trim() ? "Sua localização atual será usada na busca" : "Escolha UF e cidade"}
                >
                  <select
                    id="cb-uf-inline"
                    value={uf}
                    onChange={e => { setCity(""); setAlcance(""); setUf(e.target.value); }}
                    aria-label="Estado"
                    aria-required="true"
                  >
                    <option value="">UF</option>
                    {ufOptions.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                  </select>
                  <select
                    id="cb-city-inline"
                    value={city}
                    disabled={!uf.trim()}
                    onChange={e => { setAlcance(""); setCity(e.target.value); }}
                    aria-label="Cidade obrigatória"
                    aria-required="true"
                  >
                    <option value="">{geo && !city.trim() ? "Localização ativa" : "Cidade"}</option>
                    {city && !cityIsKnown && <option value={city}>{city}</option>}
                    {cityOptions.map(o => <option key={o.value} value={o.label}>{o.label}</option>)}
                  </select>
                </div>
          
                {runActive ? (
                  <button className="btn-ghost be-cmdbar__go" onClick={pararBusca}>◼ Parar</button>
                ) : (
                  <button className="btn-teal be-cmdbar__go" data-tut="leads-buscar" onClick={() => executarBusca()} disabled={runBusy}>
                    {runBusy ? "Iniciando…" : "Buscar"}
                  </button>
                )}
          
                <button
                  type="button"
                  className="btn-ghost btn-xs be-cmdbar__advanced"
                  data-tut="leads-filtro-avancado"
                  onClick={() => setAdvOpen(true)}
                  title="Alcance, site, WhatsApp, dados da Receita e pesquisas salvas"
                >
                  <I d={ICONS.filter} size={13} /> Avançado
                  {optionalCount > 0 && <span className="be-cmdbar__advanced-count">{optionalCount}</span>}
                </button>
              </div>
            );
          }
          
          ''')
          page = replace_between(
              page,
              "  // ── Barra de comando",
              "  // ── Radar console",
              command_block,
          )
          
          page = page.replace(
              '"Escolha cidade + segmento no painel ao lado e busque leads."',
              '"Escolha cidade + segmento na barra acima e busque leads."',
              1,
          )
          page = page.replace(
              '  // "Minhas pesquisas" (LEADS-FINAL/03, 06/07): dropdown na barra — mesmo padrão\n'
              '  // de popover ancorado do combobox de segmento acima (ref + click-fora/Escape).\n'
              '  // savedBar reusa o mesmo boolean que já existia (era accordion no aside).\n',
              '  // "Minhas pesquisas" mora dentro da gaveta Avançado. Mantém ref + click-fora/\n'
              '  // Escape e reusa o mesmo estado do antigo popover da barra.\n',
              1,
          )
          page_path.write_text(page, encoding="utf-8")
          
          modal_path = Path("frontend/src/components/hbx/filtro-avancado-modal.tsx")
          modal = modal_path.read_text(encoding="utf-8")
          if "          Filtro\n" not in modal or "              <h4>Onde buscar</h4>" not in modal:
              raise RuntimeError("Cabeçalhos do filtro avançado não encontrados")
          modal = modal.replace("          Filtro\n", "          Filtros avançados\n", 1)
          modal = modal.replace("              <h4>Onde buscar</h4>", "              <h4>Refinar a busca</h4>", 1)
          modal_path.write_text(modal, encoding="utf-8")
          
          tutorial_path = Path("frontend/src/lib/tutorial-coach-steps.ts")
          tutorial = tutorial_path.read_text(encoding="utf-8")
          old_tutorial = (
              '      body: "Digite o segmento que você atende e clique em Filtro pra escolher estado, cidade e alcance. '
              'É o que diz pro Radar o tipo de empresa que você procura.",'
          )
          new_tutorial = (
              '      body: "Digite o segmento e escolha UF e cidade na mesma linha. Use Avançado só para alcance, '
              'canais, dados da Receita e pesquisas salvas.",'
          )
          if old_tutorial not in tutorial:
              raise RuntimeError("Texto do tutorial não encontrado")
          tutorial = tutorial.replace(old_tutorial, new_tutorial, 1)
          tutorial_path.write_text(tutorial, encoding="utf-8")
          
          css_path = Path("frontend/src/app/hbx-theme/screens.css")
          css = css_path.read_text(encoding="utf-8")
          css_marker = "/* ── Buscar empresas: obrigatórios em uma linha; opcionais no Avançado (15/07/2026) ── */"
          if css_marker in css:
              raise RuntimeError("Bloco CSS já aplicado")
          css_block = dedent(r'''
          /* ── Buscar empresas: obrigatórios em uma linha; opcionais no Avançado (15/07/2026) ── */
          .be-cmdbar.be-cmdbar--required {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) minmax(250px, 340px) auto auto;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-hairline);
            background: var(--hbx-surface);
          }
          .be-cmdbar--required .be-search {
            min-width: 0;
            min-height: var(--field-height);
            padding: 0 12px;
          }
          .be-required-location {
            display: grid;
            grid-template-columns: 86px minmax(0, 1fr);
            align-items: stretch;
            min-width: 0;
            height: var(--field-height);
            overflow: hidden;
            border: 1px solid var(--border-hairline);
            border-radius: 999px;
            background: var(--hbx-field-surface);
            transition: border-color var(--motion-fast), box-shadow var(--motion-fast);
          }
          .be-required-location:focus-within {
            border-color: var(--hbx-brand);
            box-shadow: 0 0 0 3px var(--ring-brand);
          }
          .be-required-location select {
            width: 100%;
            min-width: 0;
            height: 100%;
            padding: 0 30px 0 12px;
            border: 0;
            background: transparent;
            color: var(--text-strong);
            font-family: var(--font-body);
            font-size: 0.76rem;
            font-weight: 700;
            outline: none;
            cursor: pointer;
          }
          .be-required-location select + select {
            border-left: 1px solid var(--border-hairline);
          }
          .be-required-location select:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.72;
          }
          .be-required-location.is-geo select:last-child {
            color: var(--hbx-brand-strong);
          }
          .be-cmdbar--required .be-cmdbar__go,
          .be-cmdbar--required .be-cmdbar__advanced {
            min-height: var(--field-height);
            height: var(--field-height);
            white-space: nowrap;
          }
          .be-cmdbar--required .be-cmdbar__advanced {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
          }
          .be-cmdbar__advanced-count {
            display: inline-grid;
            place-items: center;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            background: var(--hbx-brand-soft);
            color: var(--hbx-brand-strong);
            font-family: var(--font-mono);
            font-size: 0.6rem;
            font-weight: 800;
          }
          .be-adv-location-hint {
            margin: 0;
            min-height: var(--control-height);
            display: flex;
            align-items: center;
            line-height: 1.45;
          }
          .be-adv-active {
            display: grid;
            gap: 6px;
          }
          .be-adv-active__label {
            font-size: 0.62rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
          }
          .be-adv-active__chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
          }
          .be-adv-searches {
            display: grid;
            gap: 10px;
            padding: 11px 12px;
            border: 1px solid var(--border-hairline);
            border-radius: var(--radius-md);
            background: var(--hbx-surface-soft);
          }
          .be-adv-searches__head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
          }
          .be-adv-searches__copy {
            display: grid;
            gap: 2px;
            min-width: 0;
          }
          .be-adv-searches__copy strong {
            font-size: 0.76rem;
            color: var(--text-strong);
          }
          .be-adv-searches__copy span {
            font-size: 0.66rem;
            line-height: 1.4;
            color: var(--text-muted);
          }
          .be-adv-searches__actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            flex-wrap: wrap;
          }
          .be-adv-searches__panel {
            max-height: 250px;
            overflow-y: auto;
            padding-top: 8px;
            border-top: 1px solid var(--border-hairline);
          }
          .be-adv-searches__panel .radar-saved__list {
            margin: 0;
            padding: 0;
          }
          .be-adv-clear {
            justify-self: start;
          }
          
          @media (max-width: 900px) {
            .be-cmdbar.be-cmdbar--required {
              grid-template-columns: minmax(0, 1fr) auto;
            }
            .be-cmdbar--required .be-search,
            .be-cmdbar--required .be-required-location {
              grid-column: 1 / -1;
            }
            .be-cmdbar--required .be-cmdbar__go,
            .be-cmdbar--required .be-cmdbar__advanced {
              width: 100%;
            }
            .be-adv-searches__head {
              align-items: flex-start;
              flex-direction: column;
            }
            .be-adv-searches__actions {
              justify-content: flex-start;
            }
          }
          @media (max-width: 520px) {
            .be-cmdbar.be-cmdbar--required {
              grid-template-columns: 1fr;
            }
            .be-cmdbar--required .be-cmdbar__go,
            .be-cmdbar--required .be-cmdbar__advanced {
              grid-column: 1;
            }
            .be-required-location {
              grid-template-columns: 72px minmax(0, 1fr);
            }
          }
          ''').strip()
          css_path.write_text(css.rstrip() + "\n\n" + css_block + "\n", encoding="utf-8")
          PY
          python3 /tmp/patch_hbx.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit validated patch to branch
        shell: bash
        run: |
          git config user.name "HBX Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "frontend/src/app/(app)/leads/page.client.tsx" \
            "frontend/src/app/hbx-theme/screens.css" \
            "frontend/src/components/hbx/filtro-avancado-modal.tsx" \
            "frontend/src/lib/tutorial-coach-steps.ts"
          git commit -m "feat: simplify company search filters"
          git push origin HEAD:agent/search-filter-one-line
