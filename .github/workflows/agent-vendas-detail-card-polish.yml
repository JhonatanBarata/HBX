name: HBX Vendas detail card polish

on:
  push:
    branches:
      - agent/vendas-detail-card-polish
    paths:
      - .github/workflows/agent-vendas-detail-card-polish.yml

permissions:
  contents: write

concurrency:
  group: agent-vendas-detail-card-polish
  cancel-in-progress: true

jobs:
  patch-validate-and-squash:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/vendas-detail-card-polish
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply approved card preview
        run: python .github/scripts/agent-vendas-detail-card-polish.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Publish one clean branch commit
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git reset --soft 1a52c71776fa56360b9fa9207071a31c74870ea5
          rm .github/workflows/agent-vendas-detail-card-polish.yml
          rm .github/scripts/agent-vendas-detail-card-polish.py
          git add -A
          git commit -m "feat: polish vendas lead detail card"
          git push --force-with-lease origin HEAD:agent/vendas-detail-card-polish
