name: Mobile offline route CI

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - '.github/workflows/mobile-offline-ci.yml'
      - 'backend/src/logistica/**'
      - 'backend/src/credits/**'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/prisma/**'
      - 'frontend/src/app/entrega/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'EntregaShell/**'
      - 'docs/PLANEJAMENTOS/HBX-MOBILE-OFFLINE-ROTA-TESTE.md'
  workflow_dispatch:

concurrency:
  group: mobile-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hbx_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/hbx_ci
      JWT_SECRET: hbx-mobile-offline-ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:validate
      - name: Build backend
        id: backend_build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../backend-build.log
      - name: Upload backend build diagnostics
        if: failure() && steps.backend_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-log
          path: backend-build.log
          if-no-files-found: error
          retention-days: 3
      # F1 (09/08) — `logistica-occurrence.service.test.js` saiu daqui junto com o
      # motor de ocorrências, apagado na faxina "um gerador só". Quem prova o
      # gerador agora é o par agenda-generateday + admin-route.
      - name: Admin route, agenda and APK contracts
        run: >-
          node --test
          dist/logistica/logistica-agenda-generateday.service.test.js
          dist/logistica/logistica-admin-route.service.test.js
          dist/logistica/logistica-operacao.service.test.js
          dist/logistica/logistica-mobile.service.test.js
      - name: Offline grant tests
        run: node --test dist/logistica/logistica-offline-grant.test.js
      - name: Credit catalog and logistics billing tests
        run: >-
          node --test
          dist/credits/credit-action-config.service.test.js
          dist/logistica/logistica-route-billing.service.test.js
          dist/logistica/logistica-tracked-billing.service.test.js
          dist/logistica/logistica-tracking-bonus.service.test.js
      - name: Tenant scope lint
        id: tenant_scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          current_output="$(node scripts/check-tenant-scope.mjs --list)"
          printf '%s\n' "$current_output" | tee ../tenant-scope.log

          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            npm run lint:tenant-scope 2>&1 | tee -a ../tenant-scope.log
            exit ${PIPESTATUS[0]}
          fi

          current_count="$(printf '%s\n' "$current_output" | sed -n 's/^\[check-tenant-scope\] \([0-9][0-9]*\).*/\1/p' | head -n 1)"
          test -n "$current_count"
          git fetch origin "$BASE_SHA" --depth=1
          base_dir="$(mktemp -d)"
          cleanup() { git worktree remove --force "$base_dir" >/dev/null 2>&1 || true; rm -rf "$base_dir"; }
          trap cleanup EXIT
          git worktree add --detach "$base_dir" "$BASE_SHA" >/dev/null
          base_output="$(cd "$base_dir/backend" && node scripts/check-tenant-scope.mjs --list)"
          printf '\n[base %s]\n%s\n' "$BASE_SHA" "$base_output" | tee -a ../tenant-scope.log
          base_count="$(printf '%s\n' "$base_output" | sed -n 's/^\[check-tenant-scope\] \([0-9][0-9]*\).*/\1/p' | head -n 1)"
          test -n "$base_count"

          if [ "$current_count" -gt "$base_count" ]; then
            echo "O PR aumentou chamadas tenant sem escopo: base=$base_count atual=$current_count" | tee -a ../tenant-scope.log
            exit 1
          fi
          echo "Escopo tenant não regrediu: base=$base_count atual=$current_count" | tee -a ../tenant-scope.log
      - name: Upload tenant scope diagnostics
        if: failure() && steps.tenant_scope.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: tenant-scope-log
          path: tenant-scope.log
          if-no-files-found: error
          retention-days: 3
      # 🔴 ESTE PASSO CONFERE O QUE O APK CARREGA — e ele tinha parado de fazer
      # isso. Listava `app.js` (morto na fusão de 07/08), `mobile-contract.js` e
      # `offline-controls.js` (órfãos, removidos em 10/08): três arquivos que o
      # `index.html` não carrega, um deles inexistente — ou seja, o passo estava
      # vermelho por ausência e cego pro app de verdade.
      # Os três que o `index.html` carrega, na ordem em que ele carrega, são a
      # lista certa. `ponte.js` é GERADO (fonte em logistica/ponte-src/): quem
      # garante que o gerado é a costura da fonte é `scripts/ponte-conferir.js`.
      - name: Packaged JavaScript syntax
        working-directory: EntregaShell
        run: |
          node --check app/src/main/assets/app/native.js
          node --check app/src/logistica/assets/app/native.js
          node --check app/src/logistica/assets/app/mock.js
          node --check app/src/logistica/assets/app/ponte.js
          node --check app/src/logistica/assets/app/matriz.js

  frontend:
    name: Admin mobile frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build frontend
        id: frontend_build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../frontend-build.log
      - name: Upload frontend build diagnostics
        if: failure() && steps.frontend_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: frontend-build.log
          if-no-files-found: error
          retention-days: 3

  android:
    name: Android logistica debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and assemble
        working-directory: EntregaShell
        run: |
          chmod +x ./gradlew
          ./gradlew testLogisticaDebugUnitTest lintLogisticaDebug assembleLogisticaDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hbx-mobile-logistica-debug
          path: EntregaShell/app/build/outputs/apk/logistica/debug/*.apk
          if-no-files-found: error
          retention-days: 7
