name: HBX search bulk toolbar adjustment

on:
  push:
    branches:
      - agent/search-bulk-toolbar-top
    paths:
      - .github/workflows/agent-search-bulk-toolbar-top.yml

permissions:
  contents: write

concurrency:
  group: agent-search-bulk-toolbar-top
  cancel-in-progress: true

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/search-bulk-toolbar-top
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Move bulk actions above results
        shell: bash
        run: |
          cat > /tmp/patch_hbx.py <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent


          def replace_between(text: str, start_marker: str, end_marker: str, replacement: str) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]


          def jsx_block(raw: str) -> str:
              return indent(dedent(raw).strip("\n"), "              ") + "\n"


          page_path = Path("frontend/src/app/(app)/leads/page.client.tsx")
          page = page_path.read_text(encoding="utf-8")

          toolbar = jsx_block(r'''
          {/* Segunda linha operacional: ações em massa à esquerda/direita e o modo
              de visualização centralizado. O rodapé de ações sai de baixo da lista,
              liberando a altura dos resultados até a paginação. */}
          <div className="leads-headrow leads-headrow--toolbar">
            <div className="leads-headrow__start">
              {!embedded && (
                <div className="tabs" data-tut="leads-abas">
                  <button className={"tab" + (tab === "shelf" ? " active" : "")} onClick={() => switchTab("shelf")}>
                    Disponíveis <span className="n">{counts.shelf == null ? "—" : fmtInt(counts.shelf)}</span>
                  </button>
                  <button
                    className={"tab" + (tab === "carteira" ? " active" : "")}
                    onClick={() => switchTab("carteira")}
                  >
                    Minha carteira <span className="n">{counts.carteira == null ? "—" : fmtInt(counts.carteira)}</span>
                  </button>
                </div>
              )}
              {tab === "shelf" && (
                <button
                  type="button"
                  className="btn-ghost btn-xs leads-bulk-select"
                  disabled={items.length === 0}
                  aria-pressed={items.length > 0 && selected.size === items.length}
                  onClick={() => {
                    if (selected.size === items.length && items.length > 0) {
                      setSelected(new Set());
                    } else {
                      setSelected(new Set(items.map(r => r.id)));
                    }
                  }}
                >
                  {selected.size === items.length && items.length > 0 ? "Desmarcar todos" : "Selecionar todos"}
                </button>
              )}
            </div>

            <div className="leads-headrow__center">
              <div className="glass-pill-track leads-viewtoggle" role="group" aria-label="Modo de exibição da lista">
                <GlassPill {...viewPill} />
                <button
                  type="button"
                  ref={viewPill.itemRef("linhas")}
                  className={"glass-pill-item leads-viewtoggle__item" + (viewMode === "linhas" ? " active" : "")}
                  onClick={() => setViewMode("linhas")}
                  aria-pressed={viewMode === "linhas"}
                  title="Ver em linhas (denso)"
                >
                  <I d={ICONS.list} size={14} /> Linhas
                </button>
                <button
                  type="button"
                  ref={viewPill.itemRef("cards")}
                  className={"glass-pill-item leads-viewtoggle__item" + (viewMode === "cards" ? " active" : "")}
                  onClick={() => setViewMode("cards")}
                  aria-pressed={viewMode === "cards"}
                  title="Ver em cards"
                >
                  <I d={ICONS.grid} size={14} /> Cards
                </button>
              </div>
            </div>

            <div className="leads-headrow__end">
              {tab === "shelf" && (
                <button
                  type="button"
                  className="btn-teal radar2-pull-btn leads-bulk-pull"
                  data-tut="leads-puxar"
                  onClick={puxarSelecionados}
                  disabled={selected.size === 0 || meterBlocked || bulkBusy}
                >
                  <I d={ICONS.check} size={13} /> {bulkBusy ? "Puxando…" : `Puxar selecionados${selected.size ? ` (${selected.size})` : ""}`}
                </button>
              )}
            </div>
          </div>
          ''')

          page = replace_between(
              page,
              "              {/* Barra de abas escondida no modo embutido",
              "              {/* Progresso REAL de uma busca em andamento",
              toolbar,
          )

          action_start = '              {tab === "shelf" && (\n                <div className={"radar2-actionbar"'
          action_end = "              {meterBlocked && isSeller && ("
          start = page.index(action_start)
          end = page.index(action_end, start)
          page = page[:start] + page[end:]
          page_path.write_text(page, encoding="utf-8")

          css_path = Path("frontend/src/app/hbx-theme/screens.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "/* ── Buscar empresas: ações em massa no painel superior (15/07/2026) ── */"
          if marker in css:
              raise RuntimeError("CSS marker already present")

          css += "\n\n" + dedent(r'''
          /* ── Buscar empresas: ações em massa no painel superior (15/07/2026) ── */
          .leads-headrow.leads-headrow--toolbar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 10px;
            min-height: 48px;
            padding: 6px 16px;
            border-bottom: 1px solid var(--border-hairline);
            background: var(--hbx-surface-soft);
          }
          .leads-headrow__start,
          .leads-headrow__center,
          .leads-headrow__end {
            display: flex;
            align-items: center;
            min-width: 0;
          }
          .leads-headrow__start {
            justify-content: flex-start;
            gap: 10px;
            flex-wrap: wrap;
          }
          .leads-headrow__center { justify-content: center; }
          .leads-headrow__end { justify-content: flex-end; }
          .leads-headrow--toolbar .tabs { min-width: 0; }
          .leads-headrow--toolbar .leads-viewtoggle { margin: 0; }
          .leads-headrow--toolbar .radar2-pull-btn {
            width: auto;
            margin: 0;
          }
          .leads-bulk-select,
          .leads-bulk-pull {
            min-height: 34px;
            white-space: nowrap;
          }
          .leads-bulk-pull {
            min-width: 184px;
            justify-content: center;
          }

          @media (max-width: 900px) {
            .leads-headrow.leads-headrow--toolbar {
              grid-template-columns: minmax(0, 1fr) auto;
            }
            .leads-headrow__end {
              grid-column: 1 / -1;
            }
            .leads-bulk-pull { width: 100%; }
          }
          @media (max-width: 620px) {
            .leads-headrow.leads-headrow--toolbar {
              grid-template-columns: 1fr;
              padding: 8px 12px;
            }
            .leads-headrow__start,
            .leads-headrow__center,
            .leads-headrow__end {
              grid-column: 1;
              width: 100%;
            }
            .leads-headrow__center { justify-content: center; }
            .leads-headrow__end { justify-content: stretch; }
          }
          ''').strip("\n") + "\n"
          css_path.write_text(css, encoding="utf-8")
          PY
          python /tmp/patch_hbx.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit validated change
        shell: bash
        run: |
          git config user.name "HBX Agent"
          git config user.email "agent@hbxsystem.com.br"
          git add "frontend/src/app/(app)/leads/page.client.tsx" frontend/src/app/hbx-theme/screens.css
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "feat: move lead bulk actions above results"
          git push origin HEAD:agent/search-bulk-toolbar-top
