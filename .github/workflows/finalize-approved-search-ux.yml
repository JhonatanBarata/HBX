name: Finalize approved company-search UX

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/finalize-approved-search-ux.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: finalize-approved-company-search-ux
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Ensure patch workflow has run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! grep -q 'hbx:leads-search-history' 'frontend/src/app/(app)/leads/page.client.tsx'; then
            if gh workflow view apply-approved-search-ux-v2.yml --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh workflow run apply-approved-search-ux-v2.yml --repo "$GITHUB_REPOSITORY" --ref master
              sleep 8
              RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow apply-approved-search-ux-v2.yml --limit 1 --json databaseId --jq '.[0].databaseId')"
              test -n "$RUN_ID"
              gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
              git fetch origin master
              git reset --hard origin/master
            fi
          fi
          grep -q 'hbx:leads-search-history' 'frontend/src/app/(app)/leads/page.client.tsx'
          grep -q 'APPROVED-COMPANY-SEARCH-UX' 'frontend/src/app/hbx-theme/screens.css'

      - name: Remove temporary injection files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-approved-search-ux.yml 2>/dev/null || true
          git rm -f .github/workflows/apply-approved-search-ux-v2.yml 2>/dev/null || true
          git rm -f .github/workflows/apply-approved-search-ux-v3.yml 2>/dev/null || true
          git rm -f .github/workflows/finalize-approved-search-ux.yml 2>/dev/null || true
          git rm -f .github/workflows/apply-approved-search-ux-trigger.txt 2>/dev/null || true
          git commit -m "chore: finalize approved company-search UX" || exit 0
          git pull --rebase origin master
          git push origin master
