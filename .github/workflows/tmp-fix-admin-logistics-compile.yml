name: Apply focused logistics compile fix

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-fix-admin-logistics-compile.yml'
      - 'backend/src/logistica/logistica-occurrence.service.ts'

permissions:
  contents: write

concurrency:
  group: admin-logistics-compile-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply explicit occurrence ID types
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/src/logistica/logistica-occurrence.service.ts')
          text = path.read_text(encoding='utf-8')
          old = """      const existingById = new Map(existingRows.map((row: any) => [String(row.id), row]));
                const existingIds = new Set(existingById.keys());"""
          new = """      const existingById = new Map<string, any>(
                  existingRows.map((row: any): [string, any] => [String(row.id), row]),
                );
                const existingIds = new Set<string>(existingById.keys());"""
          if old not in text:
              raise SystemExit('Trecho esperado não encontrado; correção não aplicada.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit fix to PR branch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "HBX Logistics Validation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/logistica/logistica-occurrence.service.ts
          git commit -m "fix(logistica): type occurrence id set"
          git push origin HEAD:${{ github.head_ref }}
