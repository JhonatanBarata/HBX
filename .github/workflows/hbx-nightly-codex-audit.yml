name: HBX nightly Codex audit

on:
  workflow_dispatch:
  schedule:
    - cron: "59 23 * * *"
      timezone: "America/Sao_Paulo"

concurrency:
  group: hbx-nightly-codex-audit
  cancel-in-progress: false

jobs:
  codex-nightly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run Codex report-only audit
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/nightly-audit.md
          output-file: codex-output.md
          sandbox: workspace-write

      - name: Verify report-only mode
        if: always()
        shell: bash
        run: |
          if ! git diff --quiet --exit-code; then
            echo "Codex changed tracked files during a report-only audit."
            git status --short
            git diff --stat
            exit 1
          fi

      - name: Upload Codex audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hbx-nightly-codex-audit
          path: codex-output.md
          if-no-files-found: warn
