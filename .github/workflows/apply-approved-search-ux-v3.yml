name: Dispatch approved company-search UX v3

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-approved-search-ux-v3.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v2 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-approved-search-ux-v2.yml --repo "$GITHUB_REPOSITORY" --ref master
