name: Apply approved company-search UX

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-approved-search-ux.yml

permissions:
  contents: write

concurrency:
  group: apply-approved-company-search-ux
  cancel-in-progress: false

jobs:
  patch-master:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply approved UX changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          def replace_count(text: str, old: str, new: str, expected: int, label: str) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected exactly {expected} matches, found {count}")
              return text.replace(old, new)

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 regex match, found {count}")
              return updated

          leads_path = Path("frontend/src/app/(app)/leads/page.client.tsx")
          leads = leads_path.read_text(encoding="utf-8")

          leads = replace_once(
              leads,
              '''  const [data, setData] = useState<LeadsResponse | null>(null);
  const [loadError, setLoadError] = useState<string | null>(null);
  const [counts, setCounts] = useState<{ shelf: number | null; carteira: number | null }>({ shelf: null, carteira: null });''',
              '''  const [data, setData] = useState<LeadsResponse | null>(null);
  const [loadError, setLoadError] = useState<string | null>(null);
  const [counts, setCounts] = useState<{ shelf: number | null; carteira: number | null }>({ shelf: null, carteira: null });
  // O histórico é a última vitrine carregada. Alterar filtros não consulta o backend:
  // apenas transforma o resultado anterior em histórico até o próximo clique em Buscar.
  const [hasSearched, setHasSearched] = useState(false);
  const [historyHidden, setHistoryHidden] = useState(false);''',
              "add search/history state",
          )

          leads = sub_once(
              leads,
              r'''\n  const filtersTouched = useRef\(false\);\n  useEffect\(\(\) => \{\n    if \(!filtersTouched\.current\) \{ filtersTouched\.current = true; return; \}\n    const handle = setTimeout\(\(\) => \{ setPage\(1\); setSelected\(new Set\(\)\); loadList\(tab, \{ page: 1 \}\); \}, 300\);\n    return \(\) => clearTimeout\(handle\);\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  \}, \[segment, city, uf, siteFiltro, zapFiltro\]\);\n''',
              '''
  // Importante: filtros nunca disparam /webscraping/radar/leads sozinhos.
  // A consulta filtrada acontece somente depois da ação explícita em Buscar.
''',
              "remove automatic filtered request",
          )

          leads = replace_once(
              leads,
              '''  function toggleSel(id: string) {
    setSelected(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }


  function limparFiltros() {''',
              '''  function toggleSel(id: string) {
    setSelected(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }

  function markFiltersDirty() {
    setHasSearched(false);
    setLiveRunItems(null);
    setSearchMsg(null);
    setSelected(new Set());
    setSelLead(null);
  }

  function limparFiltros() {''',
              "add filter-dirty helper",
          )

          leads = replace_once(
              leads,
              '''    setPage(1);
    setTab("shelf");
    try { localStorage.removeItem("hbx:leads-filters"); } catch { /* sem storage */ }
    loadList("shelf", { page: 1, quantosOverride: 5 });''',
              '''    setPage(1);
    setTab("shelf");
    setHasSearched(false);
    setLiveRunItems(null);
    try { localStorage.removeItem("hbx:leads-filters"); } catch { /* sem storage */ }''',
              "stop clear-filters request",
          )

          leads = replace_once(
              leads,
              '''    setPage(1);
    setSelected(new Set());
    setTab("shelf");
    loadList("shelf", { page: 1 });
  }

  // ── WORM-15: pesquisas salvas''',
              '''    setPage(1);
    setSelected(new Set());
    setTab("shelf");
    setHasSearched(false);
    setLiveRunItems(null);
    setSearchMsg(null);
  }

  // ── WORM-15: pesquisas salvas''',
              "stop advanced-filter request",
          )

          leads = replace_once(
              leads,
              '''    setSavedBar(false);
    setSavedMsg(`Pesquisa "${s.nome}" aplicada.`);
    loadList("shelf", { page: 1, quantosOverride: nextQtd });
  }''',
              '''    setSavedBar(false);
    setSavedMsg(`Pesquisa "${s.nome}" aplicada.`);
    setHasSearched(false);
    setLiveRunItems(null);
    setSearchMsg(null);
    setSelected(new Set());
  }''',
              "stop saved-search request",
          )

          leads = replace_once(
              leads,
              '''    if (!city.trim() && !geo) faltando.push("Cidade");
    if (!segToCheck.trim()) faltando.push("Segmento");''',
              '''    if (!segToCheck.trim()) faltando.push("Segmento");
    if (!uf.trim()) faltando.push("Estado");
    if (!city.trim()) faltando.push("Cidade");''',
              "require segment/state/city",
          )

          leads = replace_once(
              leads,
              '''    if (!validarCamposOuPopup(effSegment)) return;
    setSearchMsg(null);
    setLoadError(null);
    setLiveRunItems([]);''',
              '''    if (!validarCamposOuPopup(effSegment)) return;
    setHasSearched(true);
    setHistoryHidden(false);
    setSearchMsg(null);
    setLoadError(null);
    setLiveRunItems([]);
    // Apaga somente os itens exibidos e preserva os metadados/opções dos filtros.
    setData(prev => prev ? { ...prev, items: [], total: 0 } : prev);''',
              "set explicit-search state",
          )

          leads = replace_once(
              leads,
              '''  const showingLiveRun = tab === "shelf" && liveRunItems !== null;
  const items = showingLiveRun ? (liveRunItems ?? []) : (data?.items || []);''',
              '''  const showingLiveRun = tab === "shelf" && liveRunItems !== null;
  const historyItems = data?.items || [];
  const hideHistory = tab === "shelf" && !hasSearched && historyHidden;
  const items = showingLiveRun ? (liveRunItems ?? []) : (hideHistory ? [] : historyItems);
  const hasHistory = tab === "shelf" && !hasSearched && !historyHidden && historyItems.length > 0;''',
              "derive history visibility",
          )

          leads = replace_once(
              leads,
              '''  const cityOptions = uf
    ? mergeBrazilCityOptions(uf, filters?.citiesByState?.[uf]).sort(byLabel)
    : [];

  const pageTotal = showingLiveRun ? (liveRunItems?.length ?? 0) : (data?.total || 0);''',
              '''  const cityOptions = uf
    ? mergeBrazilCityOptions(uf, filters?.citiesByState?.[uf]).sort(byLabel)
    : [];
  const canSearch = Boolean(segment.trim() && uf.trim() && city.trim());

  const pageTotal = showingLiveRun ? (liveRunItems?.length ?? 0) : (hideHistory ? 0 : (data?.total || 0));''',
              "add canSearch and history-aware total",
          )

          leads = replace_once(
              leads,
              '''  const emptyMsg = loadError
    ? loadError
    : runActive && tab === "shelf"
      ? `Procurando empresas em ${city || "sua região"}…`
    : data?.meta?.available === false
      ? data?.meta?.message || "Banco do Radar indisponível neste ambiente."
      : tab === "carteira"
        ? "Você ainda não puxou nenhum lead. Pegue um na aba Disponíveis."
        : city
          ? `Nenhuma empresa disponível em ${city} ainda. Use o Radar ao lado para buscar.`
          : "Escolha cidade + segmento na barra acima e busque leads.";''',
              '''  const emptyMsg = loadError
    ? loadError
    : runActive && tab === "shelf"
      ? `Procurando empresas em ${city || "sua região"}…`
    : data?.meta?.available === false
      ? data?.meta?.message || "Banco do Radar indisponível neste ambiente."
      : tab === "carteira"
        ? "Você ainda não puxou nenhum lead. Pegue um na aba Disponíveis."
        : hasSearched
