/* APPROVED-COMPANY-SEARCH-UX 16/07/2026 */
/* Dropdown de segmento com a mesma altura útil dos selects nativos de UF/cidade. */
.leads-page .be-search__menu {
  max-height: min(520px, calc(100vh - 210px));
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
}

/* Ações impossíveis usam a superfície inativa do tema, sem azul/hover/sombra. */
.leads-page .be-cmdbar__go:disabled,
.leads-page .leads-bulk-pull:disabled,
.leads-page .leads-history-clear:disabled,
.leads-page .leads-bulk-select:disabled {
  background: var(--hbx-surface-soft);
  border-color: var(--border-hairline);
  color: var(--text-muted);
  box-shadow: none;
  cursor: not-allowed;
  filter: none;
  opacity: 0.72;
  transform: none;
}

/* Seleção + ação ficam juntas; Linhas/Cards ocupa a extremidade direita. */
.leads-page .leads-headrow--toolbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
}
.leads-page .leads-headrow__start {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  min-width: 0;
}
.leads-page .leads-headrow__center { display: none; }
.leads-page .leads-headrow__end {
  display: flex;
  align-items: center;
  justify-self: end;
}
.leads-page .leads-history-clear {
  min-height: 34px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.leads-page .leads-history-note {
  width: fit-content;
  margin: 2px 14px 0;
  padding: 4px 9px;
  border: 1px solid var(--border-hairline);
  border-radius: 999px;
  background: var(--hbx-surface-soft);
  color: var(--text-muted);
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}

/* Radar como viewer: um título, uma frase e os chips do recorte. */
.leads-page .radar-viewer .radar-hero__copy { gap: 4px; }
.leads-page .radar-viewer__status {
  margin: 0;
  max-width: 30ch;
  color: var(--text-muted);
  font-size: 0.72rem;
  line-height: 1.45;
}
.leads-page .radar-viewer__chips {
  padding: 0 4px;
}
.leads-page .radar-viewer__feedback {
  margin: 0;
  padding: 9px 11px;
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-sm);
  background: var(--hbx-surface-soft);
  color: var(--text-muted);
  font-size: 0.7rem;
  line-height: 1.45;
}

@media (max-width: 760px) {
  .leads-page .leads-headrow--toolbar { grid-template-columns: 1fr; }
  .leads-page .leads-headrow__end { justify-self: start; }
  .leads-page .be-search__menu { max-height: min(420px, calc(100vh - 180px)); }
}
