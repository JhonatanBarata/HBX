name: Apply HBX Vendas detail card polish

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/agent-vendas-detail-card-polish-master.yml

permissions:
  contents: write

concurrency:
  group: agent-vendas-detail-card-polish-master
  cancel-in-progress: true

jobs:
  apply-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Load and apply the reviewed patch
        shell: bash
        run: |
          git fetch origin agent/vendas-detail-card-polish:refs/remotes/origin/agent/vendas-detail-card-polish
          git show origin/agent/vendas-detail-card-polish:.github/workflows/agent-vendas-detail-card-polish.yml > /tmp/patch-source.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/patch-source.yml').read_text(encoding='utf-8')
          start = "          cat > /tmp/patch_detail_card.py <<'PY'\n"
          end = "\n          PY\n          python /tmp/patch_detail_card.py"
          if start not in source or end not in source:
              raise RuntimeError('Não foi possível localizar o patch validado na branch de trabalho.')
          payload = source.split(start, 1)[1].split(end, 1)[0]
          payload = '\n'.join(line[10:] if line.startswith('          ') else line for line in payload.splitlines()) + '\n'
          compile(payload, '/tmp/patch_detail_card.py', 'exec')
          Path('/tmp/patch_detail_card.py').write_text(payload, encoding='utf-8')
          PY
          python /tmp/patch_detail_card.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Publish validated change to master
        shell: bash
        run: |
          rm .github/workflows/agent-vendas-detail-card-polish-master.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add frontend/src/components/hbx/detalhes-negocio.tsx frontend/src/app/hbx-theme/screens.css .github/workflows/agent-vendas-detail-card-polish-master.yml
          git commit -m "feat: polish vendas lead detail card"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
