# Generated by scripts/generate-hbx-engines-compose.js
# Capacidade declarada atual: hbx-engine-1..hbx-engine-20.
# HBX_ENGINE_COUNT define a capacidade declarada; Governor decide quantos ficam vivos.
# Hard limit aplicado pelo gerador: 200.
# Usage: HBX_ENGINE_COUNT=20 node scripts/generate-hbx-engines-compose.js

x-hbx-engine-common: &hbx-engine-common
  build:
    context: ./hbx-scraping-engine
    dockerfile: Dockerfile
  restart: unless-stopped
  # Teto de RAM por motor — impede OOM global do host (exit 137 em massa).
  # Motor = Python/uvicorn + httpx + BeautifulSoup/lxml (scraper HTTP, SEM Chrome).
  # RSS típico ~150-350MB; 768m é ~2x o típico e acima do pico de lxml = folga real.
  # 20 motores × 768m = 15GB de teto somado, cabe nos ~20GB livres de um host ~32GB.
  # Um motor que vaze bate o PRÓPRIO teto e reinicia isolado, sem derrubar os 20 juntos.
  mem_limit: ${HBX_ENGINE_MEM_LIMIT:-768m}
  mem_reservation: ${HBX_ENGINE_MEM_RESERVATION:-256m}
  environment:
    HBX_SCRAPING_USER_AGENT: ${HBX_SCRAPING_USER_AGENT:-HBX-Scraping/0.1 contato@hbxsystem.com.br}
    HBX_SCRAPING_TIMEOUT_SECONDS: ${HBX_SCRAPING_TIMEOUT_SECONDS:-20}
    HBX_SCRAPING_CONCURRENCY: ${HBX_SCRAPING_CONCURRENCY:-3}
    HBX_SCRAPING_CACHE_TTL_HOURS: ${HBX_SCRAPING_CACHE_TTL_HOURS:-24}
    HBX_SCRAPING_MAX_DISCOVERY_RESULTS: ${HBX_SCRAPING_MAX_DISCOVERY_RESULTS:-120}
    HBX_AGENDA_MAX_PAGES: ${HBX_AGENDA_MAX_PAGES:-20}
    HBX_AGENDA_REQUEST_DELAY_MS: ${HBX_AGENDA_REQUEST_DELAY_MS:-700}
  networks:
    - hbx_net
services:
  backend:
    environment:
      HBX_ENGINE_COUNT: "20"
      HBX_ENGINE_MAX_COUNT: "20"
      HBX_ENGINE_URLS: "http://hbx-engine-1:8001,http://hbx-engine-2:8001,http://hbx-engine-3:8001,http://hbx-engine-4:8001,http://hbx-engine-5:8001,http://hbx-engine-6:8001,http://hbx-engine-7:8001,http://hbx-engine-8:8001,http://hbx-engine-9:8001,http://hbx-engine-10:8001,http://hbx-engine-11:8001,http://hbx-engine-12:8001,http://hbx-engine-13:8001,http://hbx-engine-14:8001,http://hbx-engine-15:8001,http://hbx-engine-16:8001,http://hbx-engine-17:8001,http://hbx-engine-18:8001,http://hbx-engine-19:8001,http://hbx-engine-20:8001"

