<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080, user-scalable=no, initial-scale=1">
    <title>UniTV</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <!-- Vídeo do AVPlay é renderizado numa camada de HARDWARE por baixo do DOM.
         Este <object> reserva a área; o DOM da UI fica por cima (transparente). -->
    <div id="player-layer">
        <object id="av-player" type="application/avplayer"></object>
    </div>

    <!-- Fundo opaco da UI (some quando o vídeo está tocando, para o plano de vídeo aparecer). -->
    <div id="bg"></div>

    <!-- Raiz da UI (SPA). Cada tela injeta seu HTML aqui. -->
    <div id="app"></div>

    <!-- Toast / overlays globais -->
    <div id="toast" class="toast hidden"></div>
    <div id="loading" class="loading hidden"><div class="spinner"></div></div>

    <!-- Samsung Product API (AVPlay, tvinputdevice, etc.). Em TV real este caminho
         é resolvido pelo runtime. Ver README para testar no navegador com stub. -->
    <script src="$WEBAPIS/webapis/webapis.js"></script>

    <!-- Núcleo -->
    <script src="js/config.js"></script>
    <script src="js/core/store.js"></script>
    <script src="js/core/keys.js"></script>
    <script src="js/core/focus.js"></script>
    <script src="js/core/http.js"></script>
    <script src="js/core/router.js"></script>
    <script src="js/core/ui.js"></script>

    <!-- Player -->
    <script src="js/player/avplay.js"></script>

    <!-- API -->
    <script src="js/api/auth.js"></script>
    <script src="js/api/live.js"></script>
    <script src="js/api/vod.js"></script>
    <script src="js/api/match.js"></script>
    <script src="js/api/user.js"></script>

    <!-- Telas -->
    <script src="js/screens/welcome.js"></script>
    <script src="js/screens/login.js"></script>
    <script src="js/screens/home.js"></script>
    <script src="js/screens/vod-category.js"></script>
    <script src="js/screens/vod-details.js"></script>
    <script src="js/screens/vod-player.js"></script>
    <script src="js/screens/live.js"></script>
    <script src="js/screens/match.js"></script>
    <script src="js/screens/user.js"></script>
    <script src="js/screens/settings.js"></script>

    <!-- Bootstrap -->
    <script src="js/app.js"></script>
</body>
</html>
