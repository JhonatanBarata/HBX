<!doctype html>
<html lang="pt-BR" data-tr="eixox" data-av="sino" data-luz="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HBX Vendas 2.0 — front novo</title>
<style>
/* ==========================================================================
   HBX LOGÍSTICA 2.0 — front NOVO, desenhado a partir das imagens de referência
   de docs/mockups/logistica2.0. Nada aqui reaproveita o app atual.

   DENSIDADE: o app é desenhado em 400x900 (medida lógica de celular) e o
   quadro inteiro é ampliado por `zoom` — o texto continua vetorial, então
   ganha resolução sem virar zoom de imagem. É isso que faz caber a MESMA
   quantidade de linhas das fotos (9 a 10 paradas + rodapé + botões).
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#06090f;color:#e8eefb;overflow:hidden;display:flex;flex-direction:column;
  font-family:Inter,"SF Pro Display","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
/* Sem realce de toque do sistema e sem anel de foco do navegador: os dois
   desenhavam retângulos claros em volta dos botões redondos do app. */
.app button{-webkit-tap-highlight-color:transparent}
.app button:focus{outline:none}
.app button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- cromo do documento ---------- */
.doc-top{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:9px 18px;border-bottom:1px solid #141c2c;background:#0a0f18}
.doc-top h1{margin:0;font-size:14px;font-weight:500}
.doc-top h1 small{display:block;font-size:11px;font-weight:400;color:#7b89a5;margin-top:2px}
.doc-top .sp{flex:1}
.seg{display:flex;gap:3px;background:#080d16;border:1px solid #17203200;border-color:#172032;border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;color:#8496b3;padding:5px 10px;border-radius:7px;font-size:12px;cursor:pointer}
.seg button.on{background:#182644;color:var(--white)}
.doc-body{flex:1;display:flex;min-height:0}
.rail{width:214px;flex:0 0 214px;border-right:1px solid #141c2c;background:#0a0f18;padding:12px 9px;overflow:auto}
.rail h2{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#5d6b86;margin:14px 8px 5px}
.rail h2:first-child{margin-top:0}
.rail button{width:100%;display:flex;align-items:center;gap:8px;text-align:left;border:0;background:transparent;
  color:#c3cee2;padding:8px 9px;border-radius:8px;cursor:pointer;font-size:12.5px}
.rail button:hover{background:#121b2b}
.rail button.on{background:#132038;color:var(--white);box-shadow:inset 0 0 0 1px #1f3255}
.rail button i{width:6px;height:6px;border-radius:50%;background:#2c3c5c;flex:0 0 6px}
.rail button.on i{background:var(--lime)}
.stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow:auto;
  background:radial-gradient(800px 500px at 50% 0%,rgba(47,126,247,.09),transparent 70%)}

/* ==========================================================================
   O CELULAR — 400x900 lógico, ampliado por zoom (padrão 1.7)
   ========================================================================== */
.phone{
  width:426px;height:954px;flex:0 0 426px;position:relative;padding:7px;border-radius:44px;
  zoom:var(--z,1);
  background:linear-gradient(150deg,#3a4356,#12161f 55%,#2a3140);
  box-shadow:0 18px 46px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.05);
}
.app{
  position:relative;width:412px;height:940px;border-radius:38px;overflow:hidden;
  display:flex;flex-direction:column;

  --bg:#080d17; --bg-2:#0a1120; --card:#0d1626; --line:#1a2740; --line-2:#26375a;
  --ink:#eef3fb; --ink-2:#93a3bf; --ink-3:#7889a6;
  /* 🔴 O ESQUELETO ERA INVISÍVEL (16/08, medido no g15 com o APK 280 publicado).
     A onda valia 1,15:1 contra a própria base, e a base 1,07:1 contra o fundo
     da tela — ou seja, trocar o dia na Montagem apagava a lista e punha no
     lugar um RETÂNGULO PRETO por ~500 ms. O dono leu isso como "o carregando
     demora a aparecer"; ele não demorava, ele não dava pra ver. Agora a onda
     tem 3,07:1 (escuro) / 3,27:1 (claro) contra a base — o piso do WCAG pra
     componente não-textual que informa estado. Cor de esqueleto é TOKEN porque
     tem dois modos de luz e um fiscal que a mede. */
  --esq-1:#1d2c48; --esq-2:#63769f;
  --lime:#9ede2a; --lima-viva:var(--lime); --blue:#2f7ef7; --blue-l:#5b9dff;
  --amber:#f5a524; --purple:#a855f7; --red:#f2555a;
  /* famílias tonais e botões — F1 leva 2 (mesmo valor nos 2 modos até o claro pedir) */
  --white:#fff;
  --go-1:#8fd626;
  --go-2:#68b019;
  --go-ink:#12200a;
  /* 🔴 O AZUL DO "ATUALIZAR" REPROVAVA CONTRA BRANCO (15/08, MEDIDO: 3,31:1).
     Decisão fechada do dono: escurecer o tom 1 do par — 2563eb com branco em
     cima mede 5,17:1 (medido). O tom 2 (`--btn-blue-2`) já passava e fica
     como está; só a ponta clara do gradiente raspava o piso de 4,5:1. */
  --btn-blue-1:#2563eb;
  --btn-blue-2:#1f66e0;
  --lime-bg:#151f0d;
  --lime-bg-2:#17230e;
  --lime-line:#4d6b1c;
  --sel-bg:#141f0c;
  --blue-bg:#12253f;
  --blue-line:#2b5490;
  --amber-bg:#2a1e0b;
  --amber-line:#7a5411;
  /* 🔴 O CARTÃO DO RECADO TINHA HEX SOLTO (15/08) — mesma família âmbar do par
     de cima, só um tom mais fechado (o `.recado` é card, não pílula). O claro
     não precisa dele: `[data-luz="claro"] .recado` já troca o fundo inteiro
     por um tom próprio (~2968), então esta var só serve o escuro — como
     `--amber-bg`/`--amber-line`. */
  --amber-bg-2:#1a1408;
  --red-line:#5b2626;
  --red-line-2:#6d2b2b;
  --red-bg:#1a1114;
  --red-bg-2:#17141a;
  --glass:#0b1322;
  --field:#0b1424;
  /* papéis do rabo — F1 leva 4 */
  --chip-bg:#101a2c;
  --blue-bg-2:#0e1c31;
  --red-bg-3:#1f0f11;
  --trilho:#182741;
  --prog-1:#74b81b;
  --prog-2:#a4e42f;
  --handle:#2b3a58;
  --fog:#070d18;
  /* A CENA DE ENTRAR NA ROTA — o véu que escurece a tela e o anel de pouso do
     ponteiro. São COR, então nascem token: no claro o véu vira luz (o inverso,
     não o mesmo escurecer) sem uma linha de tela mudar. */
  --veu:#050912;
  --puck-anel:rgba(126,180,255,.55);
  --puck-vidro:rgba(6,13,24,.82); --puck-vidro-fio:rgba(224,234,246,.28);
  --puck-seta:#82dc45; --puck-seta-fio:#e9ffdf;
  --danger-ico-bg:#2a1113;
  --danger-ico:#ff6b6b;
  --danger-btn:#8f2d2d;
  --barra-trilho:#1b2a45;
  /* abertura — F1 leva 5 (a 1ª tela também é da casca) */
  --splash-bg-1:#0a1020; --splash-bg-2:#070c18;
  --splash-marca:#9ede2a; --splash-marca-2:#9ede2a;
  --splash-tinta:#fff; --splash-sub:#93a3bf; --splash-trilho:#1b2a45;
  --logo-sub:#dbe4f2;
  /* O mapa também é pele: sem token aqui ele fica escuro no tema claro — e
     mapa que não acompanha o tema é o buraco clássico da troca de pele. */
  /* 🔴 A MAQUETE DO 2D LEVOU AS CORES DELA JUNTO (09/08): saíram `--map-rua`
     (a grade de ruas larga), `--map-rotulo`, `--map-carro*`, `--map-bandeira*`
     e `--map-partida`. Token sem quem o leia é casca que promete pele em peça
     que não existe mais — e a próxima casca pintaria o vazio. */
  --map-fundo:var(--bg-2); --map-quadra:#0d1727; --map-rua2:#16223a;
  --map-parque:#0f2418; --map-pino:#0c1526; --map-pino-tinta:#eaf6d5;
  /* 🔴 O NOME DO CLIENTE NO PINO (17/08, item 6). Ele é RÓTULO, não peça de
     mapa: veste a tinta de texto da casa (`--ink`) sobre a mesma superfície de
     vidro do resto do cromo flutuante (`--glass`) — assim ele se lê sobre a
     rua, sobre a quadra e sobre a fita da rota sem precisar de uma terceira
     tinta. Dois tokens porque ele tem letra E fundo, e o tema claro inverte os
     dois de uma vez. */
  --map-pino-nome:var(--ink); --map-pino-nome-fundo:var(--glass);
  --map-rota:var(--lime); --map-rota-borda:#4f8f14; --map-leito:#1d2c47;
  /* 🔴 O ANEL DO PINO VIROU TOKEN PRÓPRIO, e não por capricho: MEDIDO, a borda
     lima contra o chão do mapa CLARO dava 2,83:1 — abaixo do AA de peça gráfica
     (3,0). No escuro a mesma lima dá 11,61:1, então o problema era só de uma
     pele, e token único não tem como servir às duas.
     Aqui ele continua sendo a lima da ROTA (o pino é ponto DA rota, e a cor diz
     isso). Sobre a fita a lima some, claro — e é aí que o CHEIO do pino assume:
     `--map-pino` contra a fita mede 11,24:1. É assim que todo mapa de rua
     resolve, com DUAS tintas: onde uma se perde, a outra desenha a silhueta.
     Uma tinta só não resolveria nem em tese — pra bater 3,0 contra o chão
     (#0a1120) e contra a fita (#9ede2a) ao mesmo tempo, a luminância teria que
     morar numa faixa de 0,14 a 0,19, que é cinza-chumbo: passaria na conta e
     mentiria a cor da rota. */
  --map-pino-anel:var(--map-rota);
  /* A CABEÇA DA COBRA — a ponta acesa que viaja na frente do traço quando o
     mapa se desenha. É a única cor do mapa que só existe DURANTE a cena, e
     ela se vira com CONTRASTE: não há halo nem filtro (ver a folha). */
  --map-cabeca:#e8f4ff;
  /* A CENA DAS RUAS (entrada do app e toda rota nova, ver `cenaDasRuas` na
     ponte). São as ruas DE VERDADE do mapa se desenhando, então a tinta tem que
     morar entre duas coisas: mais clara que a rua final do basemap (#333 no
     escuro), pra a cena ser VISTA, e perto o bastante dela pra a troca no fim
     ser um assentamento e não um susto. Medido contra o chão do basemap
     (#1f1f1f): 3,08:1 — passa o AA de peça gráfica (3,0).
     A ponta acesa da rua que cresce é a MESMA `--map-cabeca` da cobra: uma
     cena, um vocabulário. */
  --map-cena-rua:#59677a;
  --map-cena-nome:#8d9bad;
  /* 🔴 ONDE EU ESTOU — a peça que faltava no mapa 2D (dono, 09/08: *"cadê minha
     localização?"*). Ela é AZUL em qualquer pele, e de propósito: o lima é a
     ROTA e o `--map-pino` é a PARADA; se o motorista fosse verde também, a
     única coisa que a tela precisa achar em meio segundo teria a cor de tudo o
     mais. Azul de "eu" é a convenção de todo mapa desde 2005 — copiar aqui é
     acerto, não falta de ideia. */
  --eu-1:#2f7ef7; --eu-anel:#ffffff;
  --eu-halo:rgba(47,126,247,.17); --eu-halo-linha:rgba(47,126,247,.32);
  --eu-cone:rgba(47,126,247,.5);
  /* EMPRESAS DO CORREDOR (prospector) — três estados numa peça só: APAGADA
     (possível), VARRENDO (o app está olhando) e ACESA (achou). Cada cor do
     desenho do dono virou token aqui: casca nova troca a família inteira sem
     tocar na tela, e o modo claro é DESENHO, não inversão. */
  /* 🔴 AS DUAS CORES DA RUA (PROSPECTOR v2, 12/08 — decisão do dono).
     AZUL é o PADRÃO: o corredor inteiro, o ambiente, e ele é MUDO. VERDE é o
     TIPO que a pessoa escolheu pra semana — só ele acende, fala e ganha rótulo.
     Mesmo desenho, mesma cena de nascer e crescer; muda só a tinta.

     O azul é DESSATURADO de propósito. A doutrina do mapa (§ --eu-1) reserva o
     azul VIVO pro MOTORISTA, e ambiente que disputa leitura com o puck de quem
     está dirigindo é ambiente atrapalhando. Este aqui é azul-ardósia: dá pra ver
     que é azul, não dá pra confundir com "eu". */
  /* prédio do mock rota (gps-ruas-prospector-v4) — paleta 1:1, azul em 12/08 */
  --emp-topo:#4a6b9e; --emp-esq:#35507c; --emp-dir:#263b5e;
  --emp-janela:#1b2b45;
  --emp-sombra:rgba(0,0,0,.42); --emp-base:#5d82bd;
  /* ESCOLHIDA em repouso: verde de mata, NÃO o limão da rota (--map-rota). O
     limão é o TRAÇO do caminho; prédio com a cor do traço vira parte da linha.
     Este verde é a promessa do que vem quando ela acender — aí sim o lima. */
  --emp-es-topo:#6f8f4a; --emp-es-esq:#556f36; --emp-es-dir:#3f5527;
  --emp-es-janela:#2b3d20; --emp-es-base:#87a75f;
  --emp-on-topo:#a8c96a; --emp-on-esq:#7c9a4a; --emp-on-dir:#5d7834;
  --emp-on-janela:#e7ff9e; --emp-on-janela-brilho:rgba(220,255,128,.85);
  --emp-on-base:#b2ff43;
  --emp-anel:rgba(30,52,24,.82); --emp-anel-fio:rgba(165,255,71,.92);
  --emp-anel-halo:rgba(150,240,60,.2);
  --emp-luz-chao:rgba(150,240,60,.3);
  --emp-varre:rgba(88,186,255,.95); --emp-varre-fim:rgba(88,186,255,.05);
  --emp-chip-bg:rgba(10,19,32,.9); --emp-chip-fio:rgba(120,150,190,.35);
  --emp-nome:#f4f9ff; --emp-ponto:#b2ff43; --emp-ponto-brilho:rgba(178,255,67,.75);
  --emp-trilho:rgba(120,140,170,.35); --emp-barra:#b2ff43;
  --emp-guia:rgba(178,255,67,.5);
  --emp-radar:rgba(75,157,255,.55); --emp-linha-scan:rgba(85,180,255,.22);
  /* O AVISO DE RADAR E O VELOCÍMETRO ACIMA DO LIMITE (12/08, F2+F3). Eles NÃO
     entram na família do vidro (`--glass`): vidro é cromo neutro por cima do
     mapa e some no fundo, e estes dois são ALARME — têm que se ver de relance a
     60 km/h. Por isso a cor é OPACA nos dois temas, não translúcida: fundo de
     vidro COMPÕE com o mapa que estiver embaixo, e contraste que depende do
     tile é contraste que ninguém pode medir. Medido com getComputedStyle nos
     dois temas pelo `prova-radar-aviso.js` (AA ≥ 4,5:1). */
  --radar-bg:#241417; --radar-fio:rgba(255,120,110,.45); --radar-ink:#ff8176;
  --radar-lim-bg:#fff5f4; --radar-lim-ink:#8a1c17; --radar-lim-fio:#e2483c;
  --vel-bg:rgba(6,13,24,.94); --vel-fio:rgba(218,228,240,.24); --vel-trilho:rgba(199,210,225,.5);
  --vel-acima-bg:var(--vel-bg); --vel-acima-fio:var(--vel-fio); --vel-acima-ink:#ff675b;

  background:radial-gradient(560px 300px at 50% -8%,rgba(47,126,247,.10),transparent 70%),
             linear-gradient(180deg,var(--bg-2),var(--bg) 34%);
  color:var(--ink);font-size:13px;

  /* TIPOGRAFIA PREMIUM — fonte VARIÁVEL (Segoe UI Variable no Windows, SF no
     Mac): dá peso 300/350/450 de verdade, sem engrossar sintético. A hierarquia
     vem de TAMANHO e COR, nunca de negrito — é isso que tira o ar de "letra
     grossa". `font-synthesis:none` proíbe o navegador de fabricar bold falso. */
  font-family:"Segoe UI Variable Display","Segoe UI Variable Text",Inter,
              "SF Pro Display","Segoe UI",system-ui,-apple-system,sans-serif;
  font-weight:350;
  font-optical-sizing:auto;
  font-synthesis:none;
  letter-spacing:.002em;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
/* Negrito do navegador (700) é o que dava o "soco" na leitura. Dentro do app
   NENHUM texto passa de 500 — inclusive <b> e <strong>, que vinham 700 de
   fábrica. Peso alto fica só no logotipo, que é marca, não texto. */
.app b,.app strong{font-weight:500}
.app h2{font-weight:400;letter-spacing:-.018em}
.app .v,.app .eta b,.app .price,.app .form-c.total b{letter-spacing:-.02em}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:104px;height:28px;background:#000;border-radius:16px;z-index:60}
.notch::after{content:"";position:absolute;right:11px;top:9px;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#22314d,#05070c 70%)}

/* ==========================================================================
   PADRÕES DE MOVIMENTO — as 7 leis. Nada nesta casca aparece do nada.
   Quem for implementar no app.js copia DAQUI; não inventa duração nem curva.

   1. Toda superfície que NASCE tem entrada; toda que MORRE tem saída.
   2. O que ENTRA desacelera (--cv-entra); o que SAI acelera (--cv-sai).
      Nunca a mesma curva nos dois — é o que separa movimento de piscada.
   3. Lista entra ESCALONADA: passo de --mv-passo, teto de 14 itens (acima
      disso o dedo já rolou e a animação vira atraso).
   4. A ORIGEM tem significado: o aviso nasce no sino, a folha nasce de baixo,
      o GPS nasce do mapa. Peça que nasce do lugar errado mente sobre o app.
   5. ERRO entra diferente de tudo: mais rápido, com sacudida e cor cheia — o
      corpo reage antes da leitura. Erro que entra manso não é erro.
   6. Fundo escuro (scrim) entra e sai JUNTO com a peça que ele serve.
   7. `prefers-reduced-motion` desliga tudo, sem exceção.
   ========================================================================== */
.app{
  --mv-toque:120ms;   /* reação do dedo: botão afundando */
  --mv-rapido:180ms;  /* selo, chip, contador */
  --mv-normal:280ms;  /* aviso, confirmação */
  --mv-tela:440ms;    /* troca de tela (item escalonado) */
  --mv-folha:380ms;   /* folha subindo */
  --mv-cheio:520ms;   /* entrar/sair de tela cheia (GPS) */
  --mv-passo:22ms;    /* intervalo do escalonado */
  /* 🔴 A FILA DO MONTAR TEM DOIS TEMPOS QUE SÃO DA FOLHA (17/08 — ordem do dono:
     *"escurece, preencher com cor do mapa, comece o efeito, desce até o ponto,
     faz todos efeitos, ao concluir aparecem os botões"*). As outras duas fases
     (`ruas` e `descida`) duram o que o MAPA levar e por isso não têm token: quem
     as fecha é a ponte, e o relógio da casca é só o teto delas (§ `CENA_TETO`).
     Estes dois são os que a folha manda de ponta a ponta — e é por isso que eles
     nascem token: `escurece` é usado em DOIS lugares (a camada fundindo e o véu
     enchendo) e tinha que ser o mesmo número nos dois; `pronto` é o orçamento
     que a entrada do cromo inteiro tem que caber dentro. Quem mexer aqui mexe no
     gêmeo `CENA_TETO` lá embaixo, que é o relógio de parede da mesma fila. */
  --cena-escurece:420ms;
  --cena-pronto:420ms;
  /* 🔴 A TROCA 2D⇄3D VIROU SEQUÊNCIA (17/08 — dono: *"efeito de troca entre 2d e
     3d tem q ser um pouco mais devagar, um pouco mais organizado"*). A tabela do
     contrato em três linhas: quem SAI recolhe de 0 a 260 ms, a CÂMERA anda de
     200 a 1020 (820 ms, é da ponte — § `TROCA_MS`) e quem ENTRA desce de 420 a
     800 (`--troca-espera` + `--mv-folha`). Antes as três coisas partiam juntas
     no quadro zero, e era exatamente isso que o dono via como travação: três
     gestos somados parecem UM gesto engasgado. */
  --troca-recolhe:260ms;
  --troca-espera:420ms;
  --cv-entra:cubic-bezier(.16,1,.3,1);
  --cv-sai:cubic-bezier(.4,0,1,.6);
  --cv-mola:cubic-bezier(.34,1.42,.5,1);
  /* CURVA DE CENA — a única que NÃO desacelera de cara. `--cv-entra` gasta 80%
     do gesto nos primeiros 20% do tempo: é o certo pra peça que chega (chega e
     assenta), e é o ERRADO pra coisa que se REVELA. MEDIDO na cena de entrar
     na rota: com `--cv-entra` o véu já estava metade ido aos 360 ms e o mapa
     aparecia de uma vez — o oposto de "aos poucos". Esta curva anda parelho no
     meio, que é onde o olho lê a revelação. */
  --cv-cena:cubic-bezier(.4,0,.25,1);
}

/* ==========================================================================
   TROCA DE TELA — 5 transições pra escolher UMA.
   Cada tela vira uma camada (.tela) sobreposta: durante a troca existem DUAS
   no ar, a que sai e a que entra. É isso que permite empurrão de verdade, e
   não só um fade disfarçado.
   ========================================================================== */
.tela{
  position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(560px 300px at 50% -8%,rgba(47,126,247,.10),transparent 70%),
             linear-gradient(180deg,var(--bg-2),var(--bg) 34%);
  will-change:transform,opacity;
}
.tela.entra{z-index:2}
.tela.sai{z-index:1}

/* As 6 opções são da MESMA família — a que o dono aprovou: as linhas entram
   uma atrás da outra. O que muda entre elas é o CARÁTER da entrada, e cada uma
   é um padrão que app grande usa hoje, não invenção minha.
   `.anim-item` é posto pelo JS nas peças do corpo (KPIs, linhas, resumo…). */
@keyframes trApaga{to{opacity:0}}
@keyframes trFundeEntra{from{opacity:0;transform:scale(1.012)}to{opacity:1;transform:none}}
@keyframes trItem{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* 1 — ESCALONADO (o aprovado): linha por linha, de 26 em 26 ms, subindo 9px. */
[data-tr="escalonado"] .tela.entra{animation:trFundeEntra .18s ease-out both}
[data-tr="escalonado"] .tela.sai{animation:trApaga .14s ease-out both}
[data-tr="escalonado"] .tela.entra .anim-item{
  animation:trItem .34s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(var(--i,0)*26ms)}

/* 2 — DESFOQUE: cada linha chega DESFOCADA e entra em foco. É a assinatura
   atual de Linear, Vercel, Raycast e Arc — o que dá o ar de "alta definição",
   porque a nitidez vira o próprio evento. Custa GPU, então só na entrada. */
[data-tr="desfoque"] .tela.entra{animation:trFundeEntra .16s ease-out both}
[data-tr="desfoque"] .tela.sai{animation:trApaga .12s ease-out both}
[data-tr="desfoque"] .tela.entra .anim-item{
  animation:trDesfoque .44s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*24ms)}
@keyframes trDesfoque{
  from{opacity:0;filter:blur(7px);transform:translateY(7px) scale(.994)}
  to{opacity:1;filter:blur(0);transform:none}}

/* 3 — MOLINHA: curva com ultrapassagem (o item passa 2% do lugar e volta).
   É o `spring` do SwiftUI/iOS — o movimento parece ter PESO, não tempo. */
[data-tr="molinha"] .tela.entra{animation:trFundeEntra .16s ease-out both}
[data-tr="molinha"] .tela.sai{animation:trApaga .12s ease-out both}
[data-tr="molinha"] .tela.entra .anim-item{
  animation:trMola .52s cubic-bezier(.34,1.42,.5,1) both;animation-delay:calc(var(--i,0)*28ms)}
@keyframes trMola{from{opacity:0;transform:translateY(15px) scale(.982)}to{opacity:1;transform:none}}

/* 4 — EIXO Z (Material 3, "shared axis Z"): a tela velha CRESCE e some, a nova
   vem de trás. É o padrão do Google pra "entrei num nível mais fundo" —
   diz hierarquia sem empurrão lateral. As linhas ainda escalonam, mais rápido. */
[data-tr="eixoz"] .tela.entra{animation:trZEntra .34s cubic-bezier(.05,.7,.1,1) both}
[data-tr="eixoz"] .tela.sai{animation:trZSai .26s cubic-bezier(.3,0,.8,.15) both}
@keyframes trZEntra{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@keyframes trZSai{to{opacity:0;transform:scale(1.06)}}
[data-tr="eixoz"] .tela.entra .anim-item{
  animation:trItem .3s ease-out both;animation-delay:calc(var(--i,0)*16ms + 60ms)}

/* 5 — EIXO X (versão 3): a versão 2 aplicou a lei (a) só na ENTRADA. A saída
   continuava sendo a v1, e o "voltar" era espelho, não reverso.
   (a) Nem a entrada nem a SAÍDA andam como bloco — quem desliza são as LINHAS,
       uma atrás da outra. Bloco inteiro andando é carrossel; cascata lateral é
       aplicativo. MEDIDO na v2: a camada que saía tinha UMA animação (a camada
       inteira viajando 24px) contra as OITO da que entrava. Metade da troca
       obedecia a lei, a outra metade não.
   (b) Tem DIREÇÃO: indo pra frente entra pela direita, voltando entra pela
       esquerda (`--dir`, posto pelo JS). Quem SAI vai pro lado contrário de
       quem entra — mesmo eixo, sentidos opostos, que é o que lê como empurrão.
   (c) 🔴 E TEM ORDEM, que é o que faltava pro reverso ser reverso. `--i` é a
       posição de cima pra baixo; `--ord` é a posição na FILA da cena, e
       voltando ela inverte (`--n - --i`, com `--n` posto pelo `numerarItens`).
       MEDIDO na v2, ida e volta na mesma dupla de telas: os atrasos saíam
       IDÊNTICOS nos dois sentidos (0,22,44,66,88,110,132,154 ms) e só o sinal
       do translate mudava. Espelhar o eixo não desfaz gesto nenhum: a última
       linha que saiu tem que ser a PRIMEIRA a voltar. Agora voltando a cascata
       começa por baixo, nas duas camadas.
   (d) Lei 2 — quem entra desacelera (`--cv-entra`), quem sai acelera
       (`--cv-sai`), nunca a mesma curva nos dois. E a saída é mais curta em
       TUDO: 150 ms por linha contra 440, passo de 16 ms contra 22, cena de
       374 ms contra 594.
   (e) 🔴 A JANELA DA SAÍDA É DE 150 ms, E O PASSO FOI MEDIDO PRA CABER NELA.
       O fundo da `.tela` é gradiente OPACO e quem entra fica por cima
       (z-index 2): quando o `trXFade` fecha, a camada que sai é 100% coberta.
       Dos 260 ms da saída v1, 110 já rodavam atrás dessa parede — invisíveis.
       A tentação é alargar o `trXFade` pra "dar palco". NÃO ALARGUE: eu tentei
       .3s e o print dos 120 ms mostrou as DUAS telas legíveis ao mesmo tempo,
       "Cliente 1" escrito duas vezes deslocado — vira defeito de pintura,
       não transição. O fade fica em .15s, e quem cabe na janela é o PASSO: com
       16 ms, as 8 linhas de uma tela comum COMEÇAM a sair entre 0 e 112 ms,
       todas dentro dos 150 ms. É o começo escalonado que o olho lê como
       cascata; o fim do percurso pode terminar atrás da parede sem prejuízo. */
[data-tr="eixox"] .tela.entra{animation:trXFade .15s linear both}
[data-tr="eixox"] .tela.sai{animation:trXSaiCamada .34s linear both}
@keyframes trXFade{from{opacity:0}to{opacity:1}}
/* A camada que sai não translada mais NADA: o movimento é todo das linhas.
   Ela só apaga, e apaga tarde, pra não engolir a própria cascata. */
@keyframes trXSaiCamada{0%,45%{opacity:1}100%{opacity:0}}
/* A FILA DA CENA. `--ord` existe pra que entrada e saída leiam a MESMA ordem:
   indo pra frente ela é o próprio `--i` (de cima pra baixo); voltando ela
   conta do fim pro começo. `--n` é o maior `--i` que a camada realmente usou. */
[data-tr="eixox"] .tela .anim-item{--ord:var(--i,0)}
[data-tr="eixox"] .tela[data-dir="tras"] .anim-item{--ord:calc(var(--n,14) - var(--i,0))}
[data-tr="eixox"] .tela.entra .anim-item{
  animation:trXItem .44s var(--cv-entra) both;animation-delay:calc(var(--ord,0)*22ms)}
[data-tr="eixox"] .tela.sai .anim-item{
  animation:trXSaiItem .15s var(--cv-sai) both;animation-delay:calc(var(--ord,0)*16ms)}
@keyframes trXItem{
  from{opacity:0;transform:translateX(calc(28px * var(--dir,1)))}
  to{opacity:1;transform:none}}
@keyframes trXSaiItem{
  from{opacity:1;transform:none}
  to{opacity:0;transform:translateX(calc(-26px * var(--dir,1)))}}

/* 6 — SÓ O CONTEÚDO: o cromo (logo, topo, abas) NÃO se mexe — troca só o
   miolo, escalonado. É o que Stripe e Notion fazem: a moldura fica parada e
   dá a sensação de app rápido, porque nada pisca em volta. */
[data-tr="conteudo"] .tela.sai{animation:trApaga .01s linear both}
[data-tr="conteudo"] .tela.entra .anim-item{
  animation:trItem .36s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(var(--i,0)*30ms)}

/* ==========================================================================
   ABERTURA — a primeira impressão do cliente.

   A ideia: a marca não "some pra dar lugar ao app" — ela VIRA o cabeçalho.
   O logo grande do meio da tela viaja até o slot do topo e vira o logo de lá.
   🔴 O percurso NÃO é só vertical: o logo do cabeçalho parece centralizado, mas
   os dois botões redondos da direita o empurram 21px pra esquerda (medido). Sem
   o desvio horizontal ele aterrissava torto. Deslocamento e escala são MEDIDOS
   em tempo de execução (mesma lição do sino: origem chutada nasce torta) — e
   como o cabeçalho muda entre telas, a conta é refeita a cada abertura.
   ========================================================================== */
/* A CENA, em 6 atos (3,4 s até entregar o app):
   1. o vazio respira            0,00–1,70  brilho de fundo abre
   2. abre só o "HB"             0,24–0,87  as duas letras sobem, e o X NÃO existe
   3. as duas hastes chegam      0,86–1,80  uma por cada ponta da diagonal
   4. o X nasce do cruzamento    1,78–2,35  clarão, anel, e o glifo assume a forma
   5. o brilho varre o logotipo  2,34–3,29  e LOGÍSTICA abre o espaçamento
   6. a batida e a entrega       2,66–3,40  o conjunto pulsa uma vez, barra completa

   🔴 A ORDEM É "HB PRIMEIRO, X DEPOIS" (ordem do dono, 10/08: *"o X não é
   carregado, ele abre apenas HB, aí o X vem 1 traço de cada ponta diagonal (1 de
   cima outro de baixo), e formam o X"*). Antes as hastes voavam ANTES das letras
   (0,3 s) e o X já estava montado quando o H e o B subiam — quem olhava via o X
   primeiro e a palavra se completando em volta dele. Agora a marca se escreve na
   ordem em que se lê: H, B, e só então o X é CONSTRUÍDO na frente do motorista.
   Todo o resto da cena (brilho, LOGÍSTICA, batida) andou junto pra trás — o
   brilho varrendo um logotipo sem X seria varrer meia marca. O piso de 3,4 s
   (`ABERTURA_PISO`) não mudou: a cena inteira continua cabendo nele. */
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--bg-2),#05080f);overflow:hidden}
/* 🔴 A CENA ESPERA A CORTINA SAIR — ver `segurarCena`, no script. Só o aparelho
   põe esta marca; pausada antes do atraso (todas as animações são `both`), a
   tela mostra o fundo e nada mais, que é o que já estava debaixo da cortina. */
.splash.cena-presa,.splash.cena-presa *{animation-play-state:paused!important}
.splash-fundo{position:absolute;inset:0;
  background:radial-gradient(430px 330px at 50% 44%,rgba(47,126,247,.20),transparent 70%);
  animation:spFundo 1.7s var(--cv-entra) both}
@keyframes spFundo{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}

/* AS DUAS HASTES — uma entra pela diagonal de cima à esquerda, a outra pela de
   baixo à direita, e onde elas se cruzam nasce o X. Cada haste viaja NA SUA
   PRÓPRIA direção (a de cima desce pra direita, a de baixo sobe pra esquerda),
   então o encontro parece cálculo, não coincidência.
   🔴 ELAS SÓ PARTEM DEPOIS QUE O "HB" ESTÁ NA TELA (0,86 s; o B assenta em
   0,87 s). Haste que sai antes da palavra desmonta a ordem de leitura. */
.splash-xis{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
/* 🔴 A HASTE É A MESMA TINTA DO GLIFO, e por isso ela sai de `--splash-marca` e
   não de `--lime`: no ESCURO os dois são o mesmo `#9ede2a`, mas no CLARO o
   `--lime` vira o verde ESCURO que escreve texto (#3f7a00) e a `--splash-marca`
   é o verde da marca (#5a9c10) — as hastes chegariam de um verde e o X acenderia
   de outro, na troca que a cena inteira existe pra esconder. */
.splash-xis line{stroke:var(--splash-marca);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 7px rgba(158,222,42,.75))}
.splash-xis .haste-a{animation:spHasteA .78s var(--cv-entra) .86s both}
.splash-xis .haste-b{animation:spHasteB .78s var(--cv-entra) 1.02s both}
@keyframes spHasteA{from{opacity:0;transform:translate(-190px,-235px)}to{opacity:1;transform:none}}
@keyframes spHasteB{from{opacity:0;transform:translate(190px,235px)}to{opacity:1;transform:none}}
/* O rastro é a mesma haste, mais fina e adiantada: dá a leitura de velocidade
   sem borrão de imagem (que num logotipo lê como defeito). */
.splash-xis .rastro{stroke-width:2;opacity:.4;filter:none}
.splash-xis .rastro.haste-a{animation-delay:.8s}
.splash-xis .rastro.haste-b{animation-delay:.96s}
/* Quando as duas assentam, as hastes entregam o lugar ao glifo de verdade. */
.splash-xis{animation:spHastesSaem .34s var(--cv-sai) 2.01s both}
@keyframes spHastesSaem{to{opacity:0}}
/* Clarão no cruzamento, no instante exato do encontro. */
.splash-flash{position:absolute;left:50%;top:0;width:96px;height:96px;margin-left:-48px;border-radius:50%;
  background:radial-gradient(circle,rgba(214,255,150,.85),rgba(158,222,42,0) 68%);pointer-events:none;
  animation:spFlash .55s ease-out 1.78s both}   /* 1,78s = quando a 2ª haste assenta */
@keyframes spFlash{0%{opacity:0;transform:scale(.2)}35%{opacity:1}100%{opacity:0;transform:scale(1.5)}}

.splash-centro{position:relative;display:flex;flex-direction:column;align-items:center;
  animation:spBatida .62s var(--cv-mola) 2.66s both}
@keyframes spBatida{0%{transform:scale(1)}38%{transform:scale(1.028)}100%{transform:scale(1)}}
.splash-anel{position:absolute;top:2px;left:50%;margin-left:-59px;width:118px;height:118px;border-radius:50%;
  border:1px solid var(--splash-marca-2);pointer-events:none;animation:spAnel 1.05s ease-out 1.85s both}
@keyframes spAnel{from{opacity:.6;transform:scale(.3)}to{opacity:0;transform:scale(2.4)}}

.splash-logo{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1;will-change:transform}
.splash-logo .w{position:relative;overflow:hidden;padding:3px 5px;font-size:46px;font-weight:600;letter-spacing:.6px}
.splash-logo .w b{color:var(--white);font-weight:600;display:inline-block}
/* O "HB" ABRE A CENA — e o X ainda não existe aqui. Ver a ordem no cabeçalho
   dos 6 atos: primeiro a palavra, depois a construção do X. */
.splash-logo .w b:nth-of-type(1){animation:spSobe .55s var(--cv-mola) .24s both}
.splash-logo .w b:nth-of-type(2){animation:spSobe .55s var(--cv-mola) .32s both}
/* O glifo do X ACENDE no lugar das hastes (sem escala nem giro): a forma já
   está na tela, o que muda é quem a desenha. Salto de tamanho aqui delataria
   que são duas peças diferentes. */
.splash-logo .w em{color:var(--splash-marca);font-style:normal;font-weight:600;font-size:52px;
  display:inline-block;transform:skewX(-8deg);animation:spAcende .5s ease-out 1.89s both}
@keyframes spAcende{from{opacity:0}to{opacity:1}}
.splash-brilho{position:absolute;top:-25%;left:-45%;width:26%;height:150%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
  transform:skewX(-18deg);animation:spBrilho .82s ease-in-out 2.34s both}
/* 🔴 A VARREDURA ANDA EM `translate`, NUNCA em `left`: left é layout, e o
   brilho varre (2,34–3,16 s) JUSTO enquanto o mapa nasce no palco fantasma —
   animação de layout congela com o main thread ocupado; a composta não.
   653.85% = os mesmos 170% do contêiner (-45% → 125%) medidos na largura
   própria (26%). Se a largura de `.splash-brilho` mudar, este número muda
   junto. O `translate` entra ANTES do skewX estático, na mesma ordem em que o
   left entrava. */
@keyframes spBrilho{from{translate:0}to{translate:653.85% 0}}
.splash-logo small{display:block;font-size:11px;color:var(--logo-sub);margin-top:11px;padding-left:10px;
  animation:spLetras .85s var(--cv-entra) 2.44s both}
/* 🔴 A LINHA DO NOME DA EMPRESA SAIU DA ABERTURA (07/08). Ela dizia "Água Rio
   Claro" — COPY do desenho — na PRIMEIRA tela que o motorista vê, e o aparelho
   estava logado na Atlas Distribuidora (medido no g15). O nome da empresa não
   tem porta no aparelho: `hbx:logistica-company-name` não existe no
   localStorage do logistica2 (6 chaves, nenhuma é ela) e o único código que
   grava essa chave é o `app.js`, que o `index.html` do flavor NÃO carrega. A
   abertura também é a única tela que não pode ser repintada (é uma cena com
   relógio), então nem o `apagarDemonstracao` alcançava. Sem fonte, VAZIO — e
   vazio numa cena de 3,4 s é a linha inteira fora. O gap de 42px é o que ela
   ocupava: sem ele a barra encosta no "LOGÍSTICA". */
.splash-barra{width:96px;height:2px;background:var(--barra-trilho);border-radius:2px;overflow:hidden;margin-top:42px}
.splash-barra i{display:block;height:100%;background:var(--splash-marca);transform-origin:left;
  box-shadow:0 0 8px rgba(158,222,42,.8);animation:spCarrega 2.6s var(--cv-entra) .6s both}
@keyframes spSobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spLetras{from{opacity:0;letter-spacing:18px}to{opacity:1;letter-spacing:9px}}
@keyframes spCarrega{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* A PASSAGEM (0,9 s): a marca não some — ela vira o cabeçalho. O resto da
   abertura sai antes, e a primeira tela acende por baixo, escalonando. */
.tela.sai.abertura{animation:mvAberturaSai .95s var(--cv-entra) both!important}
@keyframes mvAberturaSai{0%,70%{opacity:1}100%{opacity:0}}
.tela.entra.abertura{animation:mvScrim .55s ease-out .25s both!important}
.tela.entra.abertura .anim-item{
  animation:trItem .5s var(--cv-entra) both!important;
  animation-delay:calc(.35s + var(--i,0) * var(--mv-passo))!important}
.tela.sai.abertura .splash-logo{animation:mvLogoVoa .9s var(--cv-entra) both}
@keyframes mvLogoVoa{to{transform:translate(var(--dx,0px),var(--dy,-380px)) scale(var(--esc,.55))}}
.tela.sai.abertura .splash-barra,
.tela.sai.abertura .splash-anel,
.tela.sai.abertura .splash-rota,
.tela.sai.abertura .splash-cometa,
.tela.sai.abertura .splash-fundo{animation:mvSai .3s var(--cv-sai) both}

/* ==========================================================================
   TELA CHEIA (GPS) — "Rota iniciada" não troca de tela: ela TOMA a tela.
   A que fica pra trás afunda e escurece; o mapa cresce por cima, vindo de um
   pouco mais longe. Sair faz o caminho inverso. Vale saindo de QUALQUER tela.
   `!important` aqui é de propósito: esta regra tem que vencer a transição
   escolhida no seletor, seja ela qual for — tela cheia é outro tipo de evento.
   ========================================================================== */
/* 🔴 PASSADA A CENA, A TELA CHEIA FICA PARADA — e esta linha é o que garante
   isso. A camada guarda a marca `entra` pra sempre; quando a marca `cena` cai
   (no fim da fila, § `CENA_TETO`), a regra da transição escolhida no seletor
   (`[data-tr] .tela.entra`) voltava a alcançar a camada e a tela INTEIRA
   repiscava. MEDIDO no quadro de 950 ms: o mapa, a manobra e o rodapé apagavam e
   voltavam. Ela vem ANTES da regra da cena de propósito: mesma especificidade,
   as duas `!important` — quem está depois manda, então enquanto há `cena` quem
   manda é a cena. */
.tela.entra.cheio{animation:none!important}
/* 🔴 A FASE 1 DA FILA É A CAMADA VIRANDO A COR DO MAPA (17/08 — ordem do dono:
   *"montou rota? Carregou? Escurece, preencher com cor do mapa, comece o
   efeito"*). Era `mvCheioEntra`: opacidade E escala de 1,14 — e a escala levava o
   MAPA junto, que é o mesmo "piscar tudo" que o item 4 já tinha tirado da troca
   de modo (§ D5, o mapa é UM nó transplantado). Sobrou a OPACIDADE, e ela É o
   escurecer: a camada nova entra sem cromo nenhum (§ "fase não invade fase"),
   com o palco já na cor `--map-fundo` e o véu enchendo por cima no MESMO tempo —
   o que o olho vê é a tela de montagem apagando dentro da cor do mapa.
   Uma animação de opacidade, no compositor, os 420 ms da fase 1 inteira. */
.tela.cena.cheio{animation:mvCenaEnche var(--cena-escurece) var(--cv-cena) both!important}
@keyframes mvCenaEnche{from{opacity:0}to{opacity:1}}
/* 🔴 E O QUE APARECE POR TRÁS DO PALCO TAMBÉM É CHÃO DE MAPA (17/08, medido no
   g15 a 30 quadros/s: UM quadro de azul-marinho no começo da fase 2). A causa é
   legítima e continua existindo — o palco ACENDE de zero (`mvMapaAcende`, 200 ms)
   no mesmo instante em que o véu abre o buraco do clarão —, só que atrás dele
   moravam o gradiente do `.tela` e o `--fog` do `.gps`/`.plano`: o azul da casca
   de novo, agora por um piscar. Durante a fila inteira as três camadas vestem o
   MESMO chão, e aí não existe buraco possível: o que estiver por baixo de
   qualquer coisa é a cor do mapa. */
:root[data-cena] .tela.cena.cheio,
:root[data-cena] .tela.cena.cheio .gps,
:root[data-cena] .tela.cena.cheio .plano{background:var(--map-chao,var(--map-fundo))}
/* 🔴 E A CAMADA QUE SAI FICA PARADA DURANTE A FILA (mesma ordem: *"está travando
   no celular, pq tem muita coisa acontecendo ao mesmo tempo"*). Quem saía rodava
   `mvCheioSai` — escala .9 + `filter:brightness(.4)` na tela CHEIA por 520 ms —
   em cima da montagem com 52 linhas, no mesmo quadro em que a camada nova funde e
   o mapa sobe. Filtro animado é justamente o que esta tela já mediu e proibiu
   (4,8 fps com filtro × 7,6 sem). Agora ela só ESPERA a cor cobri-la e morre aos
   460 ms (§ `espera` no `pintar`) — ninguém a vê, então não há show pra cortar.
   O gancho é a marca da RAIZ: enquanto existe fila, existe esta regra.
   🔴 E ELA VENCE O TEMA CLARO SEM PRECISAR DE ESPECIFICIDADE. Lá embaixo,
   `[data-luz="claro"] .tela.sai.cheio:not(.voltando)` troca só o `animation-name`
   (por `mvCheioSaiClaro`) e ganha desta por ser mais específica — mas o que ela
   NÃO troca é a duração, e o `animation:none` daqui a põe em 0s. Nos dois temas o
   resultado é o mesmo: nenhum quadro de animação. */
/* 🔴 A SAÍDA VOLTOU A SER GESTO — SÓ QUE BARATA (17/08, dono com o g15 na mão:
   *"vc vai ver uma tela azul do nada, tem q ser transition, botões saindo,
   transition acontecendo, botões entrando"*). `animation:none` fazia o que está
   escrito acima: a montagem ficava PARADA e era coberta por uma cor — do ponto de
   vista de quem olha, a tela anterior não sai, ela some. O que custava caro no
   `mvCheioSai` era a ESCALA e o `filter:brightness` numa tela de 52 linhas (4,8
   fps medidos); opacidade sozinha é compositor puro e não custa quadro nenhum.
   Então a saída existe de novo, com a curva de quem sai, e dura exatamente os
   mesmos 420 ms em que a cor sobe: as duas são o MESMO movimento visto dos dois
   lados — a montagem se apagando dentro da cor do mapa. */
:root[data-cena] .tela.sai.cheio{animation:mvCenaSai var(--cena-escurece) var(--cv-sai) both!important}
@keyframes mvCenaSai{to{opacity:0}}
/* e "BOTÕES SAINDO" é literal: o pé da tela que sai DESCE enquanto a cor sobe.
   Uma transformação numa peça pequena, no compositor — o oposto do filtro que
   esta casa proibiu. Vale pros três pés que podem estar embaixo quando a cena
   entra (a montagem, o rodapé do mapa e a barra da lista). */
:root[data-cena] .tela.sai.cheio .pe-montagem,
:root[data-cena] .tela.sai.cheio .gps-rodape,
:root[data-cena] .tela.sai.cheio .tmx-dock{animation:mvCenaPeSai var(--cena-escurece) var(--cv-sai) both}
@keyframes mvCenaPeSai{to{opacity:0;transform:translateY(72%)}}
/* 🔴 A SAÍDA USAVA A CURVA DE QUEM CHEGA — e é ISSO que o dono chamou de
   "travação nojenta" no ir e vir entre o 2D e o 3D (16/08). A Lei 2 desta folha
   está escrita 300 linhas acima: quem ENTRA desacelera (`--cv-entra`), quem SAI
   acelera (`--cv-sai`); nunca a mesma curva nos dois. Estas duas regras (e as
   duas irmãs do `voltando`, logo abaixo) eram as ÚNICAS saídas do arquivo em que
   a lei não valia.
   O preço, MEDIDO nos dois sentidos: com `--cv-entra` a camada gasta 95% do
   movimento nos primeiros ~250 ms e depois arrasta cauda invisível até ser
   removida aos ~585 ms — ou seja, 230 a 330 ms de tela parada, com duas camadas
   no ar, TODA vez que se troca de câmera. Não é engasgo de máquina: é a curva
   mandando o gesto acabar antes do relógio. Nada mais muda — mesmos keyframes,
   mesma duração, mesmo `espera` de 580 ms. */
.tela.sai.cheio{animation:mvCheioSai var(--mv-cheio) var(--cv-sai) both!important}
/* 🔴 A CAMADA QUE SAI PRECISA DA MESMA MORDAÇA DA QUE ENTRA. Enquanto a saída
   do eixo X era do BLOCO, só a `.entra` tinha linha aqui — não existia regra
   nenhuma alcançando `.anim-item` de camada saindo. Com a saída virando cascata
   de linhas (v3), `[data-tr="eixox"] .tela.sai .anim-item` passaria a alcançar
   TAMBÉM a tela que afunda pro GPS: as linhas dela sairiam de lado por cima do
   "afunda e escurece", que é show próprio e não admite sócio. MEDIDO antes da
   v3: `.tela.sai.cheio` tinha exatamente 1 animação (`mvCheioSai`) e zero de
   item — é esse número que esta linha preserva. */
.tela.entra.cheio .anim-item,.tela.sai.cheio .anim-item{animation:none!important}
@keyframes mvCheioSai{to{opacity:0;transform:scale(.9);filter:brightness(.4)}}
/* Voltando do GPS o gesto inverte: o mapa encolhe e a tela volta de trás. */
.tela.entra.cheio.voltando{animation:mvCheioVolta var(--mv-cheio) var(--cv-entra) both!important}
.tela.sai.cheio.voltando{animation:mvCheioVoltaSai var(--mv-cheio) var(--cv-sai) both!important}
@keyframes mvCheioVolta{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes mvCheioVoltaSai{to{opacity:0;transform:scale(1.16)}}
/* ==========================================================================
   🔴 FASE 4 — "AO CONCLUIR APARECEM OS BOTÕES" (17/08, ordem do dono na íntegra:
   *"montou rota? Carregou? Escurece, preencher com cor do mapa, comece o efeito,
   desce até o ponto, faz todos efeitos, ao concluir aparecem os botões"*).

   O cromo desta tela — manobra, rodapé de 4 botões, coluna, velocímetro, bússola
   — deixou de entrar JUNTO com a cena e passou a ser a ÚLTIMA fase dela. Antes
   estas mesmas regras estavam penduradas só na marca `cena`, ou seja: partiam no
   quadro zero, ao lado do véu abrindo (CSS), das ruas crescendo no mapa de
   verdade (ponte, ~1,06 s) e da câmera descendo (`easeTo`, 1,8 s). Dezessete
   animações e um WebGL desenhando no mesmo quadro — é o "muita coisa acontecendo
   ao mesmo tempo" do dono, medido no g15.

   🔴 A MARCA MORA NA RAIZ, NÃO NA CAMADA, e isso não é estilo: a camada é trocada
   a cada repinte do seam (1×/s dirigindo), então marca de fase em camada morre no
   meio da cena. `<html data-cena>` sobrevive ao repinte; a classe `cena` continua
   na camada porque ela é o "esta camada ESTÁ em cena" (o escopo), não o relógio.

   🔴 E É UM BLOCO SÓ PROS DOIS MODOS (item 4: *"ambos os estados têm q ser
   idênticos"*). Eram duas listas de atraso — uma pendurada em `.dirigindo`, outra
   em `.plano` — dizendo os mesmos .48/.50/.58 s duas vezes. Com a fase mandando
   no tempo, o atraso é interno à fase e as duas telas leem a MESMA regra: o
   rodapé sobe (0 → 380 ms), a peça do topo desce (40 → 420) e as redondas dão o
   pop (100 → 380). Tudo dentro dos 420 ms de `--cena-pronto`.
   ========================================================================== */
@keyframes mvDesce{from{opacity:0;transform:translateY(-115%)}to{opacity:1;transform:none}}
/* 🔴 UM DEPOIS DO OUTRO, NÃO TODOS JUNTOS (17/08, dono: *"depois de carregar tá
   uma tela desesperada, já abre as coisas… FAÇA COM CALMA, dê um tempo de um
   transition acabar para entrar em outro, tudo SMOOTHLY"*).
   Os atrasos eram .00/.04/.10 s — três gestos partindo praticamente no mesmo
   quadro, que é "aparecer tudo de uma vez" com nomes diferentes. Agora cada um
   espera o anterior FECHAR: o rodapé sobe (0 → 380), a peça do topo desce
   (380 → 760) e só então as redondas dão o pop (760 → 1040). É a mesma lei da
   fila, aplicada dentro da última fase — e continua caber no `FASE_PRONTO_MS`
   (1,4 s), que é quando a marca sai da raiz. */
:root[data-cena="pronto"] .tela.cena.cheio .gps-rodape{animation:mvFolha var(--mv-folha) var(--cv-entra) both}
:root[data-cena="pronto"] .tela.cena.cheio .gps-manobra,
:root[data-cena="pronto"] .tela.cena.cheio .plano-topo{animation:mvDesce var(--mv-folha) var(--cv-entra) var(--mv-folha) both}
:root[data-cena="pronto"] .tela.cena.cheio .gps-vel,
:root[data-cena="pronto"] .tela.cena.cheio .gps-bussola,
:root[data-cena="pronto"] .tela.cena.cheio .gps-lado button,
:root[data-cena="pronto"] .tela.cena.cheio .plano-lado button{animation:mvPop var(--mv-normal) var(--cv-mola) calc(var(--mv-folha) * 2) both}

/* 🔴 E FASE NÃO INVADE FASE: nas TRÊS primeiras o cromo não existe na tela — nem
   meio-transparente, nem com transição pendurada esperando a vez (lei 1 da fila).
   Sem esta lista o rodapé e a manobra ficariam PARADOS e visíveis por cima do véu
   (eles são z-index 20, o véu é 18) e a fase 4 não teria o que anunciar: o dono
   pediu que os botões APAREÇAM no fim, e pra aparecer é preciso não estar lá.

   Entram aqui também as peças que não são cromo de navegação mas somam trabalho
   no mesmo quadro, e foi a SOMA delas que travou o g15: as empresas do prospector
   (`.emp`, com até três nomes se digitando e três sublinhados de 1,9 s), o chip e
   a linha de varredura (`.emp-scan`, que anima `top` sob um `blur`), o selo do
   radar e o "Redirecionando…". Nenhuma delas é a notícia da vez enquanto a rota
   está entrando em cena — todas esperam `pronto` e nascem depois, do quadro zero
   delas, que é o certo (notícia não se herda no meio).

   O `:not([data-cena="pronto"])` é o que faz isto ser as três primeiras fases sem
   escrever três listas. E `[data-cena]` vazio não existe: quem fecha a cena APAGA
   o atributo (§ `fecharCena`), justamente pra esta regra não sobreviver a ela. */
:root[data-cena]:not([data-cena="pronto"]) .tela.cena.cheio .gps-manobra,
:root[data-cena]:not([data-cena="pronto"]) .tela.cena.cheio .plano-topo,
:root[data-cena]:not([data-cena="pronto"]) .tela.cena.cheio .gps-rodape,
:root[data-cena]:not([data-cena="pronto"]) .tela.cena.cheio .gps-vel,
:root[data-cena]:not([data-cena="pronto"]) .tela.cena.cheio .gps-bussola,
:root[data-cena]:not([data-cena="pronto"]) .tela.cena.cheio .gps-lado,
:root[data-cena]:not([data-cena="pronto"]) .tela.cena.cheio .plano-lado,
:root[data-cena]:not([data-cena="pronto"]) .tela.cena.cheio .gps-radar,
:root[data-cena]:not([data-cena="pronto"]) .tela.cena.cheio .gps-redir,
:root[data-cena]:not([data-cena="pronto"]) .tela.cena.cheio .emp-chip,
:root[data-cena]:not([data-cena="pronto"]) .tela.cena.cheio .emp-scan,
:root[data-cena]:not([data-cena="pronto"]) .tela.cena.cheio .emp,
:root[data-cena]:not([data-cena="pronto"]) .tela.cena.cheio .emp *,
/* o pulso do radar do prospector mora DENTRO do puck (§ `.emp-radar`), então ele
   não é filho de `.emp` e escapava desta lista — MEDIDO: duas animações de
   `width`/`height`/`margin` (ou seja, LAYOUT, o pior tipo) vivas nas três
   primeiras fases, inclusive na `descida`, onde a regra é "só a câmera se move". */
:root[data-cena]:not([data-cena="pronto"]) .tela.cena.cheio .emp-radar,
:root[data-cena]:not([data-cena="pronto"]) .tela.cena.cheio .emp-radar i{opacity:0;animation:none}

/* ==========================================================================
   🔴 A TROCA 2D ⇄ 3D: O MAPA FICA PARADO E O CROMO SE MOVE (17/08 — itens 3 e 4
   do dono: *"efeito recolher foto 4, e entrando a foto 5 de cima, e vice versa
   · foto 6 surgir no 3d e sumir no 2d · a tela não tem mais motivo para piscar
   tudo, ambos os estados tem q ser identicos"*).

   O CAMINHO QUE JÁ FOI TENTADO E ESTÁ ERRADO (o histórico importa porque ele se
   repete): (1) animar a CAMADA inteira nos dois lados — era o `mvCheioEntra`, uma
   escala de 1,14 com brilho (morto em 17/08, junto com a fila da cena), e ela leva
   o MAPA junto: o mapa é o mesmo nó transplantado, então escalá-lo é exatamente o
   "piscar tudo"; (2) matar a coreografia e fazer troca SECA — foi o erro de 16/08
   que apagou o efeito de montar rota e o dono viu na hora.
   O certo é o meio: DUAS camadas no ar (é preciso ter o que sair), camada
   PARADA (nada de escala, nada de brilho, nada de fundo — § `so-cromo`) e o
   movimento nas PEÇAS que realmente mudam de um modo pro outro.

   E quais mudam? Exatamente três, e cada uma tem dono num modo só:
     `.gps-manobra`  a foto 4 — existe dirigindo
     `.plano-topo`   a foto 5 — existe no 2D (guia + barra do dia)
     `.gps-bussola`  a foto 6 — existe dirigindo (o mapa só gira lá)
   Por isso não há regra "na ida" e "na volta": a peça só nasce no modo dela, e
   as MESMAS duas linhas (`entra` desce / `sai` recolhe) dão os dois sentidos.
   As marcas `troca-desce`/`troca-sobe` ficam na camada pra quem precisa saber o
   SENTIDO (a prova, e a ponte que manda a câmera) — não pra a folha.

   O RESTO É IDÊNTICO E NÃO SE MEXE. Rodapé, coluna, velocímetro: mesma peça, no
   mesmo lugar, com o mesmo conteúdo. Na camada que sai eles somem no primeiro
   quadro — e ninguém vê, porque a peça nova está exatamente ali. Fundir dois
   vidros iguais por 520 ms escureceria o painel no meio da troca (duas camadas
   de `--glass` somadas), que é um pisca de tinta em vez de um pisca de forma. */
/* 🔴 E ELA É UMA SEQUÊNCIA, NÃO UM ACORDE (17/08 — dono, depois do teste no g15:
   *"efeito de troca entre 2d e 3d tem q ser um pouco mais devagar, um pouco mais
   organizado"*). Todas as peças partiam do quadro ZERO: a que sai recolhendo, a
   que entra descendo, a bússola nascendo, o ícone transmuxando — e a câmera do
   mapa andando por baixo de tudo. Cinco gestos simultâneos de ~300 ms não são um
   gesto rápido, são um borrão: o olho não tem o que seguir e lê como engasgo.
   Agora cada um tem a SUA vez, na ordem da tabela do contrato:
     0   → 260 ms  quem SAI recolhe e a bússola apaga (`--troca-recolhe`)
     200 → 1020    a CÂMERA anda — 820 ms, e é da ponte (§ `TROCA_MS`)
     420 → 800     quem ENTRA desce, a bússola nasce, o ícone transmuxa
   A camada que sai vive 900 ms (§ `espera` no `pintar`, era 560): quem entra só
   termina aos 800, e camada arrancada antes disso é o gesto cortado no fim. */
.tela.modo-troca.cheio{animation:none!important}
@keyframes mvRecolhe{to{opacity:0;transform:translateY(-115%)}}
.tela.entra.modo-troca .gps-manobra,
.tela.entra.modo-troca .plano-topo{animation:mvDesce var(--mv-folha) var(--cv-entra) var(--troca-espera) both}
.tela.sai.modo-troca .gps-manobra,
.tela.sai.modo-troca .plano-topo{animation:mvRecolhe var(--troca-recolhe) var(--cv-sai) both}
/* a foto 6 e o motorista: a bússola nasce com mola no 3D e sai apagando; a seta
   pousa junto com ela (mesma cena da entrada, com o tempo do gesto). Ela sai NO
   TEMPO DE QUEM SAI e nasce NO TEMPO DE QUEM ENTRA — as duas metades da mesma
   troca, nunca no mesmo instante. */
.tela.entra.modo-troca .gps-bussola{animation:mvPop var(--mv-folha) var(--cv-mola) var(--troca-espera) both}
.tela.sai.modo-troca .gps-bussola{animation:trApaga var(--troca-recolhe) var(--cv-sai) both}
/* 🔴 `backwards`, NUNCA `both`, E A SETA INTEIRA DEPENDE DISSO (17/08). Animação
   vence estilo INLINE na cascata — e com `forwards` ela continua vencendo depois
   de terminada, congelando o `transform:none` do último quadro. A marca `entra`
   fica na camada pra sempre (lei desta folha), então esse congelamento durava o
   resto da vida da tela: TODO `transform` que a ponte escrevesse no ponteiro era
   silenciosamente ignorado. Foi o que segurou a seta pregada no vidro depois da
   primeira troca de modo — medido no g15: a ponte mandando `translate(-106px,
   -193px)` e o retângulo da peça parado no mesmo pixel.
   `backwards` mantém a única metade que interessa (segurar o quadro inicial
   durante o atraso) e devolve a propriedade à cascata no fim — que é onde a
   ponte escreve. O `to` do keyframe já é o estado natural da peça: não há nada
   pra "manter" depois. */
.tela.entra.modo-troca .gps-puck{animation:mvPuck .34s var(--cv-mola) var(--troca-espera) backwards}
/* 🔴 O BOTÃO DO MEIO TRANSMUXA (item 3). É a ÚNICA peça do rodapé que muda de
   trabalho entre os modos (Direção ⇄ Panorâmica), então é a única que anima
   dentro de um painel que, no resto, é o mesmo. O ícone gira e cresce; o rótulo
   entra atrás dele. Sem isto o painel trocaria de ícone no meio de um quadro —
   o corte que o dono chama de travação, na menor escala possível.
   Ele entra com a peça que entra (420 ms), não antes: o painel é o mesmo objeto
   nos dois modos, e trocar o miolo dele enquanto a câmera ainda anda seria pedir
   pra o olho ler duas coisas de uma vez. */
.tela.entra.modo-troca .tmx-main button[data-modo] svg{animation:mvTransmux var(--mv-folha) var(--cv-mola) var(--troca-espera) both}
@keyframes mvTransmux{from{opacity:0;transform:rotate(-34deg) scale(.55)}to{opacity:1;transform:none}}
.tela.entra.modo-troca .tmx-main small{animation:mvPop .34s var(--cv-mola) .46s both}
/* 🔴 E QUEM SAI PARA DE TRABALHAR, NÃO SÓ DE APARECER (17/08). MEDIDO na bancada,
   no toque do Panorâmica: a camada que sai levava 53 animações do prospector
   (`fill`, `clip-path`, `opacity`, com atrasos de até 4 s) ainda tiquetaqueando —
   e com a camada velha passando a viver 900 ms (era 560), elas agora tiquetaqueiam
   340 ms A MAIS, no mesmo quadro em que a camada nova entra. `fill` e `clip-path`
   são PAINT, não compositor: é trabalho de verdade num aparelho que o dono acabou
   de dizer que trava. Apagar a peça é só metade do serviço; a outra é desligar.
   O `!important` é obrigatório e é conta de especificidade, não preguiça: quem
   liga estas animações é `.emp.escolhida.on .emp-luz` (0,4,0) e este seletor com
   `*` vale (0,3,0) — sem ele a regra perde e a peça invisível continua animando. */
.tela.sai.modo-troca .emp *,
.tela.sai.modo-troca .emp-scan,
.tela.sai.modo-troca .emp-radar i{animation:none!important}
/* o que é IGUAL nos dois modos passa a vez sem cruzar */
.tela.sai.modo-troca .gps-rodape,
.tela.sai.modo-troca .plano-lado,
.tela.sai.modo-troca .gps-lado,
.tela.sai.modo-troca .gps-vel,
.tela.sai.modo-troca .gps-puck,
.tela.sai.modo-troca .gps-horizonte,
.tela.sai.modo-troca .gps-mundo,
.tela.sai.modo-troca .emp,
.tela.sai.modo-troca .emp-chip,
.tela.sai.modo-troca .emp-scan,
.tela.sai.modo-troca .rota-continuidades{opacity:0}

/* ==========================================================================
   A CENA DE ENTRAR NA ROTA — A FILA (ordem do dono, 07/08 e refeita em 17/08).

   🔴 ELA VIROU FILA, E A FILA É A ORDEM DO DONO PALAVRA POR PALAVRA (17/08, com
   as 8 fotos e o g15 na mão): *"Mesma coisa ao montar a rota, organize isso!
   montou rota? Carregou? Escurece, preencher com cor do mapa, comece o efeito,
   desce até o ponto, faz todos efeitos, ao concluir aparecem os botões. está
   travando no celular, pq tem muita coisa acontecendo ao mesmo tempo!!"*

   O diagnóstico é dele: as quatro coisas aconteciam JUNTAS. O véu abrindo (CSS,
   0,22–0,62 s), as ruas crescendo no mapa de verdade (ponte, ~1,06 s), o cromo
   entrando (CSS, 0,48–0,58 s) e a câmera descendo por cima de tudo (`easeTo`,
   1,8 s). No g15 isso é um WebGL desenhando + 17 animações de cromo + um easeTo
   no MESMO quadro. Não é lentidão de máquina: é falta de fila.

     | fase       | quem manda   | o que acontece                                |
     | escurece   | casca (CSS)  | a tela vira a COR DO MAPA, cheia. Nada mais.   |
     | ruas       | ponte        | as ruas e a rota crescem com brilho no mapa    |
     |            |              | de verdade; o clarão abre do ponto pra fora    |
     | descida    | ponte        | a câmera desce até o ponto — e só isso se move |
     | pronto     | ponte        | APARECEM OS BOTÕES (§ fase 4, lá em cima)      |

   AS LEIS DELA, e cada uma paga uma queixa:
   1. FASE NÃO INVADE FASE. Em `escurece`/`ruas`/`descida` o cromo não existe na
      tela, nem meio-transparente. Quem entra é a fase 4.
   2. QUEM ANUNCIA É QUEM SABE. A ponte é a única que sabe quando o tile chegou,
      quando a última onda das ruas partiu (`mundoVoltou`) e quando o `easeTo`
      terminou. A casca só VESTE — ela não adivinha mapa.
   3. A MARCA MORA NA RAIZ (`<html data-cena>`), NUNCA NA CAMADA. A camada é
      trocada a cada repinte do seam (1×/s dirigindo): marca em camada morre no
      meio da cena. A classe `cena` continua na camada porque ela é o ESCOPO
      ("esta camada está em cena"), não o relógio.
   4. TETO OBRIGATÓRIO, SEMPRE. Se a ponte não anunciar (sem mapa, sem tile, rede
      caída), um relógio da casca empurra a fila até `pronto` (§ `CENA_TETO`).
      Cromo preso invisível é pior que cena nenhuma — a lei de 09/08 ("a cena não
      espera o mapa") continua valendo, só que agora ela é um TETO e não o caminho
      normal. É também o que mantém o MOCK sozinho demonstrável no navegador: sem
      ponte, o teto é o único dono da fila.
   5. POUSO NO 2D NÃO TEM `descida` (não há câmera pra descer): `ruas` → `pronto`.
   6. NADA MAIS ANIMA DURANTE A FILA — as empresas do prospector, o selo do radar
      e o "Redirecionando…" esperam `pronto`. Foi a SOMA delas que travou o g15.

   O QUE A CENA CONTA, na ordem (o roteiro velho continua valendo por dentro):
     1. A TELA ESCURECE na cor do mapa. No modo CLARO ela CLAREIA — é o inverso,
        não o mesmo escurecer com outra cor (`--map-fundo` troca de lado sozinho).
     2. O PONTEIRO SURGE, em cima do véu, sem mapa nenhum atrás: a pergunta da
        tela é "onde eu estou", e o clarão nasce DELE.
     3. AS RUAS CRESCEM. Ordem do dono, 07/08: *"uma cobra crescendo"*. Elas são
        as ruas DE VERDADE dos tiles, crescendo por `line-gradient` dentro do mapa
        (§ `cenaDasRuas`, na ponte) — a lei de 09/08, *"não remonte coisas, crie
        DENTRO do mapa mesmo"*. As EMPRESAS do corredor entram DEPOIS, com o
        cromo: elas são notícia, não são o palco.
     4. A CÂMERA DESCE até o ponto, sozinha na tela.
   ========================================================================== */
/* 1 — O VÉU. O raio do clarão (`--veu-r`) é propriedade REGISTRADA: sem o
   `@property` o navegador não sabe interpolar comprimento dentro de custom
   property e a abertura viraria um corte seco. Quem não tiver o registro fica
   com o valor final (aberto) e vê só o esmaecer — perde o clarão, nunca a
   tela. O `+56px` é o pé do clarão: no primeiro quadro o ponteiro já ilumina
   um palmo de chão em volta dele, que é o farol dele mesmo começando o mapa. */
@property --veu-r{syntax:'<length>';inherits:false;initial-value:1500px}
/* 🔴 O VÉU ESCURECE NA COR DO MAPA (17/08 — item 5 do dono: *"escurece a tela
   (da cor original do mapa)"*). Era `--veu`, o preto-azulado dos scrims de
   diálogo: no meio de um mapa ele lia como uma cortina POR CIMA do dia. Com
   `--map-fundo` — o chão do próprio palco — o que se vê é o mapa BAIXANDO A LUZ,
   e o clarão do ponteiro nasce de dentro dele. A troca não custa nada no tema
   claro: `--map-fundo` também é claro lá, então o véu continua CLAREANDO em vez
   de escurecer, que é a lei do bloco do claro no fim da folha. */
/* 🔴 "COR DO MAPA" ERA O FUNDO DO APP, E POR ISSO O DONO VIU UM AZUL (17/08:
   *"aparece um azul do nada"*). `--map-fundo` é `var(--bg-2)` = `#0a1120`, o
   azul-marinho da CASCA; o chão do mapa de verdade é `#1f1f1f` (o `earth` do
   `style-dark.json`). Escurecer no azul da casca no meio de um mapa cinza é
   exatamente o que ele descreveu: uma tela azul aparecendo do nada.
   `--map-chao` é carimbado pela PONTE lendo o estilo VIVO (§ `carimbarChao`, em
   40-mapa-palcos) — a mesma lei do halo do nome da cena: a cor do chão mora no
   `style-*.json`, e um token igual a ela seria a mesma verdade em dois arquivos.
   O fallback é o de sempre: sem mapa no ar (mock no navegador, estilo que não
   carregou) o véu continua sendo o fundo da casca. */
.gps-veu{position:absolute;inset:0;z-index:18;pointer-events:none;opacity:0;--veu-r:1500px;
  background:radial-gradient(circle at 50% 68%,transparent 0,transparent var(--veu-r),
    var(--map-chao,var(--map-fundo)) calc(var(--veu-r) * 1.25 + 56px))}
/* 🔴 FASE 1 — O VÉU PREENCHE ANTES DE ABRIR (17/08, e é o pedido literal:
   *"Escurece, PREENCHER com cor do mapa, COMECE o efeito"* — três verbos, nesta
   ordem). O que havia aqui era só o terceiro: o véu já nascia ABRINDO (`mvVeu`
   dos 220 aos 620 ms), então ele nunca chegava a ser a tela inteira na cor do
   mapa — era um clarão passando, não um escurecer. Pior: ele abria em cima de
   tudo o mais que já estava acontecendo.
   Agora a fase 1 é CHAPADA: `background` flat na cor do mapa (o gradiente não
   serve aqui — com `--veu-r:0px` ele deixa um buraco macio de 56px no ponto, e
   buraco na cortina mostra a tela de trás no meio do escurecer) e a opacidade
   subindo nos MESMOS 420 ms da camada, com a MESMA curva: as duas fundem como
   uma coisa só.
   O `to` é obrigatório — a regra estática do véu é `opacity:0` (parado ele não
   existe), então um `@keyframes` só com `from` levaria a fase 1 de volta ao
   invisível, que é o contrário do que ela é. */
:root[data-cena="escurece"] .tela.cena.cheio .gps-veu{--veu-r:0px;background:var(--map-chao,var(--map-fundo));
  animation:mvVeuEnche var(--cena-escurece) var(--cv-cena) both}
@keyframes mvVeuEnche{from{opacity:0}to{opacity:1}}
/* 🔴 FASE 2 — E AGORA O CLARÃO É A VIRADA DE FASE, não a cena inteira. Ele abre
   do ponto pra fora (o `--veu-r` crescendo) enquanto a opacidade cai: a cortina
   que preencheu a tela se rasga a partir do ponteiro, e o que aparece por baixo é
   o mapa DE VERDADE já com as ruas começando a crescer. É o "comece o efeito".
   No primeiro quadro desta fase o `background` volta a ser o gradiente e nasce o
   pé de 56px do clarão — o farol do ponteiro acendendo. Isso é de propósito e é o
   único corte seco da fila: ele acontece EXATAMENTE onde o olho já está olhando
   (o ponto), e é o que dá a ele o caráter de coisa que ACENDE em vez de sumir.
   Sem atraso nenhum: a fase é o atraso. */
:root[data-cena="ruas"] .tela.cena.cheio .gps-veu{animation:mvVeu .52s var(--cv-cena) both}
@keyframes mvVeu{from{opacity:1;--veu-r:0px}}

/* 2 — O PONTEIRO, sozinho e em cima do véu (por isso o `z-index` dele passa a
   19: o véu é 18). Sobe com mola e larga UM anel de pouso — o "achei você" do
   GPS. Parado, o anel não existe.
   🔴 ELE É DA FASE 2, NÃO DA 1, e o motivo é o clarão: quem abre o véu é o farol
   DELE (o gradiente nasce no ponto dele), então ele tem que estar lá quando a
   cortina se rasga — mas na fase 1 a tela é só cor, sem cromo e sem ponteiro
   (lei 1). Ele é o PRIMEIRO da fase 2, meio segundo antes das ruas terminarem.
   E na fase 1 ele nem existe: sem esta linha ele ficaria parado por cima da cor
   (z-index 19 contra os 18 do véu), estragando a única coisa que a fase 1 tem. */
:root[data-cena="escurece"] .tela.cena.cheio .gps-puck{opacity:0}
/* (`backwards` pelo mesmo motivo da irmã da troca de modo, § lá em cima: com
   `forwards` o `transform:none` do último quadro fica congelado por cima do
   inline e a ponte perde o ponteiro pro resto da vida da tela.) */
:root[data-cena="ruas"] .tela.cena.cheio .gps-puck{animation:mvPuck .44s var(--cv-mola) .06s backwards}
@keyframes mvPuck{from{opacity:0;transform:scale(.28)}to{opacity:1;transform:none}}
:root[data-cena="ruas"] .tela.cena.cheio .gps-puck::after{animation:mvPouso .54s var(--cv-sai) .16s both}
@keyframes mvPouso{from{opacity:.8;transform:scale(.1)}}

/* 3 — A COBRA. Ordem do dono (07/08): *"primeiro ir desenhando as ruas, tipo
   um labirinto se formando"* → *"uma cobra crescendo, acho q é este o efeito"*.

   NÃO É tudo aparecendo junto e não é fade: é UMA LINHA QUE AVANÇA. Ela nasce
   debaixo do ponteiro, sobe a via principal, VIRA A ESQUINA e segue; cada rua
   menor BROTA dela no instante exato em que a ponta passa no cruzamento, as
   avenidas brotam da primeira rua e as duas ruas do horizonte brotam das
   avenidas. É essa corrente de "quem nasce de quem" que faz o labirinto se
   fechar em vez de piscar inteiro.

   🔴 QUEM MANDA AGORA É O TRAÇO, NÃO O CLARÃO — essa é a inversão que o dono
   pediu. Antes o véu ia até 840 ms e revelava o mapa INTEIRO de dentro pra
   fora; o desenho existia e ninguém via. O véu virou coadjuvante (sai aos
   620 ms) e o palco fica pra cobra.

   COMO CADA TRAÇO É FEITO — dois caminhos no MESMO `d`:
     • o CORPO, `stroke-dasharray:--l` (o comprimento exato do caminho) e o
       `stroke-dashoffset` indo de `--l` até 0: a linha cresce da ponta A pra B.
     • a CABEÇA, `stroke-dasharray:--h --l`: um risco CURTO e aceso, com o
       offset indo de `--h` até `--h - --l`. A conta põe o risco exatamente em
       `[p-h, p]`, ou seja, colado atrás da ponta que está crescendo. Corpo e
       cabeça compartilham `--d`, `--t` e a MESMA curva — é o que mantém os
       dois grudados; curvas diferentes descolariam a cabeça do traço.

   🔴 A CURVA É `linear`, e não é preguiça: a hora de cada galho foi CALCULADA
   como a fração do tronco onde fica o cruzamento (a rua de y=1180 está a
   240/1300 = 18,5% do tronco, logo brota em .26 + .185×.52 = .36 s). Com
   easing essa conta não fecha e a rua nasce antes ou depois do encontro — o
   galho descolado do tronco é justamente o que mata a ilusão da cobra.

   🔴 PARADO É O MAPA PRONTO. O corpo tem `stroke-dashoffset:0` e a cabeça
   `opacity:0` na regra estática, e todo `@keyframes` daqui declara só o
   `from` — animação desligada (Lei 7, `prefers-reduced-motion`, ou o portão
   da casca que congela tudo) mostra o mapa inteiro e cabeça nenhuma. */
/* 🔴 O `blur()` SAIU DAQUI, e é medição, não gosto. Um desfoque animado
   repinta a tela CHEIA a cada quadro, e no g15 esta tela já é a mais cara do
   app. MEDIDO na bancada: a cena inteira roda a 4,8 fps com o blur e o brilho
   ligados, e 7,6 fps sem os dois. A sensação de "mapa assentando" fica por
   conta da ESCALA, que o compositor faz de graça. Lei da casa: enfeite não
   derruba a tela.
   🔴 E O PALCO ASSENTA NA FASE 2, JUNTO COM AS RUAS — um palco só pros DOIS modos
   (17/08). Eram duas regras idênticas, uma em `.dirigindo` e outra em `.plano`,
   com os mesmos dois `@keyframes` e os mesmos atrasos: a diferença entre pousar
   no 3D e pousar no 2D nunca foi o palco, é a CÂMERA (e a câmera é da fase 3, que
   é da ponte). Os atrasos internos saíram porque a fase JÁ é o atraso — quem
   segurava o palco 200 ms era o véu, e hoje o véu é a fase anterior. */
:root[data-cena="ruas"] .tela.cena.cheio .mapa-palco{
  animation:mvMapaFoco .52s var(--cv-cena) both,
            mvMapaAcende .20s linear both}
@keyframes mvMapaFoco{from{transform:scale(1.1)}}
@keyframes mvMapaAcende{from{opacity:0}}
.m-corpo{stroke-dasharray:var(--l);stroke-dashoffset:0}
.m-cabeca{stroke:var(--map-cabeca);opacity:0;
  stroke-dasharray:var(--h) var(--l);stroke-dashoffset:calc(var(--h) - var(--l))}

/* 🔴 A COBRA MORREU, E O MOTIVO É MEDIÇÃO (dono, 09/08: *"ao clicar no navegar
   está bagunçado, 2 efeitos se cruzando, pisca, trava"*).

   Ela desenhava uma rota DE MENTIRA (este SVG) enquanto o mapa de verdade —
   montado, com a fita da rota real já traçada — esperava escondido debaixo
   dela. MEDIDO na bancada, no toque do Navegar: o mapa vivo com opacidade ZERO
   até 2,31 s e o fundido de troca em 2,31 → 2,61 s. Ou seja: o motorista via
   uma rota se desenhar, ela sumia, e OUTRA rota aparecia pronta no lugar. São
   dois mapas contando a mesma história em cima um do outro — é literalmente o
   "2 efeitos se cruzando".

   O que entra no lugar é a lei que esta casa já tinha escrito uma tela antes
   (§ `cenaDasRuas`, ordem do dono em 09/08: *"não remonte coisas, crie DENTRO
   do mapa mesmo"*): as ruas que crescem agora são as ruas DE VERDADE dos
   tiles, no mapa real, por `line-gradient`. Uma cidade só, uma rota só, e nada
   pra cruzar.

   O SVG continua aqui — parado — porque ele é o PALCO DE ESPERA: enquanto o
   maplibre não fica `pronto` (na garagem isso demora), o desenho é o que
   segura a tela em vez do preto do canvas. Sem `pronto` ele aparece; com
   `pronto`, as duas transições de sempre trocam um pelo outro. */

/* ==========================================================================
   🔴 5 — A CENA VALE NOS DOIS MODOS, E AGORA COM UMA REGRA SÓ (17/08 — item 5 do
   dono: *"montar rota acionado, tela de carregamento terminou? escurece a tela
   (da cor original do mapa), entra em full screen, aí entra o efeito que já
   existe e vc tirou, desenhar as rotas, efeitos brilho, depois descendo até o
   efeito 3d"*).

   O efeito nunca foi apagado — ele ficou SEM PORTA. A coreografia inteira estava
   pendurada em `.dirigindo`, e o montar passou a pousar no 2D: a rota era
   montada, a tela trocava, e nada acontecia. A primeira cura (de manhã) foi
   COPIAR o bloco pro `.plano`, com os mesmos `@keyframes` e os mesmos atrasos
   escritos de novo — e peça copiada perde tudo o que a original ganha depois.

   O QUE FICOU NO LUGAR DAS DUAS CÓPIAS: nada aqui. As regras da cena subiram pra
   fila e não citam mais o modo — o véu, o palco, o ponteiro e o cromo são os
   MESMOS seletores pros dois pousos (`.gps-veu`, `.mapa-palco`, `.gps-puck`, e a
   lista da fase 4). A diferença entre pousar no 3D e no 2D virou UMA coisa, e ela
   não é da folha: no 2D não existe fase `descida` (não há câmera pra descer), a
   fila vai de `ruas` direto pra `pronto` — quem decide isso é a ponte, que é quem
   sabe se vai haver `easeTo` (§ lei 5 da fila).

   As RUAS crescendo com brilho não estão aqui: elas nascem no mapa DE VERDADE,
   por `line-gradient` (§ `cenaDasRuas`, na ponte, motivos 'rota' e 'navegar') —
   a lei de 09/08, *"não remonte coisas, crie DENTRO do mapa mesmo"*. O SVG desta
   folha é só o palco de espera de quem ainda não tem tile.
   ========================================================================== */

/* ==========================================================================
   🔴 A SAÍDA É A ENTRADA AO CONTRÁRIO — e é a MESMA folha (dono, 09/08: *"remova
   o efeito de sair, é o antigo, e faça o inverso do q foi feito no 1"*).

   Nenhum `@keyframes` novo aqui embaixo: são os mesmos da abertura com
   `reverse`. O logo desce do cabeçalho pro meio (o `mvLogoVoa` de volta, com as
   MESMAS variáveis `--dx/--dy/--esc` que a entrada mediu), o X se desmonta nas
   duas hastes, as letras descem e a barra esvazia. Cena de fechar com desenho
   próprio seria uma segunda marca — e duas marcas discordam no dia seguinte.

   A ORDEM importa e é a inversa: primeiro o VOO (0 → 0,62 s), e só quando a
   marca está no meio da tela ela se desmancha (0,62 s em diante).

   🔴 E A INVERSA MUDOU JUNTO COM A ENTRADA (dono, 10/08: *"tem q ser IDÊNTICOS"*).
   Na entrada a ordem é H → B → haste-a → haste-b → X → brilho → LOGÍSTICA. Aqui
   ela roda de trás pra frente, item por item: LOGÍSTICA recolhe → o X larga o
   glifo e vira haste → a haste-b sai (foi a última a chegar) → a haste-a sai →
   o B desce (foi o último a subir) → o H desce → o palco apaga. Fila trocada em
   um dos dois lados é o que faz a saída parecer "outra cena".
   ========================================================================== */
.tela.entra.saida{animation:mvScrim .34s ease-out both!important}
.tela.sai.saida{animation:trApaga .3s ease both!important}
/* o voo de volta: começa lá em cima, no tamanho do cabeçalho, e assenta no meio */
.tela.entra.saida .splash-logo{animation:mvLogoVolta .62s var(--cv-entra) both}
@keyframes mvLogoVolta{from{transform:translate(var(--dx,0px),var(--dy,-380px)) scale(var(--esc,.55))}}
/* o resto da marca só existe DEPOIS que ela pousa: na entrada eles somem no fim,
   aqui eles voltam antes de tudo se desmanchar. */
.tela.saida .splash-fundo{animation:spFundo 1.7s var(--cv-entra) both}
.tela.saida .splash-anel,.tela.saida .splash-barra{animation:mvSai .3s var(--cv-sai) reverse both}
/* AGORA o inverso do 1: o X larga o glifo e vira as duas hastes de novo, que
   voam pra fora pelos mesmos caminhos por onde vieram. */
.tela.saida .splash-logo small{animation:spLetras .34s var(--cv-entra) .58s reverse both}
.tela.saida .splash-logo .w em{animation:spAcende .22s ease .62s reverse both}
.tela.saida .splash-xis{animation:spHastesSaem .18s var(--cv-sai) .62s reverse both}
.tela.saida .splash-flash{animation:spFlash .38s ease-out .7s both}
/* a haste-b chegou POR ÚLTIMO na entrada, então é a PRIMEIRA a ir embora */
.tela.saida .splash-xis .haste-b{animation:spHasteB .3s var(--cv-entra) .86s reverse both}
.tela.saida .splash-xis .haste-a{animation:spHasteA .3s var(--cv-entra) .94s reverse both}
.tela.saida .splash-xis .rastro.haste-b{animation-delay:.92s}
.tela.saida .splash-xis .rastro.haste-a{animation-delay:1s}
/* e só com o X desfeito as letras descem — o B primeiro, que subiu por último */
.tela.saida .splash-logo .w b:nth-of-type(2){animation:spSobe .24s var(--cv-mola) 1.26s reverse both}
.tela.saida .splash-logo .w b:nth-of-type(1){animation:spSobe .24s var(--cv-mola) 1.34s reverse both}
.tela.saida .splash-barra i{animation:spCarrega .8s var(--cv-entra) .6s reverse both}
/* e o palco apaga por último, quando não sobrou marca nenhuma.
   🔴 O FIM CONTINUA EM 1,66 s, e isso é um TETO, não um gosto: o Kotlin fecha o
   app 2,7 s depois de pedir a saída (`MainActivity.avisarOuSair`) e o reverso do
   mapa come até 1,0 s antes desta cena começar. Cena de saída que passa daqui é
   cena cortada no meio pelo processo morrendo. */
.tela.saida .splash{animation:trApaga .26s ease 1.4s both}

/* ==========================================================================
   FOLHA (bottom sheet) — sobe de baixo, o fundo escurece junto (lei 6).
   ========================================================================== */
/* 🔴 A FOLHA SOBE UMA VEZ SÓ — QUANDO A TELA ENTRA (dono, 12/08, na Folha da
   venda: *"alternar botões, a tela fica subindo novamente: dinheiro, pix, cartão
   e marcar"*).
   O seletor era `.tela .sheet`, sem a marca `entra` — e regra de ENTRADA presa
   só ao `.tela` alcança TODA camada, inclusive a que nasce de um repinte. Cada
   toque na forma de pagamento é uma escrita no seam (`repintarFolha`), o
   `pintar()` monta uma camada NOVA, e o `.sheet` recém-nascido tocava `mvFolha`
   (translateY(100%) → 0) do quadro ZERO: a folha inteira descia e subia de novo
   na cara de quem estava escolhendo como o cliente pagou. MEDIDO antes da cura,
   60 ms depois do toque: folha a 205px do fundo e scrim em 0,36 — em vez de
   pousada e o fundo cheio. O scrim carregava o mesmo defeito, então o fundo
   piscava junto.
   É a MESMA cura de 08/08 ("camada nova nasce PARADA, e nascer parada é nascer
   sem `entra`") e de 11/08 (o pisca do cancelar): ela só não tinha alcançado a
   folha, porque estas duas linhas não passavam pela marca. Sem animação o estado
   é o do CSS — `transform:none` e opacidade cheia, exatamente o `to` dos dois
   keyframes —, então a folha simplesmente FICA onde está.
   Dentro da entrada nada muda: a camada herdeira veste `entra` (§`herdando`) e o
   carimbo de `currentTime` continua a subida de onde ela estava. */
.tela.entra .sheet{animation:mvFolha var(--mv-folha) var(--cv-entra) both}
.tela.entra .scrim{animation:mvScrim var(--mv-normal) ease-out both}
@keyframes mvFolha{from{transform:translateY(100%)}to{transform:none}}
@keyframes mvScrim{from{opacity:0}to{opacity:1}}
/* 🔴 O VÉU TEM UM QUADRO PRÓPRIO PRA SAIR, E ISSO ERA A PISCADA DE TODO DIÁLOGO
   DA CASA (17/08 — MEDIDO no g15 via DevTools, amostrando `opacity` por quadro).
   O `fechar()` pedia a saída REAPROVEITANDO o nome de entrada
   (`mvScrim … reverse`), e animação de CSS é casada por NOME+índice: pedir
   `mvScrim` de novo não cria animação nova, ATUALIZA a que já existe — e a de
   entrada já terminou. Com o relógio dela além do fim e `reverse`, o valor
   congelado passa a ser o `from` (opacidade 0): o véu ia a ZERO no primeiro
   quadro, sem fundido nenhum. Medida: `scrim=0.00` já aos 19 ms, contra a caixa
   descendo 1.00 → 0.43 em 200 ms do lado dela.
   Era isso que o dono via como "pisca": o diálogo do cancelar sumindo de uma vez
   e a tela de trás acendendo de estalo (medido na gravação: a tarja de manobra
   saltando de luma 29,0 pra 44,3 em UM quadro).
   Nome PRÓPRIO conserta pela raiz — nome que nunca rodou neste nó é sempre
   animação nova, então ela começa do 1 e desce. Vale pros CINCO véus que passam
   pelo `fechar()` (`.erro-wrap`, `.conf-wrap`, `.portao-wrap`, `.chegou-wrap`,
   `.chat-wrap`): um quadro, cinco superfícies. Mesma lei do `.saindo`, que já
   fazia certo com `mvSai` — nome só de saída, e por isso a CAIXA nunca piscou. */
@keyframes mvScrimSai{from{opacity:1}to{opacity:0}}
@keyframes mvPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

/* ==========================================================================
   ERRO — lei 5: entra na cara. Cresce com ultrapassagem e SACODE.
   ========================================================================== */
.erro-wrap{position:absolute;inset:0;z-index:60;display:grid;place-items:center;padding:0 22px;
  background:rgba(4,7,13,.72);animation:mvScrim 160ms ease-out both}
.erro{
  width:100%;background:var(--red-bg-2);border:.7px solid var(--red-line-2);border-radius:16px;padding:16px 15px 14px;
  box-shadow:0 20px 50px rgba(0,0,0,.6);text-align:center;
  animation:mvErro 320ms var(--cv-mola) both, mvSacode 340ms 300ms both;
}
.erro .ico{width:44px;height:44px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;
  background:var(--danger-ico-bg);color:var(--danger-ico);animation:mvPop var(--mv-normal) var(--cv-mola) .1s both}
.erro strong{display:block;font-size:16px;font-weight:500;animation:trItem .3s var(--cv-entra) .16s both}
.erro .sub{display:block;font-size:12.5px;color:var(--ink-2);margin-top:4px;animation:trItem .3s var(--cv-entra) .22s both}
.erro .acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;
  animation:trItem .3s var(--cv-entra) .28s both}
.erro .acoes button{height:40px;border-radius:11px;border:.7px solid var(--line-2);background:var(--card);
  color:var(--ink);font-size:13.5px;cursor:pointer}
.erro .acoes .principal{background:var(--danger-btn);border-color:var(--danger-btn);color:var(--white)}
@keyframes mvErro{from{opacity:0;transform:scale(.84)}to{opacity:1;transform:none}}
/* 🔴 O TREMOR ANDA EM `translate`, NUNCA em margin nem em transform: margin é
