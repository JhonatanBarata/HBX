/* O cartão: coordenada e endereço, escritos debaixo do ponto. Ele mora DENTRO
   do mapa vivo (o nó que é transplantado de palco em palco), nunca no palco —
   palco morre a cada repinte e levaria a cena junto. */
.cena-eu{position:absolute;left:50%;top:50%;margin-top:28px;z-index:5;
  transform:translateX(-50%);pointer-events:none;text-align:center;
  animation:empSurge 200ms ease both}
.cena-eu.saindo{animation:trApaga 300ms ease forwards}
/* 🔴 `display:table` E NÃO `block`: o clip corta a CAIXA, e caixa de bloco é
   larga como a linha mais comprida das duas — a curta começaria a aparecer do
   vazio à esquerda em vez de da primeira letra. `table` encolhe no texto. */
.cena-eu b,.cena-eu i{display:table;margin:0 auto;white-space:nowrap;overflow:hidden;
  text-shadow:0 1px 4px var(--map-fundo);
  animation:empDigita calc(var(--n,1)*66ms) steps(var(--n,1),end) var(--atraso,0s) both}
.cena-eu b{font:500 12px Inter,sans-serif;color:var(--ink);letter-spacing:.04em}
.cena-eu i{font:400 12px Inter,sans-serif;font-style:normal;color:var(--ink-2);margin-top:3px}
.gps-mundo{position:absolute;left:-42%;right:-42%;top:-52%;bottom:-6%;
  transform:perspective(640px) rotateX(51deg);transform-origin:50% 74%}
.gps-mundo svg{width:100%;height:100%;display:block}
/* Névoa do horizonte: sem ela a borda do mapa aparece como um corte reto no
   meio da tela — é o detalhe que denuncia mapa falso. */
.gps-horizonte{position:absolute;left:0;right:0;top:0;height:44%;pointer-events:none;
  background:linear-gradient(180deg,var(--fog) 22%,rgba(7,13,24,.72) 58%,transparent)}

/* z-index 19 e não 12: o VÉU da cena de entrada é 18, e o ponteiro tem que
   surgir EM CIMA dele — é ele quem existe primeiro. Continua abaixo da
   manobra e do rodapé (20), que é onde eles têm que ficar. */
/* 🔴 COLADO NO RODAPÉ, NÃO NUMA PORCENTAGEM (11/08). A ordem do dono continua a
   mesma do V4 — "o ponteiro tem q ficar COLADO NO BOTTOM, igual gps comum",
   repetida em 09/08 ("a seta tem q descer, ficar mais embaixo") —, mas o `86%`
   que a cumpria media a TELA enquanto o rodapé mede em PIXEL: os dois só se
   encostavam por coincidência, e a coincidência acabou quando o rodapé cresceu.
   Hoje a seta pousa no `--gps-piso` como as outras peças de beirada. Os 22,5px
   são METADE da altura dela (`.gps-seta`, 45px): o `bottom` posiciona o PONTO do
   motorista, e o que tem que encostar no chão é a CAUDA.
   🔴 E A PONTE NÃO GUARDA MAIS CÓPIA DESTE NÚMERO. Ela MEDE o `.gps-puck` na
   tela (`ancoraDoPuck`) pra recuar a câmera — escrever a mesma âncora em dois
   lugares foi o que já deixou a câmera mirando um palmo acima da seta, e com
   `bottom` em px não haveria nem como repetir o valor do outro lado.
   🔴 E ELE NÃO PEGA TOQUE. O puck tem tamanho 0, mas os filhos NÃO: o facho é
   uma caixa de 104×118 px bem no meio da tela e engolia todo arrasto que
   começasse ali — o mapa parecia travado justamente onde a mão cai primeiro.
   Ponteiro é DESENHO: quem manda no dedo, aqui, é o mapa. */
.gps-puck{position:absolute;left:50%;top:auto;
  bottom:calc(var(--gps-piso) + var(--gps-puck-sobe) + 22.5px);
  width:0;height:0;z-index:19;pointer-events:none}
.gps-puck::before{content:"";position:absolute;left:-36px;top:-36px;width:72px;height:72px;
  border-radius:50%;background:var(--puck-vidro);border:.7px solid var(--puck-vidro-fio);
  box-shadow:0 7px 20px rgba(0,0,0,.42)}
/* O ANEL DE POUSO: sai do ponteiro no instante em que ele assenta. Parado ele
   não existe (opacidade 0) — é peça de cena, não de tela. */
.gps-puck::after{content:"";position:absolute;left:-90px;top:-90px;width:180px;height:180px;
  border-radius:50%;border:1.5px solid var(--puck-anel);opacity:0;pointer-events:none}
/* 🔴 O PULSO DA BORDA NASCEU E MORREU NO MESMO DIA (17/08). Ele foi pedido
   ("ela pulsa quando tem ação, movimento") e o dono o reprovou VENDO na tela:
   *"remover a borda pulsando apenas, ficou feio"*. Fica o registro pra ninguém
   propor de novo: o anel continua sendo peça de CENA (o pouso), e a tela de
   dirigir não ganha enfeite em laço. */
/* O facho é um CONE recortado, não um gradiente cônico: o `conic-gradient`
   pintava um retângulo azul na frente da seta (visível no claro, horrível).
   Recorte em polígono garante a forma; o gradiente só dá a queda de luz.
   🔴 CRESCEU 18% junto com a seta (ordem do dono: "o ponteiro um pouco
   MAIOR"). O pé do cone continua no mesmo lugar — 8px abaixo do ponto do
   motorista: o que cresce é o alcance da luz, não a posição dele na rua. */
.gps-facho{position:absolute;left:-52px;top:-110px;width:104px;height:118px;
  background:linear-gradient(180deg,rgba(91,157,255,0),rgba(91,157,255,.30) 78%,rgba(91,157,255,.34));
  clip-path:polygon(50% 100%, 4% 0%, 96% 0%);filter:blur(2px)}
/* 34x38 → 40x45 px: 18% maior, e "um pouco" é isso — o ponteiro ganha
   presença sem tapar a manobra nem o traço da rota. */
.gps-seta{position:absolute;left:-20px;top:-22.5px;width:40px;height:45px;
  z-index:1;filter:drop-shadow(0 3px 7px rgba(0,0,0,.65))}
/* 🔴 O DEDO PEGOU O MAPA (08/08 — dono: "se vc movimenta o mapa, a seta fica
   travada"). Seguindo o motorista, o ponteiro fica PARADO na tela e quem anda
   é o mundo — é o certo, e é uma seta só. Com o dedo levando o mapa embora
   isso vira mentira: a seta seguiria pregada no vidro apontando pra um lugar
   onde ele não está.
   Solta, ela deixa de ser posição de TELA e passa a ser posição de MAPA: a
   ponte projeta o ponto de verdade e escreve em `--px/--py`, exatamente como
   já faz com os prédios do prospector. Mesma peça, mesmo facho, mesmo anel —
   muda só quem decide onde ela mora. */
/* 🔴 E ISTO VALE AGORA NAS DUAS FASES — a seta é peça do MAPA sempre (17/08,
   dono: *"a seta muitas vezes fica deslocada e encaixa depois; fixar na ponta do
   caminho, igual GPS funciona"*). Seguindo o motorista ela também sai do vidro:
   a câmera leva 900 ms pra chegar no ponto novo e, pregada na tela, a seta só
   reencontrava a ponta do traço no fim da animação.
   🔴 O `left/top` COM `--px/--py` MORREU, e a troca é o que faz a coisa parar de
   pé: quem move a seta agora é um `transform: translate()` escrito pela ponte
   (§ `puckNaRua`). O motivo é a CÂMERA — ela mira na âncora medindo o `bottom`
   COMPUTADO desta regra (§ `ancoraDoPuck`), e `bottom:auto` apagava justamente o
   número que ela lê; com `top`, a seta que a câmera moveu viraria a âncora da
   câmera. `transform` não mexe em estilo computado: a âncora fica firme no
   desenho e a peça viaja por cima dela. O `.solta` continua existindo como
   ESTADO (o dedo pegou o mapa) — só não é mais ele quem posiciona. */

/* 🔴 O CARTÃO CRESCEU 15% (11/08 — dono: *"400m a direita tá ok, pode aumentar
   um pouco, av 25, depois continue na rua 2 (ilegível dirigindo) — aumente um
   pouco tudo em 15% (aproveite mais o espaço)"*). Tudo aqui subiu junto, na
   mesma proporção: seta 48→55, distância 22→25,5, verbo 15→17,5, a tira de
   baixo 11,5→13,5 e os respiros de 11/13/7 pra 13/15/8. Aumentar SÓ a fonte
   deixaria o texto batendo na borda — quem lê a 40 km/h lê a MANCHA, e mancha
   apertada é o mesmo ilegível com letra maior.
   O "aproveite mais o espaço" são as beiradas: 9→8px de cada lado, e é isso que
   paga a letra grande sem empurrar a segunda linha.
   🔴 A TIRA DE BAIXO NÃO PODE QUEBRAR. Ela carrega NOME DE RUA, que é dado e não
   tem teto — e a altura deste cartão é o teto da bússola (o `top` dela é número
   escolhido, logo abaixo). Rua comprida quebrando em duas linhas engorda o
   cartão e a bússola sobe por cima dele: é o mesmo defeito de 10/08 do rodapé,
   com outra roupa. Uma linha, sempre, e o que não couber vira "…". */
.gps-manobra{position:absolute;left:5px;right:5px;top:6px;z-index:20;border-radius:19px;
  background:var(--card);border:.7px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.5);overflow:hidden}
.gps-manobra .cima{display:flex;align-items:center;gap:13px;padding:9px 15px}
.gps-manobra .seta{width:57px;height:50px;border-radius:0;background:transparent;color:var(--ink);
  display:grid;place-items:center;flex:0 0 57px}
.gps-manobra .seta svg{width:48px;height:48px}
.gps-manobra .seta svg path{stroke-width:3.2}
.gps-manobra .dist{display:block;font-size:24px;font-weight:650;line-height:1.05;letter-spacing:-.02em;color:var(--lime)}
.gps-manobra .dist i{font:inherit;font-style:normal}
.gps-manobra .verbo{display:block;font-size:19px;font-weight:500;color:var(--ink);margin-top:3px}
/* `display:block` e não flex: o "…" precisa de uma CAIXA DE TEXTO pra acontecer
   — num flex a tira é um item anônimo e o corte sairia seco, sem as reticências
   que avisam que tem mais rua ali. O ícone da tela "Você chegou" (o único
   elemento que entra nesta tira) volta a alinhar pelo `vertical-align`. */
.gps-manobra .baixo{display:block;padding:7px 15px 8px;border-top:.7px solid var(--line);
  background:var(--glass);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gps-manobra .baixo b,.gps-manobra .baixo small{display:block;overflow:hidden;text-overflow:ellipsis}
.gps-manobra .baixo b{font-size:14px;font-weight:650;color:var(--ink)}
.gps-manobra .baixo small{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.gps-manobra .baixo svg{vertical-align:-2px;margin-right:2px}
/* 🔴 `.gps-manobra.chegou` MORREU NO LOTE 3 (15/08): o "Você chegou" não é
   mais um estado do cartão de manobra — é a peça `.chegou-wrap` (acima),
   igual nos dois palcos. O par lima/dist virou `.chegou-cartao .seta`/`.dist`. */

/* 🔴 O TOPO DA BÚSSOLA É REFÉM DA ALTURA DO CARTÃO DA MANOBRA. Ela tem o MESMO
   `z-index` dele e é pintada DEPOIS, então qualquer sobreposição é ela por cima
   do canto do cartão. Era 114 quando o cartão media 6 + 99,6px; com o cartão 15%
   maior (11/08) ele passou a terminar em 124 (medido) e este número subiu junto — quem
   mexer no cartão MEDE de novo com `node scripts/prova-encaixe-gps.js`, que é o
   portão que reprova essa colisão. Ela não desce mais que o necessário pra não
   invadir o mapa. */
.gps-bussola{position:absolute;right:11px;top:139px;z-index:20;width:46px;height:46px;border-radius:50%;
  background:var(--glass);border:.7px solid var(--line);display:grid;place-items:center;color:var(--ink-2);font-size:11px}
/* O SELO DO RETRAÇO — "Redirecionando…". Só existe enquanto a ponte pede
   caminho novo FORA do traçado: fora disso é invisível e não pega toque. A
   mesma família de vidro do .emp-chip, no CENTRO da faixa dos avisos (o chip
   fica no canto esquerdo, a bússola no direito). z-index 19: acima do véu (18),
   ABAIXO do cartão da manobra (20) — aviso nunca cobre instrução. Quem liga é
   a classe .on (posta pela ponte, nunca pelo seam); a entrada é um respiro de
   opacity+transform que a Lei 7 já desliga pra quem pediu menos movimento. */
.gps-redir{position:absolute;left:50%;top:112px;z-index:19;padding:6px 12px;border-radius:999px;
  background:var(--glass);border:.7px solid var(--line);font-size:12px;color:var(--ink-2);
  pointer-events:none;opacity:0;transform:translate(-50%,-6px);
  transition:opacity .22s ease,transform .22s ease}
.gps-redir.on{opacity:1;transform:translate(-50%,0)}
/* 🔴 AS PEÇAS DA BEIRADA CRESCERAM (11/08 — dono: *"velocímetro, ícones chat som
   e centralizador estão pequenos"*). Elas são o cromo que se lê e se aperta EM
   MOVIMENTO: 56→72 no velocímetro e 40→52 nos botões põe o alvo acima dos 48px
   de toque confortável e deixa o número legível de relance. Elas continuam
   pousando no `--gps-piso`, então o crescimento sobe — não invade o rodapé. */
/* 🔴 O `scale:.9` MORREU AQUI E NA COLUNA (16/08). Ele fazia a folha mentir: o
   CSS dizia 120×126 e a tela entregava 108×113,4 — e foi por isso que ninguém
   percebeu que o 2D (44px) e o 3D (52px no papel) eram peças de tamanhos
   diferentes. O valor medido virou o valor escrito, e ele mora em token porque
   o aviso de radar pousa em cima do velocímetro e precisa da altura dele. */
.gps-vel{position:absolute;left:var(--map-beira);bottom:var(--map-piso);z-index:20;
  width:var(--map-vel-l);height:var(--map-vel-h);border-radius:17px;
  background:var(--vel-bg);border:.7px solid var(--vel-fio);text-align:center;line-height:1;
  box-shadow:0 10px 24px rgba(0,0,0,.46)}
/* Os internos vieram do mundo escalado: cada medida daqui é a de antes × .9,
   pra que tirar o `scale` mude a FOLHA e não a tela (11→10, 16→14, 45→40,
   34→31, 18→16). Quem conferir com régua no palco acha os mesmos pixels. */
.gps-vel::before{content:"";position:absolute;inset:8.5px;border:2px dotted var(--vel-trilho);border-radius:12px}
.gps-vel::after{content:"";position:absolute;inset:8.5px;border:3px solid transparent;border-right-color:var(--vel-acima-ink);
  border-bottom-color:var(--vel-acima-ink);border-radius:12px;clip-path:polygon(52% 46%,100% 46%,100% 100%,52% 100%);display:none}
/* 🔴 O NÚMERO NO CENTRO DO DISCO, E O "km/h" FORA DO FLUXO (12/08 — dono:
   *"centralize o número do velocímetro, está muito pra cima"*). O par número+
   unidade JÁ era centralizado como GRUPO (medido: folga 8,5 px em cima e
   embaixo, idêntica) — o que subia era o NÚMERO, porque a unidade pendurada
   embaixo empurra o miolo do grupo pra cima: o centro do "72" caía **14,5 px
   acima** do centro do disco, 20% do diâmetro. Quem lê a 60 km/h lê o NÚMERO,
   e é ele que tem que estar no meio. Tirando o `small` do fluxo, o grid volta a
   ter UM item e o centraliza exato; a unidade vira legenda ancorada no pé, na
   parte larga do círculo (folga medida: 64 px de corda na altura dela).
   Sem unidade (o mock a torna opcional) o número continua centrado — antes
   também ficava, e essa era a única hora em que ficava. */
.gps-vel b{position:absolute;left:0;right:0;top:26px;display:block;font-size:34px;font-weight:650;color:var(--ink)}
.gps-vel small{position:absolute;left:0;right:0;bottom:13.5px;display:block;
  font-size:11px;color:var(--ink-2);text-align:center}
.gps-vel .limite-via{position:absolute;right:-9px;top:-10px;z-index:2;display:grid;place-items:center;
  width:30px;height:30px;border-radius:50%;background:var(--radar-lim-bg);color:var(--radar-lim-ink);
  border:3.4px solid var(--radar-lim-fio);font-size:14.5px;font-weight:750;font-style:normal;
  box-shadow:0 5px 12px rgba(0,0,0,.38)}
.gps-vel .limite-via:empty{display:none}
/* 🔴 O VELOCÍMETRO ACIMA DO LIMITE DO RADAR (12/08, F3). Estado, não peça nova:
   é o MESMO disco, com a classe `acima` posta direto no nó pela ponte enquanto
   houver radar COM limite a menos de 600 m À FRENTE e a velocidade estiver
   acima dele. Fora dessa janela ele volta a ser o velocímetro de sempre.
   O seletor começa em `.gps` de propósito: `[data-luz="claro"] .gps-vel` (a
   lista do vidro, mais abaixo) empata em especificidade com `.gps-vel.acima` e
   vem DEPOIS no arquivo — sem o `.gps` na frente, o alarme sumia no tema claro
   e ninguém veria.
   🔴 E É TROCA SECA, SEM TRANSIÇÃO — por duas razões que apontam pro mesmo
   lado. Quem passou do limite precisa ver AGORA, não daqui a 180 ms; e uma
   transição de `background-color` faz o `getComputedStyle` do fiscal ler a cor
   VELHA no quadro em que a classe entra (medido: 1,00:1 no claro, branco sobre
   branco), então o contraste deixaria de ser mensurável — cor que não se mede
   é cor que ninguém garante. */
.plano .gps-vel.acima,.gps .gps-vel.acima{background:var(--vel-acima-bg);border-color:var(--vel-acima-fio)}
.plano .gps-vel.acima b,.gps .gps-vel.acima b{color:var(--vel-acima-ink)}
.plano .gps-vel.acima::after,.gps .gps-vel.acima::after{display:block}
/* 🔴 O CHIP DO RADAR: nó PERMANENTE e inerte, irmão do selo do retraço — quem o
   acende é a ponte (classe `on`), e o repinte da camada o devolve apagado, que
   é o estado seguro. Ele pousa ACIMA do velocímetro, no mesmo `--gps-piso` (72
   px do disco + 10 de respiro): o limite do radar e a velocidade do carro são a
   MESMA pergunta, e o olho responde as duas sem varrer a tela. Fica longe do
   cartão da manobra (topo) e do chip do prospector (`.emp-chip`, canto de
   cima) — aviso nunca cobre instrução. `.lim` some quando o radar não traz
   limite: número inventado é pior que nenhum número. */
/* 🔴 O 136px CRAVADO VIROU CONTA (16/08): ele era a altura do velocímetro na
   tela (113) + 23 de respiro, escrito à mão — número que se descola sozinho na
   primeira vez que o disco muda de tamanho, que é exatamente o defeito que a
   régua do cromo veio matar. Agora ele PERGUNTA a altura. */
.gps-radar{position:absolute;left:var(--map-beira);bottom:calc(var(--map-piso) + var(--map-vel-h) + 23px);z-index:20;
  display:flex;align-items:center;padding:6px 11px;border-radius:999px;
  background:var(--radar-bg);border:.7px solid var(--radar-fio);color:var(--radar-ink);
  font-size:11px;font-weight:700;letter-spacing:.05em;line-height:1;text-transform:uppercase;
  pointer-events:none;opacity:0;transform:translateY(6px);
  transition:opacity .22s ease,transform .22s ease}
.gps-radar.on{opacity:1;transform:translateY(0)}
/* 🔴 A REGRA DESTA COLUNA MORA LÁ EM CIMA, JUNTO COM A DO 2D (`.plano-lado,
   .gps-lado`) — é a peça única da régua do cromo. Aqui sobra só o z-index, que
   é o desta tela: no 3D o cromo disputa camada com a fita e o puck do mapa. */
.gps-lado{z-index:20}
/* voz desligada: o botão continua ali, apagado — quem silenciou precisa ver
   COMO religar, e trocar o ícone por um "sem som" seria vocabulário novo.
   Vale nos DOIS modos: quem silencia a voz no 2D e entra no 3D tem que achar o
   mesmo botão no mesmo estado — chave do aparelho, não estado da tela. */
.plano-lado button.mudo,.gps-lado button.mudo{opacity:.45}
/* 🔴 O CADEADO DO FIM DO DIA (16/08), o mesmo azul do satélite `tmx-info` que
   ele era até hoje de manhã: a cor viaja junto com o botão quando ele muda de
   fileira, senão o motorista aprende o verbo de novo a cada tela. Azul e não
   vermelho de propósito — encerrar o dia é o fim NORMAL do trabalho, e pintá-lo
   da cor do Cancelar ensinaria que fechar e destruir são a mesma coisa. */
.plano-lado button.fechar,.gps-lado button.fechar{color:var(--blue-l);border-color:#26436e}

/* 🔴 QUEM MEXER AQUI REFAZ O `--gps-rodape-h` LÁ EM CIMA. A altura deste rodapé
   é o chão de TODAS as peças flutuantes da tela de dirigir — seta, velocímetro
   e a coluna de botões pousam nele. Ele é `height:auto`, então CSS nenhum
   percebe quando ele cresce: em 10/08 ele ganhou a linha dos atalhos, engordou
   41px e a tela ficou 1 mês com a cauda da seta escondida atrás dele.
   A conta de hoje (Roboto, aparelho): .7 borda + 9 topo + [14,06 da .parada +
   8 de margem] + 32,01 da linha dos números + [9 de margem + 42 da linha dos
   atalhos] + 12 de base = 126,77px. `--gps-rodape-h` guarda 128. */
.gps-rodape{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--glass);
  border-top:.7px solid var(--line);padding:9px 12px 12px}
/* 🔴 ESTA LINHA NÃO PODE QUEBRAR (11/08). Ela carrega o NOME DO CLIENTE, que é
   dado de cadastro e não tem tamanho: "Supermercado Nossa Senhora Aparecida
   Ltda ME" quebrava em duas e engordava o rodapé em 16px — e o rodapé é o CHÃO
   de toda peça flutuante da tela, então a cauda da seta voltava pra trás dele
   em aparelho estreito. Altura de rodapé que depende do DADO é o mesmo defeito
   de 10/08 com outra roupa. Uma linha, sempre, e o que não couber vira "…":
   é o mesmo tratamento que o `.atalho b` daqui de baixo já dá ao rótulo dele.
   O `min-width:0` é obrigatório — item de flex não encolhe abaixo do conteúdo
   sem ele, e o corte nunca aconteceria. */
.gps-rodape .parada{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);margin-bottom:8px;
  white-space:nowrap}
.gps-rodape .parada .txt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.gps-rodape .parada b{color:var(--ink);font-weight:500}
.gps-rodape .linha{display:flex;align-items:center;gap:10px}
.gps-rodape .n{flex:1;text-align:center}
.gps-rodape .n b{display:block;font-size:17px;font-weight:500;line-height:1.1}
.gps-rodape .n small{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
.gps-rodape .n.destaque b{color:var(--lime)}
.gps-rodape .sair{height:42px;padding:0 15px;border-radius:12px;border:.7px solid var(--red-line-2);background:var(--red-bg);
  color:#ff8b85;font-size:13.5px;cursor:pointer}
/* A LINHA DAS AÇÕES (10/08). Os números ficam na linha de cima; aqui embaixo
   só o que se aperta. Os dois atalhos dividem o espaço por igual e o Sair
   mantém a largura do texto dele — ele não é "mais um atalho", é a saída, e
   continua com a cara vermelha que já tinha. */
.gps-rodape .linha.acoes{margin-top:9px;gap:8px}
.gps-rodape .atalho{flex:1;min-width:0;height:42px;display:flex;align-items:center;justify-content:center;gap:7px;
  border-radius:12px;border:.7px solid var(--line-2);background:var(--card);color:var(--ink);
  font-size:13.5px;cursor:pointer;padding:0 10px}
.gps-rodape .atalho b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gps-rodape .atalho svg{flex:none;color:var(--ink-2)}

/* O RODAPÉ DA NAVEGAÇÃO VESTE O CARTÃO ÚNICO APROVADO EM 12/08. A tela de
   chegada continua com o rodapé operacional dela; só a cena `.dirigindo`
   recebe esta composição. As três funções ficam expostas na mesma faixa: não
   existe seta, menu ou segundo toque escondendo Registrar e Sair. */
/* 🔴 E O 2D COM ROTA MONTADA VESTE O MESMÍSSIMO PAINEL (17/08 — itens 2 e 8 do
   dono: a tira de indicadores nos dois modos e o painel de 4 botões nos dois
   modos). É a MESMA regra, com o seletor do 2D pendurado nela: dois seletores
   sobre uma declaração é o que garante que ninguém conserte um modo e esqueça o
   outro. Antes o 2D usava `.tmx-dock` — faixa opaca de largura cheia, cravada em
   `bottom:60px` (a altura das ABAS) — e em tela cheia, sem abas, ele flutuava
   60px acima do pé: a fileira do 2D ficava ~55px mais alta que a do 3D. Duas
   fileiras que não se encontram é o "pisca tudo" do item 4 com outro nome. */
.gps.dirigindo .gps-rodape,.plano.com-rodape .gps-rodape{left:4px;right:4px;bottom:4px;border:.7px solid var(--line);border-radius:20px;
  padding:11px 11px 10px;background:var(--glass);box-shadow:0 10px 28px rgba(0,0,0,.46)}
.gps.dirigindo .gps-rodape .parada,.plano.com-rodape .gps-rodape .parada{display:none}
.gps.dirigindo .gps-rodape .linha.indicadores,.plano.com-rodape .gps-rodape .linha.indicadores{gap:8px}
.gps.dirigindo .gps-rodape .n,.plano.com-rodape .gps-rodape .n{display:flex;align-items:center;justify-content:center;gap:8px;text-align:left}
.gps.dirigindo .gps-rodape .n .gps-kpi-ico,.plano.com-rodape .gps-rodape .n .gps-kpi-ico{display:grid;place-items:center;flex:none;color:var(--lime)}
.gps.dirigindo .gps-rodape .n b,.plano.com-rodape .gps-rodape .n b{font-size:16px;font-weight:650;color:var(--ink);white-space:nowrap}
.gps.dirigindo .gps-rodape .n small,.plano.com-rodape .gps-rodape .n small{font-size:10.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap}
.gps.dirigindo .gps-rodape .n.destaque b,.plano.com-rodape .gps-rodape .n.destaque b{color:var(--ink)}
/* 🔴 `.gps-encerrar` MORREU EM 16/08 — eram 6 regras e 3 larguras em fração
   (`flex:1 / 1 / 1.45`) mantidas à mão contra o comprimento do rótulo, num
   `overflow:hidden` que cortava em silêncio quem não coubesse. O rodapé daqui
   passou a ser o `.transmux` do 2D, que já resolve largura sozinho (`flex:1` no
   meio, satélites de 46px fixos) e corta com "…" em vez de calado.
   Sobra a margem: é a única medida que era da faixa e continua sendo da
   fileira, e ela ENTRA na conta do `--gps-rodape-h` lá em cima. */
.gps-rodape .transmux{margin-top:10px}

/* ==========================================================================
   AS EMPRESAS DO CORREDOR — o prospector desenhado na tela de navegação.
   Mock do dono (07/08): prédio 3D pequeno, três estados, e a cena
   VARREDURA → JANELAS → NOME DIGITADO → SUBLINHADO.

   🔴 1. PROPORCIONAL (pedido literal do dono). O prédio é OBJETO NO CHÃO, não
      ícone de interface: quem manda no tamanho é `--esc`, e no aparelho quem
      escreve `--esc` é a CÂMERA do mapa (zoom + distância). Tamanho fixo em
      pixel é o que faz marcador de mapa parecer adesivo colado no vidro.
      O RÓTULO **não** escala junto, de propósito: prédio é mundo, nome é
      interface — nome que encolhe com o zoom fica ilegível exatamente quando
      há mais deles na tela.

   🔴 2. A CENA INTEIRA É CSS, e o estado PARADO é o estado FINAL. Todo
      `@keyframes` daqui declara só o `from` (o apagado); o `to` implícito é o
      que a regra estática já diz. Duas consequências que valem o desenho:
      quem chega com a animação desligada (`prefers-reduced-motion`, portão de
      pixel, WebView engasgado) vê a empresa ACESA e certa, nunca meio
      pintada; e a coreografia não depende de nenhum relógio de JavaScript.

   🔴 3. A COREOGRAFIA SÓ EXISTE EM `.on`. Empresa apagada é o repouso — é
      assim que ela passa o dia. `--atraso` é o que faz uma acender depois da
      outra sem um `setTimeout` sequer.
   ========================================================================== */
/* ==== O PRÉDIO DO MOCK ROTA (gps-ruas-prospector-v4, 07/08) — injetado 1:1.
        Muda só o contrato de fora: posição por left/top com --x/--y (quem
        escreve é a ponte projetando no mapa REAL) e claro por [data-luz]. ==== */
.emp{position:absolute;left:var(--x);top:var(--y);width:0;height:0;
  opacity:0;transition:opacity .5s ease}
.emp.no-ar{opacity:1}
.emp.passou{opacity:.62}
.emp[data-acao]{cursor:pointer}
.emp-obj{position:absolute;left:-30px;top:-56px;width:60px;height:64px;
  transform:scale(var(--esc,1));transform-origin:50% 87.5%}
.emp-obj svg{width:100%;height:100%;display:block;overflow:visible}
/* o anel de "achei": chão iluminado + aro. Só existe em .on */
.emp-luz{fill:var(--emp-luz-chao);opacity:0}
.emp-aro{fill:var(--emp-anel);stroke:var(--emp-anel-fio);stroke-width:1.4;opacity:0}
.emp-varre{fill:none;stroke:var(--emp-varre);stroke-width:2;opacity:0;transform-origin:0 0}
.emp-sombra{fill:var(--emp-sombra)}
.emp-topo{fill:var(--emp-topo)}
.emp-esq{fill:var(--emp-esq)}
.emp-dir{fill:var(--emp-dir)}
.emp-jan{fill:var(--emp-janela)}
.emp-pe{fill:var(--emp-base)}

/* ---- ESCOLHIDA (PROSPECTOR v2, 12/08): a empresa É do tipo que a pessoa
        escolheu pra semana. Verde em REPOUSO — antes de acender, e mesmo que
        nunca acenda (o teto do dia é pequeno de propósito).
        Só a TINTA muda: posição, escala, cena de nascer e crescer, régua de
        viagem e rótulo continuam sendo os mesmos do prédio azul. Uma cor a
        mais não pode virar um segundo desenho. ---- */
.emp.escolhida .emp-topo{fill:var(--emp-es-topo)}
.emp.escolhida .emp-esq{fill:var(--emp-es-esq)}
.emp.escolhida .emp-dir{fill:var(--emp-es-dir)}
.emp.escolhida .emp-jan{fill:var(--emp-es-janela)}
.emp.escolhida .emp-pe{fill:var(--emp-es-base)}

/* ---- ACESA: o estado FINAL, escrito por inteiro. Quem chegar com a animação
        desligada vê a empresa ACESA e certa, nunca meio pintada.
        🔴 SÓ ESCOLHIDA ACENDE (12/08). O `.escolhida` no seletor é CINTO DE
        SEGURANÇA de CSS: quem barra de verdade é a ponte (`vestirFase` não veste
        `on` sem `escolhida`) e antes dela o servidor (`aceso` só cai em
        escolhida). Mas prédio azul aceso seria o app convidando o motorista a
        parar o carro por uma empresa que ele não pediu pra ver — três travas
        pra isso não é exagero, é a ordem de grandeza do estrago. ---- */
.emp.escolhida.on .emp-topo{fill:var(--emp-on-topo)}
.emp.escolhida.on .emp-esq{fill:var(--emp-on-esq)}
.emp.escolhida.on .emp-dir{fill:var(--emp-on-dir)}
.emp.escolhida.on .emp-jan{fill:var(--emp-on-janela);filter:drop-shadow(0 0 3px var(--emp-on-janela-brilho))}
.emp.escolhida.on .emp-pe{fill:var(--emp-on-base)}
.emp.escolhida.on .emp-luz{opacity:1}
.emp.escolhida.on .emp-aro{opacity:1}
.emp.escolhida.on .emp-rotulo{opacity:1}
.emp.escolhida.on .emp-barra{transform:scaleX(1)}

@keyframes empVarre{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(2.4);stroke:var(--emp-varre-fim)}}
@keyframes empTopo{from{fill:var(--emp-topo)}}
@keyframes empEsq{from{fill:var(--emp-esq)}}
@keyframes empDir{from{fill:var(--emp-dir)}}
@keyframes empPe{from{fill:var(--emp-base)}}
@keyframes empJanela{from{fill:var(--emp-janela);filter:none}}
@keyframes empSurge{from{opacity:0}}
@keyframes empAro{from{opacity:0;transform:scale(.55)}}
@keyframes empRespira{0%,100%{opacity:.85}50%{opacity:1}}
/* 🔴 O `to` TEM QUE SER ESCRITO. Com só o `from`, o destino implícito era o
   `clip-path` estático (`none`) — e `inset()` → `none` NÃO interpola: o
   navegador trocava SECO no meio e não havia digitação nenhuma (medido no
   mock rota; o defeito morava aqui também). */
@keyframes empDigita{from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)}}
@keyframes empSublinha{from{transform:scaleX(0)}}
@keyframes empNasce{from{opacity:0;transform:scale(calc(var(--esc,1)*.15)) translateY(9px)}}

.emp.nasce .emp-obj{animation:empNasce 560ms var(--cv-mola) both}
.emp.varrendo .emp-varre{animation:empVarre 820ms ease-out forwards}
.emp.escolhida.on .emp-topo{animation:empTopo 400ms ease var(--atraso,0s) both}
.emp.escolhida.on .emp-esq{animation:empEsq 400ms ease var(--atraso,0s) both}
.emp.escolhida.on .emp-dir{animation:empDir 400ms ease var(--atraso,0s) both}
.emp.escolhida.on .emp-pe{animation:empPe 400ms ease var(--atraso,0s) both}
.emp.escolhida.on .emp-aro{animation:empAro 420ms var(--cv-mola) var(--atraso,0s) both}
.emp.escolhida.on .emp-luz{animation:empSurge 500ms ease var(--atraso,0s) both, empRespira 2.1s ease-in-out calc(var(--atraso,0s) + .5s) infinite}
/* 🔴 A LUZ E A ESCRITA SÃO A MESMA CENA (ordem do dono no mock rota): janela
   acendendo É a letra sendo digitada — os dois partem juntos aos 40 ms.
   Cada janela tem o SEU lugar na fila (--j), e a fila de cada empresa é outra. */
.emp.escolhida.on .emp-jan{animation:empJanela 300ms ease calc(var(--atraso,0s) + 40ms + var(--j,0)*105ms) both}

/* o rótulo: chip de vidro com fio guia até o prédio. NÃO escala com a câmera —
   nome que encolhe com o zoom fica ilegível justo quando há mais deles.
   --rx é o EMPURRÃO que mantém o chip dentro da tela na borda; o fio guia
   leva o empurrão INVERTIDO pra continuar apontando pro prédio. */
.emp-rotulo{position:absolute;left:0;bottom:calc(56px * var(--esc,1) + 8px);
  transform:translateX(calc(-50% + var(--rx,0px)));opacity:0;pointer-events:none;
  transition:opacity .3s ease}
.emp.mudo .emp-rotulo{opacity:0 !important}
.emp-guia{position:absolute;left:calc(50% - var(--rx,0px));bottom:-9px;width:1px;height:9px;
  background:var(--emp-guia)}
.emp-chip-nome{display:flex;align-items:center;gap:7px;padding:5px 10px 6px;border-radius:9px;
  background:var(--emp-chip-bg);border:.7px solid var(--emp-chip-fio);position:relative;overflow:hidden;
  backdrop-filter:blur(8px);box-shadow:0 4px 12px rgba(0,0,0,.3);white-space:nowrap}
[data-luz="claro"] .emp-chip-nome{box-shadow:0 4px 12px rgba(30,48,74,.14)}
.emp-chip-nome .pt{width:6px;height:6px;border-radius:50%;flex:0 0 6px;background:var(--emp-ponto);
  box-shadow:0 0 8px var(--emp-ponto-brilho)}
.emp-nome{font-size:12.5px;font-weight:500;color:var(--emp-nome);overflow:hidden;
  display:inline-block;white-space:nowrap;letter-spacing:-.1px}
/* o sublinhado enche MAIS DEVAGAR que a digitação: é ele que dá o ar de "o app
   ainda está confirmando" depois que o nome já apareceu */
.emp-trilho{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--emp-trilho)}
/* 🔴 A BARRA ENCHE POR `scaleX`, NUNCA por width: width é layout, e são até
   três barras de 1,9 s cada rodando na tela mais cara do app (a de dirigir).
   Retângulo sólido, sem raio e sem filho: escalar é IDÊNTICO a crescer. A
   caixa já nasce em 100% e o que anda é a escala — quem chega sem animação
   continua vendo o estado que a regra estática diz. */
.emp-barra{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--emp-barra);
  transform:scaleX(0);transform-origin:0 50%}
/* 66 ms por letra (duas ordens do dono no mock rota). 🔴 O TETO É O SUBLINHADO:
   ele TEM que terminar depois do nome (23 letras = 1,52s; barra 1,9s). */
.emp.escolhida.on .emp-nome{animation:empDigita calc(var(--n,1)*66ms) steps(var(--n,1),end) calc(var(--atraso,0s) + 40ms) both}
.emp.escolhida.on .emp-rotulo{animation:empSurge 200ms ease var(--atraso,0s) both}
.emp.escolhida.on .emp-barra{animation:empSublinha 1.9s linear calc(var(--atraso,0s) + 180ms) both}
.emp.passou .emp-rotulo{opacity:0}
.emp.passou .emp-luz{animation:none;opacity:.4}

/* ---- o cromo: chip, linha de varredura e o radar em cima do motorista ---- */
.emp-chip{position:absolute;left:14px;top:114px;z-index:16;padding:6px 11px 6px 24px;border-radius:999px;
  background:var(--glass);border:.7px solid var(--line);font-size:12px;color:var(--ink-2)}
.emp-chip::before{content:"";position:absolute;left:11px;top:50%;margin-top:-3.5px;width:7px;height:7px;
  border-radius:50%;background:var(--emp-ponto);box-shadow:0 0 10px var(--emp-ponto-brilho)}
.emp-scan{position:absolute;left:18px;right:18px;top:31%;height:2px;border-radius:2px;z-index:11;
  pointer-events:none;background:var(--emp-linha-scan);filter:blur(4px);
  animation:empScan 4.8s linear infinite}
@keyframes empScan{from{top:31%;opacity:.55}to{top:64%;opacity:.2}}
/* o radar mora DENTRO do puck: quem pulsa é a posição do motorista, e o puck
   já é o único dono dessa coordenada — dois donos do mesmo ponto discordam. */
.emp-radar{position:absolute;left:0;top:0;width:2px;height:2px}
.emp-radar i{position:absolute;left:-1px;top:-1px;width:2px;height:2px;border-radius:50%;
  border:1px solid var(--emp-radar);transform:translate(-50%,-50%);
  animation:empRadar 3.4s linear infinite}
.emp-radar i+i{animation-delay:1.7s}
@keyframes empRadar{
  0%{width:8px;height:8px;margin-left:-4px;margin-top:-4px;opacity:.4}
  100%{width:170px;height:170px;margin-left:-85px;margin-top:-85px;opacity:0}}

/* ---------- folha ---------- */
.scrim{position:absolute;inset:0;background:rgba(3,7,14,.72);z-index:40}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;border-radius:22px 22px 0 0;
  background:linear-gradient(180deg,#0f1a2c,var(--bg-2) 30%);border:.7px solid var(--line);border-bottom:0;
  padding:10px 12px 72px;max-height:88%;overflow:auto;scrollbar-width:none;box-shadow:0 -18px 44px rgba(0,0,0,.6)}
.sheet::-webkit-scrollbar{display:none}
.sheet .handle{width:36px;height:3px;border-radius:2px;background:var(--handle);margin:0 auto 10px}
/* Título de FOLHA também é centralizado (§título de tela). O × sai do fluxo:
   com ele empurrando, o título ficava torto pra esquerda. É o mesmo arranjo que
   a folha do "Histórico da semana" já fazia à mão — agora é regra, não exceção.
   A folga lateral no bloco de texto existe pra que título comprido nunca corra
   por baixo do botão de fechar. */
.sheet-head{display:flex;align-items:flex-start;justify-content:center;text-align:center;gap:10px;margin-bottom:10px;position:relative}
.sheet-head>div{padding:0 34px}
.sheet-head>button{position:absolute;right:0;top:0}
.sheet-head h2{margin:0;font-size:21px;font-weight:500;letter-spacing:-.3px}
.sheet-head p{margin:2px 0 0;font-size:12px;color:var(--ink-2)}
.box{background:var(--card);border:.7px solid var(--line);border-radius:13px;padding:10px}
.box+.box{margin-top:8px}
.box-t{font-size:13.5px;font-weight:500}
.box-s{font-size:11px;color:var(--ink-2);margin-top:1px}
.thumb{width:56px;height:56px;border-radius:11px;background:linear-gradient(160deg,#12305f,#0a1a33);
  border:1px solid #1d3a6b;display:grid;place-items:center;flex:0 0 56px;color:var(--blue-l)}
/* Tom do produto por CLASSE (o hex inline era do escuro e sumia no claro). */
.thumb.t-azul{color:var(--blue-l)}
.thumb.t-azul-escuro{color:#7fb0ff}
.thumb.t-cinza{color:#b6c6dd}
.thumb.t-lima{color:var(--lime)}
.marca.info{background:var(--blue-bg);color:var(--blue-l)}
.map-ctrl button.ativo{background:var(--blue-bg)}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.pay{display:flex;align-items:center;gap:8px;padding:10px;border-radius:11px;cursor:pointer;text-align:left;
  border:.7px solid var(--line-2);background:var(--field);color:var(--ink);position:relative}
.pay b{display:block;font-size:13px;font-weight:500}
.pay small{display:block;font-size:10px;color:var(--ink-2);margin-top:1px}
.pay.sel{border-color:var(--lime);background:var(--sel-bg)}
.pay.sel .ok{position:absolute;top:8px;right:8px;color:var(--lime)}
.pay.blue{border-color:rgba(47,126,247,.5)}
.rowline{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:12.5px}
.rowline+.rowline{border-top:1px dashed var(--line-2)}
.rowline b{color:var(--lime);font-size:13.5px;font-weight:500}
.foot2{display:grid;grid-template-columns:1.1fr .9fr;gap:8px;margin-top:10px}

/* ---------- fechamento ---------- */
.forms{display:flex;background:var(--card);border:.7px solid var(--line);border-radius:12px;overflow:hidden}
.form-c{flex:1;padding:9px 4px;text-align:center;border-right:.7px solid var(--line)}
.form-c:last-child{border-right:0}
.form-c small{display:block;font-size:10.5px;color:var(--ink-2);margin-top:4px}
.form-c b{display:block;font-size:12.5px;font-weight:500;margin-top:1px}
.form-c.total{background:var(--sel-bg)}
.form-c.total b{color:var(--lime);font-size:15px}

/* ---------- progresso ---------- */
.prog{background:var(--card);border:.7px solid var(--line);border-radius:12px;padding:9px 11px;margin-top:8px}
.prog-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2)}
.prog-l b{color:var(--lime)}
.prog-b{height:5px;border-radius:3px;background:var(--trilho);margin-top:7px;overflow:hidden}
.prog-b i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--prog-1),var(--prog-2))}

/* ---------- busca / chips ---------- */
.searchrow{display:flex;gap:7px;margin-top:7px}
.search{flex:1;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:12px;
  background:var(--card);border:.7px solid var(--line);color:var(--ink-3)}
.search input{flex:1;border:0;background:transparent;outline:0;font-size:13px;color:var(--ink)}
.filt{width:38px;height:38px;border-radius:12px;background:var(--card);border:.7px solid var(--line);
  display:grid;place-items:center;color:var(--ink-2);cursor:pointer}
.chips{display:flex;gap:6px;margin-top:9px;overflow:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* Dias da Montagem no CENTRO (dono, 08/08: "centralize"). Só onde a fileira é
   curta por natureza — categoria de produto/cliente segue à esquerda, que é
   fileira comprida. O `safe` é a diferença entre centrar e QUEBRAR: esta linha
   ROLA, e `center` puro empurra o primeiro chip pra fora do alcance quando os
   7 dias estouram a largura; com `safe` o estouro volta a começar do início. */
.chips.centro{justify-content:safe center}
.chip{padding:8px 13px;border-radius:10px;border:.7px solid var(--line-2);background:transparent;
  color:var(--ink);font-size:12.5px;white-space:nowrap;cursor:pointer}
.chip.on{border-color:var(--lime);color:var(--lime);background:var(--sel-bg)}

/* ---------- seletor de ORDEM da montagem (08/08; 4ª fatia em 10/08) ----------
   4 posições: a ordem automática por DISTÂNCIA e os 3 espaços de rota salva
   DAQUELE dia (o 3º entrou por ordem do dono: "crie mais um slot, vai ser 1 2 e
   3, igualzinho os outros"). Peça SOLDADA (fundo único, 4 fatias) de propósito —
   os chips do dia logo acima são pílulas soltas, e duas fileiras de pílula
   empilhadas viram a mesma coisa aos olhos do motorista. Cada fatia leva 1/4 da
   largura: é por isso que o nome tem teto (10 caracteres na ponte) e ainda assim
   corta com reticência — `min-width:0` é o que faz o corte acontecer dentro do
   flex em vez de estourar a linha.
   🔴 A 4ª FATIA COBROU FOLGA — E SÓ ELA (`.fino`). O respiro lateral de 6px e o
   vão de 3px deixavam "Distância" com 62px de texto num aparelho de 360, e a
   palavra virava "Distân…". Mas `.modos` é peça COMPARTILHADA: a parada avulsa
   usa a mesma fileira com 2 fatias, e apertar a régua base mexeria numa tela que
   ninguém pediu pra mexer (o portão do antes-e-depois pegou isto). Então quem
   aperta é a classe que só a fileira de 4 recebe; a altura do alvo do dedo (8px
   em cima e embaixo) fica intocada nas duas. */
.modos{display:flex;gap:3px;margin-top:9px;background:var(--card);border:.7px solid var(--line);
  border-radius:12px;padding:3px}
.modos .modo{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;
  border:0;background:transparent;color:var(--ink-2);padding:8px 6px;border-radius:9px;
  font-size:12.5px;cursor:pointer}
.modos.fino{gap:2px}
.modos.fino .modo{padding:8px 3px;gap:4px}
.modos .modo b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.modos .modo.vaga b{color:var(--ink-3);font-weight:400}
.modos .modo.on{background:var(--sel-bg);box-shadow:inset 0 0 0 .7px var(--lime);color:var(--lime)}
.modos .modo.on b{color:var(--lime)}
/* O ponto diz "a ordem na tela já não é a que está gravada nesse espaço" —
   âmbar, porque é pendência de decisão (salvar ou não), nunca erro. */
.modos .ponto{flex:0 0 5px;width:5px;height:5px;border-radius:50%;background:var(--amber)}

/* ---------- título de tela ---------- */
/* 🔴 TÍTULO DE TELA É CENTRALIZADO (dono, 08/08, na Montagem de rota: "quero q
   TODOS estes títulos fiquem centralizados"). A régua vale para as três
   famílias que escrevem o nome da tela — `.screen-head` (ícone + título),
   `.tela-tit` dos Ajustes e o `<h2>` da Montagem — senão trocar de tela faz o
   título pular de canto pro meio, que é o defeito de origem.

   🔴 E O ÍCONE SOBE, não fica ao lado. Centralizar a FILEIRA (ícone + texto)
   deixa o grupo no meio e o TÍTULO 20px pra direita — medido: 226 contra os
   206 do eixo, enquanto "Montagem de rota" caía em 206 cravado. Seria a mesma
   desigualdade de novo, só que disfarçada. Empilhado, o texto senta no eixo.
   O ícone não vira canto esquerdo porque ali, uma linha acima, já mora o botão
   de Voltar — dois glifos redondos empilhados na margem viram um só na leitura. */
.screen-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;margin:2px 0 0}
.screen-head h2{margin:0;font-size:21px;font-weight:500;letter-spacing:-.3px}
.screen-head p{margin:1px 0 0;font-size:11.5px;color:var(--ink-2)}

/* ---------- produto ----------
   Na foto a lista inteira mora DENTRO de um cartão só, dividida por fios —
   o contrário das paradas, que são cartões separados. */
.lista-card{background:var(--card);border:.7px solid var(--line);border-radius:13px;padding:0 10px;margin-top:6px}
.lista-card>*:last-child{border-bottom:0}
.prod{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 2px;
  border-bottom:.6px solid rgba(26,39,64,.95)}
.prod .nm{font-size:14px;font-weight:500}
.prod .st{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);margin-top:3px}
.price{position:relative;border:.9px solid var(--lime);border-radius:9px;padding:7px 12px;
  color:var(--lime);font-size:15px;font-weight:400;background:#111a10}
.price::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%) rotate(45deg);
  width:8px;height:8px;background:var(--bg-2);border-right:.9px solid var(--lime);border-bottom:.9px solid var(--lime)}

/* ---------- rotas salvas ---------- */
.rowcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;
  background:var(--card);border:.7px solid var(--line);border-radius:12px;padding:6px 9px;margin-bottom:5px;cursor:pointer}
.rowcard .ico{width:36px;height:36px;border-radius:10px;background:var(--blue-bg-2);
  border:.7px solid var(--line-2);display:grid;place-items:center;color:var(--blue-l)}
.rowcard .ico.lime{background:var(--lime-bg);color:var(--lime)}
.rowcard strong{display:block;font-size:13px;font-weight:500}
.rowcard span{display:block;font-size:10px;color:var(--ink-2)}
.rowcard .meta{display:flex;gap:9px;margin-top:2px;font-size:10px;color:var(--ink-2)}
.rowcard .meta i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.rowcard .rgt{text-align:right}
.rowcard .rgt small{display:block;font-size:10.5px;color:var(--ink-2)}
.rowcard .rgt b{display:block;font-size:13.5px;color:var(--lime);font-weight:500;margin-top:1px}
.mini-acts{display:flex;gap:9px;align-items:center;padding-left:8px;border-left:.7px solid var(--line)}
.mini{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;color:var(--ink-2);cursor:pointer}
.mini .c{color:var(--blue-l)}

/* ---------- PAINEL DA BUSCA AVULSA (F2, 12/08) ----------------------------
   O painel do `pesquisa-avulsa-v2`: um campo só, três grupos, o fluxo do
   número e o pé que arma a parada.

   🔴 ZERO ANIMAÇÃO AQUI DENTRO, e não é preguiça — é a 3ª família do repinte.
   O rolo é reescrito A CADA TECLA (a ponte escreve direto no nó, § data-vivo
   do velocímetro): qualquer `animation:` nestas regras reencenaria por letra
   digitada, que é exatamente o pisca que a lei do `.entra` existe pra impedir.
   Regra de ENTRADA de animação só vale citando `.tela.entra` — e uma camada
   que renasce por tecla nunca "entra". Então aqui não tem nenhuma.

   🔴 E QUASE TUDO É PEÇA JÁ EXISTENTE: `.search` (campo), `.chips/.chip`
   (recentes e o S/N), `.rowcard` (cartão, selo e a coluna da direita),
   `.pill.lime` (o CEP), `.act.go` (o pé) e `.vazio`. Elas já têm o modo claro
   DESENHADO; peça nova aqui só onde o desenho pedia coisa que não existia. */
.search.grande{height:52px;border-radius:14px;padding:0 13px}
.search.grande input{font-size:15px}
.avb-busca-linha{display:flex;gap:8px;align-items:center}
.avb-busca-linha .search.grande{flex:1;min-width:0;height:56px}
.avb-mic{width:56px;height:56px;flex:0 0 56px;border-radius:14px;border:.7px solid var(--line);
  background:var(--card);color:var(--blue);display:grid;place-items:center;cursor:pointer}
.avb-mic.ouvindo{border-color:var(--lime);color:var(--lime);animation:avbPulsoVoz 1s infinite}
/* A entrada segue exclusiva de `.tela.entra`; avbPulsoVoz é loop de estado.
   Como 0% e 100% são iguais, um repinte reinicia o pulso sem dar salto. */
@keyframes avbPulsoVoz{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.055);opacity:.62}}
.avb-veu-voz{position:absolute;inset:0;background:var(--veu);display:none;place-items:center;
  z-index:80;text-align:center;backdrop-filter:blur(4px)}
.avb-veu-voz.vivo{display:grid}
.avb-veu-voz .bola{width:96px;height:96px;border-radius:50%;margin:0 auto 18px;
  background:var(--lime);color:var(--go-ink);display:grid;place-items:center;animation:avbPulsoVoz 1.1s infinite}
.avb-veu-voz b{display:block;font-size:18px;margin-bottom:6px;color:var(--ink)}
.avb-veu-voz small{color:var(--ink-2)}
/* O foco não pinta cor nova: acende a MESMA lima que o resto da casa usa
   pra dizer "é aqui que o dedo está". `:focus-within` e não classe, pra
   sobreviver ao repinte sem a ponte ter que lembrar do foco. */
.search.grande:focus-within{border-color:var(--lime)}
/* 🔴 O × VIVE SEMPRE NO HTML E QUEM O ESCONDE É A FOLHA (medido no g15, 12/08).
   Ele era desenhado só quando `d.busca` tinha texto — mas quem escreve `d.busca`
   ao digitar é a escrita CIRÚRGICA no rolo, que de propósito NÃO repinta a
   camada: o × nunca nascia enquanto a pessoa digitava, só depois de um toque.
   Condição que depende de repinte não cabe num painel que existe pra não
   repintar. `:placeholder-shown` responde à mesma pergunta ("tem texto aí?")
   sem ninguém ter que pintar nada. */
.avb-x{padding:2px 4px;color:var(--ink-3);font-size:19px;line-height:1;cursor:pointer}
.search.grande input:placeholder-shown+.avb-x{display:none}
.avb-dica{margin:8px 6px 0;font-size:11px;color:var(--ink-3);text-align:center}
.avb-dica b{color:var(--ink-2);font-weight:500}
.avb-rolo{padding-bottom:6px}
.avb-recentes{margin-top:10px}
.avb-grupo{display:flex;align-items:center;gap:7px;margin:13px 2px 6px;
  font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.avb-grupo em{font-style:normal;font-size:10px;letter-spacing:0;color:var(--ink-2);
  background:var(--card);border:.7px solid var(--line);border-radius:999px;padding:1px 7px}
.avb-item{width:100%;text-align:left;cursor:pointer}
/* 🔴 O NOME É O QUE ESTÁ SENDO PROCURADO — ele é a tinta mais forte da tela.
   No `.rowcard` o `<strong>` não declara cor e herda `--ink-2` do `<span>` que o
   embrulha (medido: 85,99,125 no claro): serve pra linha de lista, não pra
   resultado de busca, onde o nome é a resposta à pergunta que a pessoa fez. */
.avb-item strong{color:var(--ink)}
.avb-item.on{border-color:var(--lime);background:var(--sel-bg)}
/* o trecho que casou com o que o dedo escreveu — tinta, nunca marca-texto */
.avb-item mark{background:none;color:var(--lime);font-weight:600}
.avb-item .rgt small{text-transform:uppercase;letter-spacing:.06em;font-size:9px}
/* o 3º selo: cliente é azul e comércio é lima (as duas variantes que o
   `.rowcard .ico` já tinha); a RUA é a peça que faltava. */
.rowcard .ico.rua{background:var(--blue-bg);color:var(--ink-2)}
/* o degrau do NÚMERO — nasce embaixo da rua escolhida, nunca antes */
.avb-num{background:var(--card);border:.7px solid var(--line);border-radius:12px;
  padding:11px;margin:-3px 0 8px}
.avb-num p{font-size:11.5px;color:var(--ink-2);line-height:1.35;margin-bottom:9px}
.avb-num p b{color:var(--ink);font-weight:500}
.avb-num .fila{display:flex;gap:7px;align-items:center}
.avb-num input{flex:1;min-width:0;height:40px;padding:0 11px;border-radius:10px;
  border:.7px solid var(--line-2);background:var(--field);color:var(--ink);font-size:14px;outline:0}
.avb-num input:disabled{color:var(--ink-2)}
.avb-num .act{flex:0 0 auto;height:40px;padding:0 15px;justify-content:center}
/* o pé: o resumo da escolha por cima do botão que faz o verbo */
.avb-pe-resumo{display:flex;align-items:center;gap:8px;margin:0 3px 7px;font-size:11.5px;color:var(--ink-2)}
.avb-pe-resumo b{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avb-pe-resumo .pill{margin-left:auto;flex:none}

/* ---------- semana ---------- */
.week{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;
  background:var(--card);border:.7px solid var(--line);border-radius:12px;padding:9px;margin-bottom:7px}
.week .d strong{display:block;font-size:13px;font-weight:500}
.week .d span{display:block;font-size:10.5px;color:var(--ink-2)}
.week .q i{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-2);font-style:normal}
.week .q i+i{margin-top:3px}
.week .r small{display:block;font-size:10.5px;color:var(--ink-2)}
.week .r b{display:block;font-size:13px;color:var(--lime);font-weight:500}
.week .mk{border:1px solid var(--lime-line);background:#111a0c;border-radius:9px;padding:6px 8px;display:flex;align-items:center;gap:6px}
.week .mk small{display:block;font-size:10px;color:var(--ink-2)}
.week .mk b{display:block;font-size:13px;color:var(--lime);font-weight:500}

/* ---------- formulário (ficha do cliente / produto) ---------- */
.campos{display:grid;gap:8px}
.campo{display:block}
.campo>label{display:block;font-size:10.5px;color:var(--ink-2);margin-bottom:3px}
.campo>label .pend{color:var(--amber)}
.campo input,.campo textarea{width:100%;height:38px;border-radius:11px;border:.7px solid var(--line);
  background:var(--field);padding:0 11px;outline:0;font-size:13px;color:var(--ink)}
.campo textarea{height:56px;padding:8px 11px;resize:none;line-height:1.35}
.campo.erro input{border-color:#7a3a1a;background:#1a1108}
.campo .dica{display:block;font-size:10px;color:var(--amber);margin-top:3px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tripla{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:3px}
.dias button{padding:7px 0;border-radius:10px;border:.7px solid var(--line);background:var(--card);
  color:var(--ink-2);font-size:11px;cursor:pointer}
.dias button.on{border-color:var(--lime);background:var(--lime-bg);color:var(--lime)}
.dias button small{display:block;font-size:9px;opacity:.8;margin-top:1px}

/* ---------- stepper de quantidade ---------- */
.item-linha{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:9px 0;border-bottom:.6px solid rgba(26,39,64,.95)}
.item-linha:last-child{border-bottom:0}
.item-linha strong{display:block;font-size:13px;font-weight:500}
.item-linha span{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
.passo{display:flex;align-items:center;gap:8px}
/* 🔴 O STEPPER É UM <span> DENTRO DE .item-linha — e `.item-linha span` (0,1,1)
   VENCE `.passo` (0,1,0). Resultado medido no vidro: display virava `block` e a
   fonte caía pra 10,5px, então os botões − e + EMPILHAVAM num filete de 30px.
   Não era o dado real ser maior: acontece com o nome do próprio mock. */
.item-linha .passo{display:flex;margin-top:0}
.passo button{width:30px;height:30px;border-radius:10px;border:.7px solid var(--line-2);background:var(--card);
  color:var(--ink);font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center}
.passo b{min-width:22px;text-align:center;font-size:15px;font-weight:500}

/* 🔴 VASILHAME — A LINHA DOS VAZIOS É DO MESMO ITEM (17/08). Ela é a SEGUNDA
   pergunta do produto ("quantos saíram" / "quantos voltaram"), não outro
   produto: por isso o item com casco perde o filete de baixo e o vazio entra
   recuado, com o ícone menor. Duas linhas soltas com o mesmo peso fariam a
   folha parecer ter o dobro de produtos — e o motorista conta produto na
   pressa, pelo desenho, nunca lendo. */
.item-linha.com-casco{border-bottom:0;padding-bottom:2px}
.item-vazio{padding-top:2px;padding-left:14px}
.item-vazio .thumb{opacity:.72}
.item-vazio strong{color:var(--ink-2);font-weight:500}

/* ---------- motivos de não entrega ---------- */
.motivos{display:grid;gap:6px;margin-top:9px}
.motivo{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px 11px;
  border-radius:12px;border:.7px solid var(--line);background:var(--field);color:var(--ink);
  font-size:13px;text-align:left;cursor:pointer}
.motivo .bola{width:17px;height:17px;border-radius:50%;border:1.2px solid var(--line-2)}
.motivo.on{border-color:var(--amber-line);background:#1e1608}
.motivo.on .bola{border-color:var(--amber);box-shadow:inset 0 0 0 4px var(--amber)}

/* ---------- comprovante ---------- */
.foto{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:center;margin-top:9px;
  padding:11px;border-radius:13px;border:.7px dashed var(--line-2);background:var(--field)}
.foto .quadro{width:56px;height:56px;border-radius:11px;background:#101d31;display:grid;place-items:center;color:var(--blue-l)}
.foto strong{display:block;font-size:12.5px;font-weight:500}
.foto span{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}

/* ---------- prévia do dia (gerenciador) ---------- */
.previa{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;
  border-radius:12px;border:.7px solid var(--line);background:var(--card);margin-bottom:5px}
.previa.entra{border-color:var(--lime-line)}
.previa.sai{opacity:.5}
.previa .marca{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:11px}
.previa.entra .marca{background:var(--lime-bg-2);color:var(--lime)}
.previa.sai .marca{background:var(--red-bg);color:var(--red)}
.previa strong{display:block;font-size:13px;font-weight:500}
.previa span{display:block;font-size:10.5px;color:var(--ink-2)}

/* ---------- créditos: o saldo e os pacotes de recarga ----------
   🔴 O PACOTE VIROU LINHA, E A LINHA É O QUE DEIXA COMPARAR. Em cartão de
   grade (2 colunas) só cabiam dois números — quantidade e preço — e com TRÊS
   pacotes no catálogo real a grade ainda deixava um órfão de meia largura. Em
   linha cabe o que decide a compra: o preço POR CRÉDITO (a única conta que diz
   qual pacote é mais barato) e a VALIDADE, que é a pergunta que ninguém pensa
   em fazer antes de o crédito vencer. */
.saldo{display:flex;align-items:center;gap:11px;margin-top:2px;padding:12px 13px;border-radius:14px;
  background:var(--card);border:.7px solid var(--line)}
/* 🔴 `--lime-bg`, NUNCA `--lime-bg-2`: só o primeiro tem par no modo claro
   (`#f0f8e4`). O `-2` fica `#17230e` — verde quase preto — e com a tinta
   `--lime` do claro (`#3f7a00`) daria escuro sobre escuro, o glifo sumindo
   sem erro nenhum no console. Cascata se MEDE. */
.saldo .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--lime-bg);color:var(--lime)}
.saldo .n{display:flex;align-items:baseline;gap:5px}
.saldo .n b{font-size:27px;font-weight:500;line-height:1;letter-spacing:-.02em}
.saldo .n small{font-size:11.5px;color:var(--ink-2)}
.saldo .vence{display:block;font-size:10.5px;color:var(--amber);margin-top:3px}

.pacotes{display:grid;gap:8px;margin-top:6px}
.pacote{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;
  border:.7px solid var(--line);background:var(--card);border-radius:14px;padding:11px;text-align:left;
  cursor:pointer;color:var(--ink);position:relative}
.pacote.on{border-color:var(--lime);background:var(--sel-bg)}
.pacote .qt{min-width:58px}
.pacote .qt b{display:block;font-size:21px;font-weight:500;letter-spacing:-.02em;line-height:1}
.pacote .qt small{display:block;font-size:10.5px;color:var(--ink-2);margin-top:2px}
.pacote .det small{display:block;font-size:10.5px;color:var(--ink-2);line-height:1.3}
.pacote .preco{font-size:15px;font-weight:500;color:var(--lime);white-space:nowrap}
.pacote .selo{display:inline-block;font-size:9.5px;padding:2px 8px;margin-bottom:3px;
  border-radius:999px;background:var(--lime);color:var(--go-ink)}

/* A letra miúda do pé — o que o botão grande vai fazer de verdade. Não é
   banner: banner é aviso, isto é a regra do pagamento, e ela não pisca.
   🔴 INLINE, NÃO FLEX. Em `display:flex` o texto vira um item que ocupa toda a
   largura que sobra, e o cadeado é EMPURRADO pra margem esquerda enquanto a
   frase se centraliza em duas linhas — parece peça solta que caiu ali. Ícone
   que pertence à frase anda DENTRO dela. */
.nota{margin-top:9px;font-size:10.5px;color:var(--ink-3);text-align:center;line-height:1.4}
.nota svg{vertical-align:-2px;margin-right:4px}

/* ---------- extrato ---------- */
.extrato{background:var(--card);border:.7px solid var(--line);border-radius:13px;padding:0 11px;margin-top:6px}
.ext-linha{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;
  border-bottom:.6px solid rgba(26,39,64,.95)}
.ext-linha:last-child{border-bottom:0}
.ext-linha .m{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px}
.ext-linha .m.mais{background:var(--lime-bg-2);color:var(--lime)}
.ext-linha .m.menos{background:var(--red-bg);color:var(--red)}
.ext-linha strong{display:block;font-size:12.5px;font-weight:400}
.ext-linha span{display:block;font-size:10px;color:var(--ink-2)}
.ext-linha b{font-size:13px;font-weight:500}
.ext-linha b.mais{color:var(--lime)}
.ext-linha b.menos{color:var(--red)}

/* ---------- passeio ---------- */
.tempo{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:6px}
.tempo button{height:52px;border-radius:13px;border:.7px solid var(--line);background:var(--card);color:var(--ink);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tempo button b{font-size:15px;font-weight:500}
.tempo button small{font-size:9.5px;color:var(--ink-2)}
.tempo button.on{border-color:var(--lime);background:var(--lime-bg);color:var(--lime)}
.tempo button.on small{color:var(--lime);opacity:.8}

/* ==========================================================================
   OS GESTOS DA LISTA — na LISTA DE PARADAS de verdade, com dedo e com mouse.
   PUNHO    = arrastar pra reordenar, pega na hora — e a zona de pegada é a
              COLUNA ESQUERDA INTEIRA do cartão (dono, 08/08: "difícil de
              acertar os pontinhos"). O desenho continua os 6 pontinhos; o que
              engorda é só o alvo, invisível, via ::before (dedo pede 48dp+).
   SEGURAR  = levantar o cartão pra arrastar (380ms, vibra ao pegar) — o padrão
              Keep/Spotify. O excluir saiu do segurar…
   DESLIZAR PRA ESQUERDA = …e virou o retirar: o cartão acompanha o dedo, a
              tinta vermelha cresce junto (--puxa), passou do limiar pergunta.

   🔴 EM REPOUSO ESTA REGRA NÃO PINTA NADA — a lista real aparece em telas que o
   portão antes×depois mede PIXEL a pixel. O `::after` vermelho nasce com
   opacity 0 (invisível) e quem o acende é a var --puxa, escrita só com o gesto
   em curso; o ::before do punho é transparente por natureza.
   ========================================================================== */
[data-gestos] .stop{touch-action:pan-y;user-select:none}
[data-gestos] .stop::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:rgba(242,85,90,.22);opacity:var(--puxa,0);pointer-events:none}
[data-gestos] .stop.pronto{overflow:hidden;border-color:var(--red);background:var(--red-bg)}
[data-gestos] .stop.pronto::after{opacity:1;background:rgba(242,85,90,.3)}
[data-gestos] .stop.arrastando{z-index:5;box-shadow:0 12px 28px rgba(0,0,0,.5);border-color:var(--blue-line);
  transform:scale(1.015);transition:transform .12s,box-shadow .12s}
[data-gestos] .grip{cursor:grab;touch-action:none}
/* O alvo gordo do punho: cobre punho + número + hora, altura toda do cartão.
   z-index sobe por cima do .numwrap (irmão posterior) só pro TOQUE — sem cor,
   nada muda no desenho; o toque parado ali continua abrindo a folha (click). */
[data-gestos] .grip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:60px;z-index:2}

/* ==========================================================================
   A AULA DA TELA — "coach marks", o padrão de mercado: escurece tudo, abre um
   FURO em cima da peça de verdade e explica em uma linha. 3 a 4 passos, nunca
   um manual: tela que precisa de mais que isso é tela mal desenhada.

   O furo é um `box-shadow` gigante (a sombra é que escurece o resto) — assim o
   destaque acompanha QUALQUER elemento medido na hora, sem recortar imagem.
   ========================================================================== */
.round.acesa{border-color:var(--lime-line);color:var(--lime);background:var(--lime-bg)}
/* 🔴 O TOUR MORA ABAIXO DO PORTÃO E DO AVISO. Ele era `z-index:70`, acima de
   TUDO: a trava de crédito (59), o erro (60) e o recado da Central (55)
   nasciam ATRÁS da lição e o motorista ficava preso aprendendo por cima de uma
   decisão. 52 é o degrau certo — acima da faixa de status (50) e da barra de
   módulos (45), que o furo precisa poder escurecer, e abaixo de tudo o que
   INTERROMPE. Aula é conveniência; trava e recado são o dia.

   E o embrulho não come mais o dedo: quem come é o VÉU, logo abaixo. */
.aula-wrap{position:absolute;inset:0;z-index:52;pointer-events:none}
/* 🔴 O VÉU SÃO 4 PAINÉIS EM VOLTA DO ALVO, não uma camada com máscara. Dois
   motivos medidos: (1) o recorte sai de graça — 4 retângulos, sem compor
   máscara a cada quadro, que é o que o g15 paga caro; (2) o BURACO fica
   clicável sem uma linha de regra, e é isso que separa "assista" de "faça":
   no passo `fazer` o botão de verdade continua respondendo ao dedo e é o
   clique dele que anda a lição. Fora do buraco o toque morre aqui — não fecha
   o tour e não vaza pra tela. */
.aula-veu{position:absolute;pointer-events:auto}
/* O FORA FICA FOSCO. O escuro continua vindo do `box-shadow` do furo (abaixo);
   este painel só desfoca o que já está escuro.
   🔴 3px, NÃO 4px (17/08). Com 4px o mapa e os cartões viravam mancha: quem lê
   a lição perde a referência de ONDE está na tela, e é a referência que faz o
   holofote significar alguma coisa. Desfoque é para tirar a leitura do fundo,
   não para apagar o desenho. */
@supports (backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px)){
  .aula-veu{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
}
/* 🔴 FALLBACK OBRIGATÓRIO: aparelho que não tem `backdrop-filter` fica com o
   escuro CHAPADO — exatamente a aula que já funcionava antes deste tour. O
   painel continua lá (é ele que come o dedo), só não desfoca. Enfeite não
   derruba rota. */
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
  .aula-veu{background:transparent}
}
/* 🔴 O VÉU ESCURO ERA `.8` E O APP SUMIA (dono, 17/08: "corrija toda essa
   feiura, erro de contraste"). Esta casa já é NOITE: 80% de preto por cima de
   um `--bg` que é quase preto não escurece o fora — ele APAGA. Medido no g15:
   na tela Rota sobrava um retângulo preto com o balão em cima, e o motorista
   não sabia mais em que tela a lição estava falando. `.52` devolve o mapa, o
   cabeçalho e a barra de módulos: MEDIDO em 3,29:1 pro texto do app atrás do
   véu (era 1,58:1 — abaixo do piso de qualquer coisa que se pretenda visível),
   e ainda bem abaixo do teto de 8:1 que separa "escurecido" de "não mexeu".
   Quem cai é o VÉU, nunca o anel: o lima contra ele continua acima de 10:1.
   Coach mark é holofote, e holofote sem palco não aponta coisa nenhuma.
   E a borda subiu 1.5→2px: é ela que carrega os 3:1 nos dois lados no claro,
   onde o véu é frouxo de propósito (ver o bloco do `[data-luz="claro"]`). */
.aula-furo{position:absolute;border-radius:12px;border:2px solid var(--lime);
  box-shadow:0 0 0 9999px rgba(4,9,18,.52),0 0 16px rgba(158,222,42,.5);
  transition:top .22s,left .22s,width .22s,height .22s;pointer-events:none}
/* A LEI VELHA VIROU MODO. "A aula não aperta botão" continua valendo no passo
   `mostrar`: ali o furo TAMPA o próprio buraco e nem o alvo responde. Só o
   `fazer` abre a passagem. */
.aula-wrap[data-tipo="mostrar"] .aula-furo{pointer-events:auto}
/* Passo sem alvo (o que explica, não aponta): sem furo, véu inteiro, balão no
   meio. Nasce da mesma peça — não é um segundo desenho. */
.aula-wrap[data-furo="0"] .aula-furo{display:none}
/* 4 s sem toque no passo `fazer` e o anel PULSA. É DICA, não bronca: o anel é
   filho do furo (nunca o `box-shadow`, que muda de cor entre as duas peles e
   viraria um `@keyframes` por tema). */
.aula-furo::after{content:"";position:absolute;inset:-3px;border-radius:15px;
  border:2px solid var(--lime);opacity:0;pointer-events:none}
.aula-furo.dica::after{animation:aulaDica 1.5s ease-out infinite}
@keyframes aulaDica{0%{opacity:.95;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.14)}}
.aula-cx{position:absolute;left:11px;right:11px;background:var(--card);
  border:.7px solid var(--line);border-radius:14px;padding:15px 12px 12px;
  box-shadow:0 14px 34px rgba(0,0,0,.5);pointer-events:auto}
/* Balão sem alvo fica no MEIO da tela — e o `bottom:auto` é obrigatório, senão
   ele herda a posição do passo anterior e nasce esticado. */
.aula-wrap[data-furo="0"] .aula-cx{top:50%;bottom:auto;transform:translateY(-50%)}
.aula-cx b{display:block;font-size:14px;font-weight:500}
.aula-cx .txt{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.4}
.aula-cx .pe{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:12px}
/* 🔴 O CONTADOR ERA `--ink-3`: 3,9:1 no escuro, MEDIDO — texto abaixo dos 4,5:1
   numa peça que existe justamente pra dizer onde a pessoa está. Sobe pro
   `--ink-2`, que é o tom de legenda desta casa (7,0:1 escuro / 7,1:1 claro). */
.aula-cx .conta{font-size:11px;color:var(--ink-2)}
.aula-cx .pe button{padding:9px 16px;border-radius:10px;font-size:13px;border:.7px solid var(--line);
  background:var(--chip-bg);color:var(--ink);cursor:pointer}
.aula-cx .pe .principal{background:var(--lime);border-color:var(--lime);color:#12200a;font-weight:500}
/* A BARRA DO CAPÍTULO — "2 de 5" diz o número, ela diz o TAMANHO do que falta.
   Tour sem fim à vista é tour que o cliente abandona no meio.
   🔴 ELA PASSAVA POR BAIXO DO X (dono, 17/08). A barra era um bloco em FLUXO,
   de borda a borda do miolo; o X é `position:absolute` no canto. As duas peças
   ocupavam o mesmo canto superior direito e o resultado na tela era uma barra
   cortada ao meio pelo botão — a única peça do balão que responde "quanto
   falta" ficava ilegível justamente no fim, que é onde a resposta importa.
   Cura: a barra virou TRILHO DE TOPO, colada na borda de cima do cartão (fora
   do miolo), e o X desceu 2px. Duas peças, dois lugares — a régua velha da
   casa: peça que se sobrepõe a outra não é ajuste de margem, é lugar errado. */
.aula-prog{position:absolute;top:0;left:0;right:0;height:3px;
  border-radius:13px 13px 0 0;background:var(--barra-trilho);overflow:hidden}
.aula-prog i{display:block;height:100%;background:var(--lime);transition:width .22s}
/* O X do avançado. No obrigatório ele não é desenhado — não é escondido por
   CSS: botão que existe e não fecha é a mentira que este app não conta. */
.aula-cx .fechar{position:absolute;top:10px;right:8px;width:27px;height:27px;padding:0;
  border-radius:9px;border:.7px solid var(--line);background:var(--chip-bg);color:var(--ink-2);
  display:grid;place-items:center;cursor:pointer}
.aula-cx.com-x b{padding-right:30px}
/* 🔴 O RODAPÉ DO PASSO `fazer` ERA UMA BANDA VAZIA (dono, 17/08). Ali não nasce
   "Próximo" — quem anda o passo é o dedo no botão de verdade — e sobrava a
   contagem sozinha à esquerda com metade do cartão em branco: o cliente lia
   "acabou" e ficava parado esperando um botão que nunca vem. É o "travado" da
   ordem. Esta pílula NÃO é botão (sem borda, sem fundo, sem `data-acao`) — é a
   frase que faltava, e o pingo pulsando aponta pro anel do furo, a mesma cor.
   Botão morto continua proibido; o que se conserta aqui é o silêncio. */
.aula-cx .dedo{display:inline-flex;align-items:center;gap:7px;font-size:12px;
  font-weight:500;color:var(--lime)}
.aula-cx .dedo i{width:7px;height:7px;border-radius:50%;background:var(--lime);
  animation:aulaPingo 1.5s ease-in-out infinite}
@keyframes aulaPingo{0%,100%{opacity:.3;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}

/* ---------- chat da Central ---------- */
.recado{border:.7px solid var(--amber-line);background:var(--amber-bg-2);border-radius:14px;padding:11px;margin-top:6px}
.recado .topo{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.recado .ico{width:34px;height:34px;border-radius:11px;background:var(--amber-bg);color:var(--amber);display:grid;place-items:center}
.recado strong{display:block;font-size:13.5px;font-weight:500}
.recado span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:1px}
.recado .acoes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.recado .acoes button{height:36px;border-radius:11px;border:.7px solid var(--line-2);background:var(--card);
  color:var(--ink);font-size:12.5px;cursor:pointer}
/* 🔴 ESTA LINHA JÁ FOI `color:#fff`. A lei da tinta escura mora lá em cima
   (procure ".act.go"), com a MESMA força de seletor — e regra de força igual
   quem ganha é a de BAIXO. Como esta nasceu depois, ela vencia calada e o
   "Entendi" do recado saía branco no lima: 1,78:1, medido. Regra que diz o
   contrário da lei não se corrige com ordem; se corrige dizendo a lei. */
.recado .acoes .principal{background:linear-gradient(180deg,var(--go-1),var(--go-2));border:0;color:var(--go-ink)}
/* 🔴 O CHAT ENCOSTA NO PÉ (dono, 08/08: "encoste o chat no bottom"). A conversa
   nascia no TOPO e sobrava um vão morto de meia tela entre o campo de escrever e
   a barra — o único lugar do app onde o dedo já está embaixo. `margin-top:auto`
   empurra conversa + campo pro rodapé e some sozinho quando o fio cresce: aí a
   `.body` volta a rolar como qualquer tela, sem regra nova. O cartão do recado
   NÃO desce junto — ele é aviso de topo, não mensagem. */
.body.chat-corpo{display:flex;flex-direction:column}
.body.chat-corpo .conversa{margin-top:auto}
.conversa{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.msg{max-width:82%;padding:8px 11px;border-radius:14px;font-size:12.5px;line-height:1.35}
.msg.deles{background:var(--card);border:.7px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.msg.minha{background:var(--lime-bg-2);border:.7px solid var(--lime-line);border-bottom-right-radius:5px;align-self:flex-end}
.msg small{display:block;font-size:9.5px;color:var(--ink-3);margin-top:3px}
/* RECADO COM ROTA/PARADA EMBUTIDA (12/08) — o anexo mora DENTRO da bolha, e não
   num cartão separado como o `.recado` do portão. A razão é de leitura: o texto
   ("passa no Cliente 6 antes das 11h") e o alvo são a MESMA frase; separar
   os dois faria a pessoa parear mensagem com anexo pelo horário. E, sendo bolha,
   o histórico do que foi encaixado/negado fica no fio de graça — que é o que o
   dono pediu que sobrasse. Bolha larga só quando tem anexo: 82% é medida de
   TEXTO, e a fileira de 3 botões não cabe nela. */
.msg.tem-anexo{max-width:96%}
.msg .anexo{margin-top:7px;padding:8px;border-radius:11px;border:.7px solid var(--line-2);background:var(--bg-2)}
.msg .anexo .alvo{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.msg .anexo .ico{width:28px;height:28px;border-radius:9px;background:var(--amber-bg);color:var(--amber);
  display:grid;place-items:center}
.msg .anexo strong{display:block;font-size:12px;font-weight:500;color:var(--ink)}
.msg .anexo .alvo>span>span{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.msg .anexo .acoes{display:flex;gap:6px;margin-top:8px}
.msg .anexo .acoes button{flex:1;height:32px;border-radius:9px;border:.7px solid var(--line-2);
  background:var(--card);color:var(--ink);font-size:11px;font-weight:500;cursor:pointer}
.msg .anexo .acoes .principal{background:linear-gradient(180deg,var(--go-1),var(--go-2));border:0;color:var(--go-ink)}
/* O DESFECHO OCUPA O LUGAR DOS BOTÕES, nunca soma a eles: card decidido com
   botão vivo do lado é a confirmação decorativa de novo. */
.msg .anexo .selo{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;color:var(--ink-2)}
.msg .anexo.encaixada .selo{color:var(--lime)}
/* `--lime-bg` e `--card` são redefinidos no claro; `--amber-bg` NÃO é (o
   `.recado .ico` já resolve isso com override próprio, e este segue o mesmo
   caminho lá embaixo). Negada usa cinza, não vermelho: negar não é erro. */
.msg .anexo.encaixada .ico{background:var(--lime-bg);color:var(--lime)}
.msg .anexo.negada .selo{color:var(--ink-3)}
.msg .anexo.negada .ico{background:var(--card);color:var(--ink-3)}
.escrever{display:flex;align-items:center;gap:8px;margin-top:12px;height:42px;padding:0 12px;border-radius:14px;
  background:var(--card);border:.7px solid var(--line)}
.escrever input{flex:1;border:0;background:transparent;outline:0;font-size:13px;color:var(--ink)}
.escrever .enviar{width:30px;height:30px;border-radius:10px;border:0;background:var(--lime);color:var(--go-ink);
  display:grid;place-items:center;cursor:pointer}

/* ---------- ajustes ---------- */
/* O título da sub-tela. `telaAjuste` recebia o nome e nunca o escrevia: Recarga,
   Financeiro, Avançado, Sons, Histórico e Consumo abriam SEM título nenhum, e o
   cabeçalho é o logo (não anda, §hdr) — não havia onde ler onde se está. */
/* Centralizado pela mesma régua do `.screen-head` (§título de tela). */
.tela-tit{font-size:15.5px;font-weight:700;color:var(--ink);margin:9px 2px 0;letter-spacing:-.01em;text-align:center}
.grupo{font-size:11px;color:var(--ink-2);margin:12px 2px 5px}
.cartao-lista{background:var(--card);border:.7px solid var(--line);border-radius:13px;overflow:hidden}
.linha-cfg{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:10px 11px;border:0;border-bottom:.6px solid rgba(26,39,64,.95);background:transparent;
  color:var(--ink);text-align:left;cursor:pointer}
.linha-cfg:last-child{border-bottom:0}
.linha-cfg .ico{width:30px;height:30px;border-radius:10px;background:#111d31;color:var(--ink-2);display:grid;place-items:center}
.linha-cfg strong{display:block;font-size:13px;font-weight:400}
.linha-cfg span{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
.linha-cfg b{font-size:12.5px;font-weight:500;color:var(--ink-2)}
/* 🔴 INTERRUPTOR PRECISA DE LIMITE VISÍVEL NOS DOIS ESTADOS. O trilho sozinho
   media 1,3:1 contra o cartão no escuro e 1,78:1 no claro — dava pra não ver
   se estava ligado. Quem define o limite é a BORDA; o preenchimento só diz o
   estado. Mínimo de 3:1 em trilho×cartão e bola×trilho, medido nas duas peles. */
.chave{width:38px;height:22px;border-radius:999px;background:#22314c;border:1px solid #5c6f92;
  position:relative;flex:0 0 38px;box-sizing:border-box}
.chave i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--ink-2);transition:left .2s,background .2s}
.chave.on{background:var(--lime);border-color:#c6f27a}
.chave.on i{left:18px;background:var(--go-ink)}

/* ---------- tutorial e demonstração ---------- */
/* 🔴 O TUTORIAL SAIU DO MEIO DOS AJUSTES (17/08, ordem do dono: *"nos ajustes tem
   um monte de coisa, não quero isso! deixar uma tela Tutorial, e injetar todas
   features dentro dele"*). Ele era o grupo "Aprenda a usar" espremido entre
   Fechamento e "Som e tela" — sete linhas de aula no meio de sete linhas de
   configuração, e a pessoa que abria os Ajustes pra aprender tinha que
   reconhecer qual bloco ensinava. Agora é UMA linha lá e uma TELA aqui. */
.tut-hero{position:relative;overflow:hidden;border-radius:15px;padding:15px 14px 14px;
  background:linear-gradient(158deg,var(--blue-bg-2),var(--card) 78%);
  border:.8px solid var(--blue-line)}
/* O halo é o único enfeite, e ele é DESENHO: um facho que sai do play e some.
   No claro o brilho vira sujeira (lei do modo claro), então lá ele é apagado. */
.tut-hero::after{content:'';position:absolute;right:-38px;top:-46px;width:150px;height:150px;
  border-radius:50%;background:var(--blue);opacity:.13;filter:blur(26px);pointer-events:none}
.tut-hero .tut-play{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue-l)}
.tut-hero h3{margin:11px 0 0;font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.tut-hero p{margin:4px 0 0;font-size:11.5px;line-height:1.45;color:var(--ink-2)}
.tut-hero .tut-selo{position:absolute;right:12px;top:13px;font-size:9.5px;font-weight:600;
  padding:3px 8px;border-radius:999px;background:var(--lime-bg-2);color:var(--lime);
  border:.7px solid var(--lime-line)}
/* Botão de largura cheia: é a ÚNICA ação da caixa, e ação única não divide
   linha com nada — o dedo não tem que escolher. */
.tut-b{margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:11px;border:0;border-radius:12px;font-size:13.5px;font-weight:600;cursor:pointer;
  background:linear-gradient(180deg,var(--go-1),var(--go-2));color:var(--go-ink)}
.tut-b.fraco{background:transparent;border:.8px solid var(--line);color:var(--ink)}
/* A dica da lâmpada fecha a tela: ela ensina o que NENHUM capítulo cobre — que
   toda tela tem a própria aula a um toque. */
.tut-dica{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;margin-top:13px;
  padding:11px;border-radius:12px;background:var(--bg-2);border:.7px solid var(--line)}
.tut-dica span{font-size:11px;line-height:1.45;color:var(--ink-2)}
.tut-dica b{color:var(--ink);font-weight:600}

/* ---------- "você ainda não tem clientes" (a saída da demonstração) ---------- */
/* 🔴 ESTA TELA EXISTE PORQUE A DEMONSTRAÇÃO CRIA UM BURACO. O cliente vê 8
