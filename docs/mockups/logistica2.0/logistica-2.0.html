   paradas, rota montada e caixa do dia; fecha, e a tela fica VAZIA. O contraste
   que vendeu o app é o mesmo que faz desistir — então a demonstração não
   termina em "parabéns", termina AQUI, com as duas saídas na mão. */
.cap-tit{margin:14px 2px 0;font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--ink);text-align:center}
.cap-sub{margin:6px 12px 0;font-size:12.5px;line-height:1.5;color:var(--ink-2);text-align:center}
/* O cartão do SUPORTE é o herói: é a saída que o dono quer que seja escolhida,
   e o peso visual diz isso antes da letra. */
.cap-heroi{position:relative;overflow:hidden;margin-top:16px;border-radius:16px;padding:16px 14px 14px;
  background:linear-gradient(160deg,var(--lime-bg-2),var(--card) 72%);
  border:.9px solid var(--lime-line)}
.cap-heroi::after{content:'';position:absolute;left:-30px;bottom:-52px;width:160px;height:160px;
  border-radius:50%;background:var(--lime);opacity:.11;filter:blur(28px);pointer-events:none}
.cap-heroi .cap-selo{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase;padding:4px 9px;border-radius:999px;
  background:var(--lime);color:var(--go-ink)}
.cap-heroi h3{margin:10px 0 0;font-size:17px;font-weight:700;letter-spacing:-.015em;color:var(--ink)}
.cap-heroi p{margin:5px 0 0;font-size:12px;line-height:1.5;color:var(--ink-2)}
.cap-heroi p b{color:var(--ink);font-weight:600}
/* AS TRÊS PORTAS. Cabem numa fileira só porque são três e o rótulo é uma
   palavra — em duas linhas viraria menu, e menu é escolha, não convite. */
.cap-portas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.cap-porta{display:grid;place-items:center;gap:6px;padding:12px 4px 10px;border-radius:13px;
  border:.8px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.cap-porta i{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;
  background:var(--bg-2);color:var(--ink-2)}
.cap-porta.destaque{border-color:var(--lime-line);background:var(--lime-bg)}
.cap-porta.destaque i{background:var(--lime-bg-2);color:var(--lime)}
.cap-porta strong{font-size:11px;font-weight:600}
/* A linha do "do jeito que estiver" é o que derruba a desculpa de não mandar —
   quem tem a lista num caderno amassado acha que a foto dele não serve. */
.cap-aceita{margin-top:11px;font-size:10.5px;line-height:1.5;color:var(--ink-2);text-align:center}
.cap-ou{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:16px 0 0;
  font-size:10.5px;color:var(--ink-3)}
.cap-ou::before,.cap-ou::after{content:'';height:.8px;background:var(--line)}
/* O caminho manual não é escondido — é MENOR. Esconder a saída que o cliente
   pode preferir é a mesma armadilha do botão que mente. */
.cap-manual{margin-top:12px;width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;
  align-items:center;padding:13px 12px;border-radius:13px;border:.8px solid var(--line);
  background:var(--card);color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.cap-manual .ico{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;
  background:var(--bg-2);color:var(--ink-2)}
.cap-manual strong{display:block;font-size:13px;font-weight:600}
.cap-manual span{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
/* O RECIBO. Depois de mandar, a tela não volta ao convite: quem já mandou
   precisa ver que chegou, senão manda de novo achando que falhou. */
.cap-ok{margin-top:16px;padding:15px 14px;border-radius:15px;text-align:center;
  background:var(--lime-bg);border:.9px solid var(--lime-line)}
.cap-ok .ico{width:46px;height:46px;margin:0 auto;border-radius:50%;display:grid;place-items:center;
  background:var(--lime-bg-2);color:var(--lime);border:1px solid var(--lime-line)}
.cap-ok h3{margin:10px 0 0;font-size:15.5px;font-weight:700;color:var(--ink)}
.cap-ok p{margin:5px 0 0;font-size:11.5px;line-height:1.5;color:var(--ink-2)}

/* ---------- clientes ---------- */
/* 🔴 A LINHA DE CLIENTE TAMBÉM É BOTÃO. No mock ela é `<div>` (nada clica), mas
   no app ela ABRE A FICHA — e aí o navegador devolve o botão de fábrica por
   baixo: fundo cinza, borda de 2px, texto centralizado, largura encolhida. Foi
   medido ao vestir a tela (leva 2): a lista inteira virou caixa cinza.
   O `.linha-cfg` já nasceu com esse desarme; o `.cli` não tinha. Sem ele aqui,
   quem veste é obrigado a desarmar INLINE no app — e estilo inline vence a
   folha, então o fundo do `.stop.pronto` (segurar pra apagar) nunca
   chegava. Componente que pode ser botão desarma o botão ELE MESMO. */
.cli{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:8px 2px;border:0;border-bottom:.6px solid rgba(26,39,64,.95);
  width:100%;background:transparent;color:var(--ink);text-align:left;font:inherit}
.ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:500;
  background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue-l)}
.ava.lime{background:var(--lime-bg-2);border-color:var(--lime-line);color:var(--lime)}
/* 🔴 O DIA QUE NÃO FOI COMPLETADO (dono, 10/08: "ambas ficam vermelhas, não foram
   completadas"). Vale pros dois casos — a cancelada sem registro nenhum (que vive
   24 h) e a que teve trabalho de verdade e sobrou parada. Mesmo par de tokens do
   resto do vermelho da casa; nada de hex solto. */
.ava.red{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.cli .rgt .nao-fez{display:block;font-size:10px;color:var(--red)}
.cli strong{display:block;font-size:13.5px;font-weight:500}
.cli span{display:block;font-size:11px;color:var(--ink-2);margin-top:1px}
.cli .rgt small{display:block;font-size:10px;color:var(--ink-2)}
.cli .rgt b{display:block;font-size:13.5px;color:var(--lime);font-weight:500}
/* 🔴 O CÍRCULO CENTRALIZA SOZINHO — e quase nunca centralizava. `.ava` é um
   `<span>`, e as regras largas de linha (`.cli span`, `.item-linha span`) têm
   1 classe + 1 tipo: vencem `.ava` (1 classe) e ainda vêm depois. Roubavam
   QUATRO propriedades de uma vez — `display:grid` virava `block` (e aí
   `place-items:center` fica inerte: as iniciais colam no canto de cima),
   12px virava 11px, a cor da marca virava `--ink-2` e um `margin-top:1px`
   empurrava o círculo inteiro pra baixo. Medido com `getComputedStyle`, não
   lido. Mesma família da lei do gesto acima: componente que um
   seletor largo alcança DESARMA quem o alcança, no lugar exato.
   Vem ANTES do bloco do modo claro de propósito — lá a cor é redesenhada. */
.cli .ava,.item-linha .ava{display:grid;place-items:center;font-size:12px;margin-top:0;color:var(--blue-l)}
.cli .ava.lime,.item-linha .ava.lime{color:var(--lime)}
/* O vermelho do dia não-completado precisa das MESMAS três declarações que o lime
   já tem — e por quê está escrito no comentário logo acima: `.cli .ava` tem a mesma
   força de `.ava.red` e vem DEPOIS, então rouba a cor da letra. MEDIDO antes de
   existir esta linha: fundo vermelho com letra AZUL. */
.cli .ava.red,.item-linha .ava.red{color:var(--red)}

/* ==========================================================================
   MODO CLARO — DESENHADO, não derivado.
   O anterior era a folha inteira duplicada (514 linhas, duas vezes) por regra
   de matiz. Inversão mecânica não funciona porque as duas peles usam a LUZ de
   maneiras opostas: no escuro a hierarquia vem de clarear a superfície; no
   claro ela vem de BORDA e SOMBRA, com quase tudo branco.

   As três armadilhas que a derivação não tinha como resolver:
   1. O LIMA VIVO É INVISÍVEL NO BRANCO (1,7:1). No claro ele deixa de ser
      tinta e vira só PREENCHIMENTO; quem escreve é o verde escuro.
   2. BRILHO NÃO EXISTE NO CLARO. Todo halo vira sombra — glow sobre branco
      é sujeira, não profundidade.
   3. O FUNDO NÃO É BRANCO. É cinza-azulado, senão o cartão branco não flutua
      e a tela vira uma folha só.
   ========================================================================== */
[data-luz="claro"] .app{
  --bg:#eef1f7; --bg-2:#f7f9fc; --card:#ffffff; --line:#dde3ee; --line-2:#c3cfe1;
  --esq-1:#dfe5f0; --esq-2:#6f7d9b;
  /* --ink-3 é o rótulo da aba apagada: em #7d8ba3 media 3,45 sobre o branco
     da barra. Escurecido até passar — texto de 9px não tem folga nenhuma. */
  --ink:#0f1726; --ink-2:#55637d; --ink-3:#616f89;
  /* o verde que ESCREVE é escuro; o vivo sobrou pra preencher (--lima-viva) */
  --lime:#3f7a00; --lima-viva:#8fd626;
  --blue:#1257c8; --blue-l:#1257c8; --amber:#8a5200; --purple:#6d28d9; --red:#c0201b;
  /* 🔴 O VERMELHO DE PERIGO NÃO TINHA PAR CLARO (15/08, MEDIDO). `--danger-btn`
     só existia no bloco de cima (`#8f2d2d`, pensado pro fundo escuro): sem
     redefinição aqui, o "Sim" do portão perigo no claro herdava esse tom
     escurecido — e a regra de baixo (~2921) ainda rouba a tinta pro
     `#16260a` (pensado pro lima), medindo 1,96:1. Mesmo par já homologado do
     `.erro` claro (~3009): #b3211c com branco por cima dá 6,66:1. */
  --danger-btn:#b3211c;
  --lime-bg:#f0f8e4; /* F1 leva 3: cobertura 5/5 medida */
  --splash-bg-1:#f7f9fc; --splash-bg-2:#e9eef6;
  --splash-marca:#5a9c10; --splash-marca-2:#7bc020;
  --splash-tinta:#0f1726; --splash-sub:#55637d; --splash-trilho:#d5dded;
  /* 🔴 O VÉU INVERTE: no escuro ele ESCURECE, no claro ele CLAREIA. É o pedido
     literal do dono, e é o certo — véu escuro sobre mapa claro é uma sombra
     caindo na tela; véu claro é a luz de fora entrando, que é a leitura de
     quem dirige de dia. Mesma cena, lado oposto. */
  --veu:#eef2f8;
  --puck-anel:rgba(18,87,200,.42);
  background:linear-gradient(180deg,var(--bg-2),var(--bg) 34%);
  color:var(--ink);
}
[data-luz="claro"] .tela{background:linear-gradient(180deg,var(--bg-2),var(--bg) 34%)}
[data-luz="claro"] .notch{background:#0a0d14}
/* 🔴 O FIO DIVISOR TAMBÉM ERA CRAVADO ESCURO. Cinco listas separam as linhas
   com `rgba(26,39,64,.95)` — no escuro é um fio discreto; no cartão BRANCO é
   um risco quase preto, mais forte que o próprio texto. Fio de lista é uma
   dica, não uma régua: quem separa no claro é o `--line` da pele. */
[data-luz="claro"] .prod,[data-luz="claro"] .item-linha,[data-luz="claro"] .ext-linha,
[data-luz="claro"] .linha-cfg,[data-luz="claro"] .cli{border-bottom-color:var(--line)}

/* Cartão branco com sombra suave: é a sombra que cria a camada, não a cor. */
[data-luz="claro"] .stop,[data-luz="claro"] .kpi,[data-luz="claro"] .bar,
[data-luz="claro"] .sum,[data-luz="claro"] .act,[data-luz="claro"] .box,
[data-luz="claro"] .rowcard,[data-luz="claro"] .week,[data-luz="claro"] .cartao-lista,
[data-luz="claro"] .lista-card,[data-luz="claro"] .previa,[data-luz="claro"] .dia-bar,
[data-luz="claro"] .creditos,[data-luz="claro"] .forms,[data-luz="claro"] .prog,
[data-luz="claro"] .saldo,
[data-luz="claro"] .filtro button,[data-luz="claro"] .pacote,[data-luz="claro"] .extrato,
[data-luz="claro"] .tempo button,[data-luz="claro"] .search,[data-luz="claro"] .filt{
  box-shadow:0 1px 2px rgba(15,23,38,.05),0 1px 8px rgba(15,23,38,.04);
}
/* AS PEÇAS NOVAS DO TUTORIAL E DA CAPTURA, no claro (17/08). Duas correções e
   nenhuma é cosmética: (1) o halo — `filter:blur` sobre branco vira sujeira
   cinza, então ele APAGA e quem cria a camada é a sombra, como no resto da
   pele; (2) o `.cap-selo` e o `.tut-b` escrevem em `--go-ink` sobre lima vivo,
   que é o ÚNICO par que sobrevive nas duas peles — por isso eles não têm par
   claro: já nasceram certos. */
/* 🔴 MEDIDO, NÃO ADIVINHADO (17/08). A primeira versão destas peças usava
   `--blue-bg-2`, `--lime-bg-2` e `--lime-line` nos FUNDOS — e nenhum dos três
   tem par no modo claro (só `--lime-bg` tem). Resultado, visto na foto da tela:
   o cartão "Veja o app funcionando" nascia com fundo QUASE PRETO no meio da
   tela branca, com o texto cinza por cima, e o selo "1 minuto" igual. É a lei
   do CSS que morre calado na veia: token sem par claro não avisa, só aparece.
   Aqui os fundos são REDESENHADOS com os pares que a pele clara já usa
   (`#eef3fc` do `.num`, `#f0f8e4`/`#a8cc6e` do `.tag.lime`); o brilho vira
   sombra, porque halo sobre branco é sujeira. */
[data-luz="claro"] .tut-hero::after,[data-luz="claro"] .cap-heroi::after{display:none}
[data-luz="claro"] .tut-hero,[data-luz="claro"] .cap-heroi,[data-luz="claro"] .cap-porta,
[data-luz="claro"] .cap-manual,[data-luz="claro"] .cap-ok,[data-luz="claro"] .tut-dica{
  box-shadow:0 1px 2px rgba(15,23,38,.05),0 1px 8px rgba(15,23,38,.04);
}
[data-luz="claro"] .tut-hero{background:linear-gradient(158deg,#eef3fc,var(--card) 76%);border-color:#c9d8ef}
[data-luz="claro"] .tut-hero .tut-play{background:#eef3fc;border-color:#c9d8ef;color:var(--blue)}
[data-luz="claro"] .tut-hero .tut-selo{background:#f0f8e4;border-color:#a8cc6e;color:var(--lime)}
[data-luz="claro"] .tut-dica{background:#fff}
[data-luz="claro"] .cap-heroi{background:linear-gradient(160deg,#f0f8e4,var(--card) 70%);border-color:#a8cc6e}
[data-luz="claro"] .cap-porta i{background:#eef1f7}
[data-luz="claro"] .cap-porta.destaque{background:#f7fcef;border-color:#a8cc6e}
[data-luz="claro"] .cap-porta.destaque i{background:#eef7e2}
[data-luz="claro"] .cap-manual .ico{background:#eef1f7}
[data-luz="claro"] .cap-ok{background:#f0f8e4;border-color:#a8cc6e}
[data-luz="claro"] .cap-ok .ico{background:#e4f3d2;border-color:#a8cc6e}
[data-luz="claro"] .round,[data-luz="claro"] .marc,[data-luz="claro"] .pay,
[data-luz="claro"] .campo input,[data-luz="claro"] .campo textarea,
[data-luz="claro"] .pt-linha,[data-luz="claro"] .motivo,[data-luz="claro"] .foto,
[data-luz="claro"] .escrever,[data-luz="claro"] .msg.deles{background:#fff}

/* 1. O lima vivo só preenche. Onde ele era TINTA, entra o verde escuro.
   🔴 E TINTA BRANCA TAMBÉM É TINTA: o número da parada e o "HB" do logotipo
   nasceram brancos pro fundo escuro. No claro isso mede 1,1:1 — some. Toda
   peça de tinta fixa (#fff cravado) tem que ter par claro. */
[data-luz="claro"] .num{background:#eef3fc;box-shadow:none;border-color:var(--blue);color:var(--blue)}
[data-luz="claro"] .num.lime{border-color:var(--lime);background:#eef7e2;color:var(--lime)}
[data-luz="claro"] .num.off{color:var(--ink-2)}
[data-luz="claro"] .logo .w b{color:var(--ink)}
[data-luz="claro"] .logo small{color:#39445a}
[data-luz="claro"] .ext-linha .m.mais{background:#e4f3d2;color:#33660a}
[data-luz="claro"] .ext-linha .m.menos{background:#fbe3e3;color:#a01a16}
[data-luz="claro"] .previa.entra .marca{background:#e4f3d2;color:#33660a}
[data-luz="claro"] .previa.sai .marca{background:#fbe3e3;color:#a01a16}
[data-luz="claro"] .pt-linha .m{background:#fdf1de;color:#7a4a00}
[data-luz="claro"] .btn-blue,[data-luz="claro"] .enviar,[data-luz="claro"] .pacote .selo{color:#fff}
[data-luz="claro"] .num.off{border-color:var(--line-2);background:transparent}
[data-luz="claro"] .tag.lime{border-color:#a8cc6e;color:var(--lime);background:#f0f8e4}
[data-luz="claro"] .tag.blue{border-color:#9dbdf0;color:var(--blue);background:#eaf1fe}
[data-luz="claro"] .tag{border-color:var(--line-2);color:var(--ink-2)}
/* Os dois tons novos no claro: mesma regra das peles de cima — preenchimento
   pálido, borda que define o limite, tinta escura o bastante pra ler em 10px. */
[data-luz="claro"] .tag.amber{border-color:#e0b978;color:var(--amber);background:#fdf3e0}
[data-luz="claro"] .tag.red{border-color:#e6a3a3;color:var(--red);background:#fff5f5}
[data-luz="claro"] .who span.nota{color:#7a4a00}
[data-luz="claro"] .perna.alerta span{color:var(--red);border-color:#e6a3a3;background:#fff5f5}
[data-luz="claro"] .pill.lime{background:#eef7e2;border-color:#a8cc6e;color:var(--lime)}
[data-luz="claro"] .pill.blue{background:#eaf1fe;border-color:#9dbdf0;color:var(--blue)}
[data-luz="claro"] .pill.amber{background:#fdf1de;border-color:#e0b978;color:var(--amber)}
[data-luz="claro"] .pill.mute{background:#fff;border-color:var(--line-2);color:var(--ink-2)}
[data-luz="claro"] .chip.on{background:#f0f8e4;border-color:var(--lime);color:var(--lime)}
/* 🔴 O SELETOR DE ORDEM ENTRA AQUI JUNTO (08/08, MEDIDO). `--sel-bg` é verde
   quase PRETO: no escuro dá 10,51:1 e no claro dava 3,25:1 — reprovado, e
   visualmente uma pílula preta no meio de uma tela branca. O `.chip.on` logo
   acima nunca teve esse defeito porque tem esta linha; a peça nova nascia sem
   ela. Mesmo fundo do chip, de propósito: as duas fileiras vivem coladas na
   mesma tela, e "padronizar é IGUALAR". */
[data-luz="claro"] .modos{background:#fff}
[data-luz="claro"] .modos .modo.on{background:#f0f8e4;box-shadow:inset 0 0 0 .7px var(--lime);color:var(--lime)}
[data-luz="claro"] .montagem-dia.active,[data-luz="claro"] .dias button.on,
[data-luz="claro"] .tempo button.on{background:#f0f8e4;border-color:var(--lime);color:var(--lime)}
[data-luz="claro"] .filtro button.on{background:#f0f8e4;border-color:var(--lime);color:var(--lime)}
[data-luz="claro"] .pacote.on,[data-luz="claro"] .pay.sel{background:#f4faea;border-color:var(--lime)}
[data-luz="claro"] .price{background:#f4faea;border-color:var(--lime);color:var(--lime)}
[data-luz="claro"] .price::after{background:var(--bg)}
[data-luz="claro"] .form-c.total{background:#f4faea}
[data-luz="claro"] .ava{background:#eaf1fe;border-color:#9dbdf0;color:var(--blue)}
[data-luz="claro"] .ava.lime{background:#f0f8e4;border-color:#a8cc6e;color:var(--lime)}
/* Mesmo par do `.tag.red`/`.perna.alerta` do claro (#fff5f5 com fio #e6a3a3): a
   régua do claro é 1 atributo + 1 classe e vence `.ava.red` sozinha — sem esta
   linha o dia cancelado ficava AZUL no modo dia. Medido, não deduzido. */
[data-luz="claro"] .ava.red{background:#fff5f5;border-color:#e6a3a3;color:var(--red)}
[data-luz="claro"] .rowcard .ico{background:#eaf1fe;color:var(--blue)}
[data-luz="claro"] .rowcard .ico.lime{background:#f0f8e4;color:var(--lime)}
/* PAINEL DA BUSCA AVULSA — as 4 peças que o claro não herda por token.
   `--sel-bg`, `--blue-bg` e `--field` só existem no escuro: usar qualquer uma
   delas no claro põe um retângulo quase preto no meio da folha branca. É a
   regra da casa nesta folha ("MODO CLARO — DESENHADO, não derivado"). */
[data-luz="claro"] .avb-item.on{background:#f0f8e4;border-color:var(--lime)}
[data-luz="claro"] .rowcard .ico.rua{background:#eef2f8;color:var(--ink-2)}
[data-luz="claro"] .avb-num input{background:#f7f9fc;border-color:var(--line)}
[data-luz="claro"] .avb-grupo em{background:#fff;border-color:var(--line-2)}
[data-luz="claro"] .linha-cfg .ico{background:#eef2f8;color:var(--ink-2)}
[data-luz="claro"] .thumb{background:#eaf1fe;border-color:#c2d6f5;color:var(--blue)}
[data-luz="claro"] .thumb.t-azul,[data-luz="claro"] .thumb.t-azul-escuro{color:var(--blue)}
[data-luz="claro"] .thumb.t-cinza{color:#455a78}
[data-luz="claro"] .thumb.t-lima{color:var(--lime)}
[data-luz="claro"] .marca.info{background:#eaf1fe;color:var(--blue)}
[data-luz="claro"] .map-ctrl button.ativo{background:#dbe8ff;color:var(--blue)}
[data-luz="claro"] .numwrap{background:#f3f6fb}
[data-luz="claro"] .stop.on{background:#eaf1fe;border-color:#9dbdf0}
[data-luz="claro"] .nav button.on{background:#eef7e2;color:var(--lime)}
/* 🔴 A CHAVE ERA INVISÍVEL NO CLARO: trilho #d5dded no cartão branco = 1,78:1,
   e a bola branca dentro do trilho = 1,36:1. Interruptor que não se enxerga é
   o pior tipo de defeito — o dono não sabe se está ligado. Agora quem define o
   limite é a BORDA (3,1:1 contra o branco), nos dois estados. */
[data-luz="claro"] .chave{background:#eef2f8;border-color:#75879f}
[data-luz="claro"] .chave i{background:#5d6d87}
[data-luz="claro"] .chave.on{background:var(--lima-viva);border-color:#4f8a00}
[data-luz="claro"] .chave.on i{background:#1e3406}
[data-luz="claro"] .dia-bar .trilho,[data-luz="claro"] .prog-b{background:#e2e8f2}
[data-luz="claro"] .dia-bar .trilho i,[data-luz="claro"] .prog-b i,
[data-luz="claro"] .splash-barra i{background:linear-gradient(90deg,var(--splash-marca),var(--splash-marca-2))}
[data-luz="claro"] .perna span{background:var(--bg);border-color:var(--line-2);color:var(--ink-2)}
/* Fundos escuros cravados que ficaram pra trás na 1ª passada — cada um destes
   era uma caixa preta no meio da tela clara. Achados pela varredura, não a olho. */
[data-luz="claro"] .week .mk{background:#f4faea;border-color:#a8cc6e}
[data-luz="claro"] .motivo.on{background:#fdf3e0;border-color:#e0b978}
[data-luz="claro"] .foto .quadro{background:#eaf1fe;color:var(--blue)}
[data-luz="claro"] .pt-nums,[data-luz="claro"] .pt-campo input,
[data-luz="claro"] .pt-campo .resto{background:#f7f9fc;border-color:var(--line)}
[data-luz="claro"] .tmx-sat .cont{border-color:#fff;color:#2b1a00}

/* 🔴 BRANQUEAR "TODO BOTÃO" APAGA O BOTÃO QUE IMPORTA. Esta regra existe pro
   botão FANTASMA (o secundário, que no escuro era transparente ou cor de
   cartão). Só que `[data-luz] .portao .acoes button` é mais forte que
   `.portao .acoes .azul`: o branco descia por cima do azul e do lima também.
   Medido no claro: o "Atualizar" ficava BRANCO NO BRANCO — 1:1, botão
   invisível. E o principal perdia o lima, virando gêmeo do secundário: numa
   tela de decisão, o dono deixava de enxergar qual é o caminho.
   O `:not()` devolve o fantasma pro fantasma. */
[data-luz="claro"] .passo button,[data-luz="claro"] .filtro button,
[data-luz="claro"] .ghost,
[data-luz="claro"] .erro .acoes button:not(.principal),
[data-luz="claro"] .conf .acoes button:not(.principal),
[data-luz="claro"] .portao .acoes button:not(.principal):not(.azul){background:#fff}

/* O botão principal mantém o lima VIVO, mas com tinta escura: 8,6:1.
   Branco sobre lima daria 1,8:1 — no sol do para-brisa some. */
[data-luz="claro"] .act.go{background:linear-gradient(180deg,#9ce02f,#6fb31c);
  box-shadow:0 6px 16px rgba(111,179,28,.28)}
[data-luz="claro"] .act.go,[data-luz="claro"] .act.go b,[data-luz="claro"] .act.go small,
[data-luz="claro"] .tmx-main button,[data-luz="claro"] .conf .acoes .principal,
[data-luz="claro"] .portao .acoes .principal,[data-luz="claro"] .recado .acoes .principal{color:#16260a}
/* 🔴 O PERIGO NÃO ESCREVE COM TINTA DE LIMA (15/08, MEDIDO: 1,96:1). A regra
   de cima serve o CASO COMUM do principal (fundo lima, tinta escura) — mas
   `.portao.perigo .acoes .principal` tem fundo `--danger-btn` (vermelho), não
   lima, e com a MESMA especificidade da regra de cima (ver `.portao.perigo
   .acoes .principal` no bloco compartilhado, ~873) quem vence é quem vem
   DEPOIS no arquivo. Esta entra depois de propósito e devolve o branco — o
   par já homologado do `.erro` claro (#b3211c/#fff = 6,66:1, ~3009). */
[data-luz="claro"] .portao.perigo .acoes .principal{color:var(--white)}
[data-luz="claro"] .tmx-main button{background:linear-gradient(180deg,#9ce02f,#6fb31c);
  box-shadow:0 8px 20px rgba(111,179,28,.3)}
[data-luz="claro"] .tmx-main button[data-estado="pausar"]{background:linear-gradient(180deg,#ffc153,#e08a00);color:#2b1a00}
[data-luz="claro"] .tmx-main button[data-estado="montar"]{background:linear-gradient(180deg,var(--btn-blue-1),var(--btn-blue-2));color:#fff}
[data-luz="claro"] .btn-blue,[data-luz="claro"] .conf .acoes .azul,
[data-luz="claro"] .portao .acoes .azul{color:#fff}
[data-luz="claro"] .enviar{background:var(--lima-viva);color:#16260a}
/* 🔴 A AULA CAIU NAS DUAS ARMADILHAS DO CLARO — as duas MEDIDAS, não achadas.
   1) "Pular" usava `--chip-bg` direto, e esse token NÃO é redefinido no claro
      (quem troca são os componentes, um a um, na linha do `.round` acima):
      deu 1,03:1, tinta invisível. 2) o botão principal herdava `--lime`, que no
      claro é o verde que ESCREVE (escuro) — 3,23:1 com a tinta escura. Aqui
      entra o lima VIVO de preencher, igual ao `.act.go`. */
/* 🔴 E O X DO TOUR ENTRA NA MESMA LISTA — pela armadilha nº1 acima, palavra por
   palavra: ele também nasceu com `--chip-bg`, o token que o claro NÃO
   redefine. Peça nova do balão que não entrar aqui repete o 1,03:1. */
[data-luz="claro"] .aula-cx .pe button,[data-luz="claro"] .aula-cx .fechar{background:#fff}
/* A sombra do balão era a de NOITE (`rgba(0,0,0,.5)`) — no claro ela vira uma
   mancha preta embaixo do cartão branco. Mesma sombra dos irmãos (`.aviso`). */
[data-luz="claro"] .aula-cx{box-shadow:0 12px 30px rgba(15,23,38,.16)}
[data-luz="claro"] .aula-cx .pe .principal{background:linear-gradient(180deg,#9ce02f,#6fb31c);
  border-color:#6fb31c;color:#16260a}
/* O trilho da barra é o MESMO da barra do aviso (`--barra-trilho` é tinta de
   noite; no cartão branco ele viraria um risco preto). E o preenchido é o
   verde de ESCREVER, não o de preencher: o lima vivo (#6fb31c) dava 2,10:1
   contra o trilho — barra é objeto gráfico, vale a régua dos 3:1 igual. */
[data-luz="claro"] .aula-prog{background:#e2e8f2}
[data-luz="claro"] .aula-prog i{background:#3f7a00}
/* O anel da dica é o MESMO anel do furo — a dica não muda a fronteira, ela
   pisca a que já existe. Cor diferente aqui seria uma segunda régua. */
[data-luz="claro"] .aula-furo::after{border-color:#264900}
[data-luz="claro"] .pacote .selo{background:var(--lime);color:#fff}

/* 2. Brilho vira sombra. */
[data-luz="claro"] .gps-puck .gps-seta{filter:drop-shadow(0 2px 5px rgba(15,23,38,.35))}
[data-luz="claro"] .splash-barra i{box-shadow:none}
[data-luz="claro"] .splash-xis line{filter:drop-shadow(0 1px 3px rgba(63,122,0,.35));stroke:var(--splash-marca)}
[data-luz="claro"] .splash-flash{background:radial-gradient(circle,rgba(122,192,32,.5),rgba(122,192,32,0) 68%)}
[data-luz="claro"] .splash-anel{border-color:var(--splash-marca-2)}

/* 3. Fundos de estado — tinta clara, borda visível. */
[data-luz="claro"] .banner.alerta{background:#fdf3e0;border-color:#e0b978;color:var(--amber)}
[data-luz="claro"] .banner.pausa{background:#eaf1fe;border-color:#9dbdf0;color:var(--blue)}
[data-luz="claro"] .banner b,[data-luz="claro"] .aviso strong{color:var(--ink)}
[data-luz="claro"] .aviso{background:#fff;border-color:var(--line-2);box-shadow:0 10px 26px rgba(15,23,38,.14)}
[data-luz="claro"] .aviso .ico{background:#eaf1fe;color:var(--blue)}
[data-luz="claro"] .aviso.ok .ico{background:#f0f8e4;color:var(--lime)}
[data-luz="claro"] .aviso.alerta .ico{background:#fdf3e0;color:var(--amber)}
[data-luz="claro"] .aviso .barra{background:#e2e8f2}
[data-luz="claro"] .recado{background:#fdf3e0;border-color:#e0b978}
[data-luz="claro"] .recado .ico{background:#f8e6c8;color:var(--amber)}
/* Mesmo âmbar suave do cartão do portão: uma cor só pra "a Central mandou isto".
   🔴 O `:not()` NÃO É ENFEITE — sem ele esta regra empata em especificidade com
   `.msg .anexo.encaixada .ico`, vem DEPOIS no arquivo e ganha: no modo claro o
   anexo já encaixado voltaria a ficar âmbar, dizendo "decida" numa coisa
   decidida. A pele do estado tem que valer nos dois modos ou não vale. */
[data-luz="claro"] .msg .anexo:not(.encaixada):not(.negada) .ico{background:#f8e6c8;color:var(--amber)}
[data-luz="claro"] .recado .acoes button:not(.principal){background:#fff}
[data-luz="claro"] .msg.minha{background:#f0f8e4;border-color:#a8cc6e}
[data-luz="claro"] .scrim,[data-luz="claro"] .portao-wrap,
[data-luz="claro"] .conf-wrap,[data-luz="claro"] .erro-wrap,
[data-luz="claro"] .chegou-wrap{background:rgba(20,28,45,.42)}
/* A aula segue os irmãos: no claro o escuro em volta afrouxa (mesma família do
   scrim/portão), senão o furo vira um holofote de teatro em cima do branco.

   🔴 A TERCEIRA ARMADILHA DO CLARO, e ela é FILHA da linha de cima. Com o véu
   afrouxado em .42 o entorno vira um cinza médio (146,152,162 — composto e
   MEDIDO), e o `--lime` do claro (#3f7a00, o verde que ESCREVE) dava 1,81:1
   contra ele: o anel que existe pra dizer "olhe aqui" sumia justamente do lado
   de fora, que é de onde o olho vem. Escurecer o véu até o anel aparecer
   exigiria .83 de opacidade — o holofote de teatro que esta regra evita. Então
   quem desce é o ANEL: 3,55:1 contra o véu e 10:1 contra o alvo claro embaixo.
   Anel precisa dos 3:1 nos DOIS lados — ele é a fronteira, não a decoração. */
/* 🔴 E O ANEL DO CLARO GANHOU CORPO, NÃO COR (17/08). O véu daqui continua em
   `.42` pela conta acima — escurecer para o anel "aparecer" derrubaria o
   próprio anel (3,55:1 → 2,98:1, MEDIDO). Quando a cor está travada nos dois
   lados, o que sobra é ESPESSURA: 2px de borda (herdada da peça base) mais um
   halo escuro de 3px colado por fora, que separa o alvo do cinza do véu sem
   mexer em uma tinta sequer. Halo é decoração e não carrega régua — quem
   carrega continua sendo a borda. */
[data-luz="claro"] .aula-furo{box-shadow:0 0 0 3px rgba(20,28,45,.22),0 0 0 9999px rgba(20,28,45,.42),0 0 14px rgba(63,122,0,.3);
  border-color:#264900}
[data-luz="claro"] .sheet{background:linear-gradient(180deg,#fff,#fbfcfe 30%);border-color:var(--line)}

/* 🔴 O SELO DO PORTÃO CONTINUAVA DE NOITE DENTRO DO CARTÃO BRANCO. O `.aviso`
   tem as 3 linhas do claro (ok/alerta/info, logo acima); o `.portao` só ganhou
   a do `trava` (abaixo) e os outros três seguiam com os tokens de noite.
   MEDIDO no print do g15, portão "ok" no claro: bloco #17230e a 15,8:1 contra
   o cartão branco — um buraco preto no cartão — e o tique em `--lime` (que no
   claro é #3f7a00, o verde que ESCREVE) a 3,02:1 DENTRO dele, raspando o piso
   de 3:1 de objeto gráfico. Mesmos valores do `.aviso`, que é o irmão desta
   peça: padronizar é IGUALAR, não escolher um tom novo. */
[data-luz="claro"] .portao.ok .ico,[data-luz="claro"] .chegou-cartao .seta{background:#f0f8e4;color:var(--lime)}
[data-luz="claro"] .portao.alerta .ico{background:#fdf3e0;color:var(--amber)}
[data-luz="claro"] .portao.info .ico{background:#eaf1fe;color:var(--blue)}

[data-luz="claro"] .erro,[data-luz="claro"] .portao.trava{background:#fff5f5;border-color:#e6a3a3}
[data-luz="claro"] .erro .ico,[data-luz="claro"] .portao.trava .ico{background:#fbe3e3;color:#b3211c}
[data-luz="claro"] .erro .acoes .principal{background:#b3211c;border-color:#b3211c;color:#fff}
/* O satélite Cancelar ganhava BORDA VERMELHA no claro: virava um anel em volta
   de um ícone que já é vermelho — cor repetida em duas camadas. A borda volta
   pro fio neutro; quem diz "perigo" é o glifo. */
[data-luz="claro"] .acoes .perigo,[data-luz="claro"] .tmx-sat.tmx-perigo button{color:var(--red);border-color:var(--line-2)}
/* Sobras da 1ª passada do claro, achadas MEDINDO a borda (não a olho): as três
   pintavam fio escuro do tema de noite em cima do cartão branco. */
[data-luz="claro"] .act.perigo{border-color:#e6a3a3}
[data-luz="claro"] .tmx-sat.tmx-info button{border-color:#9dbdf0;color:var(--blue)}
[data-luz="claro"] .tmx-sat.tmx-aviso button{border-color:#e0b978;color:var(--amber)}
/* Campo com erro: no escuro o fundo é quase preto. No claro tem que ser um
   ROSA claro — senão o campo errado vira o único buraco preto da tela. */
[data-luz="claro"] .campo.erro input{border-color:#e6a3a3;background:#fff5f5}
[data-luz="claro"] .gps-rodape .sair{background:#fff;border-color:#e0a9a7;color:#a01a16}
/* O claro não repinta mais o `.esq` na mão: ele só troca `--esq-1`/`--esq-2`
   lá em cima, junto com os outros tokens. Tema troca TOKEN, não regra. */
[data-luz="claro"] .vazio .ico{background:#fff;border-color:var(--line);color:var(--ink-3)}
[data-luz="claro"] [data-gestos] .stop::after{background:rgba(192,32,27,.14)}
[data-luz="claro"] [data-gestos] .stop.pronto{background:#fff2f1;border-color:var(--red)}

/* Barras fixas: branco sólido, separadas por fio — sem gradiente de fumaça. */
[data-luz="claro"] .nav,[data-luz="claro"] .tmx-dock,[data-luz="claro"] .gps-rodape{
  background:#fff;border-top-color:var(--line)}
/* 🔴 TODA PEÇA DE VIDRO POR CIMA DE MAPA ENTRA NESTA LISTA — e as duas do mapa
   2D nasceram FORA dela (medido 08/08: a barra saía #0b1322 sobre um mapa
   claro, com o "12 paradas · 6 entregues" tinta escura em cima de fundo escuro,
   ilegível). `--glass` existe só no tema de noite; no claro quem manda é esta
   regra. Peça nova de vidro que não entrar aqui repete o mesmo defeito. */
[data-luz="claro"] .gps-manobra,[data-luz="claro"] .next-card,
[data-luz="claro"] .map-chip,[data-luz="claro"] .map-ctrl button,
[data-luz="claro"] .gps-bussola,[data-luz="claro"] .gps-vel,
[data-luz="claro"] .emp-chip,
[data-luz="claro"] .plano-bar,[data-luz="claro"] .plano-lado button,
[data-luz="claro"] .gps-lado button{background:#fff;border-color:var(--line-2);
  box-shadow:0 2px 10px rgba(15,23,38,.12)}
[data-luz="claro"] .gps-manobra .seta{background:transparent;color:var(--ink)}
[data-luz="claro"] .gps-manobra .baixo{background:#f4f7fb;border-top-color:var(--line)}
[data-luz="claro"] .gps.dirigindo .gps-rodape{background:#fff;border-color:var(--line-2)}
/* A regra do tema claro seguiu a peça, não o nome: o botão que era vermelho
   virou o "Panorâmica", que não destrói nada. Ela some — o claro já herda a cor
   de tinta do `.gps-encerrar button`, e o único destaque desta faixa continua
   sendo o lima do "Encerrar dia", que o `[data-luz]` não sobrescreve. */

/* O mapa claro: RUA BRANCA sobre quadra cinza — exatamente o oposto do escuro,
   onde a rua é que é escura. Sem isto o mapa fica preto no meio da tela clara. */
[data-luz="claro"] .app{
  --map-fundo:#e6ebf3; --map-quadra:#dbe2ed; --map-rua2:#f2f5fa;
  --map-parque:#d9ead9; --map-pino:#ffffff;
  /* 🔴 O pino virou BRANCO no claro e o número dentro dele continuava branco:
     o "3" da parada da vez sumia dentro de um círculo branco gigante — foi o
     "mapa+fila bugado" da foto. Tinta do pino é token, como todo o resto. */
  --map-pino-tinta:#1c3d00;
  /* o rótulo do nome acompanha o tema: no claro o `--ink` e o `--glass` já são
     os do modo claro, então basta reapontar (nada de hex novo aqui). */
  --map-pino-nome:var(--ink); --map-pino-nome-fundo:var(--glass);
  --map-rota:#5a9c10; --map-rota-borda:#3f7a00; --map-leito:#cfd8e6;
  /* 🔴 AQUI O ANEL SAI DO VERDE, e a conta é que mandou (ver o token no escuro).
     Sobre o chão claro (#e6ebf3) a lima do escuro dava 2,83:1 e reprovava; os
     verdes da própria família também não fecham a conta INTEIRA — medidos, o
     `--map-rota-borda` (#3f7a00) dá 4,39 contra o chão mas 1,55 contra a fita,
     e nenhum tom de verde entre eles passa nos dois. #1c3d00 é o único que
     fecha: 10,22 contra o chão e 3,61 contra a fita. Continua sendo verde — é
     o verde no fundo do poço, a mesma tinta que o número do pino já usa nesta
     pele — então a peça não muda de família, só de profundidade. */
  --map-pino-anel:#1c3d00;
  /* No claro a cabeça INVERTE junto com o resto: sobre chão #e6ebf3 uma ponta
     branca não existiria. Azul cravado, que é o mesmo azul do "partida". */
  --map-cabeca:#0f4fc0;
  /* A CENA DAS RUAS no claro INVERTE, como todo o resto: no basemap claro a rua
     final é BRANCA sobre chão #e2dfda, então a rua que se desenha tem que ser
     mais ESCURA que o chão pra existir (2,41:1 contra ele) e clarear até o
     branco quando o mapa assenta. Cena escrevendo em branco sobre creme seria
     uma cena invisível. */
  --map-cena-rua:#9aa3ad;
  --map-cena-nome:#6d7787;
  /* O "eu" no claro: o mesmo azul, um tom mais FUNDO (o chão do mapa claro é
     #e6ebf3 — o azul de tela escura clareia demais ali) e o halo mais forte,
     porque transparência sobre cinza claro some. Anel branco fica branco: é
     ele que separa o ponto do mapa nas duas peles. */
  --eu-1:#1257c8;
  --eu-halo:rgba(18,87,200,.14); --eu-halo-linha:rgba(18,87,200,.3);
  --eu-cone:rgba(18,87,200,.42);
  --puck-vidro:rgba(255,255,255,.9); --puck-vidro-fio:rgba(15,23,38,.24);
  --puck-seta:#5a9c10; --puck-seta-fio:#ffffff;

  /* 🔴 AS EMPRESAS NO CLARO — paleta 1:1 do mock rota (gps-ruas-prospector-v4),
     que o dono desenhou com o claro DENTRO. O que resolve o contraste aqui é

/* Traço FINO: os ícones nasceram em 1,7–2,6 (grosso demais ao lado de texto
   leve). Aqui o traço é afinado num ponto só — 0,72 do original — em vez de
   reescrever 40 desenhos. Ícone e letra passam a ter o mesmo peso na tela. */
const afinar = svg => svg.replace(/stroke-width="([\d.]+)"/g,(m,w)=>`stroke-width="${(+w*0.72).toFixed(2)}"`);

/* 🔴 ÍCONE QUE NÃO EXISTE NÃO SAI CALADO (06/08).
   O `I[n] || ''` devolvia um <svg> VAZIO: o botão continuava lá, do tamanho
   certo, sem desenho nenhum. Foram 65 buracos em 32 das 33 telas — e o
   transmux perdeu justamente o Pausar e o Cancelar sem uma linha de erro.
   Nenhuma medida de layout pega isso, porque o layout está perfeito.
   Agora o nome errado vira uma CAIXA VERMELHA na tela e um aviso no console:
   mesma lei do CNEFE — best-effort que engole erro precisa de alarme. */
const ic=(n,s=18)=>{
  const desenho=I[n];
  if(!desenho){
    console.warn('[HBX 2.0] ícone inexistente no dicionário:',n);
    return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" aria-label="ícone ${n} não existe">
      <rect x="2.5" y="2.5" width="19" height="19" rx="4" fill="none" stroke="#f2555a" stroke-width="2"/>
      <path d="M8 8l8 8M16 8l-8 8" stroke="#f2555a" stroke-width="2" stroke-linecap="round"/></svg>`;
  }
  return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" aria-hidden="true">${afinar(desenho)}</svg>`;
};

const logo = `<div class="logo"><div class="w"><b>HB</b><em>X</em></div><small>LOGÍSTICA</small></div>`;

function hdr(o={}){
  /* 🔴 O SINO E O BALÃO IAM PRO MESMO LUGAR (medido 08/08: os dois eram
     `data-ir="chat"`). Dois botões, um destino — é a mesma mentira do "dado em
     2 cards". Ficou UM: o balão, que tem o nome do módulo na barra, e o selo do
     número mudou de dono junto com ele. A vaga que sobrou virou o "+".

     O "+" é CADASTRAR CLIENTE, em toda tela, sempre a mesma coisa — cadastro
     feito NA PORTA nasce com o local de verdade; digitado no escritório depois,
     nasce sem. `data-ir` de propósito nos dois: módulo desligado leva o atalho
     embora junto (`podarDesligados`). */
  /* 🔴 A AULA TEM QUE TER PORTA EM TODA TELA QUE TEM AULA. Tela de dentro
     (cadastro, montagem) troca a lâmpada da esquerda pela VOLTA — e a aula
     ficaria escrita e inalcançável, que é o botão morto ao contrário.
     Regra, sem exceção escrita à mão: se a tela TEM aula e a esquerda virou
     Voltar, a lâmpada senta na vaga do "+". Cadastrar cliente continua a um
     toque dali (Voltar), e nessas telas o "+" era o botão menos usado. */
  const mais = (AULAS[atual] && o.voltar)
    ? `<button class="round" data-aula="1" aria-label="Como usar esta tela">${ic('bulb',18)}</button>`
    : `<button class="round" data-ir="novocliente" aria-label="Cadastrar cliente">${ic('plus',18)}</button>`;
  const dir = o.live
    ? `<div class="pill-live"><i></i>${o.live}</div>`
    : `<div style="display:flex;gap:7px">${mais}
        ${o.semChat?'':`<button class="round" data-ir="chat" aria-label="Chat com a Central">${ic('chat',17)}${DADOS.chat.sino?`<i class="cnt">${DADOS.chat.sino}</i>`:''}</button>`}</div>`;
  // Tela que se entra por dentro (ficha, folha) troca a lâmpada pela VOLTA — a
  // aula ali seria a saída errada e o Voltar do Android tem que casar.
  // O hambúrguer morreu em 08/08: não abria nada desde que a barra de 3 virou a
  // navegação (dono: "os ícones acima do HBX estão mortos"). No lugar dele, a
  // LÂMPADA — a aula da tela que está aberta.
  /* 🔴 A VOLTA VEM MARCADA (`data-voltar`), NUNCA DEDUZIDA. O Voltar do Android
     procurava "o primeiro `data-ir` do cabeçalho" — e em TODA tela sem volta
     (rota, chat, venda, ajustes, folha) o primeiro é o "+". Resultado medido:
     na Rota, o Voltar do aparelho ABRIA "Cadastrar cliente". Voltar deduzido
     por posição anda pra frente na hora que alguém mexe na ordem dos ícones;
     marcado, só o botão de voltar responde. Quem tem volta e NÃO nasce aqui
     (o × das folhas) carrega a mesma marca — a régua é a marca, não o lugar. */
  const esq = o.voltar
    ? `<button class="round" data-voltar="1" data-ir="${o.voltar}" aria-label="Voltar">${ic('back',18)}</button>`
    : `<button class="round" data-aula="1" aria-label="Como usar esta tela">${ic('bulb',18)}</button>`;
  // 🔴 O LOGO NÃO ANDA. Os flancos entram EMBRULHADOS com a mesma largura
  // mínima: com 1 ou 2 ícones do lado, o HBX fica cravado no centro em toda
  // tela (medido: sem isto o logo passeava 143↔164 entre abas).
  /* 🔴 O GUIA FLUTUA SOBRE O MAPA EM TELA CHEIA (17/08 — decisão do dono no
     chat: *"cabeçalho + barra, como na foto 5"*). É o MESMO cabeçalho, com o
     mesmo miolo e os mesmos ganchos: o que muda é ele deixar de EMPURRAR o
     corpo e passar a ser vidro por cima do dia (a mesma lei que a `.plano-bar`
     já cumpre logo abaixo dele — "mapa que começa debaixo de uma faixa opaca é
     mapa com menos mapa"). Cabeçalho clonado pra tela cheia seria a segunda
     cópia da mesma peça, e cópia é o que discorda no dia seguinte. */
  return `<header class="hdr${o.flutua?' flutua':''}"><div class="hdr-row">
      <div class="hdr-flanco">${esq}</div>${logo}<div class="hdr-flanco dir">${dir}</div>
    </div></header>`;
}

/* ==========================================================================
   A BARRA — e ela é a ORDEM DE TUDO: dos botões, do arrastar e do que some.

   ITEM 9 DO DONO (07/08): *"deixar os módulos do motorista na mão do ADMIN
   (não dentro do app, no desktop)... desativar qualquer módulo q ele quiser
   (fechamento, clientes, produtos, chat, ajustes) MENOS ROTA"*.

   🔴 ROTA NUNCA SOME. O servidor já barra (mandar "rota" grava null), e esta
   linha é o cinto por cima do suspensório: app de entrega sem a rota não é
   app de entrega, e o motorista ficaria numa tela sem saída.

   🔴 DESLIGADO SOME DE VERDADE — não é só o botão. Sai da barra, sai do
   arrastar (`arrastarModulo`), não abre por rota direta (`ir`) e os ATALHOS
   que levavam pra lá somem junto (`podarDesligados`). Botão que existe e não
   leva a lugar nenhum é pior que botão ausente.

   🔴 SEM FONTE, NADA SOME. `DADOS.barra.desligados` nasce VAZIO e só a ponte
   escreve, depois que o servidor responde. Rede caída NÃO pode esconder
   módulo — é a mesma lei do esqueleto: "vazio porque o servidor disse" e
   "vazio porque a rede caiu" são opostos, e aqui o padrão do silêncio é
   MOSTRAR TUDO.
   ========================================================================== */
/* 🔴 BARRA DE 3 (decisão do dono, 07/08): Chat na esquerda, Rota no centro,
   Ajustes na direita — padrão de app de motorista. Fechamento, Clientes e
   Produtos NÃO morreram: Clientes/Produtos moram em Ajustes › Cadastro e a
   fechamento abre pelo caixa da Rota (e por Ajustes). O CSV do admin continua
   valendo pra essas entradas via `podarDesligados`/`ir`. */
const NAV_ITENS=[['chat','Chat','chat'],['rota','Rota','map'],['ajustes','Ajustes','gear']];
/** O CSV que o admin gravou no desktop, virado em lista. Vazio = tudo ligado. */
function modulosDesligados(){
  return String((DADOS.barra&&DADOS.barra.desligados)||'')
    .split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
}
function moduloDesligado(k){
  if(k==='rota') return false;                       // a lei, de novo e aqui
  if(k==='ajustes') return false;                    // é a porta de tudo agora — murar é prender
  return modulosDesligados().includes(String(k||'').toLowerCase());
}
/** Os módulos que o motorista PODE ver — a ordem é a da barra, sempre. */
const navLigados=()=>NAV_ITENS.filter(([k])=>!moduloDesligado(k));

function nav(ativo){
  return `<nav class="nav">${navLigados().map(([k,l,i])=>
    `<button data-nav="${k}" class="${ativo===k?'on':''}">${ic(i,18)}<span>${l}</span>${ativo===k?'<i class="ping"></i>':''}</button>`
  ).join('')}</nav>`;
}

/* Os atalhos espalhados pelas telas (o "Fechamento do dia" do pé da rota, por
   exemplo) apontam pro módulo por `data-ir`. Se o admin desligou o módulo,
   esse botão vira porta pra parede — o `ir` recusa e o motorista toca duas,
   três vezes achando que o app travou. Some com ele na pintura, por REGRA:
   um lugar só, e vale pra qualquer atalho que apareça amanhã. */
function podarDesligados(tela){
  if(!modulosDesligados().length) return;            // nada desligado: nem varre
  tela.querySelectorAll('[data-ir]').forEach(el=>{
    if(moduloDesligado(el.dataset.ir)) el.remove();
  });
  /* 🔴 O ATALHO QUE NÃO TROCA DE TELA TAMBÉM É ATALHO (17/08, item 9 do dono).
     O chat da coluna do mapa deixou de ser `data-ir` e virou `data-acao`
     (`abrir-chat`, o pop-up que não sai da tela cheia) — e por isso saiu da
     varredura de cima sem ninguém notar. Módulo desligado pelo admin tem que
     levar TODA porta embora, senão o motorista toca num balão que abre um
     pop-up vazio. A régua é a marca, não o mecanismo: quem aponta pro chat
     morre junto com o chat. */
  if(moduloDesligado('chat')) tela.querySelectorAll('[data-acao="abrir-chat"]').forEach(el=>el.remove());
  // Caixa dos Ajustes que ficou vazia leva o título junto — título de pé
  // sobre caixa vazia é a mesma mentira do slot sem fonte.
  tela.querySelectorAll('.cartao-lista').forEach(c=>{
    if(!c.children.length){
      const t=c.previousElementSibling;
      if(t&&t.classList.contains('grupo')) t.remove();
      c.remove();
    }
  });
}

/* ==========================================================================
   TRANSMUX + ESTADOS DA ROTA (1ª leva da injeção do app real)
   O botão do meio é SEMPRE o que se faz agora; os satélites são no máximo dois
   e trocam de dono conforme o estado. Regra dura vinda do app: quando o sino
   de rotas recebidas e o Cancelar disputam a esquerda, o Cancelar fica (ele
   controla trabalho em andamento) e o sino só assume com a rota parada.
   ========================================================================== */
/* 🔴 SATÉLITE SEM CAMINHO NÃO FICA (dono, 07/08: "remove o ícone ou acha o
   caminho"). Saíram os três que eram botão morto: "Rotas recebidas" (a rota
   indicada morreu no corte de 06/08 — 4 usos na história, 2.981 polls),
   "Rota rápida" e "Adicionar" (a rota rápida do app antigo — geo/busca, CEP,
   link, conta, encaixe — é frente própria; a tela T.rapida fica de referência
   até ela nascer LIGADA). Quando a frente vier, o satélite volta COM ação.

   🔴 09/08 — A FRENTE VEIO, E A PORTA NÃO VOLTOU PRA CÁ. Dois motivos duros:
   (1) os dois slots de satélite já têm dono em todo estado que importa
   (`pronta` = Cancelar + Montagem; `rodando` = Cancelar + Finalizar), e
   despejar um deles pra caber o "+" trocaria um botão vivo por outro;
   (2) o dono foi procurar o "+" na MONTAGEM, não aqui — "estou em montagem de
   rota... cadê o +?". Porta boa é a que fica onde a mão vai. Ela mora no dock
   da Montagem e na barra da Rota·lista; ver `T.rapida`. */
const ROTA_ESTADOS={
  /* 🔴 "E SE EU QUISER COMEÇAR AGORA? NÃO ERA PRA SER INICIAR?" (dono, 09/08).
     Era. O motor JÁ fazia isso: `iniciarRota` na ponte abre com
     `if (estadoRota === 'montar' || !ENTREGAS.size) → planejar`, ou seja, o
     Iniciar MONTA sozinho quando não há ordem gravada, e só depois abre o
     portão com o custo REAL do servidor ("Debita 4,8 · você tem 9.340"). O que
     faltava era o BOTÃO: o dia por montar oferecia só "Montar rota", então
     sair pra rua custava dois toques em telas diferentes — e o segundo toque
     não decide nada que o primeiro já não tenha decidido.

     🔴 O PREÇO CONTINUA ANTES DA COBRANÇA. Encurtar não é cobrar escondido: o
     portão de crédito é o mesmo, com o número que o servidor mandou, e ele
     abre DEPOIS de montar (que é quando o custo existe de verdade). Um toque,
     uma decisão, o valor na frente dela.

     🔴 E A MONTAGEM NÃO PODE FICAR INALCANÇÁVEL — foi por isso que o `pronta`
     ganhou o satélite da direita, e o motivo vale igual aqui: rever a lista,
     trocar o dia, escolher o espaço ou pôr uma parada na mão continua a UM
     toque, no mesmo lugar em que ele já mora no estado seguinte. Sem "Cancelar"
     à esquerda porque ainda não há rota nenhuma pra cancelar. */
  montar:   {main:{acao:'iniciar', glifo:'play', rotulo:'Iniciar'},
             dir:{tipo:'info', glifo:'route', rotulo:'Montagem', acao:'montar'}},
  /* 🔴 DIA SEM UMA PARADA ABERTA NÃO GANHA "INICIAR" — e o corte é por parada
     ABERTA, não por lista vazia (medido 09/08 na company 41: 137 cartões na
     tela, 107 deles `cancelada`; "Iniciar" ali bateria em `Nenhuma entrega
     aberta neste dia. Monte a rota antes de iniciar`, que é o beco sem saída
     que o dono já levou na cara). Sem nada aberto, o que existe é MONTAR o dia
     — e a Montagem sabe receber o dia vazio (ela vira "Adicionar parada"). */
  semparada:{main:{acao:'montar', glifo:'route', rotulo:'Montar rota'}},
  /* Com a rota pronta o satélite da direita é a PORTA DE VOLTA pra montagem:
     rever a lista, salvar o roteiro, ou trocar o dia e montar de novo. Sem ele
     a montagem ficava inalcançável depois de montada — beco sem saída. */
  /* 🔴 "Iniciar rota", não "Iniciar" (16/08, ordem do dono). O verbo solto não
     dizia o que começava — e a palavra que faltava é justamente a que separa
     este dock do de baixo: aqui a rota AINDA NÃO está na rua. */
  pronta:   {main:{acao:'iniciar', glifo:'play', rotulo:'Iniciar rota'},
             esq:{tipo:'perigo', glifo:'close', rotulo:'Cancelar', acao:'cancelar-rota'},
             dir:{tipo:'info', glifo:'route', rotulo:'Montagem', acao:'montar'}},
  /* 🔴 A JANELA ENTRE O TOQUE E O DINHEIRO (16/08). `iniciando` é o
     `INITIALIZING` do servidor: a reserva já foi feita, o dia AINDA NÃO foi
     debitado (ver `estadoDaRota` na ponte). Ele não é `rodando` e não é
     `montando`:
     · não é `rodando` porque navegação e "Encerrar dia" não podem existir sobre
       um dia que o servidor não cobrou;
     · não é `montando` porque `montando` é recibo de toque MEU, que some sozinho
       em segundos — este aqui é estado do SERVIDOR e pode ficar preso (o
       `releaseInitialization` de lá é best-effort).
     Por isso ele tem satélite, e o satélite é o Cancelar: estado que pode
     durar precisa de porta, senão é o BECO que o "Recusado" já custou em 14/08.
     O main não tem ação — dois toques não iniciam duas vezes. */
  iniciando:{main:{glifo:'route', rotulo:'Iniciando…'},
             esq:{tipo:'perigo', glifo:'close', rotulo:'Cancelar', acao:'cancelar-rota'}},
  /* Ver uma pendência é consulta. As mutações ficam no cartão nomeado; o dock
     não oferece Iniciar/Cancelar e o mapa não reordena uma rota alheia/velha. */
  /* `nota:true` = estado PERMANENTE, não trabalho em curso. Sem isto ele caía
     no traje do "Montando…" (verde, respirando, aria-busy eterno) — ver a
     regra `.tmx-nota` no CSS. */
  consulta:{main:{glifo:'route', rotulo:'Somente consulta', nota:true}},
  /* Com a rota RODANDO o que o motorista faz é ANDAR: o botão do meio abre a
     navegação. "Pausar"/"Continuar" saíram — pausa não existe no servidor
     (o estado da rota é PLANNED|ACTIVE|COMPLETED|ENCERRADA), então eram dois
     botões que não pausavam nada. Fechar o dia é o "Finalizar" do pé da lista.

     🔴 OS VERBOS DESTE DOCK MENTIAM OS DOIS (16/08, dono com a tela na mão:
     *"pq no 2d está falando navegar? pq o 3d tem encerrar e o 2d não? eu já
     montei a rota, não tenho q clicar em iniciar se o 2d já é um modo
     iniciado"*).
     · "Navegar" era `window.ir('mapa')` e mais nada — ZERO rede, medido. Ele
       prometia começar uma navegação que já estava acontecendo: com a rota
       ACTIVE o 2D já tem fita, pinos, posição e o "Você chegou" automático. O
       que o toque faz é TROCAR A CÂMERA, e agora o rótulo diz isso:
       **Dirigindo** (de cima → inclinado). O par dele vive no rodapé do 3D:
       **Panorâmica** (inclinado → de cima). Dois nomes, um gesto, ida e volta.
     · "Finalizar" abria a tela de Fechamento e não finalizava nada — o mesmo
       destino que o 3D chamava de "Fechamento", com outro nome. Passa a ser
       **Encerrar dia**, apontando pro `fechar-dia`, que é o ÚNICO verbo que
       encerra de verdade (POST /logistica/rota/encerrar + a página do dia, e
       termina no recibo). A lei de 12/08 continua de pé — "o dia só fecha
       depois que o motorista viu o número" — porque `fecharDia` pergunta antes,
       num portão, e o número aparece no recibo do fim.
     · Sem `acao:'navegar'` mudar de nome: a chave é CONTRATO (o handler que
       leva ao 3D), o rótulo é DESENHO. Trocar a chave junto só quebraria o
       único caminho 2D→3D sem ninguém ver diferença na tela.
     · Glifo `lock` e tipo `info`: o satélite esquerdo já é `perigo` (Cancelar).
       Dois vermelhos lado a lado ensinariam que "encerrar o dia" e "destruir o
       dia" são a mesma coisa — e não são: um é o fim normal do trabalho. */
  /* 🔴 O CADEADO SAIU DO RODAPÉ E O REGISTRAR OCUPOU A VAGA (16/08, ordem do
     dono, com as duas telas na mão). A régua é FREQUÊNCIA: registrar acontece
     em toda porta, encerrar o dia acontece UMA vez — e o slot ao lado do polegar
     era do verbo raro. O `fechar-dia` não sumiu: virou o cadeado da coluna
     lateral, que é a MESMA peça (`.plano-lado` / `.gps-lado`) nos dois modos,
     então ele continua a um toque e agora mora no mesmo lugar nas duas telas.
     `dir` sem `tipo`: Registrar não é perigo nem aviso — é o verbo comum da
     rua, e veste a superfície neutra que o `.tmx-sat` já dá de fábrica. */
  /* 🔴 O PAINEL VIROU DE 4 (17/08 — ordem do dono, item 8: *"os botões de
     navegação vão precisar incluir +1, q é o finalizar. ajuste para ser um
     painel de 4 botões (2 e 3d) — deixe no centro registrar e finalizar, na
     esquerda cancelar e na direita (Panorâmica e direção)"*).
     A fileira passa a ser, na ordem do dedo: **Cancelar** (esquerda, perigo),
     **Registrar** e **Finalizar** (o par do centro, `meio`), e o verbo de TROCAR
     DE CÂMERA na direita — que continua sendo o botão grande e verde, porque é
     ele o "próximo passo" (a lei do `.tmx-main`) e é dele que as fotos 2 e 3 são
     as duas caras.
     🔴 E O CADEADO VOLTOU PRO RODAPÉ, DE ONDE SAIU HOJE DE MANHÃ. Ele tinha ido
     pra coluna lateral às 16/08 quando o Registrar ocupou a vaga do satélite;
     com QUATRO lugares não há mais disputa, e o dono quer o Finalizar na
     fileira. Ele sai da coluna no mesmo movimento (§ `colunaDoMapa`): botão
     repetido a 60px de si mesmo é o defeito que esta casa já pagou em 12/08.
     `tipo:'info'` (azul) e não `perigo`: encerrar o dia é o fim NORMAL do
     trabalho, e dois vermelhos lado a lado ensinariam que encerrar e destruir
     são a mesma coisa. */
  rodando:  {main:{acao:'navegar', glifo:'nav', rotulo:'Direção'},
             esq:{tipo:'perigo', glifo:'stop', rotulo:'Cancelar', acao:'cancelar-rota'},
             meio:[{glifo:'check', rotulo:'Registrar', acao:'registrar-local'},
                   {tipo:'info', glifo:'lock', rotulo:'Finalizar', acao:'fechar-dia'}]},
  /* 🔴 O RODAPÉ DO 3D NASCE DAQUI, DO MESMO LUGAR QUE O DO 2D (16/08). Ele era
     uma faixa própria (`.gps-encerrar`: três textos de 11,5px, sem ícone e sem
     legenda) — outro HTML, outro CSS, outra altura, pro mesmo trabalho. Dois
     desenhos pra mesma fileira é o que fez as fotos 1 e 2 parecerem telas de
     apps diferentes; agora existe UM gerador, e quem mexer numa mexe nas duas.
     O par do meio é o mesmo gesto nos dois sentidos: `Direção` leva de cima pro
     inclinado, `Panorâmica` traz de volta. Por isso o main aqui é `ir` e não
     `acao` — a volta é uma TELA (o roteador), não uma mutação. */
  dirigindo:{main:{ir:'rota', glifo:'map', rotulo:'Panorâmica'},
             esq:{tipo:'perigo', glifo:'stop', rotulo:'Cancelar', acao:'cancelar-rota'},
             meio:[{glifo:'check', rotulo:'Registrar', acao:'registrar-local'},
                   {tipo:'info', glifo:'lock', rotulo:'Finalizar', acao:'fechar-dia'}]},
  /* 🔴 O RECIBO DO TOQUE MORA NO BOTÃO TOCADO. Enquanto o servidor monta, o
     meio vira "Montando…": mesmo lugar, mesmo tamanho, SEM ação (dois toques
     não montam duas vezes) e sem satélite — cancelar ou iniciar no meio de uma
     montagem é botão que mente. Antes disto o sinal era o esqueleto da tela
     inteira, que leva o próprio rodapé embora: o dedo tocava e o botão sumia. */
  montando: {main:{glifo:'route', rotulo:'Montando…'}},
  /* 🔴 CARREGAR NÃO LEVA O CONTROLE EMBORA — e é o MESMO defeito do `montando`,
     uma linha acima, na porta ao lado. `carregando` não tinha entrada aqui, e
     sem entrada o `transmux` devolve vazio: a tela nascia SEM RODAPÉ NENHUM e o
     botão grande aparecia do nada quando o dado chegava — 120px de controle
     brotando debaixo do polegar de quem já estava mirando a tela. Mesmo lugar,
     mesma altura, respirando e SEM ação: enquanto o dia não chegou não há o que
     fazer, e prometer botão que não faz nada é pior que dizer "espera". */
  carregando: {main:{glifo:'route', rotulo:'Carregando…'}},
  /* 🔴 CANCELAR TAMBÉM É TRABALHO EM CURSO, E ERA O ÚNICO VERBO SEM RECIBO
     (17/08 — MEDIDO no g15, APK 339, gravação de tela do cancelamento real).
     O "Sim" do portão dispara rede (`POST /rota/continuidade/cancelar`), e até
     ela voltar o rodapé continuava sendo o de `dirigindo`: **860 ms** com a
     tela de navegação INTEIRA acesa, o traço verde no lugar e o próprio botão
     "Cancelar" ainda oferecido — 490 ms deles num quadro CONGELADO (frames
     pixel-idênticos na medição). Quem tocou lê isso como "o app ignorou meu
     toque" e toca de novo; o dono leu como "está um lixo, trava".
     É o MESMO defeito que o `montando` (duas linhas acima) curou pro Montar em
     15/08, e a cura é a mesma frase daquela nota: *o véu nasce ANTES do 1º
     pedido, síncrono*. Sem `acao` e sem `ir` de propósito — cancelar duas vezes
     não cancela mais rápido, e botão vivo no meio da própria destruição é botão
     que mente (mesma lei do `montando`).
     Glifo `stop`, o do satélite que abriu o gesto: o recibo veste a cara do
     verbo que o pediu, senão o olho procura o que mudou. */
  cancelando: {main:{glifo:'stop', rotulo:'Cancelando…'}},
};
function transmux(estado){
  const c=ROTA_ESTADOS[estado]; if(!c) return '';
  /* `tipo` virou OPCIONAL (16/08): satélite sem papel declarado é o verbo comum
     e veste a superfície neutra do `.tmx-sat`. Antes o nome saía sempre, e um
     satélite sem tipo escrevia `tmx-undefined` no HTML — classe que não existe,
     mas que aparece no retrato do `casca-conferir` como se fosse desenho. */
  const sat=(s,lado)=>s?`<span class="tmx-sat ${s.tipo?`tmx-${s.tipo} `:''}tmx-${lado}">
      <button aria-label="${s.rotulo}"${s.ir?` data-ir="${s.ir}"`:''}${s.acao?` data-acao="${s.acao}"`:''}>${ic(s.glifo,20)}${s.contagem?`<i class="cont">${s.contagem}</i>`:''}</button>
      <small>${s.rotulo}</small></span>`:'';
  // main sem `acao` e sem `ir` = trabalho em curso: não vira gancho, nem dedo.
  /* 🔴 A PALAVRA SAIU DO BOTÃO — e isto é uma VOLTA ATRÁS consciente (16/08,
     ordem do dono: "faça ícones, com um rótulo bem pequeno"). Ela tinha entrado
     em 15/08 porque era um `<small>` de 12px por baixo de um quadrado com ícone
     de 34px: o desenho grande não dizia nada e quem dizia era a menor letra do
     rodapé. O que muda agora e desarma aquele defeito é que o rótulo miúdo
     deixou de ser exceção — os TRÊS o têm, com o mesmo tamanho e na mesma
     linha, então ele lê como legenda de uma fileira e não como um botão que
     esqueceu o nome. O ícone sobe de 21 a 24 porque voltou a ser o cartaz.
     ⚠️ O botão perdeu o texto de dentro, então perdeu o nome acessível junto:
     o `aria-label` abaixo é obrigatório, não enfeite. */
  const gancho=c.main.ir?` data-ir="${c.main.ir}"`
    :c.main.acao?` data-estado="${c.main.acao}"`
    :' class="ocupado" disabled aria-busy="true"';
  /* 🔴 `meio` É UM ARRAY, E É O QUE FEZ O PAINEL DE 4 (17/08, item 8 do dono).
     Ele entra ENTRE o satélite da esquerda e o botão grande, na ordem em que foi
     escrito — então a fileira lê "Cancelar · Registrar · Finalizar · trocar de
     câmera", que é o pedido literal ("no centro registrar e finalizar").
     Nenhum estado antigo mudou de forma: quem não declara `meio` continua com
     os mesmos três lugares de sempre, e `dir` continua existindo pros estados
     que o usam (`montar`, `pronta`). Slot novo, nunca slot renomeado — trocar o
     nome do `dir` mexeria em cinco estados pra resolver dois. */
  const meio=(Array.isArray(c.meio)?c.meio:[]).map(s=>sat(s,'meio')).join('');
  /* 🔴 O MIOLO DO BOTÃO GRANDE É MARCADO (item 3: *"foto 2 e 3 vão transmuxar o
     botão entre eles"*). `data-modo` é o que permite a folha animar a TROCA do
     ícone quando o mesmo botão muda de trabalho (Direção ⇄ Panorâmica) em vez de
     a peça inteira nascer de novo — é a mesma ideia do `data-vivo` do
     velocímetro: marca o que muda, pra não derrubar o que ficou.
     🔴 E O VALOR É O DESTINO, NÃO O ESTADO ATUAL (17/08). Esta marca virou também
     o CONTRATO do modo lembrado: a ponte ouve o clique nela pra saber que o
     motorista ESCOLHEU uma câmera, e é essa escolha que o Montar obedece no
     pouso (§ `lembrarModo`, 45-troca-de-modo.js). Se o valor fosse "onde estou",
     quem lê teria que inverter — e inverter em dois lugares é como os dois
     discordam. Aqui e lá o vocabulário é o mesmo do `window.ir`: `rota` (2D) e
     `mapa` (3D). */
  const modo=c.main.ir==='rota'?'rota':c.main.acao==='navegar'?'mapa':'';
  return `<div class="transmux">${sat(c.esq,'esq')}${meio}
    <span class="tmx-main">
      ${c.main.nota
        ? `<span class="tmx-nota" role="status">${ic(c.main.glifo,24)}</span>`
        : `<button aria-label="${c.main.rotulo}"${gancho}${modo?` data-modo="${modo}"`:''}>${ic(c.main.glifo,24)}</button>`}
      <small>${c.main.rotulo}</small>
    </span>
    ${sat(c.dir,'dir')}</div>`;
}

function stop(o){
  const cor=o.cor||'blue';
  /* 🔴 O GANCHO NASCE DO DADO. A parada só vira botão quando tem `id` — que só
     existe quando o dado é REAL. No mock (paradas de maquete, sem id) o cartão
     continua inerte e a tela sai byte a byte igual à de antes.

     🔴 DUAS PORTAS, PORQUE SÃO DUAS COISAS (dono, 09/08: "no montagem de rota
     não consigo abrir o cliente"). Na ROTA a linha é uma ENTREGA e o toque abre
     a folha dela (`abrir-parada`). Na MONTAGEM a entrega ainda não existe — a
     linha é um CLIENTE do dia — e o toque tem que abrir a FICHA dele
     (`abrir-cliente`). A montagem não tinha gancho nenhum: o cartão era papel
     de parede, e o único jeito de ver quem era aquele cliente antes de sair pra
     rua era sair da tela e procurar na lista de Clientes. */
  const gancho=o.id?` data-acao="abrir-parada" data-parada="${o.id}"`
    :o.cliente?` data-acao="abrir-cliente" data-cliente="${o.cliente}"`:'';
  /* A POSIÇÃO DE ORIGEM DO CARTÃO NA PRÉVIA — é por ela que o arrasto da
     montagem fala (ver `posicoesDaPrevia` no `ligarLista`). Só existe onde a
     lista é prévia; na rota quem viaja é o id da entrega. */
  const naPrevia=o.previa!=null&&o.previa!==''?` data-previa="${o.previa}"`:'';
  return `<div class="stop ${o.on?'on':''}"${gancho}${naPrevia}>
    <span class="grip"></span>
    <span class="numwrap"><span class="num ${cor==='lime'?'lime':cor==='off'?'off':''}">${o.n}</span>
      <span class="hh ${cor==='lime'?'lime':cor==='off'?'off':''}">${o.hora}</span></span>
    <span class="who"><strong>${o.nome}</strong><span>${o.rua}</span><span>${o.bairro}</span>
      ${o.nota?`<span class="nota">${o.nota}</span>`:''}
      <span class="tags">${(o.tags||[]).map(t=>`<b class="tag ${t[1]||''}">${t[0]}</b>`).join('')}</span></span>
    <span class="side">
      ${/* 🔴 O RÓTULO DO DINHEIRO É DADO, NÃO DESENHO (12/08, dono: "o valor está
           correto, mas o significado/rótulo está errado"). "Marcado" nesta casa é
           a palavra do FIADO — o que ficou em aberto. Na ROTA a linha é uma
           entrega e o número é o `valorHoje`, que continua sendo o que ficou
           marcado; na MONTAGEM é quantidade x preco da entrega que se está
           montando, e chamar isso de "Marcado" fazia o motorista ler dívida onde
           havia venda. Uma peça só, dois rótulos: quem sabe o que o número
           significa é quem monta a linha, e ele manda a palavra junto. */''}
      ${o.marcado?`<span class="marc"><small>${o.marcRot||'Marcado'}</small><b>R$ ${o.marcado}</b></span>`:''}
      ${/* 🔴 O ÚLTIMO REGISTRO DO CLIENTE (12/08). Mesma caixa do dinheiro, e de
           propósito: é a MESMA pergunta do lado direito do cartão ("o que eu
           preciso saber sobre esta porta antes de ir"). `.reg` só troca a tinta
           do valor — data em verde-limão se leria como dinheiro.
           Ele NÃO briga com a pílula: quem monta a linha manda uma, outra, ou as
           duas. Na Montagem, antes de montar, TODO mundo era "Pendente" e a
           coluna inteira repetia a mesma palavra — este slot passa a dizer a
           última vez que este cliente recebeu de verdade. */''}
      ${o.reg?`<span class="marc reg"><small>${o.reg[0]}</small><b>${o.reg[1]}</b></span>`:''}
      ${o.pill?`<span class="pill ${o.pill[1]}">${o.pill[2]?ic(o.pill[2],14):''}${o.pill[0]}</span>`:''}</span>
  </div>`;
}

/* ==========================================================================
   🔴 A MAQUETE DO MAPA 2D MORREU — ordem do dono, 09/08: *"esse câncer pisca,
   depois abre o 3. Remover o 2 sem legados, totalmente destrutivo."*

   Aqui morava um SVG de espera: malha de ruas em grade perfeita, uma mancha de
   parque, um traço verde e SEIS pinos de posição CRAVADA no arquivo. Ele
   existia por um motivo real — a tela não podia ficar preta no 1,0 s entre
   entrar na rota e o mapa de verdade assentar (medido no g15) — e cobrava um
   preço que só ficou visível quando o mapa virou a TELA PRINCIPAL:

   · MENTIA O DIA. Montar 56 paradas acendia 6 pinos num bairro que não é o do
     motorista, porque as posições eram do desenho, não do dado. Cada régua
     nova (`temRota`, `rotaMontada`) apertava a mentira sem matá-la: o desenho
     só sabia desenhar a rota que ele já tinha dentro.
   · PISCAVA. Maquete e mapa vivo se cruzavam num dissolve toda vez que o palco
     entrava — e é esse cruzamento que o dono via como "pisca antes de abrir".

   O que fica no lugar: NADA. O palco tem a cor do mapa (`.mapa-palco`), o mapa
   vivo entra por cima quando fica pronto. Fundo de espera não precisa de
   desenho, precisa de COR — e cor não tem o que piscar nem o que inventar.

   🔴 E O "EU" NÃO RESSUSCITA A MAQUETE. O ponto que entra aqui é DESENHO —
   existe pro mock poder mostrar a peça, e é a mesma casca (`.eu-puck`) que o
   marcador do mapa de verdade veste. No aparelho ele nunca aparece: `euDemo` é
   DADO de demonstração e o boot o apaga (`apagarDemonstracao`), e o palco
   ainda ganha `.com-mapa` quando o maplibre sobe. Duas travas porque uma
   posição inventada de "você está aqui" é a pior das mentiras que esta tela
   pode contar — pior que a maquete, que ao menos mentia sobre os OUTROS.
   ========================================================================== */
/* 🔴 UM PALCO SÓ NOS DOIS ESTADOS (16/08 — dono: *"MAPA PARADO, TRANSIÇÃO
   DENTRO DO MAPA SEM SE MEXER; ambos os estados têm q ser idênticos"*).
   Este `data-mapa` era `geral` aqui e `gps` na tela de dirigir: dois nomes, duas
   instâncias de maplibre, duas câmeras — e por isso trocar de estado era trocar
   de MAPA, com tile novo, redesenho e o preto que o dono chamou de travação.
   Com o mesmo nome nos dois, o maplibre é UM: o nó só muda de pai e a câmera
   fica exatamente onde estava. O que troca entre 2D e 3D é a INCLINAÇÃO e o
   cromo — nada mais. */
function mapa(){
  return `<div class="mapa-palco" data-mapa="rota">${DADOS.rota.euDemo
    ?'<i class="eu-puck demo" style="--rumo:34deg;--cone:1;--halo:104px"></i>':''}</div>`;
}

/* ==========================================================================
   TELAS
   ========================================================================== */
const T={};

/* ==========================================================================
   SEAM DE DADOS — o único lugar por onde o dado REAL entra.
   Os valores abaixo são os literais que estavam nos templates, MOVIDOS pra cá.
   O mock continua pintando exatamente o mesmo; o app real chama
   `usarDados('rota', {...})` e a tela se repinta com o que veio do servidor.
   🔴 LEI: traduzir ≠ decidir. Sem fonte, o campo vai VAZIO — número inventado
   em tela de dinheiro é mentira com cara de app pronto.
   ========================================================================== */
const DADOS={
  /* ITEM 9 (07/08) — o CSV dos módulos que o ADMIN desligou no desktop, do
     jeito que o servidor grava: minúsculo, separado por vírgula, sem "rota".
     🔴 NASCE VAZIO E É ASSIM QUE TEM QUE SER: enquanto ninguém disser o
     contrário, a barra mostra os 6. Quem escreve aqui é a ponte, só depois de
     o `/logistica/config` responder — falha de rede não apaga módulo. */
  barra:{ desligados:'' },
  rota:{
    kpiParadas:'12', kpiEntregues:'6', kpiEntreguesParado:'0',
    saldo:'R$ 184,00', dinheiro:'R$ 132,00', pix:'R$ 52,00',
    diaFeitas:'3', diaTotal:'14', diaPct:'21%', diaMarcado:'R$ 336,00',
    filtroFila:'8', filtroEntregue:'6',
    creditos:'240', creditosDebita:'12',
    somaProdutos:'20', somaMarcado:'R$ 336,00',
    /* Rotas abertas fora do dia atual ou montadas por outra pessoa. A ponte
       escreve esta lista; vazia = o cartão inteiro não existe. */
    pendencias:[], pendenciasSemConexao:false,
    /* 🔴 A PREFERÊNCIA DE TELA CHEIA (17/08, item 1). Ela é do APARELHO — mora
       em `HBX.cache('mapa-cheio')` e chega aqui pela ponte
       (`publicarTelaCheia`). O default é LIGADO, e ele está escrito AQUI de
       propósito: a ponte só escreve no seam quando o valor MUDA, então nascer
       com `true` faz a escrita de boot de um aparelho normal cair no freio de
       igualdade e não repintar a abertura por nada. */
    telaCheia:true,
    vazioTitulo:'Sem paradas hoje',
    /* A segunda linha do dia por montar (ver `T.rota`). Ela explica o mapa
       vazio e NOMEIA a ação que já está no dock — não é um segundo botão.
       Curta de propósito: a barra é uma linha de vidro em cima do mapa, não um
       lugar de texto. */
    vazioDica:'Monte a rota pra ver o dia no mapa.',
    /* DEMONSTRAÇÃO — o "você está aqui" do desenho no palco do mapa 2D. Só o
       mock o enxerga: `apagarDemonstracao` zera este campo no boot do aparelho
       (ver `mapa()`), porque no app quem diz onde o motorista está é o GPS. */
    euDemo:1,
    /* 🔴 O ESTADO DO GPS É UM FATO DO DIA (dono, 09/08: *"cadê minha
       localização?"*). A tela não tinha uma palavra sobre isso: sem permissão,
       sem sinal ou nos primeiros segundos de busca, ela mostrava um mapa mudo e
       deixava a pergunta sem resposta — e a pergunta se responde sozinha se
       alguém a fizer em voz alta. Três valores e nada mais:
       '' = tenho a posição (nada a dizer, o ponto está lá)
       'procurando' = ainda não veio fix (informa, não alarma)
       'negado' = a localização está desligada (ALARME, e a barra vira botão)
       Quem escreve é a ponte; sem fonte fica vazio, que é o desfecho honesto —
       "procurando" eterno num app que nunca perguntou seria alarme inventado. */
    gps:'',
    /* 🔴 UM NOME SÓ, PORQUE É UMA COISA SÓ (dono, 09/08: *"estou inclinado a
       remover o agenda, não vejo utilidade q o montar rota não tem"*).
       Esta tela teve dois nomes por um dia: com rota montada, "Rota de hoje";
       sem rota, "Agenda de hoje" — e o modo agenda era a tela do print que
       dizia "0 agendadas" no topo e empilhava "Não entregues · 137" embaixo.
       O modo morreu inteiro (ver `T.rotalista`): a lista só se abre quando há
       rota, e quem responde "quem espera hoje?" é a MONTAGEM, que é a tela que
       também faz alguma coisa a respeito. COPY do desenho, não vem do servidor. */
    titulo:'Rota de hoje',
    /* DADO — a data por extenso ("Domingo, 9 de agosto"). Sem fonte, o subtítulo
       some: inventar a data do aparelho numa tela que fala do dia OPERACIONAL
       (fuso de São Paulo, virada às 00h) é a receita de mostrar o dia errado às
       21h. Quem sabe o dia é a ponte, que já o calcula pra pedir a rota.
       🔴 MUDOU DE TELA junto com o modo agenda: quem carrega a data agora é a
       MONTAGEM (o cabeçalho dela). Continua morando na seção `rota` porque quem
       calcula o dia é o mesmo carregamento da rota — o campo mudou de leitor,

/** Entra dado novo numa seção e a tela se repinta — SÓ se algo mudou de verdade.
    🔴 O FREIO DO PISCA (07/08): a ponte relê a config a cada minuto e a cada
    volta de foco, e escrevia aqui mesmo com o dado idêntico — e cada escrita
    troca o DOM inteiro (`pintar` monta outra camada). Tela repintando por
    minuto na cara do motorista era o "fica piscando às vezes". Dado igual
    morre aqui, sem repinte; quem muda de verdade continua pintando na hora. */
function usarDados(secao,valor){
  const atual=DADOS[secao]||{}, novo=valor||{};
  const mudou=Object.keys(novo).some(k=>JSON.stringify(atual[k])!==JSON.stringify(novo[k]));
  if(!mudou) return;
  DADOS[secao]=Object.assign({},atual,novo);
  if(typeof pintar==='function') pintar(false);
}
