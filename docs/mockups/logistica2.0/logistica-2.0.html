<!doctype html>
<html lang="pt-BR" data-tr="eixox" data-av="sino" data-luz="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HBX Logística 2.0 — front novo</title>
<style>
/* ==========================================================================
   HBX LOGÍSTICA 2.0 — front NOVO, desenhado a partir das imagens de referência
   de docs/mockups/logistica2.0. Nada aqui reaproveita o app atual.

   DENSIDADE: o app é desenhado em 400x900 (medida lógica de celular) e o
   quadro inteiro é ampliado por `zoom` — o texto continua vetorial, então
   ganha resolução sem virar zoom de imagem. É isso que faz caber a MESMA
   quantidade de linhas das fotos (9 a 10 paradas + rodapé + botões).
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#06090f;color:#e8eefb;overflow:hidden;display:flex;flex-direction:column;
  font-family:Inter,"SF Pro Display","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
/* Sem realce de toque do sistema e sem anel de foco do navegador: os dois
   desenhavam retângulos claros em volta dos botões redondos do app. */
.app button{-webkit-tap-highlight-color:transparent}
.app button:focus{outline:none}
.app button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- cromo do documento ---------- */
.doc-top{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:9px 18px;border-bottom:1px solid #141c2c;background:#0a0f18}
.doc-top h1{margin:0;font-size:14px;font-weight:500}
.doc-top h1 small{display:block;font-size:11px;font-weight:400;color:#7b89a5;margin-top:2px}
.doc-top .sp{flex:1}
.seg{display:flex;gap:3px;background:#080d16;border:1px solid #17203200;border-color:#172032;border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;color:#8496b3;padding:5px 10px;border-radius:7px;font-size:12px;cursor:pointer}
.seg button.on{background:#182644;color:var(--white)}
.doc-body{flex:1;display:flex;min-height:0}
.rail{width:214px;flex:0 0 214px;border-right:1px solid #141c2c;background:#0a0f18;padding:12px 9px;overflow:auto}
.rail h2{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#5d6b86;margin:14px 8px 5px}
.rail h2:first-child{margin-top:0}
.rail button{width:100%;display:flex;align-items:center;gap:8px;text-align:left;border:0;background:transparent;
  color:#c3cee2;padding:8px 9px;border-radius:8px;cursor:pointer;font-size:12.5px}
.rail button:hover{background:#121b2b}
.rail button.on{background:#132038;color:var(--white);box-shadow:inset 0 0 0 1px #1f3255}
.rail button i{width:6px;height:6px;border-radius:50%;background:#2c3c5c;flex:0 0 6px}
.rail button.on i{background:var(--lime)}
.stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow:auto;
  background:radial-gradient(800px 500px at 50% 0%,rgba(47,126,247,.09),transparent 70%)}

/* ==========================================================================
   O CELULAR — 400x900 lógico, ampliado por zoom (padrão 1.7)
   ========================================================================== */
.phone{
  width:426px;height:954px;flex:0 0 426px;position:relative;padding:7px;border-radius:44px;
  zoom:var(--z,1);
  background:linear-gradient(150deg,#3a4356,#12161f 55%,#2a3140);
  box-shadow:0 18px 46px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.05);
}
.app{
  position:relative;width:412px;height:940px;border-radius:38px;overflow:hidden;
  display:flex;flex-direction:column;

  --bg:#080d17; --bg-2:#0a1120; --card:#0d1626; --line:#1a2740; --line-2:#26375a;
  --ink:#eef3fb; --ink-2:#93a3bf; --ink-3:#7889a6;
  --lime:#9ede2a; --lima-viva:var(--lime); --blue:#2f7ef7; --blue-l:#5b9dff;
  --amber:#f5a524; --purple:#a855f7; --red:#f2555a;
  /* famílias tonais e botões — F1 leva 2 (mesmo valor nos 2 modos até o claro pedir) */
  --white:#fff;
  --go-1:#8fd626;
  --go-2:#68b019;
  --go-ink:#12200a;
  --btn-blue-1:#3d8bff;
  --btn-blue-2:#1f66e0;
  --lime-bg:#151f0d;
  --lime-bg-2:#17230e;
  --lime-line:#4d6b1c;
  --sel-bg:#141f0c;
  --blue-bg:#12253f;
  --blue-line:#2b5490;
  --amber-bg:#2a1e0b;
  --amber-line:#7a5411;
  --red-line:#5b2626;
  --red-line-2:#6d2b2b;
  --red-bg:#1a1114;
  --red-bg-2:#17141a;
  --glass:#0b1322;
  --field:#0b1424;
  /* papéis do rabo — F1 leva 4 */
  --chip-bg:#101a2c;
  --blue-bg-2:#0e1c31;
  --red-bg-3:#1f0f11;
  --trilho:#182741;
  --prog-1:#74b81b;
  --prog-2:#a4e42f;
  --handle:#2b3a58;
  --fog:#070d18;
  --danger-ico-bg:#2a1113;
  --danger-ico:#ff6b6b;
  --danger-btn:#8f2d2d;
  --barra-trilho:#1b2a45;
  /* abertura — F1 leva 5 (a 1ª tela também é da casca) */
  --splash-bg-1:#0a1020; --splash-bg-2:#070c18;
  --splash-marca:#9ede2a; --splash-marca-2:#9ede2a;
  --splash-tinta:#fff; --splash-sub:#93a3bf; --splash-trilho:#1b2a45;
  --logo-sub:#dbe4f2;
  /* O mapa também é pele: sem token aqui ele fica escuro no tema claro — e
     mapa que não acompanha o tema é o buraco clássico da troca de pele. */
  --map-fundo:var(--bg-2); --map-quadra:#0d1727; --map-rua:#1b2740; --map-rua2:#16223a;
  --map-parque:#0f2418; --map-rotulo:#5c6d8c; --map-pino:#0c1526; --map-pino-tinta:#eaf6d5;
  --map-rota:var(--lime); --map-rota-borda:#4f8f14; --map-leito:#1d2c47;
  --map-carro:#e9eef7; --map-carro-borda:#aebbcf; --map-carro-vidro:#8fa6c4; --map-carro-2:#c3cede;
  --map-bandeira:#dbe6f7; --map-bandeira-2:#0d1a2f; --map-partida:#3d8bff;

  background:radial-gradient(560px 300px at 50% -8%,rgba(47,126,247,.10),transparent 70%),
             linear-gradient(180deg,var(--bg-2),var(--bg) 34%);
  color:var(--ink);font-size:13px;

  /* TIPOGRAFIA PREMIUM — fonte VARIÁVEL (Segoe UI Variable no Windows, SF no
     Mac): dá peso 300/350/450 de verdade, sem engrossar sintético. A hierarquia
     vem de TAMANHO e COR, nunca de negrito — é isso que tira o ar de "letra
     grossa". `font-synthesis:none` proíbe o navegador de fabricar bold falso. */
  font-family:"Segoe UI Variable Display","Segoe UI Variable Text",Inter,
              "SF Pro Display","Segoe UI",system-ui,-apple-system,sans-serif;
  font-weight:350;
  font-optical-sizing:auto;
  font-synthesis:none;
  letter-spacing:.002em;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
/* Negrito do navegador (700) é o que dava o "soco" na leitura. Dentro do app
   NENHUM texto passa de 500 — inclusive <b> e <strong>, que vinham 700 de
   fábrica. Peso alto fica só no logotipo, que é marca, não texto. */
.app b,.app strong{font-weight:500}
.app h2{font-weight:400;letter-spacing:-.018em}
.app .v,.app .eta b,.app .price,.app .form-c.total b{letter-spacing:-.02em}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:104px;height:28px;background:#000;border-radius:16px;z-index:60}
.notch::after{content:"";position:absolute;right:11px;top:9px;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#22314d,#05070c 70%)}

/* ==========================================================================
   PADRÕES DE MOVIMENTO — as 7 leis. Nada nesta casca aparece do nada.
   Quem for implementar no app.js copia DAQUI; não inventa duração nem curva.

   1. Toda superfície que NASCE tem entrada; toda que MORRE tem saída.
   2. O que ENTRA desacelera (--cv-entra); o que SAI acelera (--cv-sai).
      Nunca a mesma curva nos dois — é o que separa movimento de piscada.
   3. Lista entra ESCALONADA: passo de --mv-passo, teto de 14 itens (acima
      disso o dedo já rolou e a animação vira atraso).
   4. A ORIGEM tem significado: o aviso nasce no sino, a folha nasce de baixo,
      o GPS nasce do mapa. Peça que nasce do lugar errado mente sobre o app.
   5. ERRO entra diferente de tudo: mais rápido, com sacudida e cor cheia — o
      corpo reage antes da leitura. Erro que entra manso não é erro.
   6. Fundo escuro (scrim) entra e sai JUNTO com a peça que ele serve.
   7. `prefers-reduced-motion` desliga tudo, sem exceção.
   ========================================================================== */
.app{
  --mv-toque:120ms;   /* reação do dedo: botão afundando */
  --mv-rapido:180ms;  /* selo, chip, contador */
  --mv-normal:280ms;  /* aviso, confirmação */
  --mv-tela:440ms;    /* troca de tela (item escalonado) */
  --mv-folha:380ms;   /* folha subindo */
  --mv-cheio:520ms;   /* entrar/sair de tela cheia (GPS) */
  --mv-passo:22ms;    /* intervalo do escalonado */
  --cv-entra:cubic-bezier(.16,1,.3,1);
  --cv-sai:cubic-bezier(.4,0,1,.6);
  --cv-mola:cubic-bezier(.34,1.42,.5,1);
}

/* ==========================================================================
   TROCA DE TELA — 5 transições pra escolher UMA.
   Cada tela vira uma camada (.tela) sobreposta: durante a troca existem DUAS
   no ar, a que sai e a que entra. É isso que permite empurrão de verdade, e
   não só um fade disfarçado.
   ========================================================================== */
.tela{
  position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(560px 300px at 50% -8%,rgba(47,126,247,.10),transparent 70%),
             linear-gradient(180deg,var(--bg-2),var(--bg) 34%);
  will-change:transform,opacity;
}
.tela.entra{z-index:2}
.tela.sai{z-index:1}

/* As 6 opções são da MESMA família — a que o dono aprovou: as linhas entram
   uma atrás da outra. O que muda entre elas é o CARÁTER da entrada, e cada uma
   é um padrão que app grande usa hoje, não invenção minha.
   `.anim-item` é posto pelo JS nas peças do corpo (KPIs, linhas, resumo…). */
@keyframes trApaga{to{opacity:0}}
@keyframes trFundeEntra{from{opacity:0;transform:scale(1.012)}to{opacity:1;transform:none}}
@keyframes trItem{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* 1 — ESCALONADO (o aprovado): linha por linha, de 26 em 26 ms, subindo 9px. */
[data-tr="escalonado"] .tela.entra{animation:trFundeEntra .18s ease-out both}
[data-tr="escalonado"] .tela.sai{animation:trApaga .14s ease-out both}
[data-tr="escalonado"] .tela.entra .anim-item{
  animation:trItem .34s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(var(--i,0)*26ms)}

/* 2 — DESFOQUE: cada linha chega DESFOCADA e entra em foco. É a assinatura
   atual de Linear, Vercel, Raycast e Arc — o que dá o ar de "alta definição",
   porque a nitidez vira o próprio evento. Custa GPU, então só na entrada. */
[data-tr="desfoque"] .tela.entra{animation:trFundeEntra .16s ease-out both}
[data-tr="desfoque"] .tela.sai{animation:trApaga .12s ease-out both}
[data-tr="desfoque"] .tela.entra .anim-item{
  animation:trDesfoque .44s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*24ms)}
@keyframes trDesfoque{
  from{opacity:0;filter:blur(7px);transform:translateY(7px) scale(.994)}
  to{opacity:1;filter:blur(0);transform:none}}

/* 3 — MOLINHA: curva com ultrapassagem (o item passa 2% do lugar e volta).
   É o `spring` do SwiftUI/iOS — o movimento parece ter PESO, não tempo. */
[data-tr="molinha"] .tela.entra{animation:trFundeEntra .16s ease-out both}
[data-tr="molinha"] .tela.sai{animation:trApaga .12s ease-out both}
[data-tr="molinha"] .tela.entra .anim-item{
  animation:trMola .52s cubic-bezier(.34,1.42,.5,1) both;animation-delay:calc(var(--i,0)*28ms)}
@keyframes trMola{from{opacity:0;transform:translateY(15px) scale(.982)}to{opacity:1;transform:none}}

/* 4 — EIXO Z (Material 3, "shared axis Z"): a tela velha CRESCE e some, a nova
   vem de trás. É o padrão do Google pra "entrei num nível mais fundo" —
   diz hierarquia sem empurrão lateral. As linhas ainda escalonam, mais rápido. */
[data-tr="eixoz"] .tela.entra{animation:trZEntra .34s cubic-bezier(.05,.7,.1,1) both}
[data-tr="eixoz"] .tela.sai{animation:trZSai .26s cubic-bezier(.3,0,.8,.15) both}
@keyframes trZEntra{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@keyframes trZSai{to{opacity:0;transform:scale(1.06)}}
[data-tr="eixoz"] .tela.entra .anim-item{
  animation:trItem .3s ease-out both;animation-delay:calc(var(--i,0)*16ms + 60ms)}

/* 5 — EIXO X (versão 2): três coisas mudaram em relação à primeira.
   (a) A tela NÃO desliza como bloco — quem desliza são as LINHAS, uma atrás da
       outra. Bloco inteiro andando é carrossel; cascata lateral é aplicativo.
   (b) Tem DIREÇÃO: indo pra frente entra pela direita, voltando entra pela
       esquerda (`--dir`, posto pelo JS). Sem isso o "voltar" mente.
   (c) Curva de saída longa (.16,1,.3,1): 90% do caminho nos primeiros 40% do
       tempo, e o resto assentando. É o que faz parecer que tem massa. */
[data-tr="eixox"] .tela.entra{animation:trXFade .15s linear both}
[data-tr="eixox"] .tela.sai{animation:trXSai .26s cubic-bezier(.4,0,1,.6) both}
@keyframes trXFade{from{opacity:0}to{opacity:1}}
@keyframes trXSai{to{opacity:0;transform:translateX(calc(-24px * var(--dir,1)))}}
[data-tr="eixox"] .tela.entra .anim-item{
  animation:trXItem .44s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*22ms)}
@keyframes trXItem{
  from{opacity:0;transform:translateX(calc(28px * var(--dir,1)))}
  to{opacity:1;transform:none}}

/* 6 — SÓ O CONTEÚDO: o cromo (logo, topo, abas) NÃO se mexe — troca só o
   miolo, escalonado. É o que Stripe e Notion fazem: a moldura fica parada e
   dá a sensação de app rápido, porque nada pisca em volta. */
[data-tr="conteudo"] .tela.sai{animation:trApaga .01s linear both}
[data-tr="conteudo"] .tela.entra .anim-item{
  animation:trItem .36s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(var(--i,0)*30ms)}

/* ==========================================================================
   ABERTURA — a primeira impressão do cliente.

   A ideia: a marca não "some pra dar lugar ao app" — ela VIRA o cabeçalho.
   O logo grande do meio da tela viaja até o slot do topo e vira o logo de lá.
   🔴 O percurso NÃO é só vertical: o logo do cabeçalho parece centralizado, mas
   os dois botões redondos da direita o empurram 21px pra esquerda (medido). Sem
   o desvio horizontal ele aterrissava torto. Deslocamento e escala são MEDIDOS
   em tempo de execução (mesma lição do sino: origem chutada nasce torta) — e
   como o cabeçalho muda entre telas, a conta é refeita a cada abertura.
   ========================================================================== */
/* A CENA, em 6 atos (3,4 s até entregar o app):
   1. o vazio respira            0,00–1,60  brilho de fundo abre
   2. a rota se desenha          0,25–1,45  traço lima subindo, 3 pinos acendendo
   3. o cometa percorre a rota   0,30–1,50  a luz chega exatamente onde o X nasce
   4. a marca se monta           1,35–2,25  H · B · X com peso, anel no cruzamento
   5. o brilho varre o logotipo  1,95–2,75  e LOGÍSTICA abre o espaçamento
   6. a batida e a entrega       2,55–3,40  o conjunto pulsa uma vez, barra completa */
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--bg-2),#05080f);overflow:hidden}
.splash-fundo{position:absolute;inset:0;
  background:radial-gradient(430px 330px at 50% 44%,rgba(47,126,247,.20),transparent 70%);
  animation:spFundo 1.7s var(--cv-entra) both}
@keyframes spFundo{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}

/* AS DUAS HASTES — uma entra pela diagonal de cima à esquerda, a outra pela de
   baixo à direita, e onde elas se cruzam nasce o X. Cada haste viaja NA SUA
   PRÓPRIA direção (a de cima desce pra direita, a de baixo sobe pra esquerda),
   então o encontro parece cálculo, não coincidência. */
.splash-xis{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.splash-xis line{stroke:var(--lime);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 7px rgba(158,222,42,.75))}
.splash-xis .haste-a{animation:spHasteA .95s var(--cv-entra) .3s both}
.splash-xis .haste-b{animation:spHasteB .95s var(--cv-entra) .46s both}
@keyframes spHasteA{from{opacity:0;transform:translate(-190px,-235px)}to{opacity:1;transform:none}}
@keyframes spHasteB{from{opacity:0;transform:translate(190px,235px)}to{opacity:1;transform:none}}
/* O rastro é a mesma haste, mais fina e atrasada: dá a leitura de velocidade
   sem borrão de imagem (que num logotipo lê como defeito). */
.splash-xis .rastro{stroke-width:2;opacity:.4;filter:none}
.splash-xis .rastro.haste-a{animation-delay:.24s}
.splash-xis .rastro.haste-b{animation-delay:.4s}
/* Quando as duas assentam, as hastes entregam o lugar ao glifo de verdade. */
.splash-xis{animation:spHastesSaem .34s var(--cv-sai) 1.62s both}
@keyframes spHastesSaem{to{opacity:0}}
/* Clarão no cruzamento, no instante exato do encontro. */
.splash-flash{position:absolute;left:50%;top:0;width:96px;height:96px;margin-left:-48px;border-radius:50%;
  background:radial-gradient(circle,rgba(214,255,150,.85),rgba(158,222,42,0) 68%);pointer-events:none;
  animation:spFlash .55s ease-out 1.4s both}   /* 1,40s = quando a 2ª haste assenta */
@keyframes spFlash{0%{opacity:0;transform:scale(.2)}35%{opacity:1}100%{opacity:0;transform:scale(1.5)}}

.splash-centro{position:relative;display:flex;flex-direction:column;align-items:center;
  animation:spBatida .62s var(--cv-mola) 2.55s both}
@keyframes spBatida{0%{transform:scale(1)}38%{transform:scale(1.028)}100%{transform:scale(1)}}
.splash-anel{position:absolute;top:2px;left:50%;margin-left:-59px;width:118px;height:118px;border-radius:50%;
  border:1px solid var(--splash-marca-2);pointer-events:none;animation:spAnel 1.05s ease-out 1.46s both}
@keyframes spAnel{from{opacity:.6;transform:scale(.3)}to{opacity:0;transform:scale(2.4)}}

.splash-logo{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1;will-change:transform}
.splash-logo .w{position:relative;overflow:hidden;padding:3px 5px;font-size:46px;font-weight:600;letter-spacing:.6px}
.splash-logo .w b{color:var(--white);font-weight:600;display:inline-block}
.splash-logo .w b:nth-of-type(1){animation:spSobe .55s var(--cv-mola) 1.5s both}
.splash-logo .w b:nth-of-type(2){animation:spSobe .55s var(--cv-mola) 1.58s both}
/* O glifo do X ACENDE no lugar das hastes (sem escala nem giro): a forma já
   está na tela, o que muda é quem a desenha. Salto de tamanho aqui delataria
   que são duas peças diferentes. */
.splash-logo .w em{color:var(--splash-marca);font-style:normal;font-weight:600;font-size:52px;
  display:inline-block;transform:skewX(-8deg);animation:spAcende .5s ease-out 1.5s both}
@keyframes spAcende{from{opacity:0}to{opacity:1}}
.splash-brilho{position:absolute;top:-25%;left:-45%;width:26%;height:150%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
  transform:skewX(-18deg);animation:spBrilho .82s ease-in-out 1.95s both}
@keyframes spBrilho{from{left:-45%}to{left:125%}}
.splash-logo small{display:block;font-size:11px;color:var(--logo-sub);margin-top:11px;padding-left:10px;
  animation:spLetras .85s var(--cv-entra) 2.05s both}
.splash-empresa{margin-top:26px;font-size:13px;color:var(--ink-2);animation:spSobe .55s var(--cv-entra) 2.35s both}
.splash-barra{width:96px;height:2px;background:var(--barra-trilho);border-radius:2px;overflow:hidden;margin-top:16px}
.splash-barra i{display:block;height:100%;background:var(--splash-marca);transform-origin:left;
  box-shadow:0 0 8px rgba(158,222,42,.8);animation:spCarrega 2.6s var(--cv-entra) .6s both}
@keyframes spSobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spLetras{from{opacity:0;letter-spacing:18px}to{opacity:1;letter-spacing:9px}}
@keyframes spCarrega{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* A PASSAGEM (0,9 s): a marca não some — ela vira o cabeçalho. O resto da
   abertura sai antes, e a primeira tela acende por baixo, escalonando. */
.tela.sai.abertura{animation:mvAberturaSai .95s var(--cv-entra) both!important}
@keyframes mvAberturaSai{0%,70%{opacity:1}100%{opacity:0}}
.tela.entra.abertura{animation:mvScrim .55s ease-out .25s both!important}
.tela.entra.abertura .anim-item{
  animation:trItem .5s var(--cv-entra) both!important;
  animation-delay:calc(.35s + var(--i,0) * var(--mv-passo))!important}
.tela.sai.abertura .splash-logo{animation:mvLogoVoa .9s var(--cv-entra) both}
@keyframes mvLogoVoa{to{transform:translate(var(--dx,0px),var(--dy,-380px)) scale(var(--esc,.55))}}
.tela.sai.abertura .splash-empresa,
.tela.sai.abertura .splash-barra,
.tela.sai.abertura .splash-anel,
.tela.sai.abertura .splash-rota,
.tela.sai.abertura .splash-cometa,
.tela.sai.abertura .splash-fundo{animation:mvSai .3s var(--cv-sai) both}

/* ==========================================================================
   TELA CHEIA (GPS) — "Rota iniciada" não troca de tela: ela TOMA a tela.
   A que fica pra trás afunda e escurece; o mapa cresce por cima, vindo de um
   pouco mais longe. Sair faz o caminho inverso. Vale saindo de QUALQUER tela.
   `!important` aqui é de propósito: esta regra tem que vencer a transição
   escolhida no seletor, seja ela qual for — tela cheia é outro tipo de evento.
   ========================================================================== */
.tela.entra.cheio{animation:mvCheioEntra var(--mv-cheio) var(--cv-entra) both!important}
.tela.sai.cheio{animation:mvCheioSai var(--mv-cheio) var(--cv-entra) both!important}
.tela.entra.cheio .anim-item{animation:none!important}
@keyframes mvCheioEntra{from{opacity:0;transform:scale(1.14)}to{opacity:1;transform:none}}
@keyframes mvCheioSai{to{opacity:0;transform:scale(.9);filter:brightness(.4)}}
/* Voltando do GPS o gesto inverte: o mapa encolhe e a tela volta de trás. */
.tela.entra.cheio.voltando{animation:mvCheioVolta var(--mv-cheio) var(--cv-entra) both!important}
.tela.sai.cheio.voltando{animation:mvCheioVoltaSai var(--mv-cheio) var(--cv-entra) both!important}
@keyframes mvCheioVolta{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes mvCheioVoltaSai{to{opacity:0;transform:scale(1.16)}}
/* No GPS a informação chega DEPOIS do lugar, nunca junto: primeiro o mapa
   assenta, aí a manobra desce do topo, o rodapé sobe e o carro aparece. */
.tela.entra.cheio .gps-manobra{animation:mvDesce var(--mv-folha) var(--cv-entra) .18s both}
@keyframes mvDesce{from{opacity:0;transform:translateY(-115%)}to{opacity:1;transform:none}}
.tela.entra.cheio .gps-rodape{animation:mvFolha var(--mv-folha) var(--cv-entra) .14s both}
.tela.entra.cheio .gps-puck{animation:mvPuck .52s var(--cv-mola) .24s both}
@keyframes mvPuck{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:none}}
.tela.entra.cheio .gps-vel,
.tela.entra.cheio .gps-bussola,
.tela.entra.cheio .gps-lado button{animation:mvPop var(--mv-normal) var(--cv-mola) .32s both}

/* ==========================================================================
   FOLHA (bottom sheet) — sobe de baixo, o fundo escurece junto (lei 6).
   ========================================================================== */
.tela .sheet{animation:mvFolha var(--mv-folha) var(--cv-entra) both}
.tela .scrim{animation:mvScrim var(--mv-normal) ease-out both}
@keyframes mvFolha{from{transform:translateY(100%)}to{transform:none}}
@keyframes mvScrim{from{opacity:0}to{opacity:1}}
@keyframes mvPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

/* ==========================================================================
   ERRO — lei 5: entra na cara. Cresce com ultrapassagem e SACODE.
   ========================================================================== */
.erro-wrap{position:absolute;inset:0;z-index:60;display:grid;place-items:center;padding:0 22px;
  background:rgba(4,7,13,.72);animation:mvScrim 160ms ease-out both}
.erro{
  width:100%;background:var(--red-bg-2);border:.7px solid var(--red-line-2);border-radius:16px;padding:16px 15px 14px;
  box-shadow:0 20px 50px rgba(0,0,0,.6);text-align:center;
  animation:mvErro 320ms var(--cv-mola) both, mvSacode 340ms 300ms both;
}
.erro .ico{width:44px;height:44px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;
  background:var(--danger-ico-bg);color:var(--danger-ico);animation:mvPop var(--mv-normal) var(--cv-mola) .1s both}
.erro strong{display:block;font-size:16px;font-weight:500;animation:trItem .3s var(--cv-entra) .16s both}
.erro .sub{display:block;font-size:12.5px;color:var(--ink-2);margin-top:4px;animation:trItem .3s var(--cv-entra) .22s both}
.erro .acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;
  animation:trItem .3s var(--cv-entra) .28s both}
.erro .acoes button{height:40px;border-radius:11px;border:.7px solid var(--line-2);background:var(--card);
  color:var(--ink);font-size:13.5px;cursor:pointer}
.erro .acoes .principal{background:var(--danger-btn);border-color:var(--danger-btn);color:var(--white)}
@keyframes mvErro{from{opacity:0;transform:scale(.84)}to{opacity:1;transform:none}}
@keyframes mvSacode{0%,100%{margin-left:0}15%{margin-left:-7px}35%{margin-left:6px}55%{margin-left:-4px}75%{margin-left:2px}}

/* ==========================================================================
   CONFIRMAÇÃO — cartão central, sem drama: cresce 6% e assenta.
   ========================================================================== */
.conf-wrap{position:absolute;inset:0;z-index:58;display:grid;place-items:center;padding:0 24px;
  background:rgba(4,7,13,.66);animation:mvScrim 160ms ease-out both}
.conf{width:100%;background:var(--card);border:.7px solid var(--line);border-radius:16px;padding:16px 15px 14px;
  box-shadow:0 20px 50px rgba(0,0,0,.55);animation:mvConf var(--mv-normal) var(--cv-entra) both}
.conf strong{display:block;font-size:16px;font-weight:500;animation:trItem .3s var(--cv-entra) .08s both}
.conf .sub{display:block;font-size:12.5px;color:var(--ink-2);margin-top:4px;animation:trItem .3s var(--cv-entra) .14s both}
.conf .acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;animation:trItem .3s var(--cv-entra) .2s both}
.conf .acoes button{height:40px;border-radius:11px;border:.7px solid var(--line-2);background:transparent;
  color:var(--ink);font-size:13.5px;cursor:pointer}
.conf .acoes .principal{background:linear-gradient(180deg,var(--go-1),var(--go-2));border:0;color:var(--go-ink)}
@keyframes mvConf{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.saindo{animation:mvSai 200ms var(--cv-sai) both!important}
@keyframes mvSai{to{opacity:0;transform:scale(.96)}}

/* ==========================================================================
   PORTÕES — as telas que PARAM o motorista pra decidir. Três tons, e o tom diz
   o que está em jogo: âmbar pede decisão, vermelho bloqueia, azul informa.
   O que BLOQUEIA entra com a curva dura do erro (lei 5); o que só pergunta
   entra macio. Portão sem saída é armadilha: só o update obrigatório não fecha.
   ========================================================================== */
.portao-wrap{position:absolute;inset:0;z-index:59;display:grid;place-items:center;padding:0 20px;
  background:rgba(4,7,13,.7);animation:mvScrim 160ms ease-out both}
.portao{width:100%;max-height:82%;overflow:auto;scrollbar-width:none;background:var(--card);
  border:.7px solid var(--line);border-radius:17px;padding:15px 14px 13px;
  box-shadow:0 22px 54px rgba(0,0,0,.6);animation:mvConf var(--mv-normal) var(--cv-entra) both}
.portao::-webkit-scrollbar{display:none}
.portao.trava{border-color:var(--red-line-2);background:var(--red-bg-2);animation:mvErro 320ms var(--cv-mola) both,mvSacode 340ms 300ms both}
.portao .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:11px;
  animation:mvPop var(--mv-normal) var(--cv-mola) .08s both}
.portao.alerta .ico{background:var(--amber-bg);color:var(--amber)}
.portao.trava .ico{background:var(--danger-ico-bg);color:var(--danger-ico)}
.portao.info .ico{background:var(--blue-bg);color:var(--blue-l)}
.portao.ok .ico{background:var(--lime-bg-2);color:var(--lime)}
.portao h3{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em;
  animation:trItem .3s var(--cv-entra) .14s both}
.portao .sub{display:block;font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.4;
  animation:trItem .3s var(--cv-entra) .2s both}
.portao .corpo{margin-top:12px;animation:trItem .3s var(--cv-entra) .26s both}
.portao .acoes{display:grid;gap:7px;margin-top:14px;animation:trItem .3s var(--cv-entra) .32s both}
.portao .acoes.duas{grid-template-columns:1fr 1fr}
.portao .acoes.tres{grid-template-columns:1fr 1fr 1fr}
.portao .acoes button{height:42px;border-radius:12px;border:.7px solid var(--line-2);background:transparent;
  color:var(--ink);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.portao .acoes .principal{background:linear-gradient(180deg,var(--go-1),var(--go-2));border:0;color:var(--go-ink)}
.portao .acoes .perigo{color:var(--red);border-color:var(--red-line)}
.portao .acoes .azul{background:linear-gradient(180deg,var(--btn-blue-1),var(--btn-blue-2));border:0;color:var(--white)}
/* linha de problema: o nome, o que falta, e a seta que leva ao conserto */
.pt-linha{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;
  border-radius:12px;border:.7px solid var(--line);background:var(--field);margin-bottom:6px;cursor:pointer}
.pt-linha .m{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--amber-bg);color:var(--amber)}
.pt-linha strong{display:block;font-size:12.5px;font-weight:500}
.pt-linha span{display:block;font-size:10.5px;color:var(--amber);margin-top:1px}
.pt-nums{display:flex;gap:0;background:var(--field);border:.7px solid var(--line);border-radius:12px;overflow:hidden}
.pt-nums div{flex:1;padding:9px 6px;text-align:center;border-right:.7px solid var(--line)}
.pt-nums div:last-child{border-right:0}
.pt-nums b{display:block;font-size:15px;font-weight:500}
.pt-nums small{display:block;font-size:10px;color:var(--ink-2);margin-top:1px}
.pt-campo{display:flex;gap:8px;align-items:center}
.pt-campo input{width:74px;height:42px;border-radius:11px;border:.7px solid var(--line);background:var(--field);
  text-align:center;font-size:17px;color:var(--ink);outline:0}
.pt-campo .resto{flex:1;height:42px;border-radius:11px;border:.7px solid var(--line);background:var(--field);
  display:flex;align-items:center;padding:0 12px;font-size:15px;color:var(--ink-2)}

/* Lei 1 também vale pro dedo: botão afunda ao ser tocado. */
.app button{transition:transform var(--mv-toque) var(--cv-sai)}
.app button:active{transform:scale(.965)}

/* ==========================================================================
   AVISO — a peça que o dono usa pra impressionar cliente. Ele não "aparece":
   ele CHEGA. Três entradas pra escolher; a barrinha embaixo drena o tempo de
   vida, então o aviso nunca some sem explicação.
   ========================================================================== */
.aviso{
  position:absolute;left:10px;right:10px;top:46px;z-index:55;
  display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;
  padding:10px 12px 13px;border-radius:14px;
  background:#0e1a2e;border:.7px solid #24375a;box-shadow:0 14px 34px rgba(0,0,0,.55);
}
.aviso .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:var(--blue-bg);color:var(--blue-l)}
.aviso.ok .ico{background:var(--lime-bg-2);color:var(--lime)}
.aviso.alerta .ico{background:var(--amber-bg);color:var(--amber)}
.aviso strong{display:block;font-size:13px;font-weight:500;line-height:1.25}
.aviso .sub{display:block;font-size:11px;color:var(--ink-2);line-height:1.3;margin-top:1px}
.aviso .barra{position:absolute;left:12px;right:12px;bottom:6px;height:2px;border-radius:2px;background:var(--barra-trilho);overflow:hidden}
.aviso .barra i{display:block;height:100%;background:var(--blue-l);transform-origin:left;animation:avDrena 3.4s linear both}
.aviso.ok .barra i{background:var(--lime)}
.aviso.alerta .barra i{background:var(--amber)}
@keyframes avDrena{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* A — DESCER COM MOLINHA: vem de cima da tela e assenta com ultrapassagem. */
[data-av="molinha"] .aviso{animation:avMola .54s cubic-bezier(.34,1.5,.5,1) both}
@keyframes avMola{from{opacity:0;transform:translateY(-130%) scale(.97)}to{opacity:1;transform:none}}

/* B — MESMA LÍNGUA DA TELA (eixo X): entra pelo lado, curva longa. Usar esta
   se a transição escolhida for a 5 — aviso e tela falando o mesmo idioma. */
[data-av="eixox"] .aviso{animation:avEixoX .46s cubic-bezier(.16,1,.3,1) both}
@keyframes avEixoX{from{opacity:0;transform:translateX(38px)}to{opacity:1;transform:none}}

/* C — SAIR DO SINO: o aviso NASCE no sino do topo e cresce até o lugar dele.
   É o efeito que mais impressiona em demonstração, porque explica de onde
   veio a notícia — a origem da escala é o canto onde o sino está. */
[data-av="sino"] .aviso{transform-origin:var(--origem,88% -8px);animation:avSino .52s cubic-bezier(.2,1.08,.3,1) both}
@keyframes avSino{from{opacity:0;transform:scale(.16)}55%{opacity:1}to{opacity:1;transform:none}}

/* O ícone dá um pulo depois do cartão assentar, e as duas linhas de texto
   entram atrás — o mesmo escalonado da tela, dentro de uma peça só. */
.aviso .ico{animation:avPop .46s cubic-bezier(.34,1.6,.5,1) .1s both}
@keyframes avPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.aviso strong{animation:trItem .34s cubic-bezier(.2,.85,.25,1) .14s both}
.aviso .sub{animation:trItem .34s cubic-bezier(.2,.85,.25,1) .2s both}
.aviso.sai{animation:avSaiu .26s cubic-bezier(.4,0,1,.6) both}
@keyframes avSaiu{to{opacity:0;transform:translateY(-10px) scale(.985)}}

/* O selo do sino pulsa junto — o aviso e a origem dele acendem no mesmo gesto. */
.cnt.pulsa{animation:avPulso .6s cubic-bezier(.34,1.6,.5,1) both}
@keyframes avPulso{from{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.28)}to{transform:none}}
.round.tocou::after{content:"";position:absolute;inset:-3px;border-radius:50%;
  border:1px solid var(--blue-l);animation:avAnel .7s ease-out both;pointer-events:none}
@keyframes avAnel{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.7)}}

/* Lei 7 — quem pediu menos movimento no sistema não recebe nenhum. Vale pras
   telas, pras folhas, pro aviso, pro erro e pro afundar do botão. */
@media (prefers-reduced-motion:reduce){
  .app *,.app *::before,.app *::after{animation:none!important;transition:none!important}
}

/* barra de status */
.status{height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;font-size:12.5px;font-weight:500;letter-spacing:.2px;z-index:50}
.status .right{display:flex;align-items:center;gap:5px}
.bars{display:flex;align-items:flex-end;gap:1.6px;height:9px}
.bars i{width:2.4px;background:var(--white);border-radius:1px}
.bars i:nth-child(1){height:3.4px}.bars i:nth-child(2){height:5px}
.bars i:nth-child(3){height:7px}.bars i:nth-child(4){height:9px}
.batt{width:19px;height:9.5px;border:1.2px solid rgba(255,255,255,.85);border-radius:3px;position:relative}
.batt::before{content:"";position:absolute;inset:1.3px;background:var(--white);border-radius:1.2px}
.batt::after{content:"";position:absolute;right:-2.8px;top:2.8px;width:1.7px;height:3.8px;background:rgba(255,255,255,.6);border-radius:0 2px 2px 0}

/* ---------- cabeçalho ---------- */
.hdr{padding:0 13px 7px;flex:0 0 auto;position:relative;z-index:40}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* flancos gêmeos: mesma largura mínima ⇒ o logo não anda entre telas */
.hdr-flanco{flex:0 0 76px;display:flex;justify-content:flex-start}
.hdr-flanco.dir{justify-content:flex-end}
.round{width:35px;height:35px;border-radius:50%;border:.7px solid var(--line);background:var(--chip-bg);
  display:grid;place-items:center;cursor:pointer;position:relative;color:var(--ink);flex:0 0 35px}
.round.sm{width:30px;height:30px;flex:0 0 30px}
.round .ping{position:absolute;top:0;right:0;width:7px;height:7px;border-radius:50%;background:var(--blue);border:1.5px solid var(--bg)}
/* O selo do sino é texto de 10px em cima de cor cheia: no azul da marca dava
   3,85:1. Escurecido só aqui (o azul do resto do app continua o mesmo). */
.round .cnt{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:#1a5fd0;color:var(--white);font-size:10px;font-weight:500;display:grid;place-items:center;border:1.5px solid var(--bg)}
.logo{display:flex;flex-direction:column;align-items:center;line-height:1}
.logo .w{font-size:25px;font-weight:600;letter-spacing:.4px;line-height:1}
.logo .w b{color:var(--white);font-weight:600}
.logo .w em{color:var(--lime);font-style:normal;font-weight:600;font-size:28px;display:inline-block;transform:skewX(-8deg)}
.logo small{font-size:8px;letter-spacing:4.6px;color:var(--logo-sub);margin-top:4px;padding-left:5px}
.pill-live{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;
  background:var(--chip-bg);border:.7px solid var(--line);font-size:12.5px}
.pill-live i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 7px var(--lime)}

/* ---------- corpo ---------- */
.body{flex:1;min-height:0;overflow:auto;padding:0 11px 62px;scrollbar-width:none;position:relative;z-index:20}
.body::-webkit-scrollbar{display:none}
.body.flush{padding:0 0 62px}

/* ---------- KPIs ---------- */
/* 🔴 NÚMERO E RÓTULO EMPILHAM. Sem `display:block` os dois viram uma linha só
   ("12paradas", "DinheiroR$ 132,00") — foi o defeito que o dono fotografou.
   `nowrap` no valor evita a outra metade do mesmo problema: "R$" numa linha e
   "132,00" na de baixo quando o cartão aperta. */
.kpis{display:flex;gap:7px;margin-top:2px;align-items:stretch}
/* O ícone é SVG inline: sem `display:flex` nele, o alinhamento vira o da
   base do texto e o desenho sobe. Por isso o "6 entregues" nascia torto. */
.kpi{flex:1;background:var(--card);border:.7px solid var(--line);border-radius:12px;padding:7px 9px;
  display:flex;align-items:center;gap:8px;min-width:0}
.kpi>span{display:flex;align-items:center;min-width:0}
.kpi>span:first-child{flex:0 0 auto;justify-content:center}
.kpi>span:last-child{flex-direction:column;align-items:flex-start;justify-content:center}
.kpi.money>span,.kpi.split>span{align-items:stretch}
.kpi>span:last-child{min-width:0}
.kpi .v{display:block;font-size:17px;font-weight:500;line-height:1.1;white-space:nowrap}
.kpi .l{display:block;font-size:10.5px;color:var(--ink-2);line-height:1.2;margin-top:1px}
.kpi.money{flex:1.15;flex-direction:column;align-items:stretch;gap:0;position:relative;justify-content:center;padding-right:18px}
.kpi.money .l{font-size:11.5px}
.kpi.money .v{font-size:16px;color:var(--lime);margin-top:1px}
.kpi.money .go{position:absolute;right:7px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.kpi.split{flex:1.3;flex-direction:column;align-items:stretch;gap:5px;padding:6px 9px}
.kpi.split .ln{display:flex;align-items:center;gap:7px}
.kpi.split .ln:first-child{border-bottom:.7px solid var(--line);padding-bottom:5px}
.kpi.split .ln>span:last-child{min-width:0}
.kpi.split .ln .t{display:block;font-size:11.5px;font-weight:500;line-height:1.15;white-space:nowrap}
.kpi.split .ln .m{display:block;font-size:10.5px;color:var(--ink-2);line-height:1.2;white-space:nowrap}

/* ---------- barra de seção ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;
  background:var(--card);border:.7px solid var(--line);border-radius:12px;padding:6px 10px}
.bar .t{display:flex;align-items:center;gap:8px;font-size:13.5px}
.ghost{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;
  border:.7px solid var(--line-2);background:transparent;color:var(--ink);font-size:11.5px;cursor:pointer}

/* ---------- linha de parada ---------- */
/* Nas fotos cada parada é um CARTÃO com borda própria — não uma linha separada
   por fio. Foi a diferença estrutural que mais saltava lado a lado. */
.stops{margin-top:3px;display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:10px 40px minmax(0,1fr) auto;gap:7px;align-items:center;
  padding:4px 7px;margin-bottom:2px;position:relative;
  background:var(--card);border:.7px solid var(--line);border-radius:11px}
.stop.on{background:#0f1c31;border-color:var(--blue-line)}
.stop.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2.5px;border-radius:0 2px 2px 0;background:var(--blue)}
/* O bloco do número+hora ganha o painel mais claro da foto. */
.numwrap{background:#101c2f;border-radius:9px;padding:4px 2px}
.grip{width:9px;height:14px;margin-top:9px;color:#3b4c6d;
  background-image:radial-gradient(currentColor 1.05px,transparent 1.15px);background-size:4.5px 4.5px}
.numwrap{display:flex;flex-direction:column;align-items:center;gap:3px}
/* O halo do anel existe na foto — é brilho, não vidro: nada atrás dele
   aparece através. Fica. */
.num{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:400;
  border:1.1px solid var(--blue);color:var(--white);background:#0b1626;box-shadow:0 0 9px rgba(47,126,247,.28)}
.num.lime{border-color:var(--lime);background:#131e0c;box-shadow:0 0 9px rgba(158,222,42,.25)}
.num.off{border-color:#31415e;background:transparent;color:var(--ink-2);box-shadow:none}
.hh{font-size:10px;color:var(--blue-l)}
.hh.lime{color:var(--lime)}
.hh.off{color:var(--ink-3)}
.who{min-width:0;overflow-wrap:anywhere}
.who strong{display:block;font-size:13.5px;font-weight:500;line-height:1.2;letter-spacing:-.008em}
.who span{display:block;font-size:11px;color:var(--ink-2);line-height:1.3}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tag{font-size:10px;padding:2px 6px;border-radius:6px;border:.7px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.blue{border-color:var(--blue-line);color:var(--blue-l);background:var(--blue-bg-2)}
.tag.lime{border-color:var(--lime-line);color:var(--lime);background:var(--lime-bg)}
/* 🔴 COR É INFORMAÇÃO, e faltavam dois tons. Ao vestir a Rota do app com este
   vocabulário (leva 1), "janela rígida" perdeu o VERMELHO e "horário" perdeu o
   ÂMBAR: a tela passou a dizer MENOS do que dizia. O motorista lia o risco pela
   cor antes de ler a palavra. Mesma receita dos dois de cima — borda, tinta e
   fundo do próprio tom. */
.tag.amber{border-color:var(--amber-line);color:var(--amber);background:#231805}
.tag.red{border-color:var(--red-line);color:var(--red);background:var(--red-bg-3)}
/* Observação do cliente NÃO é o endereço: "cachorro solto no pátio" tem que
   pesar mais que a rua. Era `.stop-obs` na pele velha e virou linha muda. */
.who span.nota{color:var(--amber);font-weight:500}
.side{display:flex;flex-direction:column;gap:5px;align-items:stretch;min-width:96px}
.marc{border:.7px solid var(--line-2);border-radius:8px;padding:4px 8px;background:var(--card)}
.marc small{display:block;font-size:10px;color:var(--ink-2)}
.marc b{display:block;font-size:13.5px;color:var(--lime);font-weight:500;margin-top:1px}
.pill{display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 9px;border-radius:8px;
  font-size:11.5px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.pill.blue{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue-l)}
.pill.lime{background:var(--lime-bg-2);border-color:var(--lime-line);color:var(--lime)}
.pill.amber{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.pill.mute{background:var(--card);border-color:var(--line-2);color:var(--ink-2)}

/* ---------- rodapé de resumo ---------- */
.sum{display:flex;align-items:center;background:var(--card);border:.7px solid var(--line);
  border-radius:12px;padding:7px 4px;margin-top:6px}
.sum .c{flex:1;display:flex;align-items:center;gap:7px;justify-content:center;border-right:.7px solid var(--line)}
.sum .c:last-of-type{border-right:0}
.sum .c b{display:block;font-size:13.5px;font-weight:500}
.sum .c small{display:block;font-size:10.5px;color:var(--ink-2)}
.sum .go{padding:0 6px;color:var(--ink-2)}

/* ---------- ações ---------- */
.acts{display:flex;gap:7px;margin-top:6px}
.act{flex:1;display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:12px;cursor:pointer;
  border:.7px solid var(--line);background:var(--card);color:var(--ink);text-align:left}
.act b{display:block;font-size:13px;font-weight:500;line-height:1.15}
.act small{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
/* Botão principal: verde vivo com TINTA ESCURA — 8,6:1. O branco da foto media
   1,8:1 e sumia no sol do para-brisa; decisão do dono (06/08), o seletor morreu. */
.act.go{background:linear-gradient(180deg,var(--go-1),var(--go-2));border:0;color:var(--go-ink);box-shadow:0 7px 18px rgba(122,190,30,.26)}
.act.go b,.act.go small{color:var(--go-ink)}
.act.go b{font-weight:500}
.act.go small{opacity:.72}
/* Mesma régua pra toda peça verde cheia: transmux, confirmação, portão, recado. */
.tmx-main button,.conf .acoes .principal,.portao .acoes .principal,
.recado .acoes .principal,.erro .acoes .principal{color:var(--go-ink)}
.erro .acoes .principal{color:var(--white)}
.enviar{color:var(--go-ink)}
/* 🔴 O BOTÃO DE PERIGO ERA HEX INLINE, EM 4 TELAS. Estilo inline não tem como
   ser trocado pelo modo claro — ele ganha de qualquer seletor — então a borda
   vermelho-escura do tema escuro atravessava a virada e ficava quase preta no
   cartão branco. Mesma cura que o dono já deu à cor do produto: vira CLASSE.
   Perigo é papel, não decoração; e papel se declara. */
.act.perigo{color:var(--red);border-color:var(--red-line)}
.act.wide{flex:1.15}
.act.full{width:100%}
.act .chev{margin-left:auto;opacity:.65}

/* ---------- navegação — 6 abas (decisão do dono) ----------
   Chat e Ajustes voltaram pra barra: o Chat é o canal do escritório com o
   motorista e não podia morar em menu escondido. Com 6 colunas o rótulo cai
   pra 9px e o ícone pra 18 — o alvo de toque continua com ~68px de largura. */
.nav{position:absolute;left:0;right:0;bottom:0;height:60px;display:grid;grid-template-columns:repeat(6,1fr);
  align-items:center;padding:0 3px 8px;z-index:45;
  background:var(--bg);border-top:.7px solid var(--line)}
.nav button{border:0;background:transparent;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:6px 0 4px;font-size:9px;cursor:pointer;border-radius:10px;position:relative;margin-top:8px}
.nav button.on{color:var(--lime);background:#182642}
.nav button.on .ping{position:absolute;top:3px;right:16%;width:5px;height:5px;border-radius:50%;background:var(--blue)}

/* ==========================================================================
   TRANSMUX — o controle da rota. UM botão grande no meio (o que se faz AGORA)
   e no máximo dois satélites. O rótulo mora embaixo do botão, sempre: ícone
   sozinho em botão que muda de função é adivinhação.
   ========================================================================== */
/* 🔴 O CONTROLE DA ROTA NÃO ROLA. Medido: com o transmux no fim da lista ele
   nascia 142 a 310px abaixo da dobra — o motorista teria que rolar pra pausar
   a rota. Ele vive num rodapé fixo, logo acima das abas, e a lista corre por
   baixo. Quem rola é conteúdo; controle de operação em andamento, nunca. */
.tmx-dock{position:absolute;left:0;right:0;bottom:60px;z-index:30;padding:7px 11px 9px;
  background:var(--bg);border-top:.7px solid var(--line)}
/* medido: rodapé 120 + abas 60 = 180. 188 dá o respiro de 8px pro último
   cartão não encostar no vidro do controle. */
.body.com-dock{padding-bottom:188px}
.transmux{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.tmx-sat{display:flex;flex-direction:column;align-items:center;gap:4px}
.tmx-sat button{width:46px;height:46px;border-radius:16px;border:.7px solid var(--line);background:var(--card);
  color:var(--ink);display:grid;place-items:center;cursor:pointer;position:relative}
.tmx-sat.tmx-perigo button{color:var(--red);border-color:var(--red-line)}
.tmx-sat.tmx-info button{color:var(--blue-l);border-color:#26436e}
.tmx-sat small{font-size:9.5px;color:var(--ink-2)}
.tmx-sat.tmx-aviso button{color:var(--amber);border-color:var(--amber-line);animation:tmxPisca 1.15s ease-in-out infinite}
@keyframes tmxPisca{50%{opacity:.35}}
.tmx-sat .cont{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--amber);
  color:#1a1204;font-size:10px;font-weight:500;display:grid;place-items:center;border:1.5px solid var(--bg)}
.tmx-main{display:flex;flex-direction:column;align-items:center;gap:5px}
.tmx-main button{width:82px;height:82px;border-radius:30px;border:0;cursor:pointer;display:grid;place-items:center;
  color:var(--white);background:linear-gradient(180deg,var(--go-1),var(--go-2));box-shadow:0 10px 26px rgba(122,190,30,.3)}
.tmx-main button[data-estado="pausar"]{background:linear-gradient(180deg,#ffca63,#e08a00);color:#241500;
  box-shadow:0 10px 26px rgba(224,138,0,.3)}
.tmx-main button[data-estado="montar"]{background:linear-gradient(180deg,#4a95ff,var(--btn-blue-2));
  box-shadow:0 10px 26px rgba(47,126,247,.32)}
.tmx-main small{font-size:12px;font-weight:500}

/* ---------- progresso do dia ---------- */
.dia-bar{display:flex;align-items:center;gap:9px;margin-top:7px;padding:8px 11px;border-radius:12px;
  background:var(--card);border:.7px solid var(--line)}
.dia-bar .trilho{flex:1;height:6px;border-radius:4px;background:var(--trilho);overflow:hidden}
.dia-bar .trilho i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--prog-1),var(--prog-2))}
.dia-bar small{font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.dia-bar b{font-size:12.5px;white-space:nowrap}

/* ---------- filtro Fila / Entregue ---------- */
.filtro{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}
.filtro button{height:34px;border-radius:11px;border:.7px solid var(--line);background:var(--card);
  color:var(--ink-2);font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.filtro button b{color:var(--ink);font-weight:500}
.filtro button.on{border-color:var(--lime-line);background:var(--lime-bg);color:var(--lime)}
.filtro button.on b{color:var(--lime)}

/* ---------- conector de perna ---------- */
.perna{display:flex;justify-content:center;margin:-1px 0 1px}
.perna span{font-size:10px;color:var(--ink-3);background:var(--bg);padding:1px 9px;border-radius:999px;
  border:.7px solid var(--line)}
/* 🔴 "SEM TRAJETO" NÃO É UMA DISTÂNCIA A MENOS, É UM PINO FALTANDO. O trecho
   normal diz quanto falta; este diz que o app NÃO SABE onde fica o endereço —
   e sem tom próprio ele saía com a mesma cara de "850 m · 4 min", que é
   exatamente a leitura errada. */
.perna.alerta span{color:var(--red);border-color:var(--red-line);background:var(--red-bg-3)}

/* ---------- painel de créditos do dia ---------- */
.creditos{display:flex;align-items:center;gap:9px;margin-top:7px;padding:8px 11px;border-radius:12px;
  background:var(--card);border:.7px solid var(--line)}
.creditos .v{font-size:14px;font-weight:500}
.creditos small{font-size:10.5px;color:var(--ink-2)}
.creditos .debita{margin-left:auto;font-size:10.5px;color:var(--amber);text-align:right}

/* ---------- banner de estado (sem sinal, pausada, bloqueio) ---------- */
.banner{display:flex;align-items:center;gap:9px;margin-top:7px;padding:9px 11px;border-radius:12px;font-size:12px}
.banner.alerta{background:var(--amber-bg);border:.7px solid var(--amber-line);color:var(--amber)}
.banner.pausa{background:var(--blue-bg);border:.7px solid var(--blue-line);color:var(--blue-l)}
.banner b{color:var(--ink);font-weight:500}
.banner button{margin-left:auto;height:30px;padding:0 11px;border-radius:9px;border:.7px solid currentColor;
  background:transparent;color:inherit;font-size:11.5px;cursor:pointer;white-space:nowrap}

/* ---------- vazio e carregando ---------- */
.vazio{text-align:center;padding:34px 18px}
.vazio .ico{width:52px;height:52px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
  background:var(--card);border:.7px solid var(--line);color:var(--ink-3)}
.vazio strong{display:block;font-size:15px;font-weight:500}
.vazio span{display:block;font-size:12px;color:var(--ink-2);margin-top:4px}
.vazio .ghost{margin-top:14px}
.esq{background:linear-gradient(90deg,var(--card) 25%,#16233a 50%,var(--card) 75%);background-size:280% 100%;
  border-radius:11px;animation:esqOnda 1.5s linear infinite}
@keyframes esqOnda{to{background-position:-280% 0}}
.esq-linha{height:62px;margin-bottom:6px}

/* ---------- mapa ---------- */
.mapwrap{position:absolute;inset:0;z-index:10}
.mapwrap svg{width:100%;height:100%;display:block}
.map-float{position:absolute;left:12px;z-index:30}
.map-chip{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:12px;
  background:var(--glass);border:.7px solid var(--line)}
.map-chip .d{display:flex;align-items:center;gap:7px}
.map-chip small{display:block;font-size:10.5px;color:var(--ink-2)}
.map-chip b{display:block;font-size:12.5px;font-weight:500}
.map-chip .vr{width:1px;height:20px;background:var(--line)}
.map-ctrl{position:absolute;right:12px;display:flex;flex-direction:column;gap:8px;z-index:30}
.map-ctrl button{width:40px;height:40px;border-radius:50%;border:.7px solid var(--line);background:var(--glass);
  color:var(--blue-l);display:grid;place-items:center;cursor:pointer}
.next-card{position:absolute;left:9px;right:9px;bottom:72px;z-index:35;border-radius:15px;padding:11px 12px;
  background:var(--card);border:.7px solid var(--line);display:flex;align-items:center;gap:10px}
.next-card .handle{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:36px;height:3px;border-radius:2px;background:var(--handle)}
.next-card .info{flex:1;min-width:0;padding-top:3px}
.next-card .lb{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--lime);margin-bottom:2px}
.next-card .lb .n{width:19px;height:19px;border-radius:50%;border:.9px solid var(--lime);display:grid;place-items:center;font-size:10px}
.next-card strong{display:block;font-size:15px;font-weight:500;line-height:1.2}
.next-card span{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
.next-card .eta{padding:0 9px;border-left:.7px solid var(--line)}
.next-card .eta small{display:block;font-size:10px;color:var(--blue-l)}
.next-card .eta b{display:block;font-size:17px;font-weight:500;line-height:1.2}
.next-card .eta i{display:block;font-size:10.5px;color:var(--ink-2);font-style:normal}
.btn-blue{display:flex;align-items:center;gap:7px;padding:11px 15px;border-radius:12px;border:0;cursor:pointer;
  background:linear-gradient(180deg,var(--btn-blue-1),var(--btn-blue-2));color:var(--white);font-size:13px;font-weight:500;
  box-shadow:0 7px 18px rgba(47,126,247,.3)}

/* ==========================================================================
   GPS EM NAVEGAÇÃO — o que todo navegador de rua faz e eu não tinha feito:

   1. O CARRO NÃO FICA NO MEIO: fica a ~68% da altura. O que interessa é a rua
      À FRENTE, então sobra tela pra cima e quase nada pra trás.
   2. O mapa é RODADO pelo rumo (heading-up): a direção em que se anda aponta
      sempre pra cima. Por isso existe a bússola — é ela que diz onde é o norte.
   3. O mapa é INCLINADO (~50°): a rua foge pro horizonte. Vista de cima (2D)
      é mapa de planejamento, não de direção.
   4. A MANOBRA manda na tela e mora no TOPO: distância + verbo, corpo grande.
      A rua e a manobra seguinte vêm na linha de baixo, pequenas.
   5. O rodapé é o CONTRATO da viagem: chegada, tempo, distância e a saída.
   6. Velocímetro embaixo à esquerda; recentralizar só faz sentido perto do
      polegar, do lado direito.
   ========================================================================== */
.gps{position:absolute;inset:0;overflow:hidden;background:var(--fog)}
/* palco do mapa REAL: mesma caixa do desenho que ele substitui. O desenho
   fica embaixo como fundo de espera até o maplibre subir. */
.mapa-palco{position:absolute;inset:0}
.mapa-palco>svg{position:absolute;inset:0;width:100%;height:100%}
.mapa-palco.pronto>svg{opacity:0;transition:opacity .3s ease}
.mapa-vivo{position:absolute;inset:0}
.gps-mundo{position:absolute;left:-42%;right:-42%;top:-52%;bottom:-6%;
  transform:perspective(640px) rotateX(51deg);transform-origin:50% 74%}
.gps-mundo svg{width:100%;height:100%;display:block}
/* Névoa do horizonte: sem ela a borda do mapa aparece como um corte reto no
   meio da tela — é o detalhe que denuncia mapa falso. */
.gps-horizonte{position:absolute;left:0;right:0;top:0;height:44%;pointer-events:none;
  background:linear-gradient(180deg,var(--fog) 22%,rgba(7,13,24,.72) 58%,transparent)}

.gps-puck{position:absolute;left:50%;top:68%;width:0;height:0;z-index:12}
/* O facho é um CONE recortado, não um gradiente cônico: o `conic-gradient`
   pintava um retângulo azul na frente da seta (visível no claro, horrível).
   Recorte em polígono garante a forma; o gradiente só dá a queda de luz. */
.gps-facho{position:absolute;left:-44px;top:-92px;width:88px;height:100px;
  background:linear-gradient(180deg,rgba(91,157,255,0),rgba(91,157,255,.30) 78%,rgba(91,157,255,.34));
  clip-path:polygon(50% 100%, 4% 0%, 96% 0%);filter:blur(2px)}
.gps-seta{position:absolute;left:-17px;top:-19px;width:34px;height:38px;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.65))}

.gps-manobra{position:absolute;left:9px;right:9px;top:6px;z-index:20;border-radius:15px;
  background:var(--card);border:.7px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.5);overflow:hidden}
.gps-manobra .cima{display:flex;align-items:center;gap:12px;padding:11px 13px}
.gps-manobra .seta{width:48px;height:48px;border-radius:13px;background:var(--blue-bg);color:var(--blue-l);
  display:grid;place-items:center;flex:0 0 48px}
.gps-manobra .dist{display:block;font-size:22px;font-weight:500;line-height:1.05;letter-spacing:-.02em}
.gps-manobra .verbo{display:block;font-size:15px;color:var(--ink);margin-top:2px}
.gps-manobra .baixo{display:flex;align-items:center;gap:7px;padding:7px 13px;border-top:.7px solid var(--line);
  background:var(--glass);font-size:11.5px;color:var(--ink-2)}
.gps-manobra.chegou .seta{background:var(--lime-bg-2);color:var(--lime)}
.gps-manobra.chegou .dist{color:var(--lime)}

.gps-bussola{position:absolute;right:11px;top:96px;z-index:20;width:38px;height:38px;border-radius:50%;
  background:var(--glass);border:.7px solid var(--line);display:grid;place-items:center;color:var(--ink-2);font-size:9.5px}
.gps-vel{position:absolute;left:11px;bottom:104px;z-index:20;width:56px;height:56px;border-radius:50%;
  background:var(--glass);border:.7px solid var(--line);display:grid;place-items:center;text-align:center;line-height:1}
.gps-vel b{display:block;font-size:19px;font-weight:500}
.gps-vel small{display:block;font-size:8.5px;color:var(--ink-2);margin-top:2px}
.gps-lado{position:absolute;right:11px;bottom:104px;z-index:20;display:flex;flex-direction:column;gap:8px}
.gps-lado button{width:40px;height:40px;border-radius:50%;border:.7px solid var(--line);background:var(--glass);
  color:var(--blue-l);display:grid;place-items:center;cursor:pointer}

.gps-rodape{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--glass);
  border-top:.7px solid var(--line);padding:9px 12px 12px}
.gps-rodape .parada{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.gps-rodape .parada b{color:var(--ink);font-weight:500}
.gps-rodape .linha{display:flex;align-items:center;gap:10px}
.gps-rodape .n{flex:1;text-align:center}
.gps-rodape .n b{display:block;font-size:17px;font-weight:500;line-height:1.1}
.gps-rodape .n small{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
.gps-rodape .n.destaque b{color:var(--lime)}
.gps-rodape .sair{height:42px;padding:0 15px;border-radius:12px;border:.7px solid var(--red-line-2);background:var(--red-bg);
  color:#ff8b85;font-size:13.5px;cursor:pointer}

/* ---------- folha ---------- */
.scrim{position:absolute;inset:0;background:rgba(3,7,14,.72);z-index:40}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;border-radius:22px 22px 0 0;
  background:linear-gradient(180deg,#0f1a2c,var(--bg-2) 30%);border:.7px solid var(--line);border-bottom:0;
  padding:10px 12px 72px;max-height:88%;overflow:auto;scrollbar-width:none;box-shadow:0 -18px 44px rgba(0,0,0,.6)}
.sheet::-webkit-scrollbar{display:none}
.sheet .handle{width:36px;height:3px;border-radius:2px;background:var(--handle);margin:0 auto 10px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheet-head h2{margin:0;font-size:21px;font-weight:500;letter-spacing:-.3px}
.sheet-head p{margin:2px 0 0;font-size:12px;color:var(--ink-2)}
.box{background:var(--card);border:.7px solid var(--line);border-radius:13px;padding:10px}
.box+.box{margin-top:8px}
.box-t{font-size:13.5px;font-weight:500}
.box-s{font-size:11px;color:var(--ink-2);margin-top:1px}
.thumb{width:56px;height:56px;border-radius:11px;background:linear-gradient(160deg,#12305f,#0a1a33);
  border:1px solid #1d3a6b;display:grid;place-items:center;flex:0 0 56px;color:var(--blue-l)}
/* Tom do produto por CLASSE (o hex inline era do escuro e sumia no claro). */
.thumb.t-azul{color:var(--blue-l)}
.thumb.t-azul-escuro{color:#7fb0ff}
.thumb.t-cinza{color:#b6c6dd}
.thumb.t-lima{color:var(--lime)}
.marca.info{background:var(--blue-bg);color:var(--blue-l)}
.map-ctrl button.ativo{background:var(--blue-bg)}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.pay{display:flex;align-items:center;gap:8px;padding:10px;border-radius:11px;cursor:pointer;text-align:left;
  border:.7px solid var(--line-2);background:var(--field);color:var(--ink);position:relative}
.pay b{display:block;font-size:13px;font-weight:500}
.pay small{display:block;font-size:10px;color:var(--ink-2);margin-top:1px}
.pay.sel{border-color:var(--lime);background:var(--sel-bg)}
.pay.sel .ok{position:absolute;top:8px;right:8px;color:var(--lime)}
.pay.blue{border-color:rgba(47,126,247,.5)}
.rowline{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:12.5px}
.rowline+.rowline{border-top:1px dashed var(--line-2)}
.rowline b{color:var(--lime);font-size:13.5px;font-weight:500}
.foot2{display:grid;grid-template-columns:1.1fr .9fr;gap:8px;margin-top:10px}

/* ---------- fechamento ---------- */
.forms{display:flex;background:var(--card);border:.7px solid var(--line);border-radius:12px;overflow:hidden}
.form-c{flex:1;padding:9px 4px;text-align:center;border-right:.7px solid var(--line)}
.form-c:last-child{border-right:0}
.form-c small{display:block;font-size:10.5px;color:var(--ink-2);margin-top:4px}
.form-c b{display:block;font-size:12.5px;font-weight:500;margin-top:1px}
.form-c.total{background:var(--sel-bg)}
.form-c.total b{color:var(--lime);font-size:15px}

/* ---------- progresso ---------- */
.prog{background:var(--card);border:.7px solid var(--line);border-radius:12px;padding:9px 11px;margin-top:8px}
.prog-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2)}
.prog-l b{color:var(--lime)}
.prog-b{height:5px;border-radius:3px;background:var(--trilho);margin-top:7px;overflow:hidden}
.prog-b i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--prog-1),var(--prog-2))}

/* ---------- busca / chips ---------- */
.searchrow{display:flex;gap:7px;margin-top:7px}
.search{flex:1;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:12px;
  background:var(--card);border:.7px solid var(--line);color:var(--ink-3)}
.search input{flex:1;border:0;background:transparent;outline:0;font-size:13px;color:var(--ink)}
.filt{width:38px;height:38px;border-radius:12px;background:var(--card);border:.7px solid var(--line);
  display:grid;place-items:center;color:var(--ink-2);cursor:pointer}
.chips{display:flex;gap:6px;margin-top:9px;overflow:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 13px;border-radius:10px;border:.7px solid var(--line-2);background:transparent;
  color:var(--ink);font-size:12.5px;white-space:nowrap;cursor:pointer}
.chip.on{border-color:var(--lime);color:var(--lime);background:var(--sel-bg)}

/* ---------- título de tela ---------- */
.screen-head{display:flex;align-items:center;gap:10px;margin:2px 0 0}
.screen-head h2{margin:0;font-size:21px;font-weight:500;letter-spacing:-.3px}
.screen-head p{margin:1px 0 0;font-size:11.5px;color:var(--ink-2)}

/* ---------- produto ----------
   Na foto a lista inteira mora DENTRO de um cartão só, dividida por fios —
   o contrário das paradas, que são cartões separados. */
.lista-card{background:var(--card);border:.7px solid var(--line);border-radius:13px;padding:0 10px;margin-top:6px}
.lista-card>*:last-child{border-bottom:0}
.prod{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 2px;
  border-bottom:.6px solid rgba(26,39,64,.95)}
.prod .nm{font-size:14px;font-weight:500}
.prod .st{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);margin-top:3px}
.price{position:relative;border:.9px solid var(--lime);border-radius:9px;padding:7px 12px;
  color:var(--lime);font-size:15px;font-weight:400;background:#111a10}
.price::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%) rotate(45deg);
  width:8px;height:8px;background:var(--bg-2);border-right:.9px solid var(--lime);border-bottom:.9px solid var(--lime)}

/* ---------- rotas salvas ---------- */
.rowcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;
  background:var(--card);border:.7px solid var(--line);border-radius:12px;padding:6px 9px;margin-bottom:5px;cursor:pointer}
.rowcard .ico{width:36px;height:36px;border-radius:10px;background:var(--blue-bg-2);
  border:.7px solid var(--line-2);display:grid;place-items:center;color:var(--blue-l)}
.rowcard .ico.lime{background:var(--lime-bg);color:var(--lime)}
.rowcard strong{display:block;font-size:13px;font-weight:500}
.rowcard span{display:block;font-size:10px;color:var(--ink-2)}
.rowcard .meta{display:flex;gap:9px;margin-top:2px;font-size:10px;color:var(--ink-2)}
.rowcard .meta i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.rowcard .rgt{text-align:right}
.rowcard .rgt small{display:block;font-size:10.5px;color:var(--ink-2)}
.rowcard .rgt b{display:block;font-size:13.5px;color:var(--lime);font-weight:500;margin-top:1px}
.mini-acts{display:flex;gap:9px;align-items:center;padding-left:8px;border-left:.7px solid var(--line)}
.mini{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;color:var(--ink-2);cursor:pointer}
.mini .c{color:var(--blue-l)}

/* ---------- semana ---------- */
.week{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;
  background:var(--card);border:.7px solid var(--line);border-radius:12px;padding:9px;margin-bottom:7px}
.week .d strong{display:block;font-size:13px;font-weight:500}
.week .d span{display:block;font-size:10.5px;color:var(--ink-2)}
.week .q i{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-2);font-style:normal}
.week .q i+i{margin-top:3px}
.week .r small{display:block;font-size:10.5px;color:var(--ink-2)}
.week .r b{display:block;font-size:13px;color:var(--lime);font-weight:500}
.week .mk{border:1px solid var(--lime-line);background:#111a0c;border-radius:9px;padding:6px 8px;display:flex;align-items:center;gap:6px}
.week .mk small{display:block;font-size:10px;color:var(--ink-2)}
.week .mk b{display:block;font-size:13px;color:var(--lime);font-weight:500}

/* ---------- formulário (ficha do cliente / produto) ---------- */
.campos{display:grid;gap:8px}
.campo{display:block}
.campo>label{display:block;font-size:10.5px;color:var(--ink-2);margin-bottom:3px}
.campo>label .pend{color:var(--amber)}
.campo input,.campo textarea{width:100%;height:38px;border-radius:11px;border:.7px solid var(--line);
  background:var(--field);padding:0 11px;outline:0;font-size:13px;color:var(--ink)}
.campo textarea{height:56px;padding:8px 11px;resize:none;line-height:1.35}
.campo.erro input{border-color:#7a3a1a;background:#1a1108}
.campo .dica{display:block;font-size:10px;color:var(--amber);margin-top:3px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tripla{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:3px}
.dias button{padding:7px 0;border-radius:10px;border:.7px solid var(--line);background:var(--card);
  color:var(--ink-2);font-size:11px;cursor:pointer}
.dias button.on{border-color:var(--lime);background:var(--lime-bg);color:var(--lime)}
.dias button small{display:block;font-size:9px;opacity:.8;margin-top:1px}

/* ---------- stepper de quantidade ---------- */
.item-linha{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:9px 0;border-bottom:.6px solid rgba(26,39,64,.95)}
.item-linha:last-child{border-bottom:0}
.item-linha strong{display:block;font-size:13px;font-weight:500}
.item-linha span{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
.passo{display:flex;align-items:center;gap:8px}
/* 🔴 O STEPPER É UM <span> DENTRO DE .item-linha — e `.item-linha span` (0,1,1)
   VENCE `.passo` (0,1,0). Resultado medido no vidro: display virava `block` e a
   fonte caía pra 10,5px, então os botões − e + EMPILHAVAM num filete de 30px.
   Não era o dado real ser maior: acontece com o nome do próprio mock. */
.item-linha .passo{display:flex;margin-top:0}
.passo button{width:30px;height:30px;border-radius:10px;border:.7px solid var(--line-2);background:var(--card);
  color:var(--ink);font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center}
.passo b{min-width:22px;text-align:center;font-size:15px;font-weight:500}

/* ---------- motivos de não entrega ---------- */
.motivos{display:grid;gap:6px;margin-top:9px}
.motivo{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px 11px;
  border-radius:12px;border:.7px solid var(--line);background:var(--field);color:var(--ink);
  font-size:13px;text-align:left;cursor:pointer}
.motivo .bola{width:17px;height:17px;border-radius:50%;border:1.2px solid var(--line-2)}
.motivo.on{border-color:var(--amber-line);background:#1e1608}
.motivo.on .bola{border-color:var(--amber);box-shadow:inset 0 0 0 4px var(--amber)}

/* ---------- comprovante ---------- */
.foto{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:center;margin-top:9px;
  padding:11px;border-radius:13px;border:.7px dashed var(--line-2);background:var(--field)}
.foto .quadro{width:56px;height:56px;border-radius:11px;background:#101d31;display:grid;place-items:center;color:var(--blue-l)}
.foto strong{display:block;font-size:12.5px;font-weight:500}
.foto span{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}

/* ---------- prévia do dia (gerenciador) ---------- */
.previa{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;
  border-radius:12px;border:.7px solid var(--line);background:var(--card);margin-bottom:5px}
.previa.entra{border-color:var(--lime-line)}
.previa.sai{opacity:.5}
.previa .marca{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:11px}
.previa.entra .marca{background:var(--lime-bg-2);color:var(--lime)}
.previa.sai .marca{background:var(--red-bg);color:var(--red)}
.previa strong{display:block;font-size:13px;font-weight:500}
.previa span{display:block;font-size:10.5px;color:var(--ink-2)}

/* ---------- pacotes de recarga ---------- */
.pacotes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.pacote{border:.7px solid var(--line);background:var(--card);border-radius:14px;padding:12px 11px;text-align:center;
  cursor:pointer;color:var(--ink);position:relative}
.pacote.on{border-color:var(--lime);background:var(--sel-bg)}
.pacote b{display:block;font-size:21px;font-weight:500;letter-spacing:-.02em}
.pacote small{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
.pacote .preco{display:block;font-size:14px;color:var(--lime);margin-top:7px}
.pacote .selo{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:9.5px;padding:2px 8px;
  border-radius:999px;background:var(--lime);color:var(--go-ink)}

/* ---------- extrato ---------- */
.extrato{background:var(--card);border:.7px solid var(--line);border-radius:13px;padding:0 11px;margin-top:6px}
.ext-linha{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;
  border-bottom:.6px solid rgba(26,39,64,.95)}
.ext-linha:last-child{border-bottom:0}
.ext-linha .m{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px}
.ext-linha .m.mais{background:var(--lime-bg-2);color:var(--lime)}
.ext-linha .m.menos{background:var(--red-bg);color:var(--red)}
.ext-linha strong{display:block;font-size:12.5px;font-weight:400}
.ext-linha span{display:block;font-size:10px;color:var(--ink-2)}
.ext-linha b{font-size:13px;font-weight:500}
.ext-linha b.mais{color:var(--lime)}
.ext-linha b.menos{color:var(--red)}

/* ---------- passeio ---------- */
.tempo{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:6px}
.tempo button{height:52px;border-radius:13px;border:.7px solid var(--line);background:var(--card);color:var(--ink);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tempo button b{font-size:15px;font-weight:500}
.tempo button small{font-size:9.5px;color:var(--ink-2)}
.tempo button.on{border-color:var(--lime);background:var(--lime-bg);color:var(--lime)}
.tempo button.on small{color:var(--lime);opacity:.8}

/* ---------- leitura de rota (gravando) ---------- */
.gravando{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;margin-top:6px;
  padding:11px;border-radius:14px;border:.7px solid var(--red-line-2);background:var(--red-bg-2)}
.gravando .bola{width:12px;height:12px;border-radius:50%;background:#ff5b5b;animation:gravPulsa 1.1s ease-in-out infinite}
@keyframes gravPulsa{50%{opacity:.25;transform:scale(.82)}}
.gravando b{display:block;font-size:15px;font-weight:500}
.gravando span{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
.gravando .crono{font-size:19px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ==========================================================================
   OS DOIS GESTOS — funcionam de verdade aqui, com dedo e com mouse.
   SEGURAR = excluir (950ms, vermelho progressivo, vibração no fim).
   PUNHO   = arrastar pra reordenar (pega na hora, sem espera).
   A zona do punho NUNCA arma o excluir: dedo na alça é outro gesto.
   ========================================================================== */
.gesto-item{position:relative;overflow:hidden;touch-action:pan-y;user-select:none}
.gesto-item::after{content:"";position:absolute;inset:0;width:0;background:rgba(242,85,90,.22);
  pointer-events:none;transition:width 0s}
.gesto-item.armando::after{width:100%;transition:width .95s linear}
.gesto-item.pronto{border-color:var(--red);background:var(--red-bg)}
.gesto-item.pronto::after{width:100%;background:rgba(242,85,90,.3)}
.gesto-item.arrastando{z-index:5;box-shadow:0 12px 28px rgba(0,0,0,.5);border-color:var(--blue-line);
  transform:scale(1.015);transition:transform .12s}
.gesto-item .grip{cursor:grab;touch-action:none}
.gesto-dica{font-size:11px;color:var(--ink-2);text-align:center;margin:8px 0 2px}
.gesto-dica b{color:var(--lime)}

/* ---------- chat da Central ---------- */
.recado{border:.7px solid var(--amber-line);background:#1a1408;border-radius:14px;padding:11px;margin-top:6px}
.recado .topo{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.recado .ico{width:34px;height:34px;border-radius:11px;background:var(--amber-bg);color:var(--amber);display:grid;place-items:center}
.recado strong{display:block;font-size:13.5px;font-weight:500}
.recado span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:1px}
.recado .acoes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.recado .acoes button{height:36px;border-radius:11px;border:.7px solid var(--line-2);background:var(--card);
  color:var(--ink);font-size:12.5px;cursor:pointer}
/* 🔴 ESTA LINHA JÁ FOI `color:#fff`. A lei da tinta escura mora lá em cima
   (procure ".act.go"), com a MESMA força de seletor — e regra de força igual
   quem ganha é a de BAIXO. Como esta nasceu depois, ela vencia calada e o
   "Entendi" do recado saía branco no lima: 1,78:1, medido. Regra que diz o
   contrário da lei não se corrige com ordem; se corrige dizendo a lei. */
.recado .acoes .principal{background:linear-gradient(180deg,var(--go-1),var(--go-2));border:0;color:var(--go-ink)}
.conversa{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.msg{max-width:82%;padding:8px 11px;border-radius:14px;font-size:12.5px;line-height:1.35}
.msg.deles{background:var(--card);border:.7px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.msg.minha{background:var(--lime-bg-2);border:.7px solid var(--lime-line);border-bottom-right-radius:5px;align-self:flex-end}
.msg small{display:block;font-size:9.5px;color:var(--ink-3);margin-top:3px}
.escrever{display:flex;align-items:center;gap:8px;margin-top:12px;height:42px;padding:0 12px;border-radius:14px;
  background:var(--card);border:.7px solid var(--line)}
.escrever input{flex:1;border:0;background:transparent;outline:0;font-size:13px;color:var(--ink)}
.escrever .enviar{width:30px;height:30px;border-radius:10px;border:0;background:var(--lime);color:var(--go-ink);
  display:grid;place-items:center;cursor:pointer}

/* ---------- ajustes ---------- */
.grupo{font-size:11px;color:var(--ink-2);margin:12px 2px 5px}
.cartao-lista{background:var(--card);border:.7px solid var(--line);border-radius:13px;overflow:hidden}
.linha-cfg{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:10px 11px;border:0;border-bottom:.6px solid rgba(26,39,64,.95);background:transparent;
  color:var(--ink);text-align:left;cursor:pointer}
.linha-cfg:last-child{border-bottom:0}
.linha-cfg .ico{width:30px;height:30px;border-radius:10px;background:#111d31;color:var(--ink-2);display:grid;place-items:center}
.linha-cfg strong{display:block;font-size:13px;font-weight:400}
.linha-cfg span{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
.linha-cfg b{font-size:12.5px;font-weight:500;color:var(--ink-2)}
/* 🔴 INTERRUPTOR PRECISA DE LIMITE VISÍVEL NOS DOIS ESTADOS. O trilho sozinho
   media 1,3:1 contra o cartão no escuro e 1,78:1 no claro — dava pra não ver
   se estava ligado. Quem define o limite é a BORDA; o preenchimento só diz o
   estado. Mínimo de 3:1 em trilho×cartão e bola×trilho, medido nas duas peles. */
.chave{width:38px;height:22px;border-radius:999px;background:#22314c;border:1px solid #5c6f92;
  position:relative;flex:0 0 38px;box-sizing:border-box}
.chave i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--ink-2);transition:left .2s,background .2s}
.chave.on{background:var(--lime);border-color:#c6f27a}
.chave.on i{left:18px;background:var(--go-ink)}

/* ---------- clientes ---------- */
/* 🔴 A LINHA DE CLIENTE TAMBÉM É BOTÃO. No mock ela é `<div>` (nada clica), mas
   no app ela ABRE A FICHA — e aí o navegador devolve o botão de fábrica por
