/* 🔴 O TREMOR ANDA EM `translate`, NUNCA em margin nem em transform: margin é
   layout (a tela inteira recalcula a CADA um dos 7 quadros do sacode) e o
   transform já tem dono aqui (`mvErro` escala o cartão até 320 ms, e o sacode
   parte aos 300). `translate` compõe com o transform sem brigar e roda no
   compositor — mesmos deslocamentos, mesmo relógio, zero reflow.
   🔴 Os números são a METADE dos que o margin declarava: item de largura 100%
   centrado por grid só andava MEIO margin (o centro redistribui a sobra) — a
   tela aprovada sempre tremeu 3,5px, e é a tela que manda, não o keyframe. */
@keyframes mvSacode{0%,100%{translate:0}15%{translate:-3.5px}35%{translate:3px}55%{translate:-2px}75%{translate:1px}}

/* ==========================================================================
   CONFIRMAÇÃO — cartão central, sem drama: cresce 6% e assenta.
   ========================================================================== */
.conf-wrap{position:absolute;inset:0;z-index:58;display:grid;place-items:center;padding:0 24px;
  background:rgba(4,7,13,.66);animation:mvScrim 160ms ease-out both}
.conf{width:100%;background:var(--card);border:.7px solid var(--line);border-radius:16px;padding:16px 15px 14px;
  box-shadow:0 20px 50px rgba(0,0,0,.55);animation:mvConf var(--mv-normal) var(--cv-entra) both}
.conf strong{display:block;font-size:16px;font-weight:500;animation:trItem .3s var(--cv-entra) .08s both}
.conf .sub{display:block;font-size:12.5px;color:var(--ink-2);margin-top:4px;animation:trItem .3s var(--cv-entra) .14s both}
.conf .acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;animation:trItem .3s var(--cv-entra) .2s both}
.conf .acoes button{height:40px;border-radius:11px;border:.7px solid var(--line-2);background:transparent;
  color:var(--ink);font-size:13.5px;cursor:pointer}
.conf .acoes .principal{background:linear-gradient(180deg,var(--go-1),var(--go-2));border:0;color:var(--go-ink)}
@keyframes mvConf{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.saindo{animation:mvSai 200ms var(--cv-sai) both!important}
@keyframes mvSai{to{opacity:0;transform:scale(.96)}}

/* ==========================================================================
   PORTÕES — as telas que PARAM o motorista pra decidir. Três tons, e o tom diz
   o que está em jogo: âmbar pede decisão, vermelho bloqueia, azul informa.
   O que BLOQUEIA entra com a curva dura do erro (lei 5); o que só pergunta
   entra macio. Portão sem saída é armadilha: só o update obrigatório não fecha.
   ========================================================================== */
.portao-wrap{position:absolute;inset:0;z-index:59;display:grid;place-items:center;padding:0 20px;
  background:rgba(4,7,13,.7);animation:mvScrim 160ms ease-out both}
.portao{width:100%;max-height:82%;overflow:auto;scrollbar-width:none;background:var(--card);
  border:.7px solid var(--line);border-radius:17px;padding:15px 14px 13px;
  box-shadow:0 22px 54px rgba(0,0,0,.6);animation:mvConf var(--mv-normal) var(--cv-entra) both}
.portao::-webkit-scrollbar{display:none}
.portao.trava{border-color:var(--red-line-2);background:var(--red-bg-2);animation:mvErro 320ms var(--cv-mola) both,mvSacode 340ms 300ms both}
.portao .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:11px;
  animation:mvPop var(--mv-normal) var(--cv-mola) .08s both}
.portao.alerta .ico{background:var(--amber-bg);color:var(--amber)}
.portao.trava .ico{background:var(--danger-ico-bg);color:var(--danger-ico)}
.portao.info .ico{background:var(--blue-bg);color:var(--blue-l)}
.portao.ok .ico{background:var(--lime-bg-2);color:var(--lime)}
.portao h3{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em;
  animation:trItem .3s var(--cv-entra) .14s both}
.portao .sub{display:block;font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.4;
  animation:trItem .3s var(--cv-entra) .2s both}
.portao .corpo{margin-top:12px;animation:trItem .3s var(--cv-entra) .26s both}
.portao .acoes{display:grid;gap:7px;margin-top:14px;animation:trItem .3s var(--cv-entra) .32s both}
.portao .acoes.duas{grid-template-columns:1fr 1fr}
.portao .acoes button{height:42px;border-radius:12px;border:.7px solid var(--line-2);background:transparent;
  color:var(--ink);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.portao .acoes .principal{background:linear-gradient(180deg,var(--go-1),var(--go-2));border:0;color:var(--go-ink)}
/* O "sim" que DESTRÓI usa a tinta do perigo — mesma peça do aviso de erro
   (`--danger-btn`), nada de cor nova. Ver o comentário do `portao()`. */
.portao.perigo .acoes .principal{background:var(--danger-btn);border:0;color:var(--white)}
.portao .acoes .perigo{color:var(--red);border-color:var(--red-line)}
.portao .acoes .azul{background:linear-gradient(180deg,var(--btn-blue-1),var(--btn-blue-2));border:0;color:var(--white)}
/* 🔴 PORTÃO QUE ATRAVESSOU UM REPINTE NÃO ENTRA DE NOVO. Ele é MUDADO de
   camada (ver `pintar`), e re-inserir um nó reencena todo `@keyframes` dele:
   o diálogo que já estava aberto piscaria a cada dado que chega do servidor.
   Vem depois das regras acima de propósito — mesma especificidade, quem está
   embaixo vence, inclusive o `mvErro`+`mvSacode` do `.trava`. */
.portao-wrap.remontado,.portao-wrap.remontado *:not(.saindo){animation:none}

/* ==========================================================================
   VOCÊ CHEGOU — peça única, LOTE 3 (15/08, ordem do dono: *"a tela... no 2d
   e 3d tem que ser IGUAL"* + *"é para abrir na frente sim"*). Camada
   IMPERATIVA, irmã gêmea do `.portao-wrap` — NÃO é `T.rota` nem `T.mapa`,
   é um nó só, montado por `cartaoChegada()`/`remontarChegada()` na ÚLTIMA
   `.tela`, igual esteja o motorista no mapa 2D ou dirigindo no 3D. Ver a
   função pra saber por que a peça é imperativa, não template.
   CSS sem cor nova: as declarações abaixo são as do `.portao-wrap`/`.portao`
   trocando só o z-index; o check reusa o par `--lime-bg-2`/`--lime` do
   `.portao.ok .ico`; a tipografia do título/nome vem de `.gps-manobra`
   (`.dist`/`.verbo`) NAMESPACED aqui — `.gps-manobra` é `position:absolute`
   e brigaria com o `place-items:center` desta peça.
   z-index 56: ACIMA de todo cromo de tela (dock 30, next-card 35, hdr 40,
   nav 45, status 50, aula 52, aviso 55 — "abre na frente") e ABAIXO de
   conf/portão/erro (58/59/60) — update obrigatório, forma de pagamento e
   erro de rede continuam ganhando. */
.chegou-wrap{position:absolute;inset:0;z-index:56;display:grid;place-items:center;padding:0 20px;
  background:rgba(4,7,13,.7);animation:mvScrim 160ms ease-out both}
.chegou-cartao{width:100%;max-height:82%;overflow:auto;scrollbar-width:none;background:var(--card);
  border:.7px solid var(--line);border-radius:17px;padding:18px 16px 15px;text-align:center;
  box-shadow:0 22px 54px rgba(0,0,0,.6);animation:mvConf var(--mv-normal) var(--cv-entra) both}
.chegou-cartao::-webkit-scrollbar{display:none}
.chegou-cartao .seta{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin:0 auto 12px;
  background:var(--lime-bg-2);color:var(--lime);animation:mvPop var(--mv-normal) var(--cv-mola) .08s both}
.chegou-cartao .dist{display:block;font-size:24px;font-weight:650;line-height:1.15;letter-spacing:-.02em;
  color:var(--lime);animation:trItem .3s var(--cv-entra) .14s both}
.chegou-cartao .verbo{display:block;font-size:19px;font-weight:500;color:var(--ink);margin-top:3px;
  animation:trItem .3s var(--cv-entra) .18s both}
.chegou-cartao .baixo{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.4;margin-top:6px;
  animation:trItem .3s var(--cv-entra) .22s both}
.chegou-cartao .acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;
  animation:trItem .3s var(--cv-entra) .28s both}
.chegou-cartao .acoes .ghost{justify-content:center;width:100%;height:42px;border-radius:12px;
  border:.7px solid var(--line-2)}
.chegou-cartao .acoes .act{height:42px;justify-content:center}
/* atravessa o repinte igual ao portão: nó MOVIDO (não redesenhado), então
   ninguém reanima — é o que impede o repinte de 1x/s do 3D reencenar a
   entrada (armadilha nº2 do desenho). */
.chegou-wrap.remontado,.chegou-wrap.remontado *:not(.saindo){animation:none}

/* ==========================================================================
   O CHAT COMO POP-UP (17/08 — item 9 do dono). Terceira irmã do `.portao-wrap`:
   mesma casca, mesmo scrim, mesma remontagem. Só três coisas mudam, e cada uma
   tem motivo:
   · ela SOBE DE BAIXO (`mvFolha`) em vez de crescer no centro — é uma conversa,
     e conversa é folha; cartão central é pra decidir e pra avisar.
   · ela tem ALTURA DE TETO (78%), porque a conversa cresce com o dado e o mapa
     tem que continuar aparecendo por cima dela: o pop-up existe justamente pra
     não perder de vista onde o motorista está.
   · `z-index:57` — acima do "Você chegou" (56) porque quem abriu o chat abriu
     agora, e abaixo de confirmação/portão/erro (58/59/60), que continuam
     ganhando de tudo.
   Cor nova: nenhuma. O scrim é o mesmo par dos irmãos e o miolo veste `--card`.
   ========================================================================== */
.chat-wrap{position:absolute;inset:0;z-index:57;display:flex;align-items:flex-end;
  background:rgba(4,7,13,.66);animation:mvScrim 160ms ease-out both}
.chat-pop{width:100%;max-height:78%;display:flex;flex-direction:column;
  background:var(--card);border-top:.7px solid var(--line);
  border-radius:20px 20px 0 0;box-shadow:0 -18px 46px rgba(0,0,0,.55);
  animation:mvFolha var(--mv-folha) var(--cv-entra) both}
.chat-pop-topo{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:11px 12px 9px;border-bottom:.7px solid var(--line)}
.chat-pop-topo .tt{display:flex;align-items:center;gap:8px;color:var(--lime);font-size:13px}
.chat-pop-topo .tt b{color:var(--ink);font-weight:500}
/* O miolo é o MESMO gerador da tela do chat (§ `corpoDoChat`), então ele precisa
   da mesma caixa: coluna, conversa empurrada pro pé, campo de escrever no fim.
   `min-height:0` é obrigatório — sem ele o filho que rola não encolhe e a folha
   estoura o teto de 78%. */
.chat-pop .chat-corpo{flex:1;min-height:0;display:flex;flex-direction:column;
  overflow:auto;scrollbar-width:none;padding:0 11px 11px}
.chat-pop .chat-corpo::-webkit-scrollbar{display:none}
.chat-pop .conversa{margin-top:auto}
.chat-wrap.remontado,.chat-wrap.remontado *:not(.saindo){animation:none}

/* linha de problema: o nome, o que falta, e a seta que leva ao conserto */
.pt-linha{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;
  border-radius:12px;border:.7px solid var(--line);background:var(--field);margin-bottom:6px;cursor:pointer}
.pt-linha .m{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--amber-bg);color:var(--amber)}
.pt-linha strong{display:block;font-size:12.5px;font-weight:500}
.pt-linha span{display:block;font-size:10.5px;color:var(--amber);margin-top:1px}
/* Passo de mini tutorial — irmão do `.pt-linha`, em tinta NEUTRA de propósito:
   aquele é linha de PROBLEMA (âmbar em tudo), este só explica uma função que
   ainda não foi usada. Mesma peça com a mesma cor ensinaria o motorista que
   espaço vazio é pendência. */
.pt-passo{display:grid;grid-template-columns:16px 1fr;gap:9px;align-items:start;padding:6px 2px}
.pt-passo>b{font-size:14px;font-weight:500;color:var(--lime);line-height:1.3}
.pt-passo>span{display:block;font-size:11.5px;color:var(--ink-2);line-height:1.35}
.pt-passo strong{display:block;font-size:12.5px;font-weight:500;color:var(--ink)}
.pt-nums{display:flex;gap:0;background:var(--field);border:.7px solid var(--line);border-radius:12px;overflow:hidden}
.pt-nums div{flex:1;padding:9px 6px;text-align:center;border-right:.7px solid var(--line)}
.pt-nums div:last-child{border-right:0}
.pt-nums b{display:block;font-size:15px;font-weight:500}
.pt-nums small{display:block;font-size:10px;color:var(--ink-2);margin-top:1px}
.pt-campo{display:flex;gap:8px;align-items:center}
.pt-campo input{width:74px;height:42px;border-radius:11px;border:.7px solid var(--line);background:var(--field);
  text-align:center;font-size:17px;color:var(--ink);outline:0}
.pt-campo .resto{flex:1;height:42px;border-radius:11px;border:.7px solid var(--line);background:var(--field);
  display:flex;align-items:center;padding:0 12px;font-size:15px;color:var(--ink-2)}

/* Lei 1 também vale pro dedo: botão afunda ao ser tocado. */
.app button{transition:transform var(--mv-toque) var(--cv-sai)}
.app button:active{transform:scale(.965)}

/* ==========================================================================
   AVISO — a peça que o dono usa pra impressionar cliente. Ele não "aparece":
   ele CHEGA. Três entradas pra escolher; a barrinha embaixo drena o tempo de
   vida, então o aviso nunca some sem explicação.
   ========================================================================== */
.aviso{
  position:absolute;left:10px;right:10px;top:46px;z-index:55;
  display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;
  padding:10px 12px 13px;border-radius:14px;
  background:#0e1a2e;border:.7px solid #24375a;box-shadow:0 14px 34px rgba(0,0,0,.55);
}
.aviso .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:var(--blue-bg);color:var(--blue-l)}
.aviso.ok .ico{background:var(--lime-bg-2);color:var(--lime)}
.aviso.alerta .ico{background:var(--amber-bg);color:var(--amber)}
.aviso strong{display:block;font-size:13px;font-weight:500;line-height:1.25}
.aviso .sub{display:block;font-size:11px;color:var(--ink-2);line-height:1.3;margin-top:1px}
.aviso .barra{position:absolute;left:12px;right:12px;bottom:6px;height:2px;border-radius:2px;background:var(--barra-trilho);overflow:hidden}
.aviso .barra i{display:block;height:100%;background:var(--blue-l);transform-origin:left;animation:avDrena 3.4s linear both}
.aviso.ok .barra i{background:var(--lime)}
.aviso.alerta .barra i{background:var(--amber)}
@keyframes avDrena{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* A — DESCER COM MOLINHA: vem de cima da tela e assenta com ultrapassagem. */
[data-av="molinha"] .aviso{animation:avMola .54s cubic-bezier(.34,1.5,.5,1) both}
@keyframes avMola{from{opacity:0;transform:translateY(-130%) scale(.97)}to{opacity:1;transform:none}}

/* B — MESMA LÍNGUA DA TELA (eixo X): entra pelo lado, curva longa. Usar esta
   se a transição escolhida for a 5 — aviso e tela falando o mesmo idioma. */
[data-av="eixox"] .aviso{animation:avEixoX .46s cubic-bezier(.16,1,.3,1) both}
@keyframes avEixoX{from{opacity:0;transform:translateX(38px)}to{opacity:1;transform:none}}

/* C — SAIR DO SINO: o aviso NASCE no sino do topo e cresce até o lugar dele.
   É o efeito que mais impressiona em demonstração, porque explica de onde
   veio a notícia — a origem da escala é o canto onde o sino está. */
[data-av="sino"] .aviso{transform-origin:var(--origem,88% -8px);animation:avSino .52s cubic-bezier(.2,1.08,.3,1) both}
@keyframes avSino{from{opacity:0;transform:scale(.16)}55%{opacity:1}to{opacity:1;transform:none}}

/* O ícone dá um pulo depois do cartão assentar, e as duas linhas de texto
   entram atrás — o mesmo escalonado da tela, dentro de uma peça só. */
.aviso .ico{animation:avPop .46s cubic-bezier(.34,1.6,.5,1) .1s both}
@keyframes avPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.aviso strong{animation:trItem .34s cubic-bezier(.2,.85,.25,1) .14s both}
.aviso .sub{animation:trItem .34s cubic-bezier(.2,.85,.25,1) .2s both}
.aviso.sai{animation:avSaiu .26s cubic-bezier(.4,0,1,.6) both}
@keyframes avSaiu{to{opacity:0;transform:translateY(-10px) scale(.985)}}

/* O selo do sino pulsa junto — o aviso e a origem dele acendem no mesmo gesto. */
.cnt.pulsa{animation:avPulso .6s cubic-bezier(.34,1.6,.5,1) both}
@keyframes avPulso{from{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.28)}to{transform:none}}
.round.tocou::after{content:"";position:absolute;inset:-3px;border-radius:50%;
  border:1px solid var(--blue-l);animation:avAnel .7s ease-out both;pointer-events:none}
@keyframes avAnel{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.7)}}

/* Lei 7 — quem pediu menos movimento no sistema não recebe nenhum. Vale pras
   telas, pras folhas, pro aviso, pro erro e pro afundar do botão. */
@media (prefers-reduced-motion:reduce){
  .app *,.app *::before,.app *::after{animation:none!important;transition:none!important}
  /* 🔴 A TELA CHEIA ESCAPAVA DA LEI 7, e "sem exceção" não tem exceção. As
     regras do GPS são `!important` com TRÊS classes; o `*` acima tem UMA —
     entre duas `!important` quem decide é a especificidade, e o `*` perdia.
     Passava despercebido enquanto o gesto era um zoom; com o VÉU de tela
     inteira da cena de entrar na rota, quem pediu menos movimento receberia
     justamente o movimento maior do app. Aqui elas morrem, e o que sobra é o
     estado parado — que é a tela certa, porque todo `@keyframes` desta folha
     declara só o `from`. */
  .app .tela.entra.cheio,.app .tela.sai.cheio,.app .tela.cena.cheio,
  .app .tela.entra.cheio.voltando,.app .tela.sai.cheio.voltando{animation:none!important}
  /* (a dupla que segurava o mapa vivo enquanto a cobra corria saiu junto com a
     cobra — hoje o mapa de verdade já é quem aparece desde o primeiro quadro,
     em qualquer modo, e não há o que desfazer aqui.) */
}

/* barra de status */
.status{height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;font-size:12.5px;font-weight:500;letter-spacing:.2px;z-index:50}
.status .right{display:flex;align-items:center;gap:5px}
.bars{display:flex;align-items:flex-end;gap:1.6px;height:9px}
.bars i{width:2.4px;background:var(--white);border-radius:1px}
.bars i:nth-child(1){height:3.4px}.bars i:nth-child(2){height:5px}
.bars i:nth-child(3){height:7px}.bars i:nth-child(4){height:9px}
.batt{width:19px;height:9.5px;border:1.2px solid rgba(255,255,255,.85);border-radius:3px;position:relative}
.batt::before{content:"";position:absolute;inset:1.3px;background:var(--white);border-radius:1.2px}
.batt::after{content:"";position:absolute;right:-2.8px;top:2.8px;width:1.7px;height:3.8px;background:rgba(255,255,255,.6);border-radius:0 2px 2px 0}

/* ---------- cabeçalho ---------- */
/* 🔴 O HBX DO TOPO TEM MARGEM (dono, 10/08: *"ele está muito encostado em cima,
   bem pouquinho a margem, mas tem q ter"*). No aparelho a barra de status
   DESENHADA não existe (`.status{display:none}`, 5ª adaptação da injeção), então
   o cabeçalho encostava direto no vidro — os 7px de baixo já estavam aqui e o
   topo era zero. Mesmo respiro dos dois lados: o logotipo para de brigar com a
   barra do sistema sem empurrar a tela pra baixo. */
.hdr{padding:7px 13px;flex:0 0 auto;position:relative;z-index:40}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* flancos gêmeos: mesma largura mínima ⇒ o logo não anda entre telas */
.hdr-flanco{flex:0 0 76px;display:flex;justify-content:flex-start}
.hdr-flanco.dir{justify-content:flex-end}
.round{width:35px;height:35px;border-radius:50%;border:.7px solid var(--line);background:var(--chip-bg);
  display:grid;place-items:center;cursor:pointer;position:relative;color:var(--ink);flex:0 0 35px}
.round.sm{width:30px;height:30px;flex:0 0 30px}
.round .ping{position:absolute;top:0;right:0;width:7px;height:7px;border-radius:50%;background:var(--blue);border:1.5px solid var(--bg)}
/* O selo do sino é texto de 10px em cima de cor cheia: no azul da marca dava
   3,85:1. Escurecido só aqui (o azul do resto do app continua o mesmo). */
.round .cnt{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:#1a5fd0;color:var(--white);font-size:10px;font-weight:500;display:grid;place-items:center;border:1.5px solid var(--bg)}
.logo{display:flex;flex-direction:column;align-items:center;line-height:1}
.logo .w{font-size:25px;font-weight:600;letter-spacing:.4px;line-height:1}
.logo .w b{color:var(--white);font-weight:600}
.logo .w em{color:var(--lime);font-style:normal;font-weight:600;font-size:28px;display:inline-block;transform:skewX(-8deg)}
.logo small{font-size:8px;letter-spacing:4.6px;color:var(--logo-sub);margin-top:4px;padding-left:5px}
.pill-live{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;
  background:var(--chip-bg);border:.7px solid var(--line);font-size:12.5px}
.pill-live i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 7px var(--lime)}

/* ---------- corpo ---------- */
.body{flex:1;min-height:0;overflow:auto;padding:0 11px 62px;scrollbar-width:none;position:relative;z-index:20}
.body::-webkit-scrollbar{display:none}
.body.flush{padding:0 0 62px}

/* ---------- KPIs ---------- */
/* 🔴 NÚMERO E RÓTULO EMPILHAM. Sem `display:block` os dois viram uma linha só
   ("12paradas", "DinheiroR$ 132,00") — foi o defeito que o dono fotografou.
   `nowrap` no valor evita a outra metade do mesmo problema: "R$" numa linha e
   "132,00" na de baixo quando o cartão aperta. */
.kpis{display:flex;gap:7px;margin-top:2px;align-items:stretch}
/* O ícone é SVG inline: sem `display:flex` nele, o alinhamento vira o da
   base do texto e o desenho sobe. Por isso o "6 entregues" nascia torto. */
.kpi{flex:1;background:var(--card);border:.7px solid var(--line);border-radius:12px;padding:7px 9px;
  display:flex;align-items:center;gap:8px;min-width:0}
.kpi>span{display:flex;align-items:center;min-width:0}
.kpi>span:first-child{flex:0 0 auto;justify-content:center}
.kpi>span:last-child{flex-direction:column;align-items:flex-start;justify-content:center}
.kpi.money>span,.kpi.split>span{align-items:stretch}
.kpi>span:last-child{min-width:0}
.kpi .v{display:block;font-size:17px;font-weight:500;line-height:1.1;white-space:nowrap}
.kpi .l{display:block;font-size:10.5px;color:var(--ink-2);line-height:1.2;margin-top:1px}
.kpi.money{flex:1.15;flex-direction:column;align-items:stretch;gap:0;position:relative;justify-content:center;padding-right:18px}
.kpi.money .l{font-size:11.5px}
.kpi.money .v{font-size:16px;color:var(--lime);margin-top:1px}
.kpi.money .go{position:absolute;right:7px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.kpi.split{flex:1.3;flex-direction:column;align-items:stretch;gap:5px;padding:6px 9px}
.kpi.split .ln{display:flex;align-items:center;gap:7px}
.kpi.split .ln:first-child{border-bottom:.7px solid var(--line);padding-bottom:5px}
.kpi.split .ln>span:last-child{min-width:0}
.kpi.split .ln .t{display:block;font-size:11.5px;font-weight:500;line-height:1.15;white-space:nowrap}
.kpi.split .ln .m{display:block;font-size:10.5px;color:var(--ink-2);line-height:1.2;white-space:nowrap}

/* ---------- barra de seção ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;
  background:var(--card);border:.7px solid var(--line);border-radius:12px;padding:6px 10px}
.bar .t{display:flex;align-items:center;gap:8px;font-size:13.5px}
.ghost{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;
  border:.7px solid var(--line-2);background:transparent;color:var(--ink);font-size:11.5px;cursor:pointer}

/* ---------- linha de parada ---------- */
/* Nas fotos cada parada é um CARTÃO com borda própria — não uma linha separada
   por fio. Foi a diferença estrutural que mais saltava lado a lado. */
.stops{margin-top:3px;display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:10px 40px minmax(0,1fr) auto;gap:7px;align-items:center;
  padding:4px 7px;margin-bottom:2px;position:relative;
  background:var(--card);border:.7px solid var(--line);border-radius:11px}
.stop.on{background:#0f1c31;border-color:var(--blue-line)}
.stop.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2.5px;border-radius:0 2px 2px 0;background:var(--blue)}
/* 🔴 O "OLHA AQUI" DO ANALISAR (12/08) — o alvo do anexo do chat aceso na
   Montagem. É PULSO, não estado: `.on` diz "esta é a parada da vez" e vive
   enquanto o dia viver; isto diz "foi por aqui que você entrou" e apaga. Marca
   que fica sem ninguém apagar vira a próxima confirmação decorativa. */
.stop.destaque{border-color:var(--amber-line);animation:mvDestaque 1.6s ease-out 2 both}
@keyframes mvDestaque{0%{background:var(--amber-bg)}100%{background:var(--card)}}
/* O bloco do número+hora ganha o painel mais claro da foto. */
.numwrap{background:#101c2f;border-radius:9px;padding:4px 2px}
.grip{width:9px;height:14px;margin-top:9px;color:#3b4c6d;
  background-image:radial-gradient(currentColor 1.05px,transparent 1.15px);background-size:4.5px 4.5px}
.numwrap{display:flex;flex-direction:column;align-items:center;gap:3px}
/* O halo do anel existe na foto — é brilho, não vidro: nada atrás dele
   aparece através. Fica. */
.num{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:400;
  border:1.1px solid var(--blue);color:var(--white);background:#0b1626;box-shadow:0 0 9px rgba(47,126,247,.28)}
.num.lime{border-color:var(--lime);background:#131e0c;box-shadow:0 0 9px rgba(158,222,42,.25)}
.num.off{border-color:#31415e;background:transparent;color:var(--ink-2);box-shadow:none}
.hh{font-size:10px;color:var(--blue-l)}
.hh.lime{color:var(--lime)}
.hh.off{color:var(--ink-3)}
.who{min-width:0;overflow-wrap:anywhere}
.who strong{display:block;font-size:13.5px;font-weight:500;line-height:1.2;letter-spacing:-.008em}
.who span{display:block;font-size:11px;color:var(--ink-2);line-height:1.3}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tag{font-size:10px;padding:2px 6px;border-radius:6px;border:.7px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.blue{border-color:var(--blue-line);color:var(--blue-l);background:var(--blue-bg-2)}
.tag.lime{border-color:var(--lime-line);color:var(--lime);background:var(--lime-bg)}
/* 🔴 COR É INFORMAÇÃO, e faltavam dois tons. Ao vestir a Rota do app com este
   vocabulário (leva 1), "janela rígida" perdeu o VERMELHO e "horário" perdeu o
   ÂMBAR: a tela passou a dizer MENOS do que dizia. O motorista lia o risco pela
   cor antes de ler a palavra. Mesma receita dos dois de cima — borda, tinta e
   fundo do próprio tom. */
.tag.amber{border-color:var(--amber-line);color:var(--amber);background:#231805}
.tag.red{border-color:var(--red-line);color:var(--red);background:var(--red-bg-3)}
/* Observação do cliente NÃO é o endereço: "cachorro solto no pátio" tem que
   pesar mais que a rua. Era `.stop-obs` na pele velha e virou linha muda. */
.who span.nota{color:var(--amber);font-weight:500}
.side{display:flex;flex-direction:column;gap:5px;align-items:stretch;min-width:96px}
.marc{border:.7px solid var(--line-2);border-radius:8px;padding:4px 8px;background:var(--card)}
.marc small{display:block;font-size:10px;color:var(--ink-2)}
.marc b{display:block;font-size:13.5px;color:var(--lime);font-weight:500;margin-top:1px}
/* "Ult. Registro" — a MESMA caixa do dinheiro, só que o valor é uma DATA. O
   verde-limão desta casa quer dizer dinheiro; data em lima se leria como valor. */
.marc.reg b{color:var(--ink);font-size:13px}
.pill{display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 9px;border-radius:8px;
  font-size:11.5px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.pill.blue{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue-l)}
.pill.lime{background:var(--lime-bg-2);border-color:var(--lime-line);color:var(--lime)}
.pill.amber{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.pill.mute{background:var(--card);border-color:var(--line-2);color:var(--ink-2)}

/* ---------- rodapé de resumo ---------- */
.sum{display:flex;align-items:center;background:var(--card);border:.7px solid var(--line);
  border-radius:12px;padding:7px 4px;margin-top:6px}
.sum .c{flex:1;display:flex;align-items:center;gap:7px;justify-content:center;border-right:.7px solid var(--line)}
.sum .c:last-of-type{border-right:0}
.sum .c b{display:block;font-size:13.5px;font-weight:500}
.sum .c small{display:block;font-size:10.5px;color:var(--ink-2)}
.sum .go{padding:0 6px;color:var(--ink-2)}

/* ---------- ações ---------- */
.acts{display:flex;gap:7px;margin-top:6px}
.act{flex:1;display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:12px;cursor:pointer;
  border:.7px solid var(--line);background:var(--card);color:var(--ink);text-align:left}
.act b{display:block;font-size:13px;font-weight:500;line-height:1.15}
.act small{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
/* Botão principal: verde vivo com TINTA ESCURA — 8,6:1. O branco da foto media
   1,8:1 e sumia no sol do para-brisa; decisão do dono (06/08), o seletor morreu. */
.act.go{background:linear-gradient(180deg,var(--go-1),var(--go-2));border:0;color:var(--go-ink);box-shadow:0 7px 18px rgba(122,190,30,.26)}
.act.go b,.act.go small{color:var(--go-ink)}
.act.go b{font-weight:500}
.act.go small{opacity:.72}
/* Mesma régua pra toda peça verde cheia: transmux, confirmação, portão, recado. */
.tmx-main button,.conf .acoes .principal,.portao .acoes .principal,
.recado .acoes .principal,.erro .acoes .principal{color:var(--go-ink)}
.erro .acoes .principal{color:var(--white)}
.enviar{color:var(--go-ink)}
/* 🔴 O BOTÃO DE PERIGO ERA HEX INLINE, EM 4 TELAS. Estilo inline não tem como
   ser trocado pelo modo claro — ele ganha de qualquer seletor — então a borda
   vermelho-escura do tema escuro atravessava a virada e ficava quase preta no
   cartão branco. Mesma cura que o dono já deu à cor do produto: vira CLASSE.
   Perigo é papel, não decoração; e papel se declara. */
.act.perigo{color:var(--red);border-color:var(--red-line)}
.act.wide{flex:1.15}
.act.full{width:100%}
.act .chev{margin-left:auto;opacity:.65}

/* ---------- navegação — 6 abas (decisão do dono) ----------
   Chat e Ajustes voltaram pra barra: o Chat é o canal do escritório com o
   motorista e não podia morar em menu escondido. Com 6 colunas o rótulo cai
   pra 9px e o ícone pra 18 — o alvo de toque continua com ~68px de largura.

   🔴 A COLUNA NASCE DO BOTÃO, NÃO DO NÚMERO 6. O admin desliga módulo pelo
   desktop (item 9, 07/08) e a barra pode vir com 5, 4, 3 botões. Com
   `repeat(6,1fr)` cravado o que sobrava era um BURACO no fim da barra — os
   botões presos nas primeiras colunas e o resto vazio. `grid-auto-columns:1fr`
   dá o mesmo resultado exato com 6 (medido: 62/62 pixel a pixel) e continua
   dividindo a largura por igual com qualquer quantidade. */
.nav{position:absolute;left:0;right:0;bottom:0;height:60px;display:grid;
  grid-auto-flow:column;grid-auto-columns:1fr;
  align-items:center;padding:0 3px 8px;z-index:45;
  background:var(--bg);border-top:.7px solid var(--line)}
.nav button{border:0;background:transparent;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:6px 0 4px;font-size:9px;cursor:pointer;border-radius:10px;position:relative;margin-top:8px}
.nav button.on{color:var(--lime);background:#182642}
.nav button.on .ping{position:absolute;top:3px;right:16%;width:5px;height:5px;border-radius:50%;background:var(--blue)}

/* ==========================================================================
   TRANSMUX — o controle da rota. UM botão grande no meio (o que se faz AGORA)
   e no máximo dois satélites. O rótulo mora embaixo do botão, sempre: ícone
   sozinho em botão que muda de função é adivinhação.
   ========================================================================== */
/* 🔴 O CONTROLE DA ROTA NÃO ROLA. Medido: com o transmux no fim da lista ele
   nascia 142 a 310px abaixo da dobra — o motorista teria que rolar pra pausar
   a rota. Ele vive num rodapé fixo, logo acima das abas, e a lista corre por
   baixo. Quem rola é conteúdo; controle de operação em andamento, nunca. */
.tmx-dock{position:absolute;left:0;right:0;bottom:60px;z-index:30;padding:7px 11px 9px;
  background:var(--bg);border-top:.7px solid var(--line)}
/* MEDIDO no navegador com a barra nova (não calculado): 79 de rodapé com os
   satélites (46 do botão + 4 + 11 da legenda + 16 de padding + a linha) e 73
   sem eles; com as abas (60), 139. 147 dá o respiro de 8px pro último cartão
   não encostar no vidro do controle. (Era 188, com a torre de 82px — a lista
   ganhou 41px de altura no mesmo commit.) */
.body.com-dock{padding-bottom:147px}
/* Rodapé de UMA fila (o da Montagem): 48 do botão + 17 do respiro = 65, mais
   as abas (60) e 7 pro último cartão não encostar no vidro do controle. */
.body.com-dock-1{padding-bottom:132px}
/* 🔴 RODAPÉ NÃO MUDA DE ALTURA. A linha de baixo do botão ("Iniciar rota /
   Cliente 1") existe em uns estados e não em outros — sem piso, a barra
   encolhia 11px no meio do trabalho e a lista inteira dava um pulo. Altura de
   controle é do CONTROLE, não do texto que calhou de caber nele. */
.pe-montagem .act{min-height:48px}
/* ==========================================================================
   🔴 UMA AÇÃO SÓ NÃO É UMA TORRE — é uma BARRA (dono, 09/08, sobre o mapa do
   dia vazio: *"o botão montar rota está feio baiano"*).

   O transmux nasceu instrumento de TRÊS colunas (`1fr auto 1fr`): Cancelar à
   esquerda, o botão grande no meio, Montagem/Finalizar à direita. Equilibrado
   com três. Só que o dia por montar tem UM verbo — e aí as duas laterais eram
   `<span></span>` vazios e sobrava um quadrado de 82px sozinho, centrado numa
   faixa branca opaca de 120px, com a palavra em 12px por baixo dele. Era isso
   que o dono estava olhando: 120px de tela gastos pra dizer uma palavra.

   A régua nova é a que todo app de entrega usa (Circuit, Onfleet, Waze): o
   verbo principal é uma BARRA LARGA com a palavra DENTRO, e o que é secundário
   fica em botões pequenos ao lado. O que se ganha, medido:
   · a palavra sai de 12px de legenda para 16px dentro do botão;
   · o alvo do dedo vai de 82×82 (6.724 px²) para 100%×56 (~21.000 px²);
   · o rodapé cai de 120px para 78px — 42px de MAPA de volta, que é o produto;
   · e com uma ação só a barra ocupa a largura inteira, sem buraco nenhum.
   A lei do tutorial continua de pé ("o botão grande é sempre o próximo passo"),
   e a âncora dele (`.tmx-main`) continua sendo esta peça — só mudou de forma.
   ========================================================================== */
/* FLEX e não grid de 3 colunas: com grid, o estado de UMA ação continuava
   pagando as duas colunas vazias (`<span></span>` × 2 = 18px de gap sobrando
   nas pontas). No flex, satélite que não existe não é escrito, e a barra
   ocupa a largura inteira sem sobra — que é o ponto todo desta mudança. */
/* 🔴 OS SEIS BOTÕES SÃO A MESMA PEÇA (16/08, ordem do dono: "quero os botões
   idênticos foto 1 e 2"). `flex-start` e não `center`: os três quadrados pousam
   na MESMA linha de topo, e é isso que faz a fileira parecer uma peça só. Com
   `center`, rótulo de tamanho diferente empurrava o quadrado do meio pra cima
   ou pra baixo dos vizinhos — o desencontro que o dono viu nas duas fotos. */
.transmux{display:flex;align-items:flex-start;gap:9px}
.tmx-sat{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px}
.tmx-sat button{width:46px;height:46px;border-radius:16px;border:.7px solid var(--line);background:var(--card);
  color:var(--ink);display:grid;place-items:center;cursor:pointer;position:relative}
.tmx-sat.tmx-perigo button{color:var(--red);border-color:var(--red-line)}
.tmx-sat.tmx-info button{color:var(--blue-l);border-color:#26436e}
.tmx-sat small{font-size:9.5px;color:var(--ink-2)}
.tmx-sat.tmx-aviso button{color:var(--amber);border-color:var(--amber-line);animation:tmxPisca 1.15s ease-in-out infinite}
@keyframes tmxPisca{50%{opacity:.35}}
.tmx-sat .cont{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--amber);
  color:#1a1204;font-size:10px;font-weight:500;display:grid;place-items:center;border:1.5px solid var(--bg)}
/* 🔴 A PALAVRA SAIU DO BOTÃO E VIROU LEGENDA (16/08, ordem do dono: "faça
   ícones, com um rótulo bem pequeno"). O main deixa de ser uma barra com texto
   de 16px e passa a ser a MESMA peça do satélite: quadro com ícone + `<small>`
   de 9,5px por fora. Ele só continua diferente no que precisa ser — largura
   (`flex:1`) e a cor de ação —, e é isso que faz os três lerem como um trio.
   Altura 56 → 46 pelo mesmo motivo: com o rótulo fora, os três quadros têm que
   ter o mesmo tamanho, senão a fileira volta a ser um botão e dois enfeites.
   ⚠️ A ALTURA DO DOCK NÃO MUDOU: era `max(56, 46+4+11)` = 61 e continua 61
   (46+4+11), então `--tmx-h`, `.body.com-dock` (147px) e o `--map-chao` do 2D
   seguem valendo — MEDIDO, não deduzido. Quem mexer nestes 46 refaz aquela
   conta, que é o chão de toda peça flutuante das duas telas. */
.tmx-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.tmx-main button{width:100%;height:46px;border-radius:18px;border:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--white);background:linear-gradient(180deg,var(--go-1),var(--go-2));box-shadow:0 8px 22px rgba(122,190,30,.28)}
/* Mesma régua do `.tmx-sat small`: nome que não cabe vira "…" e NUNCA quebra em
   duas linhas — altura de rodapé que depende do dado é o defeito de 10/08. */
.tmx-main small{max-width:100%;font-size:9.5px;color:var(--ink-2);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tmx-main button[data-estado="pausar"]{background:linear-gradient(180deg,#ffca63,#e08a00);color:#241500;
  box-shadow:0 8px 22px rgba(224,138,0,.3)}
.tmx-main button[data-estado="montar"]{background:linear-gradient(180deg,#4a95ff,var(--btn-blue-2));
  box-shadow:0 8px 22px rgba(47,126,247,.32)}
/* 🔴 ESTADO PERMANENTE NÃO É TRABALHO EM CURSO (16/08, medido no g15 no APK
   280). O `main` sem `acao` vestia SEMPRE o traje do "Montando…": verde de
   ação, `.ocupado` respirando e `aria-busy="true"`. Serve pro que vai acabar
   em 2 s; não serve pro "Somente consulta", que é o estado da tela pra
   SEMPRE — ali virava um botão verde pulsando eternamente, que não aceita
   dedo e mente pro leitor de tela. Pior: contradiz a aula da própria casa
   (`.tmx-main` = "o botão grande é sempre o próximo passo do dia"), porque
   consultar não é passo nenhum. A nota ocupa a MESMA vaga e a MESMA altura
   (o rodapé não pula), com a superfície neutra que o resto da casa já usa. */
.tmx-nota{width:100%;height:46px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  background:var(--card);border:.7px solid var(--line);color:var(--ink-2)}
/* TRABALHANDO: o botão continua no lugar, com o mesmo tamanho, respirando.
   Some com a sombra viva porque nada vai acontecer se o dedo insistir. */
.ocupado{opacity:.62;box-shadow:none!important;animation:respira 1.15s ease-in-out infinite}
@keyframes respira{50%{opacity:.34}}
/* O AGUARDE DO TOQUE (12/08 — dono: toca em "Montar rota" e NADA acontece por
   segundos; gente fica tocando de novo). É o quadro entre o dedo e o primeiro
   repinte ("Montando…"): a PONTE põe esta classe no botão vivo NO MESMO quadro
   do toque, antes de qualquer ida à rede. A cara é a MESMA do `.ocupado` de
   cima (padronizar = igualar) + pointer-events, porque o nó que já respondeu
   não aceita segundo dedo. Lei 7 tira a respiração; a opacidade fica, e é ela
   o recibo de quem pediu menos movimento. */
.aguarde{opacity:.62;box-shadow:none!important;pointer-events:none;animation:respira 1.15s ease-in-out infinite}

/* 🔴 O VÉU DE MONTAR (11/08 — dono: "demora muito, coloque um carregando aí,
   altíssima qualidade"). Montar são 3 idas ao servidor e passa de 2 s; o
   recibo do toque continua no BOTÃO ("Montando…", lei de 08/08) — o véu é o
   TEATRO da espera por cima da lista, com a ETAPA REAL do trabalho escrita
   nele (quem escreve é a ponte, direto no nó — regra do `data-vivo`).
   Ele mora como IRMÃO do `.body` (dentro dele rolaria junto com a lista), em
   z 25: acima do conteúdo (20), abaixo do dock (30), do cabeçalho (40), das
   abas (45) e de todo diálogo (59) — o "Montando…" respira à vista e o portão
   de erro abre por cima.
   🔴 SÓ ANIMAÇÃO DE LOOP AQUI DENTRO. O seam repinta no meio do montar e,
   passada a janela de entrada, todo keyframe recomeça do zero a cada repinte
   — one-shot de entrada viraria soluço; loop com from==to recomeça invisível.
   O escurecedor é o MESMO tom do portão (rgba escura nos dois modos, como
   `.portao-wrap` e `.scrim`); o desfoque segue o padrão do `.aula-veu`, com o
   mesmo fallback de aparelho sem `backdrop-filter`. */
.veu-montar{position:absolute;inset:0;z-index:25;display:grid;place-items:center;
  background:rgba(3,7,14,.62)}
@supports (backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px)){
  .veu-montar{-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);background:rgba(3,7,14,.45)}}
.veu-montar .vm{display:flex;flex-direction:column;align-items:center;gap:11px;
  padding:22px 26px;border-radius:18px;background:var(--card);border:.7px solid var(--line);
  box-shadow:0 18px 44px rgba(0,0,0,.5);min-width:216px}
/* o glifo da rota no mesmo par de tinta do "chegou" da manobra (lima sobre
   lima-fundo, aprovado nos 2 modos); o anel respira em OPACIDADE, não em
   tamanho de verdade — lei do `alvoBusca`: pulso de opacidade, escala mínima */
.veu-montar .vm-glifo{position:relative;width:62px;height:62px;border-radius:50%;
  display:grid;place-items:center;color:var(--lime);background:var(--lime-bg-2)}
.veu-montar .vm-glifo::after{content:"";position:absolute;inset:-7px;border-radius:50%;
  border:1.5px solid var(--lime);animation:vmAnel 1.6s ease-in-out infinite}
@keyframes vmAnel{0%,100%{opacity:.14;transform:scale(.94)}50%{opacity:.6;transform:scale(1.04)}}
.veu-montar .vm b{font-size:13.5px;font-weight:500;text-align:center}
.veu-montar .vm small{font-size:11px;color:var(--ink-2);margin-top:-7px}
.veu-montar .vm-barra{width:168px;height:4px;border-radius:99px;background:var(--trilho);overflow:hidden}
.veu-montar .vm-barra i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--prog-1),var(--prog-2));transition:width .5s ease}

/* ---------- progresso do dia ---------- */
.dia-bar{display:flex;align-items:center;gap:9px;margin-top:7px;padding:8px 11px;border-radius:12px;
  background:var(--card);border:.7px solid var(--line)}
.dia-bar .trilho{flex:1;height:6px;border-radius:4px;background:var(--trilho);overflow:hidden}
.dia-bar .trilho i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--prog-1),var(--prog-2))}
.dia-bar small{font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.dia-bar b{font-size:12.5px;white-space:nowrap}

/* ---------- filtro Fila / Entregue ---------- */
.filtro{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}
.filtro button{height:34px;border-radius:11px;border:.7px solid var(--line);background:var(--card);
  color:var(--ink-2);font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.filtro button b{color:var(--ink);font-weight:500}
.filtro button.on{border-color:var(--lime-line);background:var(--lime-bg);color:var(--lime)}
.filtro button.on b{color:var(--lime)}

/* ---------- conector de perna ---------- */
.perna{display:flex;justify-content:center;margin:-1px 0 1px}
/* 🔴 A SETA É DESENHO, NÃO LETRA (dono, 09/08: "uma seta bem bonita"). Era o
   caractere "↓", e caractere depende da FONTE do aparelho: no g15 ele saía
   fino, alto demais e desalinhado do texto ao lado. Virou `ic('seta')` — o
   mesmo cofre de ícones do resto da casa, mesma espessura de traço. O `span`
   passa a ser inline-flex porque agora ele tem DOIS filhos (o svg e o texto) e
   `padding` sozinho não centraliza um SVG contra uma linha de 10px. */
.perna span{display:inline-flex;align-items:center;gap:4px;
  font-size:10px;color:var(--ink-3);background:var(--bg);padding:2px 9px;border-radius:999px;
  border:.7px solid var(--line)}
.perna span svg{flex:0 0 auto;opacity:.85}
/* 🔴 "SEM TRAJETO" NÃO É UMA DISTÂNCIA A MENOS, É UM PINO FALTANDO. O trecho
   normal diz quanto falta; este diz que o app NÃO SABE onde fica o endereço —
   e sem tom próprio ele saía com a mesma cara de "850 m · 4 min", que é
   exatamente a leitura errada. */
.perna.alerta span{color:var(--red);border-color:var(--red-line);background:var(--red-bg-3)}

/* ---------- painel de créditos do dia ---------- */
.creditos{display:flex;align-items:center;gap:9px;margin-top:7px;padding:8px 11px;border-radius:12px;
  background:var(--card);border:.7px solid var(--line)}
.creditos .v{font-size:14px;font-weight:500}
.creditos small{font-size:10.5px;color:var(--ink-2)}
.creditos .debita{margin-left:auto;font-size:10.5px;color:var(--amber);text-align:right}

/* ---------- a semana da agenda (dono, 09/08) ----------
   "separe o q foi agendado, os dias q foram agendados e quantidades". Quem
   entrega toda semana não tem UM dia, tem uma SEMANA — e a única tela que
   falava disso eram os chips da Montagem, que só dizem QUAIS dias existem, sem
   dizer quantos clientes tem cada um.

   🔴 LINHA POR DIA, NÃO CHIP. Chip cabe "Seg"; ele não cabe "Seg · 53
   clientes", que é a informação pedida. Sete linhas curtas se leem de uma
   olhada e cada uma carrega o seu número — é a mesma lei do `.grupo`: separar
   é escrever o nome e a conta ao lado.
   O dia de HOJE fica marcado (`.hoje`) porque a tela toda fala de hoje: sem
   isso a semana vira um calendário solto, sem âncora no dia que está aberto. */
.semana{background:var(--card);border:.7px solid var(--line);border-radius:13px;padding:0 11px;margin-top:6px}
.semana .d{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:.6px solid var(--line)}
.semana .d:last-child{border-bottom:0}
.semana .nm{font-size:13px;font-weight:400;color:var(--ink)}
.semana .hoje .nm{color:var(--lime);font-weight:500}
.semana .qt{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--ink)}
.semana .qt small{font-size:10.5px;font-weight:400;color:var(--ink-2);margin-left:4px}
/* Dia sem ninguém não vira linha apagada e sim linha HONESTA: o número é 0 e o
   tom cai pro secundário. Sumir com o dia esconderia a pergunta "e na terça?". */
.semana .vazio-dia .nm,.semana .vazio-dia .qt{color:var(--ink-3)}

/* ---------- banner de estado (sem sinal, pausada, bloqueio) ---------- */
.banner{display:flex;align-items:center;gap:9px;margin-top:7px;padding:9px 11px;border-radius:12px;font-size:12px}
.banner.alerta{background:var(--amber-bg);border:.7px solid var(--amber-line);color:var(--amber)}
.banner.pausa{background:var(--blue-bg);border:.7px solid var(--blue-line);color:var(--blue-l)}
.banner b{color:var(--ink);font-weight:500}
.banner button{margin-left:auto;height:30px;padding:0 11px;border-radius:9px;border:.7px solid currentColor;
  background:transparent;color:inherit;font-size:11.5px;cursor:pointer;white-space:nowrap}

/* ---------- vazio e carregando ---------- */
.vazio{text-align:center;padding:34px 18px}
.vazio .ico{width:52px;height:52px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
  background:var(--card);border:.7px solid var(--line);color:var(--ink-3)}
.vazio strong{display:block;font-size:15px;font-weight:500}
.vazio span{display:block;font-size:12px;color:var(--ink-2);margin-top:4px}
.vazio .ghost{margin-top:14px}
.esq{background:linear-gradient(90deg,var(--esq-1) 25%,var(--esq-2) 50%,var(--esq-1) 75%);background-size:280% 100%;
  border-radius:11px;animation:esqOnda 1.5s linear infinite}
@keyframes esqOnda{to{background-position:-280% 0}}
.esq-linha{height:62px;margin-bottom:6px}

/* ---------- mapa ---------- */
/* 🔴 `.mapwrap` MORREU JUNTO COM A MAQUETE (09/08) — era a caixa do SVG de
   espera do mapa 2D, com `z-index:10` por cima do mapa de verdade. Ver `mapa()`
   lá embaixo: o palco de espera agora é COR, não desenho. */
.map-float{position:absolute;left:12px;z-index:30}
.map-chip{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:12px;
  background:var(--glass);border:.7px solid var(--line)}
.map-chip .d{display:flex;align-items:center;gap:7px}
.map-chip small{display:block;font-size:10.5px;color:var(--ink-2)}
.map-chip b{display:block;font-size:12.5px;font-weight:500}
.map-chip .vr{width:1px;height:20px;background:var(--line)}
.map-ctrl{position:absolute;right:12px;display:flex;flex-direction:column;gap:8px;z-index:30}
.map-ctrl button{width:40px;height:40px;border-radius:50%;border:.7px solid var(--line);background:var(--glass);
  color:var(--blue-l);display:grid;place-items:center;cursor:pointer}
.next-card{position:absolute;left:9px;right:9px;bottom:72px;z-index:35;border-radius:15px;padding:11px 12px;
  background:var(--card);border:.7px solid var(--line);display:flex;align-items:center;gap:10px}
.next-card .handle{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:36px;height:3px;border-radius:2px;background:var(--handle)}
.next-card .info{flex:1;min-width:0;padding-top:3px}
.next-card .lb{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--lime);margin-bottom:2px}
.next-card .lb .n{width:19px;height:19px;border-radius:50%;border:.9px solid var(--lime);display:grid;place-items:center;font-size:10px}
.next-card strong{display:block;font-size:15px;font-weight:500;line-height:1.2}
.next-card span{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
.next-card .eta{padding:0 9px;border-left:.7px solid var(--line)}
.next-card .eta small{display:block;font-size:10px;color:var(--blue-l)}
.next-card .eta b{display:block;font-size:17px;font-weight:500;line-height:1.2}
.next-card .eta i{display:block;font-size:10.5px;color:var(--ink-2);font-style:normal}
.btn-blue{display:flex;align-items:center;gap:7px;padding:11px 15px;border-radius:12px;border:0;cursor:pointer;
  background:linear-gradient(180deg,var(--btn-blue-1),var(--btn-blue-2));color:var(--white);font-size:13px;font-weight:500;
  box-shadow:0 7px 18px rgba(47,126,247,.3)}

/* ==========================================================================
   O PLANO — A TELA PRINCIPAL DA ROTA É O MAPA, EM 2D (ordem do dono, 08/08:
   *"a tela principal do rota, mapa limpo, 2d"*).

   Até aqui a aba Rota abria uma PILHA DE PAINÉIS (3 kpis, saldo, dinheiro/pix,
   barra do dia, filtro Fila/Entregue, créditos, a lista e a soma) e o mapa era
   um botão chamado "Ver mapa" — quer dizer: o app de entrega mostrava o dia em
   números e escondia o dia no espaço. Invertido: o mapa É a tela, a lista está
   a UM toque na barra de cima (`T.rotalista`, com tudo o que saiu daqui).

   🔴 "LIMPO" É LITERAL, E É UMA CONTA: por cima do mapa ficam TRÊS peças e
   nenhuma a mais — a barra de cima (o fato do dia + a porta da lista), o botão
   de enquadrar, e o transmux, que é o rodapé fixo de sempre. Toda peça nova
   aqui tem que tirar outra: painel em cima de mapa é painel escondendo mapa.

   🔴 2D É O QUE ESTA TELA TEM DE SER. O 3D inclinado é pra DIRIGIR (a rua
   fugindo pro horizonte, ver o comentário do GPS lá embaixo); de cima, com
   norte pra cima, é o que serve pra PLANEJAR — ver a ordem das paradas, o que
   ficou pra trás e onde o dia aperta. Por isso o palco aqui é o "geral"
   (`data-mapa="geral"`: pitch 0, sem câmera automática brigando com o dedo) e
   nunca o "gps".
   ========================================================================== */
/* 🔴 O MAPA PARA ONDE O CONTROLE COMEÇA — ele NÃO passa por baixo do dock.
   Medido: com `inset:0` o transmux (120) + as abas (60) tapavam os 180px de
   baixo do mapa, e as duas últimas paradas do dia ficavam atrás do botão
   grande. Pino tapado é pino que não existe, e a tela existe pra mostrar o dia
   INTEIRO. Os dois números são os mesmos do `.body.com-dock` (que já mede este
   mesmo rodapé) — e sem dock na tela sobra só a barra de abas. */
/* ==========================================================================
   🔴 A RÉGUA DO CROMO DO MAPA — UMA SÓ PARA O 2D E PARA O 3D (16/08 — dono,
   com a tela do "Iniciar" na mão: *"combinamos de ter o status 2d e 3d nas
   navegações… centralize os botões, crie um padrão do 2d e um padrão do 3d"*).

   O que estava na tela, MEDIDO no palco antes de encostar em nada:
     mapa 2D   1 botão de 44px, `border-radius:50%` (círculo), a 12px da beirada
     dirigir   3 botões de 52px `scale:.9` = 46,8px reais, raio 17px, a 11px
     dock      satélites de 46px, raio 16px, a 11px — na MESMA tela do 2D
   Quer dizer: o MESMO verbo (recentralizar) tinha duas peles a um toque de
   distância, e nenhuma das duas falava a língua do rodapé que fica 14px abaixo
   dela. O círculo é forasteiro: o vocabulário deste app inteiro é quadrado de
   canto mole. E `scale:.9` é a armadilha de sempre — o número escrito no CSS
   (52) não era o número na tela (46,8), então ninguém conseguia comparar os
   dois modos lendo a folha.

   A régua nova, e ela é uma CONTA, não um gosto:
     `--map-btn` 46 e `--map-raio` 16 — os do satélite do dock. Padronizar é
        IGUALAR com quem já está na tela, não inventar um terceiro tamanho.
     `--map-beira` 11px = o padding lateral do `.tmx-dock`. Com 46 de largura,
        o CENTRO do botão cai a 34px da direita — o mesmo centro do satélite
        "Montagem", que fica logo abaixo. É ISTO o "centralizar": os dois modos
        e o rodapé passam a ter UM eixo vertical de cada lado, em vez de três
        margens parecidas que nunca alinham.
     `--map-chao` + `--map-respiro` = o piso. A única diferença entre os modos é
        o que está embaixo: no 2D o `.plano` já para acima do dock (chão 0), no
        3D o chão é o rodapé de dirigir. Mesma fórmula, dois valores.
   Peça flutuante de mapa que não pousar nesta régua é peça fora do padrão. */
.plano,.gps{--map-beira:11px;--map-respiro:12px;--map-btn:46px;--map-raio:16px;
  /* 🔴 O DISCO ENCOLHEU 15% (16/08 — dono: *"diminuir 15% o tamanho do
     velocímetro"*). 108×113 → 92×96, e TODO o miolo desceu na mesma proporção
     (número 40→34, unidade 13→11, trilho e placa juntos): encolher só a caixa
     deixaria o número batendo na borda, que é o mesmo defeito de 11/08 pelo
     avesso. Ele é token porque o aviso de radar pousa em cima dele e pergunta
     a altura — a peça encolhe e o chip acompanha sem ninguém refazer conta. */
  --map-gap:10px;--map-vel-l:92px;--map-vel-h:96px;--map-chao:0px;
  /* 🔴 A ALTURA DO RODAPÉ SUBIU PRA RÉGUA COMPARTILHADA (17/08). Ela morava só no
     `.gps` porque só a tela de dirigir tinha o painel flutuante; agora o 2D com
     rota montada tem o MESMO painel (§ `rodapeDoMapa`), então o número tem que
     ser o mesmo nos dois — e número igual em dois lugares é número que discorda
     no primeiro conserto. A conta continua a de 16/08, MEDIDA pelo
     `prova-encaixe-gps` na pele: 132,6px → guarda 133 (arredondar pra cima só
     custa folga; pra baixo põe a peça dentro do rodapé). */
  --gps-rodape-h:133px;
  --map-piso:calc(var(--map-chao) + var(--map-respiro))}
/* O 2D com rota montada pousa no MESMO chão do 3D: o painel flutuante. Sem rota
   o chão é zero e quem reserva espaço é o `.plano.com-dock` de sempre. */
.plano.com-rodape{--map-chao:var(--gps-rodape-h)}
.plano{position:absolute;left:0;right:0;top:0;bottom:60px;overflow:hidden;background:var(--fog)}
.plano.com-dock{bottom:139px}
/* 🔴 TELA CHEIA: os 60px que o `.plano` reservava eram da BARRA DE ABAS, e com
   o dia montado ela não existe (§ `T.rota`). Sem esta linha o mapa pararia
   acima de um rodapé que ninguém desenhou — uma faixa preta no pé da tela.
   O dock continua descontado: ele fica, a barra é que sai. */
.plano.cheio{bottom:0}
.plano.cheio.com-dock{bottom:79px}
/* A barra FLUTUA em vez de empurrar: mapa que começa abaixo de uma faixa opaca
   é mapa com menos mapa. Ela é vidro, e o dia continua aparecendo por baixo. */
.plano-bar{position:absolute;left:9px;right:9px;top:9px;z-index:30;display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:13px;background:var(--glass);border:.7px solid var(--line)}
/* ==========================================================================
   🔴 O TOPO DO 2D É UMA PEÇA (17/08 — item 4 do dono: *"efeito recolher foto 4,
   e entrando a foto 5 de cima, e vice versa"*).

   A foto 5 são duas coisas: o GUIA (cabeçalho com a lâmpada e o "+") e a BARRA
   DO DIA. Enquanto eram dois nós absolutos, cada um com seu `top`, animar "o
   topo entrando" seria animar dois relógios em paralelo — e dois relógios que
   deviam ser um é exatamente o desencontro que o olho lê como pisca. Aqui eles
   viram UM invólucro: o que se move é ele.
   As duas peças de dentro perdem o `position:absolute` e voltam pro fluxo (a
   margem de 9px é a mesma que os `left/right/top` davam, MEDIDA e não deduzida),
   e o invólucro fica com o `z-index` que era da barra.
   Os cartões de continuidade entram na mesma peça: eles ficavam cravados em
   `top:68px` — número que era a altura da barra — e com o guia flutuando por
   cima virariam sanduíche. No fluxo, eles simplesmente vêm depois.
   ========================================================================== */
.plano-topo{position:absolute;left:0;right:0;top:0;z-index:30}
.plano-topo .plano-bar,.plano-topo .rota-continuidades{position:static;margin:9px}
.plano-topo .rota-continuidades{margin-top:6px}
/* O GUIA FLUTUANTE. Ele não pode ser um retângulo opaco (isso é a faixa que a
   barra abaixo dele existe pra não ser); é um degradê que só escurece o topo o
   suficiente pro logotipo e os dois botões terem chão. A tinta é o `--fog`, o
   MESMO chão do mapa — nenhuma cor nova nasce aqui (Lei 1). */
.hdr.flutua{padding:8px 13px 2px;background:linear-gradient(180deg,var(--fog) 12%,transparent)}
/* Sem tela cheia o 3D volta a ter abas, e a tela dele para acima delas — como o
   `.plano` sempre fez. Sem esta linha o mapa corria por baixo da barra de abas
   e o rodapé flutuante ficava atrás dela. */
.gps.com-abas{bottom:60px}
.plano-bar .f{flex:1;min-width:0;display:flex;align-items:center;gap:7px;color:var(--lime)}
/* A barra vira BOTÃO quando o fato tem porta (hoje: a localização desligada —
   ver `T.rota`). Mesmo desenho, mesma linha, mesmo lugar: o que muda é aceitar
   dedo. Barra que informa e barra que resolve não podem ter caras diferentes,
   senão o motorista aprende a não tocar em nenhuma das duas. */
.plano-bar button.f{background:none;border:0;padding:0;font:inherit;text-align:left;cursor:pointer}
/* Dia num estado troca o TOM da barra, nas MESMAS famílias dos banners que ela
   substituiu aqui (`.banner.pausa` é azul, `.banner.alerta` é âmbar) — cor nova
   pro mesmo fato seria a terceira língua pra dizer "parado". */
.plano-bar.pausa .f{color:var(--blue-l)}
.plano-bar.pausa{border-color:var(--blue-line)}
.plano-bar.alerta .f{color:var(--amber)}
.plano-bar.alerta{border-color:var(--amber-line)}
/* O fato do dia numa linha só, e ele TEM que caber: nome grande de empresa e
   contagem alta já cortaram tela neste app. Quem encolhe é o texto, não a
   barra — barra que cresce empurra o botão da lista pra fora. */
.plano-bar .f span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  font-size:12.5px;color:var(--ink)}
.plano-bar .f b{font-weight:500}
.plano-bar .f small{color:var(--ink-2);font-size:12.5px}
.plano-bar .ghost{flex:0 0 auto}
/* 🔴 O DIA POR MONTAR — a barra cresce pra caber a segunda linha, e só nesse
   estado. Barra de duas linhas é o desenho dizendo "aqui não tem nada rolando";
   nos outros estados ela volta a ser a faixa fina de um fato só, que é o que uma
   tela de mapa aguenta sem virar folha de texto. O `align-items` sai do centro:
   com duas linhas, o ícone tem que casar com a PRIMEIRA, não com o meio do
   bloco. */
.plano-bar.estado{align-items:flex-start;padding:10px 12px}
.plano-bar.estado .f{align-items:flex-start}
.plano-bar.estado .f>svg{margin-top:1px}
/* Vence o `.plano-bar .f span` (nowrap + ellipsis) por especificidade: aqui o
   texto é uma COLUNA, e a dica pode quebrar em duas linhas num aparelho
   estreito em vez de sumir com reticências no meio da frase. */
.plano-bar .f .txt{display:flex;flex-direction:column;gap:2px;overflow:visible;white-space:normal}
.plano-bar .f .txt em{font-style:normal;font-size:11.5px;line-height:1.32;color:var(--ink-2)}
.rota-continuidades{position:absolute;left:9px;right:9px;top:68px;z-index:31;display:grid;gap:6px}
.rota-continuidade{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 10px;border:.7px solid var(--amber-line);border-radius:12px;background:var(--glass);
  box-shadow:0 4px 14px rgba(0,0,0,.24)}
.rota-continuidade.ativa{border-color:var(--lime-line)}
.rota-continuidade>span:first-child{min-width:0;display:grid;grid-template-columns:auto 1fr;column-gap:7px;align-items:center}
.rota-continuidade>span:first-child svg{grid-row:1/3;color:var(--amber)}
.rota-continuidade b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rota-continuidade small{font-size:10.5px;color:var(--ink-2)}
.rota-continuidade .acoes{display:flex;gap:5px;flex:0 0 auto}
.rota-continuidade .acoes button{min-height:34px;padding:6px 9px}
.rota-continuidade .acoes .perigo{color:var(--red)}
.rota-continuidade-mais{justify-self:start;padding:5px 9px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);font-size:10.5px;color:var(--ink-2)}
/* 🔴 UM BOTÃO SÓ NA BEIRADA, e ele tem trabalho: devolver o enquadramento da
   rota depois de o dedo levar o mapa embora. Zoom não entra — pinça é o gesto
   nativo do mapa, e dois botões redondos por cima do dia seriam cromo.

   🔴 ELE DESCEU (09/08). Morava a 66px do TOPO, colado embaixo da barra de
   vidro: o canto mais longe do polegar de quem segura o telefone com uma mão
   só — e é ele o botão que o motorista mais aperta nesta tela. Vai pro pé, do
   lado direito, logo acima do rodapé, que é onde todo mapa de rua o põe (a
   mesma regra nº 6 do GPS aqui embaixo: "recentralizar só faz sentido perto do
   polegar"). De quebra, sai de cima da barra e deixa o topo do mapa livre.
   44px e não 40: alvo de dedo mínimo com luva, no sol, com o carro andando. */
/* 🔴 A COLUNA É A MESMA PEÇA NOS DOIS MODOS — este seletor e o `.gps-lado` lá
   embaixo são a mesma regra escrita uma vez. O que muda de um modo pro outro é
   QUANTOS botões nascem, nunca como eles são (ver a régua do cromo, no topo do
   `.plano`). A coluna cresce PRA CIMA porque é ancorada pelo pé: sobra sempre
   sai de cima, e o botão de baixo — o mais perto do polegar — nunca se mexe. */
.plano-lado,.gps-lado{position:absolute;right:var(--map-beira);bottom:var(--map-piso);z-index:30;
  display:flex;flex-direction:column;gap:var(--map-gap)}
.plano-lado button,.gps-lado button{width:var(--map-btn);height:var(--map-btn);border-radius:var(--map-raio);
  border:.7px solid var(--line);background:var(--glass);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.36)}
/* PROCURANDO VOCÊ — o alvo respira enquanto o GPS não deu fix (ver `T.rota`).
   É pulso de OPACIDADE, não de tamanho: botão que incha e murcha embaixo do
   polegar muda de alvo no meio do toque. Some sozinho quando o fix chega. */
.plano-lado button.buscando{animation:alvoBusca 1.5s ease-in-out infinite}
@keyframes alvoBusca{50%{opacity:.45}}

/* ==========================================================================
   GPS EM NAVEGAÇÃO — o que todo navegador de rua faz e eu não tinha feito:

   1. O CARRO NÃO FICA NO MEIO: fica a ~68% da altura. O que interessa é a rua
      À FRENTE, então sobra tela pra cima e quase nada pra trás.
   2. O mapa é RODADO pelo rumo (heading-up): a direção em que se anda aponta
      sempre pra cima. Por isso existe a bússola — é ela que diz onde é o norte.
   3. O mapa é INCLINADO (~50°): a rua foge pro horizonte. Vista de cima (2D)
      é mapa de planejamento, não de direção.
   4. A MANOBRA manda na tela e mora no TOPO: distância + verbo, corpo grande.
      A rua e a manobra seguinte vêm na linha de baixo, pequenas.
   5. O rodapé é o CONTRATO da viagem: chegada, tempo, distância e a saída.
   6. Velocímetro embaixo à esquerda; recentralizar só faz sentido perto do
      polegar, do lado direito.
   ========================================================================== */
/* 🔴 O CHÃO DAS PEÇAS FLUTUANTES (11/08 — dono: "seta cortada, eu quero esse
   encaixe"). A seta era a ÚNICA medida desta tela em PORCENTAGEM (`top:86%`)
   enquanto o rodapé mede em PIXEL — então a colisão entre os dois dependia da
   altura do aparelho: em tela alta sobrava, em tela curta a seta entrava rodapé
   adentro. E o rodapé CRESCEU 41px em 10/08 (ganhou a linha dos atalhos) sem
   que ninguém refizesse a conta: medido no moto g15, a cauda da seta, 40% do
   velocímetro e 57% do botão de baixo passaram a ficar ATRÁS dele.
   Agora existe UM chão só e todas as peças de beirada pousam nele:
     `--gps-rodape-h` = a altura do rodapé de DIRIGIR (a conta está no
        `.gps-rodape`); 128 e não 126,77 porque fonte de aparelho varia e
        arredondar pra cima só custa folga.
     `--gps-piso`     = esse chão + 12px de respiro. Velocímetro, coluna de
        botões e a CAUDA da seta pousam todos nesta mesma linha — é isso que
        faz a tela parecer encaixada em vez de empilhada.
   A tela do "Você chegou" tem rodapé mais baixo e não usa nada disto: ela não
   tem seta nem velocímetro, e a coluna de botões dela manda por style inline. */
/* 🔴 `--gps-piso` NÃO É MAIS UMA CONTA À PARTE — ele é o `--map-piso` da régua
   do cromo (topo do `.plano`) com o chão deste modo, que é o rodapé de dirigir.
   O nome fica porque meia dúzia de peças desta tela já o citam; o valor passa a
   sair da MESMA fórmula do 2D. Modo que calcula o próprio piso é modo que
   descola do outro na primeira vez que alguém mexe num dos dois. */
/* 🔴 E A SETA SAIU DO CHÃO (16/08 — dono, com as duas fotos lado a lado:
   *"visual amassado: foto1, eu quero assim: foto2 — apenas posicionamento de
   ícone"*). O `--gps-piso` continua sendo o chão do CROMO (velocímetro e coluna
   de botões, que são peças de beirada e vivem coladas na moldura), mas a seta
   não é cromo: ela é o MOTORISTA. Pousada na mesma linha do velocímetro, ela
   ficava na mesma faixa horizontal do disco e do botão de recentralizar — três
   peças amontoadas no rodapé e quase nenhuma rua à frente. É literalmente o
   "amassado" da foto 1.
   `--gps-puck-sobe` é o quanto ela sobe ACIMA desse chão, e é a única medida da
   tela que fala do motorista em vez da moldura: 70px põem o ponto dele a ~77%
   da altura, que é onde a foto 2 o mostra e onde todo navegador de rua o põe
   (a regra nº1 lá embaixo já dizia "~68%" e o desenho nunca a cumpriu).
   🔴 A CÂMERA ACOMPANHA SOZINHA: `ancoraDoPuck` MEDE o `.gps-puck` na tela, não
   copia número nenhum — subir a seta sobe o recuo da câmera junto, e é por isso
   que sobra mais rua à frente em vez de a fita descolar da seta. */
.gps{position:absolute;inset:0;overflow:hidden;background:var(--fog);
  /* 🔴 117 → 133 EM 16/08, e o motivo é UMA peça: a faixa de texto de 46px
     virou a fileira do dock (46 do quadro + 4 do respiro + 11 da legenda = 61).
     São os mesmos 15px que este rodapé cresceu, e é por isso que o número muda
     junto — quem esquece esta linha repete 10/08, quando o rodapé engordou 41px
     sozinho e a seta passou a ser cortada por trás dele.
     MEDIDO pelo `prova-encaixe-gps` na pele: 132,6px. Guarda 133 e não 132 pela
     mesma razão de sempre — fonte de aparelho varia e arredondar pra cima só
     custa folga, enquanto arredondar pra baixo põe a peça dentro do rodapé. */
  --gps-rodape-h:133px;--map-chao:var(--gps-rodape-h);--gps-piso:var(--map-piso);
  --gps-puck-sobe:70px}
/* 🔴 O PALCO DE ESPERA É COR, NÃO DESENHO (09/08 — a maquete morreu, ver
   `mapa()`). Ele nasce com a cor do mapa e fica assim até o maplibre subir: o
   que o motorista vê antes do mapa é um chão escuro liso, nunca uma cidade
   inventada e nunca um retângulo preto. Some com isto o `.mapwrap` (a caixa do
   SVG, `z-index:10`), a regra que o apagava e o `pointer-events` que existia só
   porque uma caixa invisível continuava comendo o dedo em cima do mapa. */
/* o chão do palco é o chão do MAPA (§ `--map-chao`, no véu): é ele que aparece
   enquanto o tile não pintou, e um azul de casca embaixo de um mapa cinza é a
   emenda que o dono viu na entrada da cena. */
.mapa-palco{position:absolute;inset:0;background:var(--map-chao,var(--map-fundo))}
/* 🔴 SÓ CROMO — a camada que SAI na troca 2D⇄3D (quem põe a marca é o `pintar`).
   O mapa é um nó só e ele já foi transplantado pra camada que entra: o palco
   desta aqui está VAZIO, e palco vazio pinta `--map-fundo` — um retângulo
   escuro cobrindo o mapa vivo durante os 520 ms do show. Sem fundo, o que sai
   é exatamente o que tem que sair: o CROMO velho, por cima do mapa parado.
   Ela não desliga animação nenhuma — o show da saída continua inteiro. */
.tela.so-cromo,
.tela.so-cromo .gps,
.tela.so-cromo .plano,
.tela.so-cromo .mapa-palco{background:transparent}
.mapa-vivo{position:absolute;inset:0}
/* O mapa de verdade nasce como um `canvas` DENTRO deste palco e, por ser
   pintado antes dos tiles chegarem, ele entra PRETO — 1,0 s medido no g15
   (07/08) entre entrar na rota e o mapa aparecer. Enquanto não está `pronto`
   ele não aparece; quando fica, cruza com o chão do palco em .32 s. E mapa que
   nunca fica pronto deixa o chão no ar, que é o desfecho honesto. */
.mapa-palco .mapa-vivo{opacity:0}
.mapa-palco.pronto .mapa-vivo{opacity:1;transition:opacity .32s ease}

/* ==========================================================================
   🔴 OS CHECKPOINTS DO MAPA 2D (09/08 — dono, sobre a rota montada: *"tela 2d
   totalmente tosca, cadê os pontos os checkpoints?"*).

   A pele do pino morava num `cssText` inline dentro da ponte: fora do alcance
   do fiscal, fora do tema, e com as cores escritas à mão num arquivo de lógica.
   Ela vem pra cá inteira. (O que fazia os pinos SUMIREM era outra coisa — a
   folha do maplibre nunca era carregada e o marcador caía fora da tela; isso se
   consertou na ponte, ver `cssDoMaplibre`.)

   DUAS TINTAS, SEMPRE, porque o pino tem dois fundos possíveis e eles são
   opostos: o chão do mapa e a FITA DA ROTA — e é sobre a fita que ele mais
   aparece, já que parada é ponto DA rota. Medido (AA de peça gráfica = 3,0):
     escuro  anel lima  vs chão 11,61 · cheio vs fita 11,24
     claro   anel fundo vs chão 10,22 · anel      vs fita  3,61
   Onde uma tinta se perde a outra desenha a silhueta — nunca as duas juntas.

   🔴 E O PINO NÃO COME O DEDO. Marcador do maplibre nasce clicável; estes não
   têm toque nenhum na ponte, então um arrasto que começasse em cima de um pino
   simplesmente não arrastava o mapa. `pointer-events:none` devolve o gesto pro
   mapa, que é de quem ele é. */
.map-pino{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font:500 12px Inter,sans-serif;background:var(--map-pino);color:var(--map-pino-tinta);
  border:1.5px solid var(--map-pino-anel);box-shadow:0 1px 4px rgba(0,0,0,.34);
  pointer-events:auto;cursor:pointer;transition:transform .16s ease,background .16s ease}
.map-pino.is-next{transform:scale(1.14);box-shadow:0 0 0 4px var(--lime-line),0 2px 6px rgba(0,0,0,.34)}
.map-pino.is-arrived{background:var(--amber);color:var(--go-ink);border-radius:9px}
.map-pino.is-delivered{background:var(--lime);color:var(--go-ink);border-radius:8px}
.map-pino.is-failed{background:var(--red);color:var(--white);border-radius:8px}
.map-pino.is-cancelled{background:var(--card);color:var(--ink-2);border-style:dashed}
/* O REBAIXADO — e ele só existe em dia CHEIO (acima de 12 paradas, ver
   `acertarPinos` na ponte). Não é o pino encolhido: é outra peça, com o anel
   mais GROSSO em proporção, porque o que sobra de um ponto de 14px é a borda.
   O número sai (12px não cabe em 9px de miolo e viraria borrão), a silhueta
   fica. Some o número, não some a parada. */
.map-pino.min{width:14px;height:14px;border-width:2.5px;font-size:0;
  box-shadow:0 1px 3px rgba(0,0,0,.4)}
.map-pino.min.is-delivered,.map-pino.min.is-failed,.map-pino.min.is-cancelled{
  font-size:9px;font-weight:700;border-width:1.5px}
/* ==========================================================================
   🔴 O PINO DIZ O NÚMERO E, COM MAIS ZOOM, O NOME (17/08 — item 6 do dono:
   *"mapa 2d ao se aproximar exibe o número, ao dar zoom + ainda exibe o nome do
   cliente"*).

   O número já se resolvia por ESPAÇO (a régua de 16/08: quantos pixels separam
   ESTE pino do vizinho, neste zoom). O nome é o terceiro degrau da mesma régua e
   a ponte manda a classe (§ `acertarPinos`): `com-nome` só nasce no 2D, com
   zoom ≥ 15 e vão ≥ 96px até o vizinho — e 96 é a LARGURA deste rótulo (12px,
   16 letras no máximo, aparado pela própria ponte). O vão medido É o rótulo, e é
   isso que impede nome de encostar em nome sem nenhuma conta de colisão.

   ⚠️ DUAS ARMADILHAS DE LAYOUT, e as duas são deste bloco:
   1. o `.map-pino` é `display:grid;place-items:center` de 30×30 — um segundo
      filho NO FLUXO criaria uma 2ª linha de grid, espremendo o número e
      deslocando a âncora que o maplibre usa pra plantar o marcador. Por isso o
      rótulo é `position:absolute`, fora do fluxo: o pino continua 30×30.
   2. `<b>` traz `font-weight:bolder` do navegador e engordaria o número contra o
      que está publicado hoje. `font:inherit` no `.n` devolve o 500 do pai —
      número que muda de peso ao ganhar um irmão é regressão silenciosa.
   O rótulo não come o dedo (`pointer-events:none`): quem aceita toque é o pino. */
.map-pino .n{font:inherit;line-height:1}
.map-pino .nome{position:absolute;left:50%;top:calc(100% + 3px);transform:translateX(-50%);
  display:none;max-width:96px;white-space:nowrap;pointer-events:none;
  font:500 11px Inter,sans-serif;font-style:normal;color:var(--map-pino-nome);
  background:var(--map-pino-nome-fundo);border:.7px solid var(--line);
  border-radius:7px;padding:1.5px 5px;box-shadow:0 2px 6px rgba(0,0,0,.34)}
.map-pino.com-nome .nome{display:block;animation:mvPop 180ms var(--cv-mola) both}
/* rebaixado não tem nome: se o número não cabe, o nome cabe menos. A ponte já
   garante que as duas marcas nunca convivem — esta linha é o cinto. */
.map-pino.min .nome{display:none}

/* ==========================================================================
   🔴 ONDE EU ESTOU — três peças, e cada uma responde uma pergunta diferente
   (dono, 09/08, no mapa 2D: *"cadê minha localização?"*).

   O que existia era um alfinete PADRÃO do maplibre (`new Marker({color})`): a
   MESMA gota que marca uma parada, no mesmo tamanho, na mesma família. Num
   mapa com rota ele se perdia entre os pinos numerados; num dia SEM rota ele
   era a única coisa na tela e mesmo assim não dizia "você" — dizia "tem um
   ponto aqui". Nenhum mapa de rua do mundo desenha o dono da tela como pino, e
   o motivo é este: pino é COISA QUE ESTÁ LÁ, e eu sou QUEM OLHA.

   · O PONTO (o elemento): onde eu estou. Azul, anel branco, sombra — o anel é
     o que o separa do chão em qualquer cor de mapa, claro ou escuro.
   · O HALO (`::before`, `--halo`): QUANTO o GPS tem certeza. Ele é a precisão
     em METROS convertida em pixels pelo zoom da hora (ver `moverEuNoPlano`),
     não um enfeite de tamanho fixo: dentro de um galpão ele incha e conta a
     verdade, no meio da rua ele encolhe. Respira devagar porque GPS é coisa
     VIVA — ponto parado e duro passa por desenho.
   · O FAROL (`::after`, `--rumo`/`--cone`): pra onde eu APONTO. Sem rumo no
     fix, `--cone:0` e ele não existe — apontar pra um lado inventado seria
     pior que não apontar (Lei do IF, aplicada a desenho).
   ========================================================================== */
/* A casca do puck NÃO declara `position`: quem o põe no lugar é o dono do
   palco — no app é o `.maplibregl-marker` do vendor (absolute + transform a
   cada quadro), aqui no mock é o `.demo` logo abaixo. Declarar position aqui
   empatava com a folha do vendor no MESMO elemento e a ordem das folhas
   escolhia qual dos dois quebrava (medido 09/08: vendor por último = palco de
   altura 0, tela cinza no g15; casa por último = puck pregado em 0,47). Os
   ::before/::after continuam ancorados porque os DOIS donos posicionam. */
.eu-puck{width:20px;height:20px;border-radius:50%;
  background:var(--eu-1);border:3px solid var(--eu-anel);
  box-shadow:0 2px 7px rgba(0,0,0,.38)}
.eu-puck::before{content:'';position:absolute;left:50%;top:50%;
  width:var(--halo,96px);height:var(--halo,96px);
  margin:calc(var(--halo,96px) / -2) 0 0 calc(var(--halo,96px) / -2);
  border-radius:50%;background:var(--eu-halo);border:.7px solid var(--eu-halo-linha);
  animation:euRespira 3.6s ease-in-out infinite}
/* O cone é um GRADIENTE CÔNICO recortado por máscara, e não um triângulo: o
   triângulo tem bico e beirada dura, e o que se quer é a luz saindo do ponto e
   morrendo na distância. A máscara começa em 21% pra não passar por cima do
   próprio ponto — o farol sai DE TRÁS dele. */
.eu-puck::after{content:'';position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;
  border-radius:50%;opacity:var(--cone,0);
  background:conic-gradient(from calc(var(--rumo,0deg) - 27deg),var(--eu-cone),transparent 54deg);
  -webkit-mask-image:radial-gradient(circle,transparent 21%,#000 34%,transparent 96%);
          mask-image:radial-gradient(circle,transparent 21%,#000 34%,transparent 96%)}
@keyframes euRespira{50%{transform:scale(1.05);opacity:.7}}
/* No MOCK o ponto é desenho e fica no meio do palco; no app quem o põe no
   lugar é o mapa (marcador do maplibre), e aí `left/top` não podem existir. */
.eu-puck.demo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
/* 🔴 E O DESENHO MORRE QUANDO NASCE MAPA DE VERDADE. Enquanto o maplibre não
   sobe, o palco é só cor — pôr um "você está aqui" em cima de chão liso seria
   a maquete de novo, inventando posição (ver `mapa()`). A ponte marca o palco
   assim que cria o mapa; daí em diante quem mostra o motorista é o marcador. */
.mapa-palco.com-mapa>.eu-puck{display:none}

/* ==========================================================================
   🔴 A CENA DAS RUAS — a entrada do app (ordem do dono, 09/08: *"ao ligar, era
   pras ruas virem surgindo, um efeito bem legal na entrada dele, e este efeito
   se repete sempre que uma rota é criada"*).

   A DIVISÃO É A MESMA DE SEMPRE: o que é MAPA mora no mapa. As ruas que
   crescem não são desenho nenhum — são as ruas DE VERDADE dos tiles, viradas
   em camadas do maplibre pela ponte (`cenaDasRuas`). Aqui em cima ficam só as
   duas peças de CROMO da cena: o ponto que nasce e o cartão que se escreve.
   Foi ordem literal ("não remonte coisas, crie dentro do mapa mesmo") e é
   também o motivo de a cena terminar sem cruzamento: o que se apaga no fim é
   uma camada por cima da mesma geometria que fica.

   🔴 A CASA TEM UMA VELOCIDADE DE ESCRITA SÓ: 66 ms por letra, a régua do nome
   da empresa — e é o MESMO `@keyframes empDigita`, não uma cópia. Cena com dois
   relógios é cena que se contradiz na mesma tela.
   ========================================================================== */
/* O ponto só ACENDE (`empSurge`); quem faz o gesto de pouso é o halo, que já
   tem transform próprio. 🔴 E não pode ser diferente: no app este elemento É o
   `.maplibregl-marker` (o vendor escreve `transform` nele a cada quadro), então
   animar transform aqui arrancaria o ponto do lugar dele no mapa. */
.eu-puck.nascendo{animation:empSurge 260ms ease both}
.eu-puck.nascendo::before{animation:mvPouso 620ms var(--cv-sai) both}
