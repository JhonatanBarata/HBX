/* O sublinhado é peça SEPARADA e enche MAIS DEVAGAR que a digitação — a
   lentidão é do desenho do dono, não sobra: é ela que dá o ar de "o app ainda
   está confirmando" depois que o nome já apareceu. */
.emp-trilho{display:block;margin:3px 0 0 16px;width:110px;height:2px;background:var(--emp-trilho);position:relative}
.emp-barra{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--emp-barra);
  box-shadow:0 0 10px var(--emp-barra-brilho)}

/* ---- ACESA: o estado FINAL, escrito por inteiro (é o que o portão fotografa) ---- */
.emp.on .emp-anel{background:var(--emp-on-anel);border-color:var(--emp-on-fio);
  box-shadow:0 0 0 1px var(--emp-on-borda),0 0 24px var(--emp-on-halo)}
.emp.on .emp-rabo{border-bottom-color:var(--emp-on-anel)}
.emp.on .emp-predio .telhado{background:var(--emp-on-telhado)}
.emp.on .emp-predio .lado{background:var(--emp-on-lado)}
.emp.on .emp-predio .frente{background:var(--emp-on-frente)}
.emp.on .emp-janelas i{background:var(--emp-janela-on);box-shadow:0 0 8px var(--emp-janela-brilho)}
.emp.on .emp-halo{background:var(--emp-brilho)}
.emp.on .emp-rotulo{opacity:1}
.emp.on .emp-barra{width:100%}

/* ---- a CENA (só o `from`; o `to` é a regra acima) ---- */
@keyframes empVarre{
  0%{transform:scale(.8);opacity:.95;border-color:var(--emp-varre)}
  100%{transform:scale(1.8);opacity:0;border-color:var(--emp-varre-fim)}}
@keyframes empAnel{from{background:var(--emp-anel);border-color:var(--emp-anel-fio);
  box-shadow:0 0 0 1px rgba(0,0,0,0),0 0 0 rgba(0,0,0,0)}}
@keyframes empTelhado{from{background:var(--emp-telhado)}}
@keyframes empLado{from{background:var(--emp-lado)}}
@keyframes empFrente{from{background:var(--emp-frente)}}
@keyframes empRabo{from{border-bottom-color:var(--emp-anel)}}
@keyframes empJanela{from{background:var(--emp-janela);box-shadow:0 0 0 rgba(0,0,0,0)}}
@keyframes empHalo{from{background:rgba(0,0,0,0)}}
@keyframes empRotulo{from{opacity:0}}
@keyframes empDigita{from{clip-path:inset(0 100% 0 0)}}
@keyframes empSublinha{from{width:0}}
@keyframes empRespira{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.18);opacity:1}}

/* A varredura é a ÚNICA sem `backwards`: o `from` dela é um anel azul VISÍVEL,
   e com `both` ele ficaria parado na tela durante o atraso da empresa. */
.emp.on .emp-varre{animation:empVarre .72s ease-out var(--atraso,0s) forwards}
.emp.on .emp-anel{animation:empAnel .35s ease calc(var(--atraso,0s) + .22s) both}
.emp.on .emp-rabo{animation:empRabo .35s ease calc(var(--atraso,0s) + .22s) both}
.emp.on .emp-predio .telhado{animation:empTelhado .35s ease calc(var(--atraso,0s) + .22s) both}
.emp.on .emp-predio .lado{animation:empLado .35s ease calc(var(--atraso,0s) + .22s) both}
.emp.on .emp-predio .frente{animation:empFrente .35s ease calc(var(--atraso,0s) + .22s) both}
.emp.on .emp-rotulo{animation:empRotulo .2s ease calc(var(--atraso,0s) + .22s) both}
.emp.on .emp-halo{animation:empHalo .35s ease calc(var(--atraso,0s) + .22s) both,
  empRespira 1.8s ease-in-out calc(var(--atraso,0s) + .57s) infinite}
/* cada janela tem o SEU lugar na fila (`--j`), e a fila de cada empresa é
   outra: é o que faz o prédio acender "sozinho" em vez de piscar inteiro. */
.emp.on .emp-janelas i{animation:empJanela .28s ease
  calc(var(--atraso,0s) + .24s + var(--j,0) * .115s) both}
/* 44 ms por caractere, em `steps`: é DIGITAÇÃO, não fade. O recorte por
   `clip-path` não depende da largura da letra — `ch` mentiria numa fonte
   proporcional e cortaria o nome no meio. */
.emp.on .emp-nome{animation:empDigita calc(var(--n,1) * 44ms) steps(var(--n,1),end)
  calc(var(--atraso,0s) + .38s) both}
.emp.on .emp-barra{animation:empSublinha 1.7s linear calc(var(--atraso,0s) + .52s) both}

/* ---- o cromo: chip, linha de varredura e o radar em cima do motorista ---- */
.emp-chip{position:absolute;left:14px;top:114px;z-index:16;padding:6px 11px 6px 24px;border-radius:999px;
  background:var(--glass);border:.7px solid var(--line);font-size:12px;color:var(--ink-2)}
.emp-chip::before{content:"";position:absolute;left:11px;top:50%;margin-top:-3.5px;width:7px;height:7px;
  border-radius:50%;background:var(--emp-ponto);box-shadow:0 0 10px var(--emp-ponto-brilho)}
.emp-scan{position:absolute;left:18px;right:18px;top:31%;height:2px;border-radius:2px;z-index:11;
  pointer-events:none;background:var(--emp-linha-scan);filter:blur(4px);
  animation:empScan 4.8s linear infinite}
@keyframes empScan{from{top:31%;opacity:.55}to{top:64%;opacity:.2}}
/* o radar mora DENTRO do puck: quem pulsa é a posição do motorista, e o puck
   já é o único dono dessa coordenada — dois donos do mesmo ponto discordam. */
.emp-radar{position:absolute;left:0;top:0;width:2px;height:2px}
.emp-radar i{position:absolute;left:-1px;top:-1px;width:2px;height:2px;border-radius:50%;
  border:1px solid var(--emp-radar);transform:translate(-50%,-50%);
  animation:empRadar 3.4s linear infinite}
.emp-radar i+i{animation-delay:1.7s}
@keyframes empRadar{
  0%{width:8px;height:8px;margin-left:-4px;margin-top:-4px;opacity:.4}
  100%{width:170px;height:170px;margin-left:-85px;margin-top:-85px;opacity:0}}

/* ---------- folha ---------- */
.scrim{position:absolute;inset:0;background:rgba(3,7,14,.72);z-index:40}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;border-radius:22px 22px 0 0;
  background:linear-gradient(180deg,#0f1a2c,var(--bg-2) 30%);border:.7px solid var(--line);border-bottom:0;
  padding:10px 12px 72px;max-height:88%;overflow:auto;scrollbar-width:none;box-shadow:0 -18px 44px rgba(0,0,0,.6)}
.sheet::-webkit-scrollbar{display:none}
.sheet .handle{width:36px;height:3px;border-radius:2px;background:var(--handle);margin:0 auto 10px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheet-head h2{margin:0;font-size:21px;font-weight:500;letter-spacing:-.3px}
.sheet-head p{margin:2px 0 0;font-size:12px;color:var(--ink-2)}
.box{background:var(--card);border:.7px solid var(--line);border-radius:13px;padding:10px}
.box+.box{margin-top:8px}
.box-t{font-size:13.5px;font-weight:500}
.box-s{font-size:11px;color:var(--ink-2);margin-top:1px}
.thumb{width:56px;height:56px;border-radius:11px;background:linear-gradient(160deg,#12305f,#0a1a33);
  border:1px solid #1d3a6b;display:grid;place-items:center;flex:0 0 56px;color:var(--blue-l)}
/* Tom do produto por CLASSE (o hex inline era do escuro e sumia no claro). */
.thumb.t-azul{color:var(--blue-l)}
.thumb.t-azul-escuro{color:#7fb0ff}
.thumb.t-cinza{color:#b6c6dd}
.thumb.t-lima{color:var(--lime)}
.marca.info{background:var(--blue-bg);color:var(--blue-l)}
.map-ctrl button.ativo{background:var(--blue-bg)}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.pay{display:flex;align-items:center;gap:8px;padding:10px;border-radius:11px;cursor:pointer;text-align:left;
  border:.7px solid var(--line-2);background:var(--field);color:var(--ink);position:relative}
.pay b{display:block;font-size:13px;font-weight:500}
.pay small{display:block;font-size:10px;color:var(--ink-2);margin-top:1px}
.pay.sel{border-color:var(--lime);background:var(--sel-bg)}
.pay.sel .ok{position:absolute;top:8px;right:8px;color:var(--lime)}
.pay.blue{border-color:rgba(47,126,247,.5)}
.rowline{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:12.5px}
.rowline+.rowline{border-top:1px dashed var(--line-2)}
.rowline b{color:var(--lime);font-size:13.5px;font-weight:500}
.foot2{display:grid;grid-template-columns:1.1fr .9fr;gap:8px;margin-top:10px}

/* ---------- fechamento ---------- */
.forms{display:flex;background:var(--card);border:.7px solid var(--line);border-radius:12px;overflow:hidden}
.form-c{flex:1;padding:9px 4px;text-align:center;border-right:.7px solid var(--line)}
.form-c:last-child{border-right:0}
.form-c small{display:block;font-size:10.5px;color:var(--ink-2);margin-top:4px}
.form-c b{display:block;font-size:12.5px;font-weight:500;margin-top:1px}
.form-c.total{background:var(--sel-bg)}
.form-c.total b{color:var(--lime);font-size:15px}

/* ---------- progresso ---------- */
.prog{background:var(--card);border:.7px solid var(--line);border-radius:12px;padding:9px 11px;margin-top:8px}
.prog-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2)}
.prog-l b{color:var(--lime)}
.prog-b{height:5px;border-radius:3px;background:var(--trilho);margin-top:7px;overflow:hidden}
.prog-b i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--prog-1),var(--prog-2))}

/* ---------- busca / chips ---------- */
.searchrow{display:flex;gap:7px;margin-top:7px}
.search{flex:1;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:12px;
  background:var(--card);border:.7px solid var(--line);color:var(--ink-3)}
.search input{flex:1;border:0;background:transparent;outline:0;font-size:13px;color:var(--ink)}
.filt{width:38px;height:38px;border-radius:12px;background:var(--card);border:.7px solid var(--line);
  display:grid;place-items:center;color:var(--ink-2);cursor:pointer}
.chips{display:flex;gap:6px;margin-top:9px;overflow:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 13px;border-radius:10px;border:.7px solid var(--line-2);background:transparent;
  color:var(--ink);font-size:12.5px;white-space:nowrap;cursor:pointer}
.chip.on{border-color:var(--lime);color:var(--lime);background:var(--sel-bg)}

/* ---------- título de tela ---------- */
.screen-head{display:flex;align-items:center;gap:10px;margin:2px 0 0}
.screen-head h2{margin:0;font-size:21px;font-weight:500;letter-spacing:-.3px}
.screen-head p{margin:1px 0 0;font-size:11.5px;color:var(--ink-2)}

/* ---------- produto ----------
   Na foto a lista inteira mora DENTRO de um cartão só, dividida por fios —
   o contrário das paradas, que são cartões separados. */
.lista-card{background:var(--card);border:.7px solid var(--line);border-radius:13px;padding:0 10px;margin-top:6px}
.lista-card>*:last-child{border-bottom:0}
.prod{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 2px;
  border-bottom:.6px solid rgba(26,39,64,.95)}
.prod .nm{font-size:14px;font-weight:500}
.prod .st{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);margin-top:3px}
.price{position:relative;border:.9px solid var(--lime);border-radius:9px;padding:7px 12px;
  color:var(--lime);font-size:15px;font-weight:400;background:#111a10}
.price::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%) rotate(45deg);
  width:8px;height:8px;background:var(--bg-2);border-right:.9px solid var(--lime);border-bottom:.9px solid var(--lime)}

/* ---------- rotas salvas ---------- */
.rowcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;
  background:var(--card);border:.7px solid var(--line);border-radius:12px;padding:6px 9px;margin-bottom:5px;cursor:pointer}
.rowcard .ico{width:36px;height:36px;border-radius:10px;background:var(--blue-bg-2);
  border:.7px solid var(--line-2);display:grid;place-items:center;color:var(--blue-l)}
.rowcard .ico.lime{background:var(--lime-bg);color:var(--lime)}
.rowcard strong{display:block;font-size:13px;font-weight:500}
.rowcard span{display:block;font-size:10px;color:var(--ink-2)}
.rowcard .meta{display:flex;gap:9px;margin-top:2px;font-size:10px;color:var(--ink-2)}
.rowcard .meta i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.rowcard .rgt{text-align:right}
.rowcard .rgt small{display:block;font-size:10.5px;color:var(--ink-2)}
.rowcard .rgt b{display:block;font-size:13.5px;color:var(--lime);font-weight:500;margin-top:1px}
.mini-acts{display:flex;gap:9px;align-items:center;padding-left:8px;border-left:.7px solid var(--line)}
.mini{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;color:var(--ink-2);cursor:pointer}
.mini .c{color:var(--blue-l)}

/* ---------- semana ---------- */
.week{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;
  background:var(--card);border:.7px solid var(--line);border-radius:12px;padding:9px;margin-bottom:7px}
.week .d strong{display:block;font-size:13px;font-weight:500}
.week .d span{display:block;font-size:10.5px;color:var(--ink-2)}
.week .q i{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-2);font-style:normal}
.week .q i+i{margin-top:3px}
.week .r small{display:block;font-size:10.5px;color:var(--ink-2)}
.week .r b{display:block;font-size:13px;color:var(--lime);font-weight:500}
.week .mk{border:1px solid var(--lime-line);background:#111a0c;border-radius:9px;padding:6px 8px;display:flex;align-items:center;gap:6px}
.week .mk small{display:block;font-size:10px;color:var(--ink-2)}
.week .mk b{display:block;font-size:13px;color:var(--lime);font-weight:500}

/* ---------- formulário (ficha do cliente / produto) ---------- */
.campos{display:grid;gap:8px}
.campo{display:block}
.campo>label{display:block;font-size:10.5px;color:var(--ink-2);margin-bottom:3px}
.campo>label .pend{color:var(--amber)}
.campo input,.campo textarea{width:100%;height:38px;border-radius:11px;border:.7px solid var(--line);
  background:var(--field);padding:0 11px;outline:0;font-size:13px;color:var(--ink)}
.campo textarea{height:56px;padding:8px 11px;resize:none;line-height:1.35}
.campo.erro input{border-color:#7a3a1a;background:#1a1108}
.campo .dica{display:block;font-size:10px;color:var(--amber);margin-top:3px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tripla{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:3px}
.dias button{padding:7px 0;border-radius:10px;border:.7px solid var(--line);background:var(--card);
  color:var(--ink-2);font-size:11px;cursor:pointer}
.dias button.on{border-color:var(--lime);background:var(--lime-bg);color:var(--lime)}
.dias button small{display:block;font-size:9px;opacity:.8;margin-top:1px}

/* ---------- stepper de quantidade ---------- */
.item-linha{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:9px 0;border-bottom:.6px solid rgba(26,39,64,.95)}
.item-linha:last-child{border-bottom:0}
.item-linha strong{display:block;font-size:13px;font-weight:500}
.item-linha span{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
.passo{display:flex;align-items:center;gap:8px}
/* 🔴 O STEPPER É UM <span> DENTRO DE .item-linha — e `.item-linha span` (0,1,1)
   VENCE `.passo` (0,1,0). Resultado medido no vidro: display virava `block` e a
   fonte caía pra 10,5px, então os botões − e + EMPILHAVAM num filete de 30px.
   Não era o dado real ser maior: acontece com o nome do próprio mock. */
.item-linha .passo{display:flex;margin-top:0}
.passo button{width:30px;height:30px;border-radius:10px;border:.7px solid var(--line-2);background:var(--card);
  color:var(--ink);font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center}
.passo b{min-width:22px;text-align:center;font-size:15px;font-weight:500}

/* ---------- motivos de não entrega ---------- */
.motivos{display:grid;gap:6px;margin-top:9px}
.motivo{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px 11px;
  border-radius:12px;border:.7px solid var(--line);background:var(--field);color:var(--ink);
  font-size:13px;text-align:left;cursor:pointer}
.motivo .bola{width:17px;height:17px;border-radius:50%;border:1.2px solid var(--line-2)}
.motivo.on{border-color:var(--amber-line);background:#1e1608}
.motivo.on .bola{border-color:var(--amber);box-shadow:inset 0 0 0 4px var(--amber)}

/* ---------- comprovante ---------- */
.foto{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:center;margin-top:9px;
  padding:11px;border-radius:13px;border:.7px dashed var(--line-2);background:var(--field)}
.foto .quadro{width:56px;height:56px;border-radius:11px;background:#101d31;display:grid;place-items:center;color:var(--blue-l)}
.foto strong{display:block;font-size:12.5px;font-weight:500}
.foto span{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}

/* ---------- prévia do dia (gerenciador) ---------- */
.previa{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;
  border-radius:12px;border:.7px solid var(--line);background:var(--card);margin-bottom:5px}
.previa.entra{border-color:var(--lime-line)}
.previa.sai{opacity:.5}
.previa .marca{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:11px}
.previa.entra .marca{background:var(--lime-bg-2);color:var(--lime)}
.previa.sai .marca{background:var(--red-bg);color:var(--red)}
.previa strong{display:block;font-size:13px;font-weight:500}
.previa span{display:block;font-size:10.5px;color:var(--ink-2)}

/* ---------- pacotes de recarga ---------- */
.pacotes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.pacote{border:.7px solid var(--line);background:var(--card);border-radius:14px;padding:12px 11px;text-align:center;
  cursor:pointer;color:var(--ink);position:relative}
.pacote.on{border-color:var(--lime);background:var(--sel-bg)}
.pacote b{display:block;font-size:21px;font-weight:500;letter-spacing:-.02em}
.pacote small{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
.pacote .preco{display:block;font-size:14px;color:var(--lime);margin-top:7px}
.pacote .selo{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:9.5px;padding:2px 8px;
  border-radius:999px;background:var(--lime);color:var(--go-ink)}

/* ---------- extrato ---------- */
.extrato{background:var(--card);border:.7px solid var(--line);border-radius:13px;padding:0 11px;margin-top:6px}
.ext-linha{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;
  border-bottom:.6px solid rgba(26,39,64,.95)}
.ext-linha:last-child{border-bottom:0}
.ext-linha .m{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px}
.ext-linha .m.mais{background:var(--lime-bg-2);color:var(--lime)}
.ext-linha .m.menos{background:var(--red-bg);color:var(--red)}
.ext-linha strong{display:block;font-size:12.5px;font-weight:400}
.ext-linha span{display:block;font-size:10px;color:var(--ink-2)}
.ext-linha b{font-size:13px;font-weight:500}
.ext-linha b.mais{color:var(--lime)}
.ext-linha b.menos{color:var(--red)}

/* ---------- passeio ---------- */
.tempo{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:6px}
.tempo button{height:52px;border-radius:13px;border:.7px solid var(--line);background:var(--card);color:var(--ink);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tempo button b{font-size:15px;font-weight:500}
.tempo button small{font-size:9.5px;color:var(--ink-2)}
.tempo button.on{border-color:var(--lime);background:var(--lime-bg);color:var(--lime)}
.tempo button.on small{color:var(--lime);opacity:.8}

/* ---------- leitura de rota (gravando) ---------- */
.gravando{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;margin-top:6px;
  padding:11px;border-radius:14px;border:.7px solid var(--red-line-2);background:var(--red-bg-2)}
.gravando .bola{width:12px;height:12px;border-radius:50%;background:#ff5b5b;animation:gravPulsa 1.1s ease-in-out infinite}
@keyframes gravPulsa{50%{opacity:.25;transform:scale(.82)}}
.gravando b{display:block;font-size:15px;font-weight:500}
.gravando span{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
.gravando .crono{font-size:19px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ==========================================================================
   OS DOIS GESTOS — na LISTA DE PARADAS de verdade, com dedo e com mouse.
   SEGURAR = retirar da rota (950ms, vermelho progressivo, vibração no fim).
   PUNHO   = arrastar pra reordenar (pega na hora, sem espera).
   A zona do punho NUNCA arma o excluir: dedo na alça é outro gesto.

   🔴 EM REPOUSO ESTA REGRA NÃO PINTA NADA. A tela que ensinava o gesto saiu e o
   gesto veio pra lista real — e a lista real aparece em telas que o portão
   antes×depois mede PIXEL a pixel. Por isso `overflow` só entra COM o gesto em
   curso. Já o `::after` nasce em repouso com largura ZERO (invisível): sem ele
   existindo antes, a barra vermelha não teria de onde animar — pseudo-elemento
   recém-criado não transiciona, ele SALTA pra 100%.
   ========================================================================== */
[data-gestos] .stop{touch-action:pan-y;user-select:none}
[data-gestos] .stop::after{content:"";position:absolute;inset:0;width:0;background:rgba(242,85,90,.22);
  pointer-events:none;transition:width 0s}
[data-gestos] .stop.armando,[data-gestos] .stop.pronto{overflow:hidden}
[data-gestos] .stop.armando::after{width:100%;transition:width .95s linear}
[data-gestos] .stop.pronto{border-color:var(--red);background:var(--red-bg)}
[data-gestos] .stop.pronto::after{width:100%;background:rgba(242,85,90,.3)}
[data-gestos] .stop.arrastando{z-index:5;box-shadow:0 12px 28px rgba(0,0,0,.5);border-color:var(--blue-line);
  transform:scale(1.015);transition:transform .12s}
[data-gestos] .grip{cursor:grab;touch-action:none}

/* ---------- chat da Central ---------- */
.recado{border:.7px solid var(--amber-line);background:#1a1408;border-radius:14px;padding:11px;margin-top:6px}
.recado .topo{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.recado .ico{width:34px;height:34px;border-radius:11px;background:var(--amber-bg);color:var(--amber);display:grid;place-items:center}
.recado strong{display:block;font-size:13.5px;font-weight:500}
.recado span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:1px}
.recado .acoes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.recado .acoes button{height:36px;border-radius:11px;border:.7px solid var(--line-2);background:var(--card);
  color:var(--ink);font-size:12.5px;cursor:pointer}
/* 🔴 ESTA LINHA JÁ FOI `color:#fff`. A lei da tinta escura mora lá em cima
   (procure ".act.go"), com a MESMA força de seletor — e regra de força igual
   quem ganha é a de BAIXO. Como esta nasceu depois, ela vencia calada e o
   "Entendi" do recado saía branco no lima: 1,78:1, medido. Regra que diz o
   contrário da lei não se corrige com ordem; se corrige dizendo a lei. */
.recado .acoes .principal{background:linear-gradient(180deg,var(--go-1),var(--go-2));border:0;color:var(--go-ink)}
.conversa{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.msg{max-width:82%;padding:8px 11px;border-radius:14px;font-size:12.5px;line-height:1.35}
.msg.deles{background:var(--card);border:.7px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.msg.minha{background:var(--lime-bg-2);border:.7px solid var(--lime-line);border-bottom-right-radius:5px;align-self:flex-end}
.msg small{display:block;font-size:9.5px;color:var(--ink-3);margin-top:3px}
.escrever{display:flex;align-items:center;gap:8px;margin-top:12px;height:42px;padding:0 12px;border-radius:14px;
  background:var(--card);border:.7px solid var(--line)}
.escrever input{flex:1;border:0;background:transparent;outline:0;font-size:13px;color:var(--ink)}
.escrever .enviar{width:30px;height:30px;border-radius:10px;border:0;background:var(--lime);color:var(--go-ink);
  display:grid;place-items:center;cursor:pointer}

/* ---------- ajustes ---------- */
/* O título da sub-tela. `telaAjuste` recebia o nome e nunca o escrevia: Recarga,
   Financeiro, Avançado, Sons, Histórico e Consumo abriam SEM título nenhum, e o
   cabeçalho é o logo (não anda, §hdr) — não havia onde ler onde se está. */
.tela-tit{font-size:15.5px;font-weight:700;color:var(--ink);margin:9px 2px 0;letter-spacing:-.01em}
.grupo{font-size:11px;color:var(--ink-2);margin:12px 2px 5px}
.cartao-lista{background:var(--card);border:.7px solid var(--line);border-radius:13px;overflow:hidden}
.linha-cfg{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:10px 11px;border:0;border-bottom:.6px solid rgba(26,39,64,.95);background:transparent;
  color:var(--ink);text-align:left;cursor:pointer}
.linha-cfg:last-child{border-bottom:0}
.linha-cfg .ico{width:30px;height:30px;border-radius:10px;background:#111d31;color:var(--ink-2);display:grid;place-items:center}
.linha-cfg strong{display:block;font-size:13px;font-weight:400}
.linha-cfg span{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
.linha-cfg b{font-size:12.5px;font-weight:500;color:var(--ink-2)}
/* 🔴 INTERRUPTOR PRECISA DE LIMITE VISÍVEL NOS DOIS ESTADOS. O trilho sozinho
   media 1,3:1 contra o cartão no escuro e 1,78:1 no claro — dava pra não ver
   se estava ligado. Quem define o limite é a BORDA; o preenchimento só diz o
   estado. Mínimo de 3:1 em trilho×cartão e bola×trilho, medido nas duas peles. */
.chave{width:38px;height:22px;border-radius:999px;background:#22314c;border:1px solid #5c6f92;
  position:relative;flex:0 0 38px;box-sizing:border-box}
.chave i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--ink-2);transition:left .2s,background .2s}
.chave.on{background:var(--lime);border-color:#c6f27a}
.chave.on i{left:18px;background:var(--go-ink)}

/* ---------- clientes ---------- */
/* 🔴 A LINHA DE CLIENTE TAMBÉM É BOTÃO. No mock ela é `<div>` (nada clica), mas
   no app ela ABRE A FICHA — e aí o navegador devolve o botão de fábrica por
   baixo: fundo cinza, borda de 2px, texto centralizado, largura encolhida. Foi
   medido ao vestir a tela (leva 2): a lista inteira virou caixa cinza.
   O `.linha-cfg` já nasceu com esse desarme; o `.cli` não tinha. Sem ele aqui,
   quem veste é obrigado a desarmar INLINE no app — e estilo inline vence a
   folha, então o fundo do `.stop.pronto` (segurar pra apagar) nunca
   chegava. Componente que pode ser botão desarma o botão ELE MESMO. */
.cli{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:8px 2px;border:0;border-bottom:.6px solid rgba(26,39,64,.95);
  width:100%;background:transparent;color:var(--ink);text-align:left;font:inherit}
.ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:500;
  background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue-l)}
.ava.lime{background:var(--lime-bg-2);border-color:var(--lime-line);color:var(--lime)}
.cli strong{display:block;font-size:13.5px;font-weight:500}
.cli span{display:block;font-size:11px;color:var(--ink-2);margin-top:1px}
.cli .rgt small{display:block;font-size:10px;color:var(--ink-2)}
.cli .rgt b{display:block;font-size:13.5px;color:var(--lime);font-weight:500}
/* 🔴 O CÍRCULO CENTRALIZA SOZINHO — e quase nunca centralizava. `.ava` é um
   `<span>`, e as regras largas de linha (`.cli span`, `.item-linha span`) têm
   1 classe + 1 tipo: vencem `.ava` (1 classe) e ainda vêm depois. Roubavam
   QUATRO propriedades de uma vez — `display:grid` virava `block` (e aí
   `place-items:center` fica inerte: as iniciais colam no canto de cima),
   12px virava 11px, a cor da marca virava `--ink-2` e um `margin-top:1px`
   empurrava o círculo inteiro pra baixo. Medido com `getComputedStyle`, não
   lido. Mesma família da lei do gesto acima: componente que um
   seletor largo alcança DESARMA quem o alcança, no lugar exato.
   Vem ANTES do bloco do modo claro de propósito — lá a cor é redesenhada. */
.cli .ava,.item-linha .ava{display:grid;place-items:center;font-size:12px;margin-top:0;color:var(--blue-l)}
.cli .ava.lime,.item-linha .ava.lime{color:var(--lime)}

/* ==========================================================================
   MODO CLARO — DESENHADO, não derivado.
   O anterior era a folha inteira duplicada (514 linhas, duas vezes) por regra
   de matiz. Inversão mecânica não funciona porque as duas peles usam a LUZ de
   maneiras opostas: no escuro a hierarquia vem de clarear a superfície; no
   claro ela vem de BORDA e SOMBRA, com quase tudo branco.

   As três armadilhas que a derivação não tinha como resolver:
   1. O LIMA VIVO É INVISÍVEL NO BRANCO (1,7:1). No claro ele deixa de ser
      tinta e vira só PREENCHIMENTO; quem escreve é o verde escuro.
   2. BRILHO NÃO EXISTE NO CLARO. Todo halo vira sombra — glow sobre branco
      é sujeira, não profundidade.
   3. O FUNDO NÃO É BRANCO. É cinza-azulado, senão o cartão branco não flutua
      e a tela vira uma folha só.
   ========================================================================== */
[data-luz="claro"] .app{
  --bg:#eef1f7; --bg-2:#f7f9fc; --card:#ffffff; --line:#dde3ee; --line-2:#c3cfe1;
  /* --ink-3 é o rótulo da aba apagada: em #7d8ba3 media 3,45 sobre o branco
     da barra. Escurecido até passar — texto de 9px não tem folga nenhuma. */
  --ink:#0f1726; --ink-2:#55637d; --ink-3:#616f89;
  /* o verde que ESCREVE é escuro; o vivo sobrou pra preencher (--lima-viva) */
  --lime:#3f7a00; --lima-viva:#8fd626;
  --blue:#1257c8; --blue-l:#1257c8; --amber:#8a5200; --purple:#6d28d9; --red:#c0201b;
  --lime-bg:#f0f8e4; /* F1 leva 3: cobertura 5/5 medida */
  --splash-bg-1:#f7f9fc; --splash-bg-2:#e9eef6;
  --splash-marca:#5a9c10; --splash-marca-2:#7bc020;
  --splash-tinta:#0f1726; --splash-sub:#55637d; --splash-trilho:#d5dded;
  /* 🔴 O VÉU INVERTE: no escuro ele ESCURECE, no claro ele CLAREIA. É o pedido
     literal do dono, e é o certo — véu escuro sobre mapa claro é uma sombra
     caindo na tela; véu claro é a luz de fora entrando, que é a leitura de
     quem dirige de dia. Mesma cena, lado oposto. */
  --veu:#eef2f8;
  --puck-anel:rgba(18,87,200,.42);
  background:linear-gradient(180deg,var(--bg-2),var(--bg) 34%);
  color:var(--ink);
}
[data-luz="claro"] .tela{background:linear-gradient(180deg,var(--bg-2),var(--bg) 34%)}
[data-luz="claro"] .notch{background:#0a0d14}
/* 🔴 O FIO DIVISOR TAMBÉM ERA CRAVADO ESCURO. Cinco listas separam as linhas
   com `rgba(26,39,64,.95)` — no escuro é um fio discreto; no cartão BRANCO é
   um risco quase preto, mais forte que o próprio texto. Fio de lista é uma
   dica, não uma régua: quem separa no claro é o `--line` da pele. */
[data-luz="claro"] .prod,[data-luz="claro"] .item-linha,[data-luz="claro"] .ext-linha,
[data-luz="claro"] .linha-cfg,[data-luz="claro"] .cli{border-bottom-color:var(--line)}

/* Cartão branco com sombra suave: é a sombra que cria a camada, não a cor. */
[data-luz="claro"] .stop,[data-luz="claro"] .kpi,[data-luz="claro"] .bar,
[data-luz="claro"] .sum,[data-luz="claro"] .act,[data-luz="claro"] .box,
[data-luz="claro"] .rowcard,[data-luz="claro"] .week,[data-luz="claro"] .cartao-lista,
[data-luz="claro"] .lista-card,[data-luz="claro"] .previa,[data-luz="claro"] .dia-bar,
[data-luz="claro"] .creditos,[data-luz="claro"] .forms,[data-luz="claro"] .prog,
[data-luz="claro"] .filtro button,[data-luz="claro"] .pacote,[data-luz="claro"] .extrato,
[data-luz="claro"] .tempo button,[data-luz="claro"] .search,[data-luz="claro"] .filt{
  box-shadow:0 1px 2px rgba(15,23,38,.05),0 1px 8px rgba(15,23,38,.04);
}
[data-luz="claro"] .round,[data-luz="claro"] .marc,[data-luz="claro"] .pay,
[data-luz="claro"] .campo input,[data-luz="claro"] .campo textarea,
[data-luz="claro"] .pt-linha,[data-luz="claro"] .motivo,[data-luz="claro"] .foto,
[data-luz="claro"] .escrever,[data-luz="claro"] .msg.deles{background:#fff}

/* 1. O lima vivo só preenche. Onde ele era TINTA, entra o verde escuro.
   🔴 E TINTA BRANCA TAMBÉM É TINTA: o número da parada e o "HB" do logotipo
   nasceram brancos pro fundo escuro. No claro isso mede 1,1:1 — some. Toda
   peça de tinta fixa (#fff cravado) tem que ter par claro. */
[data-luz="claro"] .num{background:#eef3fc;box-shadow:none;border-color:var(--blue);color:var(--blue)}
[data-luz="claro"] .num.lime{border-color:var(--lime);background:#eef7e2;color:var(--lime)}
[data-luz="claro"] .num.off{color:var(--ink-2)}
[data-luz="claro"] .logo .w b,[data-luz="claro"] .gps-manobra .dist{color:var(--ink)}
[data-luz="claro"] .logo small{color:#39445a}
[data-luz="claro"] .gravando{background:#fff5f5;border-color:#e6a3a3;color:var(--ink)}
[data-luz="claro"] .ext-linha .m.mais{background:#e4f3d2;color:#33660a}
[data-luz="claro"] .ext-linha .m.menos{background:#fbe3e3;color:#a01a16}
[data-luz="claro"] .previa.entra .marca{background:#e4f3d2;color:#33660a}
[data-luz="claro"] .previa.sai .marca{background:#fbe3e3;color:#a01a16}
[data-luz="claro"] .pt-linha .m{background:#fdf1de;color:#7a4a00}
[data-luz="claro"] .btn-blue,[data-luz="claro"] .enviar,[data-luz="claro"] .pacote .selo{color:#fff}
[data-luz="claro"] .num.off{border-color:var(--line-2);background:transparent}
[data-luz="claro"] .tag.lime{border-color:#a8cc6e;color:var(--lime);background:#f0f8e4}
[data-luz="claro"] .tag.blue{border-color:#9dbdf0;color:var(--blue);background:#eaf1fe}
[data-luz="claro"] .tag{border-color:var(--line-2);color:var(--ink-2)}
/* Os dois tons novos no claro: mesma regra das peles de cima — preenchimento
   pálido, borda que define o limite, tinta escura o bastante pra ler em 10px. */
[data-luz="claro"] .tag.amber{border-color:#e0b978;color:var(--amber);background:#fdf3e0}
[data-luz="claro"] .tag.red{border-color:#e6a3a3;color:var(--red);background:#fff5f5}
[data-luz="claro"] .who span.nota{color:#7a4a00}
[data-luz="claro"] .perna.alerta span{color:var(--red);border-color:#e6a3a3;background:#fff5f5}
[data-luz="claro"] .pill.lime{background:#eef7e2;border-color:#a8cc6e;color:var(--lime)}
[data-luz="claro"] .pill.blue{background:#eaf1fe;border-color:#9dbdf0;color:var(--blue)}
[data-luz="claro"] .pill.amber{background:#fdf1de;border-color:#e0b978;color:var(--amber)}
[data-luz="claro"] .pill.mute{background:#fff;border-color:var(--line-2);color:var(--ink-2)}
[data-luz="claro"] .chip.on{background:#f0f8e4;border-color:var(--lime);color:var(--lime)}
[data-luz="claro"] .montagem-dia.active,[data-luz="claro"] .dias button.on,
[data-luz="claro"] .tempo button.on{background:#f0f8e4;border-color:var(--lime);color:var(--lime)}
[data-luz="claro"] .filtro button.on{background:#f0f8e4;border-color:var(--lime);color:var(--lime)}
[data-luz="claro"] .pacote.on,[data-luz="claro"] .pay.sel{background:#f4faea;border-color:var(--lime)}
[data-luz="claro"] .price{background:#f4faea;border-color:var(--lime);color:var(--lime)}
[data-luz="claro"] .price::after{background:var(--bg)}
[data-luz="claro"] .form-c.total{background:#f4faea}
[data-luz="claro"] .ava{background:#eaf1fe;border-color:#9dbdf0;color:var(--blue)}
[data-luz="claro"] .ava.lime{background:#f0f8e4;border-color:#a8cc6e;color:var(--lime)}
[data-luz="claro"] .rowcard .ico{background:#eaf1fe;color:var(--blue)}
[data-luz="claro"] .rowcard .ico.lime{background:#f0f8e4;color:var(--lime)}
[data-luz="claro"] .linha-cfg .ico{background:#eef2f8;color:var(--ink-2)}
[data-luz="claro"] .thumb{background:#eaf1fe;border-color:#c2d6f5;color:var(--blue)}
[data-luz="claro"] .thumb.t-azul,[data-luz="claro"] .thumb.t-azul-escuro{color:var(--blue)}
[data-luz="claro"] .thumb.t-cinza{color:#455a78}
[data-luz="claro"] .thumb.t-lima{color:var(--lime)}
[data-luz="claro"] .marca.info{background:#eaf1fe;color:var(--blue)}
[data-luz="claro"] .map-ctrl button.ativo{background:#dbe8ff;color:var(--blue)}
[data-luz="claro"] .numwrap{background:#f3f6fb}
[data-luz="claro"] .stop.on{background:#eaf1fe;border-color:#9dbdf0}
[data-luz="claro"] .nav button.on{background:#eef7e2;color:var(--lime)}
/* 🔴 A CHAVE ERA INVISÍVEL NO CLARO: trilho #d5dded no cartão branco = 1,78:1,
   e a bola branca dentro do trilho = 1,36:1. Interruptor que não se enxerga é
   o pior tipo de defeito — o dono não sabe se está ligado. Agora quem define o
   limite é a BORDA (3,1:1 contra o branco), nos dois estados. */
[data-luz="claro"] .chave{background:#eef2f8;border-color:#75879f}
[data-luz="claro"] .chave i{background:#5d6d87}
[data-luz="claro"] .chave.on{background:var(--lima-viva);border-color:#4f8a00}
[data-luz="claro"] .chave.on i{background:#1e3406}
[data-luz="claro"] .dia-bar .trilho,[data-luz="claro"] .prog-b{background:#e2e8f2}
[data-luz="claro"] .dia-bar .trilho i,[data-luz="claro"] .prog-b i,
[data-luz="claro"] .splash-barra i{background:linear-gradient(90deg,var(--splash-marca),var(--splash-marca-2))}
[data-luz="claro"] .perna span{background:var(--bg);border-color:var(--line-2);color:var(--ink-2)}
/* Fundos escuros cravados que ficaram pra trás na 1ª passada — cada um destes
   era uma caixa preta no meio da tela clara. Achados pela varredura, não a olho. */
[data-luz="claro"] .week .mk{background:#f4faea;border-color:#a8cc6e}
[data-luz="claro"] .motivo.on{background:#fdf3e0;border-color:#e0b978}
[data-luz="claro"] .foto .quadro{background:#eaf1fe;color:var(--blue)}
[data-luz="claro"] .pt-nums,[data-luz="claro"] .pt-campo input,
[data-luz="claro"] .pt-campo .resto{background:#f7f9fc;border-color:var(--line)}
[data-luz="claro"] .tmx-sat .cont{border-color:#fff;color:#2b1a00}

/* 🔴 BRANQUEAR "TODO BOTÃO" APAGA O BOTÃO QUE IMPORTA. Esta regra existe pro
   botão FANTASMA (o secundário, que no escuro era transparente ou cor de
   cartão). Só que `[data-luz] .portao .acoes button` é mais forte que
   `.portao .acoes .azul`: o branco descia por cima do azul e do lima também.
   Medido no claro: o "Atualizar" ficava BRANCO NO BRANCO — 1:1, botão
   invisível. E o principal perdia o lima, virando gêmeo do secundário: numa
   tela de decisão, o dono deixava de enxergar qual é o caminho.
   O `:not()` devolve o fantasma pro fantasma. */
[data-luz="claro"] .passo button,[data-luz="claro"] .filtro button,
[data-luz="claro"] .ghost,
[data-luz="claro"] .erro .acoes button:not(.principal),
[data-luz="claro"] .conf .acoes button:not(.principal),
[data-luz="claro"] .portao .acoes button:not(.principal):not(.azul){background:#fff}

/* O botão principal mantém o lima VIVO, mas com tinta escura: 8,6:1.
   Branco sobre lima daria 1,8:1 — no sol do para-brisa some. */
[data-luz="claro"] .act.go{background:linear-gradient(180deg,#9ce02f,#6fb31c);
  box-shadow:0 6px 16px rgba(111,179,28,.28)}

[data-luz="claro"] .tmx-main button,[data-luz="claro"] .conf .acoes .principal,

[data-luz="claro"] .tmx-main button[data-estado="montar"]{background:linear-gradient(180deg,#3d8bff,#1f66e0);color:#fff}
[data-luz="claro"] .btn-blue,[data-luz="claro"] .conf .acoes .azul,
[data-luz="claro"] .portao .acoes .azul{color:#fff}
[data-luz="claro"] .enviar{background:var(--lima-viva);color:#16260a}
[data-luz="claro"] .pacote .selo{background:var(--lime);color:#fff}

/* 2. Brilho vira sombra. */
[data-luz="claro"] .gps-puck .gps-seta{filter:drop-shadow(0 2px 5px rgba(15,23,38,.35))}
[data-luz="claro"] .splash-barra i{box-shadow:none}
[data-luz="claro"] .splash-xis line{filter:drop-shadow(0 1px 3px rgba(63,122,0,.35));stroke:var(--splash-marca)}
[data-luz="claro"] .splash-flash{background:radial-gradient(circle,rgba(122,192,32,.5),rgba(122,192,32,0) 68%)}
[data-luz="claro"] .splash-anel{border-color:var(--splash-marca-2)}
[data-luz="claro"] .gravando .bola{background:#c0201b}

/* 3. Fundos de estado — tinta clara, borda visível. */
[data-luz="claro"] .banner.alerta{background:#fdf3e0;border-color:#e0b978;color:var(--amber)}
[data-luz="claro"] .banner.pausa{background:#eaf1fe;border-color:#9dbdf0;color:var(--blue)}
[data-luz="claro"] .banner b,[data-luz="claro"] .aviso strong{color:var(--ink)}
[data-luz="claro"] .aviso{background:#fff;border-color:var(--line-2);box-shadow:0 10px 26px rgba(15,23,38,.14)}
[data-luz="claro"] .aviso .ico{background:#eaf1fe;color:var(--blue)}
[data-luz="claro"] .aviso.ok .ico{background:#f0f8e4;color:var(--lime)}
[data-luz="claro"] .aviso.alerta .ico{background:#fdf3e0;color:var(--amber)}
[data-luz="claro"] .aviso .barra{background:#e2e8f2}
[data-luz="claro"] .recado{background:#fdf3e0;border-color:#e0b978}
[data-luz="claro"] .recado .ico{background:#f8e6c8;color:var(--amber)}

[data-luz="claro"] .msg.minha{background:#f0f8e4;border-color:#a8cc6e}
[data-luz="claro"] .scrim,[data-luz="claro"] .portao-wrap,
[data-luz="claro"] .conf-wrap,[data-luz="claro"] .erro-wrap{background:rgba(20,28,45,.42)}
[data-luz="claro"] .sheet{background:linear-gradient(180deg,#fff,#fbfcfe 30%);border-color:var(--line)}

[data-luz="claro"] .erro,[data-luz="claro"] .portao.trava{background:#fff5f5;border-color:#e6a3a3}
[data-luz="claro"] .erro .ico,[data-luz="claro"] .portao.trava .ico{background:#fbe3e3;color:#b3211c}
[data-luz="claro"] .erro .acoes .principal{background:#b3211c;border-color:#b3211c;color:#fff}
/* O satélite Cancelar ganhava BORDA VERMELHA no claro: virava um anel em volta
   de um ícone que já é vermelho — cor repetida em duas camadas. A borda volta
   pro fio neutro; quem diz "perigo" é o glifo. */
[data-luz="claro"] .acoes .perigo,[data-luz="claro"] .tmx-sat.tmx-perigo button{color:var(--red);border-color:var(--line-2)}
/* Sobras da 1ª passada do claro, achadas MEDINDO a borda (não a olho): as três
   pintavam fio escuro do tema de noite em cima do cartão branco. */
[data-luz="claro"] .act.perigo{border-color:#e6a3a3}
[data-luz="claro"] .tmx-sat.tmx-info button{border-color:#9dbdf0;color:var(--blue)}
[data-luz="claro"] .tmx-sat.tmx-aviso button{border-color:#e0b978;color:var(--amber)}
/* Campo com erro: no escuro o fundo é quase preto. No claro tem que ser um
   ROSA claro — senão o campo errado vira o único buraco preto da tela. */
[data-luz="claro"] .campo.erro input{border-color:#e6a3a3;background:#fff5f5}
[data-luz="claro"] .gps-rodape .sair{background:#fff;border-color:#e0a9a7;color:#a01a16}
[data-luz="claro"] .esq{background:linear-gradient(90deg,#e7ecf5 25%,#f4f7fb 50%,#e7ecf5 75%);background-size:280% 100%}
[data-luz="claro"] .vazio .ico{background:#fff;border-color:var(--line);color:var(--ink-3)}
[data-luz="claro"] [data-gestos] .stop::after{background:rgba(192,32,27,.14)}
[data-luz="claro"] [data-gestos] .stop.pronto{background:#fff2f1;border-color:var(--red)}

/* Barras fixas: branco sólido, separadas por fio — sem gradiente de fumaça. */
[data-luz="claro"] .nav,[data-luz="claro"] .tmx-dock,[data-luz="claro"] .gps-rodape{
  background:#fff;border-top-color:var(--line)}
[data-luz="claro"] .gps-manobra,[data-luz="claro"] .next-card,
[data-luz="claro"] .map-chip,[data-luz="claro"] .map-ctrl button,
[data-luz="claro"] .gps-bussola,[data-luz="claro"] .gps-vel,
[data-luz="claro"] .emp-chip,

[data-luz="claro"] .gps-manobra .baixo{background:#f4f7fb;border-top-color:var(--line)}
[data-luz="claro"] .gps-manobra.chegou .seta{background:#f0f8e4;color:var(--lime)}

/* O mapa claro: RUA BRANCA sobre quadra cinza — exatamente o oposto do escuro,
   onde a rua é que é escura. Sem isto o mapa fica preto no meio da tela clara. */
[data-luz="claro"] .app{
  --map-fundo:#e6ebf3; --map-quadra:#dbe2ed; --map-rua:#ffffff; --map-rua2:#f2f5fa;
  --map-parque:#d9ead9; --map-rotulo:#6b7a94; --map-pino:#ffffff;
  /* 🔴 O pino virou BRANCO no claro e o número dentro dele continuava branco:
     o "3" da parada da vez sumia dentro de um círculo branco gigante — foi o
     "mapa+fila bugado" da foto. Tinta do pino é token, como todo o resto. */
  --map-pino-tinta:#1c3d00;
  --map-rota:#5a9c10; --map-rota-borda:#3f7a00; --map-leito:#cfd8e6;
  /* No claro a cabeça INVERTE junto com o resto: sobre chão #e6ebf3 uma ponta
     branca não existiria. Azul cravado, que é o mesmo azul do "partida". */
  --map-cabeca:#0f4fc0;
  --map-carro:#28405f; --map-carro-borda:#16273c; --map-carro-vidro:#7f9ec4; --map-carro-2:#4a6a92;
  --map-bandeira:#16273c; --map-bandeira-2:#ffffff; --map-partida:#1257c8;

  /* 🔴 AS EMPRESAS NO CLARO SÃO DESENHO NOVO, NÃO CONVERSÃO — e por três
     motivos MEDIDOS, os mesmos três da lei desta folha:
     1. O LIMÃO VIVO NÃO ESCREVE NO BRANCO. `#b2ff43` sobre o mapa claro
        (#e8edf5) dá 1,18:1 — o nome da empresa simplesmente sumiria. No claro
        quem ESCREVE é a tinta escura; o verde vivo vira só preenchimento.
     2. BRILHO NÃO EXISTE NO CLARO. O halo verde que dá profundidade sobre o
        mapa escuro vira mancha suja sobre o mapa claro: ele cai pra um véu de
        opacidade baixa e o `text-shadow` do ponto vai a ZERO.
     3. O QUE DIZ "ACESA" MUDA DE LUGAR. No escuro é o anel que ganha luz; no
        claro é o PREENCHIMENTO do anel (branco → lima pálido) mais o fio
        verde escuro — a mesma gramática do `.num.lime` do resto do app. */
  /* 🔴 A APAGADA QUASE SUMIU NO CLARO, e não foi impressão: o cinza que é
     "discreto" sobre mapa escuro vira INVISÍVEL sobre mapa claro. Medido, o
     fio do anel dava 2,05:1 contra o fundo do mapa — abaixo dos 3:1 que
     componente de interface precisa. Escurecido até 3,27:1; a frente do
     prédio, que estava 2,3:1 contra o anel branco, foi pra 3,5:1.
     Apagada é DISCRETA, não ausente — ela é a empresa que ainda pode virar
     cliente, e o motorista tem que poder encostar o dedo nela. */
  --emp-frente:#7d8a9c; --emp-telhado:#95a1b1; --emp-lado:#6a7787;
  --emp-anel:#ffffff; --emp-anel-fio:#74839b;
  --emp-janela:#5b6b82;
  --emp-on-frente:#5c8a1c; --emp-on-telhado:#77aa33; --emp-on-lado:#456d12;
  --emp-on-anel:#eef7e2; --emp-on-fio:#3f7a00;
  --emp-on-halo:rgba(63,122,0,.22); --emp-on-borda:rgba(63,122,0,.18);
  --emp-janela-on:#fbffe0; --emp-janela-brilho:rgba(63,122,0,.30);
  --emp-brilho:rgba(90,156,16,.20);
  --emp-varre:rgba(18,87,200,.85); --emp-varre-fim:rgba(18,87,200,.12);
  /* 🔴 O PONTO É MAIS ESCURO QUE O `--lime` DO CLARO, e isso foi MEDIDO, não
     escolhido: com o `#3f7a00` da pele ele dava 4,47:1 contra o fundo do mapa
     claro (#e8edf5) — passa raspando ABAIXO do piso de 4,5. É um glifo de
     14px; não tem folga nenhuma pra "quase". Com `#356b00` dá 5,49:1. */
  --emp-nome:#0f1726; --emp-ponto:#356b00; --emp-ponto-brilho:rgba(63,122,0,0);
  --emp-trilho:#c3cfe1; --emp-barra:#5a9c10; --emp-barra-brilho:rgba(90,156,16,0);
  --emp-radar:rgba(18,87,200,.5); --emp-linha-scan:rgba(18,87,200,.18);
}
[data-luz="claro"] .gps{background:#e8edf5}
[data-luz="claro"] .gps-horizonte{background:linear-gradient(180deg,#e8edf5 22%,rgba(232,237,245,.72) 58%,transparent)}
/* 🔴 A CENA DE ENTRAR NA ROTA INVERTE NO CLARO, e não é só a cor do véu: a
   tela que fica pra trás vai pro lado OPOSTO — estoura em LUZ (brightness
   1.7) em vez de apagar (0.4). Sem isto o modo claro teria um véu branco
   nascendo em cima de uma tela que escurece, que é a cena brigando consigo
   mesma. O `:not(.voltando)` deixa a saída DO gps quieta (aquela é outro
   gesto), e o `!important` é obrigatório porque a regra base também é.  */
[data-luz="claro"] .tela.sai.cheio:not(.voltando){animation-name:mvCheioSaiClaro!important}
@keyframes mvCheioSaiClaro{to{opacity:0;transform:scale(.9);filter:brightness(1.7)}}

   leve). Aqui o traço é afinado num ponto só — 0,72 do original — em vez de
   reescrever 40 desenhos. Ícone e letra passam a ter o mesmo peso na tela. */
const afinar = svg => svg.replace(/stroke-width="([\d.]+)"/g,(m,w)=>`stroke-width="${(+w*0.72).toFixed(2)}"`);

/* 🔴 ÍCONE QUE NÃO EXISTE NÃO SAI CALADO (06/08).
   O `I[n] || ''` devolvia um <svg> VAZIO: o botão continuava lá, do tamanho
   certo, sem desenho nenhum. Foram 65 buracos em 32 das 33 telas — e o
   transmux perdeu justamente o Pausar e o Cancelar sem uma linha de erro.
   Nenhuma medida de layout pega isso, porque o layout está perfeito.
   Agora o nome errado vira uma CAIXA VERMELHA na tela e um aviso no console:
   mesma lei do CNEFE — best-effort que engole erro precisa de alarme. */
const ic=(n,s=18)=>{
  const desenho=I[n];
  if(!desenho){
    console.warn('[HBX 2.0] ícone inexistente no dicionário:',n);
    return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" aria-label="ícone ${n} não existe">
      <rect x="2.5" y="2.5" width="19" height="19" rx="4" fill="none" stroke="#f2555a" stroke-width="2"/>
      <path d="M8 8l8 8M16 8l-8 8" stroke="#f2555a" stroke-width="2" stroke-linecap="round"/></svg>`;
  }
  return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" aria-hidden="true">${afinar(desenho)}</svg>`;
};

/* ==========================================================================
   A BARRA — e ela é a ORDEM DE TUDO: dos botões, do arrastar e do que some.

   ITEM 9 DO DONO (07/08): *"deixar os módulos do motorista na mão do ADMIN
   (não dentro do app, no desktop)... desativar qualquer módulo q ele quiser
   (caderneta, clientes, produtos, chat, ajustes) MENOS ROTA"*.

   🔴 ROTA NUNCA SOME. O servidor já barra (mandar "rota" grava null), e esta
   linha é o cinto por cima do suspensório: app de entrega sem a rota não é
   app de entrega, e o motorista ficaria numa tela sem saída.

   🔴 DESLIGADO SOME DE VERDADE — não é só o botão. Sai da barra, sai do
   arrastar (`arrastarModulo`), não abre por rota direta (`ir`) e os ATALHOS
   que levavam pra lá somem junto (`podarDesligados`). Botão que existe e não
   leva a lugar nenhum é pior que botão ausente.

   🔴 SEM FONTE, NADA SOME. `DADOS.barra.desligados` nasce VAZIO e só a ponte
   escreve, depois que o servidor responde. Rede caída NÃO pode esconder
   módulo — é a mesma lei do esqueleto: "vazio porque o servidor disse" e
   "vazio porque a rede caiu" são opostos, e aqui o padrão do silêncio é
   MOSTRAR TUDO.
   ========================================================================== */
/* 🔴 BARRA DE 3 (decisão do dono, 07/08): Chat na esquerda, Rota no centro,
   Ajustes na direita — padrão de app de motorista. Caderneta, Clientes e
   Produtos NÃO morreram: Clientes/Produtos moram em Ajustes › Cadastro e a
   caderneta abre pelo caixa da Rota (e por Ajustes). O CSV do admin continua
   valendo pra essas entradas via `podarDesligados`/`ir`. */
const NAV_ITENS=[['chat','Chat','chat'],['rota','Rota','map'],['ajustes','Ajustes','gear']];
/** O CSV que o admin gravou no desktop, virado em lista. Vazio = tudo ligado. */
function modulosDesligados(){
  return String((DADOS.barra&&DADOS.barra.desligados)||'')
    .split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
}
function moduloDesligado(k){
  if(k==='rota') return false;                       // a lei, de novo e aqui
  if(k==='ajustes') return false;                    // é a porta de tudo agora — murar é prender
  return modulosDesligados().includes(String(k||'').toLowerCase());
}
/** Os módulos que o motorista PODE ver — a ordem é a da barra, sempre. */
const navLigados=()=>NAV_ITENS.filter(([k])=>!moduloDesligado(k));

function nav(ativo){
  return `<nav class="nav">${navLigados().map(([k,l,i])=>
    `<button data-nav="${k}" class="${ativo===k?'on':''}">${ic(i,18)}<span>${l}</span>${ativo===k?'<i class="ping"></i>':''}</button>`
  ).join('')}</nav>`;
}

/* Os atalhos espalhados pelas telas (o "Abrir caderneta" do pé da rota, por
   exemplo) apontam pro módulo por `data-ir`. Se o admin desligou o módulo,
   esse botão vira porta pra parede — o `ir` recusa e o motorista toca duas,
   três vezes achando que o app travou. Some com ele na pintura, por REGRA:
   um lugar só, e vale pra qualquer atalho que apareça amanhã. */
function podarDesligados(tela){
  if(!modulosDesligados().length) return;            // nada desligado: nem varre
  tela.querySelectorAll('[data-ir]').forEach(el=>{
    if(moduloDesligado(el.dataset.ir)) el.remove();
  });
  // Caixa dos Ajustes que ficou vazia leva o título junto — título de pé
  // sobre caixa vazia é a mesma mentira do slot sem fonte.
  tela.querySelectorAll('.cartao-lista').forEach(c=>{
    if(!c.children.length){
      const t=c.previousElementSibling;
      if(t&&t.classList.contains('grupo')) t.remove();
      c.remove();
    }
  });
}

/* ==========================================================================

   O botão do meio é SEMPRE o que se faz agora; os satélites são no máximo dois
   e trocam de dono conforme o estado. Regra dura vinda do app: quando o sino
   de rotas recebidas e o Cancelar disputam a esquerda, o Cancelar fica (ele
   controla trabalho em andamento) e o sino só assume com a rota parada.
   ========================================================================== */
const ROTA_ESTADOS={
  montar:   {main:{acao:'montar', glifo:'route', rotulo:'Montar rota'},
             esq:{tipo:'aviso', glifo:'bell', rotulo:'Rotas recebidas', contagem:2},
             dir:{tipo:'info', glifo:'plus', rotulo:'Rota rápida'}},
  pronta:   {main:{acao:'iniciar', glifo:'play', rotulo:'Iniciar'},
             esq:{tipo:'perigo', glifo:'close', rotulo:'Cancelar', acao:'cancelar-rota'},
             dir:{tipo:'info', glifo:'route', rotulo:'Adicionar'}},
  rodando:  {main:{acao:'pausar', glifo:'pause', rotulo:'Pausar'},
             esq:{tipo:'perigo', glifo:'stop', rotulo:'Cancelar', acao:'cancelar-rota'},
             dir:{tipo:'info', glifo:'route', rotulo:'Adicionar'}},
  pausada:  {main:{acao:'continuar', glifo:'play', rotulo:'Continuar'},
             esq:{tipo:'perigo', glifo:'stop', rotulo:'Cancelar', acao:'cancelar-rota'},
             dir:{tipo:'info', glifo:'route', rotulo:'Adicionar'}},
};
function transmux(estado){
  const c=ROTA_ESTADOS[estado]; if(!c) return '';
  const sat=(s,lado)=>s?`<span class="tmx-sat tmx-${s.tipo} tmx-${lado}">
      <button aria-label="${s.rotulo}"${s.acao?` data-acao="${s.acao}"`:''}>${ic(s.glifo,20)}${s.contagem?`<i class="cont">${s.contagem}</i>`:''}</button>
      <small>${s.rotulo}</small></span>`:'<span></span>';
  return `<div class="transmux">${sat(c.esq,'esq')}
    <span class="tmx-main">
      <button data-estado="${c.main.acao}" aria-label="${c.main.rotulo}">${ic(c.main.glifo,34)}</button>
      <small>${c.main.rotulo}</small></span>
    ${sat(c.dir,'dir')}</div>`;
}

function stop(o){
  const cor=o.cor||'blue';
  /* 🔴 O GANCHO NASCE DO DADO. A parada só vira botão quando tem `id` — que só
     existe quando o dado é REAL. No mock (paradas de maquete, sem id) o cartão
     continua inerte e a tela sai byte a byte igual à de antes. */
  const gancho=o.id?` data-acao="abrir-parada" data-parada="${o.id}"`:'';
  return `<div class="stop ${o.on?'on':''}"${gancho}>
    <span class="grip"></span>
    <span class="numwrap"><span class="num ${cor==='lime'?'lime':cor==='off'?'off':''}">${o.n}</span>

}

/** Entra dado novo numa seção e a tela se repinta — SÓ se algo mudou de verdade.
    🔴 O FREIO DO PISCA (07/08): a ponte relê a config a cada minuto e a cada
    volta de foco, e escrevia aqui mesmo com o dado idêntico — e cada escrita
    troca o DOM inteiro (`pintar` monta outra camada). Tela repintando por
    minuto na cara do motorista era o "fica piscando às vezes". Dado igual
    morre aqui, sem repinte; quem muda de verdade continua pintando na hora. */
function usarDados(secao,valor){
  const atual=DADOS[secao]||{}, novo=valor||{};
  const mudou=Object.keys(novo).some(k=>JSON.stringify(atual[k])!==JSON.stringify(novo[k]));
  if(!mudou) return;
  DADOS[secao]=Object.assign({},atual,novo);
  if(typeof pintar==='function') pintar(false);
}

/* ==========================================================================
   A 1ª PINTURA DE QUEM BUSCA NO SERVIDOR — esqueleto, nunca demonstração.

   🔴 Tela que carrega ao abrir nascia com o dado de DEMONSTRAÇÃO desta folha
   (João da Silva, Mercadinho Bom Preço). São 60 ms na bancada, mas numa rede
   ruim o motorista lê nome de cliente que não existe — mentira com cara de app
   pronto. Agora nasce ESQUELETO; e se a fonte não responder, nasce o aviso, não
   uma lista vazia que finge que a base está vazia (a Lei nº1: "vazio porque o
   servidor disse vazio" e "vazio porque a rede caiu" são opostos).

   `carregando` e `semFonte` nascem AUSENTES em `DADOS`: quem os liga é a ponte,
   no aparelho. Então o mock — que é o DESENHO — continua byte a byte o mesmo.
   ========================================================================== */
/* 🔴 As barras vão SOLTAS, nunca dentro do `.lista-card`: o `.esq` é feito de
   `var(--card)` e o cartão TEM `background:var(--card)` — esqueleto dentro do
   cartão fica invisível (medido: um retângulo vazio). É por isso que a `rota`
   já desenhava assim, contra o fundo da página. */
const esqLista=(n)=>`<div style="margin-top:6px">${'<div class="esq esq-linha"></div>'.repeat(n)}</div>`;
const semFonte=(glifo,acao)=>`<div class="vazio">

  <span>Sem resposta do servidor agora.</span>

/** O miolo de uma tela de lista: esqueleto → aviso → o conteúdo de verdade. */
const miolo=(d,glifo,acao,linhas,conteudo)=>
  d.carregando ? esqLista(linhas) : d.semFonte ? semFonte(glifo,acao) : conteudo;

/* O MUNDO DO GPS — desenhado achatado e inclinado pelo CSS. A rua em que se
   anda é a coluna do meio: como o carro fica no centro horizontal, ele cai em
   cima dela em qualquer altura, e o giro à direita aparece lá na frente. */
function mapaGps(){ return `<div class="mapa-palco" data-mapa="gps">${mapaGpsDesenho()}</div>`; }
function mapaGpsDesenho(){
  const quadra=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="var(--map-quadra)"/>`;
  /* UM TRAÇO DA COBRA = dois caminhos no mesmo `d`: o CORPO, que cresce, e a
     CABEÇA, um risco curto e aceso viajando colado na ponta (a conta mora na
     folha de estilo, no bloco "3 — A COBRA").
       `l`   comprimento do caminho, em unidades do viewBox — a régua do
             `stroke-dashoffset`. Escrito à mão porque TODA linha aqui é reta:
             é a soma dos segmentos. Medir com `getTotalLength()` obrigaria o
             desenho a estar no DOM antes do primeiro quadro da cena, e a cena
             não pode depender de nada ter subido.
       ini   a hora de brotar · `dur` quanto leva · `cab` a espessura da
             cabeça (0 = galho SEM cabeça).
     🔴 CABEÇA SÓ NOS TRAÇOS QUE MANDAM — tronco, avenidas, ruas do horizonte e
     a rota: 6 e não 20. Cada caminho a mais é o mundo em perspectiva inteiro
     repintado de novo a cada quadro, e esta é a tela mais cara do app (medida
     lá embaixo). Os galhos que saem de trás da via principal já se leem pelo
     próprio crescimento — quem precisa da ponta acesa é quem LIDERA. */
  const traco=(d,l,ini,dur,cor,w,cab)=>
    `<path class="m-corpo" d="${d}" fill="none" stroke="${cor}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" style="--l:${l}px;--d:${ini}s;--t:${dur}s"/>`+
    (cab?`<path class="m-cabeca" d="${d}" fill="none" stroke-width="${cab}" stroke-linecap="round" stroke-linejoin="round" style="--l:${l}px;--h:${cab*5}px;--d:${ini}s;--t:${dur}s"/>`:'');
  const RUA='var(--map-rua2)', TRONCO='M400 1420 V520 H800';
  /* AS RUAS QUE BROTAM DO TRONCO: [y do cruzamento, hora]. A hora é onde a
     ponta do tronco passa nele — (1420-y)/1300 do percurso, começando em .26
     e durando .52 s. Elas saem PROS DOIS LADOS a partir de x=400, que é o que
     dá o galho abrindo em vez de a rua acendendo. */
  const cruz=[[1180,.36],[960,.44],[750,.53],[555,.61]];
  /* 🔴 A ORDEM DE PINTURA NÃO É A ORDEM DO TEMPO, e as duas convivem: no SVG
     quem vem depois cobre quem veio antes, então as ruas finas têm que ficar
     EMBAIXO do leito da rota (senão elas riscam por cima da pista, que é o
     desenho errado). O tronco nasce aos 260 ms mas é pintado depois das ruas
     — e é por isso que cada galho parece SAIR DE TRÁS da via principal. */
  return `<div class="gps-mundo"><svg viewBox="0 0 800 1400" preserveAspectRatio="xMidYMax slice">
    <rect width="800" height="1400" fill="var(--map-fundo)"/>
    <path d="M600 180h230v210H600z" fill="var(--map-parque)"/>
    ${quadra(40,1000,300,140)}${quadra(460,1000,300,140)}${quadra(40,780,300,150)}
    ${quadra(460,780,300,150)}${quadra(40,590,300,120)}${quadra(460,590,300,120)}
    ${quadra(40,380,300,140)}${quadra(60,180,250,120)}
    <g class="m-cobra">
      ${cruz.map(([y,q])=>traco(`M400 ${y}H-40`,440,q,.30,RUA,17,0)+traco(`M400 ${y}H840`,440,q,.30,RUA,17,0)).join('')}
      ${traco('M110 1180V-20',1200,.56,.42,RUA,13,8)}${traco('M110 1180V1420',240,.56,.18,RUA,13,0)}
      ${traco('M690 1180V-20',1200,.56,.42,RUA,13,8)}${traco('M690 1180V1420',240,.56,.18,RUA,13,0)}
      ${traco('M110 350H840',730,.85,.30,RUA,17,10)}${traco('M110 350H-40',150,.85,.10,RUA,17,0)}
      ${traco('M690 165H-40',730,.92,.30,RUA,17,10)}${traco('M690 165H840',150,.92,.10,RUA,17,0)}
      ${traco(TRONCO,1300,.26,.52,'var(--map-leito)',48,16)}
      ${traco(TRONCO,1300,.84,.42,'var(--map-rota-borda)',34,0)}
      ${traco(TRONCO,1300,.84,.42,'var(--map-rota)',23,16)}
    </g>
    <g class="m-pontilhado" stroke="var(--map-fundo)" stroke-width="3" stroke-dasharray="16 22" opacity=".5">
      <path d="M400 1420 V520 H800" fill="none"/>
    </g>
  </svg></div>`;
}

/* 2 — ROTA INICIADA = GPS ------------------------------------------------
   Ordem do dono (06/08): "suma tudo ao redor, ficar igual GPS". Aqui não
   existe cabeçalho, abas nem cartão de resumo — só o mapa, a parada da vez e
   UMA ação. O "Chegou" não fica aceso: ele nasce quando o aparelho chega
   (regra que já existe no app hoje, pelo raio de chegada).
   -------------------------------------------------------------------------- */
/* Dois estados, dois MAPAS diferentes — e essa é a regra, não enfeite:
   DIRIGINDO → mapa inclinado, girado pelo rumo, carro a 68%, manobra mandando.
   CHEGOU    → a navegação ACABOU. Volta o mapa de VISÃO GERAL (o mesmo da
               rota), porque a pergunta mudou: não é mais "por onde eu vou",
               é "onde eu estou e o que falta". Manter a visão de direção com
               o carro parado na porta é tela mentindo sobre o que se faz ali. */
/* AS EMPRESAS DO CORREDOR — duas camadas, e a divisão tem motivo:
   `empresasChao()` é MUNDO e entra ANTES da névoa do horizonte, pra empresa
   lá longe ficar embaçada junto com a rua (é o que faz ela parecer estar no
   chão, e não colada no vidro); `empresasCromo()` é INTERFACE e entra depois,
   por cima de tudo.

   🔴 Só na tela de DIRIGINDO. Na de "chegou" a pergunta é outra — o motorista
   está na porta e a tela tem UMA ação — e cinco prédios em cima dela seriam
   ruído numa hora em que ninguém vai prospectar.

   🔴 O GANCHO NASCE DO DADO: `data-acao` só sai quando a empresa tem `id`
   real, e `data-lat/lng` só saem quando há coordenada. É isso que mantém
   desenho e app byte a byte iguais — e que impede botão sem porta. */
function empresasDoMapa(){ const d=DADOS.mapa||{}; return Array.isArray(d.empresas)?d.empresas:[]; }
function empresasChao(){
  const lista=empresasDoMapa(); if(!lista.length) return '';
  const jan=(o)=>[0,1,2,3,4,5].map(i=>{
    const p=Array.isArray(o)?o.indexOf(i):i;   // -1 = fila mal formada: cai na ordem natural
    return `<i style="--j:${p<0?i:p}"></i>`;
  }).join('');
  return lista.map(e=>{
    const nome=e.nome||'';
    const gancho=e.id?` data-acao="abrir-empresa" data-empresa="${e.id}"`:'';
    const geo=(e.lat!=null&&e.lng!=null)?` data-lat="${e.lat}" data-lng="${e.lng}" data-dist="${e.distM||0}"`:'';
    return `<div class="emp${e.aceso?' on':''}"${gancho}${geo}
      style="--x:${e.x||'50%'};--y:${e.y||'50%'};--esc:${e.esc||1};--n:${nome.length||1};--atraso:${e.atraso||'0s'}">
      <span class="emp-obj">
        <span class="emp-halo"></span><span class="emp-varre"></span><span class="emp-anel"></span>
        <span class="emp-rabo"></span>
        <span class="emp-predio"><i class="telhado"></i><i class="lado"></i><i class="frente"></i>
          <span class="emp-janelas">${jan(e.ordem)}</span></span>
      </span>
      <span class="emp-rotulo">
        <span class="emp-linha"><i class="pt">•</i><b class="emp-nome">${nome}</b></span>
        <span class="emp-trilho"><i class="emp-barra"></i></span></span>
    </div>`;
  }).join('');
}
function empresasCromo(){
  const d=DADOS.mapa||{}; if(!empresasDoMapa().length) return '';
  return `${d.chip?`<div class="emp-chip">${d.chip}</div>`:''}<div class="emp-scan"></div>`;
}

/* 🔴 NENHUM LITERAL AQUI DENTRO. Todo o cromo desta tela vem de `DADOS.gps`
   (ver o seam, seção L3b) e cada pedaço SÓ EXISTE se tiver fonte.
   `trilha` é a régua: o " · " é do `join`, nunca do template — assim o campo
   que não veio leva o separador embora junto, em vez de deixar um "·" órfão
   boiando no mapa. */
function telaGps(chegou){
  const g=DADOS.gps||{};
  const trilha=(ps)=>ps.filter(Boolean).join(' · ');
  const paradaDeM=(g.paradaN&&g.paradaTotal)?`Parada <b>${g.paradaN} de ${g.paradaTotal}</b>`:'';
  /* o número grande + o rótulo embaixo: sem número não sobra rótulo sozinho
     ("chegada" sem hora é uma coluna vazia com legenda). */
  const num=(v,rot,destaque)=>v
    ?`<span class="n${destaque?' destaque':''}"><b>${v}</b>${rot?`<small>${rot}</small>`:''}</span>`:'';

  if(chegou){
    const rodape=trilha([paradaDeM,g.chegouFaltam?`${g.chegouFaltamVerbo||''} <b>${g.chegouFaltam}</b>`:'',
      g.chegouKm?`<b>${g.chegouKm}</b>`:'']);
    const baixo=trilha([g.chegouEndereco,g.chegouPrecisao?`${ic('gps',13)} ${g.chegouPrecisao}`:'']);
    return `${status}
<div class="body flush" style="overflow:hidden;padding:0">
  <div class="gps">
    ${mapa()}
    <div class="gps-manobra chegou">
      <div class="cima">
        <span class="seta">${ic('check',26)}</span>
        <span>${g.chegouTitulo?`<b class="dist">${g.chegouTitulo}</b>`:''}${g.paradaNome?`
          <span class="verbo">${g.paradaNome}</span>`:''}</span>
      </div>
      ${baixo?`<div class="baixo">${baixo}</div>`:''}
    </div>
    <div class="gps-lado" style="bottom:118px">
      <button aria-label="Recentralizar">${ic('target',18)}</button>
    </div>
    <div class="gps-rodape">
      ${rodape?`<div class="parada">${ic('route',14)} ${rodape}</div>`:''}
      <button class="act go full" style="justify-content:center">${ic('check',20)}<b>${g.chegouAcao||''}</b></button>
    </div>
  </div>
</div>`;
  }

  /* A MANOBRA INTEIRA SOME sem trajeto — cartão arredondado vazio no topo do
     mapa é cromo fingindo que sabe pra onde ir. */
  const manobraBaixo=trilha([g.manobraRua,g.manobraDepois]);
  const manobra=(g.manobraIcone||g.manobraDist||g.manobraVerbo||manobraBaixo)
    ?`<div class="gps-manobra">
      <div class="cima">
        ${g.manobraIcone?`<span class="seta">${ic(g.manobraIcone,26)}</span>`:''}
        <span>${g.manobraDist?`<b class="dist">${g.manobraDist}</b>`:''}${g.manobraVerbo?`<span class="verbo">${g.manobraVerbo}</span>`:''}</span>
      </div>
      ${manobraBaixo?`<div class="baixo">${manobraBaixo}</div>`:''}
    </div>`:'';
  const rodape=trilha([paradaDeM,g.paradaNome?`<b>${g.paradaNome}</b>`:'']);

  return `${status}
<div class="body flush" style="overflow:hidden;padding:0">
  <div class="gps dirigindo">
    ${mapaGps()}
    ${empresasChao()}
    <div class="gps-horizonte"></div>
    ${empresasCromo()}

    <!-- O VÉU DA ENTRADA. Ele não guarda dado nenhum e não sabe se o mapa
         subiu: é só a cena de "entrar na rota", com hora pra começar e hora
         pra acabar. Parado ele é invisível — quem o acende é a classe "cena"
         da camada, e ela cai aos 900 ms. (Sem CRASE aqui dentro: este
         comentário mora num template literal e a crase o fecharia.) -->
    <div class="gps-veu"></div>

    <!-- eu: fixo a 68% da altura, no centro. A tela é a rua À FRENTE. -->
    <div class="gps-puck">
      <!-- o radar pulsa porque há o que varrer: sem empresa no corredor ele não
           existe, senão a tela finge procurar o que não está lá. -->
      ${empresasDoMapa().length?'<span class="emp-radar"><i></i><i></i></span>':''}
      <span class="gps-facho"></span>
      <svg class="gps-seta" viewBox="0 0 34 38">
        <path d="M17 1.5 L31.5 35 L17 27 L2.5 35 Z" fill="#3d8bff" stroke="#eaf1ff" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- a manobra manda: distância grande, verbo grande, rua embaixo -->
    ${manobra}

    <!-- bússola: só existe porque o mapa gira pelo rumo — sem rumo, ela não
         tem o que apontar e sai de cena inteira -->
    ${g.rumo?`<div class="gps-bussola">
      <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 3.5 L16 13 L12 10.6 L8 13 Z" fill="#ff8b85"/></svg>${g.rumo}
    </div>`:''}
    ${g.velocidade?`<div class="gps-vel"><b>${g.velocidade}</b>${g.velocidadeUnidade?`<small>${g.velocidadeUnidade}</small>`:''}</div>`:''}
    <div class="gps-lado">
      <button aria-label="Silenciar voz">${ic('volume',18)}</button>
      <button aria-label="Recentralizar">${ic('target',18)}</button>
    </div>

    <!-- 🔴 O RODAPÉ PODE FICAR SÓ COM O "Encerrar", e é o certo: ele é a PORTA
         DE SAÍDA da navegação. Motorista preso nesta tela é pior que qualquer
         número faltando — por isso o "encerrar" é COPY e nunca zera. (Sem
         CRASE aqui dentro: este comentário mora num template literal.) -->
    <div class="gps-rodape">
      ${rodape?`<div class="parada">${ic('route',14)} ${rodape}</div>`:''}
      <div class="linha">
        ${num(g.chegada,g.chegadaRotulo,1)}
        ${num(g.restante,g.restanteRotulo,0)}
        ${num(g.distancia,g.distanciaRotulo,0)}
        <button class="sair" data-ir="rota">${g.encerrar||''}</button>
      </div>
    </div>
  </div>
</div>`;
}

      <line class="rastro haste-b" x1="0" y1="0" x2="0" y2="0"/>

      <line class="haste-b" x1="0" y1="0" x2="0" y2="0"/>
    </svg>
    <i class="splash-flash"></i>
    <div class="splash-centro">
      <span class="splash-anel"></span>
      <div class="splash-logo">
        <div class="w"><b>H</b><b>B</b><em>X</em><i class="splash-brilho"></i></div>

      </div>
      <div class="splash-barra"><i></i></div>

/** Põe as duas hastes exatamente em cima das diagonais do glifo do X, e o
 *  clarão no cruzamento. Medido, nunca chutado — a haste é a MESMA forma que o
 *  glifo assume depois; 2px de erro aqui viram um pulo visível na troca. */
function ajustarHastes(camada){
  const splash=camada.querySelector('.svg-ok, .splash'); if(!splash) return;
  const em=splash.querySelector('.w em'); if(!em) return;
  const pos=(n,c)=>{let x=0,y=0;while(n&&n!==c){x+=n.offsetLeft;y+=n.offsetTop;n=n.offsetParent;}return{x,y};};
  const p=pos(em,splash);
  const cx=p.x+em.offsetWidth/2, cy=p.y+em.offsetHeight/2;
  const hw=em.offsetWidth*.34, hh=em.offsetHeight*.30;
  const põe=(sel,x1,y1,x2,y2)=>splash.querySelectorAll(sel).forEach(l=>{
    l.setAttribute('x1',x1.toFixed(1)); l.setAttribute('y1',y1.toFixed(1));
    l.setAttribute('x2',x2.toFixed(1)); l.setAttribute('y2',y2.toFixed(1));});
  põe('.haste-a', cx-hw, cy-hh, cx+hw, cy+hh);   // desce da esquerda pra direita
  põe('.haste-b', cx+hw, cy-hh, cx-hw, cy+hh);   // sobe da direita pra esquerda
  const fl=splash.querySelector('.splash-flash');
  if(fl){ fl.style.left=(cx-48)+'px'; fl.style.top=(cy-48)+'px'; fl.style.marginLeft='0'; }
}

  const cel=(v,rot,cor)=>v?`<span class="c"><span><b${cor?` style="color:${cor}"`:''}>${v}</b><small>${rot}</small></span></span>`:'';

     dois vazios são opostos (Lei nº1 desta frente). Com ele: esqueleto na

   navegação` não existem em campo nenhum do servidor; `Conferência de rota`
   (`rotaConferidaAtiva`) o app só LÊ — não está no UpdateLogisticaConfigDto, e o
   ValidationPipe (forbidNonWhitelisted) devolve 400 pra quem tentar gravar;

   grava, por `PATCH /logistica/config/modo-rota`). A "Zona de perigo" foi junto:

   na ponte), e "Desvincular este aparelho" É o `logout()` — o mesmo que o "Sair"

   é a lei "mostra num lugar, edita num lugar" quebrada.
