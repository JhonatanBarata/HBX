  <rect width="1200" height="900" rx="28" fill="#F8FAFC"/>
  <text x="52" y="72" class="label" style="font-size:32px">HBX Radar — Card Icons</text>
  <text x="52" y="103" class="sub" style="font-size:15px">Assets aprovados para cards desktop/mobile em modo claro e escuro</text>
