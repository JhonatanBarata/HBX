<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none">
  <title>HBX Radar Card Icons</title>
  <desc>Reusable SVG icon asset board for HBX Radar lead cards. Use symbols by id or copy individual groups into frontend components.</desc>
  <defs>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0EA5E9"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="coinGold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FDE68A"/><stop offset="0.45" stop-color="#F59E0B"/><stop offset="1" stop-color="#D97706"/></linearGradient>
    <linearGradient id="igGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F97316"/><stop offset="0.45" stop-color="#EC4899"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <filter id="softBlueShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.25"/></filter>
    <style>
      .label{font:600 16px Inter,Arial,sans-serif;fill:#0F172A}.sub{font:500 12px Inter,Arial,sans-serif;fill:#64748B}.darkLabel{fill:#E2E8F0}.strokeBlue{stroke:#2563EB}.strokeSlate{stroke:#64748B}.strokeGreen{stroke:#16A34A}.strokeAmber{stroke:#F59E0B}.strokeRed{stroke:#EF4444}.fillBlue{fill:#2563EB}.fillGreen{fill:#16A34A}.fillAmber{fill:#F59E0B}.fillSlate{fill:#64748B}.iconTile{fill:#FFFFFF;stroke:#CBD5E1}.iconTileDark{fill:#0F172A;stroke:#1E3A5F}.pillText{font:700 15px Inter,Arial,sans-serif}.smallText{font:600 11px Inter,Arial,sans-serif}
    </style>
    <symbol id="hbx-card-icon-instagram" viewBox="0 0 48 48">
      <rect x="7" y="7" width="34" height="34" rx="10" stroke="url(#igGrad)" stroke-width="3"/>
      <circle cx="24" cy="24" r="8" stroke="url(#igGrad)" stroke-width="3"/>
      <circle cx="33" cy="15" r="2.5" fill="#EC4899"/>
    </symbol>
    <symbol id="hbx-card-icon-facebook" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="18" fill="#1877F2"/>
      <path d="M27.8 25.4h4.4l.7-5.2h-5.1v-3.3c0-1.5.4-2.5 2.6-2.5H33V9.8c-.5-.1-2.2-.2-4.2-.2-4.1 0-6.9 2.5-6.9 7v3.6h-4.6v5.2h4.6V39h5.9V25.4Z" fill="#fff"/>
    </symbol>
    <symbol id="hbx-card-icon-whatsapp" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="18" fill="#22C55E"/>
      <path d="M15.5 34.5l1.7-6A11 11 0 1 1 21 32l-5.5 2.5Z" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M20 18.5c.5-1 1.1-1 1.8-.4l1.2 2c.2.4.2.8-.1 1.1l-.8.9c.9 1.8 2.2 3.1 4 4l.9-.8c.4-.3.8-.3 1.2 0l1.9 1.2c.7.4.7 1 .3 1.7-.7 1.3-2.2 1.8-3.7 1.4-4.2-1.1-7.2-4-8.4-8.2-.4-1.3.2-2.4 1.7-2.9Z" fill="#fff"/>
    </symbol>
    <symbol id="hbx-card-icon-globe" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="18" stroke="#0EA5E9" stroke-width="3"/>
      <path d="M6 24h36M24 6c5 5.3 7.5 11.3 7.5 18S29 36.7 24 42M24 6c-5 5.3-7.5 11.3-7.5 18S19 36.7 24 42" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="hbx-card-icon-email" viewBox="0 0 48 48">
      <rect x="8" y="12" width="32" height="24" rx="4" fill="#2563EB"/>
      <path d="M10 15l14 11 14-11" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="hbx-card-icon-location" viewBox="0 0 48 48">
