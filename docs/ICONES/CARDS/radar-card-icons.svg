      <g transform="translate(162 0)"><rect width="172" height="42" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/><use href="#hbx-card-icon-loading" x="14" y="9" width="24" height="24"/><text x="48" y="27" class="pillText" fill="#2563EB">Enriquecendo</text></g>
      <g transform="translate(354 0)"><rect width="164" height="42" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/><use href="#hbx-card-icon-users" x="14" y="9" width="24" height="24"/><text x="48" y="27" class="pillText" fill="#475569">Social parcial</text></g>
      <g transform="translate(538 0)"><rect width="224" height="42" rx="12" fill="#EAF8EF" stroke="#BBF7D0"/><use href="#hbx-card-icon-whatsapp" x="14" y="9" width="24" height="24"/><text x="48" y="27" class="pillText" fill="#15803D">WhatsApp confirmado</text></g>
      <g transform="translate(782 0)"><rect width="112" height="42" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/><use href="#hbx-card-icon-lead-plus" x="14" y="9" width="24" height="24"/><text x="48" y="27" class="pillText" fill="#2563EB">Lead+</text></g>
      <g transform="translate(914 0)"><rect width="158" height="42" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/><use href="#hbx-card-icon-shield" x="14" y="9" width="24" height="24"/><text x="48" y="27" class="pillText" fill="#2563EB">Alta confiança</text></g>
    </g>
  </g>
  <g transform="translate(52 480)">
