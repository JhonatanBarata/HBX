      <g transform="translate(100 0)"><use href="#hbx-card-icon-quality" width="52" height="52"/><text y="78" x="26" text-anchor="middle" class="sub">Qualidade</text></g>
      <g transform="translate(210 0)"><use href="#hbx-card-icon-shield" width="52" height="52"/><text y="78" x="26" text-anchor="middle" class="sub">Confiança</text></g>
      <g transform="translate(320 0)"><use href="#hbx-card-icon-lightbulb" width="52" height="52"/><text y="78" x="26" text-anchor="middle" class="sub">Insight</text></g>
      <g transform="translate(430 0)"><use href="#hbx-card-icon-target" width="52" height="52"/><text y="78" x="26" text-anchor="middle" class="sub">Canal</text></g>
      <g transform="translate(540 0)"><use href="#hbx-card-icon-lightning" width="52" height="52"/><text y="78" x="26" text-anchor="middle" class="sub">Ação</text></g>
      <g transform="translate(650 0)"><use href="#hbx-card-icon-copy" width="52" height="52"/><text y="78" x="26" text-anchor="middle" class="sub">Copiar</text></g>
      <g transform="translate(760 0)"><use href="#hbx-card-icon-external" width="52" height="52"/><text y="78" x="26" text-anchor="middle" class="sub">Abrir</text></g>
      <g transform="translate(870 0)"><use href="#hbx-card-icon-filter" width="52" height="52"/><text y="78" x="26" text-anchor="middle" class="sub">Filtro</text></g>
      <g transform="translate(980 0)"><use href="#hbx-card-icon-radar" width="52" height="52"/><text y="78" x="26" text-anchor="middle" class="sub">Radar</text></g>
