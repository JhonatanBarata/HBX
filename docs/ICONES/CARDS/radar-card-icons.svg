    <g transform="translate(0 35)"><use href="#hbx-card-icon-coin-stack" width="72" height="72"/><text x="92" y="44" class="pillText" fill="#F97316">- 2 créditos</text></g>
    <g transform="translate(340 20)" filter="url(#softBlueShadow)"><circle cx="55" cy="55" r="48" stroke="url(#blueGlow)" stroke-width="9" stroke-linecap="round" stroke-dasharray="220 300"/><text x="55" y="54" text-anchor="middle" class="label" style="font-size:30px">82</text><text x="55" y="75" text-anchor="middle" class="sub">de 100</text></g>
    <g transform="translate(560 45)"><circle cx="0" cy="0" r="12" fill="#2563EB"/><circle cx="34" cy="0" r="12" fill="#2563EB"/><circle cx="68" cy="0" r="12" fill="#60A5FA"/><circle cx="102" cy="0" r="12" fill="#93C5FD"/><circle cx="136" cy="0" r="12" fill="#fff" stroke="#BFDBFE"/><path d="M-5 0l4 4 7-8M29 0l4 4 7-8M63 0l4 4 7-8M97 0l4 4 7-8" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
