    </symbol>
    <symbol id="hbx-card-icon-company" viewBox="0 0 48 48"><path d="M10 40V12h16v28M26 22h12v18M15 18h2M21 18h2M15 25h2M21 25h2M15 32h2M21 32h2M31 28h2M31 34h2" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="hbx-card-icon-quality" viewBox="0 0 48 48"><path d="M10 31a16 16 0 1 1 28 0" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/><path d="M24 28l8-10" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="31" r="3" fill="#2563EB"/></symbol>
    <symbol id="hbx-card-icon-shield" viewBox="0 0 48 48"><path d="M24 6l15 6v11c0 9.5-5.6 15.7-15 19-9.4-3.3-15-9.5-15-19V12l15-6Z" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/><path d="M17 24l5 5 10-11" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="hbx-card-icon-lightbulb" viewBox="0 0 48 48"><path d="M16 22a8 8 0 1 1 16 0c0 4-3 6-5 9h-6c-2-3-5-5-5-9Z" stroke="#F59E0B" stroke-width="3"/><path d="M20 36h8M21 41h6" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="hbx-card-icon-target" viewBox="0 0 48 48"><circle cx="22" cy="26" r="14" stroke="#0EA5E9" stroke-width="3"/><circle cx="22" cy="26" r="7" stroke="#2563EB" stroke-width="3"/><path d="M31 17l8-8M35 8h5v5" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="hbx-card-icon-lightning" viewBox="0 0 48 48"><path d="M27 4L11 27h12l-2 17 16-24H25l2-16Z" fill="#F59E0B"/></symbol>
    <symbol id="hbx-card-icon-check" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" stroke="#16A34A" stroke-width="3"/><path d="M16 24l5 5 11-12" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="hbx-card-icon-users" viewBox="0 0 48 48"><path d="M18 24a7 7 0 1 0 0-14 7 7 0 0 0 0 14ZM31 22a6 6 0 1 0 0-12" stroke="#64748B" stroke-width="3" stroke-linecap="round"/><path d="M7 39c2-7 8-10 14-10s12 3 14 10M28 30c5 .5 9 3 11 9" stroke="#64748B" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="hbx-card-icon-loading" viewBox="0 0 48 48"><g fill="#2563EB"><circle cx="24" cy="8" r="3"/><circle cx="35" cy="13" r="3" opacity=".8"/><circle cx="40" cy="24" r="3" opacity=".7"/><circle cx="35" cy="35" r="3" opacity=".6"/><circle cx="24" cy="40" r="3" opacity=".5"/><circle cx="13" cy="35" r="3" opacity=".4"/><circle cx="8" cy="24" r="3" opacity=".3"/><circle cx="13" cy="13" r="3" opacity=".2"/></g></symbol>
    <symbol id="hbx-card-icon-copy" viewBox="0 0 48 48"><rect x="16" y="12" width="22" height="26" rx="3" stroke="#64748B" stroke-width="3"/><rect x="10" y="8" width="22" height="26" rx="3" stroke="#94A3B8" stroke-width="3"/></symbol>
    <symbol id="hbx-card-icon-external" viewBox="0 0 48 48"><path d="M18 12h18v18M36 12L18 30" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 34v4H10V10h4" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="hbx-card-icon-expand" viewBox="0 0 48 48"><path d="M18 8H8v10M8 8l14 14M30 40h10V30M40 40L26 26" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
