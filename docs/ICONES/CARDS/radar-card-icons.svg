    <symbol id="hbx-card-icon-radar" viewBox="0 0 48 48"><circle cx="24" cy="24" r="17" stroke="#0EA5E9" stroke-width="3"/><circle cx="24" cy="24" r="9" stroke="#2563EB" stroke-width="3"/><circle cx="24" cy="24" r="3" fill="#2563EB"/><path d="M24 7v6M41 24h-6M24 41v-6M7 24h6" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="hbx-card-icon-lead-plus" viewBox="0 0 48 48"><path d="M13 36h22l3-18-9 6-5-12-5 12-9-6 3 18Z" fill="#2563EB"/><path d="M36 10l2 4 4 2-4 2-2 4-2-4-4-2 4-2 2-4Z" fill="#93C5FD"/></symbol>
    <symbol id="hbx-card-icon-coin-stack" viewBox="0 0 64 64"><ellipse cx="30" cy="18" rx="18" ry="8" fill="url(#coinGold)"/><path d="M12 18v24c0 4.4 8 8 18 8s18-3.6 18-8V18" fill="none" stroke="#D97706" stroke-width="3"/><path d="M12 26c0 4.4 8 8 18 8s18-3.6 18-8M12 34c0 4.4 8 8 18 8s18-3.6 18-8" stroke="#FDE68A" stroke-width="3"/><ellipse cx="45" cy="36" rx="12" ry="6" fill="url(#coinGold)"/><path d="M33 36v12c0 3.3 5.4 6 12 6s12-2.7 12-6V36" stroke="#D97706" stroke-width="3"/></symbol>
