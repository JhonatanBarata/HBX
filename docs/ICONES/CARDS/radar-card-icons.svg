      <g transform="translate(95 0)"><rect class="iconTile" width="70" height="70" rx="16"/><use href="#hbx-card-icon-facebook" x="11" y="11" width="48" height="48"/><text y="100" x="35" text-anchor="middle" class="sub">Facebook</text></g>
      <g transform="translate(190 0)"><rect class="iconTile" width="70" height="70" rx="16"/><use href="#hbx-card-icon-whatsapp" x="11" y="11" width="48" height="48"/><text y="100" x="35" text-anchor="middle" class="sub">WhatsApp</text></g>
      <g transform="translate(285 0)"><rect class="iconTile" width="70" height="70" rx="16"/><use href="#hbx-card-icon-globe" x="11" y="11" width="48" height="48"/><text y="100" x="35" text-anchor="middle" class="sub">Site</text></g>
      <g transform="translate(380 0)"><rect class="iconTile" width="70" height="70" rx="16"/><use href="#hbx-card-icon-email" x="11" y="11" width="48" height="48"/><text y="100" x="35" text-anchor="middle" class="sub">E-mail</text></g>
      <g transform="translate(475 0)"><rect class="iconTile" width="70" height="70" rx="16"/><use href="#hbx-card-icon-location" x="11" y="11" width="48" height="48"/><text y="100" x="35" text-anchor="middle" class="sub">Mapa</text></g>
      <g transform="translate(570 0)"><rect class="iconTile" width="70" height="70" rx="16"/><use href="#hbx-card-icon-phone" x="11" y="11" width="48" height="48"/><text y="100" x="35" text-anchor="middle" class="sub">Telefone</text></g>
    </g>
  </g>
  <g transform="translate(52 330)">
