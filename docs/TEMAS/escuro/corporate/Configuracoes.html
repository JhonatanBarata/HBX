<!DOCTYPE html>
<html lang="pt-BR" data-theme="corporate">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HBX — Configurações</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="corporate.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shell.jsx"></script>
<style>
  .set-nav { display: grid; gap: 2px; align-content: start; }
  .set-link { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: none; border-radius: var(--radius-sm); background: transparent; color: var(--text-body); font-family: var(--font-body); font-size: 0.82rem; font-weight: 600; cursor: pointer; text-align: left; }
  .set-link:hover { background: var(--hbx-surface-raised); }
  .set-link.on { background: var(--hbx-brand-soft); color: var(--hbx-brand-strong); }
  .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .f { display: grid; gap: 6px; }
  .f label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); }
  .sw { position: relative; width: 40px; height: 22px; border-radius: 999px; border: 1px solid var(--border-hairline); background: var(--hbx-surface-raised); cursor: pointer; transition: background .15s, border-color .15s; flex: 0 0 auto; padding: 0; }
  .sw.on { background: var(--hbx-primary); border-color: var(--hbx-primary); }
  .sw i { position: absolute; top: 50%; left: 2px; width: 17px; height: 17px; border-radius: 999px; background: #fff; transform: translateY(-50%); transition: left .2s; }
  .sw.on i { left: 19px; }
  .setting { display: flex; gap: 12px; align-items: center; padding: 13px 0; border-top: 1px solid var(--border-hairline); }
  .setting:first-of-type { border-top: none; }
  .setting strong { display: block; font-size: 0.8rem; }
  .setting small { font-size: 0.68rem; color: var(--text-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const { I, ICONS, Av, Sidebar, Topbar } = window;

const SECTIONS = ["Perfil", "Empresa", "Equipe", "Notificações", "Plano e cobrança"];
const SEC_IC = { "Perfil": "users", "Empresa": "cnpj", "Equipe": "users", "Notificações": "bell", "Plano e cobrança": "money" };

function Toggle({ on, set }) {
  return <button className={"sw" + (on ? " on" : "")} onClick={() => set(!on)} role="switch" aria-checked={on}><i></i></button>;
}

const EQUIPE = [
  { n: "Mariana Souza", cargo: "Gerente Comercial", mail: "mariana@hbx.com.br", perfil: "Administrador" },
  { n: "Juliana Costa", cargo: "Vendedora", mail: "juliana@hbx.com.br", perfil: "Vendas" },
  { n: "Rafael Martins", cargo: "Vendedor", mail: "rafael@hbx.com.br", perfil: "Vendas" },
];

function App() {
  const [sec, setSec] = useState("Perfil");
  const [n1, setN1] = useState(true);
  const [n2, setN2] = useState(true);
  const [n3, setN3] = useState(false);
  const [n4, setN4] = useState(true);

  return (
    <div className="app">
      <Sidebar active="config" />
      <div className="main">
        <Topbar title="Configurações" crumbs={<React.Fragment>Home &rsaquo; <b>Configurações</b></React.Fragment>} />
        <div className="work" style={{ flex: 1, gridTemplateColumns: "210px 1fr", display: "grid", alignItems: "start" }}>
          <nav className="set-nav panel" style={{ padding: 10 }}>
            {SECTIONS.map(s => (
              <button key={s} className={"set-link" + (sec === s ? " on" : "")} onClick={() => setSec(s)}>
                <I d={ICONS[SEC_IC[s]] || ICONS.config} size={15} />{s}
              </button>
            ))}
          </nav>

          <div style={{ display: "grid", gap: 14 }}>
            {sec === "Perfil" && (
              <section className="panel">
                <div className="panel-head"><h2>Perfil</h2><div className="meta"><button className="btn-teal">Salvar alterações</button></div></div>
                <div style={{ padding: 18, display: "grid", gap: 16 }}>
                  <div style={{ display: "flex", gap: 14, alignItems: "center" }}>
                    <Av name="Mariana Souza" size={56} />
                    <div style={{ display: "grid", gap: 6 }}>
                      <strong>Foto do perfil</strong>
                      <div style={{ display: "flex", gap: 8 }}>
                        <button className="btn-ghost" style={{ minHeight: 30, fontSize: "0.7rem" }}>Alterar</button>
                        <button className="btn-ghost" style={{ minHeight: 30, fontSize: "0.7rem", color: "var(--hbx-danger)" }}>Remover</button>
                      </div>
                    </div>
                  </div>
                  <div className="frow">
                    <div className="f"><label>Nome completo</label><input className="field-dark" defaultValue="Mariana Souza" /></div>
                    <div className="f"><label>Cargo</label><input className="field-dark" defaultValue="Gerente Comercial" /></div>
                    <div className="f"><label>E-mail</label><input className="field-dark" defaultValue="mariana@hbx.com.br" /></div>
                    <div className="f"><label>Telefone</label><input className="field-dark" defaultValue="(11) 98888-7766" /></div>
                  </div>
                </div>
              </section>
            )}

            {sec === "Empresa" && (
              <section className="panel">
                <div className="panel-head"><h2>Empresa</h2><div className="meta"><button className="btn-teal">Salvar alterações</button></div></div>
                <div style={{ padding: 18 }}>
                  <div className="frow">
                    <div className="f"><label>Razão social</label><input className="field-dark" defaultValue="HBX Soluções Comerciais LTDA" /></div>
                    <div className="f"><label>CNPJ</label><input className="field-dark" defaultValue="12.345.678/0001-90" /></div>
                    <div className="f"><label>Segmento</label><span className="select-dark">Tecnologia / SaaS <span style={{ opacity: 0.6 }}>▾</span></span></div>
                    <div className="f"><label>Cidade / UF</label><input className="field-dark" defaultValue="Campinas, SP" /></div>
                  </div>
                </div>
              </section>
            )}

            {sec === "Equipe" && (
              <section className="panel">
                <div className="panel-head"><h2>Equipe</h2><div className="meta"><button className="btn-teal"><I d={ICONS.plus} size={13} /> Convidar membro</button></div></div>
                <div className="tbl-wrap">
                  <table className="tbl">
                    <thead><tr><th>Membro</th><th>E-mail</th><th>Perfil de acesso</th><th></th></tr></thead>
                    <tbody>
                      {EQUIPE.map(m => (
                        <tr key={m.n} style={{ cursor: "default" }}>
                          <td><div style={{ display: "flex", gap: 9, alignItems: "center" }}><Av name={m.n} size={28} /><div><strong>{m.n}</strong><div style={{ fontSize: "0.64rem", color: "var(--text-muted)" }}>{m.cargo}</div></div></div></td>
                          <td>{m.mail}</td>
                          <td><span className={"tag" + (m.perfil === "Administrador" ? " teal" : "")}>{m.perfil}</span></td>
                          <td><button className="btn-ghost" style={{ minHeight: 28, fontSize: "0.68rem" }}>Gerenciar</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>
            )}

            {sec === "Notificações" && (
              <section className="panel">
                <div className="panel-head"><h2>Notificações</h2></div>
                <div style={{ padding: "6px 18px 14px" }}>
                  <div className="setting"><div style={{ flex: 1 }}><strong>Novo lead na esteira</strong><small>Receba um aviso quando um lead novo for captado.</small></div><Toggle on={n1} set={setN1} /></div>
                  <div className="setting"><div style={{ flex: 1 }}><strong>Mensagens não respondidas</strong><small>Alerta quando uma conversa ficar sem resposta por mais de 30 min.</small></div><Toggle on={n2} set={setN2} /></div>
                  <div className="setting"><div style={{ flex: 1 }}><strong>Resumo diário por e-mail</strong><small>Um resumo da operação às 8h, todos os dias úteis.</small></div><Toggle on={n3} set={setN3} /></div>
                  <div className="setting"><div style={{ flex: 1 }}><strong>Tarefas atrasadas</strong><small>Aviso quando uma tarefa passar do prazo.</small></div><Toggle on={n4} set={setN4} /></div>
                </div>
              </section>
            )}

            {sec === "Plano e cobrança" && (
              <section className="panel">
                <div className="panel-head"><h2>Plano e cobrança</h2></div>
                <div style={{ padding: 18, display: "grid", gap: 16 }}>
                  <div style={{ display: "flex", gap: 14, alignItems: "center", padding: 16, borderRadius: "var(--radius-md)", border: "1px solid rgba(22,199,164,0.3)", background: "var(--hbx-brand-soft)" }}>
                    <div style={{ flex: 1 }}>
                      <strong style={{ fontSize: "0.94rem" }}>Plano Empresarial</strong>
                      <div style={{ fontSize: "0.7rem", color: "var(--text-muted)", marginTop: 3 }}>Válido até 30/06/2026 · renovação automática</div>
                    </div>
                    <span style={{ fontFamily: "var(--font-mono)", fontSize: "1.1rem", fontWeight: 700 }}>R$ 489/mês</span>
                    <button className="btn-teal">Gerenciar plano</button>
                  </div>
                  <div className="kv">
                    <div className="row"><span className="k">Usuários</span><span className="v">3 de 10</span></div>
                    <div className="row"><span className="k">Coletas de webscraping</span><span className="v">8 de 30 / mês</span></div>
                    <div className="row"><span className="k">Bots publicados</span><span className="v">2 de 5</span></div>
                    <div className="row"><span className="k">Forma de pagamento</span><span className="v" style={{ fontFamily: "var(--font-mono)", fontSize: "0.7rem" }}>•••• 4521</span></div>
                  </div>
                </div>
              </section>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
