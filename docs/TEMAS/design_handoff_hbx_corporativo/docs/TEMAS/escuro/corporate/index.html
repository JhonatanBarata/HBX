<!DOCTYPE html>
<html lang="pt-BR" data-theme="corporate">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HBX — Vendas / Pipeline</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="corporate.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shell.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const { I, ICONS, Av, Sidebar, Topbar, KpiRow } = window;

const COLS = [
  { name: "Novo lead", count: "208 leads", sum: "R$ 1.245.000", deals: [
    { co: "Indústria Solar LTDA", who: "Marcos Silva", val: "R$ 45.000", line: "Lead qualificado via site", next: "Agendar contato", resp: "Juliana Costa", when: "Hoje", prob: "20%", close: "12/07/2026" },
    { co: "Construtora Horizonte", who: "Ana Paula Lima", val: "R$ 120.000", line: "Indicação comercial", next: "Enviar material", resp: "Rafael Martins", when: "Amanhã", prob: "25%", close: "20/07/2026" },
    { co: "Logística Verde S.A.", who: "Carlos Eduardo", val: "R$ 60.000", line: "Webscraping", next: "Primeiro contato", resp: "Juliana Costa", when: "2 dias", prob: "15%", close: "28/07/2026" },
  ]},
  { name: "Contato", count: "142 leads", sum: "R$ 980.000", deals: [
    { co: "Mercado Bom Preço", who: "Fernanda Ribeiro", val: "R$ 80.000", line: "Ligação realizada", next: "Apresentação", resp: "Rafael Martins", when: "Hoje", prob: "35%", close: "05/07/2026" },
    { co: "Clínica Vida & Saúde", who: "Dr. Paulo Mendes", val: "R$ 55.000", line: "E-mail respondido", next: "Agendar reunião", resp: "Juliana Costa", when: "1 dia", prob: "30%", close: "10/07/2026" },
    { co: "Escola Saber Mais", who: "Luciana Alves", val: "R$ 35.000", line: "WhatsApp", next: "Enviar proposta", resp: "Rafael Martins", when: "2 dias", prob: "30%", close: "15/07/2026" },
  ]},
  { name: "Proposta", count: "86 leads", sum: "R$ 640.000", deals: [
    { co: "Supermercado Economia", who: "João Victor", val: "R$ 150.000", line: "Proposta enviada", next: "Aguardar retorno", resp: "Juliana Costa", when: "Hoje", prob: "60%", close: "30/06/2026", cnpj: "12.345.678/0001-90" },
    { co: "Transportes Rio Branco", who: "Miguel Santos", val: "R$ 110.000", line: "Proposta enviada", next: "Agendar reunião técnica", resp: "Rafael Martins", when: "1 dia", prob: "55%", close: "08/07/2026" },
    { co: "Agropecuária Boa Terra", who: "Patricia Gomes", val: "R$ 85.000", line: "Proposta enviada", next: "Ajustes finais", resp: "Juliana Costa", when: "2 dias", prob: "50%", close: "11/07/2026" },
  ]},
  { name: "Negociação", count: "28 leads", sum: "R$ 420.000", deals: [
    { co: "Farma & Cia", who: "Roberto Almeida", val: "R$ 200.000", line: "Em negociação", next: "Revisão comercial", resp: "Rafael Martins", when: "Hoje", prob: "75%", close: "26/06/2026" },
    { co: "Distribuidora Sul", who: "Tiago Carvalho", val: "R$ 120.000", line: "Em negociação", next: "Aprovação interna", resp: "Juliana Costa", when: "1 dia", prob: "70%", close: "02/07/2026" },
    { co: "Hotel Praia Azul", who: "Camila Freitas", val: "R$ 100.000", line: "Em negociação", next: "Condições finais", resp: "Rafael Martins", when: "2 dias", prob: "70%", close: "04/07/2026" },
  ]},
  { name: "Fechado", count: "36 leads", sum: "R$ 560.000", deals: [
    { co: "Padaria Tradição", who: "Ricardo Nunes", val: "R$ 60.000", line: "Fechado em 15/05/2026", resp: "Rafael Martins", won: true, prob: "100%", close: "15/05/2026" },
    { co: "Academia Performance", who: "Bruno Rocha", val: "R$ 80.000", line: "Fechado em 13/05/2026", resp: "Juliana Costa", won: true, prob: "100%", close: "13/05/2026" },
    { co: "Restaurante Sabor & Arte", who: "Leticia Moreira", val: "R$ 70.000", line: "Fechado em 12/05/2026", resp: "Rafael Martins", won: true, prob: "100%", close: "12/05/2026" },
  ]},
];

function App() {
  const [sel, setSel] = useState({ c: 2, d: 0 });
  const [tasks, setTasks] = useState([true, false, false]);
  const deal = COLS[sel.c].deals[sel.d];

  return (
    <div className="app">
      <Sidebar active="vendas" />
      <div className="main">
        <Topbar title="Vendas" crumbs={<React.Fragment>Home &rsaquo; Vendas &rsaquo; <b>Pipeline</b></React.Fragment>} />
        <div className="content">
          <div className="work">
            <KpiRow items={[
              { icon: "users", label: "Leads captados", value: "1.248", delta: "+18%" },
              { icon: "doc", label: "Propostas", value: "342", delta: "+12%" },
              { icon: "check", label: "Taxa de conversão", value: "27,4%", delta: "+3,6 p.p." },
              { icon: "money", label: "Receita prevista", value: "R$ 2.846.500", delta: "+22%" },
            ]} />

            <section className="panel">
              <div className="panel-head">
                <h2>Pipeline de vendas</h2>
                <div className="meta">
                  <span>Atualizado há 8 min</span>
                  <button className="btn-ghost">Todas as equipes ▾</button>
                  <button className="btn-teal"><I d={ICONS.plus} size={14} /> Novo lead</button>
                </div>
              </div>
              <div className="board">
                {COLS.map((col, ci) => (
                  <div key={col.name}>
                    <div className="col-head"><strong>{col.name}</strong><span className="sum">{col.sum}</span></div>
                    <div className="col-count">{col.count}</div>
                    <div className="col-cards">
                      {col.deals.map((d, di) => (
                        <article key={d.co} className={"deal" + (sel.c === ci && sel.d === di ? " sel" : "")} onClick={() => setSel({ c: ci, d: di })}>
                          <strong>{d.co}</strong>
                          <span className="who">{d.who}</span>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <span className="val">{d.val}</span>
                            {d.won && <span className="badge-win">Ganho</span>}
                          </div>
                          <span className="line">{d.line}</span>
                          {d.next && <span className="line">Próximo passo: {d.next}</span>}
                          <div className="foot"><Av name={d.resp} size={18} />{d.resp}<span className="when">{d.when}</span></div>
                        </article>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </section>
          </div>

          <aside className="ctx">
            <h3>Detalhes do negócio <span className="x">✕</span></h3>
            <div>
              <div className="company">{deal.co}</div>
              <div className="sub">{deal.who}{deal.cnpj ? <React.Fragment> · CNPJ {deal.cnpj}</React.Fragment> : null}</div>
              <div style={{ marginTop: 8 }}><span className="tag">{COLS[sel.c].name}</span></div>
            </div>
            <div className="kv">
              <div className="row"><span className="k">Valor estimado</span><span className="v" style={{ fontFamily: "var(--font-mono)" }}>{deal.val},00</span></div>
              <div className="row"><span className="k">Etapa atual</span><span className="v">{COLS[sel.c].name}</span></div>
              <div className="row"><span className="k">Probabilidade</span><span className="v">{deal.prob}</span></div>
              <div className="row"><span className="k">Previsão de fechamento</span><span className="v">{deal.close}</span></div>
              <div className="row"><span className="k">Responsável</span><span className="v" style={{ display: "inline-flex", gap: 6, alignItems: "center" }}><Av name={deal.resp} size={18} />{deal.resp}</span></div>
            </div>
            <div className="sep"></div>
            <div>
              <h3 style={{ marginBottom: 6 }}>Próximas tarefas</h3>
              {[
                { t: "Aguardar retorno da proposta", d: "22/06/2026", r: "Juliana Costa" },
                { t: "Reunião técnica com o cliente", d: "23/06/2026", r: "Rafael Martins" },
                { t: "Enviar proposta ajustada", d: "26/06/2026", r: "Juliana Costa" },
              ].map((t, i) => (
                <label className="task" key={t.t}>
                  <input type="checkbox" checked={tasks[i]} onChange={() => setTasks(ts => ts.map((v, j) => j === i ? !v : v))} />
                  <span>
                    <span className="t" style={{ textDecoration: tasks[i] ? "line-through" : "none", opacity: tasks[i] ? 0.6 : 1 }}>{t.t}</span>
                    <span className="d">{t.d} · {t.r}</span>
                  </span>
                </label>
              ))}
              <span className="link">Ver todas as tarefas</span>
            </div>
            <div className="sep"></div>
            <div>
              <h3 style={{ marginBottom: 10 }}>Funil de conversão (mês)</h3>
              <div style={{ display: "grid", gap: 4, justifyItems: "center", padding: "6px 0 2px" }}>
                {[["#4CC2FF", 170], ["#16C7A4", 130], ["#2EE6A8", 92], ["#F5B23C", 56]].map(([c, w], i) => (
                  <div key={i} style={{ width: w, height: 22, background: c, borderRadius: 4, opacity: 0.92 }}></div>
                ))}
              </div>
              <div className="fleg" style={{ marginTop: 8 }}>
                {[["#4CC2FF", "Leads captados", "1.248 (100%)"], ["#16C7A4", "Propostas", "342 (27,4%)"], ["#2EE6A8", "Negociação", "78 (6,3%)"], ["#F5B23C", "Fechados", "36 (2,9%)"]].map(([c, l, v]) => (
                  <div className="row" key={l}><span className="swatch" style={{ background: c }}></span>{l}<span style={{ marginLeft: "auto", color: "var(--text-muted)", fontFamily: "var(--font-mono)", fontSize: "0.64rem" }}>{v}</span></div>
                ))}
              </div>
              <div style={{ marginTop: 10 }}><span className="link">Ver relatório completo</span></div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
