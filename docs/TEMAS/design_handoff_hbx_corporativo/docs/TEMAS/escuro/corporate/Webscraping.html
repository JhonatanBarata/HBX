<!DOCTYPE html>
<html lang="pt-BR" data-theme="corporate">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HBX — Webscraping</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="corporate.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shell.jsx"></script>
<style>
  .stats-strip { display: grid; grid-template-columns: auto 1fr 1fr 1fr 1fr auto; gap: 0; align-items: stretch; }
  .stats-strip .cell { padding: 16px 18px; border-left: 1px solid var(--border-hairline); display: grid; gap: 4px; align-content: center; }
  .stats-strip .cell:first-child { border-left: none; }
  .stats-strip .lbl { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; }
  .stats-strip .big { font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; white-space: nowrap; }
  .stats-strip .d { font-size: 0.66rem; font-weight: 700; color: var(--hbx-brand-strong); }
  .stats-strip .d small { color: var(--text-muted); font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const { I, ICONS, Av, Sidebar, Topbar } = window;

const ROWS = [
  { co: "Construtora Horizonte", st: "Novo", seg: "Construção Civil", cid: "São Paulo, SP", ct: "Ana Paula Lima", cg: "Diretora Comercial", tel: "(11) 99876-5432", em: "ana.lima@horizonte.com.br", ok: true, site: "horizonte.com.br", sc: 92,
    detail: { porte: "51–200 funcionários", fund: "2010", cnpj: "14.987.654/0001-23", chave: "construtora são paulo" } },
  { co: "Indústria Sul Metalúrgica", st: "Novo", seg: "Indústria", cid: "Joinville, SC", ct: "Carlos Eduardo", cg: "Gerente de Vendas", tel: "(47) 98821-3344", em: "carlos.eduardo@sulmetal.com.br", ok: true, site: "sulmetal.com.br", sc: 88,
    detail: { porte: "201–500 funcionários", fund: "1998", cnpj: "08.221.334/0001-90", chave: "metalúrgica joinville" } },
  { co: "Clínica Vida & Saúde", st: "Validado", seg: "Saúde", cid: "Curitiba, PR", ct: "Dra. Juliana Costa", cg: "Administradora", tel: "(41) 98765-1122", em: "contato@clinicavidaesaude.com.br", ok: true, site: "clinicavidaesaude.com.br", sc: 85,
    detail: { porte: "11–50 funcionários", fund: "2015", cnpj: "22.456.789/0001-11", chave: "clínica curitiba" } },
  { co: "Mercado Bom Preço", st: "Duplicado", seg: "Varejo", cid: "Belo Horizonte, MG", ct: "Fernando Ribeiro", cg: "Proprietário", tel: "(31) 97555-6677", em: "fernando@bompreco.com.br", warn: true, site: "bompreco.com.br", sc: 65,
    detail: { porte: "11–50 funcionários", fund: "2008", cnpj: "11.222.333/0001-44", chave: "mercado bh" } },
  { co: "Transportes Rio Branco", st: "Novo", seg: "Transporte", cid: "Rio de Janeiro, RJ", ct: "Miguel Santos", cg: "Comercial", tel: "(21) 96444-7788", em: "comercial@riobranco.com.br", site: "riobranco.com.br", sc: 81,
    detail: { porte: "51–200 funcionários", fund: "2005", cnpj: "33.444.555/0001-66", chave: "transportadora rj" } },
  { co: "Agropecuária Boa Terra", st: "Validado", seg: "Agronegócio", cid: "Cascavel, PR", ct: "Patricia Gomes", cg: "Gerente", tel: "(45) 99911-2233", em: "patricia@boaterra.com.br", site: "boaterra.com.br", sc: 79,
    detail: { porte: "51–200 funcionários", fund: "2001", cnpj: "44.555.666/0001-77", chave: "agro cascavel" } },
  { co: "Padaria Tradição", st: "Novo", seg: "Alimentos", cid: "Porto Alegre, RS", ct: "Ricardo Nunes", cg: "Proprietário", tel: "(51) 98123-5566", em: "contato@padariatradicao.com.br", site: "padariatradicao.com.br", sc: 62,
    detail: { porte: "1–10 funcionários", fund: "1992", cnpj: "55.666.777/0001-88", chave: "padaria porto alegre" } },
  { co: "Logística Verde S.A.", st: "Duplicado", seg: "Logística", cid: "Campinas, SP", ct: "Carlos Eduardo", cg: "Diretor", tel: "(19) 99777-8899", em: "eduardo@logisticaverde.com.br", warn: true, site: "logisticaverde.com.br", sc: 54,
    detail: { porte: "201–500 funcionários", fund: "2012", cnpj: "66.777.888/0001-99", chave: "logística campinas" } },
];

const ST_CLS = { "Novo": "tag", "Validado": "tag teal", "Duplicado": "tag warn" };

function App() {
  const [sel, setSel] = useState(0);
  const r = ROWS[sel];
  return (
    <div className="app">
      <Sidebar active="scrape" />
      <div className="main">
        <Topbar title="Webscraping" crumbs={<React.Fragment>Home &rsaquo; <b>Webscraping</b></React.Fragment>} />
        <div className="content">
          <div className="work">
            <section className="panel">
              <div className="filters">
                {[["Segmento", "Todos os segmentos"], ["Cidade", "Todas as cidades"], ["Estado", "Todos os estados"], ["Tamanho da empresa", "Todos os tamanhos"]].map(([l, v]) => (
                  <div className="f" key={l}>
                    <label>{l}</label>
                    <span className="select-dark">{v} <span style={{ opacity: 0.6 }}>▾</span></span>
                  </div>
                ))}
                <div className="f" style={{ flex: 1, minWidth: 180 }}>
                  <label>Buscar empresa ou domínio</label>
                  <input className="field-dark" placeholder="Ex.: hbx.com.br" />
                </div>
                <button className="btn-teal" style={{ minHeight: 38 }}>▶ Executar coleta</button>
              </div>
            </section>

            <section className="panel stats-strip">
              <div className="cell">
                <span className="lbl">Última coleta concluída</span>
                <span style={{ fontWeight: 700, fontSize: "0.86rem" }}>Hoje, 09:42</span>
                <span className="tag teal" style={{ marginTop: 2 }}>✓ Concluída</span>
              </div>
              <div className="cell"><span className="lbl">Leads encontrados</span><span className="big">1.248</span><span className="d">+18% <small>vs. coleta anterior</small></span></div>
              <div className="cell"><span className="lbl">E-mails validados</span><span className="big">842</span><span className="d"><small>67,6% do total</small></span></div>
              <div className="cell"><span className="lbl">Telefones encontrados</span><span className="big">732</span><span className="d"><small>58,7% do total</small></span></div>
              <div className="cell"><span className="lbl">Taxa de enriquecimento</span><span className="big">67,6%</span><span className="d">+8,4 p.p. <small>vs. anterior</small></span></div>
              <div className="cell" style={{ minWidth: 170 }}>
                <span className="lbl">Fonte de pesquisa</span>
                <span style={{ fontWeight: 700, fontSize: "0.8rem" }}>Google Maps</span>
                <span className="lbl" style={{ fontFamily: "var(--font-mono)" }}>10/06/2026 · 09:42</span>
              </div>
            </section>

            <section className="panel">
              <div className="panel-head">
                <h2>1.248 resultados encontrados</h2>
                <div className="meta">
                  <button className="btn-ghost"><I d={ICONS.doc} size={13} /> Exportar ▾</button>
                  <button className="icon-ghost"><I d={ICONS.filter} size={15} /></button>
                </div>
              </div>
              <div className="tbl-wrap">
                <table className="tbl">
                  <thead>
                    <tr>
                      <th><input type="checkbox" style={{ accentColor: "var(--hbx-brand)" }} /></th>
                      <th>Empresa</th><th>Segmento</th><th>Cidade</th><th>Contato</th><th>Telefone</th><th>E-mail</th><th>Site</th><th>Score</th><th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {ROWS.map((row, i) => (
                      <tr key={row.co} className={sel === i ? "sel" : ""} onClick={() => setSel(i)}>
                        <td><input type="checkbox" checked={sel === i} readOnly style={{ accentColor: "var(--hbx-brand)" }} /></td>
                        <td><div className="co"><strong>{row.co}</strong><span className={ST_CLS[row.st]} style={{ fontSize: "0.56rem", padding: "1px 8px" }}>{row.st}</span></div></td>
                        <td>{row.seg}</td>
                        <td>{row.cid}</td>
                        <td><div className="co"><strong style={{ fontWeight: 600 }}>{row.ct}</strong><span className="sub2">{row.cg}</span></div></td>
                        <td style={{ fontFamily: "var(--font-mono)", fontSize: "0.7rem" }}>{row.tel}</td>
                        <td>{row.em} {row.ok ? <span style={{ color: "var(--hbx-brand-strong)" }}>✓</span> : row.warn ? <span style={{ color: "var(--hbx-warning)" }}>⚠</span> : null}</td>
                        <td><a href="#" onClick={e => e.preventDefault()}>{row.site} ↗</a></td>
                        <td><span className={"score-ring " + (row.sc >= 75 ? "hi" : "mid")}>{row.sc}</span></td>
                        <td><span className={ST_CLS[row.st]}>{row.st}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div className="pager">
                Linhas por página: <span className="select-dark" style={{ minWidth: 0, minHeight: 30, padding: "0 10px" }}>25 ▾</span>
                <span style={{ marginLeft: "auto" }}>1–25 de 1.248</span>
                <button className="pg">‹</button>
                {[1, 2, 3].map(p => <button key={p} className={"pg" + (p === 1 ? " on" : "")}>{p}</button>)}
                <span>…</span><button className="pg">50</button>
                <button className="pg">›</button>
              </div>
            </section>
          </div>

          <aside className="ctx">
            <h3>{r.co} <span className="x">✕</span></h3>
            <div>
              <h3 style={{ fontSize: "0.78rem", color: "var(--text-muted)", marginBottom: 8 }}>Sobre a empresa</h3>
              <div className="kv">
                <div className="row"><span className="k">Segmento</span><span className="v">{r.seg}</span></div>
                <div className="row"><span className="k">Porte</span><span className="v">{r.detail.porte}</span></div>
                <div className="row"><span className="k">Fundação</span><span className="v">{r.detail.fund}</span></div>
                <div className="row"><span className="k">CNPJ</span><span className="v" style={{ fontFamily: "var(--font-mono)", fontSize: "0.7rem" }}>{r.detail.cnpj}</span></div>
                <div className="row"><span className="k">Cidade / UF</span><span className="v">{r.cid}</span></div>
                <div className="row"><span className="k">Site</span><span className="v"><a href="#" onClick={e => e.preventDefault()} style={{ color: "var(--hbx-info)" }}>{r.site} ↗</a></span></div>
              </div>
            </div>
            <div className="sep"></div>
            <div>
              <h3 style={{ fontSize: "0.78rem", color: "var(--text-muted)", marginBottom: 8 }}>Contato principal</h3>
              <div style={{ display: "grid", gap: 3 }}>
                <strong style={{ fontSize: "0.88rem" }}>{r.ct}</strong>
                <span className="sub">{r.cg}</span>
              </div>
              <div className="kv" style={{ marginTop: 10 }}>
                <div className="row"><span className="k" style={{ display: "inline-flex", gap: 6, alignItems: "center" }}><I d={ICONS.mail} size={13} /> E-mail</span><span className="v" style={{ fontWeight: 600, fontSize: "0.68rem" }}>{r.em} <span style={{ color: "var(--hbx-brand-strong)" }}>✓</span></span></div>
                <div className="row"><span className="k" style={{ display: "inline-flex", gap: 6, alignItems: "center" }}><I d={ICONS.phone} size={13} /> Telefone</span><span className="v" style={{ fontFamily: "var(--font-mono)", fontSize: "0.7rem" }}>{r.tel}</span></div>
              </div>
            </div>
            <div className="sep"></div>
            <div>
              <h3 style={{ fontSize: "0.78rem", color: "var(--text-muted)", marginBottom: 8 }}>Origem dos dados</h3>
              <div className="kv">
                <div className="row"><span className="k">Fonte</span><span className="v">Google Maps</span></div>
                <div className="row"><span className="k">Coleta em</span><span className="v" style={{ fontFamily: "var(--font-mono)", fontSize: "0.7rem" }}>10/06/2026, 09:42</span></div>
                <div className="row"><span className="k">Palavra-chave</span><span className="v">{r.detail.chave}</span></div>
                <div className="row"><span className="k">Localização</span><span className="v">{r.cid}, Brasil</span></div>
              </div>
            </div>
            <div className="sep"></div>
            <div style={{ display: "grid", gap: 8 }}>
              <h3>Ações</h3>
              <button className="btn-teal"><I d={ICONS.plus} size={14} /> Adicionar ao CRM</button>
              <button className="btn-ghost"><I d={ICONS.send} size={13} /> Criar abordagem</button>
              <button className="btn-ghost"><I d={ICONS.clock} size={13} /> Ver histórico da empresa</button>
            </div>
          </aside>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
