<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 26px; }
  .grid { display: grid; gap: 18px; grid-template-columns: 1fr 1fr; align-items: start; }
  .stack { display: grid; gap: 14px; }
  .lbl { font-family: var(--font-display); font-size: 0.62rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { TextField, Toggle, Button } = window.HBXSystemDesignSystem_51ccaa;

  function Demo() {
    const [dark, setDark] = React.useState(true);
    const [notif, setNotif] = React.useState(false);
    return (
      <div className="grid">
        <div className="stack">
          <p className="lbl">Fields</p>
          <TextField label="E-mail" placeholder="Digite seu e-mail" defaultValue="marina@autocentersul.com" />
          <TextField label="Senha" type="password" defaultValue="123456" hint="Mínimo de 8 caracteres." />
          <TextField label="Código de acesso" defaultValue="000000" error="Código incorreto, tente novamente." />
        </div>
        <div className="stack">
          <p className="lbl">Toggles</p>
          <Toggle checked={dark} onChange={setDark} label="Tema escuro" />
          <Toggle checked={notif} onChange={setNotif} label="Notificações de recovery" />
          <Toggle checked={false} disabled label="Multiempresa (Enterprise)" />
          <div style={{ marginTop: 6 }}>
            <Button variant="primary">Salvar preferências</Button>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
