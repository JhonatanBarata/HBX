<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  body { margin: 0; padding: 26px; }
  .wrap { display: grid; gap: 16px; }
  .metrics { display: grid; gap: 12px; grid-template-columns: repeat(3, 1fr); }
  .cards { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Card, StatCard, Badge, Button, IconButton } = window.HBXSystemDesignSystem_51ccaa;

  function Demo() {
    return (
      <div className="wrap">
        <div className="metrics">
          <StatCard label="Leads na esteira" value="1.284" delta="+18% hoje" />
          <StatCard label="Recuperado (mês)" value="R$ 86.4k" delta="+9% vs. abril" />
          <StatCard label="Pendente" value="R$ 42.380" delta="-6% vs. ontem" deltaTone="danger" />
        </div>
        <div className="cards">
          <Card eyebrow="Recovery" title="Dinheiro parado volta pra fila"
                action={<IconButton label="Abrir">→</IconButton>}>
            <p style={{ margin: "0 0 12px", fontSize: "0.84rem", lineHeight: 1.5 }}>
              Régua de cobrança, lembrete e reativação pelo WhatsApp.
            </p>
            <Badge tone="warning">3 follow-ups hoje</Badge>
          </Card>
          <Card eyebrow="Plano foco" title="HBX Leads" tone="brand"
                action={<Badge tone="brand">Featured</Badge>}>
            <p style={{ margin: "0 0 12px", fontSize: "0.84rem", lineHeight: 1.5 }}>
              Lead priorizado, enriquecido e com próxima melhor ação.
            </p>
            <Button variant="primary" size="sm">Entrar no Leads</Button>
          </Card>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
