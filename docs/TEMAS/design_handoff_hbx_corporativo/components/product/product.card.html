<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>
  body { margin: 0; padding: 26px; }
  .grid { display: grid; gap: 18px; grid-template-columns: 360px 1fr; align-items: start; }
  .stack { display: grid; gap: 12px; }
  .chat { padding: 14px; border-radius: var(--radius-lg); border: 1px solid var(--border-hairline); background: var(--hbx-surface-soft); box-shadow: var(--shadow-inset), var(--shadow-xs); }
  .lbl { font-family: var(--font-display); font-size: 0.62rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { LeadCard, ChatBubble } = window.HBXSystemDesignSystem_51ccaa;

  function Demo() {
    return (
      <div className="grid">
        <div className="stack">
          <p className="lbl">Esteira · lead tiles</p>
          <LeadCard hot company="Assistência Técnica Local" segment="Eletrônicos · Campinas/SP"
                    channel="WhatsApp provável" priority={87} onAction={() => {}} />
          <LeadCard company="Auto Center Sul" segment="Automotivo · Sorocaba/SP"
                    channel="Telefone" priority={54} nextAction="Follow-up agendado" />
        </div>
        <div className="stack">
          <p className="lbl">Atendimento · inbox</p>
          <div className="chat">
            <ChatBubble direction="system">Bot HBX iniciou o atendimento</ChatBubble>
            <ChatBubble direction="in" author="Auto Center Sul" time="09:32">Oi, a peça que pedi já chegou?</ChatBubble>
            <ChatBubble direction="out" time="09:33">Chegou sim! Posso agendar a troca pra amanhã?</ChatBubble>
            <ChatBubble direction="in" author="Auto Center Sul" time="09:34">Perfeito, pode marcar 👍</ChatBubble>
            <ChatBubble direction="out" time="09:34">Agendado para amanhã às 14h. Te lembro 1h antes.</ChatBubble>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
