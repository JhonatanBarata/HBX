<!DOCTYPE html>
<html lang="pt-BR" data-theme="corporate">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HBX — Dashboard</title>
<link rel="stylesheet" href="../../styles.css?v=2" />
<link rel="stylesheet" href="corporate.css?v=2" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shell.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const { I, ICONS, Av, Sidebar, Topbar, KpiRow } = window;

const MESES = [
  { m: "Jan", v: 1.62 }, { m: "Fev", v: 1.84 }, { m: "Mar", v: 1.71 },
  { m: "Abr", v: 2.10 }, { m: "Mai", v: 2.33 }, { m: "Jun", v: 2.85 },
];

const ATIVIDADE = [
  { c: "#2EE6A8", t: "Negócio fechado — Padaria Tradição", d: "R$ 60.000 · Rafael Martins", h: "11:42" },
  { c: "#4CC2FF", t: "Proposta enviada — Supermercado Economia", d: "R$ 150.000 · Juliana Costa", h: "11:30" },
  { c: "#16C7A4", t: "Conversa qualificada — Studio Bella Estética", d: "WhatsApp · lead score 82", h: "10:15" },
  { c: "#F5B23C", t: "Coleta concluída — Webscraping", d: "1.248 leads · 67,6% enriquecidos", h: "09:42" },
  { c: "#F0566B", t: "Tarefa atrasada — Enviar proposta ajustada", d: "Hotel Praia Azul · Juliana Costa", h: "09:00" },
];

const VENDEDORES = [
  { n: "Juliana Costa", v: "R$ 312.000", pct: 86 },
  { n: "Rafael Martins", v: "R$ 248.000", pct: 68 },
  { n: "Mariana Souza", v: "R$ 186.000", pct: 51 },
];

function App() {
  const [tasks, setTasks] = useState([false, false, true]);
  const max = Math.max(...MESES.map(x => x.v));
  return (
    <div className="app">
      <Sidebar active="dash" />
      <div className="main">
        <Topbar title="Dashboard" crumbs={<React.Fragment>Home &rsaquo; <b>Dashboard</b></React.Fragment>} />
        <div className="work" style={{ flex: 1 }}>
          <KpiRow items={[
            { icon: "money", label: "Receita prevista", value: "R$ 2.846.500", delta: "+22%" },
            { icon: "users", label: "Leads captados", value: "1.248", delta: "+18%" },
            { icon: "atend", label: "Atendimentos em aberto", value: "128", delta: "+18%" },
            { icon: "check", label: "Taxa de conversão", value: "27,4%", delta: "+3,6 p.p." },
          ]} />

          <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr", gap: 14 }}>
            <section className="panel">
              <div className="panel-head">
                <h2>Receita (últimos 6 meses)</h2>
                <div className="meta">
                  <button className="btn-ghost">2026 ▾</button>
                  <span className="link">Ver relatório</span>
                </div>
              </div>
              <div style={{ padding: "10px 18px 16px" }}>
                <div className="bars">
                  {MESES.map(x => (
                    <div className="b" key={x.m}>
                      <span style={{ fontFamily: "var(--font-mono)", fontSize: "0.6rem", color: "var(--text-muted)" }}>{x.v.toFixed(2).replace(".", ",")}M</span>
                      <div className="bar" style={{ height: Math.round((x.v / max) * 118) }}></div>
                      <span className="lbl">{x.m}</span>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            <section className="panel">
              <div className="panel-head"><h2>Funil de conversão (mês)</h2></div>
              <div style={{ padding: "14px 18px 18px" }}>
                <div style={{ display: "grid", gap: 4, justifyItems: "center", padding: "4px 0 10px" }}>
                  {[["#4CC2FF", 190], ["#16C7A4", 146], ["#2EE6A8", 102], ["#F5B23C", 62]].map(([c, w], i) => (
                    <div key={i} style={{ width: w, height: 24, background: c, borderRadius: 4, opacity: 0.92 }}></div>
                  ))}
                </div>
                <div className="fleg">
                  {[["#4CC2FF", "Leads captados", "1.248 (100%)"], ["#16C7A4", "Propostas", "342 (27,4%)"], ["#2EE6A8", "Negociação", "78 (6,3%)"], ["#F5B23C", "Fechados", "36 (2,9%)"]].map(([c, l, v]) => (
                    <div className="row" key={l}><span className="swatch" style={{ background: c }}></span>{l}<span style={{ marginLeft: "auto", color: "var(--text-muted)", fontFamily: "var(--font-mono)", fontSize: "0.64rem" }}>{v}</span></div>
                  ))}
                </div>
              </div>
            </section>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr 1fr", gap: 14 }}>
            <section className="panel">
              <div className="panel-head">
                <h2>Atividade recente</h2>
                <div className="meta"><span className="link">Ver tudo</span></div>
              </div>
              <div className="activity" style={{ padding: "4px 18px 10px" }}>
                {ATIVIDADE.map(a => (
                  <div className="it" key={a.t}>
                    <span className="dot" style={{ background: a.c }}></span>
                    <div>
                      <div className="t">{a.t}</div>
                      <div className="d">{a.d}</div>
                    </div>
                    <time>{a.h}</time>
                  </div>
                ))}
              </div>
            </section>

            <section className="panel">
              <div className="panel-head"><h2>Tarefas de hoje</h2></div>
              <div style={{ padding: "8px 18px 14px" }}>
                {[
                  { t: "Aguardar retorno da proposta", d: "Supermercado Economia" },
                  { t: "Reunião técnica com o cliente", d: "Farma & Cia · 15h00" },
                  { t: "Revisar régua de recovery", d: "Atendimento · 17h30" },
                ].map((t, i) => (
                  <label className="task" key={t.t}>
                    <input type="checkbox" checked={tasks[i]} onChange={() => setTasks(ts => ts.map((v, j) => j === i ? !v : v))} />
                    <span>
                      <span className="t" style={{ textDecoration: tasks[i] ? "line-through" : "none", opacity: tasks[i] ? 0.6 : 1 }}>{t.t}</span>
                      <span className="d">{t.d}</span>
                    </span>
                  </label>
                ))}
                <span className="link">Ver todas as tarefas</span>
              </div>
            </section>

            <section className="panel">
              <div className="panel-head"><h2>Top vendedores (mês)</h2></div>
              <div style={{ padding: "10px 18px 16px", display: "grid", gap: 13 }}>
                {VENDEDORES.map(v => (
                  <div key={v.n} style={{ display: "grid", gap: 6 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <Av name={v.n} size={22} />
                      <span style={{ fontSize: "0.78rem", fontWeight: 600 }}>{v.n}</span>
                      <span style={{ marginLeft: "auto", fontFamily: "var(--font-mono)", fontSize: "0.72rem", fontWeight: 700 }}>{v.v}</span>
                    </div>
                    <div style={{ height: 6, borderRadius: 999, background: "var(--hbx-surface-raised)" }}>
                      <div style={{ width: v.pct + "%", height: "100%", borderRadius: 999, background: "linear-gradient(90deg, var(--hbx-brand), var(--hbx-brand-strong))" }}></div>
                    </div>
                  </div>
                ))}
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
