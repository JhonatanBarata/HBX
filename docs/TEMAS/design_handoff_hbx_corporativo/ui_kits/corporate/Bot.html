<!DOCTYPE html>
<html lang="pt-BR" data-theme="corporate">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HBX — Construtor de Bot</title>
<link rel="stylesheet" href="../../styles.css?v=2" />
<link rel="stylesheet" href="corporate.css?v=2" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shell.jsx"></script>
<style>
  html, body { height: 100%; }
  .app { height: 100vh; overflow: hidden; }
  .bot-head { display: flex; align-items: center; gap: 12px; padding: 14px 22px 0; }
  .bot-head h1 { margin: 0; font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; display: inline-flex; gap: 10px; align-items: center; }
  .saved { display: inline-flex; gap: 5px; align-items: center; font-size: 0.7rem; font-weight: 700; color: var(--hbx-brand-strong); }
  .bot-tabs { display: flex; gap: 2px; padding: 10px 22px 0; border-bottom: 1px solid var(--border-hairline); }
  .bot-tab { padding: 10px 14px; border: none; background: none; color: var(--text-muted); font-family: var(--font-body); font-size: 0.8rem; font-weight: 700; cursor: pointer; border-bottom: 2px solid transparent; }
  .bot-tab.on { color: var(--hbx-brand-strong); border-bottom-color: var(--hbx-brand); }
  .bot-tabs .right { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 0.7rem; color: var(--text-muted); padding-bottom: 6px; }
  .builder { display: grid; grid-template-columns: 232px 1fr 320px; flex: 1; min-height: 0; }
  .blocks { border-right: 1px solid var(--border-hairline); background: var(--hbx-surface); padding: 14px; display: flex; flex-direction: column; gap: 9px; overflow-y: auto; }
  .blocks h2 { margin: 0; font-family: var(--font-display); font-size: 0.9rem; font-weight: 700; }
  .blocks .hint { font-size: 0.66rem; color: var(--text-muted); margin: 0 0 4px; }
  .block { display: flex; gap: 10px; align-items: flex-start; padding: 11px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); background: var(--hbx-surface-soft); cursor: grab; }
  .block:hover { border-color: var(--border-strong); }
  .block strong { font-size: 0.76rem; display: block; }
  .block small { font-size: 0.64rem; color: var(--text-muted); line-height: 1.35; }
  .bicon { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto; color: #04110D; }
  .tip { margin-top: auto; padding: 10px; border-radius: var(--radius-sm); border: 1px dashed var(--border-strong); font-size: 0.64rem; color: var(--text-muted); }
  .canvas { position: relative; overflow: auto; background-color: var(--hbx-background); background-image: radial-gradient(circle, var(--border-strong) 1px, transparent 1px); background-size: 22px 22px; }
  .canvas-tools { position: sticky; top: 12px; margin-left: auto; margin-right: 16px; width: fit-content; display: flex; gap: 2px; padding: 4px; border-radius: 10px; border: 1px solid var(--border-hairline); background: var(--hbx-surface); z-index: 5; }
  .ct { display: grid; place-items: center; min-width: 30px; height: 30px; border: none; border-radius: 7px; background: transparent; color: var(--text-body); font-family: var(--font-mono); font-size: 0.68rem; cursor: pointer; }
  .ct:hover, .ct.on { background: var(--hbx-surface-raised); }
  .node { position: absolute; width: 215px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); background: var(--hbx-surface); box-shadow: var(--shadow-sm); }
  .node.sel { border-color: var(--hbx-brand); }
  .node .nh { display: flex; gap: 8px; align-items: center; padding: 10px 12px; }
  .node .nh strong { font-size: 0.78rem; }
  .node .nb { padding: 0 12px 10px; font-size: 0.7rem; color: var(--text-body); line-height: 1.45; }
  .node .nf { padding: 8px 12px; border-top: 1px solid var(--border-hairline); font-size: 0.62rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
  .node .yn { display: flex; border-top: 1px solid var(--border-hairline); }
  .node .yn span { flex: 1; text-align: center; padding: 8px 0; font-size: 0.7rem; font-weight: 800; cursor: pointer; }
  .node .yn .y { color: var(--hbx-brand-strong); border-right: 1px solid var(--border-hairline); }
  .node .yn .n { color: var(--hbx-danger); }
  .test { border-left: 1px solid var(--border-hairline); background: var(--hbx-surface); display: flex; flex-direction: column; min-height: 0; }
  .test-head { display: flex; align-items: center; gap: 8px; padding: 13px 14px; border-bottom: 1px solid var(--border-hairline); }
  .test-head h2 { margin: 0; flex: 1; font-family: var(--font-display); font-size: 0.9rem; font-weight: 700; }
  .qr { display: inline-flex; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border-hairline); background: var(--hbx-surface-soft); color: var(--text-body); font-size: 0.72rem; font-weight: 700; cursor: pointer; width: fit-content; }
  .qr:hover { border-color: var(--hbx-brand); color: var(--hbx-brand-strong); }
  .test-foot { padding: 8px 14px 12px; font-size: 0.62rem; color: var(--text-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;
const { I, ICONS, Av, Sidebar, Topbar } = window;

const BLOCKS = [
  { t: "Mensagem", d: "Envie uma mensagem de texto", c: "#16C7A4", ic: "msg" },
  { t: "Pergunta", d: "Faça uma pergunta ao contato", c: "#4CC2FF", ic: "atend" },
  { t: "Condição", d: "Crie caminhos com regras", c: "#F5B23C", ic: "filter" },
  { t: "Ação", d: "Execute uma ação no sistema", c: "#2ECC8E", ic: "check" },
  { t: "Atraso", d: "Adicione uma pausa no fluxo", c: "#9B7BFF", ic: "clock" },
  { t: "Integração", d: "Conecte com outras ferramentas", c: "#38BDF8", ic: "scrape" },
];

const NODES = [
  { id: "boas", x: 40, y: 60, ic: "msg", c: "#16C7A4", t: "Boas-vindas", b: "👋 Olá! Bem-vindo à HBX. Como posso te ajudar hoje?", f: "Próximo passo" },
  { id: "qual", x: 300, y: 60, ic: "atend", c: "#4CC2FF", t: "Qualificação", b: "Qual melhor descreve sua necessidade hoje?", f: "Próximo passo" },
  { id: "cond", x: 560, y: 60, ic: "filter", c: "#F5B23C", t: "Condição", b: "Interessado em soluções comerciais?", yn: true },
  { id: "capt", x: 170, y: 290, ic: "doc", c: "#4CC2FF", t: "Capturar interesse", b: "Qual área da sua empresa você quer melhorar?", f: "Próximo passo" },
  { id: "agen", x: 420, y: 290, ic: "clock", c: "#2ECC8E", t: "Agendamento", b: "Posso agendar uma conversa com nosso especialista?", f: "Próximo passo" },
  { id: "msgf", x: 670, y: 290, ic: "msg", c: "#16C7A4", t: "Mensagem", b: "Tudo bem! Se precisar de algo, estarei por aqui. 😊", f: "Fim do fluxo" },
  { id: "ofer", x: 170, y: 480, ic: "money", c: "#2ECC8E", t: "Oferta", b: "Temos uma solução ideal para o que você precisa.", f: "Próximo passo" },
  { id: "tran", x: 420, y: 480, ic: "users", c: "#F5B23C", t: "Transferir para humano", b: "Conectando você com um de nossos atendentes...", f: "Próximo passo" },
];

const EDGES = [
  { from: [255, 130], to: [300, 130], c: "#16C7A4" },
  { from: [515, 130], to: [560, 130], c: "#16C7A4" },
  { from: [620, 196], to: [278, 290], c: "#16C7A4", curve: true },
  { from: [660, 196], to: [528, 290], c: "#16C7A4", curve: true },
  { from: [700, 196], to: [778, 290], c: "#F0566B", curve: true },
  { from: [278, 408], to: [278, 480], c: "#16C7A4" },
  { from: [528, 408], to: [528, 480], c: "#16C7A4" },
];

const CHAT0 = [
  { dir: "in", text: "👋 Olá! Bem-vindo à HBX. Como posso te ajudar hoje?", tm: "10:30" },
  { dir: "out", text: "Quero melhorar nosso processo comercial.", tm: "10:31" },
  { dir: "in", text: "Qual melhor descreve sua necessidade hoje?", tm: "10:31", quick: true },
];

function App() {
  const [selNode, setSelNode] = useState("cond");
  const [chat, setChat] = useState(CHAT0);
  const [draft, setDraft] = useState("");
  const endRef = useRef(null);
  useEffect(() => { if (endRef.current) endRef.current.scrollTop = endRef.current.scrollHeight; }, [chat]);

  function reply(text) {
    setChat(c => [...c.map(m => ({ ...m, quick: false })), { dir: "out", text, tm: "10:32" },
      { dir: "in", text: "Perfeito! Posso agendar uma conversa com nosso especialista?", tm: "10:32" }]);
  }
  function send() { if (!draft.trim()) return; reply(draft.trim()); setDraft(""); }

  return (
    <div className="app">
      <Sidebar active="bot" />
      <div className="main">
        <Topbar title="Bot" crumbs={<React.Fragment>Home &rsaquo; Bot &rsaquo; <b>Construtor</b></React.Fragment>} />
        <div className="bot-head">
          <h1>Construtor de Bot <I d={["M12 20h9","M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"]} size={16} /></h1>
          <span className="saved">✓ Salvo</span>
          <div style={{ marginLeft: "auto", display: "flex", gap: 9 }}>
            <button className="btn-ghost" style={{ minWidth: 38 }}>⋯</button>
            <button className="btn-ghost"><I d={ICONS.send} size={13} /> Testar bot</button>
            <button className="btn-ghost">Salvar</button>
            <button className="btn-teal">Publicar ▾</button>
          </div>
        </div>
        <div className="bot-tabs">
          {["Fluxo", "Configurações", "Integrações", "Publicação", "Análises"].map((t, i) => (
            <button key={t} className={"bot-tab" + (i === 0 ? " on" : "")}>{t}</button>
          ))}
          <div className="right"><span>Versão rascunho</span><span className="saved">✓ Salvo agora há pouco</span></div>
        </div>

        <div className="builder">
          <aside className="blocks">
            <h2>Adicionar blocos</h2>
            <p className="hint">Arraste os blocos para o fluxo</p>
            {BLOCKS.map(b => (
              <div className="block" key={b.t} draggable>
                <span className="bicon" style={{ background: b.c }}><I d={ICONS[b.ic]} size={15} /></span>
                <span><strong>{b.t}</strong><small>{b.d}</small></span>
              </div>
            ))}
            <div className="tip">💡 Dica: arraste os blocos para o canvas</div>
          </aside>

          <div className="canvas">
            <div className="canvas-tools">
              <button className="ct on"><I d={["M4 4l7 16 2.5-6.5L20 11z"]} size={14} /></button>
              <button className="ct"><I d={["M18 11V7a2 2 0 0 0-4 0v4M14 10V5a2 2 0 0 0-4 0v5M10 10.5V7a2 2 0 0 0-4 0v7a7 7 0 0 0 14 0v-3a2 2 0 0 0-4 0"]} size={14} /></button>
              <button className="ct"><I d={ICONS.search} size={14} /></button>
              <button className="ct" style={{ minWidth: 44 }}>100%</button>
              <button className="ct"><I d={ICONS.plus} size={14} /></button>
            </div>
            <div style={{ position: "relative", width: 940, height: 640 }}>
              <svg style={{ position: "absolute", inset: 0, pointerEvents: "none" }} width="940" height="640">
                {EDGES.map((e, i) => {
                  const [x1, y1] = e.from, [x2, y2] = e.to;
                  const d = e.curve
                    ? `M ${x1} ${y1} C ${x1} ${y1 + 50}, ${x2} ${y2 - 50}, ${x2} ${y2}`
                    : `M ${x1} ${y1} L ${x2} ${y2}`;
                  return (
                    <g key={i}>
                      <path d={d} stroke={e.c} strokeWidth="1.6" fill="none" opacity="0.85" />
                      <circle cx={x2} cy={y2} r="3.5" fill={e.c} />
                      <circle cx={x1} cy={y1} r="3.5" fill={e.c} opacity="0.6" />
                    </g>
                  );
                })}
              </svg>
              {NODES.map(n => (
                <article key={n.id} className={"node" + (selNode === n.id ? " sel" : "")} style={{ left: n.x, top: n.y }} onClick={() => setSelNode(n.id)}>
                  <div className="nh">
                    <span className="bicon" style={{ background: n.c, width: 26, height: 26 }}><I d={ICONS[n.ic]} size={13} /></span>
                    <strong>{n.t}</strong>
                  </div>
                  <div className="nb">{n.b}</div>
                  {n.yn
                    ? <div className="yn"><span className="y">Sim</span><span className="n">Não</span></div>
                    : <div className="nf">{n.f}<I d={ICONS.arrow} size={11} /></div>}
                </article>
              ))}
            </div>
          </div>

          <aside className="test">
            <div className="test-head">
              <h2>Teste seu bot</h2>
              <span className="saved" style={{ fontSize: "0.66rem" }}>Online ●</span>
              <button className="icon-ghost" style={{ width: 28, height: 28 }}><I d={["M21 12a9 9 0 1 1-3-6.7", "M21 3v6h-6"]} size={14} /></button>
            </div>
            <div className="msgs" ref={endRef} style={{ padding: 14 }}>
              <div style={{ display: "flex", gap: 9, alignItems: "center", marginBottom: 6 }}>
                <span className="bicon" style={{ background: "var(--hbx-brand)", width: 32, height: 32, borderRadius: 999 }}><I d={ICONS.bot} size={16} /></span>
                <span><strong style={{ fontSize: "0.8rem" }}>HBX Bot</strong><br /><small style={{ fontSize: "0.62rem", color: "var(--hbx-brand-strong)", fontWeight: 700 }}>Online agora</small></span>
              </div>
              {chat.map((m, i) => (
                <div key={i} className={"msg " + m.dir} style={{ maxWidth: "88%" }}>
                  <div className="bubble" style={m.dir === "out" ? { background: "var(--hbx-brand)", borderColor: "var(--hbx-brand)", color: "#04110D", fontWeight: 600 } : {}}>
                    <div style={{ whiteSpace: "pre-line" }}>{m.text}</div>
                    <div className="tm" style={m.dir === "out" ? { color: "rgba(4,17,13,0.6)" } : {}}>{m.tm}{m.dir === "out" && <span className="ck" style={{ color: "rgba(4,17,13,0.7)" }}>✓✓</span>}</div>
                  </div>
                </div>
              ))}
              {chat[chat.length - 1].quick && (
                <div style={{ display: "grid", gap: 7, justifyItems: "start", marginTop: 4 }}>
                  {["Aumentar vendas", "Organizar processos", "Encontrar novos clientes", "Outro"].map(q => (
                    <button key={q} className="qr" onClick={() => reply(q)}>{q}</button>
                  ))}
                </div>
              )}
            </div>
            <div className="composer" style={{ padding: "10px 14px" }}>
              <div className="row">
                <input className="field-dark" style={{ flex: 1 }} placeholder="Digite sua mensagem..." value={draft}
                  onChange={e => setDraft(e.target.value)} onKeyDown={e => e.key === "Enter" && send()} />
                <button className="icon-ghost"><I d={ICONS.smile} size={16} /></button>
                <button className="send" onClick={send}><I d={ICONS.send} size={15} /></button>
              </div>
            </div>
            <div className="test-foot">⚡ Teste simulado · As respostas podem variar.</div>
          </aside>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
