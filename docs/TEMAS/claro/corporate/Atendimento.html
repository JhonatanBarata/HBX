<!DOCTYPE html>
<html lang="pt-BR" data-theme="corporate" data-theme-mode="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HBX — Atendimento</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="corporate.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shell.jsx"></script>
<style>
  html, body { height: 100%; }
  .app { height: 100vh; overflow: hidden; }
  .a-content { display: grid; grid-template-columns: 1fr 300px; flex: 1; min-height: 0; }
  .a-left { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 18px 0 0 22px; gap: 16px; }
  .a-left .kpis { padding-right: 22px; }
  .a-shell { display: grid; grid-template-columns: 320px 1fr; flex: 1; min-height: 0; border: 1px solid var(--border-hairline); border-right: none; border-bottom: none; border-radius: var(--panel-radius) 0 0 0; overflow: hidden; }
  .stage-dots { display: flex; gap: 4px; }
  .stage-dots i { width: 22px; height: 5px; border-radius: 999px; background: var(--hbx-surface-raised); }
  .stage-dots i.on { background: var(--hbx-brand); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;
const { I, ICONS, Av, Sidebar, Topbar, KpiRow } = window;

const CONVS = [
  { id: 0, n: "Juliana Costa", pv: "Gostaria de saber mais sobre o plano...", ch: "wa", chL: "WhatsApp", t: "11:32", un: 2 },
  { id: 1, n: "Rafael Martins", pv: "Você: Envio a proposta ainda hoje.", ch: "mail", chL: "E-mail", t: "10:58", un: 1 },
  { id: 2, n: "Indústria Sul LTDA", pv: "Podemos agendar uma demonstração.", ch: "wa", chL: "WhatsApp", t: "10:41", un: 3 },
  { id: 3, n: "Lucas Andrade", pv: "Você: Perfeito, fico no aguardo!", ch: "ig", chL: "Instagram", t: "09:22", un: 0 },
  { id: 4, n: "Mercado Bom Preço", pv: "Você: Qual seria o melhor horário?", ch: "mail", chL: "E-mail", t: "Ontem", un: 1 },
  { id: 5, n: "Fernanda Ribeiro", pv: "Obrigada pelo retorno!", ch: "wa", chL: "WhatsApp", t: "Ontem", un: 0 },
  { id: 6, n: "Transportes Rio Branco", pv: "Você: Enviarei os materiais solicitados.", ch: "mail", chL: "E-mail", t: "Ontem", un: 0 },
  { id: 7, n: "Clínica Vida & Saúde", pv: "Vamos avançar com a proposta.", ch: "wa", chL: "WhatsApp", t: "21/05", un: 0 },
];

const THREAD0 = [
  { dir: "in", text: "Olá! Gostaria de saber mais sobre o plano empresarial.", tm: "11:29" },
  { dir: "out", text: "Olá, Juliana! Tudo bem?\nClaro, posso te passar mais informações sobre o plano empresarial. O que você gostaria de saber?", tm: "11:30" },
  { dir: "in", text: "Quais os principais benefícios e integrações inclusas?", tm: "11:31" },
  { dir: "out", text: "O plano empresarial inclui:\n• Acesso completo à plataforma HBX\n• Integrações com CRM, WhatsApp e E-mail\n• Relatórios avançados e exportação de dados\n• Suporte prioritário\n\nPosso te enviar uma proposta personalizada com os detalhes, se preferir.", tm: "11:32" },
  { dir: "in", text: "Perfeito! Pode enviar, por favor.", tm: "11:32" },
];

function App() {
  const [sel, setSel] = useState(0);
  const [tab, setTab] = useState(0);
  const [thread, setThread] = useState(THREAD0);
  const [draft, setDraft] = useState("");
  const [tasks, setTasks] = useState([false, false]);
  const endRef = useRef(null);
  const convo = CONVS[sel];

  useEffect(() => { if (endRef.current) endRef.current.scrollTop = endRef.current.scrollHeight; }, [thread]);

  function send() {
    if (!draft.trim()) return;
    setThread(t => [...t, { dir: "out", text: draft.trim(), tm: "agora" }]);
    setDraft("");
  }

  return (
    <div className="app">
      <Sidebar active="atend" />
      <div className="main">
        <Topbar title="Atendimento" crumbs={<React.Fragment>Home &rsaquo; <b>Atendimento</b></React.Fragment>} />
        <div className="a-content">
          <div className="a-left">
            <KpiRow items={[
              { icon: "users", label: "Atendimentos em aberto", value: "128", delta: "+18%" },
              { icon: "clock", label: "Tempo médio de resposta", value: "2h 34m", delta: "-12%", down: false },
              { icon: "check", label: "Conversas qualificadas", value: "54", delta: "+21%" },
              { icon: "money", label: "Conversões", value: "27,4%", delta: "+3,6 p.p." },
            ]} />

            <div className="a-shell">
              <div className="convs">
                <div className="convs-head">
                  <div className="row">
                    <h2>Conversas</h2>
                    <button className="icon-ghost"><I d={ICONS.filter} size={15} /></button>
                    <button className="btn-ghost" style={{ minHeight: 32, fontSize: "0.7rem" }}>Todos os canais ▾</button>
                  </div>
                </div>
                <div className="tabs">
                  {["Todas", "Não lidas", "Minhas"].map((t, i) => (
                    <button key={t} className={"tab" + (tab === i ? " active" : "")} onClick={() => setTab(i)}>
                      {t}{i === 0 && <span className="n">128</span>}{i === 1 && <span className="n">16</span>}
                    </button>
                  ))}
                </div>
                <div style={{ padding: "10px 14px" }}>
                  <input className="field-dark" placeholder="Buscar conversas..." />
                </div>
                <div className="conv-list">
                  {CONVS.map(c => (
                    <button key={c.id} className={"conv" + (sel === c.id ? " sel" : "")} onClick={() => setSel(c.id)}>
                      <Av name={c.n} size={36} />
                      <span style={{ display: "grid", minWidth: 0, flex: 1 }}>
                        <span className="nm"><strong>{c.n}</strong><time>{c.t}</time></span>
                        <span className="pv">
                          <small>{c.pv}</small>
                          <span className={"chan " + c.ch}>{c.chL}</span>
                          {c.un > 0 && <span className="unread">{c.un}</span>}
                        </span>
                      </span>
                    </button>
                  ))}
                </div>
                <div style={{ padding: "10px 14px", borderTop: "1px solid var(--border-hairline)", textAlign: "center" }}>
                  <span className="link">Carregar mais conversas ▾</span>
                </div>
              </div>

              <div className="thread">
                <div className="thread-head">
                  <Av name={convo.n} size={36} />
                  <div style={{ display: "grid", gap: 2 }}>
                    <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <strong>{convo.n}</strong>
                      <span className="on"><i></i>Online</span>
                    </span>
                    <small>Gerente Comercial · Padaria Tradição</small>
                  </div>
                  <div style={{ marginLeft: "auto", display: "grid", gap: 6, justifyItems: "end" }}>
                    <button className="btn-ghost" style={{ minHeight: 30, fontSize: "0.7rem" }}>Negociação ▾</button>
                    <div className="stage-dots"><i className="on"></i><i className="on"></i><i className="on"></i><i className="on"></i><i></i><i></i></div>
                  </div>
                </div>
                <div className="msgs" ref={endRef}>
                  <span className="day">Hoje</span>
                  {thread.map((m, i) => (
                    <div key={i} className={"msg " + m.dir}>
                      {m.dir === "in" && <Av name={convo.n} size={26} />}
                      <div className="bubble">
                        <div style={{ whiteSpace: "pre-line" }}>{m.text}</div>
                        <div className="tm">{m.tm}{m.dir === "out" && <span className="ck">✓✓</span>}</div>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="composer">
                  <div className="row">
                    <input className="field-dark" style={{ flex: 1 }} placeholder="Digite sua mensagem..." value={draft}
                      onChange={e => setDraft(e.target.value)} onKeyDown={e => e.key === "Enter" && send()} />
                    <button className="icon-ghost"><I d={ICONS.smile} size={17} /></button>
                    <button className="icon-ghost"><I d={ICONS.clip} size={17} /></button>
                    <button className="icon-ghost"><I d={ICONS.mark} size={17} /></button>
                    <button className="send" onClick={send}><I d={ICONS.send} size={16} /></button>
                  </div>
                  <div><button className="btn-ghost" style={{ minHeight: 30, fontSize: "0.7rem" }}><I d={ICONS.doc} size={13} /> Inserir mensagem rápida</button></div>
                </div>
              </div>
            </div>
          </div>

          <aside className="ctx">
            <div style={{ display: "flex", gap: 14, borderBottom: "1px solid var(--border-hairline)", paddingBottom: 10 }}>
              <span className="link" style={{ fontSize: "0.78rem" }}>Contexto do lead</span>
              <span style={{ fontSize: "0.78rem", color: "var(--text-muted)", fontWeight: 700, cursor: "pointer" }}>Histórico</span>
            </div>
            <div style={{ display: "flex", gap: 11, alignItems: "center" }}>
              <Av name={convo.n} size={44} />
              <div>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <span className="company">{convo.n}</span>
                  <span className="tag teal">Lead</span>
                </div>
                <div className="sub">Gerente Comercial<br />Padaria Tradição</div>
              </div>
            </div>
            <div className="kv">
              <div className="row"><span className="k" style={{ display: "inline-flex", gap: 6, alignItems: "center" }}><I d={ICONS.mail} size={13} /> E-mail</span><span className="v" style={{ fontWeight: 600, fontSize: "0.7rem" }}>juliana@padariatradicao.com.br</span></div>
              <div className="row"><span className="k" style={{ display: "inline-flex", gap: 6, alignItems: "center" }}><I d={ICONS.phone} size={13} /> Telefone</span><span className="v" style={{ fontFamily: "var(--font-mono)", fontSize: "0.7rem" }}>(11) 98765-4321</span></div>
              <div className="row"><span className="k" style={{ display: "inline-flex", gap: 6, alignItems: "center" }}><I d={ICONS.mapin} size={13} /> Local</span><span className="v" style={{ fontWeight: 600 }}>São Paulo, SP</span></div>
            </div>
            <div className="sep"></div>
            <div className="kv">
              <div className="row"><span className="k">Etapa atual</span><span className="v">Negociação ▾</span></div>
              <div className="row"><span className="k">Desde</span><span className="v">15/05/2026</span></div>
              <div className="row"><span className="k">Lead score</span><span className="v" style={{ display: "inline-flex", gap: 7, alignItems: "center" }}><span style={{ fontFamily: "var(--font-mono)" }}>82</span><span className="tag teal" style={{ fontSize: "0.58rem" }}>Alto</span></span></div>
            </div>
            <div className="sep"></div>
            <div>
              <h3 style={{ marginBottom: 4 }}>Últimas interações <span className="link" style={{ fontWeight: 700 }}>Ver todas</span></h3>
              <div className="kv" style={{ marginTop: 8 }}>
                <div className="row"><span className="k" style={{ display: "inline-flex", gap: 6, alignItems: "center", color: "#22C77D" }}><I d={ICONS.msg} size={13} /><span style={{ color: "var(--text-muted)" }}>WhatsApp recebido</span></span><span className="v" style={{ fontWeight: 600 }}>Hoje, 11:29</span></div>
                <div className="row"><span className="k" style={{ display: "inline-flex", gap: 6, alignItems: "center", color: "#4CC2FF" }}><I d={ICONS.mail} size={13} /><span style={{ color: "var(--text-muted)" }}>E-mail enviado</span></span><span className="v" style={{ fontWeight: 600 }}>Hoje, 10:15</span></div>
                <div className="row"><span className="k" style={{ display: "inline-flex", gap: 6, alignItems: "center", color: "var(--text-body)" }}><I d={ICONS.doc} size={13} /><span style={{ color: "var(--text-muted)" }}>Proposta visualizada</span></span><span className="v" style={{ fontWeight: 600 }}>14/05/2026</span></div>
              </div>
            </div>
            <div className="sep"></div>
            <div>
              <h3 style={{ marginBottom: 4 }}>Tarefas e lembretes <span className="link" style={{ fontWeight: 700 }}>Ver todas</span></h3>
              {[
                { t: "Enviar proposta personalizada", d: "Hoje, 12:00", late: true },
                { t: "Acompanhar retorno da proposta", d: "16/06/2026" },
              ].map((t, i) => (
                <label className="task" key={t.t}>
                  <input type="checkbox" checked={tasks[i]} onChange={() => setTasks(ts => ts.map((v, j) => j === i ? !v : v))} />
                  <span>
                    <span className="t" style={{ textDecoration: tasks[i] ? "line-through" : "none", opacity: tasks[i] ? 0.6 : 1 }}>{t.t}</span>
                    <span className="d" style={{ color: t.late ? "var(--hbx-danger)" : undefined }}>{t.d}</span>
                  </span>
                </label>
              ))}
            </div>
            <div className="sep"></div>
            <div style={{ display: "grid", gap: 8 }}>
              <h3>Ações rápidas</h3>
              <button className="btn-teal"><I d={ICONS.arrow} size={14} /> Mover etapa</button>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                <button className="btn-ghost"><I d={ICONS.check} size={13} /> Criar tarefa</button>
                <button className="btn-ghost"><I d={ICONS.doc} size={13} /> Enviar proposta</button>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
