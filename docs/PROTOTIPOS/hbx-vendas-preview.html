<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}

.stage-tabs{display:flex;gap:7px;overflow:auto;padding:0 1px 10px}.stage-tabs::-webkit-scrollbar{display:none}.stage{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:900;color:#6F7969;white-space:nowrap}.stage.on{background:var(--dark);border-color:var(--dark);color:#fff}

.lead-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{padding:6px 8px;border-radius:9px;background:#F3F6F1;color:#5B6854;font-size:9px;font-weight:800}.chip.today{background:#EAF5DD;color:#477B08}.chip.late{background:#FCE9E9;color:#B03939}.chip.warm{background:#FFF1E4;color:#B1641B}

.hero-search{background:linear-gradient(145deg,#172513,#243B18);color:#fff;border-radius:23px;padding:16px;margin-bottom:11px;position:relative;overflow:hidden;box-shadow:0 16px 32px rgba(22,40,14,.22)}.hero-search:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(124,203,0,.14);right:-55px;top:-70px}.hero-search h2{font-size:19px;margin:0 0 5px;position:relative;z-index:1}.hero-search p{margin:0 0 13px;color:#CAD7C2;font-size:11px;position:relative;z-index:1}.hero-search .search{position:relative;z-index:1;margin:0;background:rgba(255,255,255,.96)}
.company-card{padding:13px}.company-head{display:flex;gap:10px}.company-head .avatar{background:linear-gradient(145deg,#E4EEFC,#C7DDF7);color:#356EA6}.company-main{flex:1;min-width:0}.company-main strong{display:block;font-size:13px}.company-main span{display:block;font-size:10px;color:var(--muted);margin-top:4px}.company-info{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.company-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:11px}.company-actions button{height:40px;border-radius:12px;font-weight:900;border:1px solid var(--line);background:#fff}.company-actions button:first-child{background:var(--dark);color:#fff;border-color:var(--dark)}

.panel{padding:4px 13px}.row{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #EDF1EA}.row:last-child{border-bottom:0}.row-icon{width:37px;height:37px;border-radius:12px;background:#EEF4E9;display:grid;place-items:center}.row-copy{flex:1}.row-copy strong{display:block;font-size:12px}.row-copy span{display:block;color:var(--muted);font-size:9px;margin-top:3px}.chev{color:#84907C}
.sheet-wrap,.modal-wrap{position:absolute;inset:0;background:rgba(8,15,8,.44);z-index:40;display:flex;align-items:flex-end;animation:fade .18s}@keyframes fade{from{opacity:0}to{opacity:1}}.sheet{width:100%;max-height:88%;overflow:auto;background:#F7F9F5;border-radius:28px 28px 0 0;padding:12px 15px 27px;box-shadow:0 -20px 60px rgba(0,0,0,.23);animation:sheet .24s}@keyframes sheet{from{transform:translateY(45px);opacity:.7}to{transform:none;opacity:1}}.handle{width:42px;height:5px;border-radius:99px;background:#D4DCCF;margin:0 auto 13px}.sheet-head{display:flex;align-items:center;gap:10px}.sheet-head .avatar{width:52px;height:52px}.sheet-head>div:nth-child(2){flex:1;min-width:0}.sheet-head h3{font-size:17px;margin:0}.sheet-head p{font-size:10px;color:var(--muted);margin:4px 0 0}.close{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:18px}
.tabs{display:flex;gap:6px;margin:13px 0 10px;border-bottom:1px solid var(--line);padding-bottom:7px}.tabs button{border:0;background:transparent;border-radius:10px;padding:8px 10px;color:var(--muted);font-size:10px;font-weight:900}.tabs button.on{background:#E6F3D7;color:#477A0A}

.note{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:9px}.note b{display:block;font-size:10px}.note p{margin:5px 0 0;color:var(--muted);font-size:10px;line-height:1.45}
.sheet-actions{display:grid;grid-template-columns:42px 42px 1fr;gap:8px;margin-top:11px}.sheet-actions button{height:44px;border-radius:13px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-weight:900}.sheet-actions .main{background:var(--dark);border-color:var(--dark);color:#fff;display:flex;gap:6px}
.modal-wrap{align-items:center;padding:18px}.modal{width:100%;background:#F8FAF6;border-radius:25px;padding:17px;box-shadow:0 25px 70px rgba(0,0,0,.28)}.modal h3{margin:0 0 4px}.modal p{margin:0 0 13px;color:var(--muted);font-size:10px}.form{display:grid;gap:9px}.field{display:grid;gap:5px}.field label{font-size:9px;font-weight:900;color:#63715C}.field input,.field select{height:44px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:0 12px;outline:0}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.modal-actions button{height:44px;border-radius:13px;border:1px solid var(--line);background:#fff;font-weight:900}.modal-actions .save{background:linear-gradient(145deg,var(--brand2),var(--brand));border:0;color:#294B00}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);background:var(--dark);color:#fff;padding:11px 14px;border-radius:13px;font-size:10px;font-weight:900;z-index:80;box-shadow:0 12px 30px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;padding:36px 18px;color:var(--muted);font-size:11px}.empty b{display:block;color:var(--ink);margin-bottom:5px}
svg{display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

</style>

function nav(){return `<nav class="nav">${[['funnel','funnel','Funil'],['search','search','Buscar'],['chat','chat','Conversas'],['agenda','calendar','Agenda'],['more','more','Mais']].map(([s,ic,l])=>`<button class="${state.screen===s?'on':''}" data-screen="${s}">${icon(ic)}<span>${l}</span></button>`).join('')}</nav>`}
function funnel(){
 const q=state.query.toLowerCase();let list=leads.filter(l=>(state.stage==='todos'||l.stage===state.stage)&&(!q||[l.name,l.segment,l.next,l.phone,l.email].join(' ').toLowerCase().includes(q)));
 const summary={total:leads.filter(l=>l.stage!=='encerrado').length,today:leads.filter(l=>l.block==='today').length,overdue:leads.filter(l=>l.block==='overdue').length,closed:leads.filter(l=>l.block==='closed').length}
 return `<section class="screen"><div class="title"><div><h1>Bom dia, Jhonatan</h1><p>Seu próximo contato começa em 18 minutos</p></div><button class="link" data-action="new-lead">+ Novo</button></div>
 <div class="segment"><button class="${state.mode==='funnel'?'on':''}" data-mode="funnel">Meu funil</button><button class="${state.mode==='pipeline'?'on':''}" data-mode="pipeline">Visão por etapas</button></div>
 <div class="kpis"><div class="kpi"><span>NO FUNIL</span><strong>${summary.total}</strong><em>ativos</em></div><div class="kpi danger"><span>ATRASADOS</span><strong>${summary.overdue}</strong><em>agir agora</em></div><div class="kpi"><span>FECHADOS</span><strong>${summary.closed}</strong><em>este mês</em></div></div>
 ${state.mode==='pipeline'?pipeline():`<div class="search">${icon('search',18)}<input id="lead-search" placeholder="Buscar nome, cidade ou ação" value="${state.query}"></div>
 <div class="stage-tabs">${[['todos','Todos'],['novo','Prospecção'],['contato','Qualificação'],['retorno','Proposta'],['qualificado','Negociação'],['encerrado','Fechamento']].map(([s,l])=>`<button class="stage ${state.stage===s?'on':''}" data-stage="${s}">${l}</button>`).join('')}</div>
 <div class="section"><strong>Prioridades</strong><span>${list.length} cards</span></div>
 <div class="lead-list">${list.length?list.map(leadCard).join(''):`<div class="empty"><b>Nenhum card nesta etapa</b>Escolha outro filtro.</div>`}</div>`}
 <button class="fab" data-action="new-lead">${icon('plus',25)}</button></section>`;
}
function pipeline(){
 const stages=[
  ['novo','Prospecção','Faça o primeiro contato','',leads.filter(x=>x.stage==='novo').length],
  ['contato','Qualificação','Classifique e ranqueie','blue',leads.filter(x=>x.stage==='contato').length],
  ['retorno','Proposta','Envie a oferta','orange',leads.filter(x=>x.stage==='retorno').length],
  ['qualificado','Negociação','Follow-up até o sim','purple',leads.filter(x=>x.stage==='qualificado').length],
  ['encerrado','Fechamento','Contrato e ativação','gray',leads.filter(x=>x.stage==='encerrado').length]
 ];
 return `<div class="section"><strong>Etapas reais do funil</strong><span>${leads.length} cards</span></div><div class="pipeline">${stages.map(s=>`<button class="pipeline-row" data-stage-jump="${s[0]}" style="width:100%;text-align:left"><i class="tone ${s[3]}"></i><div><strong>${s[1]}</strong><span>${s[2]}</span></div><b class="count">${s[4]}</b><span class="chev">${icon('chevron',17)}</span></button>`).join('')}</div>`;
}
function leadCard(l){
 const ag=l.agenda==='Atrasado'?'late':l.agenda==='Hoje'?'today':'';
 return `<article class="lead-card" data-lead="${l.id}"><div class="lead-top"><div class="avatar">${l.initial}</div><div class="lead-main"><strong>${l.name}</strong><span>${l.segment}</span></div><div class="score ${l.score>84?'hot':''}">${l.score}</div></div><div class="lead-meta"><span class="chip ${ag}">${l.agenda}</span><span class="chip ${l.temp==='Quente'?'warm':''}">${l.temp}</span><span class="chip">${stageLabel(l.stage)}</span></div><div class="next"><i>${icon('task',15)}</i><div><b>${l.next}</b><span>${l.when}</span></div><span class="chev">${icon('chevron',16)}</span></div><div class="quick"><button data-quick="call" data-id="${l.id}">${icon('phone',15)} Ligar</button><button data-quick="wa" data-id="${l.id}">${icon('chat',15)} WhatsApp</button><button class="primary" data-quick="open" data-id="${l.id}">Abrir</button></div></article>`;
}
function stageLabel(s){return {novo:'Prospecção',contato:'Qualificação',retorno:'Proposta',qualificado:'Negociação',encerrado:'Fechamento'}[s]}
function searchScreen(){
 return `<section class="screen"><div class="title"><div><h1>Buscar empresas</h1><p>Leads prontos para entrar no funil</p></div></div><div class="hero-search"><h2>Encontre o próximo cliente</h2><p>Pesquise por segmento, cidade ou nome da empresa.</p><div class="search">${icon('search',18)}<input id="company-search" placeholder="Ex.: clínica em São Carlos"></div></div>
 <div class="section"><strong>Recomendadas para você</strong><span>${companies.length} resultados</span></div><div class="company-list">${companies.map((c,i)=>`<article class="company-card"><div class="company-head"><div class="avatar">${c.initial}</div><div class="company-main"><strong>${c.name}</strong><span>${c.segment} · ${c.city}</span></div><div class="score ${c.score>84?'hot':''}">${c.score}</div></div><div class="company-info"><span class="chip">WhatsApp confirmado</span><span class="chip">${c.reason}</span></div><div class="company-actions"><button data-add-company="${i}">${state.companiesAdded.has(i)?'Adicionado ao funil ✓':'Adicionar ao funil'}</button><button data-action="company-detail">${icon('chevron',17)}</button></div></article>`).join('')}</div></section>`;
}
function chatScreen(){
 return `<section class="screen"><div class="title"><div><h1>Conversas</h1><p>WhatsApp e retornos do funil</p></div><button class="link">Filtrar</button></div><div class="search">${icon('search',18)}<input placeholder="Buscar conversa"></div><div class="conversation-list">${conversations.map(c=>`<button class="conv-card" data-conversation="${c.name}"><div class="avatar">${c.initial}</div><div class="conv-main"><strong>${c.name}</strong><span>${c.text}</span></div><div><span class="time">${c.time}</span>${c.unread?`<i class="unread">${c.unread}</i>`:''}</div></button>`).join('')}</div></section>`;
}
function agendaScreen(){
 const today=leads.filter(l=>l.block==='today'||l.block==='overdue'),future=leads.filter(l=>l.block==='scheduled');
 return `<section class="screen"><div class="title"><div><h1>Agenda</h1><p>Retornos e compromissos comerciais</p></div></div><div class="day-head">Hoje</div><div class="agenda-list">${today.map(l=>agendaCard(l)).join('')}</div><div class="day-head">Próximos dias</div><div class="agenda-list">${future.map(l=>agendaCard(l)).join('')}</div></section>`;
}
function agendaCard(l){return `<button class="agenda-card" data-lead="${l.id}"><div class="agenda-time">${l.when.split('·').pop().trim()}</div><div class="agenda-main"><strong>${l.name}</strong><span>${l.next}</span></div><span class="agenda-status">${l.agenda}</span></button>`}
function moreScreen(){
 return `<section class="screen"><div class="title"><div><h1>Mais</h1><p>Ferramentas do App Vendas</p></div></div><div class="panel"><button class="row" data-action="report" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left"><div class="row-icon">${icon('chart',18)}</div><div class="row-copy"><strong>Resumo comercial</strong><span>Desempenho, retorno e fechamentos</span></div><span class="chev">${icon('chevron',17)}</span></button><button class="row" data-action="team" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left"><div class="row-icon">${icon('users',18)}</div><div class="row-copy"><strong>Minha equipe</strong><span>Vendedores e distribuição de cards</span></div><span class="chev">${icon('chevron',17)}</span></button><button class="row" data-action="automation" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left"><div class="row-icon">${icon('bolt',18)}</div><div class="row-copy"><strong>Automações</strong><span>Cadências e recuperação</span></div><span class="chev">${icon('chevron',17)}</span></button><button class="row" data-action="settings" style="width:100%;border:0;background:transparent;text-align:left"><div class="row-icon">${icon('gear',18)}</div><div class="row-copy"><strong>Ajustes do aplicativo</strong><span>Notificações e conta conectada</span></div><span class="chev">${icon('chevron',17)}</span></button></div></section>`;
}
function leadSheet(l){
 const tabContent=state.detailTab==='Resumo'?`<div class="detail-grid"><div class="detail"><span>Etapa</span><strong>${stageLabel(l.stage)}</strong></div><div class="detail"><span>Score</span><strong>${l.score}/100</strong></div><div class="detail"><span>Telefone</span><strong>${l.phone}</strong></div><div class="detail"><span>E-mail</span><strong>${l.email}</strong></div></div><div class="note"><b>Próxima ação</b><p>${l.next} · ${l.when}</p></div><div class="note"><b>Contexto</b><p>${l.note}</p></div>`:state.detailTab==='Conversa'?`<div class="note"><b>WhatsApp recente</b><p>Olá! Separei uma apresentação curta do HBX com foco no seu setor. Posso te enviar por aqui?</p></div><div class="note"><b>Resposta</b><p>Sim, pode enviar. Quero entender como funciona o acompanhamento dos vendedores.</p></div>`:`<div class="panel"><div class="row"><div class="row-icon">${icon('phone',17)}</div><div class="row-copy"><strong>Ligação registrada</strong><span>Ontem · 3 min · Retorno solicitado</span></div></div><div class="row"><div class="row-icon">${icon('mail',17)}</div><div class="row-copy"><strong>Apresentação enviada</strong><span>Segunda · E-mail aberto</span></div></div></div>`;
 return `<div class="sheet-wrap" data-action="close-sheet"><div class="sheet" onclick="event.stopPropagation()"><div class="handle"></div><div class="sheet-head"><div class="avatar">${l.initial}</div><div><h3>${l.name}</h3><p>${l.segment}</p></div><button class="close" data-action="close-sheet">×</button></div><div class="tabs">${['Resumo','Conversa','Histórico'].map(t=>`<button class="${state.detailTab===t?'on':''}" data-detail-tab="${t}">${t}</button>`).join('')}</div>${tabContent}<div class="sheet-actions"><button data-action="call">${icon('phone',18)}</button><button data-action="whatsapp">${icon('chat',18)}</button><button class="main" data-action="advance">${icon('task',17)} Avançar etapa</button></div></div></div>`;
}
function modal(){
 if(state.modal==='new')return `<div class="modal-wrap" data-action="close-modal"><div class="modal" onclick="event.stopPropagation()"><h3>Novo card</h3><p>Cadastre um contato manualmente no funil.</p><div class="form"><div class="field"><label>Nome ou empresa</label><input id="new-lead-name" placeholder="Ex.: Empresa Modelo"></div><div class="field"><label>Telefone</label><input placeholder="(00) 00000-0000"></div><div class="field"><label>E-mail</label><input placeholder="contato@empresa.com.br"></div><div class="field"><label>Próxima ação</label><select><option>Fazer primeiro contato</option><option>Enviar apresentação</option><option>Agendar demonstração</option></select></div></div><div class="modal-actions"><button data-action="close-modal">Cancelar</button><button class="save" data-action="save-lead">Criar card</button></div></div></div>`;
 if(state.modal==='report')return `<div class="sheet-wrap" data-action="close-modal"><div class="sheet" onclick="event.stopPropagation()"><div class="handle"></div><div class="sheet-head"><div class="row-icon">${icon('chart',20)}</div><div><h3>Resumo comercial</h3><p>Julho de 2026</p></div><button class="close" data-action="close-modal">×</button></div><div class="kpis" style="margin-top:13px"><div class="kpi"><span>CONTATOS</span><strong>42</strong><em>+18%</em></div><div class="kpi"><span>POSITIVOS</span><strong>7</strong><em>16,7%</em></div><div class="kpi"><span>FECHADOS</span><strong>3</strong><em>R$ 897</em></div></div><div class="note"><b>Principal gargalo</b><p>2 retornos estão atrasados. Priorize Prime Contabilidade e Nexo Imóveis.</p></div></div></div>`;
 return '';
}
function render(){app.innerHTML=header()+`<div class="content">${state.screen==='funnel'?funnel():state.screen==='search'?searchScreen():state.screen==='chat'?chatScreen():state.screen==='agenda'?agendaScreen():moreScreen()}</div>`+nav()+(state.lead?leadSheet(state.lead):'')+modal()+`<div class="toast ${state.toast?'show':''}">${state.toast}</div>`}
let timer;function toast(m){state.toast=m;render();clearTimeout(timer);timer=setTimeout(()=>{state.toast='';render()},1800)}
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-screen],[data-action],[data-mode],[data-stage],[data-lead],[data-quick],[data-stage-jump],[data-detail-tab],[data-add-company],[data-conversation]');
 if(!b)return;
 if(b.dataset.screen){state.screen=b.dataset.screen;state.lead=null;state.modal=null;render();return}
 if(b.dataset.mode){state.mode=b.dataset.mode;render();return}
 if(b.dataset.stage){state.stage=b.dataset.stage;render();return}
 if(b.dataset.stageJump){state.stage=b.dataset.stageJump;state.mode='funnel';render();return}
 if(b.dataset.lead){state.lead=leads.find(l=>l.id==b.dataset.lead);state.detailTab='Resumo';render();return}
 if(b.dataset.detailTab){state.detailTab=b.dataset.detailTab;render();return}
 if(b.dataset.quick){e.stopPropagation();const l=leads.find(x=>x.id==b.dataset.id);if(b.dataset.quick==='open'){state.lead=l;render()}else toast(b.dataset.quick==='call'?`Ligação para ${l.name}`:`WhatsApp de ${l.name}`);return}
 if(b.dataset.addCompany!==undefined){const i=Number(b.dataset.addCompany);state.companiesAdded.add(i);toast(`${companies[i].name} entrou no funil`);return}
 if(b.dataset.conversation){toast(`Abrindo conversa com ${b.dataset.conversation}`);return}
 const a=b.dataset.action;
 if(a==='close-sheet')state.lead=null;
 if(a==='close-modal')state.modal=null;
 if(a==='new-lead')state.modal='new';
 if(a==='save-lead'){const n=document.getElementById('new-lead-name')?.value.trim();state.modal=null;toast(n?`${n} criado no funil`:'Card criado no funil')}
 if(a==='notifications')toast('3 ações enviadas ao celular');
 if(a==='call')toast(`Ligação para ${state.lead?.name||'cliente'}`);
 if(a==='whatsapp')toast(`WhatsApp preparado para ${state.lead?.name||'cliente'}`);
 if(a==='advance'&&state.lead){const order=['novo','contato','retorno','qualificado','encerrado'];const idx=order.indexOf(state.lead.stage);state.lead.stage=order[Math.min(idx+1,order.length-1)];toast(`Movido para ${stageLabel(state.lead.stage)}`)}
 if(a==='report')state.modal='report';
 if(['team','automation','settings','company-detail'].includes(a))toast('Tela preparada para ligação com o HBX');
 render();
});
app.addEventListener('input',e=>{if(e.target.id==='lead-search'){state.query=e.target.value;const p=e.target.selectionStart;render();const i=document.getElementById('lead-search');i.focus();i.setSelectionRange(p,p)}});
setInterval(()=>{const s=app.querySelector('.statusbar>span');if(s)s.textContent=now()},30000);
render();
</script>
</body>
</html>
