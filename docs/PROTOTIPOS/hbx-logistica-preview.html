<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>HBX Logística — Preview Interativo</title>
<style>
:root{
  --brand:#7CCB00; --brand-2:#A8E64E; --brand-dark:#3D7100;
  --ink:#111A25; --muted:#687386; --soft:#EEF3E8; --bg:#E9EFE3;
  --card:#FFFFFF; --line:#DCE5D6; --danger:#D44747; --warning:#E99523;
  --shadow:0 18px 50px rgba(29,54,16,.18); --shadow-sm:0 8px 24px rgba(23,42,15,.10);
  --radius:20px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{
  background:
    radial-gradient(circle at 20% 10%,rgba(124,203,0,.18),transparent 24%),
    radial-gradient(circle at 85% 90%,rgba(124,203,0,.13),transparent 26%),
    linear-gradient(145deg,#eef3eb,#dfe8d9);
  display:grid;place-items:center;padding:24px;
}
button,input{font:inherit}
button{cursor:pointer}
.preview-shell{width:min(100%,430px);position:relative}
.preview-label{
  display:flex;justify-content:space-between;align-items:center;margin:0 8px 12px;color:#405039;
  font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase
}
.preview-label span:last-child{font-weight:600;opacity:.65;text-transform:none;letter-spacing:0}
.phone{
  width:100%;height:min(880px,calc(100vh - 72px));min-height:680px;background:var(--bg);
  border:1px solid rgba(29,54,16,.16);border-radius:34px;overflow:hidden;position:relative;
  box-shadow:var(--shadow);display:flex;flex-direction:column
}
.statusbar{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#0E1724;color:white;font-size:11px;font-weight:700;flex:0 0 auto}
.status-icons{display:flex;gap:6px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--brand)}
.app-head{
  height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  background:rgba(248,251,246,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(64,80,57,.08);flex:0 0 auto
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,var(--brand-2),var(--brand));
  display:grid;place-items:center;color:#294B00;font-weight:1000;box-shadow:0 8px 18px rgba(124,203,0,.28)
}
.brand-copy{min-width:0}
.brand-copy strong{display:block;font-size:15px;line-height:1.1}
.brand-copy span{display:block;font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-actions{display:flex;gap:8px}
.icon-btn{
  width:38px;height:38px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);
  display:grid;place-items:center;position:relative;box-shadow:0 4px 12px rgba(21,41,12,.05)
}
.icon-btn .badge{position:absolute;right:-2px;top:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:9px;display:grid;place-items:center;border:2px solid #fff}
.content{flex:1;overflow:auto;padding:14px 14px 98px;scroll-behavior:smooth}
.content::-webkit-scrollbar{width:0}
.screen{animation:enter .22s ease both}
@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 2px 12px}
.title-row h1{font-size:22px;line-height:1;margin:0;letter-spacing:-.035em}
.title-row p{margin:5px 0 0;color:var(--muted);font-size:12px}
.small-link{border:0;background:none;color:var(--brand-dark);font-size:12px;font-weight:800;padding:5px}
.hero{
  border-radius:24px;background:linear-gradient(145deg,#172513,#233C17);color:#fff;padding:16px;position:relative;overflow:hidden;
  box-shadow:0 16px 32px rgba(22,40,14,.22);margin-bottom:12px
}
.hero:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(124,203,0,.15);right:-60px;top:-70px}
.hero:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;border:1px solid rgba(255,255,255,.08);right:18px;bottom:-58px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative;z-index:1}
.hero-kicker{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#CFEFB1}
.hero h2{font-size:20px;margin:8px 0 5px;letter-spacing:-.025em}
.hero p{margin:0;color:#C9D7C1;font-size:12px}
.route-pill{padding:7px 9px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);font-size:10px;font-weight:800;white-space:nowrap}
.route-pill.live{color:#D7FFB3}
.route-map{height:118px;margin:15px 0 12px;border-radius:18px;background:
  linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
  linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
  #1D2D18;background-size:24px 24px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.route-line{position:absolute;left:42px;top:72px;width:250px;height:4px;background:linear-gradient(90deg,var(--brand),#C0F076);transform:rotate(-13deg);border-radius:8px;box-shadow:0 0 12px rgba(124,203,0,.55)}
.map-node{position:absolute;width:17px;height:17px;border:4px solid #fff;border-radius:50%;background:var(--brand);box-shadow:0 5px 12px rgba(0,0,0,.25)}
.map-node.n1{left:38px;top:79px}.map-node.n2{left:119px;top:58px}.map-node.n3{left:204px;top:42px}.map-node.n4{right:46px;top:23px}
.van{position:absolute;left:146px;top:41px;width:36px;height:25px;background:#fff;color:#244800;border-radius:9px;display:grid;place-items:center;font-size:17px;box-shadow:0 8px 16px rgba(0,0,0,.22)}
.progress-row{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.progress{height:7px;background:rgba(255,255,255,.11);border-radius:99px;overflow:hidden;flex:1}
.progress > i{height:100%;display:block;background:linear-gradient(90deg,var(--brand),#C4F47D);border-radius:99px;transition:width .35s ease}
.progress-row span{font-size:11px;font-weight:800;color:#EAF9DE}
.hero-actions{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:14px;position:relative;z-index:1}
.primary{
  border:0;border-radius:15px;background:linear-gradient(145deg,var(--brand-2),var(--brand));color:#244700;
  font-weight:900;padding:13px 15px;box-shadow:0 9px 20px rgba(124,203,0,.24);display:flex;align-items:center;justify-content:center;gap:8px
}
.primary:active{transform:translateY(1px)}
.ghost-dark{border:1px solid rgba(255,255,255,.13);border-radius:15px;background:rgba(255,255,255,.08);color:white;padding:0 14px;font-weight:800}
.grid-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.kpi{background:rgba(255,255,255,.83);border:1px solid rgba(43,75,24,.08);border-radius:17px;padding:12px;box-shadow:0 6px 18px rgba(34,58,18,.06)}
.kpi span{display:block;color:var(--muted);font-size:10px;font-weight:700}
.kpi strong{display:block;font-size:21px;margin-top:4px;letter-spacing:-.04em}
.kpi em{font-style:normal;font-size:9px;color:var(--brand-dark);font-weight:800}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:15px 2px 8px}
.section-head strong{font-size:14px}
.section-head span{font-size:11px;color:var(--muted)}
.stop-card,.client-card,.product-card,.setting-card{
  background:var(--card);border:1px solid rgba(48,78,30,.09);border-radius:19px;box-shadow:var(--shadow-sm)
}
.stop-card{padding:14px;margin-bottom:10px}
.stop-head{display:flex;gap:11px;align-items:center}
.order{
  width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--brand-dark);font-weight:900;flex:0 0 auto
}
.stop-copy{min-width:0;flex:1}
.stop-copy strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop-copy span{display:block;color:var(--muted);font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-chip{padding:5px 8px;border-radius:99px;background:#F0F5ED;color:#59704C;font-size:9px;font-weight:900;text-transform:uppercase}
.status-chip.done{background:#E8F6D8;color:#3C7800}
.status-chip.late{background:#FCE8E8;color:#AF3030}
.stop-meta{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.mini-chip{padding:6px 8px;border-radius:10px;background:#F5F7F3;color:#5B6854;font-size:10px;font-weight:700}
.stop-actions{display:grid;grid-template-columns:42px 42px 1fr;gap:8px;margin-top:12px}
.action-square,.action-main,.secondary{
  border:1px solid var(--line);background:#fff;border-radius:13px;color:var(--ink);font-weight:800;min-height:42px
}
.action-square{display:grid;place-items:center}
.action-main{background:#172513;color:#fff;border-color:#172513}
.timeline{display:grid;gap:8px}
.timeline .stop-card{box-shadow:none;margin:0;padding:11px 12px;border-radius:15px}
.searchbox{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 12px;height:46px;box-shadow:0 6px 18px rgba(34,58,18,.05);margin-bottom:10px}
.searchbox input{border:0;outline:0;flex:1;min-width:0;color:var(--ink);background:transparent}
.searchbox input::placeholder{color:#98A294}
.chips{display:flex;gap:7px;overflow:auto;padding:0 1px 10px}
.chips::-webkit-scrollbar{display:none}
.filter-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;color:#697464;font-size:10px;font-weight:800;white-space:nowrap}
.filter-chip.on{background:var(--brand);border-color:var(--brand);color:#254500}
.client-list,.product-grid{display:grid;gap:9px}
.client-card{padding:13px;display:flex;align-items:center;gap:11px;transition:.15s}
.client-card:active{transform:scale(.995)}
.avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#E9F7D6,#CFEEA5);display:grid;place-items:center;color:#477C05;font-weight:900;flex:0 0 auto}
.client-main{min-width:0;flex:1}
.client-main strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-main span{display:block;color:var(--muted);font-size:10px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-main small{display:inline-block;color:#567044;background:#F1F5EE;padding:4px 6px;border-radius:8px;margin-top:6px;font-size:9px;font-weight:800}
.chev{color:#829078;font-weight:900}
.fab{position:absolute;right:18px;bottom:88px;width:56px;height:56px;border:0;border-radius:18px;background:linear-gradient(145deg,var(--brand-2),var(--brand));color:#284900;font-size:25px;box-shadow:0 15px 28px rgba(83,138,0,.35);z-index:12}
.product-grid{grid-template-columns:1fr 1fr}
.product-card{padding:13px;min-height:142px;display:flex;flex-direction:column}
.prod-icon{width:40px;height:40px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:20px}
.product-card strong{font-size:13px;margin-top:10px}
.product-card span{font-size:10px;color:var(--muted);margin-top:4px}
.product-card b{margin-top:auto;padding-top:10px;color:var(--brand-dark);font-size:12px}
.setting-card{padding:4px 13px;margin-bottom:10px}
.setting-row{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #EDF1EA}
.setting-row:last-child{border-bottom:0}
.setting-icon{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.setting-copy{flex:1;min-width:0}
.setting-copy strong{display:block;font-size:12px}.setting-copy span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.toggle{width:42px;height:24px;border-radius:99px;background:#CDD5C7;padding:3px;transition:.2s}
.toggle i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:.2s}
.toggle.on{background:var(--brand)}.toggle.on i{transform:translateX(18px)}
.profile-card{background:linear-gradient(145deg,#fff,#F4F8F0);border:1px solid var(--line);border-radius:21px;padding:15px;display:flex;align-items:center;gap:12px;margin-bottom:11px}
.profile-card .avatar{width:48px;height:48px}.profile-card strong{display:block}.profile-card span{font-size:11px;color:var(--muted)}
.nav{
  height:78px;position:absolute;left:10px;right:10px;bottom:10px;background:rgba(253,254,252,.94);backdrop-filter:blur(18px);
  border:1px solid rgba(51,80,34,.10);border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 5px;z-index:20;box-shadow:0 14px 35px rgba(35,60,20,.16)
}
.nav-btn{border:0;background:transparent;border-radius:18px;color:#7A8673;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9px;font-weight:800}
.nav-btn svg{width:21px;height:21px}.nav-btn.on{background:linear-gradient(145deg,#DDF4BE,#C8EA98);color:#315900}
.sheet-wrap,.modal-wrap{position:absolute;inset:0;background:rgba(8,17,7,.43);z-index:40;display:flex;align-items:flex-end;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-height:84%;overflow:auto;background:#F7FAF4;border-radius:28px 28px 0 0;padding:12px 15px 26px;box-shadow:0 -20px 60px rgba(0,0,0,.22);animation:sheet .24s ease}
@keyframes sheet{from{transform:translateY(45px);opacity:.7}to{transform:none;opacity:1}}
.handle{width:42px;height:5px;border-radius:99px;background:#D4DCCF;margin:0 auto 13px}
.sheet-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.sheet-head .avatar{width:50px;height:50px}
.sheet-head div:nth-child(2){flex:1;min-width:0}.sheet-head h3{margin:0;font-size:17px}.sheet-head p{margin:4px 0 0;color:var(--muted);font-size:11px}
.close{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:18px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.detail{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px}.detail span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:800}.detail strong{display:block;font-size:12px;margin-top:5px}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.sheet-actions button{min-height:45px;border-radius:14px;font-weight:900}
.modal-wrap{align-items:center;padding:18px}
.modal{width:100%;background:#F8FAF6;border-radius:25px;padding:17px;box-shadow:0 25px 70px rgba(0,0,0,.28)}
.modal h3{margin:0 0 4px}.modal p{margin:0 0 13px;color:var(--muted);font-size:11px}
.form-grid{display:grid;gap:9px}.field{display:grid;gap:5px}.field label{font-size:10px;font-weight:800;color:#61705A}.field input,.field select{height:44px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:0 12px;outline:0}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.modal-actions button{height:44px;border-radius:13px;font-weight:900}
.secondary{background:#fff}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);background:#111A25;color:#fff;padding:11px 14px;border-radius:13px;font-size:11px;font-weight:800;z-index:80;box-shadow:0 12px 30px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:38px 18px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:5px}
svg{display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:520px){
 body{padding:0;background:var(--bg)}
 .preview-label{display:none}.preview-shell{width:100%;height:100vh}.phone{height:100vh;min-height:0;border:0;border-radius:0;box-shadow:none}
}
</style>
</head>
<body>
<div class="preview-shell">
  <div class="preview-label"><span>HBX Logística</span><span>Preview navegável</span></div>
  <main class="phone" id="app"></main>
</div>

  chevron:'<path d="m9 18 6-6-6-6"/>',

  wallet:'<path d="M20 7V5a2 2 0 0 0-2-2H5a3 3 0 0 0 0 6h15v12H5a3 3 0 0 1-3-3V6"/><path d="M16 13h4"/>',

 return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.box}</svg>`
}
const clients=[
 {id:1,name:'Alugtec Equipamentos',day:'Seg',address:'Rua das Acácias, 214',phone:'(11) 99999-0101',debt:'Em dia',freq:'Seg · Qui',initial:'AE'},

 {id:3,name:'Casas & Vida',day:'Qua',address:'Rua do Comércio, 510',phone:'(11) 99999-0103',debt:'Em dia',freq:'Qua · Sáb',initial:'CV'},
 {id:4,name:'Centro de Oftalmologia',day:'Qui',address:'Av. Brasil, 1450',phone:'(11) 99999-0104',debt:'Em dia',freq:'Qui',initial:'CO'},
 {id:5,name:'Escola Adventista',day:'Sex',address:'Rua das Flores, 73',phone:'(11) 99999-0105',debt:'R$ 120,00',freq:'Sex',initial:'EA'},
 {id:6,name:'Pet Center Contacto',day:'Sáb',address:'Rua Tiradentes, 901',phone:'(11) 99999-0106',debt:'Em dia',freq:'Sáb',initial:'PC'},
 {id:7,name:'Posto São Paulo Minas',day:'Seg',address:'Rod. Municipal, km 4',phone:'(11) 99999-0107',debt:'Em dia',freq:'Seg · Sex',initial:'PS'},
 {id:8,name:'Sabor do Pão',day:'Dom',address:'Praça da Matriz, 22',phone:'(11) 99999-0108',debt:'R$ 48,00',freq:'Dom',initial:'SP'},
 {id:9,name:'Sonho Doce',day:'Seg',address:'Rua 7 de Setembro, 304',phone:'(11) 99999-0109',debt:'Em dia',freq:'Seg',initial:'SD'}
];
const products=[
 {name:'Galão 20L',sub:'Água mineral',price:'R$ 18,00',emoji:'💧'},
 {name:'Galão 10L',sub:'Água mineral',price:'R$ 12,00',emoji:'🫗'},
 {name:'Fardo 500ml',sub:'12 unidades',price:'R$ 24,00',emoji:'📦'},
 {name:'Gás 13kg',sub:'Botijão residencial',price:'R$ 115,00',emoji:'🔥'}
];
const stops=[
 {client:'Alugtec Equipamentos',address:'Rua das Acácias, 214',time:'08:30',status:'done',meta:'2 galões · Recebido'},
 {client:'Bazar Oriental',address:'Av. Central, 88',time:'09:10',status:'done',meta:'1 galão · Pix'},
 {client:'Casas & Vida',address:'Rua do Comércio, 510',time:'09:45',status:'next',meta:'3 galões · Cobrar R$ 54'},
 {client:'Centro de Oftalmologia',address:'Av. Brasil, 1450',time:'10:30',status:'pending',meta:'2 galões · Mensalista'},
 {client:'Escola Adventista',address:'Rua das Flores, 73',time:'11:10',status:'pending',meta:'8 galões · NF'},
 {client:'Pet Center Contacto',address:'Rua Tiradentes, 901',time:'13:30',status:'pending',meta:'2 galões · Pix'}
];
let state={screen:'route',routeActive:true,completed:2,filter:'Todos',query:'',sheet:null,modal:null,toast:'',tracked:true,notify:true,gps:true};
const app=document.getElementById('app');
function now(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function header(){
 const sub={route:'Rota de hoje',clients:'Clientes',products:'Produtos',settings:'Ajustes'}[state.screen];
 return `<div class="statusbar"><span>${now()}</span><span class="status-icons"><span class="dot"></span> 4G ▰</span></div>
 <header class="app-head"><div class="brand"><div class="brand-mark">»</div><div class="brand-copy"><strong>HBX Logística</strong><span>${sub} · Motorista online</span></div></div>
 <div class="head-actions"><button class="icon-btn" data-action="notifications">${icon('bell',18)}<i class="badge">2</i></button></div></header>`;
}
function nav(){
 return `<nav class="nav">
 ${[['route','route','Rota'],['clients','users','Clientes'],['products','box','Produtos'],['settings','gear','Ajustes']].map(([id,ic,l])=>`<button class="nav-btn ${state.screen===id?'on':''}" data-screen="${id}">${icon(ic)}<span>${l}</span></button>`).join('')}
 </nav>`;
}
function routeScreen(){
 const pct=Math.round(state.completed/stops.length*100);
 const current=stops[Math.min(state.completed,stops.length-1)];
 const allDone=state.completed>=stops.length;
 return `<section class="screen">
  <div class="title-row"><div><h1>Bom dia, Carlos</h1><p>${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</p></div><button class="small-link" data-action="open-map">Ver mapa</button></div>
  <article class="hero">
   <div class="hero-top"><div><span class="hero-kicker"><i class="dot"></i> ${state.routeActive?'Rota ativa':'Rota pronta'}</span><h2>Zona Norte · ${stops.length} paradas</h2><p>${state.tracked?'Rastreamento ao vivo ligado':'Modo essencial'} · previsão 14:20</p></div><span class="route-pill ${state.routeActive?'live':''}">${state.tracked?'Rastreada':'Essencial'}</span></div>
   <div class="route-map"><div class="route-line"></div><i class="map-node n1"></i><i class="map-node n2"></i><i class="map-node n3"></i><i class="map-node n4"></i><div class="van">🚚</div></div>
   <div class="progress-row"><div class="progress"><i style="width:${pct}%"></i></div><span>${state.completed}/${stops.length}</span></div>
   <div class="hero-actions"><button class="primary" data-action="route-toggle">${icon(state.routeActive?'gps':'route',18)} ${state.routeActive?'Rota em andamento':'Iniciar rota'}</button><button class="ghost-dark" data-action="open-map">${icon('map',19)}</button></div>
  </article>
  <div class="grid-kpi"><div class="kpi"><span>Entregues</span><strong>${state.completed}</strong><em>hoje</em></div><div class="kpi"><span>Pendentes</span><strong>${Math.max(0,stops.length-state.completed)}</strong><em>na rota</em></div><div class="kpi"><span>Recebido</span><strong>R$ 72</strong><em>confirmado</em></div></div>
  <div class="section-head"><strong>${allDone?'Rota concluída':'Próxima parada'}</strong><span>${allDone?'Bom trabalho':'${current.time}'}</span></div>
  ${allDone?`<div class="stop-card"><div class="empty"><b>Todas as entregas foram concluídas</b>A rota está pronta para ser encerrada.</div><button class="primary" style="width:100%" data-action="finish-route">Encerrar rota</button></div>`:stopCard(current,state.completed,true)}
  <div class="section-head"><strong>Sequência da rota</strong><span>${stops.length} paradas</span></div>
  <div class="timeline">${stops.map((s,i)=>stopCard(s,i,false)).join('')}</div>
 </section>`;
}
function stopCard(s,i,featured){
 const done=i<state.completed;
 const next=i===state.completed;
 const status=done?'done':next?'next':'pending';
 const label=done?'Entregue':next?'Agora':'Pendente';
 return `<article class="stop-card ${featured?'featured':''}" data-stop="${i}">
  <div class="stop-head"><div class="order">${done?icon('check',18):i+1}</div><div class="stop-copy"><strong>${s.client}</strong><span>${s.address}</span></div><span class="status-chip ${done?'done':''}">${label}</span></div>
  <div class="stop-meta"><span class="mini-chip">${s.time}</span><span class="mini-chip">${s.meta}</span></div>
  ${featured&&!done?`<div class="stop-actions"><button class="action-square" data-action="call">${icon('phone',18)}</button><button class="action-square" data-action="whatsapp">${icon('message',18)}</button><button class="action-main" data-action="confirm-delivery">${state.routeActive?'Confirmar entrega':'Inicie a rota'}</button></div>`:''}
 </article>`;
}
function clientsScreen(){
 const q=state.query.toLowerCase();
 const list=clients.filter(c=>(state.filter==='Todos'||c.day===state.filter)&&(!q||[c.name,c.address,c.phone].join(' ').toLowerCase().includes(q)));
 return `<section class="screen"><div class="title-row"><div><h1>Clientes</h1><p>${clients.length} ativos · agenda recorrente</p></div></div>
  <div class="searchbox">${icon('search',18)}<input id="client-search" placeholder="Buscar cliente, rua ou telefone" value="${state.query}"></div>
  <div class="chips">${['Todos','Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<button class="filter-chip ${state.filter===x?'on':''}" data-filter="${x}">${x}</button>`).join('')}</div>
  <div class="client-list">${list.length?list.map(c=>`<button class="client-card" data-client="${c.id}" style="text-align:left;width:100%">
    <div class="avatar">${c.initial}</div><div class="client-main"><strong>${c.name}</strong><span>${c.address}</span><small>${c.freq} · ${c.debt}</small></div><span class="chev">${icon('chevron',18)}</span>
  </button>`).join(''):`<div class="empty"><b>Nenhum cliente encontrado</b>Tente outro filtro ou termo.</div>`}</div>
  <button class="fab" data-action="new-client">${icon('plus',24)}</button>
 </section>`;
}
function productsScreen(){
 return `<section class="screen"><div class="title-row"><div><h1>Produtos</h1><p>Catálogo usado nas entregas</p></div><button class="small-link" data-action="new-product">Adicionar</button></div>
 <div class="product-grid">${products.map(p=>`<button class="product-card" data-product="${p.name}" style="text-align:left"><div class="prod-icon">${p.emoji}</div><strong>${p.name}</strong><span>${p.sub}</span><b>${p.price}</b></button>`).join('')}</div>
 <div class="section-head"><strong>Resumo</strong><span>Hoje</span></div>
 <div class="setting-card"><div class="setting-row"><div class="setting-icon">${icon('box',18)}</div><div class="setting-copy"><strong>18 itens na rota</strong><span>12 entregues · 6 pendentes</span></div><span class="chev">${icon('chevron',17)}</span></div><div class="setting-row"><div class="setting-icon">${icon('wallet',18)}</div><div class="setting-copy"><strong>R$ 324,00 previsto</strong><span>R$ 72,00 já confirmado</span></div><span class="chev">${icon('chevron',17)}</span></div></div>
 </section>`;
}
function settingsScreen(){
 return `<section class="screen"><div class="title-row"><div><h1>Ajustes</h1><p>Conta, rota e permissões</p></div></div>
 <div class="profile-card"><div class="avatar">CS</div><div><strong>Carlos Silva</strong><span>Motorista · Distribuidora Modelo</span></div></div>
 <div class="section-head"><strong>Operação</strong></div>
 <div class="setting-card">
  ${settingRow('gps','Rastreamento da rota',state.tracked?'Rota rastreada ativa':'Modo essencial','tracked',state.tracked)}
  ${settingRow('bell','Avisos de entrega','Som, vibração e tela bloqueada','notify',state.notify)}
  ${settingRow('gps','Localização em segundo plano','Somente durante rota ativa','gps',state.gps)}
 </div>
 <div class="section-head"><strong>Gestão</strong></div>
 <div class="setting-card">
  <button class="setting-row" data-action="statement" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left"><div class="setting-icon">${icon('wallet',18)}</div><div class="setting-copy"><strong>Consumo e bônus</strong><span>Saldo e extrato de créditos</span></div><span class="chev">${icon('chevron',17)}</span></button>
  <button class="setting-row" data-action="logout" style="width:100%;border:0;background:transparent;text-align:left"><div class="setting-icon">${icon('logout',18)}</div><div class="setting-copy"><strong>Sair deste aparelho</strong><span>Remove a sessão local</span></div><span class="chev">${icon('chevron',17)}</span></button>
 </div>
 </section>`;
}
function settingRow(ic,title,sub,key,on){return `<button class="setting-row" data-toggle="${key}" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left"><div class="setting-icon">${icon(ic,18)}</div><div class="setting-copy"><strong>${title}</strong><span>${sub}</span></div><span class="toggle ${on?'on':''}"><i></i></span></button>`}
function clientSheet(c){
 return `<div class="sheet-wrap" data-action="close-sheet"><div class="sheet" onclick="event.stopPropagation()"><div class="handle"></div><div class="sheet-head"><div class="avatar">${c.initial}</div><div><h3>${c.name}</h3><p>${c.address}</p></div><button class="close" data-action="close-sheet">×</button></div>
 <div class="detail-grid"><div class="detail"><span>Telefone</span><strong>${c.phone}</strong></div><div class="detail"><span>Agenda</span><strong>${c.freq}</strong></div><div class="detail"><span>Financeiro</span><strong>${c.debt}</strong></div><div class="detail"><span>Próxima entrega</span><strong>Hoje · 10:30</strong></div></div>
 <div class="setting-card"><div class="setting-row"><div class="setting-icon">${icon('box',18)}</div><div class="setting-copy"><strong>Pedido padrão</strong><span>2 × Galão 20L · R$ 36,00</span></div><span class="chev">${icon('chevron',17)}</span></div></div>
 <div class="sheet-actions"><button class="secondary" data-action="whatsapp">${icon('message',17)} WhatsApp</button><button class="primary" data-action="add-delivery">${icon('plus',17)} Criar entrega</button></div></div></div>`;
}
function modal(){
 if(state.modal==='new-client')return `<div class="modal-wrap" data-action="close-modal"><div class="modal" onclick="event.stopPropagation()"><h3>Novo cliente</h3><p>Cadastro rápido para entrar na próxima rota.</p><div class="form-grid"><div class="field"><label>Nome</label><input id="new-name" placeholder="Nome ou empresa"></div><div class="field"><label>Telefone</label><input placeholder="(00) 00000-0000"></div><div class="field"><label>Endereço</label><input placeholder="Rua, número e bairro"></div><div class="field"><label>Dia de entrega</label><select><option>Segunda-feira</option><option>Terça-feira</option><option>Quarta-feira</option><option>Quinta-feira</option><option>Sexta-feira</option></select></div></div><div class="modal-actions"><button class="secondary" data-action="close-modal">Cancelar</button><button class="primary" data-action="save-client">Salvar cliente</button></div></div></div>`;
 if(state.modal==='map')return `<div class="sheet-wrap" data-action="close-modal"><div class="sheet" onclick="event.stopPropagation()"><div class="handle"></div><div class="sheet-head"><div class="setting-icon">${icon('map',21)}</div><div><h3>Mapa da rota</h3><p>Atualização ao vivo · sinal bom</p></div><button class="close" data-action="close-modal">×</button></div><div class="route-map" style="height:300px;background-color:#E8EFE3;border-color:#D5E0CF"><div class="route-line" style="top:180px;left:25px;width:330px;transform:rotate(-24deg)"></div><i class="map-node n1"></i><i class="map-node n2" style="left:135px;top:145px"></i><i class="map-node n3" style="left:245px;top:96px"></i><i class="map-node n4" style="right:18px;top:55px"></i><div class="van" style="left:178px;top:117px">🚚</div></div><button class="primary" style="width:100%;margin-top:12px" data-action="close-modal">Voltar para a rota</button></div></div>`;
 if(state.modal==='statement')return `<div class="sheet-wrap" data-action="close-modal"><div class="sheet" onclick="event.stopPropagation()"><div class="handle"></div><div class="sheet-head"><div class="setting-icon">${icon('wallet',21)}</div><div><h3>Consumo e bônus</h3><p>Julho de 2026</p></div><button class="close" data-action="close-modal">×</button></div><div class="grid-kpi"><div class="kpi"><span>Saldo</span><strong>37</strong><em>créditos</em></div><div class="kpi"><span>Essencial</span><strong>3</strong><em>blocos</em></div><div class="kpi"><span>Rastreada</span><strong>12</strong><em>créditos</em></div></div><div class="setting-card"><div class="setting-row"><div class="setting-icon">🎁</div><div class="setting-copy"><strong>+2 créditos de bônus</strong><span>20% dos créditos pagos elegíveis</span></div><span class="status-chip done">Concedido</span></div><div class="setting-row"><div class="setting-icon">${icon('check',18)}</div><div class="setting-copy"><strong>6 entregas rastreadas</strong><span>2 créditos por conclusão válida</span></div></div></div></div></div>`;
 return '';
}
function render(){
 app.innerHTML=header()+`<div class="content">${state.screen==='route'?routeScreen():state.screen==='clients'?clientsScreen():state.screen==='products'?productsScreen():settingsScreen()}</div>`+nav()+(state.sheet?clientSheet(state.sheet):'')+modal()+`<div class="toast ${state.toast?'show':''}">${state.toast}</div>`;
}
let toastTimer;
function toast(msg){state.toast=msg;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';render()},1800)}
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-screen],[data-action],[data-filter],[data-client],[data-toggle],[data-product]');
 if(!b)return;
 if(b.dataset.screen){state.screen=b.dataset.screen;state.sheet=null;state.modal=null;render();return}
 if(b.dataset.filter){state.filter=b.dataset.filter;render();return}
 if(b.dataset.client){state.sheet=clients.find(c=>c.id==b.dataset.client);render();return}
 if(b.dataset.toggle){state[b.dataset.toggle]=!state[b.dataset.toggle];render();return}
 if(b.dataset.product){toast(`${b.dataset.product} selecionado`);return}
 const a=b.dataset.action;
 if(a==='close-sheet')state.sheet=null;
 if(a==='close-modal')state.modal=null;
 if(a==='new-client')state.modal='new-client';
 if(a==='open-map')state.modal='map';
 if(a==='statement')state.modal='statement';
 if(a==='route-toggle'){state.routeActive=!state.routeActive;toast(state.routeActive?'Rota iniciada e GPS ativo':'Rota pausada')}
 if(a==='confirm-delivery'){if(!state.routeActive)return toast('Inicie a rota primeiro'); if(state.completed<stops.length){state.completed++;toast('Entrega confirmada ✓')}}
 if(a==='finish-route'){state.routeActive=false;toast('Rota encerrada com sucesso')}
 if(a==='call')toast('Abrindo ligação no celular…');
 if(a==='whatsapp')toast('Abrindo WhatsApp com mensagem pronta…');
 if(a==='notifications')toast('2 avisos operacionais');
 if(a==='add-delivery'){state.sheet=null;toast('Entrega adicionada à rota')}
 if(a==='new-product')toast('Cadastro de produto será ligado pelo Codex');
 if(a==='logout')toast('Preview: sessão mantida');
 if(a==='save-client'){const name=document.getElementById('new-name')?.value.trim();state.modal=null;toast(name?`${name} cadastrado`:'Cliente cadastrado')}
 render();
});
app.addEventListener('input',e=>{if(e.target.id==='client-search'){state.query=e.target.value;const pos=e.target.selectionStart;render();const input=document.getElementById('client-search');input.focus();input.setSelectionRange(pos,pos)}})
setInterval(()=>{const s=app.querySelector('.statusbar>span');if(s)s.textContent=now()},30000);
render();
</script>
</body>
</html>
