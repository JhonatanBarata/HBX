<text class="ts" x="495" y="500" text-anchor="middle">ativa · cnae · dv · celular c/ 9</text>
</g>
<line class="arr" x1="185" y1="516" x2="300" y2="528" marker-end="url(#arrow)"/>
<line class="arr" x1="495" y1="516" x2="380" y2="528" marker-end="url(#arrow)"/>
<g class="c-purple">
<rect x="190" y="532" width="300" height="56" rx="6"/>
