<text class="ts" x="340" y="410" text-anchor="middle">ddg · bing · crawl (ip residencial)</text>
<text class="ts" x="340" y="428" text-anchor="middle">novos/informais + site/insta</text>
</g>
<line class="arr" x1="340" y1="440" x2="185" y2="452" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="440" x2="495" y2="452" marker-end="url(#arrow)"/>
<g class="c-coral">
