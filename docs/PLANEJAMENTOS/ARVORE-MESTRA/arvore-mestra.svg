</style>
<rect x="0" y="0" width="680" height="1650" fill="#141414"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8a8a82" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="lbl" x="40" y="28">Camada de dados — o patrimônio...</text>
<g class="c-purple">
<rect x="90" y="38" width="500" height="78" rx="6"/>
