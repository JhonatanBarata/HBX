<svg width="880" viewBox="0 0 680 1650" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Árvore mestra do motor de leads — desenho final</title>
<style>
  text { font-family: system-ui, Segoe UI, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; font-weight: 400; }
  .lbl { font-size: 12px; fill: #97C459; font-style: italic; }
  .arr, .leader { stroke: #8a8a82; stroke-width: 1.5; }
  .leader { stroke-dasharray: 5 4; }
  .c-purple rect { fill: #342d78; stroke: #AFA9EC; }
  .c-purple .th { fill: #E4E1FB; } .c-purple .ts { fill: #AFA9EC; }
  .c-gray rect { fill: #2C2C2A; stroke: #8f8d84; }
  .c-gray .th { fill: #F1EFE8; } .c-gray .ts { fill: #B4B2A9; }
  .c-teal rect { fill: #0a4a3c; stroke: #5DCAA5; }
  .c-teal .th { fill: #cff0e2; } .c-teal .ts { fill: #7fd6b4; }
  .c-amber rect { fill: #5a3306; stroke: #FAC775; }
  .c-amber .th { fill: #fbe3b8; } .c-amber .ts { fill: #F0B85B; }
  .c-coral rect { fill: #66270f; stroke: #F0997B; }
  .c-coral .th { fill: #f8d4c4; } .c-coral .ts { fill: #F0997B; }
  .c-red rect { fill: #6d1c1c; stroke: #F09595; }
