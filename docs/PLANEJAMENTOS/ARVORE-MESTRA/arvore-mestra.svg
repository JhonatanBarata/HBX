<text class="ts" x="340" y="84" text-anchor="middle">razão · fantasia · cnae · situação · endereço · fone frio · sócios</text>
<text class="ts" x="340" y="104" text-anchor="middle">select cidade+cnae &lt;500ms · refresh mensal · vps não recebe o dump</text>
</g>
<line class="arr" x1="210" y1="116" x2="210" y2="128" marker-end="url(#arrow)"/>
<line class="arr" x1="470" y1="116" x2="470" y2="128" marker-end="url(#arrow)"/>
<g class="c-purple">
<rect x="90" y="130" width="240" height="52" rx="6"/>
<text class="th" x="210" y="152" text-anchor="middle">LeadContact</text>
<text class="ts" x="210" y="172" text-anchor="middle">todo contato é 1ª classe</text>
</g>
<g class="c-purple">
<rect x="350" y="130" width="240" height="52" rx="6"/>
<text class="th" x="470" y="152" text-anchor="middle">RadarCoverage</text>
<text class="ts" x="470" y="172" text-anchor="middle">cidade×nicho: fresco/esgotado</text>
</g>

<text class="lbl" x="40" y="218">Pesquisa do cliente — 100% grátis, ordem fixa...</text>
