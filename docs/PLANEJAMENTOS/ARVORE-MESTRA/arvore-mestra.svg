<rect x="190" y="1254" width="300" height="56" rx="6"/>
<text class="th" x="340" y="1276" text-anchor="middle">M5 · 30b local — extração · R$ 0</text>
<text class="ts" x="340" y="1296" text-anchor="middle">dono/email · gate anti-alucinação</text>
</g>
<line class="arr" x1="340" y1="1310" x2="340" y2="1322" marker-end="url(#arrow)"/>
<g class="c-teal">
<rect x="190" y="1326" width="300" height="52" rx="6"/>
