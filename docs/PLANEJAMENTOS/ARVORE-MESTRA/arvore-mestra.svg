<rect x="190" y="228" width="300" height="52" rx="6"/>
<text class="th" x="340" y="250" text-anchor="middle">1 · Semente</text>
<text class="ts" x="340" y="270" text-anchor="middle">nicho + cidade (+vizinha opt-in)</text>
</g>
<line class="arr" x1="340" y1="280" x2="340" y2="292" marker-end="url(#arrow)"/>
<g class="c-gray">
<rect x="190" y="296" width="300" height="56" rx="6"/>
<text class="th" x="340" y="318" text-anchor="middle">2 · Select na base RFB · R$ 0</text>
<text class="ts" x="340" y="338" text-anchor="middle">sempre primeiro — traz os formais</text>
</g>
<line class="arr" x1="340" y1="352" x2="340" y2="364" marker-end="url(#arrow)"/>
