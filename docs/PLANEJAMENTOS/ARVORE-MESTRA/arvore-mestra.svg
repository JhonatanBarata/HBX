<text class="ts" x="340" y="1368" text-anchor="middle">card esperando vendedor</text>
</g>
<path d="M490,1210 C630,1210 630,1445 542,1445" fill="none" class="leader" marker-end="url(#arrow)"/>

<text class="lbl" x="40" y="1418">Onde vive o dinheiro — um cofre só...</text>
<g class="c-amber">
<rect x="140" y="1428" width="400" height="76" rx="6"/>
<text class="th" x="340" y="1452" text-anchor="middle">Governor — o freio físico</text>
<text class="ts" x="340" y="1472" text-anchor="middle">sem saldo = não chama (fail-closed)</text>
<text class="ts" x="340" y="1490" text-anchor="middle">gauge :3107 · botão parar corta tudo</text>
</g>
<line class="arr" x1="240" y1="1504" x2="135" y2="1518" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="1504" x2="340" y2="1518" marker-end="url(#arrow)"/>
<line class="arr" x1="440" y1="1504" x2="545" y2="1518" marker-end="url(#arrow)"/>
<g class="c-red">
<rect x="45" y="1522" width="180" height="64" rx="6"/>
<text class="th" x="135" y="1544" text-anchor="middle">Brave</text>
<text class="ts" x="135" y="1562" text-anchor="middle">teto 900/mês</text>
<text class="ts" x="135" y="1578" text-anchor="middle">julho: estourado</text>
</g>
<g class="c-red">
<rect x="250" y="1522" width="180" height="64" rx="6"/>
<text class="th" x="340" y="1544" text-anchor="middle">Serper</text>
<text class="ts" x="340" y="1562" text-anchor="middle">off por default</text>
<text class="ts" x="340" y="1578" text-anchor="middle">liga só por env</text>
</g>
<g class="c-red">
<rect x="455" y="1522" width="180" height="64" rx="6"/>
<text class="th" x="545" y="1544" text-anchor="middle">Google Places</text>
<text class="ts" x="545" y="1562" text-anchor="middle">teto 200/dia</text>
<text class="ts" x="545" y="1578" text-anchor="middle">emergência manual</text>
</g>

<g class="c-purple"><rect x="60" y="1614" width="12" height="12" rx="2"/></g>
<text class="ts" x="78" y="1624" fill="#B4B2A9">dado central</text>
<g class="c-gray"><rect x="175" y="1614" width="12" height="12" rx="2"/></g>
<text class="ts" x="193" y="1624" fill="#B4B2A9">grátis</text>
<g class="c-teal"><rect x="255" y="1614" width="12" height="12" rx="2"/></g>
<text class="ts" x="273" y="1624" fill="#B4B2A9">entrega/validação</text>
<g class="c-amber"><rect x="410" y="1614" width="12" height="12" rx="2"/></g>
<text class="ts" x="428" y="1624" fill="#B4B2A9">freio</text>
<g class="c-red"><rect x="490" y="1614" width="12" height="12" rx="2"/></g>
<text class="ts" x="508" y="1624" fill="#B4B2A9">api paga</text>
</svg>
