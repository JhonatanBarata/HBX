# ============================================================================
# TUNING DO POSTGRES DE PRODUCAO — hbx-postgres / hbx_prod
# ============================================================================
# FONTE DA VERDADE deste tuning. Aplicado na VPS por:
#     npm run db:tune:apply      (aplica + reload; avisa se falta restart)
#     npm run db:tune            (so confere; sai != 0 se houver desvio)
#
# COMO ISSO SOBREVIVE AO `npm run publish`:
#   1. O container hbx-postgres NAO esta em docker-compose.hostinger.yml (o unico
#      compose que o publish sobe). Logo `up -d --force-recreate` do publish nao
#      toca no Postgres — conferido em scripts/ops/deploy-vps.js.
#      NAO ADICIONE hbx-postgres nesse compose: o publish passaria a force-recreate
#      o banco de producao em todo deploy (downtime) e o volume mudaria de nome.
#   2. Os valores sao gravados via ALTER SYSTEM, ou seja em
#      /var/lib/postgresql/data/postgresql.auto.conf, que mora no volume
#      hbx_postgres_data. Sobrevive a restart, a `docker rm` + recriacao do
#      container e ao publish. So se perde se o VOLUME for destruido (initdb novo).
#   3. Este arquivo + pg-tune-vps.js sao o reparo pra esse caso: rodar
#      `npm run db:tune:apply` reconstroi tudo.
#
# MAQUINA (medido 05/08/2026): 4 cores, 15,6 GiB RAM, /dev/sda1 SSD (ROTA=0).
# A MAQUINA NAO E DEDICADA AO POSTGRES. Dividem a RAM:
#   llama-server 3,5 GB (--no-mmap, RSS real) · osrm-routed 0,9 GB ·
#   hbx-backend 0,6 GB · dockerd+containerd 0,4 GB · ate 20 hbx-engine-N
#   (~150 MB cada quando o governor escala) · frontend/webscraping ~0,2 GB.
#   Swap de 4 GB estava 100% CHEIO — ja houve pressao de memoria aqui.
# Por isso todo numero abaixo e o CONSERVADOR, nao o do "livro". OOM em producao
# e MUITO pior que lentidao.
#
# Formato: <parametro> = <valor>   (# comentario)
# Linhas com "!restart" no comentario exigem restart do postmaster.
# ============================================================================

# --- MEMORIA COMPARTILHADA ---------------------------------------------------
# 128MB (default de fabrica) num banco de 66 GB. 2 GB = 12,5% da RAM, nao os 25%
# do livro (4 GB): o llama-server sozinho leva 3,5 GB e o swap ja estourou uma vez.
# Por que 2 GB e o degrau que importa: o indice CnpjPublicCompany_cnpj_key tem
# 1713 MB e 55.949.849 scans — e o acesso dominante do sistema inteiro. Com 2 GB
# ele passa a viver residente em vez de ser relido do disco. Cache hit ratio
# global medido antes: 81,80% (5,24 bilhoes de blocos lidos do disco).
# Proximo degrau (3-4 GB) so quando o llama-server sair da maquina ou a RAM subir.
shared_buffers = 2GB                       # !restart

# --- DICA PRO PLANNER (nao aloca 1 byte) -------------------------------------
# buff/cache medido: 9,0 GB. Com 2 GB de shared_buffers, 8 GB e a expectativa
# HONESTA de quanto do dado o PG encontra em memoria. Em 4 GB o planner subestima
# o cache e escolhe seq scan em tabela de 41 GB onde devia usar indice.
# Nao subimos pra 12 GB: seria mentir, e mentira pro planner vira nested-loop
# gigante em cima de estimativa errada.
effective_cache_size = 8GB

# --- MEMORIA POR OPERACAO ----------------------------------------------------
# O NUMERO QUE JUSTIFICA: pg_stat_database mostrava 50.924 arquivos temporarios
# e 341 GB derramados em disco no hbx_prod desde 13/06 (~7 GB/dia de spill).
# Isso e work_mem=4MB estourando em sort/hash.
# Teto de risco REAL nao e max_connections=100: o backend usa Prisma com
# connection_limit=10 na DATABASE_URL, o webwhats abre ~5, o cnefe 1 →
# pico observado 22 conexoes. Pior caso realista: 20 conns x 2 nos x 64 MB
# (hash_mem_multiplier=2 no PG15) ~= 2,5 GB, absorvivel pelos 8,7 GB
# reclamaveis. 64MB dobraria isso — nao vale.
#
# 🔴 EFEITO COLATERAL QUE ESTE VALOR CAUSOU (medido e corrigido em 05/08/2026):
# subir work_mem de 4MB pra 32MB multiplicou por 8 o teto de memoria compartilhada
# DINAMICA que uma query PARALELA pede em /dev/shm:
#   antes:   4MB x hash_mem_multiplier(2) x 3 participantes =  24 MB → cabia nos 64 MB
#   depois:  32MB x 2 x 3                                   = 192 MB → NAO cabe
# O /dev/shm do container tinha 64 MB (default do DOCKER, nao do Postgres) e query
# paralela passou a morrer com
#   "could not resize shared memory segment ... No space left on device".
# Isso NAO e lentidao, e ERRO em query de producao. Corrigido: shm_size 1g em
# docker-compose.postgres.yml + remount ao vivo (sem downtime). O fiscal
# `npm run db:tune` reprova se /dev/shm cair abaixo de 1 GB.
# LEI: subir work_mem sem olhar /dev/shm troca lentidao por ERRO.
work_mem = 32MB

# Usado SO por VACUUM/CREATE INDEX/REINDEX manual. 1 GB e o teto util do array de
# dead tuples do VACUUM no PG15 e acelera muito rebuild de indice de 14 GB.
maintenance_work_mem = 1GB

# DESACOPLA o autovacuum do maintenance_work_mem. Sem isto, os 3 autovacuum
# workers herdariam 1 GB CADA = 3 GB de exposicao a OOM. 3 x 256MB = 768 MB.
# Quem precisar de mais pra um rebuild pontual usa
#   SET maintenance_work_mem = '3GB';
# na propria sessao — risco fica na sessao, nao global.
autovacuum_work_mem = 256MB

# --- CUSTO DE I/O: E SSD, NAO DISCO MECANICO --------------------------------
# random_page_cost=4.0 e o default pensado em HD com braco mecanico (~40x a
# leitura sequencial). Aqui `lsblk` da ROTA=0 (SSD). Junto do effective_cache_size,
# este e o par que de fato muda plano de query.
random_page_cost = 1.1

# Liga prefetch no Bitmap Heap Scan — exatamente o no que a busca textual
# (GIN trgm de 14 GB sobre heap de 41 GB) usa. Em SSD, 200 e o valor de praxe.
effective_io_concurrency = 200

# --- PARALELISMO EM 4 CORES --------------------------------------------------
# Pool GLOBAL de workers paralelos. Default 8 em 4 cores oversubscreve e briga
# com llama-server/engines. 4 = nucleos reais.
max_parallel_workers = 4
# 2 workers + o leader = 3 dos 4 cores numa query. Mantido no default de proposito.
max_parallel_workers_per_gather = 2
# Mantido: ajuda CREATE INDEX/REINDEX na tabela de 41 GB.
max_parallel_maintenance_workers = 2

# --- WAL / CHECKPOINT --------------------------------------------------------
# 61 milhoes de UPDATEs em lote na carga da RFB estouram 1 GB de WAL varias vezes
# por carga → checkpoint FORCADO (storm) em vez do ciclo de 5 min.
# 4 GB caberia folgado nos 64 GB livres de disco.
max_wal_size = 4GB
# Evita o PG encolher e recriar segmentos de WAL a cada ciclo.
min_wal_size = 1GB

# --- OBSERVABILIDADE ---------------------------------------------------------
# Sem isto, EXPLAIN (BUFFERS) e pg_stat_statements nao tem tempo de I/O — e o que
# torna medicao possivel. Custo ~zero (clock_gettime via vDSO no Linux).
track_io_timing = on

# pg_stat_statements: unica forma de descobrir QUAL query produziu os 341 GB de
# spill (ele rastreia temp_blks_written por query) e de ranquear por tempo total.
# Custo: ~25 MB de shared memory + 1-2% de CPU na normalizacao da query.
# Entrou NO MESMO restart do shared_buffers pra nao gastar dois downtimes.
shared_preload_libraries = 'pg_stat_statements'   # !restart
pg_stat_statements.max = 5000
pg_stat_statements.track = top
# BEGIN/COMMIT/SET do Prisma inundariam o ranking sem dizer nada.
pg_stat_statements.track_utility = off
pg_stat_statements.save = on

# --- AUTOVACUUM GLOBAL -------------------------------------------------------
# -1 herda vacuum_cost_limit=200. Com autovacuum_vacuum_cost_delay=2ms isso da
# uma limpeza que se arrasta por horas em tabela grande — foi por isso que o
# ultimo autovacuum da CnpjPublicCompany foi em 14/07 e nunca terminou o servico.
# 1000 = 5x mais rapido. Em SSD com CPU ociosa (todos os containers <1%) isso e
# folga, nao risco.
autovacuum_vacuum_cost_limit = 1000

# ============================================================================
# O QUE FOI DELIBERADAMENTE **NAO** MEXIDO (e por que)
# ============================================================================
# max_connections = 100      Prisma tem pool proprio (connection_limit=10). Mexer
#                            aqui sem necessidade so muda o pior caso de work_mem
#                            pra pior. Pico real medido: 22 conexoes.
# synchronous_commit = on    Tem DINHEIRO neste banco (modulo fiscal/pagamentos).
#                            Nao se troca durabilidade por velocidade aqui. Nunca.
# jit = on                   Cargo cult diz "desliga o JIT". Medido aqui: as
#                            queries quentes (lookup por cnpj, count trgm) tem
#                            custo estimado 8 e 2996 — MUITO abaixo do
#                            jit_above_cost=100000. O JIT nem dispara nelas. Quem
#                            dispara e a query analitica de minutos, onde os ~50ms
#                            de compilacao LLVM sao lucro. Desligar aqui seria
#                            decoracao, nao ganho.
# max_worker_processes = 8   Mudar exige restart e nao rende nada: o gargalo e o
#                            pool de max_parallel_workers, que ja foi ajustado.
# wal_buffers = -1 (auto)    Auto = 1/32 do shared_buffers com teto de 16 MB. Com
#                            shared_buffers=2GB ele SOBE de 4 MB pra 16 MB de
#                            graca. Fixar seria pior.
# default_statistics_target  Global fica 100. Subir global dobra o custo de ANALYZE
#                            em TODAS as tabelas. Se as estimativas da
#                            CnpjPublicCompany continuarem ruins, o certo e
#                            ALTER TABLE ... ALTER COLUMN ... SET STATISTICS na
#                            coluna especifica — cirurgico, nao global.
# log_min_duration_statement Nao ligado. pg_stat_statements da visibilidade melhor
#                            (agrega por query normalizada, com temp_blks_written e
#                            tempo total) sem gerar 1 byte de log. Alem disso o
#                            /etc/docker/daemon.json NAO EXISTE — a rotacao do
#                            json-file esta implicita/nao declarada (ha .log.1/.2.gz
#                            no diretorio do container, mas nada garantindo teto).
#                            Ligar log de query lenta com rotacao nao declarada e
#                            arriscar encher disco em silencio.
# dynamic_shared_memory_type Fica em `posix` (usa /dev/shm). A alternativa `sysv`
#                            escaparia do teto do /dev/shm do Docker sem recriar o
#                            container, MAS exige restart do postmaster e troca um
#                            problema conhecido e resolvido (shm_size=1g) por um
#                            caminho menos usado. Nao vale o downtime extra.
# ============================================================================
