server {
    listen 80;
    listen [::]:80;
    server_name hbxsystem.com.br www.hbxsystem.com.br api.hbxsystem.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hbxsystem.com.br www.hbxsystem.com.br;

    ssl_certificate /etc/letsencrypt/live/hbxsystem.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hbxsystem.com.br/privkey.pem;

    client_max_body_size 80m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.hbxsystem.com.br;

    ssl_certificate /etc/letsencrypt/live/api.hbxsystem.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hbxsystem.com.br/privkey.pem;

    client_max_body_size 80m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
