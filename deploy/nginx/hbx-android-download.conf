# Espelho do que roda na VPS em /etc/nginx/snippets/hbx-android-download.conf
# (incluído pelo server block de www.hbxsystem.com.br). Vivia SÓ no servidor —
# trazido pro git em 22/07 junto com o fix de CORS abaixo, pra não se perder de
# novo num rebuild de máquina.
#
# O APK é gravado em /var/www/hbx-downloads/ pelo scripts/ops/deploy-vps.js,
# junto do version-logistica.json (o manifesto que o auto-update lê).

location = /download/android {
    alias /var/www/hbx-downloads/hbx-mobile.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="Salehbx.apk"' always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /download/android-logistica {
    alias /var/www/hbx-downloads/hbx-logistica.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="Loghbx.apk"' always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# 22/07 — o auto-update do APK Logistica le este JSON por fetch() de DENTRO da
# WebView, cuja origem e https://appassets.androidplatform.net (WebViewAssetLoader).
# E cross-origin: sem Access-Control-Allow-Origin o fetch e rejeitado, cai no
# catch do checkAppUpdate() e o chip "Atualizar" NUNCA acende. Origem fixa (nao
# usar *): so a pagina local do proprio APK precisa ler isto.
location = /downloads/version-logistica.json {
    alias /var/www/hbx-downloads/version-logistica.json;
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "https://appassets.androidplatform.net" always;
}

# 19/08 — O IRMAO DO VENDAS. Mesmas cinco linhas, e cada uma pelo mesmo motivo
# do bloco acima: e o mesmo WebViewAssetLoader lendo de dentro do mesmo APK.
#
# 🔴 SAO DOIS MANIFESTOS PORQUE SAO DOIS PACOTES. O applicationId do Vendas e
# `br.com.hbxsystem` e o do Logistica e `br.com.hbxsystem.logistica`: um app que
# leia o manifesto do outro compara a propria versao com a de um pacote que nem
# e ele — anuncia atualizacao pra sempre e, com instalador nativo, poe O OUTRO
# APP ao lado em vez de atualizar o proprio. Endereco de update e identidade.
#
# 🔴 `location =` E EXATO, e e de proposito: nunca abrir /downloads/ como pasta
# estatica. A pasta guarda os dois .apk e os dois manifestos, e uma diretiva
# `autoindex`/prefixo entregaria o diretorio inteiro para quem passasse por ali.
# Rota nova = mais um bloco nomeado aqui, escrito a mao — nao um curinga.
#
# Sem este bloco o fetch responde 404: a checagem automatica fica calada (o
# certo, nao ha novidade a anunciar) e o toque manual nos Ajustes responde "este
# aplicativo ainda nao recebe aviso automatico" — a ponte do Vendas ja trata o
# 404 como o que ele e, em vez de mentir "confira a internet".
location = /downloads/version-vendas.json {
    alias /var/www/hbx-downloads/version-vendas.json;
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "https://appassets.androidplatform.net" always;
}
