# ============================================================================
# A ALAVANCA DE VERSÃO DO HBX VENDAS — mora AQUI, e não no build.gradle.kts
# ============================================================================
# 🔴 POR QUE ESTE ARQUIVO EXISTE (19/08): ver o cabeçalho do irmão
# `versao-logistica.properties`. Em uma linha: o piso morava no
# `app/build.gradle.kts`, que está na digital dos DOIS APKs, então subir o piso
# DESTE app fazia a frota de MOTORISTAS baixar um APK idêntico ao que já tinha.
# Alavanca por app, digital por app.
#
# QUEM LÊ ISTO: o `app/build.gradle.kts` (carimba o binário) e o
# `readFlavorVersion()` do scripts/ops/deploy-vps.js (monta o version-vendas.json).
#
# ⚠️ COMENTÁRIO AQUI É COMENTÁRIO: as duas pontas ignoram tudo que começa com
# `#` antes de procurar o número — a regex do publish já casou dentro de uma
# frase deste bloco uma vez (leia o parágrafo do "POR QUE 20" abaixo).
#
# ---------------------------------------------------------------------------
# O TRIO DO HBX VENDAS (19/08) — o app que nunca soube se atualizar
# ---------------------------------------------------------------------------
# Até hoje o flavor `vendas` não declarava versionCode nenhum: HERDAVA o 9 do
# `defaultConfig`. Quer dizer que TODO Salehbx.apk publicado desde 15/07 saiu
# carimbado com o mesmo 9 — e isto não é dedução, é medida do que está no ar
# agora (`curl https://www.hbxsystem.com.br/download/android` + `aapt dump
# badging`): `package: name='br.com.hbxsystem' versionCode='9'
# versionName='2.0.1'`. Quem instalou o app está congelado nele para sempre:
# o Android decide atualização pelo NÚMERO, e 9 → 9 não é versão nova, é o
# mesmo pacote. O publish subia um binário diferente a cada leva e nenhum
# aparelho jamais soube.
#
# 🔴 O PISO TEM QUE NASCER ACIMA DO QUE JÁ FOI DISTRIBUÍDO, e aqui isso é
# literal e perigoso: o `applicationId` deste flavor é `br.com.hbxsystem` — o
# do app ANTIGO, que já está instalado em campo desde julho. Piso ABAIXO de 9 e
# o aparelho RECUSA o pacote com INSTALL_FAILED_VERSION_DOWNGRADE; piso IGUAL a
# 9 e ele instala mas ninguém vê atualização nenhuma (o caso 8→15 e 95→110 do
# logística, ali em cima, repetido de graça num app novo).
#
# POR QUE 20, e não 10: 9 é o maior número que este `applicationId` já viu — e
# é o maior que ele PODERIA ter visto, porque até esta linha existir não havia
# propriedade nenhuma capaz de carimbar outro valor (nem build local, nem
# sideload de bancada: o `defaultConfig` era a única fonte). 20 deixa 11 de
# folga sobre o teto medido e mantém a série do Vendas visivelmente separada da
# do Logística (que já passou de 350) — dois números parecidos na mesma tela de
# log é como se troca um app pelo outro na hora do aperto.

versionCode=20

# O valor é o MESMO que está no APK publicado hoje (2.0.1, medido com `aapt dump
# badging` no que /download/android serve). Trocar nome de versão é decisão de
# produto, e ninguém pediu — o que estava congelado era o versionCode, não o nome.
versionName=2.0.1
