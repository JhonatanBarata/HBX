# ============================================================================
# HBX LOGISTICA -- A SERIE DA GOOGLE PLAY COMECA AQUI, EM 1
# ============================================================================
# 🔴 ZERAMOS A CONTAGEM EM 20/08/2026, por ordem do dono. O app deixou de ser
# distribuido por APK no site e passou a existir SO na Google Play -- e uma
# serie nova, num canal novo, comeca do comeco.
#
# ⚠️ O QUE ISSO CUSTA, e ja foi aceito conscientemente: o celular do Andre tem o
# 352 instalado, e o Android NAO atualiza para um versionCode MENOR. Ele precisa
# DESINSTALAR e instalar pela Play. Desinstalar apaga o pareamento
# (DeviceCredentialStore) e o banco local (hbx_operational.db) -- entao, ANTES,
# confirmar por telefone que nao ha entrega pendente sem sincronizar. Entrega
# nao sincronizada que some no desinstalar nao volta.
#
# 🔴 A PLAY QUEIMA O NUMERO PARA SEMPRE. Uma vez enviado a QUALQUER faixa
# (interna, fechada, producao), aquele versionCode nunca mais pode ser reusado --
# nem se a release for descartada sem publicar. Subir a cada upload, sem excecao,
# e anotar o que foi enviado em cada numero.
#
# A historia dos numeros 8..352 (a era do APK no site) esta no git; foi tirada
# daqui de proposito, porque descrevia um canal que nao existe mais e so
# confundiria quem ler este arquivo daqui pra frente.
# 🔴 21/08/2026 — O PISO SUBIU PARA 2, E ISTO NAO E BUROCRACIA.
# O `versionCode 1` JA FOI ENVIADO a Play (teste interno) e esta QUEIMADO PARA
# SEMPRE. O piso daqui e o que o Gradle usa quando ninguem passa
# `-PhbxLogisticaVersionCode` -- ou seja, TODO build local, inclusive o
# `bundleLogisticaRelease` que gera o .aab da loja. Com o piso em 1, um build
# feito na mao saia com o numero queimado e a Play recusava o upload sem dizer
# por que. O publish do site continua mandando o numero dele (353 em 21/08), que
# e maior e vence o piso -- os dois canais nao brigam.
# 🔴 21/08 (2a correcao): o 2 TAMBEM estava queimado — a Play recusou. Numero
# baixo e territorio minado: ninguem sabe de cabeca o que ja subiu ao Console, e
# cada tentativa errada QUEIMA MAIS UM. Entao o piso pula para a faixa do site
# (353 foi o publicado em 21/08), que a Play nunca viu. Nao ha custo: o espaco
# de versionCode vai ate 2.100.000.000.
#
# ⚠️ TODO .aab NOVO EXIGE SUBIR ESTE NUMERO. Nao existe jeito de reusar, nem
# descartando a release. Antes de gerar bundle, suba aqui e confira no Console
# em "Versao > Explorador de pacotes de apps" qual foi o ultimo enviado.
versionCode=353

# NOME VISIVEL NA FICHA DA LOJA. 🔴 Nunca alpha/beta aqui: este texto e lido pelo
# cliente E pela Google, bem no momento em que ela avalia "production readiness"
# no pedido de acesso a producao. Um app B2B anunciando "alpha1" responde essa
# pergunta sozinho, e responde errado.
versionName=1.0.0
