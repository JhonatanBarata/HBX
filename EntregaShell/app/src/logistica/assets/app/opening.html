<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050713">
  <title>HBX Mobile</title>
  <style>
    :root { --blue:#2e5bff; --cyan:#00e5ff; --lime:#9aea35; --ink:#f7fbff; --spring:cubic-bezier(.22,1,.36,1); }
    * { box-sizing:border-box; } html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#050713; }
    body { color:var(--ink); font-family:Inter,"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; }
    .stage { position:relative; width:100vw; height:100dvh; min-height:620px; overflow:hidden; isolation:isolate; background:radial-gradient(circle at 50% 39%,rgba(46,91,255,.19),transparent 28%),radial-gradient(circle at 82% 13%,rgba(0,229,255,.1),transparent 24%),radial-gradient(circle at 14% 78%,rgba(138,92,255,.12),transparent 26%),linear-gradient(180deg,#080d1f,#050713 62%,#03050d); }
    .stage:before { content:""; position:absolute; inset:-20%; z-index:-1; opacity:.23; background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px); background-size:30px 30px; transform:perspective(560px) rotateX(62deg) translateY(15%); transform-origin:50% 100%; -webkit-mask-image:linear-gradient(to top,#000,transparent 72%); }
    .top { position:absolute; z-index:4; top:max(18px,env(safe-area-inset-top)); left:18px; right:18px; display:flex; justify-content:space-between; align-items:center; opacity:0; transform:translateY(-8px); animation:in .7s .15s var(--spring) forwards; color:#c7d4ed; font-size:9px; font-weight:800; letter-spacing:.16em; }
    .top b { display:inline-flex; align-items:center; gap:8px; } .top b:before { content:""; width:7px; height:7px; border-radius:50%; background:var(--lime); box-shadow:0 0 0 5px rgba(154,234,53,.08),0 0 16px rgba(154,234,53,.8); }
    .top span { color:#71809d; }
    .network { position:absolute; inset:0; width:100%; height:100%; z-index:1; }
    .ghost { fill:none; stroke:rgba(94,122,176,.12); stroke-width:1; } .live { fill:none; stroke:url(#flow); stroke-width:2.2; stroke-linecap:round; path-length:1; stroke-dasharray:1; stroke-dashoffset:1; filter:url(#glow); animation:draw 1.1s var(--spring) forwards,pulse 2s 1.7s ease-in-out infinite; }
    .p1{animation-delay:.7s,1.9s}.p2{animation-delay:.88s,2.1s}.p3{animation-delay:1.05s,2.25s}.p4{animation-delay:1.2s,2.4s}@keyframes draw{to{stroke-dashoffset:0}}@keyframes pulse{50%{opacity:.54;stroke-width:2.8}}
    .node { fill:#071020; stroke:var(--cyan); stroke-width:1.2; filter:url(#glow); opacity:0; transform-box:fill-box; transform-origin:center; animation:pop .55s 1.5s var(--spring) forwards; }.n2{animation-delay:1.65s}.n3{animation-delay:1.8s}.n4{animation-delay:1.95s}@keyframes pop{to{opacity:1;transform:scale(1)}}
    .hub { position:absolute; z-index:3; top:31.6%; left:50%; width:122px; height:122px; transform:translate(-50%,-50%) scale(.65); display:grid; place-items:center; border-radius:50%; opacity:0; background:radial-gradient(circle,rgba(0,229,255,.25),rgba(7,11,25,.92) 48%,rgba(7,11,25,.78) 70%); border:1px solid rgba(0,229,255,.2); box-shadow:inset 0 0 0 9px rgba(4,8,20,.65),0 0 0 1px rgba(255,255,255,.05),0 0 48px rgba(0,229,255,.38),0 22px 70px rgba(0,0,0,.48); animation:hub .95s .2s var(--spring) forwards,hubPulse 1.7s 1.4s ease-in-out infinite; }
    .hub:before,.hub:after { content:""; position:absolute; inset:-10px; border:1px solid rgba(0,229,255,.22); border-radius:50%; animation:ripple 2.4s 1.2s ease-out infinite; }.hub:after{animation-delay:1.85s}@keyframes hub{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes hubPulse{50%{filter:brightness(1.14)}}@keyframes ripple{0%{opacity:0;transform:scale(.58)}20%{opacity:.72}100%{opacity:0;transform:scale(1.55)}}
    .hub strong { font-size:28px; letter-spacing:-.08em; text-shadow:0 0 16px rgba(0,229,255,.7); }.hub i{position:absolute;inset:10px;border:3px solid transparent;border-top-color:var(--cyan);border-right-color:var(--blue);border-radius:50%;animation:spin 4.8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .vehicle { position:absolute; z-index:3; display:grid; place-items:center; width:65px; height:65px; border:1px solid rgba(124,217,255,.25); border-radius:21px; background:linear-gradient(145deg,rgba(16,25,51,.94),rgba(7,11,25,.87)); box-shadow:0 14px 32px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.08),0 0 24px rgba(46,91,255,.13); color:#eef8ff; opacity:0; transform:scale(.56) translateY(10px); animation:vehicle .72s var(--spring) forwards,float 3.4s 2.1s ease-in-out infinite; }.vehicle:after{position:absolute;top:73px;white-space:nowrap;color:#aabbd8;font-size:8px;font-weight:850;letter-spacing:.15em}.vehicle svg{width:35px;height:35px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.truck{top:15.7%;right:9.5%;animation-delay:1.22s,2.1s}.truck:after{content:"CAMINHÃO"}.car{top:22.7%;left:7.7%;animation-delay:1.42s,2.3s}.car:after{content:"CARRO"}.moto{top:48.5%;right:7.8%;animation-delay:1.62s,2.5s}.moto:after{content:"MOTO"}.box{top:50.2%;left:8.8%;animation-delay:1.82s,2.7s}.box:after{content:"ENTREGAS"}@keyframes vehicle{to{opacity:1;transform:scale(1) translateY(0)}}@keyframes float{50%{transform:translateY(-6px) rotate(.8deg)}}
    .copy { position:absolute; z-index:3; top:62.2%; left:24px; right:24px; text-align:center; }.eyebrow,.copy h1,.copy p,.systems { opacity:0; transform:translateY(10px); animation:in .65s var(--spring) forwards; }.eyebrow{color:var(--lime);font-size:9px;font-weight:900;letter-spacing:.25em;animation-delay:1.72s}.copy h1{margin:11px 0 0;font-size:clamp(38px,11vw,50px);line-height:.94;letter-spacing:-.065em;animation-delay:1.88s}.copy h1 b{background:linear-gradient(90deg,#fff 12%,#d5edff 45%,#a9baff);-webkit-background-clip:text;background-clip:text;color:transparent}.copy h1 span{display:block;margin-top:9px;font-size:12px;letter-spacing:.43em;text-indent:.43em;color:#c8d5ed}.copy p{max-width:310px;margin:20px auto 0;color:#9caecc;font-size:12px;line-height:1.55;animation-delay:2.12s}@keyframes in{to{opacity:1;transform:none}}
    .systems { position:absolute; z-index:3; left:24px; right:24px; bottom:max(27px,calc(env(safe-area-inset-bottom) + 18px)); animation-delay:2.42s; }.systems div:first-child{display:flex;justify-content:space-between;margin-bottom:10px;color:#90a2c0;font-size:8px;font-weight:850;letter-spacing:.14em}.rail{height:3px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06)}.rail i{display:block;height:100%;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,var(--blue),var(--cyan) 62%,var(--lime));box-shadow:0 0 14px rgba(0,229,255,.55);animation:load 1.4s 2.55s var(--spring) forwards}@keyframes load{to{transform:scaleX(1)}}.modules{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:13px}.modules span{height:29px;display:grid;place-items:center;border:1px solid rgba(0,229,255,.22);border-radius:10px;background:rgba(0,229,255,.055);color:#dff8ff;font-size:7px;font-weight:850;letter-spacing:.09em}
    .stage.leaving { animation:out .58s .05s var(--spring) both; }@keyframes out{to{opacity:0;transform:scale(1.035);filter:blur(4px)}}
    @media (max-height:700px){.hub{top:29.5%;transform:translate(-50%,-50%) scale(.88)}.copy{top:58%}.copy p{margin-top:14px}.systems{bottom:18px}.modules{margin-top:9px}}
    @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <main class="stage" id="opening" aria-label="Abertura HBX Mobile">
    <header class="top"><b>HBX SYSTEM</b><span>MOBILE / LIVE</span></header>
    <svg class="network" viewBox="0 0 390 844" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="flow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2e5bff"/><stop offset=".55" stop-color="#00e5ff"/><stop offset="1" stop-color="#9aea35"/></linearGradient><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path class="ghost" d="M195 267 C230 238 259 197 310 159"/><path class="ghost" d="M195 267 C162 246 135 225 76 220"/><path class="ghost" d="M195 267 C239 310 261 365 315 441"/><path class="ghost" d="M195 267 C154 315 123 366 77 453"/><path class="live p1" d="M195 267 C230 238 259 197 310 159"/><path class="live p2" d="M195 267 C162 246 135 225 76 220"/><path class="live p3" d="M195 267 C239 310 261 365 315 441"/><path class="live p4" d="M195 267 C154 315 123 366 77 453"/><circle class="node" cx="310" cy="159" r="4"/><circle class="node n2" cx="76" cy="220" r="4"/><circle class="node n3" cx="315" cy="441" r="4"/><circle class="node n4" cx="77" cy="453" r="4"/></svg>
    <div class="vehicle truck"><svg viewBox="0 0 40 40"><path d="M5.5 12.5h18.2v14H5.5zM23.7 17h5.7l4.6 5.2v4.3H23.7z"/><circle cx="12" cy="28" r="3.2"/><circle cx="29" cy="28" r="3.2"/></svg></div>
    <div class="vehicle car"><svg viewBox="0 0 40 40"><path d="M6 23.5l3-7c.5-1.3 1.4-2 2.8-2h16c1.2 0 2.1.6 2.7 1.8l3.5 7v4.3H6z"/><circle cx="12" cy="28" r="3"/><circle cx="29" cy="28" r="3"/></svg></div>
    <div class="vehicle moto"><svg viewBox="0 0 40 40"><circle cx="10" cy="28.5" r="5"/><circle cx="30" cy="28.5" r="5"/><path d="M10 28.5l6.5-10h6.2l4.4 10M16.5 18.5l5 10M14 22h11.4M22.7 18.5l2.1-3.2h4.7"/></svg></div>
    <div class="vehicle box"><svg viewBox="0 0 40 40"><path d="M7.5 13.5L20 7l12.5 6.5v14L20 34 7.5 27.5zM7.5 13.5L20 20l12.5-6.5M20 20v14"/></svg></div>
    <div class="hub"><i></i><strong>HBX</strong></div>
    <section class="copy"><div class="eyebrow">Rede operacional ativa</div><h1><b>HBX</b><span>MOBILE</span></h1><p>Vendas, rotas, entregas e clientes na mesma operação.</p></section>
    <section class="systems"><div><span>Sincronizando módulos</span><span>100%</span></div><div class="rail"><i></i></div><div class="modules"><span>ROTAS</span><span>FROTA</span><span>CLIENTES</span><span>ENTREGAS</span></div></section>
  </main>
  <script>
    const opening = document.getElementById('opening');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const duration = reduced ? 120 : 4700;
    setTimeout(() => { opening.classList.add('leaving'); setTimeout(() => location.replace('index.html'), reduced ? 10 : 560); }, duration);
  </script>
</body>
</html>
