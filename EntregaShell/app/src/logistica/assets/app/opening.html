<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050713">
  <title>HBX Mobile — Abertura</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#050713;
      --bg2:#080d1f;
      --ink:#f7fbff;
      --muted:#91a0bd;
      --blue:#2e5bff;
      --cyan:#00e5ff;
      --violet:#8a5cff;
      --lime:#9aea35;
      --spring:cubic-bezier(.22,1,.36,1);
    }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#02040b; }
    body { color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    button { font:inherit; }
    .stage {
      position:relative;
      width:100vw;
      height:100dvh;
      min-height:560px;
      overflow:hidden;
      isolation:isolate;
      background:
        radial-gradient(circle at 50% 39%,rgba(46,91,255,.19),transparent 29%),
        radial-gradient(circle at 82% 13%,rgba(0,229,255,.10),transparent 24%),
        radial-gradient(circle at 14% 78%,rgba(138,92,255,.12),transparent 26%),
        linear-gradient(180deg,var(--bg2),var(--bg) 62%,#03050d);
    }
    .stage::before {
      content:"";
      position:absolute;
      inset:-20%;
      z-index:-3;
      opacity:.22;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
      background-size:30px 30px;
      transform:perspective(560px) rotateX(62deg) translateY(15%);
      transform-origin:50% 100%;
      -webkit-mask-image:linear-gradient(to top,#000,transparent 72%);
      mask-image:linear-gradient(to top,#000,transparent 72%);
    }
    .aurora { position:absolute; border-radius:50%; filter:blur(72px); opacity:.2; pointer-events:none; }
    .aurora.a { width:260px;height:260px;left:-90px;top:20%;background:var(--violet); }
    .aurora.b { width:240px;height:240px;right:-100px;top:8%;background:var(--cyan); }
    .aurora.c { width:260px;height:260px;left:20%;bottom:-160px;background:var(--blue); }
    .topbar {
      position:absolute;
      z-index:8;
      top:max(18px,env(safe-area-inset-top));
      left:18px;
      right:18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      color:#c7d4ed;
      font-size:9px;
      font-weight:800;
      letter-spacing:.16em;
      opacity:0;
      transform:translateY(-8px);
      animation:topIn .58s .18s var(--spring) forwards,topOut .42s 4.72s ease forwards;
    }
    .brand-chip { display:flex;align-items:center;gap:8px; }
    .brand-chip i { width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 5px rgba(154,234,53,.08),0 0 16px rgba(154,234,53,.8); }
    .scene-code { color:#71809d; }
    @keyframes topIn { to { opacity:1;transform:none; } }
    @keyframes topOut { to { opacity:0;transform:translateY(-10px); } }

    .network { position:absolute;inset:0;width:100%;height:100%;z-index:2;animation:networkOut .46s 4.78s var(--spring) forwards; }
    .route-ghost { fill:none;stroke:rgba(94,122,176,.13);stroke-width:1; }
    .route-live {
      fill:none;
      stroke:url(#flowGradient);
      stroke-width:2.25;
      stroke-linecap:round;
      path-length:1;
      stroke-dasharray:1;
      stroke-dashoffset:1;
      filter:url(#lineGlow);
      animation:routeDraw .72s var(--spring) forwards,routeGlow 1.7s 2.1s ease-in-out infinite;
    }
    .r1 { animation-delay:1.18s,2.10s; }
    .r2 { animation-delay:1.72s,2.28s; }
    .r3 { animation-delay:2.26s,2.46s; }
    .r4 { animation-delay:2.80s,2.64s; }
    @keyframes routeDraw { to { stroke-dashoffset:0; } }
    @keyframes routeGlow { 50% { opacity:.58;stroke-width:2.85; } }
    @keyframes networkOut { to { opacity:0;transform:scale(1.12);filter:blur(4px); } }

    .hub-wrap {
      position:absolute;
      z-index:6;
      top:31.6%;
      left:50%;
      width:142px;
      height:142px;
      transform:translate(-50%,-50%);
      display:grid;
      place-items:center;
      animation:hubWrapOut .46s 4.78s var(--spring) forwards;
    }
    .hub-glow { position:absolute;inset:-32px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,.22),transparent 66%);filter:blur(8px); }
    .hub {
      position:relative;
      width:114px;
      height:114px;
      display:grid;
      place-items:center;
      border-radius:50%;
      opacity:0;
      transform:scale(.56) rotate(-10deg);
      background:radial-gradient(circle,rgba(0,229,255,.24),rgba(7,11,25,.95) 48%,rgba(7,11,25,.82) 70%);
      border:1px solid rgba(0,229,255,.24);
      box-shadow:inset 0 0 0 9px rgba(4,8,20,.66),0 0 0 1px rgba(255,255,255,.05),0 18px 70px rgba(0,0,0,.46);
      animation:hubBootPulse 1.34s .08s var(--spring) forwards;
    }
    .hub::before,.hub::after { content:"";position:absolute;inset:-11px;border:1px solid rgba(0,229,255,.24);border-radius:50%;animation:shockwave 1.15s .38s ease-out forwards; }
    .hub::after { animation-delay:.84s; }
    .hub-ring { position:absolute;inset:12px;border:3px solid transparent;border-top-color:var(--cyan);border-right-color:var(--blue);border-radius:50%;animation:spin 4.8s linear infinite; }
    .hub strong { font-size:28px;letter-spacing:-.08em;text-shadow:0 0 16px rgba(0,229,255,.7); }
    @keyframes hubBootPulse {
      0% { opacity:0;transform:scale(.56) rotate(-10deg); }
      27% { opacity:1;transform:scale(1) rotate(0); }
      47% { transform:scale(1.13);box-shadow:inset 0 0 0 9px rgba(4,8,20,.66),0 0 44px rgba(0,229,255,.34),0 18px 70px rgba(0,0,0,.42); }
      61% { transform:scale(.96); }
      78% { transform:scale(1.075);box-shadow:inset 0 0 0 9px rgba(4,8,20,.66),0 0 30px rgba(46,91,255,.28),0 18px 70px rgba(0,0,0,.42); }
      100% { opacity:1;transform:scale(1);box-shadow:inset 0 0 0 9px rgba(4,8,20,.66),0 0 22px rgba(0,229,255,.14),0 18px 70px rgba(0,0,0,.46); }
    }
    @keyframes shockwave { 0%{opacity:0;transform:scale(.6)} 22%{opacity:.76} 100%{opacity:0;transform:scale(1.58)} }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes hubWrapOut { to { opacity:0;transform:translate(-50%,-50%) scale(1.34);filter:blur(4px); } }

    .vehicle {
      position:absolute;
      z-index:5;
      width:65px;
      height:65px;
      display:grid;
      place-items:center;
      border:1px solid rgba(124,217,255,.25);
      border-radius:21px;
      background:linear-gradient(145deg,rgba(16,25,51,.95),rgba(7,11,25,.9));
      box-shadow:0 14px 32px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.08),0 0 24px rgba(46,91,255,.13);
      color:#eef8ff;
      opacity:0;
      transform:scale(.5) translateY(10px);
      animation:nodeOn .52s var(--spring) forwards,vehicleOut .42s 4.74s ease forwards;
    }
    .vehicle::after { position:absolute;top:73px;white-space:nowrap;color:#aabbd8;font-size:8px;font-weight:850;letter-spacing:.15em; }
    .vehicle svg { width:35px;height:35px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round; }
    .vehicle .accent { stroke:var(--cyan); }
    .vehicle .accent-lime { stroke:var(--lime); }
    .truck { top:15.7%;right:9.5%;animation-delay:1.70s,4.74s; }.truck::after{content:"CAMINHÃO"}
    .car { top:22.7%;left:7.7%;animation-delay:2.24s,4.74s; }.car::after{content:"CARRO"}
    .bike { top:48.5%;right:7.8%;animation-delay:2.78s,4.74s; }.bike::after{content:"MOTO"}
    .package { top:50.2%;left:8.8%;animation-delay:3.32s,4.74s; }.package::after{content:"ENTREGAS"}
    @keyframes nodeOn { 0%{opacity:0;transform:scale(.5) translateY(10px);filter:brightness(.6)} 70%{opacity:1;transform:scale(1.09);filter:brightness(1.35)} 100%{opacity:1;transform:scale(1);filter:brightness(1)} }
    @keyframes vehicleOut { to { opacity:0;transform:scale(1.12);filter:blur(3px); } }

    .copy {
      position:absolute;
      z-index:5;
      top:62.2%;
      left:24px;
      right:24px;
      text-align:center;
      animation:copyOut .42s 4.68s ease forwards;
    }
    .eyebrow,.copy h1,.copy p { opacity:0;transform:translateY(10px);animation:copyIn .65s var(--spring) forwards; }
    .eyebrow { color:var(--lime);font-size:9px;font-weight:900;letter-spacing:.25em;animation-delay:3.22s; }
    .copy h1 { margin:11px 0 0;font-size:clamp(38px,11vw,50px);line-height:.94;letter-spacing:-.065em;animation-delay:3.38s; }
    .copy h1 b { background:linear-gradient(90deg,#fff 12%,#d5edff 45%,#a9baff);-webkit-background-clip:text;background-clip:text;color:transparent; }
    .copy h1 span { display:block;margin-top:9px;font-size:12px;letter-spacing:.43em;text-indent:.43em;color:#c8d5ed; }
    .copy p { max-width:310px;margin:20px auto 0;color:#9caecc;font-size:12px;line-height:1.55;animation-delay:3.54s; }
    @keyframes copyIn { to { opacity:1;transform:none; } }
    @keyframes copyOut { to { opacity:0;transform:translateY(12px); } }

    .pairing {
      position:absolute;
      inset:0;
      z-index:18;
      display:grid;
      place-items:center;
      opacity:0;
      pointer-events:none;
      padding:28px 24px max(28px,env(safe-area-inset-bottom));
      background:radial-gradient(circle at 50% 34%,rgba(46,91,255,.13),transparent 31%),linear-gradient(180deg,#080d1e,#050713);
      animation:pairingIn .62s 5.04s var(--spring) forwards;
    }
    .pair-card {
      width:min(100%,336px);
      opacity:0;
      transform:translateY(14px) scale(.985);
      animation:pairCoreIn .52s 5.20s var(--spring) forwards;
    }
    .pair-card h2 { margin:0 0 24px;text-align:center;color:#f7fbff;font-size:clamp(27px,7.5vw,32px);line-height:1.08;letter-spacing:-.045em;font-weight:800; }
    .google-play-button {
      width:100%;
      height:52px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      border:1px solid #dadce0;
      border-radius:4px;
      padding:0 18px;
      background:#fff;
      color:#3c4043;
      font-family:Roboto,Arial,sans-serif;
      font-size:15px;
      font-weight:500;
      letter-spacing:.01em;
      box-shadow:0 1px 2px rgba(0,0,0,.18);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .google-play-button:active { background:#f1f3f4;box-shadow:0 1px 1px rgba(0,0,0,.16); }
    .google-play-button:focus-visible { outline:3px solid rgba(66,133,244,.34);outline-offset:3px; }
    .google-play-mark { width:22px;height:22px;flex:0 0 22px;display:block; }
    @keyframes pairingIn { from{opacity:0} to{opacity:1;pointer-events:auto} }
    @keyframes pairCoreIn { to{opacity:1;transform:none} }

    @media (max-height:700px) {
      .hub-wrap { top:29.5%;transform:translate(-50%,-50%) scale(.88); }
      .copy { top:58%; }
      .copy p { margin-top:14px; }
      .pair-card h2 { margin-bottom:20px; }
    }
    @media (max-width:340px) {
      .vehicle { width:58px;height:58px;border-radius:18px; }
      .vehicle::after { top:65px;font-size:7px; }
      .vehicle svg { width:31px;height:31px; }
      .copy { left:18px;right:18px; }
    }
    @media (prefers-reduced-motion:reduce) {
      .topbar,.network,.hub-wrap,.vehicle,.copy { display:none; }
      .pairing,.pair-card { opacity:1;transform:none;animation:none;pointer-events:auto; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Abertura HBX Mobile">
    <div class="aurora a"></div><div class="aurora b"></div><div class="aurora c"></div>
    <header class="topbar"><div class="brand-chip"><i></i>HBX SYSTEM</div><div class="scene-code">MOBILE / LIVE</div></header>

    <svg class="network" viewBox="0 0 390 844" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="flowGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e5bff"/><stop offset=".55" stop-color="#00e5ff"/><stop offset="1" stop-color="#9aea35"/></linearGradient>
        <filter id="lineGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <path class="route-ghost" d="M195 267 C230 238 259 197 310 159"/><path class="route-ghost" d="M195 267 C162 246 135 225 76 220"/><path class="route-ghost" d="M195 267 C239 310 261 365 315 441"/><path class="route-ghost" d="M195 267 C154 315 123 366 77 453"/>
      <path class="route-live r1" d="M195 267 C230 238 259 197 310 159"/><path class="route-live r2" d="M195 267 C162 246 135 225 76 220"/><path class="route-live r3" d="M195 267 C239 310 261 365 315 441"/><path class="route-live r4" d="M195 267 C154 315 123 366 77 453"/>
    </svg>

    <div class="vehicle truck"><svg viewBox="0 0 40 40"><path d="M5.5 12.5h18.2v14H5.5zM23.7 17h5.7l4.6 5.2v4.3H23.7z"/><path class="accent" d="M27 19h2.1l2.4 2.8H27z"/><circle cx="12" cy="28" r="3.2"/><circle cx="29" cy="28" r="3.2"/></svg></div>
    <div class="vehicle car"><svg viewBox="0 0 40 40"><path d="M6 23.5l2.7-6.8c.5-1.3 1.4-2 2.8-2h16.1c1.2 0 2.1.6 2.7 1.8l3.5 7v4.3H6z"/><path class="accent" d="M12 17.2h14.3l2.2 4.2H10.3z"/><circle cx="12" cy="28" r="3.1"/><circle cx="29" cy="28" r="3.1"/></svg></div>
    <div class="vehicle bike"><svg viewBox="0 0 40 40"><circle cx="10" cy="28.5" r="5"/><circle cx="30" cy="28.5" r="5"/><path d="M10 28.5l6.5-10h6.2l4.4 10M16.5 18.5l5 10M14 22h11.4M22.7 18.5l2.1-3.2h4.7"/><path class="accent-lime" d="M13.4 18.2h8.8l1.4 3.2H15z"/></svg></div>
    <div class="vehicle package"><svg viewBox="0 0 40 40"><path d="M7.5 13.5L20 7l12.5 6.5v14L20 34 7.5 27.5zM7.5 13.5L20 20l12.5-6.5M20 20v14"/><path class="accent" d="M13 10.7l12.5 6.5-4.2 2.2-12.4-6.5z"/></svg></div>

    <div class="hub-wrap"><div class="hub-glow"></div><div class="hub"><i class="hub-ring"></i><strong>HBX</strong></div></div>
    <section class="copy"><div class="eyebrow">REDE OPERACIONAL ATIVA</div><h1><b>HBX</b><span>MOBILE</span></h1><p>Vendas, rotas, entregas e clientes pulsando na mesma operação.</p></section>

    <section class="pairing" aria-label="Vincular aparelho">
      <div class="pair-card">
        <h2>Vincule este aparelho</h2>
        <button class="google-play-button" type="button" aria-label="Conectar com Google Play" onclick="location.href='index.html'">
          <svg class="google-play-mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="#00A0FF" d="M3.35 2.28c-.22.28-.35.68-.35 1.17v17.1c0 .49.13.89.35 1.17L13.2 12 3.35 2.28z"/><path fill="#FFCC00" d="M16.48 8.78 13.2 12l3.28 3.22 3.93-2.25c1.12-.64 1.12-1.69 0-2.33l-3.93-2.26z"/><path fill="#00D95F" d="M3.35 2.28 13.2 12l3.28-3.22L5.54 2.51c-.9-.52-1.72-.41-2.19-.23z"/><path fill="#FF3A44" d="M3.35 21.72c.47.18 1.29.29 2.19-.23l10.94-6.27L13.2 12l-9.85 9.72z"/></svg>
          <span>Conectar com Google Play</span>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
