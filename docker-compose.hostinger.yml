version: "3.8"

services:
  hbx-postgres:
    image: postgres:15-alpine
    container_name: hbx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-hbx_prod}
    volumes:
      - hbx-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - hbx_net

  backend:
    container_name: hbx-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - hbx-postgres
      - hbx-scraping-engine
      - webscraping
    environment:
      NODE_ENV: production
      APP_PORT: "3000"
      PUBLIC_API_BASE_URL: https://api.hbxsystem.com.br
      FRONTEND_URL: https://www.hbxsystem.com.br
      APP_URL: https://www.hbxsystem.com.br
      CORS_ALLOWED_ORIGINS: https://www.hbxsystem.com.br,https://hbxsystem.com.br
      HBX_SCRAPING_ENGINE_URL: http://hbx-scraping-engine:8001
      WEBSCRAPING_URL: /hbx/webscraping
      WEBSCRAPING_INTERNAL_URL: http://webscraping:8501
    ports:
      - "3000:3000"
    volumes:
      - ./backend/public/uploads:/app/public/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hbx_net

  webscraping:
    container_name: webscraping
    build:
      context: ./webscraping
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      MOCK_MODE: ${WEBSCRAPING_MOCK_MODE:-0}
    expose:
      - "8501"
    networks:
      - hbx_net

  hbx-scraping-engine:
    container_name: hbx-scraping-engine
    build:
      context: ./hbx-scraping-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HBX_SCRAPING_USER_AGENT: ${HBX_SCRAPING_USER_AGENT:-HBX-Scraping/0.1 contato@hbxsystem.com.br}
      HBX_SCRAPING_TIMEOUT_SECONDS: ${HBX_SCRAPING_TIMEOUT_SECONDS:-10}
      HBX_SCRAPING_CONCURRENCY: ${HBX_SCRAPING_CONCURRENCY:-5}
      HBX_SCRAPING_CACHE_TTL_HOURS: ${HBX_SCRAPING_CACHE_TTL_HOURS:-24}
      HBX_SCRAPING_MAX_DISCOVERY_RESULTS: ${HBX_SCRAPING_MAX_DISCOVERY_RESULTS:-600}
      HBX_AGENDA_MAX_PAGES: ${HBX_AGENDA_MAX_PAGES:-20}
      HBX_AGENDA_REQUEST_DELAY_MS: ${HBX_AGENDA_REQUEST_DELAY_MS:-500}
    expose:
      - "8001"
    volumes:
      - ./hbx-scraping-engine/data:/app/data
    networks:
      - hbx_net

  frontend:
    container_name: hbx-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.hbxsystem.com.br}
        NEXT_PUBLIC_MERCADO_PAGO_PUBLIC_KEY: ${NEXT_PUBLIC_MERCADO_PAGO_PUBLIC_KEY:-}
        NEXT_PUBLIC_PAYMENTS_PROVIDER: ${NEXT_PUBLIC_PAYMENTS_PROVIDER:-mercadopago}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.hbxsystem.com.br}
      NEXT_PUBLIC_MERCADO_PAGO_PUBLIC_KEY: ${NEXT_PUBLIC_MERCADO_PAGO_PUBLIC_KEY:-}
      NEXT_PUBLIC_PAYMENTS_PROVIDER: ${NEXT_PUBLIC_PAYMENTS_PROVIDER:-mercadopago}
    ports:
      - "3001:3001"
    networks:
      - hbx_net

volumes:
  hbx-postgres-data:
    name: ${POSTGRES_DATA_VOLUME:-hbx-postgres-data}

networks:
  hbx_net:
    external: true
    name: ${HBX_DOCKER_NETWORK:-hbx_net}
