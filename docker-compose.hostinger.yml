x-hbx-engine-common: &hbx-engine-common
  build:
    context: ./hbx-scraping-engine
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    HBX_SCRAPING_USER_AGENT: ${HBX_SCRAPING_USER_AGENT:-HBX-Scraping/0.1 contato@hbxsystem.com.br}
    HBX_SCRAPING_TIMEOUT_SECONDS: ${HBX_SCRAPING_TIMEOUT_SECONDS:-20}
    HBX_SCRAPING_CONCURRENCY: ${HBX_SCRAPING_CONCURRENCY:-3}
    HBX_SCRAPING_CACHE_TTL_HOURS: ${HBX_SCRAPING_CACHE_TTL_HOURS:-24}
    HBX_SCRAPING_MAX_DISCOVERY_RESULTS: ${HBX_SCRAPING_MAX_DISCOVERY_RESULTS:-120}
    HBX_AGENDA_MAX_PAGES: ${HBX_AGENDA_MAX_PAGES:-20}
    HBX_AGENDA_REQUEST_DELAY_MS: ${HBX_AGENDA_REQUEST_DELAY_MS:-700}
  networks:
    - hbx_net
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()\""]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  backend:
    container_name: hbx-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - hbx-scraping-engine
      - hbx-engine-1
      - hbx-engine-2
      - hbx-engine-3
      - hbx-engine-4
      - hbx-engine-5
      - hbx-engine-6
      - hbx-engine-7
      - hbx-engine-8
      - hbx-engine-9
      - hbx-engine-10
      - hbx-engine-11
      - hbx-engine-12
      - hbx-engine-13
      - hbx-engine-14
      - hbx-engine-15
      - hbx-engine-16
      - hbx-engine-17
      - hbx-engine-18
      - hbx-engine-19
      - hbx-engine-20

    environment:
      HBX_SCRAPING_ENGINE_URL: http://hbx-scraping-engine:8001
      HBX_ENGINE_COUNT: ${HBX_ENGINE_COUNT:-20}
      HBX_ENGINE_MAX_COUNT: ${HBX_ENGINE_MAX_COUNT:-20}
      HBX_ENGINE_URLS: ${HBX_ENGINE_URLS:-http://hbx-engine-{n}:8001}
      HBX_CLIENT_RESERVED_ENGINES: ${HBX_CLIENT_RESERVED_ENGINES:-2}
      HBX_ENGINE_WARM_MIN: ${HBX_ENGINE_WARM_MIN:-1}
      HBX_ENGINE_WARM_MAX: ${HBX_ENGINE_WARM_MAX:-3}
      HBX_FACTORY_MIN_ENGINES: ${HBX_FACTORY_MIN_ENGINES:-1}
      HBX_FACTORY_MAX_ENGINES: ${HBX_FACTORY_MAX_ENGINES:-20}
      HBX_FACTORY_MEMORY_SOFT_PRESSURE_PERCENT: ${HBX_FACTORY_MEMORY_SOFT_PRESSURE_PERCENT:-82}
      HBX_FACTORY_MEMORY_HARD_PRESSURE_PERCENT: ${HBX_FACTORY_MEMORY_HARD_PRESSURE_PERCENT:-85}
      HBX_FACTORY_MEMORY_PANIC_PRESSURE_PERCENT: ${HBX_FACTORY_MEMORY_PANIC_PRESSURE_PERCENT:-88}
      HBX_ENGINE_GOVERNOR_ENABLED: ${HBX_ENGINE_GOVERNOR_ENABLED:-true}
      HBX_RADAR_CLIENT_PRIORITY_START_HOUR: ${HBX_RADAR_CLIENT_PRIORITY_START_HOUR:-8}
      HBX_RADAR_CLIENT_PRIORITY_END_HOUR: ${HBX_RADAR_CLIENT_PRIORITY_END_HOUR:-20}
      HBX_RADAR_CLIENT_REQUEST_TIMEOUT_MS: ${HBX_RADAR_CLIENT_REQUEST_TIMEOUT_MS:-25000}
      HBX_RADAR_CLIENT_FALLBACK_TO_POOL: ${HBX_RADAR_CLIENT_FALLBACK_TO_POOL:-true}
      HBX_RADAR_WHATSAPP_CHECK_MODE: ${HBX_RADAR_WHATSAPP_CHECK_MODE:-enrich}
      # Socket + CLI ligam o caminho "docker local" do governor de motores (hbx-engine-docker-adapter.service.ts):
      # na VPS não existe ops-control, então start/stop/restart de hbx-engine-1..20 passa a ir direto no socket.
      HBX_ENGINE_DOCKER_CLI_PATH: /usr/local/bin/docker
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend/public/uploads:/app/public/uploads
      # P1.3 (PR10072026 W4) — mídia PRIVADA do inbox vive em /app/storage/inbox; sem este
      # volume o filesystem do container é efêmero e todo anexo recebido entre dois publishes
      # some no recreate (perda irrecuperável de mídia de cliente).
      - ./backend/storage:/app/storage
      # COMEX (31/07) — Parquet analítico do comex-motor (gerado por export_parquet.py,
      # sobe por SFTP; NÃO vai no git). Read-only: o backend só lê. Sem o mount o
      # /comex responde "indisponível" e nada quebra (ComexDataService é fail-safe).
      - ./comex-motor/data/parquet:/comex-motor/data/parquet:ro
      # Socket do Docker do host montado — dá ao backend o mesmo caminho "docker local" do governor de motores.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - hbx_net

  webscraping:
    container_name: webscraping
    build:
      context: ./webscraping
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - hbx_net

  hbx-scraping-engine:
    container_name: hbx-scraping-engine
    build:
      context: ./hbx-scraping-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HBX_SCRAPING_USER_AGENT: ${HBX_SCRAPING_USER_AGENT:-HBX-Scraping/0.1 contato@hbxsystem.com.br}
      HBX_SCRAPING_TIMEOUT_SECONDS: ${HBX_SCRAPING_TIMEOUT_SECONDS:-10}
      HBX_SCRAPING_CONCURRENCY: ${HBX_SCRAPING_CONCURRENCY:-5}
      HBX_SCRAPING_CACHE_TTL_HOURS: ${HBX_SCRAPING_CACHE_TTL_HOURS:-24}
      HBX_SCRAPING_MAX_DISCOVERY_RESULTS: ${HBX_SCRAPING_MAX_DISCOVERY_RESULTS:-120}
      HBX_AGENDA_MAX_PAGES: ${HBX_AGENDA_MAX_PAGES:-20}
      HBX_AGENDA_REQUEST_DELAY_MS: ${HBX_AGENDA_REQUEST_DELAY_MS:-500}
    volumes:
      - ./hbx-scraping-engine/data:/app/data
    networks:
      - hbx_net

  hbx-engine-1:
    <<: *hbx-engine-common
    container_name: hbx-engine-1
    volumes:
      - ./hbx-scraping-engine/data-1:/app/data

  hbx-engine-2:
