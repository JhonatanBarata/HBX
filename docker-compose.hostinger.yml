x-hbx-engine-common: &hbx-engine-common
  build:
    context: ./hbx-scraping-engine
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    HBX_SCRAPING_USER_AGENT: ${HBX_SCRAPING_USER_AGENT:-HBX-Scraping/0.1 contato@hbxsystem.com.br}
    HBX_SCRAPING_TIMEOUT_SECONDS: ${HBX_SCRAPING_TIMEOUT_SECONDS:-20}
    HBX_SCRAPING_CONCURRENCY: ${HBX_SCRAPING_CONCURRENCY:-3}
    HBX_SCRAPING_CACHE_TTL_HOURS: ${HBX_SCRAPING_CACHE_TTL_HOURS:-24}
    HBX_SCRAPING_MAX_DISCOVERY_RESULTS: ${HBX_SCRAPING_MAX_DISCOVERY_RESULTS:-120}
    HBX_AGENDA_MAX_PAGES: ${HBX_AGENDA_MAX_PAGES:-20}
    HBX_AGENDA_REQUEST_DELAY_MS: ${HBX_AGENDA_REQUEST_DELAY_MS:-700}
  networks:
    - hbx_net
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()\""]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  backend:
    container_name: hbx-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - hbx-scraping-engine
      - hbx-engine-1
      - hbx-engine-2
      - hbx-engine-3
      - hbx-engine-4
      - hbx-engine-5
      - hbx-engine-6
      - hbx-engine-7
      - hbx-engine-8
      - hbx-engine-9
      - hbx-engine-10
      - hbx-engine-11
      - hbx-engine-12
      - hbx-engine-13
      - hbx-engine-14
      - hbx-engine-15
      - hbx-engine-16
      - hbx-engine-17
      - hbx-engine-18
      - hbx-engine-19
      - hbx-engine-20
    environment:
      HBX_SCRAPING_ENGINE_URL: http://hbx-scraping-engine:8001
      HBX_ENGINE_COUNT: ${HBX_ENGINE_COUNT:-20}
      HBX_ENGINE_MAX_COUNT: ${HBX_ENGINE_MAX_COUNT:-200}
      HBX_ENGINE_URLS: ${HBX_ENGINE_URLS:-http://hbx-engine-1:8001,http://hbx-engine-2:8001,http://hbx-engine-3:8001,http://hbx-engine-4:8001,http://hbx-engine-5:8001,http://hbx-engine-6:8001,http://hbx-engine-7:8001,http://hbx-engine-8:8001,http://hbx-engine-9:8001,http://hbx-engine-10:8001,http://hbx-engine-11:8001,http://hbx-engine-12:8001,http://hbx-engine-13:8001,http://hbx-engine-14:8001,http://hbx-engine-15:8001,http://hbx-engine-16:8001,http://hbx-engine-17:8001,http://hbx-engine-18:8001,http://hbx-engine-19:8001,http://hbx-engine-20:8001}
      HBX_CLIENT_RESERVED_ENGINES: ${HBX_CLIENT_RESERVED_ENGINES:-2}
      HBX_FACTORY_MIN_ENGINES: ${HBX_FACTORY_MIN_ENGINES:-1}
      HBX_FACTORY_MAX_ENGINES: ${HBX_FACTORY_MAX_ENGINES:-}
      HBX_RADAR_CLIENT_PRIORITY_START_HOUR: ${HBX_RADAR_CLIENT_PRIORITY_START_HOUR:-8}
      HBX_RADAR_CLIENT_PRIORITY_END_HOUR: ${HBX_RADAR_CLIENT_PRIORITY_END_HOUR:-20}
      HBX_RADAR_CLIENT_REQUEST_TIMEOUT_MS: ${HBX_RADAR_CLIENT_REQUEST_TIMEOUT_MS:-25000}
      HBX_RADAR_CLIENT_FALLBACK_TO_POOL: ${HBX_RADAR_CLIENT_FALLBACK_TO_POOL:-true}
    ports:
      - "3000:3000"
    volumes:
      - ./backend/public/uploads:/app/public/uploads
    networks:
      - hbx_net

  webscraping:
    container_name: webscraping
    build:
      context: ./webscraping
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - hbx_net

  hbx-scraping-engine:
    container_name: hbx-scraping-engine
    build:
      context: ./hbx-scraping-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HBX_SCRAPING_USER_AGENT: ${HBX_SCRAPING_USER_AGENT:-HBX-Scraping/0.1 contato@hbxsystem.com.br}
      HBX_SCRAPING_TIMEOUT_SECONDS: ${HBX_SCRAPING_TIMEOUT_SECONDS:-10}
      HBX_SCRAPING_CONCURRENCY: ${HBX_SCRAPING_CONCURRENCY:-5}
      HBX_SCRAPING_CACHE_TTL_HOURS: ${HBX_SCRAPING_CACHE_TTL_HOURS:-24}
      HBX_SCRAPING_MAX_DISCOVERY_RESULTS: ${HBX_SCRAPING_MAX_DISCOVERY_RESULTS:-120}
      HBX_AGENDA_MAX_PAGES: ${HBX_AGENDA_MAX_PAGES:-20}
      HBX_AGENDA_REQUEST_DELAY_MS: ${HBX_AGENDA_REQUEST_DELAY_MS:-500}
    volumes:
      - ./hbx-scraping-engine/data:/app/data
    networks:
      - hbx_net

  hbx-engine-1:
    <<: *hbx-engine-common
    container_name: hbx-engine-1
    volumes:
      - ./hbx-scraping-engine/data-1:/app/data

  hbx-engine-2:
    <<: *hbx-engine-common
    container_name: hbx-engine-2
    volumes:
      - ./hbx-scraping-engine/data-2:/app/data

  hbx-engine-3:
    <<: *hbx-engine-common
    container_name: hbx-engine-3
    volumes:
      - ./hbx-scraping-engine/data-3:/app/data

  hbx-engine-4:
    <<: *hbx-engine-common
    container_name: hbx-engine-4
    volumes:
      - ./hbx-scraping-engine/data-4:/app/data

  hbx-engine-5:
    <<: *hbx-engine-common
    container_name: hbx-engine-5
    volumes:
      - ./hbx-scraping-engine/data-5:/app/data

  hbx-engine-6:
    <<: *hbx-engine-common
    container_name: hbx-engine-6
    volumes:
      - ./hbx-scraping-engine/data-6:/app/data

  hbx-engine-7:
    <<: *hbx-engine-common
    container_name: hbx-engine-7
    volumes:
      - ./hbx-scraping-engine/data-7:/app/data

  hbx-engine-8:
    <<: *hbx-engine-common
    container_name: hbx-engine-8
    volumes:
      - ./hbx-scraping-engine/data-8:/app/data

  hbx-engine-9:
    <<: *hbx-engine-common
    container_name: hbx-engine-9
    volumes:
      - ./hbx-scraping-engine/data-9:/app/data

  hbx-engine-10:
    <<: *hbx-engine-common
    container_name: hbx-engine-10
    volumes:
      - ./hbx-scraping-engine/data-10:/app/data

  hbx-engine-11:
    <<: *hbx-engine-common
    container_name: hbx-engine-11
    volumes:
      - ./hbx-scraping-engine/data-11:/app/data

  hbx-engine-12:
    <<: *hbx-engine-common
    container_name: hbx-engine-12
    volumes:
      - ./hbx-scraping-engine/data-12:/app/data

  hbx-engine-13:
    <<: *hbx-engine-common
    container_name: hbx-engine-13
    volumes:
      - ./hbx-scraping-engine/data-13:/app/data

  hbx-engine-14:
    <<: *hbx-engine-common
    container_name: hbx-engine-14
    volumes:
      - ./hbx-scraping-engine/data-14:/app/data

  hbx-engine-15:
    <<: *hbx-engine-common
    container_name: hbx-engine-15
    volumes:
      - ./hbx-scraping-engine/data-15:/app/data

  hbx-engine-16:
    <<: *hbx-engine-common
    container_name: hbx-engine-16
    volumes:
      - ./hbx-scraping-engine/data-16:/app/data

  hbx-engine-17:
    <<: *hbx-engine-common
    container_name: hbx-engine-17
    volumes:
      - ./hbx-scraping-engine/data-17:/app/data

  hbx-engine-18:
    <<: *hbx-engine-common
    container_name: hbx-engine-18
    volumes:
      - ./hbx-scraping-engine/data-18:/app/data

  hbx-engine-19:
    <<: *hbx-engine-common
    container_name: hbx-engine-19
    volumes:
      - ./hbx-scraping-engine/data-19:/app/data

  hbx-engine-20:
    <<: *hbx-engine-common
    container_name: hbx-engine-20
    volumes:
      - ./hbx-scraping-engine/data-20:/app/data

  hbx-engine-watchdog:
    image: docker:27-cli
    container_name: hbx-engine-watchdog
    restart: unless-stopped
    environment:
      HBX_ENGINE_COUNT: ${HBX_ENGINE_COUNT:-20}
      HBX_WATCHDOG_INTERVAL_SECONDS: ${HBX_WATCHDOG_INTERVAL_SECONDS:-45}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - hbx_net
    command: >
      sh -c '
        while true; do
          for i in $$(seq 1 $${HBX_ENGINE_COUNT:-20}); do
            name="hbx-engine-$$i";
            status="$$(docker inspect -f "{{.State.Status}}" "$$name" 2>/dev/null || true)";
            health="$$(docker inspect -f "{{if .State.Health}}{{.State.Health.Status}}{{else}}no-health{{end}}" "$$name" 2>/dev/null || true)";
            if [ "$$status" != "running" ]; then
              echo "[hbx-watchdog] starting $$name status=$$status";
              docker start "$$name" >/dev/null 2>&1 || true;
            elif [ "$$health" = "unhealthy" ]; then
              echo "[hbx-watchdog] restarting $$name health=$$health";
              docker restart "$$name" >/dev/null 2>&1 || true;
            fi;
          done;
          sleep $${HBX_WATCHDOG_INTERVAL_SECONDS:-45};
        done
      '
    depends_on:
      - hbx-engine-1
      - hbx-engine-2
      - hbx-engine-3
      - hbx-engine-4
      - hbx-engine-5
      - hbx-engine-6
      - hbx-engine-7
      - hbx-engine-8
      - hbx-engine-9
      - hbx-engine-10
      - hbx-engine-11
      - hbx-engine-12
      - hbx-engine-13
      - hbx-engine-14
      - hbx-engine-15
      - hbx-engine-16
      - hbx-engine-17
      - hbx-engine-18
      - hbx-engine-19
      - hbx-engine-20

