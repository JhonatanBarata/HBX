<!DOCTYPE html>
<html><head><style>
:root { --casca-motion-dur: 220ms; --casca-motion-ease: ease; }
.casca-sheet-veil {
  position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: flex-end;
  background: rgba(0,0,0,0.4);
  animation: casca-veil-in var(--casca-motion-dur) var(--casca-motion-ease) both;
}
.casca-sheet-veil.is-leaving { animation: casca-veil-out var(--casca-motion-dur) var(--casca-motion-ease) both; }
@keyframes casca-veil-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes casca-veil-out { from { opacity: 1; } to { opacity: 0; } }
.casca-sheet {
  position: relative; min-height: 200px; background: white;
  animation: casca-sheet-in var(--casca-motion-dur) var(--casca-motion-ease) both;
  transform: translateY(var(--casca-drag, 0px));
}
.casca-sheet.is-leaving { animation: casca-sheet-out var(--casca-motion-dur) var(--casca-motion-ease) both; }
@keyframes casca-sheet-in { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes casca-sheet-out { from { transform: translateY(var(--casca-drag, 0px)); } to { transform: translateY(100%); } }
</style></head>
<body>
<div class="casca-sheet-veil" id="veil">
  <div class="casca-sheet" id="sheet">
    <button id="closeBtn">Fechar</button>
  </div>
</div>
<div id="log"></div>
<script>
const veil = document.getElementById('veil');
const sheet = document.getElementById('sheet');
const log = document.getElementById('log');
function addLog(t) { log.textContent += t + '\n'; console.log(t); }

veil.addEventListener('animationend', (e) => addLog('veil animationend: ' + e.animationName + ' target=' + (e.target===veil?'veil':'other')));
sheet.addEventListener('animationend', (e) => addLog('sheet animationend: ' + e.animationName + ' target=' + (e.target===sheet?'sheet':'other')));

document.getElementById('closeBtn').addEventListener('click', () => {
  addLog('CLIQUE NO FECHAR');
  veil.classList.add('is-leaving');
  sheet.classList.add('is-leaving');
});
</script>
</body></html>
