services:
  ops-control:
    build:
      context: ./ops-control
      dockerfile: Dockerfile
    container_name: hbx-ops-control
    restart: unless-stopped
    ports:
      - "127.0.0.1:3099:3099"
    environment:
      OPS_CONTROL_TOKEN: ${OPS_CONTROL_TOKEN}
      OPS_CONTROL_PORT: 3099
      OPS_CONTROL_TARGET: ${OPS_CONTROL_TARGET:-ssh}
      OPS_CONTROL_SSH_HOST: ${OPS_CONTROL_SSH_HOST}
      OPS_CONTROL_SSH_PORT: ${OPS_CONTROL_SSH_PORT:-22}
      OPS_CONTROL_SSH_USER: ${OPS_CONTROL_SSH_USER:-root}
      OPS_CONTROL_SSH_PASSWORD: ${OPS_CONTROL_SSH_PASSWORD}
      OPS_CONTROL_SSH_PRIVATE_KEY: ${OPS_CONTROL_SSH_PRIVATE_KEY:-}
      OPS_CONTROL_HOST_ROOT: ${OPS_CONTROL_HOST_ROOT:-/root/HBX}
