services:
  ops-control:
    build:
      context: ./ops-control
      dockerfile: Dockerfile
    container_name: hbx-ops-control
    restart: unless-stopped
    ports:
      - "127.0.0.1:3099:3099"
    environment:
      OPS_CONTROL_TOKEN: ${OPS_CONTROL_TOKEN}
      OPS_CONTROL_PORT: 3099
      OPS_CONTROL_TARGET: ${OPS_CONTROL_TARGET:-ssh}
      OPS_CONTROL_SSH_HOST: ${OPS_CONTROL_SSH_HOST}
      OPS_CONTROL_SSH_PORT: ${OPS_CONTROL_SSH_PORT:-22}
      OPS_CONTROL_SSH_USER: ${OPS_CONTROL_SSH_USER:-root}
      OPS_CONTROL_SSH_PASSWORD: ${OPS_CONTROL_SSH_PASSWORD}
      OPS_CONTROL_SSH_PRIVATE_KEY: ${OPS_CONTROL_SSH_PRIVATE_KEY:-}
      OPS_CONTROL_HOST_ROOT: ${OPS_CONTROL_HOST_ROOT:-/root/HBX}
      OPS_CONTROL_VPS_HOST_ROOT: ${OPS_CONTROL_VPS_HOST_ROOT:-/root/HBX}
      OPS_CONTROL_LOCAL_HOST_ROOT: ${OPS_CONTROL_LOCAL_HOST_ROOT:-/host/hbx}
      OPS_CONTROL_BACKEND_URL: ${OPS_CONTROL_BACKEND_URL:-}
      OPS_CONTROL_BACKEND_TOKEN: ${OPS_CONTROL_BACKEND_TOKEN:-}
      OPS_CONTROL_BACKEND_USERNAME: ${OPS_CONTROL_BACKEND_USERNAME:-}
      OPS_CONTROL_BACKEND_PASSWORD: ${OPS_CONTROL_BACKEND_PASSWORD:-}
      OPS_CONTROL_BACKEND_AUTO_SESSION: ${OPS_CONTROL_BACKEND_AUTO_SESSION:-}
      OPS_CONTROL_BACKEND_CONTAINER: ${OPS_CONTROL_BACKEND_CONTAINER:-}
      OPS_CONTROL_LOCAL_BACKEND_URL: ${OPS_CONTROL_LOCAL_BACKEND_URL:-}
      OPS_CONTROL_LOCAL_BACKEND_TOKEN: ${OPS_CONTROL_LOCAL_BACKEND_TOKEN:-}
      OPS_CONTROL_LOCAL_BACKEND_USERNAME: ${OPS_CONTROL_LOCAL_BACKEND_USERNAME:-}
      OPS_CONTROL_LOCAL_BACKEND_PASSWORD: ${OPS_CONTROL_LOCAL_BACKEND_PASSWORD:-}
      OPS_CONTROL_LOCAL_BACKEND_AUTO_SESSION: ${OPS_CONTROL_LOCAL_BACKEND_AUTO_SESSION:-}
      OPS_CONTROL_LOCAL_BACKEND_CONTAINER: ${OPS_CONTROL_LOCAL_BACKEND_CONTAINER:-backend}
      OPS_CONTROL_VPS_BACKEND_URL: ${OPS_CONTROL_VPS_BACKEND_URL:-}
      OPS_CONTROL_VPS_BACKEND_TOKEN: ${OPS_CONTROL_VPS_BACKEND_TOKEN:-}
      OPS_CONTROL_VPS_BACKEND_USERNAME: ${OPS_CONTROL_VPS_BACKEND_USERNAME:-}
      OPS_CONTROL_VPS_BACKEND_PASSWORD: ${OPS_CONTROL_VPS_BACKEND_PASSWORD:-}
      OPS_CONTROL_VPS_BACKEND_AUTO_SESSION: ${OPS_CONTROL_VPS_BACKEND_AUTO_SESSION:-}
      OPS_CONTROL_VPS_BACKEND_CONTAINER: ${OPS_CONTROL_VPS_BACKEND_CONTAINER:-hbx-backend}
      OPS_CONTROL_LOCAL_LAB_URL: ${OPS_CONTROL_LOCAL_LAB_URL:-}
      OPS_CONTROL_LOCAL_LAB_TOKEN: ${OPS_CONTROL_LOCAL_LAB_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/host/hbx:ro
    # Mesma rede do backend: o governor de motores chama o ops-control por nome (hbx-ops-control:3099).
    networks:
      - hbx_net

networks:
  hbx_net:
    external: true
