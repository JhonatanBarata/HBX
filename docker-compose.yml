x-hbx-engine-common: &hbx-engine-common
  build:
    context: ./hbx-scraping-engine
    dockerfile: Dockerfile
  restart: unless-stopped
  profiles: ["hbx-engines"]
  # Teto de RAM por motor — impede OOM global do host (exit 137 em massa).
  # Motor = Python/uvicorn + httpx + BeautifulSoup/lxml (scraper HTTP, SEM Chrome).
  # RSS típico ~150-350MB; 768m é ~2x o típico e acima do pico de lxml = folga real.
  # 20 motores × 768m = 15GB de teto somado, cabe nos ~20GB livres do host (~32GB total).
  # Um motor que vaze bate o PRÓPRIO teto e reinicia isolado, sem derrubar os 20 juntos.
  mem_limit: ${HBX_ENGINE_MEM_LIMIT:-768m}
  mem_reservation: ${HBX_ENGINE_MEM_RESERVATION:-256m}
  environment:
    HBX_SCRAPING_USER_AGENT: ${HBX_SCRAPING_USER_AGENT:-HBX-Scraping/0.1 contato@hbxsystem.com.br}
    HBX_SCRAPING_TIMEOUT_SECONDS: ${HBX_SCRAPING_TIMEOUT_SECONDS:-20}
    HBX_SCRAPING_CONCURRENCY: ${HBX_SCRAPING_CONCURRENCY:-3}
    HBX_SCRAPING_CACHE_TTL_HOURS: ${HBX_SCRAPING_CACHE_TTL_HOURS:-24}
    HBX_SCRAPING_MAX_DISCOVERY_RESULTS: ${HBX_SCRAPING_MAX_DISCOVERY_RESULTS:-120}
    HBX_AGENDA_MAX_PAGES: ${HBX_AGENDA_MAX_PAGES:-20}
    HBX_AGENDA_REQUEST_DELAY_MS: ${HBX_AGENDA_REQUEST_DELAY_MS:-700}
    HBX_BACKEND_INTERNAL_URL: ${HBX_BACKEND_INTERNAL_URL:-http://backend:3000}
    HBX_INTERNAL_API_TOKEN: ${HBX_INTERNAL_API_TOKEN:-dev-internal-token}
    HBX_WEB_SEARCH_MAX_RESULTS: ${HBX_WEB_SEARCH_MAX_RESULTS:-10}
    HBX_WEB_SEARCH_CACHE_TTL_HOURS: ${HBX_WEB_SEARCH_CACHE_TTL_HOURS:-72}
    HBX_WEB_SEARCH_TIMEOUT_SECONDS: ${HBX_WEB_SEARCH_TIMEOUT_SECONDS:-30}
    HBX_WEB_SEARCH_CONCURRENCY: ${HBX_WEB_SEARCH_CONCURRENCY:-1}
    HBX_GOOGLE_HTML_ENABLED: ${HBX_GOOGLE_HTML_ENABLED:-false}
    HBX_SEARXNG_URL: ${HBX_SEARXNG_URL:-http://searxng:8080}
    BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
  networks:
    - hbx_net

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: jhonatan_dev
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - hbx_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d jhonatan_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - hbx-scraping-engine
    environment:
      APP_PORT: "3000"
      DATABASE_URL: postgresql://admin:admin123@db:5432/jhonatan_dev
      DIRECT_URL: postgresql://admin:admin123@db:5432/jhonatan_dev
      NODE_ENV: development
      WHATSAPP_MODAL_INTERNAL_URL: http://host.docker.internal:8080
      HBX_SCRAPING_ENGINE_URL: http://hbx-scraping-engine:8001
      HBX_ENGINE_COUNT: ${HBX_ENGINE_COUNT:-1}
      HBX_ENGINE_MAX_COUNT: ${HBX_ENGINE_MAX_COUNT:-1}
      HBX_ENGINE_URLS: ${HBX_ENGINE_URLS:-http://hbx-scraping-engine:8001}
      HBX_LIST_ENGINE_COUNT: ${HBX_LIST_ENGINE_COUNT:-1}
      HBX_CLIENT_RESERVED_ENGINES: ${HBX_CLIENT_RESERVED_ENGINES:-2}
      HBX_FACTORY_MIN_ENGINES: ${HBX_FACTORY_MIN_ENGINES:-1}
      HBX_FACTORY_MAX_ENGINES: ${HBX_FACTORY_MAX_ENGINES:-1}
      HBX_FACTORY_MEMORY_SOFT_PRESSURE_PERCENT: ${HBX_FACTORY_MEMORY_SOFT_PRESSURE_PERCENT:-82}
      HBX_FACTORY_MEMORY_HARD_PRESSURE_PERCENT: ${HBX_FACTORY_MEMORY_HARD_PRESSURE_PERCENT:-85}
      HBX_FACTORY_MEMORY_PANIC_PRESSURE_PERCENT: ${HBX_FACTORY_MEMORY_PANIC_PRESSURE_PERCENT:-88}
      HBX_ENGINE_GOVERNOR_ENABLED: ${HBX_ENGINE_GOVERNOR_ENABLED:-false}
      HBX_ENGINE_GOVERNOR_INTERVAL_SECONDS: ${HBX_ENGINE_GOVERNOR_INTERVAL_SECONDS:-30}
      HBX_ENGINE_GOVERNOR_COOLDOWN_SECONDS: ${HBX_ENGINE_GOVERNOR_COOLDOWN_SECONDS:-120}
      HBX_ENGINE_DRAIN_TIMEOUT_SECONDS: ${HBX_ENGINE_DRAIN_TIMEOUT_SECONDS:-90}
      HBX_RADAR_CLIENT_PRIORITY_START_HOUR: ${HBX_RADAR_CLIENT_PRIORITY_START_HOUR:-8}
      HBX_RADAR_CLIENT_PRIORITY_END_HOUR: ${HBX_RADAR_CLIENT_PRIORITY_END_HOUR:-20}
      HBX_RADAR_CLIENT_REQUEST_TIMEOUT_MS: ${HBX_RADAR_CLIENT_REQUEST_TIMEOUT_MS:-25000}
      HBX_RADAR_CLIENT_FALLBACK_TO_POOL: ${HBX_RADAR_CLIENT_FALLBACK_TO_POOL:-true}
      HBX_INTERNAL_API_TOKEN: ${HBX_INTERNAL_API_TOKEN:-dev-internal-token}
      HBX_WEB_SEARCH_MAX_RESULTS: ${HBX_WEB_SEARCH_MAX_RESULTS:-10}
      HBX_WEB_SEARCH_TIMEOUT_SECONDS: ${HBX_WEB_SEARCH_TIMEOUT_SECONDS:-30}

      WEBSCRAPING_INTERNAL_URL: http://webscraping:8501
      WEBSCRAPING_URL: /hbx/webscraping

      WHATSAPP_HBX_RECOVERY_TEMPLATE_NAME: ${WHATSAPP_HBX_RECOVERY_TEMPLATE_NAME:-}
      WHATSAPP_HBX_RECOVERY_TEMPLATE_LANGUAGE: ${WHATSAPP_HBX_RECOVERY_TEMPLATE_LANGUAGE:-pt_BR}
      WHATSAPP_SUPPORT_TEMPLATE_NAME: ${WHATSAPP_SUPPORT_TEMPLATE_NAME:-}
      WHATSAPP_SUPPORT_TEMPLATE_LANGUAGE: ${WHATSAPP_SUPPORT_TEMPLATE_LANGUAGE:-pt_BR}
      WHATSAPP_FOLLOWUP_TEMPLATE_NAME: ${WHATSAPP_FOLLOWUP_TEMPLATE_NAME:-}
      WHATSAPP_FOLLOWUP_TEMPLATE_LANGUAGE: ${WHATSAPP_FOLLOWUP_TEMPLATE_LANGUAGE:-pt_BR}
      WHATSAPP_WEBSCRAPING_TEMPLATE_NAME: ${WHATSAPP_WEBSCRAPING_TEMPLATE_NAME:-}
      WHATSAPP_WEBSCRAPING_TEMPLATE_LANGUAGE: ${WHATSAPP_WEBSCRAPING_TEMPLATE_LANGUAGE:-pt_BR}

    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app:cached
      - ./backend/prisma:/app/prisma:cached
      - backend_node_modules:/app/node_modules
    networks:
      - hbx_net
    command: sh -lc "npm run prisma:generate && npx prisma migrate deploy --schema=./prisma/schema.prisma && npm run start:dev"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  webscraping:
    build:
      context: ./webscraping
      dockerfile: Dockerfile
    container_name: webscraping
    restart: unless-stopped
    environment:
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      MOCK_MODE: ${WEBSCRAPING_MOCK_MODE:-0}
    volumes:
      - ./webscraping:/app:cached
    networks:
      - hbx_net

  hbx-scraping-engine:
    build:
      context: ./hbx-scraping-engine
      dockerfile: Dockerfile
    container_name: hbx-scraping-engine
    restart: unless-stopped
    environment:
      HBX_SCRAPING_USER_AGENT: ${HBX_SCRAPING_USER_AGENT:-HBX-Scraping/0.1 contato@hbxsystem.com.br}
      HBX_SCRAPING_TIMEOUT_SECONDS: ${HBX_SCRAPING_TIMEOUT_SECONDS:-10}
      HBX_SCRAPING_CONCURRENCY: ${HBX_SCRAPING_CONCURRENCY:-5}
      HBX_SCRAPING_CACHE_TTL_HOURS: ${HBX_SCRAPING_CACHE_TTL_HOURS:-24}
      HBX_SCRAPING_MAX_DISCOVERY_RESULTS: ${HBX_SCRAPING_MAX_DISCOVERY_RESULTS:-120}
      HBX_AGENDA_MAX_PAGES: ${HBX_AGENDA_MAX_PAGES:-20}
      HBX_AGENDA_REQUEST_DELAY_MS: ${HBX_AGENDA_REQUEST_DELAY_MS:-500}
      HBX_BACKEND_INTERNAL_URL: ${HBX_BACKEND_INTERNAL_URL:-http://backend:3000}
      HBX_INTERNAL_API_TOKEN: ${HBX_INTERNAL_API_TOKEN:-dev-internal-token}
      HBX_WEB_SEARCH_MAX_RESULTS: ${HBX_WEB_SEARCH_MAX_RESULTS:-10}
      HBX_WEB_SEARCH_CACHE_TTL_HOURS: ${HBX_WEB_SEARCH_CACHE_TTL_HOURS:-72}
      HBX_WEB_SEARCH_TIMEOUT_SECONDS: ${HBX_WEB_SEARCH_TIMEOUT_SECONDS:-30}
      HBX_WEB_SEARCH_CONCURRENCY: ${HBX_WEB_SEARCH_CONCURRENCY:-1}
      HBX_GOOGLE_HTML_ENABLED: ${HBX_GOOGLE_HTML_ENABLED:-false}
      HBX_SEARXNG_URL: ${HBX_SEARXNG_URL:-http://searxng:8080}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
    ports:
      - "8001:8001"
    volumes:
      - ./hbx-scraping-engine/data:/app/data
    networks:
      - hbx_net

  hbx-engine-1:
