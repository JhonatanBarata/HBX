x-hbx-engine-common: &hbx-engine-common
  build:
    context: ./hbx-scraping-engine
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    HBX_SCRAPING_USER_AGENT: ${HBX_SCRAPING_USER_AGENT:-HBX-Scraping/0.1 contato@hbxsystem.com.br}
    HBX_SCRAPING_TIMEOUT_SECONDS: ${HBX_SCRAPING_TIMEOUT_SECONDS:-20}
    HBX_SCRAPING_CONCURRENCY: ${HBX_SCRAPING_CONCURRENCY:-3}
    HBX_SCRAPING_CACHE_TTL_HOURS: ${HBX_SCRAPING_CACHE_TTL_HOURS:-24}
    HBX_SCRAPING_MAX_DISCOVERY_RESULTS: ${HBX_SCRAPING_MAX_DISCOVERY_RESULTS:-120}
    HBX_AGENDA_MAX_PAGES: ${HBX_AGENDA_MAX_PAGES:-20}
    HBX_AGENDA_REQUEST_DELAY_MS: ${HBX_AGENDA_REQUEST_DELAY_MS:-700}
  networks:
    - hbx_net

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: jhonatan_dev
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - hbx_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - hbx-scraping-engine
      - hbx-engine-1
      - hbx-engine-2
      - hbx-engine-3
      - hbx-engine-4
      - hbx-engine-5
      - hbx-engine-6
      - hbx-engine-7
      - hbx-engine-8
      - hbx-engine-9
      - hbx-engine-10
      - hbx-engine-11
      - hbx-engine-12
      - hbx-engine-13
      - hbx-engine-14
      - hbx-engine-15
      - hbx-engine-16
      - hbx-engine-17
      - hbx-engine-18
      - hbx-engine-19
      - hbx-engine-20
    environment:
      APP_PORT: "3000"
      DATABASE_URL: postgresql://admin:admin123@db:5432/jhonatan_dev
      DIRECT_URL: postgresql://admin:admin123@db:5432/jhonatan_dev
      NODE_ENV: development
      HBX_SCRAPING_ENGINE_URL: http://hbx-scraping-engine:8001
      HBX_ENGINE_COUNT: ${HBX_ENGINE_COUNT:-4}
      HBX_ENGINE_URLS: ${HBX_ENGINE_URLS:-http://hbx-engine-1:8001,http://hbx-engine-2:8001,http://hbx-engine-3:8001,http://hbx-engine-4:8001,http://hbx-engine-5:8001,http://hbx-engine-6:8001,http://hbx-engine-7:8001,http://hbx-engine-8:8001,http://hbx-engine-9:8001,http://hbx-engine-10:8001,http://hbx-engine-11:8001,http://hbx-engine-12:8001,http://hbx-engine-13:8001,http://hbx-engine-14:8001,http://hbx-engine-15:8001,http://hbx-engine-16:8001,http://hbx-engine-17:8001,http://hbx-engine-18:8001,http://hbx-engine-19:8001,http://hbx-engine-20:8001}

      WEBSCRAPING_INTERNAL_URL: http://webscraping:8501
      WEBSCRAPING_URL: /hbx/webscraping

      WHATSAPP_HBX_RECOVERY_TEMPLATE_NAME: ${WHATSAPP_HBX_RECOVERY_TEMPLATE_NAME:-}
      WHATSAPP_HBX_RECOVERY_TEMPLATE_LANGUAGE: ${WHATSAPP_HBX_RECOVERY_TEMPLATE_LANGUAGE:-pt_BR}
      WHATSAPP_SUPPORT_TEMPLATE_NAME: ${WHATSAPP_SUPPORT_TEMPLATE_NAME:-}
      WHATSAPP_SUPPORT_TEMPLATE_LANGUAGE: ${WHATSAPP_SUPPORT_TEMPLATE_LANGUAGE:-pt_BR}
      WHATSAPP_FOLLOWUP_TEMPLATE_NAME: ${WHATSAPP_FOLLOWUP_TEMPLATE_NAME:-}
      WHATSAPP_FOLLOWUP_TEMPLATE_LANGUAGE: ${WHATSAPP_FOLLOWUP_TEMPLATE_LANGUAGE:-pt_BR}
      WHATSAPP_WEBSCRAPING_TEMPLATE_NAME: ${WHATSAPP_WEBSCRAPING_TEMPLATE_NAME:-}
      WHATSAPP_WEBSCRAPING_TEMPLATE_LANGUAGE: ${WHATSAPP_WEBSCRAPING_TEMPLATE_LANGUAGE:-pt_BR}

    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app:cached
      - ./backend/prisma:/app/prisma:cached
      - backend_node_modules:/app/node_modules
    networks:
      - hbx_net
    command: sh -lc "npm run prisma:generate && npx prisma migrate deploy --schema=./prisma/schema.prisma && npm run start:dev"

  webscraping:
    build:
      context: ./webscraping
      dockerfile: Dockerfile
    container_name: webscraping
    restart: unless-stopped
    environment:
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      MOCK_MODE: ${WEBSCRAPING_MOCK_MODE:-0}
    volumes:
      - ./webscraping:/app:cached
    networks:
      - hbx_net

  hbx-scraping-engine:
    build:
      context: ./hbx-scraping-engine
      dockerfile: Dockerfile
    container_name: hbx-scraping-engine
    restart: unless-stopped
    environment:
      HBX_SCRAPING_USER_AGENT: ${HBX_SCRAPING_USER_AGENT:-HBX-Scraping/0.1 contato@hbxsystem.com.br}
      HBX_SCRAPING_TIMEOUT_SECONDS: ${HBX_SCRAPING_TIMEOUT_SECONDS:-10}
      HBX_SCRAPING_CONCURRENCY: ${HBX_SCRAPING_CONCURRENCY:-5}
      HBX_SCRAPING_CACHE_TTL_HOURS: ${HBX_SCRAPING_CACHE_TTL_HOURS:-24}
      HBX_SCRAPING_MAX_DISCOVERY_RESULTS: ${HBX_SCRAPING_MAX_DISCOVERY_RESULTS:-120}
      HBX_AGENDA_MAX_PAGES: ${HBX_AGENDA_MAX_PAGES:-20}
      HBX_AGENDA_REQUEST_DELAY_MS: ${HBX_AGENDA_REQUEST_DELAY_MS:-500}
    ports:
      - "8001:8001"
    volumes:
      - ./hbx-scraping-engine/data:/app/data
    networks:
      - hbx_net

  hbx-engine-1:
    <<: *hbx-engine-common
    container_name: hbx-engine-1
    volumes:
      - ./hbx-scraping-engine/data-1:/app/data

  hbx-engine-2:
