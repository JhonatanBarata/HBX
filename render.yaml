services:
  - type: web
    name: hbx-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: WEBSCRAPING_UPSTREAM_URL
        sync: false
      - key: WEBSCRAPING_INTERNAL_URL
        fromService:
          name: hbx-webscraping
          type: web
          property: hostport
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WEBSCRAPING_URL
        value: /hbx/webscraping
      - key: BOOTSTRAP_SYSTEM_MASTER
        value: "false"
      - key: NODE_ENV
        value: production
  - type: web
    name: hbx-webscraping
    runtime: docker
    rootDir: webscraping
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: MOCK_MODE
        value: "0"
