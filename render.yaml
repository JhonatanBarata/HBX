services:
  - type: web
    name: hbx-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: BOOTSTRAP_SYSTEM_MASTER
        value: "false"
      - key: NODE_ENV
        value: production
