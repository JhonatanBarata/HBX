services:
  - type: web
    name: hbx-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: WEBSCRAPING_UPSTREAM_URL
        sync: false
      - key: WEBSCRAPING_INTERNAL_URL
        fromService:
          name: hbx-webscraping
          type: web
          property: hostport
      - key: JWT_SECRET
        generateValue: true
      - key: INTEGRATION_SECRET_KEY
        generateValue: true
      - key: INTERNAL_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SYSTEM_MASTER_PASSWORD
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_MODAL_ENABLED
        value: "true"
      - key: WHATSAPP_MODAL_INTERNAL_URL
        value: http://187.127.249.180:8080
      - key: WHATSAPP_MODAL_API_KEY
        sync: false
      - key: WHATSAPP_MODAL_TIMEOUT_MS
        value: "15000"
      - key: WEBSCRAPING_URL
        value: /hbx/webscraping
      - key: BOOTSTRAP_SYSTEM_MASTER
        value: "false"
      - key: NODE_ENV
        value: production
  - type: web
    name: hbx-webscraping
    runtime: docker
    dockerfilePath: webscraping/Dockerfile
    dockerContext: webscraping
    plan: starter
    envVars:
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: MOCK_MODE
        value: "0"
