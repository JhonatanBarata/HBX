<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, initial-scale=1" />
  <title>UniTV Bridge</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <div id="player"></div>
  <video id="html-player" autoplay playsinline></video>

  <main id="overlay">
    <section class="card">
      <div class="eyebrow">JHONATAN · BU8000</div>
      <h1>UniTV Bridge</h1>
      <p id="message">Procurando o bridge no computador…</p>
      <div class="status-row">
        <span id="status-dot" class="dot"></span>
        <span id="status">conectando</span>
      </div>
      <div class="help">
        <span><b>OK</b> reproduzir</span>
        <span><b>Vermelho</b> gerar teste</span>
        <span><b>Verde</b> parar</span>
        <span><b>Voltar</b> sair</span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
